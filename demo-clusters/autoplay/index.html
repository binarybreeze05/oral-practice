<style>
:root { color-scheme: dark; }
html, body { margin: 0; padding: 0; background: #1a1a1a; color: #d6d6d6; }

.hdr { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: #888; margin-bottom: 8px; border-bottom: 1px solid #2e2e2e; padding-bottom: 4px; }

/* --- study_or sentence cards --- */
.thead{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:baseline;font-size:11px;margin:1px 0 10px;padding-bottom:6px;border-bottom:1px solid #2e2e2e}
.thead .clab{font-weight:650;color:#cdd6e0}
.thead .cfreq{color:#7a8896}

.sline .en{font-size:14.5px;line-height:1.6;color:#e4e4e4}
.sline .frx{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.62;color:#ececec}
.sline .m{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px 9px;font-size:11px;font-variant-numeric:tabular-nums;align-items:center}

/* Colours mirror the editor page exactly: wrong = red (FIXED),
   idiomatic = amber (PARISIAN). */
.k{font-weight:700;border-radius:4px;padding:1px 6px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.k.wrong{background:#3a1416;color:#f87171}
.k.idiomatic{background:#33240a;color:#fbbf24}
/* Scope filter.  "fix" = cards whose sentence carried a red span (wrong
   French); "polish" = the idiomatic-only cards (Parisian rewrites).  Progress
   is keyed on the card id and shared across scopes AND across every study
   deck, so a card drilled anywhere stays drilled everywhere; only the
   rotation order and the round counter are per-deck-per-scope. */
.scope{font-size:11px;color:#6b7683;letter-spacing:.02em}
.scope a{color:#6b7683;text-decoration:none;padding:1px 5px;border-radius:3px;border:1px solid transparent}
.scope a:hover{color:#c9d1d9;border-color:#3a3a3a}
.scope a.on{color:#e6e6e6;background:#2c2c2c;border-color:#454545;font-weight:600}
.scope .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:3px}
/* "You said" — the raw sentence on the back.  Deliberately quieter than the
   answer above it: smaller, dimmer, italic, and behind a red rule, so a
   glance can never mistake it for the thing to produce. */
.saidblock{margin-top:11px;padding:6px 0 0 9px;border-left:2px solid rgba(248,113,113,.35);font-size:12px;line-height:1.55}
.saidblock .wl{color:#6b7683;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px;display:block;margin-bottom:2px}
.saidblock .said{margin:0;color:#8b8b8b;font-style:italic}

/* --- ns decks: grouped cards, dynamic timer --- */
.hdr .home{color:#666;text-decoration:none;margin-right:10px;font-size:11px;border:1px solid #333;border-radius:3px;padding:1px 6px}
.hdr .home:hover{color:#bbb;border-color:#555}
.face .grp{list-style:none;margin:6px 0 0;padding:0;counter-reset:it}
.face .grp li{position:relative;padding:7px 0 7px 26px;border-top:1px solid #262626;counter-increment:it}
.face .grp li:first-child{border-top:none}
.face .grp li::before{content:counter(it);position:absolute;left:0;top:8px;width:18px;height:18px;border-radius:9px;background:#2a2a2a;color:#8a8a8a;font-size:10px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.face .grp.fr li::before{background:#2b2620;color:#b9a77e}
.face .grp .en{font-size:14.5px;line-height:1.6;color:#e4e4e4}
.face .grp .frx{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.62;color:#ececec}
.face .grp .tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:10.5px;line-height:1.4}
.face .grp .tags .st{color:#8fb3b6}.face .grp .tags .st b{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:#b9a77e;margin-right:3px}
.face .grp .tags .gr{color:#6f7780;font-style:italic}
.face .grp .rid{display:block;margin-top:2px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#666}
.face .glabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#7fa6a9;margin:2px 0 2px}
.face .big{font-size:22px;font-weight:700;color:#f0f0f0;letter-spacing:-.01em;margin-top:6px}
.face .need{font-style:italic;color:#a9b1bb;font-size:14px;margin-top:4px}
.face .ask{color:#7a8896;font-size:12.5px;margin-top:12px}
.face .canon{font-size:17px;font-weight:600;line-height:1.45;color:#f2f2f2;margin-top:4px}
.face .where{margin-top:12px;font-size:12.5px;color:#a9b1bb}.face .where b{color:#e0e0e0}
.face .where .wl,.face .wl{display:block;color:#5b6772;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;font-weight:600;margin-bottom:2px}
.face .grp.subs li{display:flex;justify-content:space-between;gap:12px}
.face .grp.subs .sub{color:#e4e4e4;font-size:14px}.face .grp.subs .cnt{color:#7a8896;font-size:12px;white-space:nowrap}
.face .also{color:#6f7780;font-size:11.5px;margin-top:10px;font-style:italic}
.face .one{margin-top:8px}
.face .one .en{font-size:17px;line-height:1.6;color:#e4e4e4}
.face .one .frx{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.6;color:#ececec}
.face .one .rid{display:block;margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#666}
.face .one .tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:10.5px;line-height:1.4}
.face .one .tags .st{color:#8fb3b6}.face .one .tags .st b{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:#b9a77e;margin-right:3px}
.face .one .tags .gr{color:#6f7780;font-style:italic}
.face mark{background:#2c4f52;color:#fff;border-radius:3px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.face .one.fr mark{background:#4a3f2a}
.face .dim{color:#6c6c6c}

.hdr .edt{color:#555;cursor:pointer;user-select:none}.hdr .edt:hover{color:#aaa}
.face [contenteditable=true]{outline:1px dashed #4a6b6e;outline-offset:4px;border-radius:2px;caret-color:#7fa6a9}

/* ns decks: a card you've answered before tints the whole page, so new vs review is clear before you read anything */
html, body { transition: background-color .25s ease; }
html.seen, html.seen body { background: #14212b; }
html.seen .hdr { border-bottom-color: #2b4352; }
.seen-pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: #9fd0f0; background: #1e3646; border: 1px solid #36607a; border-radius: 999px; padding: 1px 9px; margin-bottom: 7px; }

/* --- TCF prompt decks: deck header, two-line front, element line --- */
.dh{margin:0 0 12px;padding:7px 10px;border:1px solid #2e2e2e;border-radius:6px;background:#1e1e1e;font-size:12.5px}
.dh>summary{cursor:pointer;color:#bcbcbc;font-weight:600;font-size:11.5px;line-height:1.7}

.dh .en{color:#8f8f8f;font-size:12px;line-height:1.5;margin-top:3px}

.dh ul{margin:4px 0 0;padding-left:18px}
.dh li{margin:5px 0}

.dh .stubn{background:#E07A6A;color:#1a1a1a;font-weight:700;padding:3px 8px;border-radius:4px;margin-top:6px}

.dh .fr,.dh .en{white-space:pre-line}
.dh .pl{margin-top:6px;font-size:11.5px}
.dh .pl .fq{color:#57B5B0}

function pick(now) {
  var best = -1, bd = Infinity, i, s;
  for (i = 0; i < items.length; i++) { s = S(items[i]); if (s[0] > 0 && s[0] < 3 && s[1] <= now && s[1] < bd) { bd = s[1]; best = i; } }
  if (best >= 0) return best;
  for (i = 0; i < items.length; i++) if (S(items[i])[0] === 0) return i;
  return -1;
}
function nextDue() { var m = Infinity; items.forEach(function (it) { var s = S(it); if (s[0] > 0 && s[0] < 3 && s[1] < m) m = s[1]; }); return m; }
function status() { var done = 0; items.forEach(function (it) { if (S(it)[0] >= 3) done++; }); stat.textContent = done + " of " + items.length + " done"; }
var ORD = ["1st", "2nd", "3rd"];
function show(i) {
  cur = i; var it = items[i];
  where.textContent = label(it.c) + " · " + ORD[S(it)[0]] + " time";
  app.innerHTML = '<div class="card"><div class="face"><div class="fs">' + it.f + "</div></div></div>";
  start("front", it.t);
}
function start(p, sec) { phase = p; step++; len = sec * 1000; left = len; end = Date.now() + left; tick(); }
function flip() {
  app.querySelector(".face").insertAdjacentHTML("beforeend", '<hr><div class="bs">' + items[cur].b + "</div>");
  start("back", items[cur].t);
}
function finish() {
  var it = items[cur], s = S(it)[0] + 1;
  st[it.id] = [s, s < 3 ? Date.now() + GAP[s - 1] : 0]; setJ(SK, st);
  cur = -1; next();
}
function next() {
  var now = Date.now(), i = pick(now);
  status();
  if (i >= 0) return show(i);
  step++;
  if (nextDue() === Infinity) {   // every card shown three times: the cluster is finished
    phase = "done"; document.documentElement.className = "";
    try { localStorage.removeItem(SK); } catch (e) {}
    var d = new Date(); finished[C.did] = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    setJ(KEY + "::done", finished);
    history.replaceState(null, "", location.pathname + location.search);
    return list("Done: " + esc(label(C)) + ", " + items.length + " cards.");
  }
  phase = "wait"; bar.style.width = "0";
  where.textContent = label(C);
  app.innerHTML = '<div class="empty">Next card in <b id="wt"></b></div>';
  tick();
}
function tick() {
  if (paused) return;
  var now = Date.now();
  if (phase === "front" || phase === "back") {
    left = end - now;
    bar.style.width = Math.max(0, Math.min(100, 100 * left / len)) + "%";
    if (left <= 0) { if (phase === "front") flip(); else finish(); }
  } else if (phase === "wait") {
    var nd = nextDue(), w = document.getElementById("wt");
    if (nd <= now || pick(now) >= 0) return next();
    if (w) { var sec = Math.ceil((nd - now) / 1000); w.textContent = Math.floor(sec / 60) + ":" + ("0" + sec % 60).slice(-2); }
  }
}
function setPaused() {
  var p = manual || document.hidden;
  note.hidden = !manual;
  if (p === paused) return;
  paused = p;
  if (paused) { left = end - Date.now(); } else { end = Date.now() + left; tick(); }
}
document.addEventListener("visibilitychange", setPaused);
document.addEventListener("keydown", function (e) {
  if (e.code === "Space" && !e.altKey && !e.ctrlKey && !e.metaKey && phase !== "done") { e.preventDefault(); manual = !manual; setPaused(); }
});
// Taps (Min, 2026-11-18): one tap moves on (front -> back, back -> next card), a double tap pauses; any tap goes on
// again. A single tap waits DBL ms to see whether a second one follows, and does nothing if the card moved on by
// itself meanwhile. Fingers and the mouse alike; a scroll or a long press is not a tap; the header links stay links.
var DBL = 300, tapT = 0, tapAt = 0, pid = null, px = 0, py = 0, pt = 0;
function tapped() {
  if (phase === "done") return;
  var now = Date.now();
  if (tapT && now - tapAt < DBL) { clearTimeout(tapT); tapT = 0; manual = !manual; setPaused(); return; }
  tapAt = now; var s0 = step;
  tapT = setTimeout(function () {
    tapT = 0;
    if (manual) { manual = false; setPaused(); return; }
    if (paused || step !== s0) return;
    if (phase === "front") flip(); else if (phase === "back") finish();
  }, DBL);
}
document.addEventListener("pointerdown", function (e) {
  pid = null;
  if (!e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
  if (e.target.closest && e.target.closest("a, .hdr")) return;
  pid = e.pointerId; px = e.clientX; py = e.clientY; pt = Date.now();
});
document.addEventListener("pointerup", function (e) {
  if (pid === null || e.pointerId !== pid) return;
  pid = null;
  if (Math.abs(e.clientX - px) > 12 || Math.abs(e.clientY - py) > 12 || Date.now() - pt > 700) return;
  tapped();
});
document.addEventListener("pointercancel", function () { pid = null; });
setInterval(tick, 100);
setPaused(); next();
})();
</script>
