lein d'artistes à l'affiche, du 10 au 13 septembre."}, {"id": "B:BP0611", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span>Well then, it was an ad for a post of photo reporter for the magazine of the city.", "b": "Eh ben, c'était une annonce pour un poste de reporter photo pour le magazine de la ville."}, {"id": "B:BP0788", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span><mark>In fact, it's for a garage sale in your neighbourhood<\/mark><span class=\"dim\">, and it's the town hall that organises it.<\/span>", "b": "<mark>En fait, c'est pour un vide-grenier dans ton quartier<\/mark><span class=\"dim\">, et c'est la mairie qui l'organise.<\/span>"}, {"id": "B:BP0084", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><mark>Roughly, they're looking for people to take care of houses while the owners are not there<\/mark><span class=\"dim\"> — things like keeping the house in order, watching it, and sometimes taking care of the animals, all that.<\/span>", "b": "<mark>En gros, ils cherchent des gens pour s'occuper de maisons pendant que les proprios sont pas là<\/mark><span class=\"dim\"> — des trucs comme garder la maison en ordre, la surveiller, et des fois s'occuper des animaux, tout ça.<\/span>"}, {"id": "B:BP0059", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><mark>Roughly, they're looking for dancers for a good cause<\/mark><span class=\"dim\">, and it happens at the community centre Kent Nagano.<\/span>", "b": "<mark>En gros, ils cherchent des danseurs pour une bonne cause<\/mark><span class=\"dim\">, et ça se passe au centre communautaire Kent Nagano.<\/span>"}, {"id": "B:BP0081", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><mark>It's an ad where they're looking for people to keep houses in another region<\/mark><span class=\"dim\">, and honestly, I find that it could be a real occasion for you to discover another mode of life for a time.<\/span>", "b": "<mark>C'est une annonce où ils cherchent des gens pour garder des maisons dans une autre région<\/mark><span class=\"dim\">, et honnêtement, je trouve que ça pourrait être une vraie occasion pour toi de découvrir un autre mode de vie pendant un temps.<\/span>"}, {"id": "B:BP0305", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><span class=\"dim\">They're organising an end-of-year party, and <\/span><mark>they're looking for volunteer parents to give a hand — take care of the games, hold stands, this kind of stuff.<\/mark>", "b": "<span class=\"dim\">Ils organisent une fête de fin d'année, et <\/span><mark>ils cherchent des parents bénévoles pour donner un coup de main — s'occuper des jeux, tenir des stands, ce genre de trucs.<\/mark>"}, {"id": "B:BP0363", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span>Roughly, they're looking for volunteers to give a hand in an animal refuge: take care of the animals, keep them company, groom them, clean the boxes, this kind of stuff.", "b": "En gros, ils cherchent des bénévoles pour filer un coup de main dans un refuge pour animaux : s'occuper des animaux, leur tenir compagnie, les toiletter, nettoyer les boxes, ce genre de trucs."}, {"id": "B:BP0422", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Roughly, it's an associative garage where you can work yourself on your car.", "b": "En gros, c'est un garage associatif où tu peux bosser toi-même sur ta voiture."}, {"id": "B:BP0188", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span><span class=\"dim\">Roughly, <\/span><mark>it's a charitable event by bike, where we would collect money for an environmental cause<\/mark><span class=\"dim\">, and the challenge, it's 130 kilometres per day during two days.<\/span>", "b": "<span class=\"dim\">En gros, <\/span><mark>c'est un événement caritatif à vélo, où on récolterait de l'argent pour une cause environnementale<\/mark><span class=\"dim\">, et le défi, c'est 130 kilomètres par jour pendant deux jours.<\/span>"}, {"id": "B:BP0273", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Roughly, it's a platform where people can exchange services and helping hands with each other.", "b": "En gros, c'est une plateforme où les gens peuvent s'échanger des services et des coups de main."}, {"id": "B:BP0304", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span><mark>They're organising an end-of-year party<\/mark><span class=\"dim\">, and they're looking for volunteer parents to give a hand — take care of the games, hold stands, this kind of stuff.<\/span>", "b": "<mark>Ils organisent une fête de fin d'année<\/mark><span class=\"dim\">, et ils cherchent des parents bénévoles pour donner un coup de main — s'occuper des jeux, tenir des stands, ce genre de trucs.<\/span>"}, {"id": "B:BP0679", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Roughly, it's an experience where you can pass the night in the middle of the wolves.", "b": "En gros, c'est une expérience où tu peux passer la nuit au milieu des loups."}, {"id": "B:BP0729", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Roughly, it's a digital detox stay where you disconnect yourself from your phone, from your computer and from all your other digital devices.", "b": "En gros, c'est un séjour de détox numérique où tu te déconnectes de ton téléphone, de ton ordi et de tous tes autres appareils numériques."}, {"id": "B:BP0753", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>And in fact, it's parachute jumping.", "b": "Et en fait, c'est du saut en parachute."}, {"id": "B:BP0891", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Roughly, it's a kind of volunteer stay where you help to restore historic monuments.", "b": "En gros, c'est un genre de séjour bénévole où tu aides à restaurer des monuments historiques."}, {"id": "B:BP1160", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Roughly, it's a sort of cultural exchange: you can sign up as a host to invite to your place travellers from the four corners of the world, cook with them and make them discover dishes from your country.", "b": "En gros, c'est une sorte d'échange culturel : tu peux t'inscrire comme hôte pour inviter chez toi des voyageurs des quatre coins du monde, cuisiner avec eux et leur faire découvrir des plats de ton pays."}, {"id": "B:BP0924", "bid": "BCY015", "f": "<span class=\"glabel\" style=\"display:block\">It's an alternative to the usual way of doing it.<\/span>Roughly, it's an alternative to the classic library to borrow books.", "b": "En gros, c'est une alternative à la bibliothèque classique pour emprunter des livres."}, {"id": "B:BP0976", "bid": "BCY016", "f": "<span class=\"glabel\" style=\"display:block\">It's like this familiar thing.<\/span><mark>It's a bit like Craigslist or Facebook Marketplace<\/mark><span class=\"dim\">, but that one in particular, maybe because it's new, the deals that I saw there, they're incredible, I find.<\/span>", "b": "<mark>C'est un peu comme Craigslist ou Facebook Marketplace<\/mark><span class=\"dim\">, mais celui-là en particulier, peut-être parce que c'est nouveau, les affaires que j'y ai vues, elles sont incroyables, je trouve.<\/span>"}, {"id": "B:BP0464", "bid": "BCY017", "f": "<span class=\"glabel\" style=\"display:block\">The ad suggests this as a way to deal with stress.<\/span><span class=\"dim\">The ad, it comes from a sort of association or a refuge — I don't really know what it is exactly — but <\/span><mark>roughly, they encourage people to adopt cats to help them de-stress.<\/mark>", "b": "<span class=\"dim\">La pub, elle vient d'une espèce d'association ou d'un refuge — je sais pas trop ce que c'est exactement — mais <\/span><mark>en gros, ils encouragent les gens à adopter des chats pour les aider à déstresser.<\/mark>"}, {"id": "B:BP0460", "bid": "BCY017", "f": "<span class=\"glabel\" style=\"display:block\">The ad suggests this as a way to deal with stress.<\/span>It proposed a completely different way of managing stress: taking a cat.", "b": "Elle proposait une façon complètement différente de gérer le stress : prendre un chat."}, {"id": "B:BP0511", "bid": "BCY018", "f": "<span class=\"glabel\" style=\"display:block\">The ad presents it as the eco food of the future.<\/span>And on top, they present insects as the eco grub of the future.", "b": "Et en plus, ils présentent les insectes comme la bouffe écolo du futur."}, {"id": "B:BP1040", "bid": "BCY019", "f": "<span class=\"glabel\" style=\"display:block\">Volunteering is usually for others, not for yourself.<\/span><mark>It's a thing that most of the time one does for the others and not for oneself<\/mark><span class=\"dim\"> — and precisely, I have always asked myself to what point that could be fulfilling.<\/span>", "b": "<mark>C'est un truc que la plupart du temps on fait pour les autres et pas pour soi<\/mark><span class=\"dim\"> — et justement, je me suis toujours demandé à quel point ça pouvait être épanouissant.<\/span>"}, {"id": "B:BP0001", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Roughly, you paddle the day, and then the evening, you sleep well comfortably under a tent.", "b": "En gros, tu pagaies la journée, et puis le soir, tu dors bien confortablement sous une tente."}, {"id": "B:BP0113", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Roughly, the idea, it's that you would do shows on a local radio, where you would talk about what interests you.", "b": "En gros, l'idée, c'est que tu ferais des émissions sur une radio locale, où tu parlerais de ce qui t'intéresse."}, {"id": "B:BP0330", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>We could leave on a trip and stroll around in tuk-tuk.", "b": "On pourrait partir en voyage et se balader en tuk-tuk."}, {"id": "B:BP0579", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Roughly, you recount your story in front of a jury, during 10 to 20 minutes approximately.", "b": "En gros, tu racontes ton histoire devant un jury, pendant 10 à 20 minutes environ."}, {"id": "B:BP0648", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>So, the thing, it's that you invite some mates to your place and you cook the dish that you want.", "b": "Alors, le truc, c'est que t'invites des potes chez toi et tu cuisines le plat que tu veux."}, {"id": "B:BP0706", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Roughly, you would need to keep this dog company during ten months.", "b": "En gros, il faudrait que tu tiennes compagnie à ce chien pendant dix mois."}, {"id": "B:BP0823", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Roughly, you would leave on a trip with groups of young people, you would welcome them at the station, you would coordinate the departures and the returns, things like that.", "b": "En gros, tu partirais en voyage avec des groupes de jeunes, tu les accueillerais à la gare, tu coordonnerais les départs et les retours, des trucs comme ça."}, {"id": "B:BP0037", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Roughly, you can reserve a chef so that he comes to cook at your place.", "b": "En gros, tu peux réserver un chef pour qu'il vienne cuisiner chez toi."}, {"id": "B:BP0221", "bid": "BCY021", "f": "<span class=\"glabel\" style=\"display:block\">You basically become a travel tester.<\/span><mark>Roughly, you become a tester of voyages<\/mark><span class=\"dim\">, and if we signed up with them to do that, we would have the chance to travel everywhere in the world.<\/span>", "b": "<mark>En gros, tu deviens testeur de voyages<\/mark><span class=\"dim\">, et si on s'inscrivait chez eux pour faire ça, on aurait la chance de voyager partout dans le monde.<\/span>"}, {"id": "B:BP0085", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span><span class=\"dim\">Roughly, they're looking for people to take care of houses while the owners are not there — <\/span><mark>things like keeping the house in order, watching it, and sometimes taking care of the animals, all that.<\/mark>", "b": "<span class=\"dim\">En gros, ils cherchent des gens pour s'occuper de maisons pendant que les proprios sont pas là — <\/span><mark>des trucs comme garder la maison en ordre, la surveiller, et des fois s'occuper des animaux, tout ça.<\/mark>"}, {"id": "B:BP0223", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>From what I understood, they would hand us little missions where we would give our opinion and our observations on different cultures, places, hotels, things like that.", "b": "De ce que j'ai compris, ils nous fileraient des petites missions où on donnerait notre avis et nos observations sur différentes cultures, des endroits, des hôtels, des trucs comme ça."}, {"id": "B:BP0238", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>After, for what they would expect of you concretely, one would say that you would mostly write reviews and that you would share your observations.", "b": "Après, pour ce qu'ils attendraient de toi concrètement, on dirait que tu rédigerais surtout des avis et que tu partagerais tes observations."}, {"id": "B:BP0649", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>Next, you show them the dish wrapped in this plastic film that is called Embal'Plast — it's the product of the company that placed the ad.", "b": "Ensuite, tu leur montres le plat emballé dans ce film plastique qui s'appelle Embal'Plast — c'est le produit de la boîte qui a passé l'annonce."}, {"id": "B:BP0650", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>Roughly, you talk to them about it and you try to convince them to buy some.", "b": "En gros, tu leur en parles et t'essaies de les convaincre d'en acheter."}, {"id": "B:BP0893", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>Concretely, you would give a hand for stuff like clearing the vegetation or doing small maintenance works on the historic sites.", "b": "Concrètement, tu donnerais un coup de main pour des trucs comme dégager la végétation ou faire des petits travaux d'entretien sur les sites historiques."}, {"id": "B:BP0089", "bid": "BCY023", "f": "<span class=\"glabel\" style=\"display:block\">The exact tasks would depend on the place.<\/span><span class=\"dim\">And <\/span><mark>in any case, the exact tasks, that would depend on the house.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>de toute façon, les tâches exactes, ça dépendrait de la maison.<\/mark>"}, {"id": "B:BP0588", "bid": "BCY024", "f": "<span class=\"glabel\" style=\"display:block\">The ad says you have to memorize the text.<\/span>But in fact, the ad says well that you have to memorise the text.", "b": "Mais en fait, l'annonce dit bien qu'il faut mémoriser le texte."}, {"id": "B:BP0164", "bid": "BCY025", "f": "<span class=\"glabel\" style=\"display:block\">With this card, you can buy meals and order online.<\/span><span class=\"dim\">And <\/span><mark>with this fidelity card, you could buy 20 meals, order them online<\/mark><span class=\"dim\">, and have yourself delivered for free where you want.<\/span>", "b": "<span class=\"dim\">Et <\/span><mark>avec cette carte de fidélité, tu pourrais acheter 20 repas, les commander en ligne<\/mark><span class=\"dim\">, et te faire livrer gratuitement où tu veux.<\/span>"}, {"id": "B:BP0510", "bid": "BCY026", "f": "<span class=\"glabel\" style=\"display:block\">They cook it in all kinds of ways.<\/span>And according to the ad, they prepare them salty, sweet, in lots of different ways.", "b": "Et d'après la pub, ils les préparent salés, sucrés, de plein de façons différentes."}, {"id": "B:BP0754", "bid": "BCY027", "f": "<span class=\"glabel\" style=\"display:block\">You can do it tandem or solo.<\/span>They propose parachute jumps, and you can do it either in tandem, or solo.", "b": "Ils proposent des sauts en parachute, et tu peux le faire soit en tandem, soit en solo."}, {"id": "B:BP1095", "bid": "BCY028", "f": "<span class=\"glabel\" style=\"display:block\">They plan trips tailored to what we want.<\/span>In fact, they propose weekends made to measure, according to our preferences and our desires.", "b": "En fait, ils proposent des week-ends sur mesure, en fonction de nos préférences et de nos envies."}, {"id": "B:BP1096", "bid": "BCY029", "f": "<span class=\"glabel\" style=\"display:block\">We pick the destination and any sport we want.<\/span>We can choose the destination — the sea or the mountain — and all the sporting activities that we want: hiking, snowboard, ski, climbing, surf.", "b": "On peut choisir la destination — la mer ou la montagne — et toutes les activités sportives qu'on veut : rando, snowboard, ski, escalade, surf."}, {"id": "B:BP0790", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span>You can sign up to have a stand and sell your stuff.", "b": "Tu peux t'inscrire pour avoir un stand et vendre tes affaires."}, {"id": "B:BP0274", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span><mark>You create yourself a profile, you describe the kind of things that you know how to do<\/mark><span class=\"dim\">, and then the other users can contact you if they have need of one of these services.<\/span>", "b": "<mark>Tu te crées un profil, tu décris le genre de trucs que tu sais faire<\/mark><span class=\"dim\">, et ensuite les autres utilisateurs peuvent te contacter s'ils ont besoin d'un de ces services.<\/span>"}, {"id": "B:BP0612", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span>Roughly, to have the job, you have to participate in a contest and send your best photos, so that they can choose someone who will become photo reporter for the magazine.", "b": "En gros, pour avoir le job, il faut que tu participes à un concours et que tu envoies tes meilleures photos, pour qu'ils puissent choisir quelqu'un qui deviendra reporter photo pour le magazine."}, {"id": "B:BP0375", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span><span class=\"dim\">No but I understand why you tell yourself that, except that <\/span><mark>in the ad, they say that you have to contact the refuge the closest to your place.<\/mark>", "b": "<span class=\"dim\">Non mais je comprends pourquoi tu te dis ça, sauf que <\/span><mark>dans l'annonce, ils disent qu'il faut contacter le refuge le plus près de chez toi.<\/mark>"}, {"id": "B:BP0275", "bid": "BCY031", "f": "<span class=\"glabel\" style=\"display:block\">Other users contact you if they need your services.<\/span><span class=\"dim\">You create yourself a profile, you describe the kind of things that you know how to do, and then <\/span><mark>the other users can contact you if they have need of one of these services.<\/mark>", "b": "<span class=\"dim\">Tu te crées un profil, tu décris le genre de trucs que tu sais faire, et ensuite <\/span><mark>les autres utilisateurs peuvent te contacter s'ils ont besoin d'un de ces services.<\/mark>"}, {"id": "B:BP1094", "bid": "BCY032", "f": "<span class=\"glabel\" style=\"display:block\">That's how we'd organize it.<\/span>That's how we would organise this kind of trips.", "b": "Voilà comment on organiserait ce genre de voyages."}, {"id": "B:BP1092", "bid": "BCY032", "f": "<span class=\"glabel\" style=\"display:block\">That's how we'd organize it.<\/span>That would be it, our plan to shower and refresh ourselves.", "b": "Ce serait ça, notre plan pour se doucher et se rafraîchir."}, {"id": "B:BP0789", "bid": "BCY033", "f": "<span class=\"glabel\" style=\"display:block\">This organization is organizing it.<\/span><span class=\"dim\">In fact, it's for a garage sale in your neighbourhood, and <\/span><mark>it's the town hall that organises it.<\/mark>", "b": "<span class=\"dim\">En fait, c'est pour un vide-grenier dans ton quartier, et <\/span><mark>c'est la mairie qui l'organise.<\/mark>"}, {"id": "B:BP0303", "bid": "BCY033", "f": "<span class=\"glabel\" style=\"display:block\">This organization is organizing it.<\/span>So in fact, the ad, it comes from a school.", "b": "Alors en fait, l'annonce, ça vient d'une école."}, {"id": "B:BP0060", "bid": "BCY034", "f": "<span class=\"glabel\" style=\"display:block\">It's happening at this place.<\/span><span class=\"dim\">Roughly, they're looking for dancers for a good cause, and <\/span><mark>it happens at the community centre Kent Nagano.<\/mark>", "b": "<span class=\"dim\">En gros, ils cherchent des danseurs pour une bonne cause, et <\/span><mark>ça se passe au centre communautaire Kent Nagano.<\/mark>"}, {"id": "B:BP0895", "bid": "BCY035", "f": "<span class=\"glabel\" style=\"display:block\">You'd be in a group of this size.<\/span><span class=\"dim\">The complete stay, it's two weeks, and <\/span><mark>you would be in a group of some twenty people.<\/mark>", "b": "<span class=\"dim\">Le séjour complet, c'est deux semaines, et <\/span><mark>tu serais dans un groupe d'une vingtaine de personnes.<\/mark>"}, {"id": "B:BP0191", "bid": "BCY035", "f": "<span class=\"glabel\" style=\"display:block\">You'd be in a group of this size.<\/span><mark>We would need to do it in a team of five cyclists<\/mark><span class=\"dim\">, and me, I really feel like participating in it.<\/span>", "b": "<mark>Il faudrait qu'on le fasse en équipe de cinq cyclistes<\/mark><span class=\"dim\">, et moi, j'ai vraiment envie d'y participer.<\/span>"}, {"id": "B:BP0189", "bid": "BCY036", "f": "<span class=\"glabel\" style=\"display:block\">It's 130 km a day for two days.<\/span><span class=\"dim\">Roughly, it's a charitable event by bike, where we would collect money for an environmental cause, and <\/span><mark>the challenge, it's 130 kilometres per day during two days.<\/mark>", "b": "<span class=\"dim\">En gros, c'est un événement caritatif à vélo, où on récolterait de l'argent pour une cause environnementale, et <\/span><mark>le défi, c'est 130 kilomètres par jour pendant deux jours.<\/mark>"}, {"id": "B:BP0894", "bid": "BCY037", "f": "<span class=\"glabel\" style=\"display:block\">The stay is two weeks.<\/span><mark>The complete stay, it's two weeks<\/mark><span class=\"dim\">, and you would be in a group of some twenty people.<\/span>", "b": "<mark>Le séjour complet, c'est deux semaines<\/mark><span class=\"dim\">, et tu serais dans un groupe d'une vingtaine de personnes.<\/span>"}, {"id": "B:BP0730", "bid": "BCY038", "f": "<span class=\"glabel\" style=\"display:block\">No screens for at least two days.<\/span>During at least two days, you wouldn't have access to screens, nor to anything of all that.", "b": "Pendant au moins deux jours, t'aurais pas accès aux écrans, ni à rien de tout ça."}, {"id": "B:BP1108", "bid": "BCY039", "f": "<span class=\"glabel\" style=\"display:block\">It'll probably cost about this much.<\/span><mark>That must turn around 200 euros the weekend<\/mark><span class=\"dim\">, and then we're not obliged to do one every week.<\/span>", "b": "<mark>Ça doit tourner autour de 200 euros le week-end<\/mark><span class=\"dim\">, et puis on est pas obligés d'en faire un toutes les semaines.<\/span>"}]}, {"key": "B-BC3", "sec": "B", "code": "BC3", "name": "My situation", "bucket": "Context", "items": [{"id": "B:BP1192", "bid": "BCY040", "f": "<span class=\"glabel\" style=\"display:block\">I haven't been consistent with this either.<\/span>Well, me neither I've never been super regular with the online courses, it's true.", "b": "Bon, moi non plus j'ai jamais été super régulier avec les cours en ligne, c'est vrai."}, {"id": "B:BP0195", "bid": "BCY041", "f": "<span class=\"glabel\" style=\"display:block\">We do this a lot but never toward a goal.<\/span><span class=\"dim\">I find that it would be really nice to do together, seeing as <\/span><mark>we already spend a crazy time riding and training ourselves, except that usually, we train ourselves for nothing in particular.<\/mark>", "b": "<span class=\"dim\">Je trouve que ce serait vraiment sympa à faire ensemble, vu qu'<\/span><mark>on passe déjà un temps fou à rouler et à s'entraîner, sauf que d'habitude, on s'entraîne pour rien de particulier.<\/mark>"}, {"id": "B:BP0186", "bid": "BCY041", "f": "<span class=\"glabel\" style=\"display:block\">We do this a lot but never toward a goal.<\/span>You know, it's been a long time that we do cycling, but we never really had a precise objective to train ourselves.", "b": "Tu sais, ça fait longtemps qu'on fait du vélo, mais on a jamais vraiment eu d'objectif précis pour s'entraîner."}, {"id": "B:BP1087", "bid": "BCY042", "f": "<span class=\"glabel\" style=\"display:block\">What stopped us before was something we didn't want to do.<\/span><span class=\"dim\">We already talked about it, that we wanted to travel further into the countryside to be able to observe the stars and see the Milky Way, but <\/span><mark>what always held us back, it's that life in camping mode, that didn't tempt us. That, it wasn't a compromise that we were ready to make.<\/mark>", "b": "<span class=\"dim\">On en a déjà parlé, qu'on voulait voyager plus loin dans la campagne pour pouvoir observer les étoiles et voir la Voie lactée, mais <\/span><mark>ce qui nous a toujours freinés, c'est que la vie en mode camping, ça nous tentait pas. Ça, c'était pas un compromis qu'on était prêts à faire.<\/mark>"}, {"id": "B:BP1101", "bid": "BCY043", "f": "<span class=\"glabel\" style=\"display:block\">I really want to do more this summer.<\/span><span class=\"dim\">On top, it's been a little moment that we haven't seen each other, and <\/span><mark>I really have the desire that we do more stuff this summer<\/mark><span class=\"dim\"> — I think that it's going to be really nice for all our mates.<\/span>", "b": "<span class=\"dim\">En plus, ça fait un petit moment qu'on s'est pas vus, et <\/span><mark>j'ai vraiment envie qu'on fasse plus de trucs cet été<\/mark><span class=\"dim\"> — je pense que ça va être vraiment sympa pour tous nos potes.<\/span>"}, {"id": "B:BP0489", "bid": "BCY044", "f": "<span class=\"glabel\" style=\"display:block\">That's kind of my philosophy.<\/span>Yeah, it's a bit my philosophy, that.", "b": "Ouais, c'est un peu ma philosophie, ça."}, {"id": "B:BP0814", "bid": "BCY045", "f": "<span class=\"glabel\" style=\"display:block\">I have some things to sell too.<\/span>Because me, I have two-three things that I could sell, and you too surely.", "b": "Parce que moi, j'ai deux-trois trucs que je pourrais vendre, et toi aussi sûrement."}, {"id": "B:BP0927", "bid": "BCY046", "f": "<span class=\"glabel\" style=\"display:block\">I've got it set up on my phone too.<\/span><mark>Me, I installed everything on my phone too<\/mark><span class=\"dim\">, but otherwise, you could try one of those e-readers that are made on purpose to read on screen.<\/span>", "b": "<mark>Moi, j'ai tout installé sur mon téléphone aussi<\/mark><span class=\"dim\">, mais sinon, tu pourrais essayer une de ces liseuses qui sont faites exprès pour lire sur écran.<\/span>"}, {"id": "B:BP1073", "bid": "BCY047", "f": "<span class=\"glabel\" style=\"display:block\">I know a few others who'd be up for this.<\/span>I believe that I know four or five other people who would be up for it.", "b": "Je crois que je connais quatre ou cinq autres personnes qui seraient partantes."}, {"id": "B:BP1212", "bid": "BCY048", "f": "<span class=\"glabel\" style=\"display:block\">I might not buy it myself, since I have my own plan.<\/span><mark>Me, I'm maybe not going to take it, the package, seeing that I already have my own training programmes<\/mark><span class=\"dim\">, but I could be your motivation partner.<\/span>", "b": "<mark>Moi, je vais peut-être pas le prendre, le forfait, vu que j'ai déjà mes propres programmes d'entraînement<\/mark><span class=\"dim\">, mais je pourrais être ton binôme de motivation.<\/span>"}]}, {"key": "B-BC4", "sec": "B", "code": "BC4", "name": "Checking in & clarifying", "bucket": "Context", "items": [{"id": "B:BP0279", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>You think what of it ?", "b": "T'en penses quoi ?"}, {"id": "  "BCY055", "f": "<span class=\"glabel\" style=\"display:block\">The real question is whether it's worth doing.<\/span><span class=\"dim\">In the end, <\/span><mark>I think that the real question, it's just to know if we decide that it's worth the blow to do it or not.<\/mark>", "b": "<span class=\"dim\">Au final, <\/span><mark>je pense que la vraie question, c'est juste de savoir si on décide que ça vaut le coup de le faire ou pas.<\/mark>"}, {"id": "B:BP1131", "bid": "BCY056", "f": "<span class=\"glabel\" style=\"display:block\">There are two parts to this.<\/span>In fact, there's two things in there.", "b": "En fait, y a deux choses là-dedans."}, {"id": "B:BP0971", "bid": "BCY057", "f": "<span class=\"glabel\" style=\"display:block\">Here's another way to see it.<\/span>But there's another angle, in fact.", "b": "Mais y a un autre angle, en fait."}, {"id": "B:BP0153", "bid": "BCY058", "f": "<span class=\"glabel\" style=\"display:block\">Actually, I take that back; I had another thought.<\/span>In fact, you know what? I take back what I said. I just came from thinking of a thing.", "b": "En fait, tu sais quoi ? Je retire ce que j'ai dit. Je viens de penser à un truc."}, {"id": "B:BP0531", "bid": "BCY059", "f": "<span class=\"glabel\" style=\"display:block\">When you think about it, it makes sense.<\/span>And frankly, when we reflect on it, it holds together.", "b": "Et franchement, quand on y réfléchit, ça se tient."}]}, {"key": "B-BC5", "sec": "B", "code": "BC5", "name": "Acknowledging the objection", "bucket": "Context", "items": [{"id": "B:BP0012", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, well, okay, you're not wrong.", "b": "Ouais, bon, d'accord, t'as pas tort."}, {"id": "B:BP0029", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, it's true, you're right on this blow.", "b": "Ouais, c'est vrai, t'as raison sur ce coup-là."}, {"id": "B: ><mark>You cite me snowboarding as an example<\/mark><span class=\"dim\"> — but me too, before, I was afraid of it, and I tried all the same.<\/span>", "b": "<mark>Tu me cites le snowboard en exemple<\/mark><span class=\"dim\"> — mais moi aussi, avant, j'en avais peur, et j'ai quand même essayé.<\/span>"}, {"id": "B:BP0750", "bid": "BCY065", "f": "<span class=\"glabel\" style=\"display:block\">I know that's how you are.<\/span><mark>Yeah, I understand that you're introverted<\/mark><span class=\"dim\">, but you shouldn't let that decide systematically how you live your life.<\/span>", "b": "<mark>Ouais, je comprends que tu sois introverti<\/mark><span class=\"dim\">, mais tu devrais pas laisser ça décider systématiquement de comment tu vis ta vie.<\/span>"}, {"id": "B:BP0387", "bid": "BCY065", "f": "<span class=\"glabel\" style=\"display:block\">I know that's how you are.<\/span><mark>Yeah, I know, you told me that you were allergic to animals<\/mark><span class=\"dim\">, but it could all the same be an alternative.<\/span>", "b": "<mark>Ouais, je sais, tu m'as dit que t'étais allergique aux animaux<\/mark><span class=\"dim\">, mais ça pourrait quand même être une alternative.<\/span>"}, {"id": "B:BP0105", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><span class=\"dim\">Ah yeah, <\/span><mark>I see what worries you.<\/mark>", "b": "<span class=\"dim\">Ah ouais, <\/span><mark>je vois ce qui t'inquiète.<\/mark>"}, {"id": "B:BP0202", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><span class=\"dim\">That said, <\/span><mark>I understand that you ask yourself where the money goes.<\/mark>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>je comprends que tu te demandes où va l'argent.<\/mark>"}, {"id": "B:BP0252", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><span class=\"dim\">Yeah, <\/span>< "}, {"id": "B:BP0040", "bid": "BCY070", "f": "<span class=\"glabel\" style=\"display:block\">I know the discount isn't huge.<\/span><mark>The discount is not enormous, I know<\/mark><span class=\"dim\">, but it's supposed to be a unique evening, no?<\/span>", "b": "<mark>La réduc est pas énorme, je sais<\/mark><span class=\"dim\">, mais c'est censé être une soirée unique, non ?<\/span>"}, {"id": "B:BP0954", "bid": "BCY071", "f": "<span class=\"glabel\" style=\"display:block\">Obviously, it's not a lot of money.<\/span>Well, obviously, it's not going to bring you fortunes.", "b": "Bon, évidemment, ça va pas te rapporter des fortunes."}, {"id": "B:BP0068", "bid": "BCY072", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you wouldn't get paid.<\/span><span class=\"dim\">So the transport, I think not that it's free, and <\/span><mark>no, you wouldn't be paid for that.<\/mark>", "b": "<span class=\"dim\">Alors le transport, je pense pas que ce soit gratuit, et <\/span><mark>non, tu serais pas payé pour ça.<\/mark>"}, {"id": "B:BP0404", "bid": "BCY072", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you wouldn't get paid.<\/span>No, I don't think that they pay you.", "b": "Non, je pense pas qu'ils te paient."}, {"id": "B:BP0413", "bid": "BCY072", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you wouldn't get paid.<\/span><mark>So yeah, you would not be paid<\/mark><span class=\"dim\">, but you would do a thing that you adore already, and you would draw from it all these experiences as a bonus.<\/span>", "b": "<mark>Donc ouais, tu serais pas payé<\/mark><span class=\"dim\">, mais tu ferais un truc que t'adores déjà, et t'en tirerais toutes ces expériences en bonus.<\/span>"}, {"id": "B:BP0103", "bid": "BCY073", "f": "<span class=\"glabel\" style=\"display:block\">You need to be paid.<\/span>It's necessary that you be paid.", "b": "Faut que tu sois payé."}, {"id": "B:BP1053", "bid": "BCY074", "f": "<span class=\"glabel\" style=\"display:block\">At your job, you put up with discomfort because you're paid.<\/span>In your part-time job, you manage to handle these uncomfortable situations because you do it for the money — there's a stake, like.", "b": "Dans ton job à temps partiel, t'arrives à gérer ces situations inconfortables parce que tu le fais pour l'argent — y a un enjeu, quoi."}, {"id": "B:BP0190", "bid": "BCY075", "f": "<span class=\"glabel\" style=\"display:block\">I'm not saying it'll be easy.<\/span><span class=\"dim\">So yeah, <\/span><mark>I'm not saying at all that it's going to be easy.<\/mark>", "b": "<span class=\"dim\">Alors ouais, <\/span><mark>je dis pas du tout que ça va être facile.<\/mark>"}, {"id": "B:BP0626", "bid": "BCY076", "f": "<span class=\"glabel\" style=\"display:block\">Sure, it takes a bit of effort.<\/span><mark>Yeah, you're right, that demands a bit of preparation<\/mark><span class=\"dim\">, but that, it's normal.<\/span>", "b": "<mark>Ouais, t'as raison, ça demande un peu de préparation<\/mark><span class=\"dim\">, mais ça, c'est normal.<\/span>"}, {"id": "B:BP1000", "bid": "BCY076", "f": "<span class=\"glabel\" style=\"display:block\">Sure, it takes a bit of effort.<\/span>So yes, it asks a bit of discipline.", "b": "Alors oui, ça demande un peu de discipline."}, {"id": "B:BP0559", "bid": "BCY077", "f": "<span class=\"glabel\" style=\"display:block\">You're right, it could be tiring, not relaxing.<\/span><mark>You're right, passing hours in a festival, that can be tiring<\/mark><span class=\"dim\">, but we wouldn't be obliged to listen to music all the time.<\/span>", "b": "<mark>T'as raison, passer des heures dans un festival, ça peut être fatigant<\/mark><span class=\"dim\">, mais on serait pas obligés d'écouter de la musique tout le temps.<\/span>"}, {"id": "B:BP0902", "bid": "BCY077", "f": "<span class=\"glabel\" style=\"display:block\">You're right, it could be tiring, not relaxing.<\/span>Well, it's true, it would surely not be the most restful or the most tranquil vacation in the world.", "b": "Bon, c'est vrai, ce serait sûrement pas les vacances les plus reposantes ou les plus tranquilles du monde."}, {"id": "B:BP1049", "bid": "BCY078", "f": "<span class=\"glabel\" style=\"display:block\">It's uncomfortable, I know.<\/span>It's not comfortable, eh?", "b": "C'est pas confortable, hein ?"}, {"id": "B:BP1061", "bid": "BCY079", "f": "<span class=\"glabel\" style=\"display:block\">Yes, it's high pressure.<\/span><mark>It's true that it's pressure<\/mark><span class=\"dim\">, but the stakes, them, are not so high as that.<\/span>", "b": "<mark>C'est vrai que c'est de la pression<\/mark><span class=\"dim\">, mais les enjeux, eux, sont pas si élevés que ça.<\/span>"}, {"id": "B:BP0680", "bid": "BCY080", "f": "<span class=\"glabel\" style=\"display:block\">I know it sounds risky.<\/span><mark>I know that it can appear a bit risky<\/mark><span class=\"dim\">, but at the same time, it's a bit that which makes the thing so interesting.<\/span>", "b": "<mark>Je sais que ça peut paraître un peu risqué<\/mark><span class=\"dim\">, mais en même temps, c'est un peu ça qui rend le truc aussi intéressant.<\/span>"}, {"id": "B:BP0764", "bid": "BCY080", "f": "<span class=\"glabel\" style=\"display:block\">I know it sounds risky.<\/span><mark>The first time that you hear talk of parachute jumping, it looks hyper risky<\/mark><span class=\"dim\">, but in fact, if you really look at the statistics, it's less risky than lots of things that we do every day, like driving.<\/span>", "b": "<mark>La première fois que t'entends parler de saut en parachute, ça a l'air hyper risqué<\/mark><span class=\"dim\">, mais en fait, si tu regardes vraiment les statistiques, c'est moins risqué que plein de trucs qu'on fait tous les jours, comme conduire.<\/span>"}, {"id": "B:BP0762", "bid": "BCY081", "f": "<span class=\"glabel\" style=\"display:block\">Of course it would be scary for all of us.<\/span><mark>After, obviously, it would make us all freak out<\/mark><span class=\"dim\">, but the people who organise that, it's pros, they know what they're doing.<\/span>", "b": "<mark>Après, évidemment, ça nous ferait tous flipper<\/mark><span class=\"dim\">, mais les gens qui organisent ça, c'est des pros, ils savent ce qu'ils font.<\/span>"}, {"id": "B:BP0513", "bid": "BCY082", "f": "<span class=\"glabel\" style=\"display:block\">I know it's unusual.<\/span><mark>I know that it's not banal<\/mark><span class=\"dim\">, but precisely, it's for that that we should try.<\/span>", "b": "<mark>Je sais que c'est pas banal<\/mark><span class=\"dim\">, mais justement, c'est pour ça qu'on devrait essayer.<\/span>"}, {"id": "B:BP0712", "bid": "BCY082", "f": "<span class=\"glabel\" style=\"display:block\">I know it's unusual.<\/span>Yeah, you're not wrong, it would clearly be a not banal experience for you.", "b": "Ouais, t'as pas tort, ce serait clairement une expérience pas banale pour toi."}, {"id": "B:BP1022", "bid": "BCY083", "f": "<span class=\"glabel\" style=\"display:block\">Sure, you might embarrass yourself.<\/span>There, for once, what is it that could turn badly? Well, you could ridicule yourself, it's true.", "b": "Là, pour le coup, qu'est-ce qui pourrait mal tourner ? Bon, tu pourrais te ridiculiser, c'est vrai."}, {"id": "B:BP1077", "bid": "BCY084", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there might be some conflicts with people.<\/span><mark>So yes, there are sometimes little tensions here and there<\/mark><span class=\"dim\">, but it's only jokes, and at the end of the count, it's only love.<\/span>", "b": "<mark>Alors oui, y a parfois des petites tensions par-ci par-là<\/mark><span class=\"dim\">, mais c'est que des vannes, et au bout du compte, c'est que de l'amour.<\/span>"}, {"id": "B:BP1048", "bid": "BCY084", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there might be some conflicts with people.<\/span><span class=\"dim\">After, it's true, it may be that we have to organise activities ourselves, <\/span><mark>it may be also that we have to manage people who don't necessarily appreciate us.<\/mark>", "b": "<span class=\"dim\">Après, c'est vrai, il se peut qu'on doive organiser des activités nous-mêmes, <\/span><mark>il se peut aussi qu'on doive gérer des gens qui nous apprécient pas forcément.<\/mark>"}, {"id": "B:BP1047", "bid": "BCY085", "f": "<span class=\"glabel\" style=\"display:block\">We might have to organize things ourselves.<\/span><span class=\"dim\">After, it's true, <\/span><mark>it may be that we have to organise activities ourselves<\/mark><span class=\"dim\">, it may be also that we have to manage people who don't necessarily appreciate us.<\/span>", "b": "<span class=\"dim\">Après, c'est vrai, <\/span><mark>il se peut qu'on doive organiser des activités nous-mêmes<\/mark><span class=\"dim\">, il se peut aussi qu'on doive gérer des gens qui nous apprécient pas forcément.<\/span>"}, {"id": "B:BP0543", "bid": "BCY086", "f": "<span class=\"glabel\" style=\"display:block\">I know there would be a lot of people.<\/span><mark>Yeah, I know, it's a festival, so then there would surely be quite a lot of people<\/mark><span class=\"dim\">, but it's not every day that we do a thing like that.<\/span>", "b": "<mark>Ouais, je sais, c'est un festival, du coup y aurait sûrement pas mal de monde<\/mark><span class=\"dim\">, mais c'est pas tous les jours qu'on fait un truc comme ça.<\/span>"}, {"id": "B:BP0734", "bid": "BCY087", "f": "<span class=\"glabel\" style=\"display:block\">You're right, being unreachable could be a problem.<\/span>Yeah, you're right, being completely unreachable, that could pose a problem.", "b": "Ouais, t'as raison, être complètement injoignable, ça pourrait poser problème."}, {"id": "B:BP0259", "bid": "BCY088", "f": "<span class=\"glabel\" style=\"display:block\">I know it's not in person.<\/span><span class=\"dim\">And yeah, <\/span><mark>I know well that it's not face to face<\/mark><span class=\"dim\">, but one would say that it comes pretty close to this kind of accompaniment.<\/span>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>je sais bien que c'est pas en face à face<\/mark><span class=\"dim\">, mais on dirait que ça se rapproche pas mal de ce genre d'accompagnement.<\/span>"}, {"id": "B:BP0352", "bid": "BCY089", "f": "<span class=\"glabel\" style=\"display:block\">I know it's not the greenest way to travel.<\/span><mark>Yeah, I know that it's not the most eco way to travel<\/mark><span class=\"dim\">, but all the same, it's clearly more eco than to do everything by car or by bus.<\/span>", "b": "<mark>Ouais, je sais que c'est pas la façon la plus écolo de voyager<\/mark><span class=\"dim\">, mais n'empêche, c'est clairement plus écolo que de tout faire en voiture ou en bus.<\/span>"}, {"id": "B:BP0572", "bid": "BCY090", "f": "<span class=\"glabel\" style=\"display:block\">I agree: polluting to get to a green event makes no sense.<\/span>And I'm in agreement with you: for an eco event, it wouldn't be very logical to do a thing bad for the planet just to go there.", "b": "Et je suis d'accord avec toi : pour un événement écolo, ce serait pas très logique de faire un truc mauvais pour la planète juste pour y aller."}, {"id": "B:BP0100", "bid": "BCY091", "f": "<span class=\"glabel\" style=\"display:block\">You're right, there are still things you need to know.<\/span>Yeah, you're right, there are still things that it would be necessary that you know.", "b": "Ouais, t'as raison, y a encore des trucs qu'il faudrait que tu saches."}, {"id": "B:BP0445", "bid": "BCY092", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you can't do everything yourself.<\/span>Yeah, you're right, it's sure that you can't do everything yourself.", "b": "Ouais, t'as raison, c'est sûr que tu peux pas tout faire toi-même."}, {"id": "B:BP0307", "bid": "BCY093", "f": "<span class=\"glabel\" style=\"display:block\">You're right, the ad asks for parent volunteers.<\/span><mark>I know, you're right, it's marked that they're looking for volunteer parents<\/mark><span class=\"dim\">, but already, I don't think that it's necessarily obligatory.<\/span>", "b": "<mark>Je sais, t'as raison, c'est marqué qu'ils cherchent des parents bénévoles<\/mark><span class=\"dim\">, mais déjà, je pense pas que ce soit forcément obligatoire.<\/span>"}, {"id": "B:BP0376", "bid": "BCY094", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are already lots of volunteers.<\/span><mark>So yes, there are already 2 000 volunteers in total<\/mark><span class=\"dim\">, but we don't know at all how many people have signed up in the refuge next to your place.<\/span>", "b": "<mark>Alors oui, y a déjà 2 000 bénévoles en tout<\/mark><span class=\"dim\">, mais on sait pas du tout combien de gens se sont inscrits dans le refuge à côté de chez toi.<\/span>"}, {"id": "B:BP0467", "bid": "BCY095", "f": "<span class=\"glabel\" style=\"display:block\">It would be hard to give up the animal later.<\/span>It would be hard to separate oneself from a cat after having spent all those years with it.", "b": "Ce serait dur de se séparer d'un chat après avoir passé toutes ces années avec lui."}, {"id": "B:BP0478", "bid": "BCY096", "f": "<span class=\"glabel\" style=\"display:block\">Of course the animal needs its owner.<\/span><mark>Well, obviously that they need their master<\/mark><span class=\"dim\">, but they're also capable of managing all alone for quite a lot of time — even weeks, or even more.<\/span>", "b": "<mark>Enfin, évidemment qu'ils ont besoin de leur maître<\/mark><span class=\"dim\">, mais ils sont aussi capables de se débrouiller tout seuls pendant pas mal de temps — même des semaines, voire plus.<\/span>"}, {"id": "B:BP0980", "bid": "BCY097", "f": "<span class=\"glabel\" style=\"display:block\">You're right to be skeptical.<\/span><span class=\"dim\">That said, <\/span><mark>you're right to be wary about that.<\/mark>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>t'as raison d'être méfiant là-dessus.<\/mark>"}, {"id": "B:BP0947", "bid": "BCY098", "f": "<span class=\"glabel\" style=\"display:block\">Sure, they might be lying.<\/span><mark>Well, after, I don't exclude that they lie, huh<\/mark><span class=\"dim\">, but I can send you the link of the site and you do your research on your side.<\/span>", "b": "<mark>Bon, après, j'exclus pas qu'ils mentent, hein<\/mark><span class=\"dim\">, mais je peux t'envoyer le lien du site et tu fais tes recherches de ton côté.<\/span>"}, {"id": "B:BP0961", "bid": "BCY099", "f": "<span class=\"glabel\" style=\"display:block\">Sure, they'd know your opinions and preferences.<\/span>So yes, these companies know your opinions and your preferences.", "b": "Alors oui, ces boîtes connaissent tes opinions et tes préférences."}, {"id": "B:BP1134", "bid": "BCY100", "f": "<span class=\"glabel\" style=\"display:block\">I don't think that method works.<\/span><span class=\"dim\">And then it's not obliged that it be brochures — <\/span><mark>distributing brochures, I don't find that efficient.<\/mark>", "b": "<span class=\"dim\">Et puis c'est pas obligé que ce soit des brochures — <\/span><mark>distribuer des brochures, je trouve pas ça efficace.<\/mark>"}, {"id": "B:BP1112", "bid": "BCY101", "f": "<span class=\"glabel\" style=\"display:block\">When you suggest something in the group chat, no one answers.<\/span>That, I've already lived it: you propose a thing on the group, and nobody answers.", "b": "Ça, je l'ai déjà vécu : tu proposes un truc sur le groupe, et personne répond."}, {"id": "B:BP0496", "bid": "BCY102", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are other options.<\/span><mark>And it's sure, there's the option of therapy<\/mark><span class=\"dim\">, but a therapy, that can cost super expensive.<\/span>", "b": "<mark>Et c'est sûr, y a l'option de la thérapie<\/mark><span class=\"dim\">, mais une thérapie, ça peut coûter super cher.<\/span>"}, {"id": "B:BP0356", "bid": "BCY102", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are other options.<\/span><mark>And agreed, we could take the trams and the buses<\/mark><span class=\"dim\">, but that, it's what all the tourists do.<\/span>", "b": "<mark>Et d'accord, on pourrait prendre les trams et les bus<\/mark><span class=\"dim\">, mais ça, c'est ce que font tous les touristes.<\/span>"}, {"id": "B:BP1104", "bid": "BCY102", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are other options.<\/span><mark>So yes, we can count every cent<\/mark><span class=\"dim\">, but we have 21 years only once, and summers between 20 and 30 years, we have only ten of them.<\/span>", "b": "<mark>Alors oui, on peut compter chaque centime<\/mark><span class=\"dim\">, mais on a 21 ans qu'une fois, et des étés entre 20 et 30 ans, on en a que dix.<\/span>"}, {"id": "B:BP1045", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span><mark>So yes, if it was a regular thing over several months, we could debate on whether it's worth the blow to pass our time on it<\/mark><span class=\"dim\">; but for one afternoon, honestly, it's squarely worth the blow.<\/span>", "b": "<mark>Alors oui, si c'était un truc régulier sur plusieurs mois, on pourrait débattre de savoir si ça vaut le coup d'y passer notre temps<\/mark><span class=\"dim\"> ; mais pour un après-midi, honnêtement, ça vaut carrément le coup.<\/span>"}, {"id": "B:BP0319", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span>If it was just over one day, there yes, the bonds that you create would maybe not be so strong as that, because you would see these people only one single time.", "b": "Si c'était juste sur une journée, là oui, les liens que tu crées seraient peut-être pas si forts que ça, parce que tu verrais ces gens qu'une seule fois."}, {"id": "B:BP1009", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span>If it was a serious thing, where you had to play in front of a completely cold audience that paid a fortune for its seat, there okay, there'd be more at stake and more risk that they react badly.", "b": "Si c'était un truc sérieux, où tu devais jouer devant un public complètement froid qui a payé sa place une fortune, là d'accord, y aurait plus d'enjeu et plus de risques qu'ils réagissent mal."}, {"id": "B:BP0985", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span><mark>On a thing like Facebook Marketplace or Craigslist, that would surely be the case<\/mark><span class=\"dim\">, but I don't think that many people know it already, this site, so then in my opinion the good deals don't leave so fast as that.<\/span>", "b": "<mark>Sur un truc comme Facebook Marketplace ou Craigslist, ce serait sûrement le cas<\/mark><span class=\"dim\">, mais je pense pas que beaucoup de gens le connaissent déjà, ce site, du coup à mon avis les bonnes affaires partent pas si vite que ça.<\/span>"}, {"id": "B:BP0280", "bid": "BCY104", "f": "<span class=\"glabel\" style=\"display:block\">Of course, you shouldn't do anything that stresses you.<\/span>And no, evidently, you mustn't do a thing that stresses you.", "b": "Et non, évidemment, faut pas que tu fasses un truc qui te stresse."}, {"id": "B:BP0744", "bid": "BCY105", "f": "<span class=\"glabel\" style=\"display:block\">If it's really far, forget it.<\/span>Well, obviously, if it's super far, we forget it.", "b": "Bon, évidemment, si c'est super loin, on oublie."}, {"id": "B:BP0118", "bid": "BCY106", "f": "<span class=\"glabel\" style=\"display:block\">The usual options are nice too.<\/span><mark>They're nice, I'm not saying<\/mark><span class=\"dim\">, but here, it's really different.<\/span>", "b": "<mark>Elles sont sympas, je dis pas<\/mark><span class=\"dim\">, mais là, c'est vraiment différent.<\/span>"}, {"id": "B:BP0932", "bid": "BCY107", "f": "<span class=\"glabel\" style=\"display:block\">I'm not saying forget the traditional way; it matters too.<\/span><span class=\"dim\">After, <\/span><mark>I'm not saying that one has to drop the classic library, eh. That too, it's important.<\/mark>", "b": "<span class=\"dim\">Après, <\/span><mark>je dis pas qu'il faut laisser tomber la bibliothèque classique, hein. Ça aussi, c'est important.<\/mark>"}, {"id": "B:BP0483", "bid": "BCY108", "f": "<span class=\"glabel\" style=\"display:block\">That's not the end of the world.<\/span>Well, after, it's not the end of the world either.", "b": "Bon, après, c'est pas la fin du monde non plus."}, {"id": "B:BP0430", "bid": "BCY109", "f": "<span class=\"glabel\" style=\"display:block\">That's exactly why it could be useful for you.<\/span>Well precisely, it's for that that I tell myself that it could be useful to you.", "b": "Ben justement, c'est pour ça que je me dis que ça pourrait t'être utile."}]}, {"key": "B-BC6", "sec": "B", "code": "BC6", "name": "Admitting what I don't know", "bucket": "Context", "items": [{"id": "B:BP0204", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span><mark>I don't know yet which one it is exactly<\/mark><span class=\"dim\">, but we can contact them to know more about it.<\/span>", "b": "<mark>Je sais pas encore laquelle c'est exactement<\/mark><span class=\"dim\">, mais on peut les contacter pour en savoir plus.<\/span>"}, {"id": "B:BP0145", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span><mark>I don't know exactly how much it costs, the course, seeing as it wasn't marked in the ad<\/mark><span class=\"dim\">, but I don't think that the price should be the principal reason to not do it.<\/span>", "b": "<mark>Je sais pas exactement combien il coûte, le cour dim\"> — mais en gros, ils encouragent les gens à adopter des chats pour les aider à déstresser.<\/span>"}, {"id": "B:BP0634", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span>In fact, the ad doesn't say how much they pay, so then I don't know exactly what you would earn.", "b": "En fait, l'annonce dit pas combien ils paient, du coup je sais pas exactement ce que tu gagnerais."}, {"id": "B:BP0688", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span><mark>I don't know too much to what point they come close<\/mark><span class=\"dim\">, but the whole experience has the air of being really interesting, like.<\/span>", "b": "<mark>Je sais pas trop à quel point ils s'approchent<\/mark><span class=\"dim\">, mais toute l'expérience a l'air vraiment intéressante, quoi.<\/span>"}, {"id": "B:BP0737", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span><mark>After, how it goes for that one precisely, I don't know<\/mark><span class=\"dim\">, but normally they have a system for the emergencies: if ever someone really had need to reach you, he would contact the organisation, and them, they would warn you.<\/span>", "b": "<mark>Après, comment ça se passe pour celui-là précisément, je sais pas<\/mark><span class=\"dim\">, mais normalement ils ont un système pour les urgences : si jamais quelqu'un avait vraiment besoin de te joindre, il contacterait l'organisme, et eux, ils te préviendraient.<\/span>"}, {"id": "B:BP0796", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span>After, I don't even know if it lasts the whole day, huh.", "b": "Après, je sais même pas si ça dure toute la journée, hein."}, {"id": "B:BP0838", "bid": "BCY110", "f": "<span class=\"glabel\" style=\"display:block\">I don't know that detail yet.<\/span><mark>After, I don't know exactly what the  <span class=\"del\" id=\"delcard\" title=\"Delete this card from EVERY study deck (d)\">delete<\/span>\n    <span class=\"rst\" id=\"reset\" title=\"Reset progress and reshuffle this deck\">reset<\/span>\n    <span class=\"rso\" id=\"reset-ordered\" title=\"Reset progress and restore the original card order\">reset in order<\/span>\n  <\/span>\n<\/div>\n<div id=\"app\"><\/div>\n<div id=\"delnote\" class=\"delnote hidden\"><\/div>\n<div id=\"blackout\" class=\"hidden\"><\/div>\n<script type=\"application/json\" id=\"deck-meta\">__DECK_META__<\/script>\n<script type=\"application/json\" id=\"deck-data\">__DECK_DATA__<\/script>\n<script>\n(function () {\n  \"use strict\";\n  // Progress is GLOBAL across every study deck: the same card appears in its\n  // prompt deck, its day deck, its section deck and the master deck, and\n  // answering it in any of them must count in all of them.  Card ids are\n  // unique across the whole corpus, so one shared { cardId: entry } map under\n  // STORAGE_KEY is the whole mechanism.  What is per-deck is the VIEW: which\n  // scope you're in, the shuffle, and the round counter, namespaced by\n  // VIEW_NS so decks don't stomp each other over the shared file:// origin.\n  var STORAGE_KEY = \"__STORAGE_KEY__\";\n  var VIEW_NS = \"__VIEW_NS__\";\n  var DELETED_KEY = \"study::studyor::deleted\";\n\n  // ---- Scope ---------------------------------------------------------------\n  // Cards come in two kinds and they are not equally urgent: `wrong` (red) are\n  // the actual errors that pull the language criteria down; `idiomatic`\n  // (amber) are the Parisian rewrites. Drilling both together buries the\n  // errors, so the deck opens on FIX -- every card carrying a red span -- and\n  // the amber-only cards are a separate rotation.\n  //\n  // A card's kind is the max of its spans (wrong > idiomatic), so \"carries\n  // any red span\" is exactly `k === \"wrong\"`. A mixed card therefore lands in\n  // FIX, which is right: you cannot drill its red span without saying the\n  // whole sentence.\n  //\n  // Progress lives under STORAGE_KEY and is keyed on the CARD ID, so it is\n  // deliberately SHARED across scopes -- a card you finish under \"fix\" is\n  // still finished when you switch to \"all\". Only the shuffle and the round\n  // counter are per-scope.\n  var SCOPE_KEY = VIEW_NS + \"::scope\";\n  var SCOPES = { fix: 1, polish: 1, all: 1 };\n\n  function loadScope() {\n    try {\n      var v = localStorage.getItem(SCOPE_KEY);\n      if (v && SCOPES[v]) return v;\n    } catch (e) {}\n    return \"fix\";\n  }\n\n  var scope = loadScope();\n  var ROUND_KEY = VIEW_NS + \"::round::\" + scope;\n  var ORDER_KEY = VIEW_NS + \"::order::\" + scope;\n  var REPEAT_MS = 10 * 60 * 1000;\n  var SOON_MS = 3 * 60 * 1000;\n  var TIMER_MS = 60 * 1000;\n  // ns decks: a card carries `t` (seconds) = 30 s per item on it.\n  function cardMs(i) { var t = cards[i] && cards[i].t; return (typeof t === 'number' && t > 0) ? t * 1000 : TIMER_MS; }\n\n  // ---- Deleted cards -------------------------------------------------------\n  // The one addition over the drill_or engine: \"d\" (or Delete/Backspace, or\n  // the header control) permanently removes the current card from EVERY study\n  // deck.  The deleted set is a global list of card ids under DELETED_KEY --\n  // the card stays in every deck's authored data, so restoring is just\n  // removing the id from the set.  Deleted cards are invisible to the\n  // rotation: pickCard, the status counts, round revival and the scope\n  // counters all skip them.\n  function loadDeleted() {\n    try {\n      var v = JSON.parse(localStorage.getItem(DELETED_KEY));\n      if (Array.isArray(v)) return v.filter(function (x) { return typeof x === \"string\"; });\n    } catch (e) {}\n    return [];\n  }\n  function saveDeleted() {\n    try { localStorage.setItem(DELETED_KEY, JSON.stringify(deletedList())); } catch (e) {}\n  }\n  var deleted = {};\n  loadDeleted().forEach(function (id) { deleted[id] = 1; });\n  function deletedList() {\n    var out = [];\n    for (var id in deleted) {\n      if (Object.prototype.hasOwnProperty.call(deleted, id)) out.push(id);\n    }\n    return out;\n  }\n  function isDeleted(i) { return !!deleted[cards[i].id]; }\n\n  // ORIGINAL_CARDS holds the deck in its authored order and is never mutated.\n  // `cards` is a working copy whose order can be reshuffled on reset; `order`\n  // is the persisted permutation (indices into ORIGINAL_CARDS) mapping the\n  // authored order onto the current one.  The whole engine relies on the\n  // invariant that state[i] corresponds to cards[i] positionally, so a\n  // reshuffle just rebuilds `cards` from `order` and starts from fresh state.\n  // Deleted cards are kept IN the arrays (so the persisted permutation stays\n  // valid) and skipped everywhere by isDeleted().\n  var ALL_CARDS = JSON.parse(document.getElementById(\"deck-data\").textContent);\n\n  // ns decks: user edits override the built front/back, keyed on card id.\n  var EDITS_KEY = \"study::studyor::ns::edits\";\n  function loadEdits() { try { var v = JSON.parse(localStorage.getItem(EDITS_KEY)); if (v && typeof v === \"object\") return v; } catch (e) {} return {}; }\n  (function () { var ed = loadEdits(); ALL_CARDS.forEach(function (c) {\n    c.f0 = c.f; c.b0 = c.b; var o = ed[c.id];\n    if (o) { if (typeof o.f === \"string\") c.f = o.f; if (typeof o.b === \"string\") c.b = o.b; }\n  }); })();\n\n  function inScope(c, s) {\n    if (s === \"all\") return true;\n    if (s === \"polish\") return c.k !== \"wrong\";\n    return c.k === \"wrong\";            // \"fix\": any red span\n  }\n\n  // A deck built before the scope filter existed has no `k` on its cards.\n  // Rather than silently drop every card, fall back to showing all of them\n  // and hide the control -- an empty deck reads as data loss, and the fix is\n  // just to re-run build_deck.py.\n  var HAS_KIND = ALL_CARDS.length > 0 && typeof ALL_CARDS[0].k === \"string\"
