moyens, ça pourrait prendre des années."}, {"id": "B:BP1081", "bid": "BAY229", "f": "<span class=\"glabel\" style=\"display:block\">We pay per van, not per person.<\/span><span class=\"dim\">I do think this is a cheaper option because they often offer group rates, and <\/span><mark>we're paying per van, right?<\/mark>", "b": "<span class=\"dim\">Moi, je pense vraiment que c'est moins cher comme option, vu qu'ils font souvent des tarifs de groupe, et puis <\/span><mark>on paie par van, non ?<\/mark>"}, {"id": "B:BP1082", "bid": "BAY230", "f": "<span class=\"glabel\" style=\"display:block\">In a hotel, separate rooms cost much more.<\/span>In a hotel, if everyone wants their own privacy, we would each have to book a separate room, and that costs a lot more.", "b": "À l'hôtel, si chacun veut son intimité, il faudrait qu'on prenne chacun une chambre à part, et ça, ça coûte beaucoup plus cher."}, {"id": "B:BP1083", "bid": "BAY231", "f": "<span class=\"glabel\" style=\"display:block\">The van is also our transport, so no car rental.<\/span>With these vans, it kind of kills two birds with one stone because you also have your mode of transport — you don't have to think about renting a car.", "b": "Avec ces vans, on fait un peu d'une pierre deux coups, parce que t'as aussi ton moyen de transport — t'as même pas à penser à louer une voiture."}, {"id": "B:BP1084", "bid": "BAY232", "f": "<span class=\"glabel\" style=\"display:block\">In a hotel, we only sleep.<\/span><span class=\"dim\">And <\/span><mark>with hotels, we don't even stay in the hotel when we're traveling. We just stay there for sleeping<\/mark><span class=\"dim\">, and we spend $150 a night for just sleeping.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>les hôtels, on y est même pas quand on voyage. On y va juste pour dormir<\/mark><span class=\"dim\">, et on claque 150 dollars la nuit juste pour dormir.<\/span>"}, {"id": "B:BP1085", "bid": "BAY233", "f": "<span class=\"glabel\" style=\"display:block\">Paying a lot for a hotel just to sleep isn't fun.<\/span><span class=\"dim\">We just stay there for sleeping, and <\/span><mark>we spend $150 a night for just sleeping. That's not fun.<\/mark>", "b": "<span class=\"dim\">On y va juste pour dormir, et <\/span><mark>on claque 150 dollars la nuit juste pour dormir. Franchement, c'est pas fou.<\/mark>"}, {"id": "B:BP0801", "bid": "BAY234", "f": "<span class=\"glabel\" style=\"display:block\">These sales are popular because things are cheaper.<\/span><mark>These kinds of garage sales are usually really popular because everything’s cheaper<\/mark><span class=\"dim\">, and they’re good for the planet too.<\/span>", "b": "<mark>Ce genre de vide-greniers, en général, ça marche super bien, parce que tout est moins cher<\/mark><span class=\"dim\">, et en plus c'est bon pour la planète.<\/span>"}, {"id": "B:BP0803", "bid": "BAY235", "f": "<span class=\"glabel\" style=\"display:block\">Otherwise you'd give it away or it would gather dust.<\/span>And think about your other options. You’d either have to give your stuff away for free, or it would just stay in your attic collecting dust and you wouldn’t make any money from it.", "b": "Et puis pense à tes autres options : soit tu donnes tes affaires gratuitement, soit ça reste dans ton grenier à prendre la poussière, et ça te rapporte rien du tout."}, {"id": "B:BP0804", "bid": "BAY236", "f": "<span class=\"glabel\" style=\"display:block\">Compared with that, this is a good option.<\/span>So compared with that, I think the garage sale is a pretty good option.", "b": "Du coup, à côté de ça, je trouve que le vide-grenier, c'est plutôt une bonne option."}, {"id": "B:BP1001", "bid": "BAY237", "f": "<span class=\"glabel\" style=\"display:block\">At least you can sell it back on the same site.<\/span><span class=\"dim\">But <\/span><mark>at the very least, you can sell it back on the same website.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>au moins, tu peux le revendre sur le même site.<\/mark>"}, {"id": "B:BP0639", "bid": "BAY238", "f": "<span class=\"glabel\" style=\"display:block\">You could make extra money while you look for a job.<\/span>You could do it while you're still looking for other jobs and use it as a way to make some extra money in the meantime.", "b": "Tu pourrais faire ça tout en continuant à chercher d'autres jobs, histoire de te faire un peu d'argent en plus en attendant."}, {"id": "B:BP0831", "bid": "BAY238", "f": "<span class=\"glabel\" style=\"display:block\">You could make extra money while you look for a job.<\/span>But still, it could be a nice way to make some extra money, especially since you're already looking for a new job.", "b": "Mais quand même, ça pourrait être un bon moyen de te faire un peu d'argent en plus, surtout que tu cherches déjà un nouveau boulot."}, {"id": "B:BP0640", "bid": "BAY239", "f": "<span class=\"glabel\" style=\"display:block\">If you need money fast, this is a real option.<\/span>If you need income quickly, this could be a real option while you're figuring out what else you want to do.", "b": "<span class=\"dim\">Et <\/span><mark>si t'as besoin de rentrées d'argent rapidement, ça pourrait être une vraie option, le temps que tu voies ce que tu veux faire d'autre.<\/mark>"}, {"id": "B:BP0834", "bid": "BAY240", "f": "<span class=\"glabel\" style=\"display:block\">For a temporary job, it sounds good.<\/span>And for a temporary job, it honestly doesn't sound bad.", "b": "Et pour un boulot temporaire, honnêtement, ça a l'air pas mal."}, {"id": "B:BP0674", "bid": "BAY241", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't have to be your only side income.<\/span>I’m also not saying this has to be your only source of extra income.", "b": "Après, je dis pas non plus que ça doit être ta seule rentrée d'argent en plus, hein."}, {"id": "B:BP0675", "bid": "BAY241", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't have to be your only side income.<\/span>It could just /mark>", "b": "<span class=\"dim\">Je sais, t'as raison, c'est marqué qu'ils cherchent des parents bénévoles, <\/span><mark>mais déjà, je pense pas que ce soit forcément obligatoire.<\/mark>"}, {"id": "B:BP0288", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span>So it’s not like you need to be some kind of professional to sign up.", "b": "Donc c'est pas comme s'il fallait être un pro pour s'inscrire."}, {"id": "B:BP0009", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span>I don't even think you have to be super athletic for this kind of thing.", "b": "Je pense même pas qu'il faille être super sportif pour ce genre de truc."}, {"id": "B:BP0078", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">So <\/span><mark>I really don’t think you need to be a professional dancer to take part.<\/mark>", "b": "<span class=\"dim\">Donc <\/span><mark>je pense vraiment pas que t'aies besoin d'être danseur professionnel pour participer.<\/mark>"}, {"id": "B:BP0214", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">And <\/span><mark>you don't need to be a professional cyclist or some super-athletic person to do it.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>t'as pas besoin d'être un cycliste pro ou quelqu'un d'hyper sportif pour le faire.<\/mark>"}, {"id": "B:BP0285", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">You’ve got plenty of skills you could share, and <\/span><mark>they don’t have to be professional-level skills either.<\/mark>", "b": "<span class=\"dim\">T'as plein de compétences que tu pourrais partager, et <\/span><mark>c /span>They’d probably have seen the same kind of ad and thought, “That sounds interesting,” even if they had no experience restoring historic sites.", "b": "Ils auraient probablement vu le même genre d'annonce en se disant « tiens, ça a l'air intéressant », même sans aucune expérience dans la restauration de sites historiques."}, {"id": "B:BP0008", "bid": "BAY254", "f": "<span class=\"glabel\" style=\"display:block\">I've never done it either; it's my first time too.<\/span><span class=\"dim\">You can learn how to do it, and <\/span><mark>I've never done it either, so it'll be my first time too.<\/mark>", "b": "<span class=\"dim\">Ça s'apprend, et puis <\/span><mark>moi non plus j'en ai jamais fait, donc ce sera ma première fois aussi.<\/mark>"}, {"id": "B:BP1006", "bid": "BAY254", "f": "<span class=\"glabel\" style=\"display:block\">I've never done it either; it's my first time too.<\/span>I haven't personally done acting before.", "b": "Moi, j'ai jamais fait de théâtre."}, {"id": "B:BP1039", "bid": "BAY254", "f": "<span class=\"glabel\" style=\"display:block\">I've never done it either; it's my first time too.<\/span>Have you volunteered before? I haven't.", "b": "<span class=\"dim\">Mais <\/span><mark>t'as déjà fait du bénévolat, toi ? Moi, jamais.<\/mark>"}, {"id": "B:BP0824", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span><mark>The tasks sound pretty straightforward<\/mark><span class=\"dim\">, and the ad even says you don't need any previous experience or training.<\/span>", "b": "<mark>Les tâches ont l'air plutôt simples<\/mark><span class=\"dim\">, et en plus, l'annonce dit même qu'y a pas besoin d'expérience ni de formation.<\/span>"}, {"id": "B:BP0836", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span><span class=\"dim\">You'd basically get to travel and work at the same time, and <\/span><mark>I don't think the actual tasks would peaker or anything.<\/span>", "b": "<mark>À la limite, ils te demanderaient peut-être d'écrire une petite critique ou de leur envoyer ton avis sur un film<\/mark><span class=\"dim\">, mais je pense pas qu'il faille être super à l'aise à l'oral ou quoi.<\/span>"}, {"id": "B:BP0822", "bid": "BAY257", "f": "<span class=\"glabel\" style=\"display:block\">This seems like something you could do.<\/span><span class=\"dim\">And, well, when I saw this ad, I thought of you right away because I know you're looking for a new job, and <\/span><mark>honestly, this seems like something you could do.<\/mark>", "b": "<span class=\"dim\">Et bah, quand j'ai vu cette annonce, j'ai tout de suite pensé à toi, vu que je sais que tu cherches un nouveau boulot — et <\/span><mark>franchement, ça a l'air d'être un truc que tu pourrais faire.<\/mark>"}, {"id": "B:BP0215", "bid": "BAY258", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to finish; just do what you can.<\/span>It's really more of a best-effort challenge. The idea is just to do as much as you can.", "b": "En vrai, c'est plus un défi où chacun fait de son mieux. L'idée, c'est juste d'en faire le plus possible."}, {"id": "B:BP0200", "bid": "BAY258", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to finish; just do what you can.<\/span>But obviously, it's not so serious that we'd have to keep going if we were completely exhausted or felt like we couldn't continue. We could stop.", "b": "<mark>Mais bon, évidemment, c'est pas sérieux au point où on serait obligés de continuer si jamais on était complètement crevés ou qu'on sentait qu'on en pouvait plus. On pourrait s'arrêter<\/mark><span class=\"dim\">, hein.<\/span>"}, {"id": "B:BP0216", "bid": "BAY258", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to finish; just do what you can.<\/span>Finishing the whole thing isn't really the point.", "b": "Aller au bout, c'est pas vraiment ce qui compte."}, {"id": "B:BP0265", "bid": "BAY259", "f": "<span class=\"glabel\" style=\"display:block\">It only feels hard because you haven't built the habits yet.<\/span><span class=\"dim\">Good things can take some effort and sacrifice, and <\/span><mark>right now it probably feels difficult because you just haven’t built those habits yet.<\/mark>", "b": "<span class=\"dim\">Les bonnes choses, ça peut demander des efforts et des sacrifices, et <\/span><mark>là, ça te paraît sûrement difficile juste parce que t'as pas encore pris le pli.<\/mark>"}, {"id": "B:BP0628", "bid": "BAY260", "f": "<span class=\"glabel\" style=\"display:block\">Preparing is normal; lots of jobs need it.<\/span>You have to prepare for a lot of jobs, so this isn't really any different.", "b": "Y a plein de jobs où il faut se préparer, donc au fond, c'est pas vraiment différent."}, {"id": "B:BP0627", "bid": "BAY260", "f": "<span class=\"glabel\" style=\"display:block\">Preparing is normal; lots of jobs need it.<\/span><span class=\"dim\">Yeah, you're right, it does take a little preparation, <\/span><mark>but that's normal.<\/mark>", "b": "<span class=\"dim\">Ouais, t'as raison, ça demande un peu de préparation, <\/span><mark>mais ça, c'est normal.<\/mark>"}, {"id": "B:BP1132", "bid": "BAY261", "f": "<span class=\"glabel\" style=\"display:block\">I think the goal is actually possible.<\/span>First: is the mission actually possible? I believe it is.", "b": "Déjà : est-ce que la mission est vraiment possible ? Moi, je pense que oui."}, {"id": "B:BP0007", "bid": "BAY262", "f": "<span class=\"glabel\" style=\"display:block\">You can learn how to do it.<\/span><mark>You can learn how to do it<\/mark><span class=\"dim\">, and I've never done it either, so it'll be my first time too.<\/span>", "b": "<mark>Ça s'apprend<\/mark><span class=\"dim\">, et puis moi non plus j'en ai jamais fait, donc ce sera ma première fois aussi.<\/span>"}, {"id": "B:BP0641", "bid": "BAY262", "f": "<span class=\"glabel\" style=\"display:block\">You can learn how to do it.<\/span>And if you're not sure how to take the kind of photos they're looking for, you could learn more through the training they offer.", "b": "Et si jamais tu sais pas trop comment faire le genre de photos qu'ils cherchent, tu pourrais en apprendre plus grâce à la formation qu'ils proposent."}, {"id": "B:BP0432", "bid": "BAY263", "f": "<span class=\"glabel\" style=\"display:block\">Professionals there will help and guide you.<\/span>There are professionals there, so you could ask them questions about repairs and maintenance, and they could guide you through it.", "b": "Y a des pros là-bas, du coup tu pourrais leur poser des questions sur les réparations et l'entretien, et ils pourraient te guider."}, {"id": "B:BP0425", "bid": "BAY263", "f": "<span class=\"glabel\" style=\"display:block\">Professionals there will help and guide you.<\/span>Plus, there are professionals on site who can give you advice and help you out if you’re not sure what you’re doing.", "b": "Et en plus, y a des pros sur place qui peuvent te conseiller et te filer un coup de main si tu sais pas trop ce que tu fais."}, {"id": "B:BP0436", "bid": "BAY263", "f": "<span class=\"glabel\" style=\"display:block\">Professionals there will help and guide you.<\/span>Even if you’re worried about doing something wrong, that’s what the professionals are there for.", "b": "Même si t'as peur de faire une bêtise, les pros, ils sont là pour ça."}, {"id": "B:BP0437", "bid": "BAY263", "f": "<span class=\"glabel\" style=\"display:block\">Professionals there will help and guide you.<\/span><mark>You can ask them questions and make sure you’re doing the repair properly<\/mark><span class=\"dim\">, so you really don’t have to worry about being completely on your own.<\/span>", "b": "<mark>Tu peux leur poser des questions et t'assurer que tu fais la réparation comme il faut<\/mark><span class=\"dim\">, donc t'as vraiment pas à t'inquiéter de te retrouver complètement livré à toi-même.<\/span>"}, {"id": "B:BP0916", "bid": "BAY263", "f": "<span class=\"glabel\" style=\"display:block\">Professionals there will help and guide you.<\/span>And if you didn’t know how to do something, there’d be professionals there, so you could just ask them.", "b": "Et si jamais tu savais pas faire un truc, y aurait des professionnels sur place, donc t'aurais qu'à leur demander."}, {"id": "B:BP1064", "bid": "BAY263", "f": "<span class=\"glabel\" style=\"display:block\">Professionals there will help and guide you.<\/span>There'll be supervisors around us, mentoring us, guiding us.", "b": "Y aura des encadrants autour de nous, qui vont nous accompagner, nous guider."}, {"id": "B:BP1063", "bid": "BAY264", "f": "<span class=\"glabel\" style=\"display:block\">They won't let people with no experience do whatever they want.<\/span>They're not gonna let random strangers without any experience dealing with seniors just go do whatever.", "b": "Ils vont pas laisser des parfaits inconnus sans aucune expérience avec les seniors aller faire n'importe quoi."}, {"id": "B:BP1065", "bid": "BAY265", "f": "<span class=\"glabel\" style=\"display:block\">There's a safety net, so it's safe to fail.<\/span>There's a safety net underneath us, so it's safe enough to fail but also high-pressure enough for us to grow.", "b": "On a un filet de sécurité sous les pieds : du coup, on peut se planter sans risque, mais y a quand même assez de pression pour qu'on grandisse."}, {"id": "B:BP0431", "bid": "BAY266", "f": "<span class=\"glabel\" style=\"display:block\">You won't be left on your own.<\/span>You wouldn’t just be left on your own.", "b": "Tu te retrouverais pas tout seul dans ton coin."}, {"id": "B:BP0438", "bid": "BAY266", "f": "<span class=\"glabel\" style=\"display:block\">You won't be left on your own.<\/span><span class=\"dim\">You can ask them questions and make sure you’re doing the repair properly, so <\/span><mark>you really don’t have to worry about being completely on your own.<\/mark>", "b": "<span class=\"dim\">Tu peux leur poser des questions et t'assurer que tu fais la réparation comme il faut, donc <\/span><mark>t'as vraiment pas à t'inquiéter de te retrouver complètement livré à toi-même.<\/mark>"}, {"id": "B:BP0828", "bid": "BAY267", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't be the only one doing it.<\/span>And you probably wouldn't be the only guide there anyway.", "b": "Et puis de toute façon, tu serais sûrement pas le seul accompagnateur."}, {"id": "B:BP0260", "bid": "BAY268", "f": "<span class=\"glabel\" style=\"display:block\">It's close to having in-person support.<\/span><span class=\"dim\">And yeah, I know it’s not in person, but <\/span><mark>it sounds like it’s pretty close to having that kind of support.<\/mark>", "b": "<span class=\"dim\">Et ouais, je sais bien que c'est pas en face à face, mais <\/span><mark>on dirait que ça se rapproche pas mal de ce genre d'accompagnement.<\/mark>"}, {"id": "B:BP0269", "bid": "BAY269", "f": "<span class=\"glabel\" style=\"display:block\">Doing it with support is easier than alone.<\/span>You could try to do everything completely on your own, without any practical tips or professional advice, or you could do it with support from people who know what they’re doing. I just think the second option would make the whole process easier.", "b": "Soit t'essaies de tout faire tout seul dans ton coin, sans conseils concrets ni avis de pro, soit tu le fais accompagné par des gens qui savent ce qu'ils font. Et moi, je me dis juste que la deuxième option, ça rendrait tout ça bien plus simple."}, {"id": "B:BP0270", "bid": "BAY269", "f": "<span class=\"glabel\" style=\"display:block\">Doing it with support is easier than alone.<\/span>If you’re going to start this whole journey of improving the way you eat anyway, I think doing it with that kind of support would be a better way to go, because there’d just be less friction.", "b": "<span class=\"dim\">Et <\/span><mark>si tu comptes de toute manière te lan en, donc tu pourrais sûrement t'organiser en fonction de ton emploi du temps et choisir les créneaux qui t'arrangent."}, {"id": "B:BP0448", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span><span class=\"dim\">You could just use the garage for simpler problems, or <\/span><mark>go there on a weekend when you have a few hours and want to work on something or learn a bit more.<\/mark>", "b": "<span class=\"dim\">À la limite, tu pourrais juste utiliser le garage pour les petits pépins, ou <\/span><mark>y aller un week-end quand t'as quelques heures devant toi et que t'as envie de bricoler un peu ou d'en apprendre plus.<\/mark>"}, {"id": "B:BP0368", "bid": "BAY297", "f": "<span class=\"glabel\" style=\"display:block\">Just ask them for a time slot that fits you.<\/span>You just contact the shelter and ask if they have a time slot that works with your schedule.", "b": "T'as juste à contacter le refuge et leur demander s'ils ont un créneau qui colle avec ton emploi du temps."}, {"id": "B:BP0062", "bid": "BAY298", "f": "<span class=\"glabel\" style=\"display:block\">Check your schedule and see if you can fit it in.<\/span><span class=\"dim\">It’s only on the last Friday of the month, so <\/span><mark>you could check your schedule again and see if you can fit it in.<\/mark>", "b": "<span class=\"dim\">C'est que le dernier vendredi du mois, du coup <\/span><mark>tu pourrais rejeter un coup d'œil à ton emploi du temps, et voir si tu peux caser ça.<\/mark>"}, {"id": "B:BP0315", "bid": "BAY299", "f": "<span class=\"glabel\" style=\"display:block\">Maybe it's at a time when you're free.<\/span>And maybe it’ll be on a Sunday. If it is, you could go because you don’t work Sundays.", "b": "Et puis ça tombera peut-être un dimanche. Si c'est le cas, tu pourrais y aller, vu que tu travailles pas le dimanche."}, {"id": "B:BP0317", "bid": "BAY299", "f": "<span class=\"glabel\" style=\"display:block\">Maybe it's at a time when you're free.<\/span>And even if it isn’t on a Sunday, maybe it could be after work.", "b": "Et même si c'est pas un dimanche, à la limite, ça pourrait être après le boulot."}, {"id": "B:BP0235", "bid": "BAY300", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do it right away.<\/span><span class=\"dim\">And <\/span><mark>if you're worried about not having enough time right now, I don't think this is something you have to do immediately. You could maybe do it next month, or in a couple of months.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si t'as peur de pas avoir assez de temps en ce moment, je pense pas que ce soit un truc à faire tout de suite. Tu pourrais peut-être le faire le mois prochain, ou dans deux-trois mois.<\/mark>"}, {"id": "B:BP0148", "bid": "BAY301", "f": "<span class=\"glabel\" style=\"display:block\">Waiting isn't really an obstacle.<\/span><span class=\"dim\">And I get what you mean about having to wait for the plants to grow, but <\/span><mark>I don’t really think that’s an obstacle.<\/mark>", "b": "<span class=\"dim\">Et je vois ce que tu veux dire sur le fait de devoir attendre que les plantes poussent, mais <\/span><mark>je trouve pas vraiment que ce soit un obstacle.<\/mark>"}, {"id": "B:BP0150", "bid": "BAY302", "f": "<span class=\"glabel\" style=\"display:block\">While you wait, you can do something else.<\/span><span class=\"dim\">You’d probably spend a weekend planting the seeds and getting everything set up, and then <\/span><mark>while you’re waiting for them to grow, you could still look for another hobby.<\/mark>", "b": "<span class=\"dim\">Tu passerais sans doute un week-end à planter les graines et à tout mettre en place, et après, <\/span><mark>en attendant que ça pousse, tu pourrais toujours chercher un autre passe-temps.<\/mark>"}, {"id": "B:BP0872", "bid": "BAY303", "f": "<span class=\"glabel\" style=\"display:block\">Ask your employer to adjust things.<\/span>I think it’s worth talking to them and seeing whether they can make some adjustments so you can actually take the time off.", "b": "Je pense que ça vaut le coup d'en parler avec eux et de voir s'ils peuvent s'arranger pour que tu puisses vraiment poser tes congés."}, {"id": "B:BP0236", "bid": "BAY303", "f": "<span class=\"glabel\" style=\"display:block\">Ask your employer to adjust things.<\/span>And actually, you could even talk to your employer and see if you could work something out, like doing some of your work online or remotely while you're away.", "b": "Et d'ailleurs, tu pourrais même en parler à ton employeur, voir si y a moyen de s'arranger — par exemple faire une partie de ton boulot en ligne ou à distance pendant que t'es pas là."}, {"id": "B:BP0878", "bid": "BAY304", "f": "<span class=\"glabel\" style=\"display:block\">At least try to adjust and make it work.<\/span>You could at least try to make some adjustments and see if you can make it work.", "b": "Tu pourrais au moins essayer de t'organiser un peu et voir si ça peut le faire."}, {"id": "B:BP0876", "bid": "BAY305", "f": "<span class=\"glabel\" style=\"display:block\">Maybe you'd get some days off for it.<\/span>Maybe you could get ten days off, and then we could do the trip for ten days.", "b": "Si ça se trouve, tu pourrais avoir dix jours de congé, et là, on pourrait faire le voyage sur dix jours."}, {"id": "B:BP0871", "bid": "BAY306", "f": "<span class=\"glabel\" style=\"display:block\">Don't let your employer decide how you live.<\/span>And about work, you shouldn’t let your employer completely decide how you get to spend your life.", "b": "Et pour le boulot, tu devrais pas laisser ta boîte décider complètement de comment tu vis ta vie."}, {"id": "B:BP0877", "bid": "BAY307", "f": "<span class=\"glabel\" style=\"display:block\">Don't miss this just because of your schedule.<\/span>I just don’t think you should let this opportunity pass because it doesn’t fit perfectly into your schedule right now.", "b": "Moi, je trouve juste que tu devrais pas laisser passer cette occasion sous prétexte que ça colle pas parfaitement avec ton emploi du temps en ce moment."}, {"id": "B:BP1155", "bid": "BAY308", "f": "<span class=\"glabel\" style=\"display:block\">Do it instead of scrolling social media.<\/span>Look at your schedule, and if you see stuff that's a waste of time, like scrolling on social media, you can replace it with this.", "b": "Regarde ton emploi du temps, et si tu vois des trucs qui te font perdre ton temps, comme traîner sur les réseaux, tu peux les remplacer par ça."}, {"id": "B:BP0952", "bid": "BAY308", "f": "<span class=\"glabel\" style=\"display:block\">Do it instead of scrolling social media.<\/span>Maybe this can be just something that you do instead of scrolling social media when you're on the commute.", "b": "À la limite, ça pourrait juste être un truc que tu fais dans les transports, à la place de traîner sur les réseaux."}, {"id": "B:BP1154", "bid": "BAY309", "f": "<span class=\"glabel\" style=\"display:block\">We all have 24 hours; 'no time' means other priorities.<\/span>When we say we don't have time, I always reframe it: we all have the same 24 hours a day, so it just means we're prioritizing other things over this.", "b": "Quand on dit qu'on a pas le temps, moi, je retourne toujours le truc : on a tous les mêmes 24 heures dans une journée, donc en fait, ça veut juste dire qu'on fait passer d'autres choses avant."}, {"id": "B:BP1114", "bid": "BAY310", "f": "<span class=\"glabel\" style=\"display:block\">No one is too busy right now.<\/span>I don't think it's a problem of everyone being really busy, because it's summer and we're just students.", "b": "<span class=\"dim\">Honnêtement, <\/span><mark>je pense pas que le souci, ce soit que tout le monde est vraiment débordé — c'est l'été, et on est que des étudiants.<\/mark>"}, {"id": "B:BP1115", "bid": "BAY311", "f": "<span class=\"glabel\" style=\"display:block\">If we don't do it now, we won't have time later.<\/span>If we don't spend time doing these kinds of stuff when we're this young, we won't have the time five years down the line, when we're all deep in our careers, with all these responsibilities that we don't have right now.", "b": "Si on passe pas du temps à faire ce genre de trucs tant qu'on est aussi jeunes, on aura plus le temps dans cinq ans, quand on sera tous à fond dans nos carrières, avec toutes ces responsabilités qu'on a pas pour l'instant."}, {"id": "B:BP0966", "bid": "BAY312", "f": "<span class=\"glabel\" style=\"display:block\">This takes less time than the alternative.<\/span>Basically, it takes like 100 surveys for you, and then all you need to do is fill out 100 CAPTCHA forms, which is a lot, but it's less time than 100 surveys.", "b": "En gros, il te fait une centaine de sondages à ta place, et ensuite t'as plus qu'à remplir 100 formulaires CAPTCHA — bon, ça fait beaucoup, c'est vrai, mais c'est toujours moins long que 100 sondages."}, {"id": "B:BP1201", "bid": "BAY313", "f": "<span class=\"glabel\" style=\"display:block\">The in-person option is harder to fit into your schedule.<\/span>With the gym, you have to consider many more things to make it fit within your schedule.", "b": "Avec la salle de sport, par contre, t'as beaucoup plus de trucs à prendre en compte pour que ça rentre dans ton emploi du temps."}, {"id": "B:BP1203", "bid": "BAY314", "f": "<span class=\"glabel\" style=\"display:block\">The in-person place might be packed on your only free day.<\/span>Maybe you have a specific gym you wanna pick for its equipments, but you find out Wednesdays are too crowded, and Wednesday is the only day that works for you. All these other factors exist with an in-person gym.", "b": "Mettons que t'aies une salle bien précise en tête pour ses équipements, mais tu te rends compte que le mercredi, c'est bondé — et que le mercredi, justement, c'est le seul jour qui t'arrange. Tous ces trucs-là, ça existe avec une salle classique."}]}, {"key": "B-BA11", "sec": "B", "code": "BA11", "name": "Your way, no hassle", "bucket": "Arguments", "items": [{"id": "B:BP0130", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>You're the one in charge.", "b": "C'est toi qui décides."}, {"id": "B:BP0095", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>It’s up to you. You get to choose the house.", "b": "C'est toi qui vois. La maison, c'est toi qui la choisis."}, {"id": "B:BP0591", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>It's your story, after all, so you'd get to choose the theme that feels right for you.", "b": "Après tout, c'est ton histoire, donc ce serait à toi de choisir le thème qui te parle vraiment."}, {"id": "B:BP0998", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>You can do this on your own terms.", "b": "Tu peux faire ça à tes conditions."}, {"id": "B:BP0999", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>You can say, \"I'm going to try this new thing, but this is my boundary. I'm not going to haggle 24/7 with people, because that's my boundary. I will not cross it. But anything within these boundaries, sure, I'll try it.\"", "b": "Tu peux te dire : « Je vais tester ce nouveau truc, mais voilà ma limite. Je vais pas marchander avec les gens 24 heures sur 24, parce que ça, c'est ma limite, et je la franchirai pas. Par contre, tout ce qui reste dans ces limites, pas de souci, j'essaie. »"}, {"id": "B:BP1126", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span><mark>If you don't wanna do something, you don't have to<\/mark><span class=\"dim\"> — it's not gonna bring down the mood, and we're still gonna invite you to future events.<\/span>", "b": "<mark>Si t'as pas envie de faire un truc, t'es pas obligé<\/mark><span class=\"dim\"> — ça va pas plomber l'ambiance, et de toute façon, on t'invitera quand même aux prochaines sorties.<\/span>"}, {"id": "B:BP0010", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>But if you really don't want to paddle, you can still come along just for the camping and the nature.", "b": "Cela dit, si vraiment t'as pas envie de pagayer, tu peux quand même venir juste pour le camping et la nature."}, {"id": "B:BP0094", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span><span class=\"dim\">And <\/span><mark>if someone says they need you to look after a house with cats and you don’t want to do that, you can just say, “No, I’m looking for something else.”<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si quelqu'un te dit qu'il a besoin que tu t'occupes d'une maison avec des chats et que t'as pas envie de faire ça, t'as qu'à dire : « Non, moi je cherche autre chose. »<\/mark>"}, {"id": "B:BP0281", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>If you’re uncomfortable going to strangers’ houses, just don’t offer anything that would require that.", "b": "Si t'es pas à l'aise à l'idée d'aller chez des inconnus, t'as qu'à pas proposer de services qui demandent ça."}, {"id": "B:BP0289", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>And if you don’t want to lend your stuff out, then don’t.", "b": "Et si t'as pas envie de prêter tes affaires, bah tu les prêtes pas, c'est tout."}, {"id": "B:BP0293", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>And either way, you’re not forced to offer anything you’re uncomfortable with.", "b": "Et dans tous les cas, on t'oblige pas à proposer des trucs qui te mettent mal à l'aise."}, {"id": "B:BP0811", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>And obviously, if you have anything sentimental, like something from your grandma or whatever, you don’t have to sell that.", "b": "Et évidemment, si t'as des trucs qui ont une valeur sentimentale, comme un objet de ta grand-mère ou je sais pas quoi, ça, t'es pas obligé de le vendre."}, {"id": "B:BP0812", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>Just sell the things you’re actually comfortable getting rid of.", "b": "Vends juste les trucs dont t'as vraiment pas de mal à te séparer."}, {"id": "B:BP0810", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span><span class=\"dim\">You can just negotiate a little, see how it goes, and <\/span><mark>you don’t have to sell everything anyway.<\/mark>", "b": "<span class=\"dim\">T'as qu'à négocier un peu, voir comment ça se passe, et <\/span><mark>de toute façon, t'es pas obligé de tout vendre.<\/mark>"}, {"id": "B:BP0443", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>And I’m not saying you have to start doing every single repair yourself.", "b": "Et je dis pas que tu dois te mettre à faire absolument toutes les réparations toi-même."}, {"id": "B:BP0446", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>But you don’t have to.", "b": "Mais t'es pas obligé non plus."}, {"id": "B:BP0541", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span><span class=\"dim\">I think it could be really fun, and <\/span><mark>we could just get tickets for one day, or maybe a few days if we wanted.<\/mark>", "b": "<span class=\"dim\">Je me dis que ça pourrait être vraiment sympa, et <\/span><mark>on pourrait prendre des billets juste pour une journée, ou pour quelques jours si ça nous dit.<\/mark>"}, {"id": "B:BP0551", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>Plus, we don’t have to get tickets for all four days.", "b": "En plus, on est pas obligés de prendre des billets pour les quatre jours."}, {"id": "B:BP0447", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span><mark>You could just use the garage for simpler problems<\/mark><span class=\"dim\">, or go there on a weekend when you have a few hours and want to work on something or learn a bit more.<\/span>", "b": "<mark>À la limite, tu pourrais juste utiliser le garage pour les petits pépins<\/mark><span class=\"dim\">, ou y aller un week-end quand t'as quelques heures devant toi et que t'as envie de bricoler un peu ou d'en apprendre plus.<\/span>"}, {"id": "B:BP0991", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>You don't even have to use this website for buying stuff.", "b": "T'es même pas obligé d'utiliser ce site pour acheter des trucs."}, {"id": "B:BP0992", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>You can just use it for selling, so that way you earn money.", "b": "Tu peux juste t'en servir pour vendre, comme ça tu gagnes de l'argent."}, {"id": "B:BP1186", "bid": "BAY318", "f": "<span class=\"glabel\" style=\"display:block\">You'd only have to do one small part.<\/span>Maybe you can just help me a bit with the recipes and what ingredients you think might be the most appropriate.", "b": "Toi, à la limite, tu pourrais juste m'aider un peu sur les recettes et les ingrédients qui te semblent les plus adaptés."}, {"id": "B:BP0965", "bid": "BAY318", "f": "<span class=\"glabel\" style=\"display:block\">You'd only have to do one small part.<\/span>Then all you need to do is take the CAPTCHA quizzes that verifies your identity as a human.", "b": "Après, tout ce qui te reste à faire, c'est les tests CAPTCHA qui vérifient que t'es bien un humain."}, {"id": "B:BP0673", "bid": "BAY319", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't have to do it for lots of people every time.<\/span>And you wouldn’t have to cook for a bunch of people every single time either.", "b": "Et t'aurais pas non plus à faire à manger pour plein de monde à chaque fois."}, {"id": "B:BP0565", "bid": "BAY320", "f": "<span class=\"glabel\" style=\"display:block\">It's not only the part you don't like.<\/span>It wouldn’t just be music, so you shouldn’t say no just because you don’t love music or don’t want to listen to it all day.", "b": "Ce serait pas que de la musique, alors tu devrais pas dire non juste parce que t'adores pas la musique ou que t'as pas envie d'en écouter toute la journée."}, {"id": "B:BP0560", "bid": "BAY320", "f": "<span class=\"glabel\" style=\"display:block\">It's not only the part you don't like.<\/span><span class=\"dim\">You’re right that spending hours at a festival could get tiring, but <\/span><mark>we wouldn’t have to listen to music the entire time.<\/mark>", "b": "<span class=\"dim\">T'as raison, passer des heures dans un festival, ça peut être fatigant, mais <\/span><mark>on serait pas obligés d'écouter de la musique tout le temps.<\/mark>"}, {"id": "B:BP1133", "bid": "BAY321", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't have to be in that form.<\/span><span class=\"dim\">And <\/span><mark>it doesn't have to be brochures<\/mark><span class=\"dim\"> — I don't think handing out brochures is effective.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>c'est pas obligé que ce soit des brochures<\/mark><span class=\"dim\"> — distribuer des brochures, je trouve pas ça efficace.<\/span>"}, {"id": "B:BP0668", "bid": "BAY322", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to push people.<\/span><span class=\"dim\">You don’t have to overdo it, and <\/span><mark>you definitely don’t have to push people hard to buy anything.<\/mark>", "b": "<span class=\"dim\">T'es pas obligé d'en faire des tonnes, et surtout, <\/span><mark>t'as vraiment pas à mettre la pression aux gens pour qu'ils achètent quoi que ce soit.<\/mark>"}, {"id": "B:BP0652", "bid": "BAY322", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to push people.<\/span>But you wouldn’t have to push your friends hard or treat it like some serious job.", "b": "Mais t'aurais pas à forcer la main à tes potes, ni à prendre ça comme un job super sérieux."}, {"id": "B:BP0670", "bid": "BAY322", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to push people.<\/span>If your friends aren’t interested, fine—you don’t have to keep trying to sell it to them.", "b": "Et si tes potes sont pas intéressés, tant pis — t'as pas besoin d'insister pour leur vendre le truc."}, {"id": "B:BP0669", "bid": "BAY323", "f": "<span class=\"glabel\" style=\"display:block\">You can keep it casual; don't overdo it.<\/span>You could just keep it really chill.", "b": "Tu pourrais juste faire ça hyper tranquille."}, {"id": "B:BP0654", "bid": "BAY323", "f": "<span class=\"glabel\" style=\"display:block\">You can keep it casual; don't overdo it.<\/span>Like, if you were already having friends over for something, you could casually bring it up as a little extra thing.", "b": "Par exemple, si t'avais déjà des potes qui venaient chez toi pour un truc, tu pourrais amener le sujet l'air de rien, comme un petit extra."}, {"id": "B:BP0667", "bid": "BAY323", "f": "<span class=\"glabel\" style=\"display:block\">You can keep it casual; don't overdo it.<\/span><mark>You don’t have to overdo it<\/mark><span class=\"dim\">, and you definitely don’t have to push people hard to buy anything.<\/span>", "b": "<mark>T'es pas obligé d'en faire des tonnes<\/mark><span class=\"dim\">, et surtout, t'as vraiment pas à mettre la pression aux gens pour qu'ils achètent quoi que ce soit.<\/span>"}, {"id": "B:BP0809", "bid": "BAY324", "f": "<span class=\"glabel\" style=\"display:block\">Just try a little and see how it goes.<\/span><mark>You can just negotiate a little, see how it goes<\/mark><span class=\"dim\">, and you don’t have to sell everything anyway.<\/span>", "b": "<mark>T'as qu'à négocier un peu, voir comment ça se passe<\/mark><span class=\"dim\">, et de toute façon, t'es pas obligé de tout vendre.<\/span>"}, {"id": "B:BP0312", "bid": "BAY325", "f": "<span class=\"glabel\" style=\"display:block\">There are lots of different options.<\/span><span class=\"dim\">Yeah, I get that, but <\/span><mark>there are different kinds of jobs you could do.<\/mark>", "b": "<span class=\"dim\">Ouais, ça je comprends, mais <\/span><mark>y a plein de trucs différents à faire.<\/mark>"}, {"id": "B:BP0161", "bid": "BAY325", "f": "<span class=\"glabel\" style=\"display:block\">There are lots of different options.<\/span>There are lots of different kinds of gardening.", "b": "Y a plein de façons différentes de jardiner."}, {"id": "B:BP0590", "bid": "BAY325", "f": "<span class=\"glabel\" style=\"display:block\">There are lots of different options.<\/span>And there are several themes to choose from, so you could just pick the one you like best and tell your story around that.", "b": "Et y a plusieurs thèmes au choix, du coup tu pourrais juste prendre celui qui te plaît le plus et raconter ton histoire autour de ça."}, {"id": "B:BP1196", "bid": "BAY326", "f": "<span class=\"glabel\" style=\"display:block\">If one option doesn't suit you, just pick another one.<\/span><span class=\"dim\">So <\/span><mark>even if you find that a particular exercise feels awkward for you — maybe it hurts your joints or something — you can just choose another exercise out of this massive library.<\/mark>", "b": "<span class=\"dim\">Alors <\/span><mark>même si tu tombes sur un exercice qui te va pas trop — mettons qu'il te fasse mal aux articulations ou un truc comme ça — t'as qu'à en prendre un autre dans cette énorme bibliothèque.<\/mark>"}, {"id": "B:BP0131", "bid": "BAY326", "f": "<span class=\"glabel\" style=\"display:block\">If one option doesn't suit you, just pick another one.<\/span><span class=\"dim\">And <\/span><mark>even if there's one thing you don't really feel comfortable talking about, that's not the only thing you could talk about. There'd be other topics.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>même s'il y a un sujet que ça te gêne un peu d'aborder, c'est pas le seul truc dont tu pourrais parler. Y en aurait d'autres, des sujets.<\/mark>"}, {"id": "B:BP0314", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>You could choose something else, maybe something in an area where there wouldn’t be loads of kids running around.", "b": "Tu pourrais choisir autre chose, peut-être un truc dans un coin où y aurait pas des tas de gamins qui courent partout."}, {"id": "B:BP0092", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>You obviously shouldn’t choose a house where they expect you to do a ton of complicated stuff or maintain all kinds of things. Maybe you’d be able to pick one of the simpler houses.", "b": "Évidemment, faut pas que tu choisisses une maison où ils attendent de toi que tu fasses un tas de trucs compliqués ou que t'entretiennes trente-six mille choses. Tu pourrais peut-être te choisir une des maisons les plus simples."}, {"id": "B:BP0290", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>You could just choose services that feel much lower-risk to you.", "b": "Tu pourrais juste choisir des services qui te paraissent bien moins risqués."}, {"id": "B:BP0386", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>You could possibly help with administrative tasks or something like that.", "b": "À la limite, tu pourrais t'occuper de la partie administrative, un truc dans le genre."}, {"id": "B:BP0385", "bid": "BAY328", "f": "<span class=\"glabel\" style=\"display:block\">There might even be an option without that part.<\/span>Or maybe there are volunteer tasks where you don’t have to be in direct contact with the animals at all.", "b": "Ou alors, y a peut-être des trucs à faire, comme bénévole, où t'as pas du tout besoin d'être en contact direct avec les animaux."}, {"id": "B:BP0162", "bid": "BAY328", "f": "<span class=\"glabel\" style=\"display:block\">There might even be an option without that part.<\/span>Maybe they even have something about indoor gardening or houseplants.", "b": "Peut-être même qu'ils ont un truc sur le jardinage d'intérieur ou les plantes d'appartement."}, {"id": "B:BP0294", "bid": "BAY329", "f": "<span class=\"glabel\" style=\"display:block\">You could stick to things you can do online.<\/span>There are probably tons of things you could do entirely online anyway, like writing emails or helping with other simple stuff.", "b": "De toute façon, y a sûrement plein de trucs que tu pourrais faire entièrement en ligne, comme écrire des mails ou donner un coup de main pour d'autres trucs simples."}, {"id": "B:BP0282", "bid": "BAY329", "f": "<span class=\"glabel\" style=\"display:block\">You could stick to things you can do online.<\/span>You could stick to services you can do in a public place, or even things you can do completely online.", "b": "À la limite, tu pourrais t'en tenir à des services que tu peux rendre dans un lieu public, ou même à des trucs que tu peux faire complètement en ligne."}, {"id": "B:BP1204", "bid": "BAY330", "f": "<span class=\"glabel\" style=\"display:block\">You can do it from home; no need to go anywhere.<\/span><span class=\"dim\">But <\/span><mark>with this one, you're doing it all from the comfort of your own home.<\/mark>", "b": "<span class=\"dim\">Alors que <\/span><mark>là, pour le coup, tu fais tout depuis chez toi, bien tranquille.<\/mark>"}, {"id": "B:BP0295", "bid": "BAY330", "f": "<span class=\"glabel\" style=\"display:block\">You can do it from home; no need to go anywhere.<\/span>You wouldn’t necessarily have to meet anyone or even go to a public place.", "b": "T'aurais pas forcément besoin de rencontrer qui que ce soit, ni même d'aller dans un lieu public."}, {"id": "B:BP0925", "bid": "BAY330", "f": "<span class=\"glabel\" style=\"display:block\">You can do it from home; no need to go anywhere.<\/span><mark>You don’t have to go there in person<\/mark><span class=\"dim\">, and you get access to loads of books online in digital format.<\/span>", "b": "<mark>T'as pas besoin d'y aller en personne<\/mark><span class=\"dim\">, et t'as accès à plein de livres en ligne, au format numérique.<\/span>"}, {"id": "B:BP0390", "bid": "BAY331", "f": "<span class=\"glabel\" style=\"display:block\">That's still an option too.<\/span>So that’s something you could do too.", "b": "Du coup, ça aussi, c'est un truc que tu pourrais faire."}, {"id": "B:BP0388", "bid": "BAY331", "f": "<span class=\"glabel\" style=\"display:block\">That's still an option too.<\/span><span class=\"dim\">Yeah, I know you told me you’re allergic to animals, but <\/span><mark>that could still be an alternative.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais, tu m'as dit que t'étais allergique aux animaux, mais <\/span><mark>ça pourrait quand même être une alternative.<\/mark>"}, {"id": "B:BP0933", "bid": "BAY332", "f": "<span class=\"glabel\" style=\"display:block\">It's good to have another option when you need it.<\/span>I just think it’s good to have another option.", "b": "Je trouve juste que c'est bien d'avoir une autre option."}, {"id": "B:BP0944", "bid": "BAY332", "f": "<span class=\"glabel\" style=\"display:block\">It's good to have another option when you need it.<\/span>It’s just a good alternative to have there when you need it.", "b": "C'est juste une bonne alternative à avoir sous la main pour quand t'en as besoin."}, {"id": "B:BP0299", "bid": "BAY332", "f": "<span class=\"glabel\" style=\"display:block\">It's good to have another option when you need it.<\/span><mark>At the end of the day, I just think it could be a useful option to have if you ever need it<\/mark><span class=\"dim\">, and it seems interesting.<\/span>", "b": "<mark>Au final, je trouve juste que ça pourrait être une option utile à avoir sous le coude si jamais t'en as besoin<\/mark><span class=\"dim\">, et ça a l'air intéressant.<\/span>"}, {"id": "B:BP0934", "bid": "BAY333", "f": "<span class=\"glabel\" style=\"display:block\">If you don't feel like going out, you can do it online instead.<\/span><span class=\"dim\">Like, <\/span><mark>if it’s raining and you really don’t feel like going all the way to the library, you could just use the online one and read something digitally.<\/mark>", "b": "<span class=\"dim\">Par exemple, <\/span><mark>s'il pleut et que t'as vraiment pas envie de faire tout le trajet jusqu'à la bibliothèque, tu pourrais très bien utiliser celle en ligne et lire un truc en numérique.<\/mark>"}, {"id": "B:BP0450", "bid": "BAY334", "f": "<span class=\"glabel\" style=\"display:block\">If needed, you can still fall back on the usual way.<\/span>And if you’re too busy, it doesn’t fit your schedule, or you need something fixed urgently, then of course you can still go to a mechanic.", "b": "Et si t'es trop pris, que ça colle pas avec ton emploi du temps ou que t'as un truc à faire réparer en urgence, là évidemment, tu peux toujours aller chez un garagiste."}, {"id": "B:BP0939", "bid": "BAY334", "f": "<span class=\"glabel\" style=\"display:block\">If needed, you can still fall back on the usual way.<\/span><span class=\"dim\">And <\/span><mark>even if you couldn’t, you could always go to the library afterward to keep reading it, or buy the book if you really wanted to.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>même si tu pouvais pas, tu pourrais toujours aller à la bibliothèque après pour continuer à le lire, ou l'acheter si t'y tenais vraiment.<\/mark>"}, {"id": "B:BP0348", "bid": "BAY335", "f": "<span class=\"glabel\" style=\"display:block\">The itinerary is flexible.<\/span>And like I said, the itinerary is flexible.", "b": "Et comme je t'ai dit, l'itinéraire est flexible."}, {"id": "B:BP0342", "bid": "BAY335", "f": "<span class=\"glabel\" style=\"display:block\">The itinerary is flexible.<\/span>The ad also says the itineraries can be changed, so we'd have some flexibility.", "b": "D'ailleurs, l'annonce dit aussi qu'on peut changer les itinéraires, comme ça on aurait un peu de souplesse."}, {"id": "B:BP0349", "bid": "BAY336", "f": "<span class=\"glabel\" style=\"display:block\">We can choose our own route to suit us.<\/span>So if you don't like the routes the local guides suggest, we could choose our own instead.", "b": "Du coup, si les trajets que proposent les guides locaux te plaisent pas, on pourrait choisir les nôtres à la place."}, {"id": "B:BP0343", "bid": "BAY336", "f": "<span class=\"glabel\" style=\"display:block\">We can choose our own route to suit us.<\/span>We could choose our route and our schedule depending on the weather instead of being stuck with one fixed plan.", "b": "On pourrait choisir notre trajet et nos horaires en fonction de la météo, au lieu d'être coincés avec un seul programme fixe."}, {"id": "B:BP0351", "bid": "BAY336", "f": "<span class=\"glabel\" style=\"display:block\">We can choose our own route to suit us.<\/span>And the pace of the trip would depend on the itinerary we choose, so we could find something that suits us.", "b": "Et le rythme du voyage dépendrait de l'itinéraire qu'on choisit, donc on pourrait trouver un truc qui nous va."}, {"id": "B:BP0340", "bid": "BAY337", "f": "<span class=\"glabel\" style=\"display:block\">We could go at a time of year with better weather.<\/span>We could also go at a time of year when it doesn't rain much.", "b": "On pourrait aussi y aller à une période de l'année où il pleut pas beaucoup."}, {"id": "B:BP0341", "bid": "BAY338", "f": "<span class=\"glabel\" style=\"display:block\">If it rains, we can stop and do something indoors.<\/span>And even if it did rain, we could just stop for a while and do something indoors.", "b": "Et même s'il pleuvait, au pire on s'arrêterait un moment et on ferait un truc à l'intérieur."}, {"id": "B:BP0350", "bid": "BAY339", "f": "<span class=\"glabel\" style=\"display:block\">Maybe we could even drive it ourselves.<\/span>Maybe there'd even be an option for us to drive the tuk-tuk ourselves.", "b": "Peut-être même qu'il y aurait moyen de conduire le tuk-tuk nous-mêmes."}, {"id": "B:BP0550", "bid": "BAY340", "f": "<span class=\"glabel\" style=\"display:block\">If it gets too crowded, we can go somewhere quieter.<\/span>If you started feeling claustrophobic or overwhelmed, we could just go somewhere less busy.", "b": "Et si jamais tu commençais à te sentir claustrophobe ou que c'était trop pour toi, on aurait qu'à aller dans un endroit moins bondé."}, {"id": "B:BP0549", "bid": "BAY340", "f": "<span class=\"glabel\" style=\"display:block\">If it gets too crowded, we can go somewhere quieter.<\/span>But even if there are a lot of people, I’m sure there’ll still be some quieter spots where we could get away from the crowd for a bit.", "b": "Mais même s'il y a beaucoup de monde, c'est sûr qu'il y aurait quand même des coins plus tranquilles où on pourrait s'éloigner un peu de la foule."}, {"id": "B:BP0563", "bid": "BAY341", "f": "<span class=\"glabel\" style=\"display:block\">We could sit down and rest for a while.<\/span><span class=\"dim\">We could go to some of the debates, check out the food stands, try some organic and local food, or <\/span><mark>just sit down on a bench somewhere and rest for a while.<\/mark>", "b": "<span class=\"dim\">On pourrait aller voir quelques débats, faire un tour aux stands de bouffe, goûter des trucs bio et locaux, ou <\/span><mark>juste se poser sur un banc quelque part et souffler un moment.<\/mark>"}, {"id": "B:BP0016", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span><span class=\"dim\">It'll be way more relaxing for you, and <\/span><mark>I can handle all the sporty, exhausting stuff.<\/mark>", "b": "<span class=\"dim\">Ce sera carrément plus reposant pour toi, et <\/span><mark>moi, je m'occupe de tout le côté sportif et crevant.<\/mark>"}, {"id": "B:BP0013", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>I can paddle and you can just sit behind me in the canoe.", "b": "Moi je pagaie, et toi, t'as juste à t'asseoir derrière moi dans le canoë."}, {"id": "B:BP0022", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>I'm gonna make sure we've thought everything through.", "b": "Je vais faire en sorte qu'on ait pensé à tout."}, {"id": "B:BP0209", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>As for finding the rest of the team, leave that to me. I can find three other cyclists pretty easily, so I'll take care of that.", "b": "Pour ce qui est de trouver le reste de l'équipe, laisse-moi faire. Je peux trouver trois autres cyclistes assez facilement, je m'en charge."}, {"id": "B:BP1184", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>I'm the one who suggested this idea, so I can do the shopping and the organization and logistics.", "b": "<span class=\"dim\">Bon, <\/span><mark>c'est moi qui ai proposé l'idée, donc je peux faire les courses et gérer l'organisation et la logistique.<\/mark>"}, {"id": "B:BP1185", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>We're hosting it in my own kitchen anyway, so I can take care of it.", "b": "De toute façon, on fait ça dans ma cuisine, je peux m'en occuper."}, {"id": "B:BP0014", "bid": "BAY343", "f": "<span class=\"glabel\" style=\"display:block\">That way you don't even have to learn how.<\/span>That way you don't even have to learn how to do it.", "b": "Comme ça, t'as même pas besoin d'apprendre."}, {"id": "B:BP0015", "bid": "BAY344", "f": "<span class=\"glabel\" style=\"display:block\">It'll be much more relaxing for you.<\/span><mark>It'll be way more relaxing for you<\/mark><span class=\"dim\">, and I can handle all the sporty, exhausting stuff.<\/span>", "b": "<mark>Ce sera carrément plus reposant pour toi<\/mark><span class=\"dim\">, et moi, je m'occupe de tout le côté sportif et crevant.<\/span>"}, {"id": "B:BP0017", "bid": "BAY345", "f": "<span class=\"glabel\" style=\"display:block\">I'm going to learn how before we go anyway.<\/span><span class=\"dim\">And <\/span><mark>I'm gonna learn how to paddle before we go anyway<\/mark><span class=\"dim\">, so don't be so pessimistic.<\/span>", "b": "<span class=\"dim\">Et <\/span><mark>de toute façon, je vais apprendre à pagayer avant qu'on parte<\/mark><span class=\"dim\">, alors sois pas si pessimiste.<\/span>"}, {"id": "B:BP0805", "bid": "BAY346", "f": "<span class=\"glabel\" style=\"display:block\">I can help you with it.<\/span>And like I said, I can help you with it.", "b": "Et comme je t'ai dit, je peux t'aider."}, {"id": "B:BP0455", "bid": "BAY346", "f": "<span class=\"glabel\" style=\"display:block\">I can help you with it.<\/span>I can even help you call them or look up the information if you want.", "b": "Je peux même t'aider à les appeler ou à chercher les infos, si tu veux."}, {"id": "B:BP1033", "bid": "BAY347", "f": "<span class=\"glabel\" style=\"display:block\">I'll be your backup and fill in for you.<\/span>I'll fill in the shoes for you. I'll be your backup, I'll be your understudy.", "b": "Et si jamais, je te remplacerai au pied levé. Je serai ton plan B, ta doublure."}, {"id": "B:BP1178", "bid": "BAY348", "f": "<span class=\"glabel\" style=\"display:block\">We can share the work and take turns.<\/span><mark>We can split the parts<\/mark><span class=\"dim\">, or maybe we can use your backyard.<\/span>", "b": "<mark>On peut se répartir les tâches<\/mark><span class=\"dim\">, ou sinon on peut utiliser ton jardin.<\/span>"}, {"id": "B:BP1177", "bid": "BAY348", "f": "<span class=\"glabel\" style=\"display:block\">We can share the work and take turns.<\/span>We don't all have to be in the kitchen at the same time.", "b": "On est pas obligés d'être tous dans la cuisine en même temps."}, {"id": "B:BP1075", "bid": "BAY348", "f": "<span class=\"glabel\" style=\"display:block\">We can share the work and take turns.<\/span><span class=\"dim\">And <\/span><mark>we can all take turns driving, so it's not like one of us has to drive half of the trip.<\/mark>", "b": "<span class=\"dim\">En plus, <\/span><mark>on peut tous se relayer au volant, comme ça y en a pas un qui doit se taper la moitié de la route.<\/mark>"}, {"id": "B:BP1180", "bid": "BAY349", "f": "<span class=\"glabel\" style=\"display:block\">We could do it at one of our places.<\/span>Or actually, hear me out, we could do it in my kitchen. My kitchen is way bigger than yours, so I think that might be better.", "b": "Ou alors — attends, écoute-moi — on pourrait faire ça dans ma cuisine. Elle est carrément plus grande que la tienne, alors je me dis que ce serait peut-être mieux."}, {"id": "B:BP1179", "bid": "BAY349", "f": "<span class=\"glabel\" style=\"display:block\">We could do it at one of our places.<\/span><span class=\"dim\">We can split the parts, or <\/span><mark>maybe we can use your backyard.<\/mark>", "b": "<span class=\"dim\">On peut se répartir les tâches, ou sinon <\/span><mark>on peut utiliser ton jardin.<\/mark>"}, {"id": "B:BP1187", "bid": "BAY350", "f": "<span class=\"glabel\" style=\"display:block\">We can talk to them first and move on if there's a language barrier.<\/span>We can communicate with them directly before they arrive, so if there is some kind of language barrier, right there and then we can just choose not to continue.", "b": "On peut discuter directement avec eux avant qu'ils arrivent, comme ça si jamais y a un souci de langue, on peut décider sur le moment de pas donner suite."}, {"id": "B:BP1188", "bid": "BAY350", "f": "<span class=\"glabel\" style=\"display:block\">We can talk to them first and move on if there's a language barrier.<\/span>We can communicate in English, and if they can't, we can move on to the next person on the website.", "b": "On peut communiquer en anglais, et si eux ils y arrivent pas, on passe à la personne d'après sur le site."}, {"id": "B:BP1093", "bid": "BAY351", "f": "<span class=\"glabel\" style=\"display:block\">Everyone pays upfront, so dropouts don't hurt the group.<\/span>When organizing the trip, we wouldn't go forward with the plan unless everyone has actually committed to this by paying their portion of the expenses upfront. That way, even if they bail last minute, it doesn't hurt the rest of us.", "b": "Pour l'organisation du voyage, on avancerait pas sur le plan tant que tout le monde s'est pas vraiment engagé en payant sa part des frais à l'avance. Comme ça, même si y en a qui lâchent à la dernière minute, ça pénalise pas le reste du groupe."}, {"id": , maybe longer.<\/mark>", "b": "<span class=\"dim\">Enfin, évidemment qu'ils ont besoin de leur maître, mais <\/span><mark>ils sont aussi capables de se débrouiller tout seuls pendant pas mal de temps — même des semaines, voire plus.<\/mark>"}, {"id": "B:BP0384", "bid": "BAY365", "f": "<span class=\"glabel\" style=\"display:block\">Maybe they don't have the animals you're allergic to.<\/span><span class=\"dim\">What if you contact the shelter and find out they do have spots available, and <\/span><mark>maybe they don’t even have any cats or other animals you’re allergic to?<\/mark>", "b": "<span class=\"dim\">Et imagine, tu contactes le refuge, et tu te rends compte qu'en fait ils ont des places de libres, et <\/span><mark>peut-être même qu'ils ont pas de chats ni d'autres animaux auxquels t'es allergique ?<\/mark>"}, {"id": "B:BP0920", "bid": "BAY366", "f": "<span class=\"glabel\" style=\"display:block\">There might be one tent per person.<\/span><span class=\"dim\">And <\/span><mark>I think there might be quite a few tents—maybe even one tent per person, not one tent for all 20 people.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>je pense qu'il y aurait pas mal de tentes — peut-être même une par personne, pas une seule tente pour les vingt.<\/mark>"}, {"id": "B:BP0570", "bid": "BAY367", "f": "<span class=\"glabel\" style=\"display:block\">It might be in our city, so no need to book a place.<\/span>It might even be happening right here in our city, which would mean we wouldn’t have to book an apartment or anything.", "b": "Et puis ça se trouve, ça se passe même ici, dans notre ville, ce qui voudrait dire qu'on aurait pas besoin de réserver un appart ni rien."}, {"id": "B:BP0745", "bid": "BAY368", "f": "<span class=\"glabel\" style=\"display:block\">If there's one close by, why not?<\/span>But if there's one reasonably close to us and getting there isn't too inconvenient, then why not?", "b": "Par contre, s'il y en a un pas trop loin de chez nous et que c'es  us, but <\/span><mark>the people running it are professionals and they know what they’re doing.<\/mark>", "b": "<span class=\"dim\">Après, évidemment, ça nous ferait tous flipper, mais <\/span><mark>les gens qui organisent ça, c'est des pros, ils savent ce qu'ils font.<\/mark>"}, {"id": "B:BP0045", "bid": "BAY403", "f": "<span class=\"glabel\" style=\"display:block\">They're professionals; they know what they're doing.<\/span>And listen, you really don’t need to worry about the chefs. They’re professionals. They know what they’re doing.", "b": "Et écoute, les chefs, t'as vraiment pas à t'en faire pour eux. C'est des pros, ils savent ce qu'ils font."}, {"id": "B:BP0336", "bid": "BAY404", "f": "<span class=\"glabel\" style=\"display:block\">We'd have experienced guides with us.<\/span><mark>We'd have experienced guides with us<\/mark><span class=\"dim\">, and I'm pretty sure they'd reassure us about everything, like the insurance and all the safety stuff.<\/span>", "b": "<mark>On aurait des guides expérimentés avec nous<\/mark><span class=\"dim\">, et je suis quasiment sûr qu'ils nous rassureraient sur tout ce qui est assurance et trucs de sécurité.<\/span>"}, {"id": "B:BP0333", "bid": "BAY404", "f": "<span class=\"glabel\" style=\"display:block\">We'd have experienced guides with us.<\/span><span class=\"dim\">We'd get to explore a new place and a whole new region, and <\/span><mark>we could have experienced local guides with us.<\/mark>", "b": "<span class=\"dim\">On découvrirait un nouvel endroit, toute une nouvelle région, et en plus <\/span><mark>on pourrait avoir des guides locaux expérimentés avec nous.<\/mark>"}, {"id": "B:BP0337", "bid": "BAY405", "f": "<span class=\"glabel\" style=\"display:block\">The guides would reassure us about insurance and safety.<\/span><span class=\"dim\">We'd have experienced guides with us, and <\/span><mark>I'm pretty sure they'd reassure us about everything, like the insurance and all the safety stuff.<\/mark>", "b": "<span cla
