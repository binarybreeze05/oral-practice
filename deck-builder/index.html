": "BAY407", "f": "<span class=\"glabel\" style=\"display:block\">They'd train us first, so we'd know what to do.<\/span><span class=\"dim\">I’m not totally sure what you mean, but <\/span><mark>I’m pretty sure they’d give us some kind of training before we actually jumped.<\/mark>", "b": "<span class=\"dim\">Je vois pas trop ce que tu veux dire, mais <\/span><mark>à mon avis, ils nous feraient sûrement une petite formation avant qu'on saute pour de vrai.<\/mark>"}, {"id": "B:BP0769", "bid": "BAY407", "f": "<span class=\"glabel\" style=\"display:block\">They'd train us first, so we'd know what to do.<\/span>So we wouldn’t just be thrown into it without knowing what to do.", "b": "Du coup, on serait pas balancés là-dedans sans savoir quoi faire."}, {"id": "B:BP0019", "bid": "BAY408", "f": "<span class=\"glabel\" style=\"display:block\">We'll bring the safety gear.<\/span><mark>We'll bring life jackets, obviously<\/mark><span class=\"dim\">, and we can call them beforehand and ask about safety stuff too, like whether they have medics on site or what happens if there's an emergency.<\/span>", "b": "<mark>On prendra des gilets de sauvetage, évidemment<\/mark><span class=\"dim\">, et on peut aussi les appeler avant pour poser des questions sur tout ce qui est sécurité — s'ils ont des secouristes sur place, par exemple, ou ce qui se passe en cas d'urgence.<\/span>"}, {"id": "B:BP0738", "bid": "BAY409", "f": "<span class=\"glabel\" style=\"display:block\">There's an emergency system, so you wouldn't be cut off.<\/span><span class=\"dim\">I don't know exactly how this particular one handles it, but <\/span><mark>generally they have a system for emergencies, so if someone really needed to reach you, they'd contact the organization and they'd let you know.<\/mark>", "b": "<span class=\"dim\">Après, comment ça se passe pour celui-là précisément, je sais pas, mais <\/span><mark>normalement ils ont un système pour les urgences : si jamais quelqu'un avait vraiment besoin de te joindre, il contacterait l'organisme, et eux, ils te préviendraient.<\/mark>"}, {"id": "B:BP0739", "bid": "BAY409", "f": "<span class=\"glabel\" style=\"display:block\">There's an emergency system, so you wouldn't be cut off.<\/span>So you wouldn't be completely cut off if something serious happened.", "b": "Donc tu serais pas complètement coupé de tout s'il arrivait un truc grave."}, {"id": "B:BP0735", "bid": "BAY410", "f": "<span class=\"glabel\" style=\"display:block\">You tell your family beforehand.<\/span>But usually with these kinds of digital detox stays, you let your friends and family know beforehand that you won't have access to your phone.", "b": "Mais en général, avec ce genre de séjours de détox numérique, tu préviens tes proches à l'avance que t'auras pas accès à ton téléphone."}, {"id": "B:BP0736", "bid": "BAY411", "f": "<span class=\"glabel\" style=\"display:block\">You give your family the organizers' number.<\/span>Then you give them the number of the organization running the stay.", "b": "Et ensuite, tu leur donnes le numéro de l'organisme qui gère le séjour."}, {"id": "B:BP0996", "bid": "BAY412", "f": "<span class=\"glabel\" style=\"display:block\">There's a hotline if you feel unsafe.<\/span>It's kind of like Uber in the sense that if you meet up with someone and something goes wrong or you feel unsafe, you can contact some sort of hotline.", "b": "<span class=\"dim\">En fait, <\/span><mark>c'est un peu comme Uber, dans le sens où si tu retrouves quelqu'un et que ça se passe mal ou que tu te sens pas en sécurité, tu peux appeler une sorte de numéro d'assistance.<\/mark>"}, {"id": "B:BP1166", "bid": "BAY413", "f": "<span class=\"glabel\" style=\"display:block\">They probably check that everyone is respectful.<\/span>It makes me think they do their due diligence to make sure that whoever is registered, whether it be the host or the tourists, are respectful, normal people like us, not criminals.", "b": "Du coup, je me dis qu'ils font les vérifications qu'il faut pour s'assurer que tous les inscrits, que ce soit les hôtes ou les touristes, c'est des gens respectueux, des gens normaux comme nous — pas des criminels."}, {"id": "B:BP1167", "bid": "BAY414", "f": "<span class=\"glabel\" style=\"display:block\">You can talk to them first and check them out.<\/span>And also you have this opportunity for direct communication with the traveler first on their platform, so you can do your own vetting before you invite them to your house.", "b": "Et en plus, tu peux d'abord échanger directement avec le voyageur sur leur plateforme, comme ça tu fais ton propre tri avant de l'inviter chez toi."}, {"id": "B:BP1168", "bid": "BAY415", "f": "<span class=\"glabel\" style=\"display:block\">No one just shows up at your door by surprise.<\/span>It's not like, 'Surprise, you have someone at your door,' kind of thing.", "b": "C'est pas le genre « surprise, t'as quelqu'un devant ta porte », quoi."}, {"id": "B:BP0994", "bid": "BAY416", "f": "<span class=\"glabel\" style=\"display:block\">You can do all the communication on the site.<\/span>You can do all the communication on this website.", "b": "Toute la communication, tu peux la faire sur le site."}, {"id": "B:BP0997", "bid": "BAY417", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to share personal information.<\/span>You don't have to give out your personal information to strangers.", "b": "T'es pas obligé de donner tes infos perso à des inconnus."}, {"id": "B:BP0995", "bid": "BAY417", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to share personal information.<\/span>You don't even need to show your profile photo.", "b": "T'as même pas besoin de montrer ta photo de profil."}, {"id": "B:BP0946", "bid": "BAY418", "f": "<span class=\"glabel\" style=\"display:block\">The ad says your data stays confidential.<\/span>The ad did mention that your data remains confidential.", "b": "<span class=\"dim\">N'empêche, <\/span><mark>l'annonce précisait bien que tes données restent confidentielles.<\/mark>"}, {"id": "B:BP0963", "bid": "BAY419", "f": "<span class=\"glabel\" style=\"display:block\">They already have our data anyway.<\/span>Our data is already everywhere, so it doesn't really matter.", "b": "Nos données, elles sont déjà partout, donc au final, ça change pas grand-chose."}, {"id": "B:BP0962", "bid": "BAY419", "f": "<span class=\"glabel\" style=\"display:block\">They already have our data anyway.<\/span>So what? They have this data anyway, we're just oblivious to that.", "b": "Et alors ? De toute façon, ces données, elles les ont déjà, c'est juste qu'on s'en rend pas compte."}, {"id": "B:BP0960", "bid": "BAY420", "f": "<span class=\"glabel\" style=\"display:block\">The fear about your data is overblown.<\/span>I think this whole fear of companies selling your consumer data to third parties is a bit overblown.", "b": "Moi, je trouve que toute cette peur que les boîtes revendent tes données de conso à des tiers, c'est un peu exagéré."}, {"id": "B:BP0959", "bid": "BAY421", "f": "<span class=\"glabel\" style=\"display:block\">You can get your data deleted.<\/span>There are lots of tools online these days where you can register for their services and they basically delete your personal data from any website on the internet, because they're legally obligated to when requested.", "b": "<span class=\"dim\">D'ailleurs, <\/span><mark>y a plein d'outils en ligne de nos jours où tu peux t'inscrire à leur service et, en gros, ils suppriment tes données perso de n'importe quel site sur Internet, parce que légalement, ils sont obligés de le faire quand on leur demande.<\/mark>"}, {"id": "B:BP0988", "bid": "BAY422", "f": "<span class=\"glabel\" style=\"display:block\">For expensive items, don't pay until you see them.<\/span>For expensive items, what I tend to do is to not pay until I see it in person.", "b": "Pour les articles chers, ce que je fais en général, c'est que je paye pas tant que j'ai pas vu le truc en vrai."}, {"id": "B:BP0989", "bid": "BAY423", "f": "<span class=\"glabel\" style=\"display:block\">There's buyer protection.<\/span><span class=\"dim\">And <\/span><mark>I think there's some sort of buyer protection: if you buy something and it was misleading, there's a policy that gives you some coupons or discounts for future deals.<\/mark>", "b": "<span class=\"dim\">Et en plus, <\/span><mark>je crois qu'il y a une sorte de protection de l'acheteur : si t'achètes un truc et que c'était trompeur, y a une politique qui te file des bons de réduction ou des remises pour tes prochains achats.<\/mark>"}, {"id": "B:BP0482", "bid": "BAY424", "f": "<span class=\"glabel\" style=\"display:block\">They're the experts; they can tell us more.<\/span>They’re the experts. They know way more about this stuff than I do, so they could give you the information you’re looking for.", "b": "C'est eux les experts. Ils s'y connaissent bien mieux que moi là-dedans, du coup ils pourraient te donner les infos que tu cherches."}, {"id": "B:BP0520", "bid": "BAY424", "f": "<span class=\"glabel\" style=\"display:block\">They're the experts; they can tell us more.<\/span>They’d be able to give us more information because they actually know what they’re talking about.", "b": "Eux, ils pourraient nous en dire plus, vu qu'ils savent vraiment de quoi ils parlent."}]}, {"key": "B-BA13", "sec": "B", "code": "BA13", "name": "Don't let fear decide", "bucket": "Arguments", "items": [{"id": "B:BP0018", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span><span class=\"dim\">And I'm gonna learn how to paddle before we go anyway, so <\/span><mark>don't be so pessimistic.<\/mark>", "b": "<span class=\"dim\">Et de toute façon, je vais apprendre à pagayer avant qu'on parte, alors <\/span><mark>sois pas si pessimiste.<\/mark>"}, {"id": "B:BP0088", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Don’t be so pessimistic.", "b": "Sois pas si pessimiste."}, {"id": "B:BP0171", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Come on, don’t be so pessimistic.", "b": "Allez, sois pas si pessimiste."}, {"id": "B:BP0283", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Don’t be so pessimistic.", "b": "Sois pas si pessimiste."}, {"id": "B:BP0321", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>And come on, don’t be so pessimistic about it.", "b": "Oh allez, sois pas si pessimiste là-dessus."}, {"id": "B:BP0381", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Okay, but don’t be so pessimistic about it.", "b": "Bon, d'accord, mais sois pas si pessimiste."}, {"id": "B:BP0476", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh, come on, don’t be so pessimistic.", "b": "Oh, allez, sois pas si pessimiste."}, {"id": "B:BP0596", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>No, don't be so pessimistic.", "b": "Non, sois pas si pessimiste."}, {"id": "B:BP0615", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh, come on, don't be so pessimistic.", "b": "Oh allez, sois pas si pessimiste."}, {"id": "B:BP0666", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Yeah, but don’t be so pessimistic about it.", "b": "Ouais, mais sois pas si pessimiste."}, {"id": "B:BP0778", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Come on, don’t be so pessimistic about it.", "b": "Allez, sois pas si pessimiste là-dessus."}, {"id": "B:BP0800", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh, come on, don’t be so pessimistic!", "b": "Oh allez, sois pas si pessimiste !"}, {"id": "B:BP0847", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Don't be so pessimistic.", "b": "Sois pas si pessimiste, enfin."}, {"id": "B:BP0911", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>No, don’t be so pessimistic.", "b": "Non, sois pas si pessimiste."}, {"id": "B:BP0941", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh, come on, don’t be so pessimistic.", "b": "Oh, allez, sois pas si pessimiste !"}, {"id": "B:BP0262", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>I also think you’re being a little too pessimistic about it.", "b": "<span class=\"dim\">Après, <\/span><mark>je trouve aussi que t'es un peu trop pessimiste là-dessus.<\/mark>"}, {"id": "B:BP0133", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span><span class=\"dim\">Yeah, I know, but <\/span><mark>don't be so pessimistic about it before you've even tried it.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais, mais <\/span><mark>sois pas aussi pessimiste avant même d'avoir essayé.<\/mark>"}, {"id": "B:BP0718", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Okay, but come on, I don't think you should be that pessimistic about it yet.", "b": "Ok, mais franchement, je pense pas que tu doives être aussi pessimiste dès maintenant."}, {"id": "B:BP0566", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>And don’t be so pessimistic about the tickets already being sold out.", "b": "Et sois pas si pessimiste en te disant que les billets sont forcément déjà tous vendus."}, {"id": "B:BP1130", "bid": "BAY426", "f": "<span class=\"glabel\" style=\"display:block\">By that logic, why do anything?<\/span>Well, that's kind of pessimistic, right? Okay, then why do anything?", "b": "Bah, c'est un peu pessimiste comme façon de voir, non ? Bon, à ce compte-là, pourquoi faire quoi que ce soit ?"}, {"id": "B:BP0322", "bid": "BAY427", "f": "<span class=\"glabel\" style=\"display:block\">Just keep an open mind.<\/span>Just keep an open mind.", "b": "Garde l'esprit ouvert, c'est tout."}, {"id": "B:BP0170", "bid": "BAY427", "f": "<span class=\"glabel\" style=\"display:block\">Just keep an open mind.<\/span>You just need to be a little more open-minded about it.", "b": "Faut juste que tu sois un peu plus ouvert d'esprit là-dessus."}, {"id": "B:BP0621", "bid": "BAY427", "f": "<span class=\"glabel\" style=\"display:block\">Just keep an open mind.<\/span>Just keep an open mind.", "b": "Essaie juste de garder l'esprit ouvert."}, {"id": "B:BP0096", "bid": "BAY428", "f": "<span class=\"glabel\" style=\"display:block\">Don't assume it's a problem before you know the details.<\/span><span class=\"dim\">So <\/span><mark>don’t assume it’s going to be a problem before you even know what the actual tasks are.<\/mark>", "b": "<span class=\"dim\">Donc <\/span><mark>pars pas du principe que ça va poser problème avant même de savoir ce qu'il y a vraiment à faire.<\/mark>"}, {"id": "B:BP0176", "bid": "BAY429", "f": "<span class=\"glabel\" style=\"display:block\">The idea isn't that crazy.<\/span><span class=\"dim\">So <\/span><mark>I don’t think the idea is that crazy.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>moi, je trouve pas que l'idée soit si folle que ça.<\/mark>"}, {"id": "B:BP1021", "bid": "BAY430", "f": "<span class=\"glabel\" style=\"display:block\">We think about what could go wrong, not what could go right.<\/span>We tend to think too much about what could go wrong instead of thinking about what could go right.", "b": "On a tendance à trop se focaliser sur ce qui pourrait mal se passer, au lieu de penser à ce qui pourrait bien se passer."}, {"id": "B:BP1027", "bid": "BAY431", "f": "<span class=\"glabel\" style=\"display:block\">Lots of things could go right.<\/span>Many things could go right.", "b": "Y a plein de trucs qui pourraient bien se passer."}, {"id": "B:BP1024", "bid": "BAY431", "f": "<span class=\"glabel\" style=\"display:block\">Lots of things could go right.<\/span>But what could go right?", "b": "Mais qu'est-ce qui pourrait se passer de bien ?"}, {"id": "B:BP0616", "bid": "BAY432", "f": "<span class=\"glabel\" style=\"display:block\">You never know how it will go.<\/span>You never know how it's going to go.", "b": "On sait jamais comment ça va se passer."}, {"id": "B:BP0852", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>I just think you've got nothing to lose by applying.", "b": "Moi, je me dis juste que t'as rien à perdre à postuler."}, {"id": "B:BP0606", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>So really, you're not risking much by taking part.", "b": "Donc au final, tu risques pas grand-chose à participer."}, {"id": "B:BP0849", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>And even if you apply and don't get the job, what are you really risking?", "b": "Et même si tu postules et que t'as pas le job, en vrai, qu'est-ce que tu risques ?"}, {"id": "B:BP1062", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span><span class=\"dim\">It is high pressure, but <\/span><mark>the stakes are not high enough.<\/mark>", "b": "<span class=\"dim\">C'est vrai que c'est de la pression, mais <\/span><mark>les enjeux, eux, sont pas si élevés que ça.<\/mark>"}, {"id": "B:BP1129", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>It's all low stakes, man.", "b": "Franchement, y a aucune pression, mec."}, {"id": "B:BP0602", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>And even if the whole thing went badly, you'd still come away with a valuable experience.", "b": "Et même si tout se passait mal, t'en ressortirais malgré tout avec une expérience précieuse."}, {"id": "B:BP1170", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>Worst case scenario, you get to have this fun experience with someone from another country.", "b": "Au pire, tu passes un bon moment avec quelqu'un d'un autre pays."}, {"id": "B:BP0595", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>And even if you couldn't do the tour for some reason, just entering the contest would still be a really good experience.", "b": "Et même si pour une raison ou une autre tu pouvais pas faire la tournée, rien que participer au concours, ce serait déjà une super expérience."}, {"id": "B:BP0605", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>Actually, that's what I mean—even if you don't win the contest, you'd still win in other ways because you'd have challenged yourself and gained that experience.", "b": "En fait, c'est ça que je veux dire — même si tu gagnes pas le concours, tu serais quand même gagnant autrement, parce que tu te serais dépassé et t'aurais acquis cette expérience."}, {"id": "B:BP1023", "bid": "BAY435", "f": "<span class=\"glabel\" style=\"display:block\">Worst case, one embarrassing day you'll laugh about later.<\/span><span class=\"dim\">But <\/span><mark>the lowest stake is you not meeting these people again and a day of embarrassment that you can laugh about a year from now.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>au pire, tu revois jamais ces gens, et t'auras eu une journée de honte dont tu pourras rigoler dans un an.<\/mark>"}, {"id": "B:BP0829", "bid": "BAY436", "f": "<span class=\"glabel\" style=\"display:block\">If something happened, you wouldn't be the only one responsible.<\/span>There'd most likely be other people with you, so even if something did happen—which I don't think is very likely—you wouldn't be the only person responsible.", "b": "Y aurait très probablement d'autres gens avec toi, donc même s'il arrivait quelque chose — ce qui m'étonnerait, hein — tu serais pas le seul responsable."}, {"id": "B:BP0603", "bid": "BAY437", "f": "<span class=\"glabel\" style=\"display:block\">The point isn't to win.<\/span>The point isn't necessarily to win the contest.", "b": "Le but, c'est pas forcément de gagner le concours."}, {"id": "B:BP1169", "bid": "BAY438", "f": "<span class=\"glabel\" style=\"display:block\">It's just for fun.<\/span>This is just for fun.", "b": "C'est juste pour s'amuser."}, {"id": "B:BP1010", "bid": "BAY438", "f": "<span class=\"glabel\" style=\"display:block\">It's just for fun.<\/span><span class=\"dim\">But <\/span><mark>this sounds to me like something that's just for vibes.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>ça, ça m'a l'air d'être un truc juste pour le plaisir.<\/mark>"}, {"id": "B:BP0217", "bid": "BAY438", "f": "<span class=\"glabel\" style=\"display:block\">It's just for fun.<\/span><mark>The main goal is to have fun, enjoy the experience<\/mark><span class=\"dim\">, and do something meaningful together.<\/span>", "b": "<mark>Le principal, c'est de s'amuser, de profiter de l'expérience<\/mark><span class=\"dim\"> et de faire un truc qui a du sens ensemble.<\/span>"}, {"id": "B:BP1029", "bid": "BAY439", "f": "<span class=\"glabel\" style=\"display:block\">It's a hobby; they're not paying you.<\/span>You're doing this as a hobby.", "b": "C'est juste un loisir pour toi."}, {"id": "B:BP1028", "bid": "BAY439", "f": "<span class=\"glabel\" style=\"display:block\">It's a hobby; they're not paying you.<\/span>They're not paying you.", "b": "Ils te paient pas, hein."}, {"id": "B:BP1157", "bid": "BAY440", "f": "<span class=\"glabel\" style=\"display:block\">Your motives don't have to be pure.<\/span>You don't have to have completely pure motives.", "b": "T'es pas obligé d'avoir des motivations parfaitement pures."}, {"id": "B:BP1156", "bid": "BAY440", "f": "<span class=\"glabel\" style=\"display:block\">Your motives don't have to be pure.<\/span>I don't think we're ever doing things with only one motive, and that's completely fine.", "b": "Je pense pas qu'on fasse jamais les choses avec une seule motivation, et franchement, c'est pas un souci."}, {"id": "B:BP1158", "bid": "BAY440", "f": "<span class=\"glabel\" style=\"display:block\">Your motives don't have to be pure.<\/span>You can truly care about the cause and also be doing it for your resume — that's completely natural.", "b": "Tu peux sincèrement tenir à la cause et en même temps le faire pour ton CV — c'est complètement naturel."}, {"id": "B:BP0468", "bid": "BAY441", "f": "<span class=\"glabel\" style=\"display:block\">That problem is years away.<\/span>But that’s something you’d have to deal with, what, maybe 15 years from now?", "b": "Mais bon, ce serait un truc à gérer dans, quoi, peut-être 15 ans ?"}, {"id": "B:BP0469", "bid": "BAY442", "f": "<span class=\"glabel\" style=\"display:block\">A lot can change by then.<\/span>You don’t know what your life is going to look like by then. So much can change in 15 years.", "b": "Tu sais pas à quoi ta vie va ressembler d'ici là. En 15 ans, il peut s'en passer, des choses."}, {"id": "B:BP0471", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>That’s a problem you can deal with later.", "b": "Ça, c'est un problème que  "b": "Mais franchement, t'as même pas besoin de voir aussi loin."}, {"id": "B:BP0074", "bid": "BAY444", "f": "<span class=\"glabel\" style=\"display:block\">Nobody will be hostile or boo you.<\/span>It’s not like they’re going to be hostile and start throwing tomatoes at you or anything, so you really don’t need to worry about that.", "b": "C'est pas comme s'ils allaient être hostiles et se mettre à te lancer des tomates, hein — donc t'as vraiment pas de souci à te faire là-dessus."}, {"id": "B:BP0600", "bid": "BAY444", "f": "<span class=\"glabel\" style=\"display:block\">Nobody will be hostile or boo you.<\/span>It's not like people are going to start throwing tomatoes at you if your story isn't perfect or the performance doesn't go exactly the way you want.", "b": "C'est pas comme si les gens allaient se mettre à te jeter des tomates si ton histoire est pas parfaite ou si ta prestation se passe pas exactement comme tu veux."}, {"id": "B:BP1008", "bid": "BAY444", "f": "<span class=\"glabel\" style=\"display:block\">Nobody will be hostile or boo you.<\/span><span class=\"dim\">But then <\/span><mark>eventually you realize that it's a safe environment and that no one is going to boo you.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>au final, tu te rends compte que t'es dans un cadre bienveillant et que personne va te huer.<\/mark>"}, {"id": "B:BP0601", "bid": "BAY445", "f": "<span class=\"glabel\" style=\"display:block\">That won't happen, so don't worry about it.<\/span>That's not going to happen, so you really don't need to worry about that.", "b": "Ça arrivera pas, donc t'as vraiment pas besoin de t'en faire pour ça."}, {"id": "B:BP1176", "bid": "BAY446", "f": "<span class=\"glabel\" style=\"display:block\">No one will judge you.<\/span><span class=\"dim\">You have fun cooking together. <\/span><mark>No one's judging.<\/mark>", "b": "<span class=\"dim\">Tu t'amuses à cuisiner à deux, et <\/span><mark>y a personne qui te juge.<\/mark>"}, {"id": "B:BP1011", "bid": "BAY446", "f": "<span class=\"glabel\" style=\"display:block\">No one will judge you.<\/span>I don't think the audience they mention in the ad is an actual audience that contains critics.", "b": "Je pense pas que le public dont ils parlent dans l'annonce, ce soit un vrai public avec des critiques dedans."}, {"id": "B:BP0073", "bid": "BAY447", "f": "<span class=\"glabel\" style=\"display:block\">The audience will be nice and reasonable.<\/span>And seriously, I’m pretty sure the audience is going to be nice and reasonable.", "b": "Et franchement, je suis quasiment sûr que le public, il va être sympa et raisonnable."}, {"id": "B:BP1012", "bid": "BAY448", "f": "<span class=\"glabel\" style=\"display:block\">At a small show, people clap for you no matter what.<\/span><span class=\"dim\">And <\/span><mark>with a small indie performance like this, the audience is compelled to clap for you regardless of whether your performance is actually good or not. That's sorta the unspoken rule.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>dans un petit spectacle indépendant comme ça, les gens se sentent obligés de t'applaudir, que ta prestation soit vraiment bonne ou pas. C'est un peu la règle tacite, quoi.<\/mark>"}, {"id": "B:BP1183", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span>They didn't sign up for an actual restaurant meal. They would go to the millions of restaurants we have here if they want that instead.", "b": "Ils ont pas signé pour un vrai repas de resto. Si c'était ça qu'ils voulaient, ils iraient plutôt dans un des milliers de restos qu'on a ici."}, {"id": "B:BP1171", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span><span class=\"dim\">And <\/span><mark>these travellers are not looking for a five-course meal at your home.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>ces voyageurs, ils cherchent pas un repas en cinq plats chez toi.<\/mark>"}, {"id": "B:BP1172", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span>They know what to expect when they're going to a complete stranger's home that is not a restaurant.", "b": "Ils savent à quoi s'attendre quand ils vont chez un parfait inconnu — c'est pas un resto."}, {"id": "B:BP1173", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span><span class=\"dim\">So <\/span><mark>you don't have to set a standard that they need to have a perfect meal.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>t'as pas à te mettre la pression pour leur servir un repas parfait.<\/mark>"}, {"id": "B:BP1181", "bid": "BAY450", "f": "<span class=\"glabel\" style=\"display:block\">They know what they signed up for: a low-key experience.<\/span><span class=\"dim\">But <\/span><mark>I think the tourists are also aware of what to expect here.<\/mark>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>je pense que les touristes aussi, ils sont bien conscients de ce qui les attend.<\/mark>"}, {"id": "B:BP1182", "bid": "BAY450", "f": "<span class=\"glabel\" style=\"display:block\">They know what they signed up for: a low-key experience.<\/span>The whole vibe of what they signed up for is low stakes cultural exchange, a new, unusual experience.", "b": "Quand ils se sont inscrits, l'esprit du truc, c'était un échange culturel sans prise de tête, une expérience nouvelle, un peu insolite."}, {"id": "B:BP1174", "bid": "BAY451", "f": "<span class=\"glabel\" style=\"display:block\">It's like having a friend over.<\/span>Think of it as inviting someone over to your house and cooking for them, like inviting a friend over.", "b": "Vois ça comme si t'invitais quelqu'un à la maison pour lui faire à manger, comme quand tu reçois un pote."}, {"id": "B:BP1149", "bid": "BAY452", "f": "<span class=\"glabel\" style=\"display:block\">Everyone is the new member at first.<\/span><span class=\"dim\">But <\/span><mark>that comes with every new club you join — you're always gonna be the new member at start.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>c'est pareil pour chaque nouveau club que tu rejoins — au début, t'es toujours le petit nouveau.<\/mark>"}, {"id": "B:BP1127", "bid": "BAY453", "f": "<span class=\"glabel\" style=\"display:block\">It won't bring down the mood.<\/span><span class=\"dim\">If you don't wanna do something, you don't have to — <\/span><mark>it's not gonna bring down the mood<\/mark><span class=\"dim\">, and we're still gonna invite you to future events.<\/span>", "b": "<span class=\"dim\">Si t'as pas envie de faire un truc, t'es pas obligé — <\/span><mark>ça va pas plomber l'ambiance<\/mark><span class=\"dim\">, et de toute façon, on t'invitera quand même aux prochaines sorties.<\/span>"}, {"id": "B:BP1128", "bid": "BAY454", "f": "<span class=\"glabel\" style=\"display:block\">We'll still invite you next time.<\/span><span class=\"dim\">If you don't wanna do something, you don't have to — it's not gonna bring down the mood, and <\/span><mark>we're still gonna invite you to future events.<\/mark>", "b": "<span class=\"dim\">Si t'as pas envie de faire un truc, t'es pas obligé — ça va pas plomber l'ambiance, et de toute façon, <\/span><mark>on t'invitera quand même aux prochaines sorties.<\/mark>"}, {"id": "B:BP0347", "bid": "BAY455", "f": "<span class=\"glabel\" style=\"display:block\">Don't let what other people think stop you.<\/span>You shouldn't let opportunities like this pass you by just because you're worried about what other people might think. That's not how you should live your life.", "b": "Tu devrais pas laisser passer des occasions comme ça juste parce que tu t'inquiètes de ce que les autres pourraient penser. C'est pas comme ça qu'il faut vivre sa vie."}, {"id": "B:BP1209", "bid": "BAY455", "f": "<span class=\"glabel\" style=\"display:block\">Don't let what other people think stop you.<\/span><mark>The opinions of other people should never be in the way between us and our goals<\/mark><span class=\"dim\"> — life is too short to care about what other people think.<\/span>", "b": "<mark>L'avis des autres, ça devrait jamais se mettre entre nous et nos objectifs<\/mark><span class=\"dim\"> — la vie est trop courte pour se prendre la tête avec ce que pensent les gens.<\/span>"}, {"id": "B:BP1210", "bid": "BAY455", "f": "<span class=\"glabel\" style=\"display:block\">Don't let what other people think stop you.<\/span><span class=\"dim\">The opinions of other people should never be in the way between us and our goals — <\/span><mark>life is too short to care about what other people think.<\/mark>", "b": "<span class=\"dim\">L'avis des autres, ça devrait jamais se mettre entre nous et nos objectifs — <\/span><mark>la vie est trop courte pour se prendre la tête avec ce que pensent les gens.<\/mark>"}, {"id": "B:BP1206", "bid": "BAY456", "f": "<span class=\"glabel\" style=\"display:block\">We often care too much about what others think.<\/span><span class=\"dim\">And <\/span><mark>sometimes we tend to care too much about what other people think of us<\/mark><span class=\"dim\"> — it's like a spotlight effect, where we think other people care a lot about us, when in reality they're too focused on their own lives to care.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>on a parfois tendance à trop se préoccuper de ce que les autres pensent de nous<\/mark><span class=\"dim\"> — c'est un peu comme un effet projecteur : on s'imagine que les gens s'intéressent beaucoup à nous, alors qu'en vrai, ils sont bien trop pris par leur propre vie pour s'en soucier.<\/span>"}, {"id": "B:BP1207", "bid": "BAY457", "f": "<span class=\"glabel\" style=\"display:block\">Others are too busy with their own lives to notice you.<\/span><span class=\"dim\">And sometimes we tend to care too much about what other people think of us — <\/span><mark>it's like a spotlight effect, where we think other people care a lot about us, when in reality they're too focused on their own lives to care.<\/mark>", "b": "<span class=\"dim\">Et puis on a parfois tendance à trop se préoccuper de ce que les autres pensent de nous — <\/span><mark>c'est un peu comme un effet projecteur : on s'imagine que les gens s'intéressent beaucoup à nous, alors qu'en vrai, ils sont bien trop pris par leur propre vie pour s'en soucier.<\/mark>"}, {"id": "B:BP1208", "bid": "BAY458", "f": "<span class=\"glabel\" style=\"display:block\">Even if people look, so what?<\/span>So what if they do, right?", "b": "Et puis même si c'est le cas, qu'est-ce que ça peut faire, hein ?"}, {"id": "B:BP1211", "bid": "BAY459", "f": "<span class=\"glabel\" style=\"display:block\">They might find it interesting and join you.<\/span><span class=\"dim\">And <\/span><mark>what if they find what you're doing interesting, and end up doing it together with you? You never know.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si jamais ils trouvent ça intéressant, ce que tu fais, et qu'ils finissent par s'y mettre avec toi ? On sait jamais.<\/mark>"}, {"id": "B:BP1205", "bid": "BAY460", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do it where people watch you.<\/span>You don't necessarily need to do it in a place where people watch you.", "b": "<span class=\"dim\">En plus, <\/span><mark>t'es pas forcément obligé de faire ça dans un endroit où les gens te regardent.<\/mark>"}, {"id": "B:BP0671", "bid": "BAY461", "f": "<span class=\"glabel\" style=\"display:block\">Your friends would understand why you're doing it.<\/span>And I think your friends would understand why you’re doing it anyway.", "b": "Et de toute façon, je pense que tes potes comprendraient pourquoi tu fais ça."}, {"id": "B:BP0672", "bid": "BAY462", "f": "<span class=\"glabel\" style=\"display:block\">They know you're looking for work or extra income.<\/span>They know you’re looking for a new job or at least a bit of extra income, so it’s not like they’d be wondering where this was coming from.", "b": "Ils savent que tu cherches un nouveau job, ou au moins à gagner un peu d'argent en plus, donc c'est pas comme s'ils allaient se demander d'où ça sort."}, {"id": "B:BP1030", "bid": "BAY463", "f": "<span class=\"glabel\" style=\"display:block\">If they don't like that you won't commit, don't care.<\/span><span class=\"dim\">And <\/span><mark>sure, they might not like the fact that you don't commit, but you don't need to care.<\/mark>", "b": "Alors oui, ça leur plaira peut-être pas que tu t'engages pas à fond, mais honnêtement, t'as pas à t'en préoccuper."}, {"id": "B:BP1031", "bid": "BAY464", "f": "<span class=\"glabel\" style=\"display:block\">You can put yourself first sometimes.<\/span>You can just prioritize yourself sometimes.", "b": "T'as le droit de te faire passer en premier de temps en temps."}, {"id": "B:BP0681", "bid": "BAY465", "f": "<span class=\"glabel\" style=\"display:block\">The scary part is what makes it fun.<\/span><span class=\"dim\">I know that sounds a little risky, <\/span><mark>but that’s also kind of what makes it so interesting.<\/mark>", "b": "<span class=\"dim\">Je sais que ça peut paraître un peu risqué, <\/span><mark>mais en même temps, c'est un peu ça qui rend le truc aussi intéressant.<\/mark>"}, {"id": "B:BP1119", "bid": "BAY465", "f": "<span class=\"glabel\" style=\"display:block\">The scary part is what makes it fun.<\/span>The fun is in the scary, right?", "b": "C'est ça qui est marrant, non, le côté qui fait un peu flipper ?"}, {"id": "B:BP0759", "bid": "BAY466", "f": "<span class=\"glabel\" style=\"display:block\">Being scared is exactly why we should do it.<\/span><span class=\"dim\">And yeah, I completely get why you’re scared, <\/span><mark>but that’s kind of exactly why I think we should do it.<\/mark>", "b": "<span class=\"dim\">Et ouais, je comprends tout à fait que t'aies peur, <\/span><mark>mais justement, c'est un peu pour ça que je me dis qu'on devrait le faire.<\/mark>"}, {"id": "B:BP1058", "bid": "BAY466", "f": "<span class=\"glabel\" style=\"display:block\">Being scared is exactly why we should do it.<\/span>That's a concern that I also frankly have. But that's why I wanna do this, right?", "b": "Cette crainte-là, franchement, je l'ai aussi. Mais justement, c'est pour ça que je veux le faire, tu vois ?"}, {"id": "B:BP1117", "bid": "BAY467", "f": "<span class=\"glabel\" style=\"display:block\">Do things that scare you a little but are safe.<\/span>The whole point is to do things that you're a little scared of, but that don't really threaten your life.", "b": "Tout l'intérêt, justement, c'est de faire des trucs qui te font un peu peur, mais qui mettent pas vraiment ta vie en danger."}, {"id": "B:BP1118", "bid": "BAY467", "f": "<span class=\"glabel\" style=\"display:block\">Do things that scare you a little but are safe.<\/span><span class=\"dim\">So <\/span><mark>it's discomfort, but also there's a safety net underneath us.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>oui, c'est de l'inconfort, mais en même temps y a un filet de sécurité sous nos pieds.<\/mark>"}, {"id": "B:BP1116", "bid": "BAY468", "f": "<span class=\"glabel\" style=\"display:block\">If you're already comfortable, it won't be memorable.<\/span>If it's something that you're already comfortable with, sure, it's an experience, but it won't be a fully memorable experience.", "b": "Si c'est un truc avec lequel t'es déjà à l'aise, d'accord, c'est une expérience, mais ce sera pas une expérience vraiment marquante."}, {"id": "B:BP1121", "bid": "BAY469", "f": "<span class=\"glabel\" style=\"display:block\">I was scared of something like this too, and I tried it.<\/span><span class=\"dim\">You give me snowboarding as an example — <\/span><mark>I used to be scared of snowboarding as well, and I actually tried it.<\/mark>", "b": , that's enough.<\/mark>", "b": "<span class=\"dim\">Donc voilà, <\/span><mark>moi je me dis que si on essaie au moins une fois, ça suffit.<\/mark>"}, {"id": "B:BP0900", "bid": "BAY497", "f": "<span class=\"glabel\" style=\"display:block\">Let's just try it once.<\/span>Maybe you could just do it for a day or two, just to have the experience and try it out.", "b": "À la limite, tu pourrais y aller juste un jour ou deux, histoire de vivre l'expérience et de voir ce que ça donne."}, {"id": "B:BP0138", "bid": "BAY498", "f": "<span class=\"glabel\" style=\"display:block\">If you don't like it, you can stop.<\/span><span class=\"dim\">We can see what it's like, and <\/span><mark>if we don't want to keep doing it, we can stop.<\/mark>", "b": "<span class=\"dim\">On peut voir ce que ça donne, et <\/span><mark>si on a pas envie de continuer, on arrête.<\/mark>"}, {"id": "B:BP0134", "bid": "BAY498", "f": "<span class=\"glabel\" style=\"display:block\">If you don't like it, you can stop.<\/span>If you try it and something goes horribly wrong or you absolutely hate it, obviously you don't have to keep going.", "b": "Si tu tentes le coup et que ça se passe super mal ou que tu détestes carrément ça, bah évidemment, t'es pas obligé de continuer."}, {"id": "B:BP1055", "bid": "BAY498", "f": "<span class=\"glabel\" style=\"display:block\">If you don't like it, you can stop.<\/span>You can immediately just get out, right? It's volunteering. What are they gonna do? Fire us? We're not getting paid, right?", "b": "Tu peux partir direct, hein ? C'est du bénévolat. Ils vont faire quoi ? Nous virer ? On est même pas payés, hein ?"}, {"id": "B:BP0326", "bid": "BAY499", "f": "<span class=\"glabel\" style=\"display:block\">You can start small, step by step.<\/span>You can just start little by little.", "b": "Tu peux commencer petit à petit, tout simplement."}, {"id": "B:BP0990", "bid": "BAY499", "f": "<span class=\"glabel\" style=\"display:block\">You can start small, step by step.<\/span>May  learn some of this stuff now, when are you going to?", "b": "Et puis si t'apprends pas ça maintenant, tu le feras quand ?"}]}, {"key": "B-BC1", "sec": "B", "code": "BC1", "name": "Opening", "bucket": "Context", "items": [{"id": "B:BP0853", "bid": "BCY001", "f": "<span class=\"glabel\" style=\"display:block\">Hey, how's it going?<\/span>Hey, how’s it going?", "b": "Salut, tu vas bien ?"}, {"id": "B:BP0505", "bid": "BCY002", "f": "<span class=\"glabel\" style=\"display:block\">I saw an ad last night.<\/span><mark>So, I wanted to call you because I saw this ad last night<\/mark><span class=\"dim\">, and as soon as I saw it, I thought, “That actually looks really interesting.”<\/span>", "b": "<mark>Alors voilà, je voulais t'appeler parce que j'ai vu une pub hier soir<\/mark><span class=\"dim\">, et dès que je l'ai vue, je me suis dit : « Tiens, ça a l'air vraiment intéressant, en fait. »<\/span>"}, {"id": "B:BP0143", "bid": "BCY002", "f": "<span class=\"glabel\" style=\"display:block\">I saw an ad last night.<\/span><mark>I’m only asking because I saw an ad yesterday evening for gardening classes<\/mark><span class=\"dim\">, and honestly, it seems like it could be a really nice hobby.<\/span>", "b": "<mark>Je te demande ça juste parce que j'ai vu une pub hier soir pour des cours de jardinage<\/mark><span class=\"dim\">, et franchement, j'ai l'impression que ça pourrait être un passe-temps vraiment sympa.<\/span>"}, {"id": "B:BP0854", "bid": "BCY002", "f": "<span class=\"glabel\" style=\"display:block\">I saw an ad last night.<\/span>So, I wanted to call you because I saw this ad, and it looked really interesting.", "b": "Alors voilà, je voulais t'appeler parce que j'ai vu une annonce, et elle avait l'air vraiment intéressante."}, {"id": "B:BP0538", "bid": "BCY003", "f": "<span class=\"glabel\" style=\"display:block\">I have an idea for something we could do.<\/span>So, I had an idea, and I think I know what I want us to do.", "b": "Bon, alors, j'ai eu une idée, et je c
