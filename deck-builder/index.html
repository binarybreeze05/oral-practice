you might.<\/span>Even if there are some who have better photos than you, maybe their hours won't stick with what the magazine asks, whereas yours, yes.", "b": "Même si y en a qui ont de meilleures photos que toi, peut-être que leurs horaires colleront pas avec ce que le magazine demande, alors que les tiens, si."}]}, {"key": "B-BA10", "sec": "B", "code": "BA10", "name": "It fits your schedule", "bucket": "Arguments", "items": [{"id": "B:BP0797", "bid": "BAY286", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't take much time.<\/span>It's maybe just a few hours.", "b": "C'est peut-être juste quelques heures."}, {"id": "B:BP0149", "bid": "BAY286", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't take much time.<\/span><mark>You would without doubt spend a weekend planting the seeds and putting everything in place<\/mark><span class=\"dim\">, and after, while waiting for it to grow, you could always look for another pastime.<\/span>", "b": "<mark>Tu passerais sans doute un week-end à planter les graines et à tout mettre en place<\/mark><span class=\"dim\">, et après, en attendant que ça pousse, tu pourrais toujours chercher un autre passe-temps.<\/span>"}, {"id": "B:BP0076", "bid": "BAY286", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't take much time.<\/span><span class=\"dim\">After, <\/span><mark>I think not either that it takes you so much time as that, to prepare yourself for the show. It doesn't have the air of being the kind of thing that asks tons of preparation.<\/mark>", "b": "<span class=\"dim\">Après, <\/span><mark>je pense pas non plus que ça te prenne tant de temps que ça, de te préparer pour le spectacle. Ça a pas l'air d'être le genre de truc qui demande des tonnes de préparation.<\/mark>"}, {"id": "B:BP0399", "bid": "BAY287", "f": "<span class=\"glabel\" style=\"display:block\">If it's only a short time, it's worth it.<\/span>And if there's no long-term commitment, or if it's a thing that you can do tranquilly, frankly I don't really see what you have to lose.", "b": "Et si y a pas d'engagement à long terme, ou si c'est un truc que tu peux faire tranquille, franchement je vois pas trop ce que t'as à perdre."}, {"id": "B:BP0406", "bid": "BAY287", "f": "<span class=\"glabel\" style=\"display:block\">If it's only a short time, it's worth it.<\/span>Especially if it doesn't take a lot of time. Well, if it's not a crazy thing like twenty hours per week, and it's more an hour here and there or two-three hours every fifteen days, there I think that it could totally be worth the blow.", "b": "Surtout si ça prend pas beaucoup de temps. Enfin, si c'est pas un truc de fou comme vingt heures par semaine, et que c'est plutôt une heure par-ci par-là ou deux-trois heures tous les quinze jours, là je pense que ça pourrait carrément valoir le coup."}, {"id": "B:BP1046", "bid": "BAY287", "f": "<span class=\"glabel\" style=\"display:block\">If it's only a short time, it's worth it.<\/span><span class=\"dim\">So yes, if it was a regular thing over several months, we could debate on whether it's worth the blow to pass our time on it; but <\/span><mark>for one afternoon, honestly, it's squarely worth the blow.<\/mark>", "b": "<span class=\"dim\">Alors oui, si c'était un truc régulier sur plusieurs mois, on pourrait débattre de savoir si ça vaut le coup d'y passer notre temps ; mais <\/span><mark>pour un après-midi, honnêtement, ça vaut carrément le coup.<\/mark>"}, {"id": "B:BP0710", "bid": "BAY288", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't have to be there all day.<\/span>And then it's not like you had to stay with the dog the whole day, eh.", "b": "Et puis c'est pas comme si tu devais rester avec le chien toute la journée, hein."}, {"id": "B:BP0061", "bid": "BAY289", "f": "<span class=\"glabel\" style=\"display:block\">It's only once a month, not every day.<\/span><span class=\"dim\">And then <\/span><mark>it's not as if it was every day, huh. It's only the last Friday of the month<\/mark><span class=\"dim\">, so then you could throw another glance at your schedule, and see if you can fit that in.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>c'est pas comme si c'était tous les jours, hein. C'est que le dernier vendredi du mois<\/mark><span class=\"dim\">, du coup tu pourrais rejeter un coup d'œil à ton emploi du temps, et voir si tu peux caser ça.<\/span>"}, {"id": "B:BP0953", "bid": "BAY290", "f": "<span class=\"glabel\" style=\"display:block\">You could just do a little each day.<\/span>You answer one survey per day, for example.", "b": "Tu réponds à un sondage par jour, par exemple."}, {"id": "B:BP0655", "bid": "BAY291", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't take over your life.<\/span>It's not obliged that it takes all the place in your life, like.", "b": "C'est pas obligé que ça prenne toute la place dans ta vie, quoi."}, {"id": "B:BP0653", "bid": "BAY291", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't take over your life.<\/span>You could just do that on the side.", "b": "Tu pourrais juste faire ça à côté."}, {"id": "B:BP0837", "bid": "BAY291", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't take over your life.<\/span><span class=\"dim\">And <\/span><mark>you'd surely still have free time on the side to do your things.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>t'aurais sûrement encore du temps libre à côté pour faire tes trucs.<\/mark>"}, {"id": "B:BP0638", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span>On top of that, it doesn't need to be an enormous engagement on the long term.", "b": "En plus de ça, ça a pas besoin d'être un énorme engagement sur le long terme."}, {"id": "B:BP0126", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span><span class=\"dim\">Yeah, I see what you want to say, but <\/span><mark>I don't think that you should see that as an enormous engagement on the long term. In any case, in my opinion, it wouldn't be one<\/mark><span class=\"dim\">, and at worst, you could always check with the association or the local radio to be sure.<\/span>", "b": "<span class=\"dim\">Ouais, je vois ce que tu veux dire, mais <\/span><mark>je pense pas que tu doives voir ça comme un énorme engagement sur le long terme. De toute façon, à mon avis, ç'en serait pas un<\/mark><span class=\"dim\">, et au pire, tu pourrais toujours vérifier auprès de l'asso ou de la radio locale pour être sûr.<\/span>"}, {"id": "B:BP0129", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span><span class=\"dim\">From what I understood, you could do that when you want, and <\/span><mark>one wouldn't force you to continue over the duration.<\/mark>", "b": "<span class=\"dim\">De ce que j'ai compris, tu pourrais faire ça quand tu veux, et <\/span><mark>on te forcerait pas à continuer sur la durée.<\/mark>"}, {"id": "B:BP0366", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span>And then it's not as if you had to engage yourself fully over the long term, or go there every week, or even every day.", "b": "Et puis c'est pas comme si tu devais t'engager à fond sur le long terme, ou y aller toutes les semaines, ou même tous les jours."}, {"id": "B:BP0844", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span><span class=\"dim\">It doesn't look too complicated, you don't need experience, and <\/span><mark>it doesn't have the air of being an enormous engagement on the long term.<\/mark>", "b": "<span class=\"dim\">Ça a pas l'air trop compliqué, t'as pas besoin d'expérience, et <\/span><mark>ça a pas l'air d'être un engagement énorme sur le long terme.<\/mark>"}, {"id": "B:BP0832", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span>And then it's not obliged to be a permanent thing either.", "b": "Et puis c'est pas obligé d'être un truc permanent non plus."}, {"id": "B:BP1190", "bid": "BAY292", "f": "<span class=\"glabel\" style=\"display:block\">It's not a big long-term commitment.<\/span>Careful, I'm not saying that this online training, it's what you're going to continue to do for years.", "b": "Attention, je dis pas que cet entraînement en ligne, c'est ce que tu vas continuer à faire pendant des années."}, {"id": "B:BP0833", "bid": "BAY293", "f": "<span class=\"glabel\" style=\"display:block\">Do it short-term while you look for something else.<\/span>You could very well do that just for a time, while waiting to find something else.", "b": "Tu pourrais très bien faire ça juste un temps, en attendant de trouver autre chose."}, {"id": "B:BP0899", "bid": "BAY294", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to stay the whole time.<\/span>No but I don't think that you're obliged to stay the two complete weeks.", "b": "Non mais je pense pas que tu sois obligé de rester les deux semaines complètes."}, {"id": "B:BP0904", "bid": "BAY294", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to stay the whole time.<\/span><span class=\"dim\">All the same, it would be a completely different trip, and <\/span><mark>in any case you wouldn't necessarily be obliged to do it over the two whole weeks.<\/mark>", "b": "<span class=\"dim\">N'empêche, ce serait un voyage complètement différent, et <\/span><mark>de toute façon tu serais pas forcément obligé de le faire sur les deux semaines entières.<\/mark>"}, {"id": "B:BP0175", "bid": "BAY295", "f": "<span class=\"glabel\" style=\"display:block\">You'd use it up in a few months.<\/span>If you took a card of 20 meals, there are big chances that you finish it in one month, two months, maybe three, but surely not six.", "b": "Si tu prenais une carte de 20 repas, y a de grandes chances que tu la finisses en un mois, deux mois, peut-être trois, mais sûrement pas six."}, {"id": "B:BP0367", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span>You can go there when you're free, quite simply.", "b": "Tu peux y aller quand t'es libre, tout simplement."}, {"id": "B:BP0122", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span><span class=\"dim\">And <\/span><mark>don't worry yourself about the schedules, because in the ad, they say that the slots are flexible.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>t'inquiète pas pour les horaires, parce que dans l'annonce, ils disent que les créneaux sont flexibles.<\/mark>"}, {"id": "B:BP0128", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span><mark>From what I understood, you could do that when you want<\/mark><span class=\"dim\">, and one wouldn't force you to continue over the duration.<\/span>", "b": "<mark>De ce que j'ai compris, tu pourrais faire ça quand tu veux<\/mark><span class=\"dim\">, et on te forcerait pas à continuer sur la durée.<\/span>"}, {"id": "B:BP0449", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span>When you have a bit of time, you could pass by there and do what you can.", "b": "Quand t'as un peu de temps, tu pourrais y passer et faire ce que tu peux."}, {"id": "B:BP0711", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span>It's a little dog, so you could surely organise yourself according to your schedule and choose the slots that suit you.", "b": "C'est un petit chien, donc tu pourrais sûrement t'organiser en fonction de ton emploi du temps et choisir les créneaux qui t'arrangent."}, {"id": "B:BP0448", "bid": "BAY296", "f": "<span class=\"glabel\" style=\"display:block\">You can do it whenever you're free.<\/span><span class=\"dim\">At the limit, you could just use the garage for the little snags, or <\/span><mark>go there one weekend when you have a few hours in front of you and that you feel like tinkering a bit or learning more.<\/mark>", "b": "<span class=\"dim\">À la limite, tu pourrais juste utiliser le garage pour les petits pépins, ou <\/span><mark>y aller un week-end quand t'as quelques heures devant toi et que t'as envie de bricoler un peu ou d'en apprendre plus.<\/mark>"}, {"id": "B:BP0368", "bid": "BAY297", "f": "<span class=\"glabel\" style=\"display:block\">Just ask them for a time slot that fits you.<\/span>You just have to contact the refuge and ask them if they have a slot that sticks with your schedule.", "b": "T'as juste à contacter le refuge et leur demander s'ils ont un créneau qui colle avec ton emploi du temps."}, {"id": "B:BP0062", "bid": "BAY298", "f": "<span class=\"glabel\" style=\"display:block\">Check your schedule and see if you can fit it in.<\/span><span class=\"dim\">It's only the last Friday of the month, so then <\/span><mark>you could throw another glance at your schedule, and see if you can fit that in.<\/mark>", "b": "<span class=\"dim\">C'est que le dernier vendredi du mois, du coup <\/span><mark>tu pourrais rejeter un coup d'œil à ton emploi du temps, et voir si tu peux caser ça.<\/mark>"}, {"id": "B:BP0315", "bid": "BAY299", "f": "<span class=\"glabel\" style=\"display:block\">Maybe it's at a time when you're free.<\/span>And then it will fall maybe on a Sunday. If it's the case, you could go there, seeing that you don't work the Sunday.", "b": "Et puis ça tombera peut-être un dimanche. Si c'est le cas, tu pourrais y aller, vu que tu travailles pas le dimanche."}, {"id": "B:BP0317", "bid": "BAY299", "f": "<span class=\"glabel\" style=\"display:block\">Maybe it's at a time when you're free.<\/span>And even if it's not a Sunday, at the limit, it could be after the job.", "b": "Et même si c'est pas un dimanche, à la limite, ça pourrait être après le boulot."}, {"id": "B:BP0235", "bid": "BAY300", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do it right away.<\/span><span class=\"dim\">And <\/span><mark>if you're afraid of not having enough time at the moment, I don't think that it's a thing to do straight away. You could maybe do it the next month, or in two-three months.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si t'as peur de pas avoir assez de temps en ce moment, je pense pas que ce soit un truc à faire tout de suite. Tu pourrais peut-être le faire le mois prochain, ou dans deux-trois mois.<\/mark>"}, {"id": "B:BP0148", "bid": "BAY301", "f": "<span class=\"glabel\" style=\"display:block\">Waiting isn't really an obstacle.<\/span><span class=\"dim\">And I see what you want to say about the fact of having to wait for the plants to grow, but <\/span><mark>I don't really find that it's an obstacle.<\/mark>", "b": "<span class=\"dim\">Et je vois ce que tu veux dire sur le fait de devoir attendre que les plantes poussent, mais <\/span><mark>je trouve pas vraiment que ce soit un obstacle.<\/mark>"}, {"id": "B:BP0150", "bid": "BAY302", "f": "<span class=\"glabel\" style=\"display:block\">While you wait, you can do something else.<\/span><span class=\"dim\">You would without doubt spend a weekend planting the seeds and putting everything in place, and after, <\/span><mark>while waiting for it to grow, you could always look for another pastime.<\/mark>", "b": "<span class=\"dim\">Tu passerais sans doute un week-end à planter les graines et à tout mettre en place, et après, <\/span><mark>en attendant que ça pousse, tu pourrais toujours chercher un autre passe-temps.<\/mark>"}, {"id": "B:BP0872", "bid": "BAY303", "f": "<span class=\"glabel\" style=\"display:block\">Ask your employer to adjust things.<\/span>I think that it's worth the blow to talk about it with them and to see if they can arrange themselves so that you can really put down your days off.", "b": "Je pense que ça vaut le coup d'en parler avec eux et de voir s'ils peuvent s'arranger pour que tu puisses vraiment poser tes congés."}, {"id": "B:BP0236", "bid": "BAY303", "f": "<span class=\"glabel\" style=\"display:block\">Ask your employer to adjust things.<\/span>And besides, you could even talk about it to your employer, see if there's a way to arrange things — for example do a part of your job online or at distance while you're not there.", "b": "Et d'ailleurs, tu pourrais même en parler à ton employeur, voir si y a moyen de s'arranger — par exemple faire une partie de ton boulot en ligne ou à distance pendant que t'es pas là."}, {"id": "B:BP0878", "bid": "BAY304", "f": "<span class=\"glabel\" style=\"display:block\">At least try to adjust and make it work.<\/span>You could at least try to organise yourself a bit and see if it can work out.", "b": "Tu pourrais au moins essayer de t'organiser un peu et voir si ça peut le faire."}, {"id": "B:BP0876", "bid": "BAY305", "f": "<span class=\"glabel\" style=\"display:block\">Maybe you'd get some days off for it.<\/span>If it so happens, you could have ten days of leave, and there, we could do the trip over ten days.", "b": "Si ça se trouve, tu pourrais avoir dix jours de congé, et là, on pourrait faire le voyage sur dix jours."}, {"id": "B:BP0871", "bid": "BAY306", "f": "<span class=\"glabel\" style=\"display:block\">Don't let your employer decide how you live.<\/span>And for the work, you shouldn't let your company decide completely about how you live your life.", "b": "Et pour le boulot, tu devrais pas laisser ta boîte décider complètement de comment tu vis ta vie."}, {"id": "B:BP0877", "bid": "BAY307", "f": "<span class=\"glabel\" style=\"display:block\">Don't miss this just because of your schedule.<\/span>Me, I just find that you shouldn't let pass this occasion under pretext that it doesn't stick perfectly with your schedule at the moment.", "b": "Moi, je trouve juste que tu devrais pas laisser passer cette occasion sous prétexte que ça colle pas parfaitement avec ton emploi du temps en ce moment."}, {"id": "B:BP1155", "bid": "BAY308", "f": "<span class=\"glabel\" style=\"display:block\">Do it instead of scrolling social media.<\/span>Look at your timetable, and if you see things that make you lose your time, like hanging around on the networks, you can replace them with that.", "b": "Regarde ton emploi du temps, et si tu vois des trucs qui te font perdre ton temps, comme traîner sur les réseaux, tu peux les remplacer par ça."}, {"id": "B:BP0952", "bid": "BAY308", "f": "<span class=\"glabel\" style=\"display:block\">Do it instead of scrolling social media.<\/span>At the limit, it could just be a thing that you do in the transport, instead of hanging around on the networks.", "b": "À la limite, ça pourrait juste être un truc que tu fais dans les transports, à la place de traîner sur les réseaux."}, {"id": "B:BP1154", "bid": "BAY309", "f": "<span class=\"glabel\" style=\"display:block\">We all have 24 hours; 'no time' means other priorities.<\/span>When one says that one doesn't have the time, me, I always turn the thing around: we all have the same 24 hours in a day, so in fact, that just means that we make other things pass before.", "b": "Quand on dit qu'on a pas le temps, moi, je retourne toujours le truc : on a tous les mêmes 24 heures dans une journée, donc en fait, ça veut juste dire qu'on fait passer d'autres choses avant."}, {"id": "B:BP1114", "bid": "BAY310", "f": "<span class=\"glabel\" style=\"display:block\">No one is too busy right now.<\/span><span class=\"dim\">Honestly, <\/span><mark>I don't think that the problem, it's that everyone is really overwhelmed — it's summer, and we're only students.<\/mark>", "b": "<span class=\"dim\">Honnêtement, <\/span><mark>je pense pas que le souci, ce soit que tout le monde est vraiment débordé — c'est l'été, et on est que des étudiants.<\/mark>"}, {"id": "B:BP1115", "bid": "BAY311", "f": "<span class=\"glabel\" style=\"display:block\">If we don't do it now, we won't have time later.<\/span>If we don't pass time doing this kind of stuff while we're this young, we won't have the time anymore in five years, when we'll all be full-on in our careers, with all these responsibilities that we don't have for now.", "b": "Si on passe pas du temps à faire ce genre de trucs tant qu'on est aussi jeunes, on aura plus le temps dans cinq ans, quand on sera tous à fond dans nos carrières, avec toutes ces responsabilités qu'on a pas pour l'instant."}, {"id": "B:BP0966", "bid": "BAY312", "f": "<span class=\"glabel\" style=\"display:block\">This takes less time than the alternative.<\/span>Roughly, it does you a hundred or so surveys in your place, and then you only have to fill in 100 CAPTCHA forms — well, that makes a lot, it's true, but it's still less long than 100 surveys.", "b": "En gros, il te fait une centaine de sondages à ta place, et ensuite t'as plus qu'à remplir 100 formulaires CAPTCHA — bon, ça fait beaucoup, c'est vrai, mais c'est toujours moins long que 100 sondages."}, {"id": "B:BP1201", "bid": "BAY313", "f": "<span class=\"glabel\" style=\"display:block\">The in-person option is harder to fit into your schedule.<\/span>With the gym, on the other hand, you have a lot more things to take into account so that it fits into your timetable.", "b": "Avec la salle de sport, par contre, t'as beaucoup plus de trucs à prendre en compte pour que ça rentre dans ton emploi du temps."}, {"id": "B:BP1203", "bid": "BAY314", "f": "<span class=\"glabel\" style=\"display:block\">The in-person place might be packed on your only free day.<\/span>Let's put that you have a very precise gym in head for its equipment, but you realise that on Wednesday, it's packed — and that Wednesday, precisely, it's the only day that suits you. All those things there, that exists with a classic gym.", "b": "Mettons que t'aies une salle bien précise en tête pour ses équipements, mais tu te rends compte que le mercredi, c'est bondé — et que le mercredi, justement, c'est le seul jour qui t'arrange. Tous ces trucs-là, ça existe avec une salle classique."}]}, {"key": "B-BA11", "sec": "B", "code": "BA11", "name": "Your way, no hassle", "bucket": "Arguments", "items": [{"id": "B:BP0130", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>It's you who decides.", "b": "C'est toi qui décides."}, {"id": "B:BP0095", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>It's you who sees. The house, it's you who chooses it.", "b": "C'est toi qui vois. La maison, c'est toi qui la choisis."}, {"id": "B:BP0591", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>After all, it's your story, so it would be up to you to choose the theme that really speaks to you.", "b": "Après tout, c'est ton histoire, donc ce serait à toi de choisir le thème qui te parle vraiment."}, {"id": "B:BP0998", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>You can do that on your conditions.", "b": "Tu peux faire ça à tes conditions."}, {"id": "B:BP0999", "bid": "BAY315", "f": "<span class=\"glabel\" style=\"display:block\">It's up to you; you decide how you do it.<\/span>You can tell yourself: « I'm going to test this new thing, but here's my limit. I'm not going to haggle with people 24 hours out of 24, because that, it's my limit, and I won't cross it. On the other hand, everything that stays in these limits, no worry, I try. »", "b": "Tu peux te dire : « Je vais tester ce nouveau truc, mais voilà ma limite. Je vais pas marchander avec les gens 24 heures sur 24, parce que ça, c'est ma limite, et je la franchirai pas. Par contre, tout ce qui reste dans ces limites, pas de souci, j'essaie. »"}, {"id": "B:BP1126", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span><mark>If you don't feel like doing a thing, you're not obliged<\/mark><span class=\"dim\"> — that's not going to weigh down the atmosphere, and in any case, we'll invite you all the same to the next outings.<\/span>", "b": "<mark>Si t'as pas envie de faire un truc, t'es pas obligé<\/mark><span class=\"dim\"> — ça va pas plomber l'ambiance, et de toute façon, on t'invitera quand même aux prochaines sorties.<\/span>"}, {"id": "B:BP0010", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>That said, if really you don't have the want to paddle, you can all the same come just for the camping and the nature.", "b": "Cela dit, si vraiment t'as pas envie de pagayer, tu peux quand même venir juste pour le camping et la nature."}, {"id": "B:BP0094", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span><span class=\"dim\">And <\/span><mark>if someone tells you that he has need that you take care of a house with cats and that you don't have the want to do that, you just have to say: « No, me I'm looking for something else. »<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si quelqu'un te dit qu'il a besoin que tu t'occupes d'une maison avec des chats et que t'as pas envie de faire ça, t'as qu'à dire : « Non, moi je cherche autre chose. »<\/mark>"}, {"id": "B:BP0281", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>If you're not at ease at the idea of going to strangers' places, you've only got to not propose services that demand that.", "b": "Si t'es pas à l'aise à l'idée d'aller chez des inconnus, t'as qu'à pas proposer de services qui demandent ça."}, {"id": "B:BP0289", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>And if you don't feel like lending your things, well you don't lend them, that's all.", "b": "Et si t'as pas envie de prêter tes affaires, bah tu les prêtes pas, c'est tout."}, {"id": "B:BP0293", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>And in all cases, one doesn't oblige you to propose things that put you ill at ease.", "b": "Et dans tous les cas, on t'oblige pas à proposer des trucs qui te mettent mal à l'aise."}, {"id": "B:BP0811", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>And obviously, if you have things that have a sentimental value, like an object of your grandmother or I don't know what, that, you're not obliged to sell it.", "b": "Et évidemment, si t'as des trucs qui ont une valeur sentimentale, comme un objet de ta grand-mère ou je sais pas quoi, ça, t'es pas obligé de le vendre."}, {"id": "B:BP0812", "bid": "BAY316", "f": "<span class=\"glabel\" style=\"display:block\">If you don't want to do something, you don't have to.<\/span>Just sell the things that you really don't have trouble separating yourself from.", "b": "Vends juste les trucs dont t'as vraiment pas de mal à te séparer."}, {"id": "B:BP0810", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span><span class=\"dim\">You only have to negotiate a bit, see how it goes, and <\/span><mark>in any case, you're not obliged to sell everything.<\/mark>", "b": "<span class=\"dim\">T'as qu'à négocier un peu, voir comment ça se passe, et <\/span><mark>de toute façon, t'es pas obligé de tout vendre.<\/mark>"}, {"id": "B:BP0443", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>And I'm not saying that you have to set yourself to doing absolutely all the repairs yourself.", "b": "Et je dis pas que tu dois te mettre à faire absolument toutes les réparations toi-même."}, {"id": "B:BP0446", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>But you're not obliged either.", "b": "Mais t'es pas obligé non plus."}, {"id": "B:BP0541", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span><span class=\"dim\">I tell myself that that could be really nice, and <\/span><mark>we could take some tickets just for one day, or for a few days if we feel like it.<\/mark>", "b": "<span class=\"dim\">Je me dis que ça pourrait être vraiment sympa, et <\/span><mark>on pourrait prendre des billets juste pour une journée, ou pour quelques jours si ça nous dit.<\/mark>"}, {"id": "B:BP0551", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>Plus, we're not obliged to take tickets for the four days.", "b": "En plus, on est pas obligés de prendre des billets pour les quatre jours."}, {"id": "B:BP0447", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span><mark>At the limit, you could just use the garage for the little snags<\/mark><span class=\"dim\">, or go there one weekend when you have a few hours in front of you and that you feel like tinkering a bit or learning more.<\/span>", "b": "<mark>À la limite, tu pourrais juste utiliser le garage pour les petits pépins<\/mark><span class=\"dim\">, ou y aller un week-end quand t'as quelques heures devant toi et que t'as envie de bricoler un peu ou d'en apprendre plus.<\/span>"}, {"id": "B:BP0991", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>You're not even obliged to use this site to buy stuff.", "b": "T'es même pas obligé d'utiliser ce site pour acheter des trucs."}, {"id": "B:BP0992", "bid": "BAY317", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do all of it; you can do just part.<\/span>You can just use it to sell, like that you earn money.", "b": "Tu peux juste t'en servir pour vendre, comme ça tu gagnes de l'argent."}, {"id": "B:BP1186", "bid": "BAY318", "f": "<span class=\"glabel\" style=\"display:block\">You'd only have to do one small part.<\/span>You, at the limit, you could just help me a bit on the recipes and the ingredients that seem to you the most adapted.", "b": "Toi, à la limite, tu pourrais juste m'aider un peu sur les recettes et les ingrédients qui te semblent les plus adaptés."}, {"id": "B:BP0965", "bid": "BAY318", "f": "<span class=\"glabel\" style=\"display:block\">You'd only have to do one small part.<\/span>After, all that remains for you to do, it's the CAPTCHA tests that verify that you're really a human.", "b": "Après, tout ce qui te reste à faire, c'est les tests CAPTCHA qui vérifient que t'es bien un humain."}, {"id": "B:BP0673", "bid": "BAY319", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't have to do it for lots of people every time.<\/span>And you wouldn't have either to make food for loads of people each time.", "b": "Et t'aurais pas non plus à faire à manger pour plein de monde à chaque fois."}, {"id": "B:BP0565", "bid": "BAY320", "f": "<span class=\"glabel\" style=\"display:block\">It's not only the part you don't like.<\/span>It wouldn't be only music, so you shouldn't say no just because you don't adore music or that you don't feel like listening to it the whole day.", "b": "Ce serait pas que de la musique, alors tu devrais pas dire non juste parce que t'adores pas la musique ou que t'as pas envie d'en écouter toute la journée."}, {"id": "B:BP0560", "bid": "BAY320", "f": "<span class=\"glabel\" style=\"display:block\">It's not only the part you don't like.<\/span><span class=\"dim\">You're right, passing hours in a festival, that can be tiring, but <\/span><mark>we wouldn't be obliged to listen to music all the time.<\/mark>", "b": "<span class=\"dim\">T'as raison, passer des heures dans un festival, ça peut être fatigant, mais <\/span><mark>on serait pas obligés d'écouter de la musique tout le temps.<\/mark>"}, {"id": "B:BP1133", "bid": "BAY321", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't have to be in that form.<\/span><span class=\"dim\">And then <\/span><mark>it's not obliged that it be brochures<\/mark><span class=\"dim\"> — distributing brochures, I don't find that efficient.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>c'est pas obligé que ce soit des brochures<\/mark><span class=\"dim\"> — distribuer des brochures, je trouve pas ça efficace.<\/span>"}, {"id": "B:BP0668", "bid": "BAY322", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to push people.<\/span><span class=\"dim\">You're not obliged to make tons of it, and above all, <\/span><mark>you really don't have to put the pressure on people so that they buy anything whatsoever.<\/mark>", "b": "<span class=\"dim\">T'es pas obligé d'en faire des tonnes, et surtout, <\/span><mark>t'as vraiment pas à mettre la pression aux gens pour qu'ils achètent quoi que ce soit.<\/mark>"}, {"id": "B:BP0652", "bid": "BAY322", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to push people.<\/span>But you wouldn't have to force the hand of your mates, nor to take that like a super serious job.", "b": "Mais t'aurais pas à forcer la main à tes potes, ni à prendre ça comme un job super sérieux."}, {"id": "B:BP0670", "bid": "BAY322", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to push people.<\/span>And if your mates aren't interested, too bad — you don't need to insist to sell them the thing.", "b": "Et si tes potes sont pas intéressés, tant pis — t'as pas besoin d'insister pour leur vendre le truc."}, {"id": "B:BP0669", "bid": "BAY323", "f": "<span class=\"glabel\" style=\"display:block\">You can keep it casual; don't overdo it.<\/span>You could just do that hyper calmly.", "b": "Tu pourrais juste faire ça hyper tranquille."}, {"id": "B:BP0654", "bid": "BAY323", "f": "<span class=\"glabel\" style=\"display:block\">You can keep it casual; don't overdo it.<\/span>For example, if you already had some mates who were coming to your place for a thing, you could bring up the subject like it's nothing, like a little extra.", "b": "Par exemple, si t'avais déjà des potes qui venaient chez toi pour un truc, tu pourrais amener le sujet l'air de rien, comme un petit extra."}, {"id": "B:BP0667", "bid": "BAY323", "f": "<span class=\"glabel\" style=\"display:block\">You can keep it casual; don't overdo it.<\/span><mark>You're not obliged to make tons of it<\/mark><span class=\"dim\">, and above all, you really don't have to put the pressure on people so that they buy anything whatsoever.<\/span>", "b": "<mark>T'es pas obligé d'en faire des tonnes<\/mark><span class=\"dim\">, et surtout, t'as vraiment pas à mettre la pression aux gens pour qu'ils achètent quoi que ce soit.<\/span>"}, {"id": "B:BP0809", "bid": "BAY324", "f": "<span class=\"glabel\" style=\"display:block\">Just try a little and see how it goes.<\/span><mark>You only have to negotiate a bit, see how it goes<\/mark><span class=\"dim\">, and in any case, you're not obliged to sell everything.<\/span>", "b": "<mark>T'as qu'à négocier un peu, voir comment ça se passe<\/mark><span class=\"dim\">, et de toute façon, t'es pas obligé de tout vendre.<\/span>"}, {"id": "B:BP0312", "bid": "BAY325", "f": "<span class=\"glabel\" style=\"display:block\">There are lots of different options.<\/span><span class=\"dim\">Yeah, that I understand, but <\/span><mark>there's plenty of different things to do.<\/mark>", "b": "<span class=\"dim\">Ouais, ça je comprends, mais <\/span><mark>y a plein de trucs différents à faire.<\/mark>"}, {"id": "B:BP0161", "bid": "BAY325", "f": "<span class=\"glabel\" style=\"display:block\">There are lots of different options.<\/span>There's plenty of different ways to garden.", "b": "Y a plein de façons différentes de jardiner."}, {"id": "B:BP0590", "bid": "BAY325", "f": "<span class=\"glabel\" style=\"display:block\">There are lots of different options.<\/span>And there are several themes to choose from, so then you could just take the one that pleases you the most and recount your story around that.", "b": "Et y a plusieurs thèmes au choix, du coup tu pourrais juste prendre celui qui te plaît le plus et raconter ton histoire autour de ça."}, {"id": "B:BP1196", "bid": "BAY326", "f": "<span class=\"glabel\" style=\"display:block\">If one option doesn't suit you, just pick another one.<\/span><span class=\"dim\">So <\/span><mark>even if you fall on an exercise that doesn't suit you too much — let's put that it hurts your joints or a thing like that — you only have to take another one in this enormous library.<\/mark>", "b": "<span class=\"dim\">Alors <\/span><mark>même si tu tombes sur un exercice qui te va pas trop — mettons qu'il te fasse mal aux articulations ou un truc comme ça — t'as qu'à en prendre un autre dans cette énorme bibliothèque.<\/mark>"}, {"id": "B:BP0131", "bid": "BAY326", "f": "<span class=\"glabel\" style=\"display:block\">If one option doesn't suit you, just pick another one.<\/span><span class=\"dim\">And then <\/span><mark>even if there is a subject that it bothers you a bit to bring up, it's not the only thing that you could talk about. There would be others, subjects.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>même s'il y a un sujet que ça te gêne un peu d'aborder, c'est pas le seul truc dont tu pourrais parler. Y en aurait d'autres, des sujets.<\/mark>"}, {"id": "B:BP0314", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>You could choose something else, maybe a thing in a corner where there wouldn't be heaps of kids who run everywhere.", "b": "Tu pourrais choisir autre chose, peut-être un truc dans un coin où y aurait pas des tas de gamins qui courent partout."}, {"id": "B:BP0092", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>Evidently, you mustn't choose a house where they expect of you that you do a pile of complicated things or that you maintain thirty-six thousand things. You could maybe choose yourself one of the most simple houses.", "b": "Évidemment, faut pas que tu choisisses une maison où ils attendent de toi que tu fasses un tas de trucs compliqués ou que t'entretiennes trente-six mille choses. Tu pourrais peut-être te choisir une des maisons les plus simples."}, {"id": "B:BP0290", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>You could just choose services that seem to you much less risky.", "b": "Tu pourrais juste choisir des services qui te paraissent bien moins risqués."}, {"id": "B:BP0386", "bid": "BAY327", "f": "<span class=\"glabel\" style=\"display:block\">You could pick an option that avoids the part you don't like.<\/span>At the limit, you could take care of the administrative part, a thing in that genre.", "b": "À la limite, tu pourrais t'occuper de la partie administrative, un truc dans le genre."}, {"id": "B:BP0385", "bid": "BAY328", "f": "<span class=\"glabel\" style=\"display:block\">There might even be an option without that part.<\/span>Or else, there are maybe things to do, as volunteer, where you don't need at all to be in direct contact with the animals.", "b": "Ou alors, y a peut-être des trucs à faire, comme bénévole, où t'as pas du tout besoin d'être en contact direct avec les animaux."}, {"id": "B:BP0162", "bid": "BAY328", "f": "<span class=\"glabel\" style=\"display:block\">There might even be an option without that part.<\/span>Maybe even they have a thing on interior gardening or apartment plants.", "b": "Peut-être même qu'ils ont un truc sur le jardinage d'intérieur ou les plantes d'appartement."}, {"id": "B:BP0294", "bid": "BAY329", "f": "<span class=\"glabel\" style=\"display:block\">You could stick to things you can do online.<\/span>In any case, there's surely plenty of things that you could do entirely online, like writing emails or giving a hand for other simple things.", "b": "De toute façon, y a sûrement plein de trucs que tu pourrais faire entièrement en ligne, comme écrire des mails ou donner un coup de main pour d'autres trucs simples."}, {"id": "B:BP0282", "bid": "BAY329", "f": "<span class=\"glabel\" style=\"display:block\">You could stick to things you can do online.<\/span>At the limit, you could hold yourself to services that you can render in a public place, or even to things that you can do completely online.", "b": "À la limite, tu pourrais t'en tenir à des services que tu peux rendre dans un lieu public, ou même à des trucs que tu peux faire complètement en ligne."}, {"id": "B:BP1204", "bid": "BAY330", "f": "<span class=\"glabel\" style=\"display:block\">You can do it from home; no need to go anywhere.<\/span><span class=\"dim\">Whereas <\/span><mark>there, for once, you do everything from your place, nice and tranquil.<\/mark>", "b": "<span class=\"dim\">Alors que <\/span><mark>là, pour le coup, tu fais tout depuis chez toi, bien tranquille.<\/mark>"}, {"id": "B:BP0295", "bid": "BAY330", "f": "<span class=\"glabel\" style=\"display:block\">You can do it from home; no need to go anywhere.<\/span>You wouldn't necessarily need to meet anyone at all, nor even to go into a public place.", "b": "T'aurais pas forcément besoin de rencontrer qui que ce soit, ni même d'aller dans un lieu public."}, {"id": "B:BP0925", "bid": "BAY330", "f": "<span class=\"glabel\" style=\"display:block\">You can do it from home; no need to go anywhere.<\/span><mark>You don't need to go there in person<\/mark><span class=\"dim\">, and you have access to plenty of books online, in digital format.<\/span>", "b": "<mark>T'as pas besoin d'y aller en personne<\/mark><span class=\"dim\">, et t'as accès à plein de livres en ligne, au format numérique.<\/span>"}, {"id": "B:BP0390", "bid": "BAY331", "f": "<span class=\"glabel\" style=\"display:block\">That's still an option too.<\/span>So then, that too, it's a thing that you could do.", "b": "Du coup, ça aussi, c'est un truc que tu pourrais faire."}, {"id": "B:BP0388", "bid": "BAY331", "f": "<span class=\"glabel\" style=\"display:block\">That's still an option too.<\/span><span class=\"dim\">Yeah, I know, you told me that you were allergic to animals, but <\/span><mark>it could all the same be an alternative.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais, tu m'as dit que t'étais allergique aux animaux, mais <\/span><mark>ça pourrait quand même être une alternative.<\/mark>"}, {"id": "B:BP0933", "bid": "BAY332", "f": "<span class=\"glabel\" style=\"display:block\">It's good to have another option when you need it.<\/span>I just find that it's good to have another option.", "b": "Je trouve juste que c'est bien d'avoir une autre option."}, {"id": "B:BP0944", "bid": "BAY332", "f": "<span class=\"glabel\" style=\"display:block\">It's good to have another option when you need it.<\/span>It's just a good alternative to have at hand for when you need it.", "b": "C'est juste une bonne alternative à avoir sous la main pour quand t'en as besoin."}, {"id": "B:BP0299", "bid": "BAY332", "f": "<span class=\"glabel\" style=\"display:block\">It's good to have another option when you need it.<\/span><mark>In the end, I just find that it could be a useful option to have under the elbow if ever you need it<\/mark><span class=\"dim\">, and that looks interesting.<\/span>", "b": "<mark>Au final, je trouve juste que ça pourrait être une option utile à avoir sous le coude si jamais t'en as besoin<\/mark><span class=\"dim\">, et ça a l'air intéressant.<\/span>"}, {"id": "B:BP0934", "bid": "BAY333", "f": "<span class=\"glabel\" style=\"display:block\">If you don't feel like going out, you can do it online instead.<\/span><span class=\"dim\">For example, <\/span><mark>if it rains and you really don't feel like doing the whole journey up to the library, you could very well use the one online and read a thing in digital.<\/mark>", "b": "<span class=\"dim\">Par exemple, <\/span><mark>s'il pleut et que t'as vraiment pas envie de faire tout le trajet jusqu'à la bibliothèque, tu pourrais très bien utiliser celle en ligne et lire un truc en numérique.<\/mark>"}, {"id": "B:BP0450", "bid": "BAY334", "f": "<span class=\"glabel\" style=\"display:block\">If needed, you can still fall back on the usual way.<\/span>And if you're too taken, that it doesn't stick with your schedule or that you have a thing to get repaired urgently, there obviously, you can always go to a mechanic's.", "b": "Et si t'es trop pris, que ça colle pas avec ton emploi du temps ou que t'as un truc à faire réparer en urgence, là évidemment, tu peux toujours aller chez un garagiste."}, {"id": "B:BP0939", "bid": "BAY334", "f": "<span class=\"glabel\" style=\"display:block\">If needed, you can still fall back on the usual way.<\/span><span class=\"dim\">And <\/span><mark>even if you couldn't, you could always go to the library after to continue reading it, or buy it if you really held to it.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>même si tu pouvais pas, tu pourrais toujours aller à la bibliothèque après pour continuer à le lire, ou l'acheter si t'y tenais vraiment.<\/mark>"}, {"id": "B:BP0348", "bid": "BAY335", "f": "<span class=\"glabel\" style=\"display:block\">The itinerary is flexible.<\/span>And like I told you, the itinerary is flexible.", "b": "Et comme je t'ai dit, l'itinéraire est flexible."}, {"id": "B:BP0342", "bid": "BAY335", "f": "<span class=\"glabel\" style=\"display:block\">The itinerary is flexible.<\/span>Besides, the ad says also that we can change the itineraries, like that we would have a bit of flexibility.", "b": "D'ailleurs, l'annonce dit aussi qu'on peut changer les itinéraires, comme ça on aurait un peu de souplesse."}, {"id": "B:BP0349", "bid": "BAY336", "f": "<span class=\"glabel\" style=\"display:block\">We can choose our own route to suit us.<\/span>So then, if the routes that the local guides propose don't please you, we could choose ours instead.", "b": "Du coup, si les trajets que proposent les guides locaux te plaisent pas, on pourrait choisir les nôtres à la place."}, {"id": "B:BP0343", "bid": "BAY336", "f": "<span class=\"glabel\" style=\"display:block\">We can choose our own route to suit us.<\/span>We could choose our route and our hours depending on the weather, instead of being stuck with one single fixed programme.", "b": "On pourrait choisir notre trajet et nos horaires en fonction de la météo, au lieu d'être coincés avec un seul programme fixe."}, {"id": "B:BP0351", "bid": "BAY336", "f": "<span class=\"glabel\" style=\"display:block\">We can choose our own route to suit us.<\/span>And the rhythm of the trip would depend on the itinerary that we choose, so we could find a thing that suits us.", "b": "Et le rythme du voyage dépendrait de l'itinéraire qu'on choisit, donc on pourrait trouver un truc qui nous va."}, {"id": "B:BP0340", "bid": "BAY337", "f": "<span class=\"glabel\" style=\"display:block\">We could go at a time of year with better weather.<\/span>We could also go there at a period of the year where it doesn't rain a lot.", "b": "On pourrait aussi y aller à une période de l'année où il pleut pas beaucoup."}, {"id": "B:BP0341", "bid": "BAY338", "f": "<span class=\"glabel\" style=\"display:block\">If it rains, we can stop and do something indoors.<\/span>And even if it rained, at worst we would stop a moment and we would do a thing inside.", "b": "Et même s'il pleuvait, au pire on s'arrêterait un moment et on ferait un truc à l'intérieur."}, {"id": "B:BP0350", "bid": "BAY339", "f": "<span class=\"glabel\" style=\"display:block\">Maybe we could even drive it ourselves.<\/span>Maybe even that there would be a way to drive the tuk-tuk ourselves.", "b": "Peut-être même qu'il y aurait moyen de conduire le tuk-tuk nous-mêmes."}, {"id": "B:BP0550", "bid": "BAY340", "f": "<span class=\"glabel\" style=\"display:block\">If it gets too crowded, we can go somewhere quieter.<\/span>And if ever you started to feel claustrophobic or that it was too much for you, we would only have to go to a place less packed.", "b": "Et si jamais tu commençais à te sentir claustrophobe ou que c'était trop pour toi, on aurait qu'à aller dans un endroit moins bondé."}, {"id": "B:BP0549", "bid": "BAY340", "f": "<span class=\"glabel\" style=\"display:block\">If it gets too crowded, we can go somewhere quieter.<\/span>But even if there are a lot of people, it's sure that there would be all the same some quieter corners where we could distance ourselves a bit from the crowd.", "b": "Mais même s'il y a beaucoup de monde, c'est sûr qu'il y aurait quand même des coins plus tranquilles où on pourrait s'éloigner un peu de la foule."}, {"id": "B:BP0563", "bid": "BAY341", "f": "<span class=\"glabel\" style=\"display:block\">We could sit down and rest for a while.<\/span><span class=\"dim\">We could go see a few debates, do a tour of the grub stands, taste some organic and local stuff, or <\/span><mark>just put ourselves down on a bench somewhere and breathe a moment.<\/mark>", "b": "<span class=\"dim\">On pourrait aller voir quelques débats, faire un tour aux stands de bouffe, goûter des trucs bio et locaux, ou <\/span><mark>juste se poser sur un banc quelque part et souffler un moment.<\/mark>"}, {"id": "B:BP0016", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span><span class=\"dim\">It will be squarely more restful for you, and <\/span><mark>me, I take care of all the sporty and exhausting side.<\/mark>", "b": "<span class=\"dim\">Ce sera carrément plus reposant pour toi, et <\/span><mark>moi, je m'occupe de tout le côté sportif et crevant.<\/mark>"}, {"id": "B:BP0013", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>Me I paddle, and you, you just have to sit yourself behind me in the canoe.", "b": "Moi je pagaie, et toi, t'as juste à t'asseoir derrière moi dans le canoë."}, {"id": "B:BP0022", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>I'm going to make it so that we've thought of everything.", "b": "Je vais faire en sorte qu'on ait pensé à tout."}, {"id": "B:BP0209", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>As for finding the rest of the team, let me do it. I can find three other cyclists quite easily, I'll take charge of it.", "b": "Pour ce qui est de trouver le reste de l'équipe, laisse-moi faire. Je peux trouver trois autres cyclistes assez facilement, je m'en charge."}, {"id": "B:BP1184", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span><span class=\"dim\">Well, <\/span><mark>it's me who proposed the idea, so I can do the shopping and manage the organisation and the logistics.<\/mark>", "b": "<span class=\"dim\">Bon, <\/span><mark>c'est moi qui ai proposé l'idée, donc je peux faire les courses et gérer l'organisation et la logistique.<\/mark>"}, {"id": "B:BP1185", "bid": "BAY342", "f": "<span class=\"glabel\" style=\"display:block\">I'll take care of the hard part for you.<\/span>In any case, we're doing that in my kitchen, I can take care of it.", "b": "De toute façon, on fait ça dans ma cuisine, je peux m'en occuper."}, {"id": "B:BP0014", "bid": "BAY343", "f": "<span class=\"glabel\" style=\"display:block\">That way you don't even have to learn how.<\/span>Like that, you don't even have need to learn.", "b": "Comme ça, t'as même pas besoin d'apprendre."}, {"id": "B:BP0015", "bid": "BAY344", "f": "<span class=\"glabel\" style=\"display:block\">It'll be much more relaxing for you.<\/span><mark>It will be squarely more restful for you<\/mark><span class=\"dim\">, and me, I take care of all the sporty and exhausting side.<\/span>", "b": "<mark>Ce sera carrément plus reposant pour toi<\/mark><span class=\"dim\">, et moi, je m'occupe de tout le côté sportif et crevant.<\/span>"}, {"id": "B:BP0017", "bid": "BAY345", "f": "<span class=\"glabel\" style=\"display:block\">I'm going to learn how before we go anyway.<\/span><span class=\"dim\">And <\/span><mark>in any case, I'm going to learn to paddle before we leave<\/mark><span class=\"dim\">, so don't be so pessimistic.<\/span>", "b": "<span class=\"dim\">Et <\/span><mark>de toute façon, je vais apprendre à pagayer avant qu'on parte<\/mark><span class=\"dim\">, alors sois pas si pessimiste.<\/span>"}, {"id": "B:BP0805", "bid": "BAY346", "f": "<span class=\"glabel\" style=\"display:block\">I can help you with it.<\/span>And like I told you, I can help you.", "b": "Et comme je t'ai dit, je peux t'aider."}, {"id": "B:BP0455", "bid": "BAY346", "f": "<span class=\"glabel\" style=\"display:block\">I can help you with it.<\/span>I can even help you to call them or to look for the info, if you want.", "b": "Je peux même t'aider à les appeler ou à chercher les infos, si tu veux."}, {"id": "B:BP1033", "bid": "BAY347", "f": "<span class=\"glabel\" style=\"display:block\">I'll be your backup and fill in for you.<\/span>And if ever, I'll replace you at the drop of a hat. I'll be your plan B, your understudy.", "b": "Et si jamais, je te remplacerai au pied levé. Je serai ton plan B, ta doublure."}, {"id": "B:BP1178", "bid": "BAY348", "f": "<span class=\"glabel\" style=\"display:block\">We can share the work and take turns.<\/span><mark>We can share out the tasks<\/mark><span class=\"dim\">, or otherwise we can use your garden.<\/span>", "b": "<mark>On peut se répartir les tâches<\/mark><span class=\"dim\">, ou sinon on peut utiliser ton jardin.<\/span>"}, {"id": "B:BP1177", "bid": "BAY348", "f": "<span class=\"glabel\" style=\"display:block\">We can share the work and take turns.<\/span>We're not obliged to be all in the kitchen at the same time.", "b": "On est pas obligés d'être tous dans la cuisine en même temps."}, {"id": "B:BP1075", "bid": "BAY348", "f": "<span class=\"glabel\" style=\"display:block\">We can share the work and take turns.<\/span><span class=\"dim\">On top, <\/span><mark>we can all take turns at the wheel, like that there's not one who has to slog through half the road.<\/mark>", "b": "<span class=\"dim\">En plus, <\/span><mark>on peut tous se relayer au volant, comme ça y en a pas un qui doit se taper la moitié de la route.<\/mark>"}, {"id": "B:BP1180", "bid": "BAY349", "f": "<span class=\"glabel\" style=\"display:block\">We could do it at one of our places.<\/span>Or else — wait, listen to me — we could do that in my kitchen. It's totally bigger than yours, so I tell myself that it would be maybe better.", "b": "Ou alors — attends, écoute-moi — on pourrait faire ça dans ma cuisine. Elle est carrément plus grande que la tienne, alors je me dis que ce serait peut-être mieux."}, {"id": "B:BP1179", "bid": "BAY349", "f": "<span class=\"glabel\" style=\"display:block\">We could do it at one of our places.<\/span><span class=\"dim\">We can share out the tasks, or otherwise <\/span><mark>we can use your garden.<\/mark>", "b": "<span class=\"dim\">On peut se répartir les tâches, ou sinon <\/span><mark>on peut utiliser ton jardin.<\/mark>"}, {"id": "B:BP1187", "bid": "BAY350", "f": "<span class=\"glabel\" style=\"display:block\">We can talk to them first and move on if there's a language barrier.<\/span>We can discuss directly with them before they arrive, like that if ever there's a language worry, we can decide on the moment to not give it a follow-up.", "b": "On peut discuter directement avec eux avant qu'ils arrivent, comme ça si jamais y a un souci de langue, on peut décider sur le moment de pas donner suite."}, {"id": "B:BP1188", "bid": "BAY350", "f": "<span class=\"glabel\" style=\"display:block\">We can talk to them first and move on if there's a language barrier.<\/span>We can communicate in English, and if they, they don't manage it, we pass to the next person on the site.", "b": "On peut communiquer en anglais, et si eux ils y arrivent pas, on passe à la personne d'après sur le site."}, {"id": "B:BP1093", "bid": "BAY351", "f": "<span class=\"glabel\" style=\"display:block\">Everyone pays upfront, so dropouts don't hurt the group.<\/span>For the organisation of the trip, we wouldn't advance on the plan as long as everyone hasn't really committed by paying their share of the costs in advance. Like that, even if there are some who drop out at the last minute, that doesn't penalise the rest of the group.", "b": "Pour l'organisation du voyage, on avancerait pas sur le plan tant que tout le monde s'est pas vraiment engagé en payant sa part des frais à l'avance. Comme ça, même si y en a qui lâchent à la dernière minute, ça pénalise pas le reste du groupe."}, {"id": "B:BP0024", "bid": "BAY352", "f": "<span class=\"glabel\" style=\"display:block\">The organizers plan everything, so we don't have to.<\/span>And honestly, there's big chances that they've already foreseen everything and organised everything for us, in any case, including all the logistics part.", "b": "Et honnêtement, y a de grandes chances qu'ils aient déjà tout prévu et tout organisé pour nous, de toute façon, y compris toute la partie logistique."}, {"id": "B:BP0025", "bid": "BAY352", "f": "<span class=\"glabel\" style=\"display:block\">The organizers plan everything, so we don't have to.<\/span>It's a bit the whole interest of this kind of holidays: we don't have to break our heads planning each little detail ourselves.", "b": "C'est un peu tout l'intérêt de ce genre de vacances : on a pas à se prendre la tête à planifier chaque petit détail nous-mêmes."}, {"id": "B:BP1097", "bid": "BAY352", "f": "<span class=\"glabel\" style=\"display:block\">The organizers plan everything, so we don't have to.<\/span>Roughly, they organise all that for us.", "b": "En gros, ils nous organisent tout ça."}, {"id": "B:BP0234", "bid": "BAY353", "f": "<span class=\"glabel\" style=\"display:block\">They'd adapt it to your needs.<\/span>There would be without doubt a bit of flexibility on that.", "b": "Y aurait sans doute un peu de souplesse là-dessus."}, {"id": "B:BP0232", "bid": "BAY353", "f": "<span class=\"glabel\" style=\"display:block\">They'd adapt it to your needs.<\/span>And as for the grub, I'm sure that they would have a way to take into account your food preferences if they asked you to taste a thing.", "b": "Et pour ce qui est de la bouffe, je suis sûr qu'ils auraient un moyen de prendre en compte tes préférences alimentaires s'ils te demandaient de goûter un truc."}, {"id": "B:BP0594", "bid": "BAY353", "f": "<span class=\"glabel\" style=\"display:block\">They'd adapt it to your needs.<\/span>And in any case, it's possible that the jury or the organisers help you arrange things according to your budget or your schedule.", "b": "Et de toute façon, c'est possible que le jury ou les organisateurs t'aident à arranger les choses en fonction de ton budget ou de ton emploi du temps."}, {"id": "B:BP0964", "bid": "BAY354", "f": "<span class=\"glabel\" style=\"display:block\">A tool can do most of the work for you.<\/span>Seeing what AI knows how to do today, you can go on an app like Claude Code and ask it to generate you a script or a robot that answers these surveys in your place.", "b": "Vu ce que l'IA sait faire aujourd'hui, tu peux aller sur une appli c  it looks hyper risky, but in fact, <\/span><mark>if you really look at the statistics, it's less risky than lots of things that we do every day, like driving.<\/mark>", "b": "<span class=\"dim\">La première fois que t'entends parler de saut en parachute, ça a l'air hyper risqué, mais en fait, <\/span><mark>si tu regardes vraiment les statistiques, c'est moins risqué que plein de trucs qu'on fait tous les jours, comme conduire.<\/mark>"}, {"id": "B:BP0339", "bid": "BAY398", "f": "<span class=\"glabel\" style=\"display:block\">It's not fast, so it's not a big concern.<\/span>And anyway, a tuk-tuk, it's not really a fast vehicle, so I really don't think that it's a big worry.", "b": "Et de toute façon, un tuk-tuk, c'est pas vraiment un véhicule rapide, donc je pense vraiment pas que ce soit un gros souci."}, {"id": "B:BP0685", "bid": "BAY399", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't be out with the wild animals.<\/span>And then it's not like you were going to sleep outside right beside the wolves, eh.", "b": "Et puis c'est pas comme si t'allais dormir dehors juste à côté des loups, hein."}, {"id": "B:BP0686", "bid": "BAY400", "f": "<span class=\"glabel\" style=\"display:block\">You'd stay somewhere safe and comfortable.<\/span>You would be in a chalet, so then it would be all the same comfortable and secure, all while being really unusual and exciting.", "b": "Tu serais dans un chalet, du coup ce serait quand même confortable et sécurisé, tout en étant vraiment insolite et excitant."}, {"id": "B:BP0201", "bid": "BAY401", "f": "<span class=\"glabel\" style=\"display:block\">The point isn't to put ourselves in danger.<\/span>The idea, it's not to put ourselves in danger.", "b": "L'idée, c'est pas de se mettre en danger."}, {"id": "B:BP0770", "bid": "BAY402", "f": "<span class=\"glabel\" style=\"display:block\">We could enjoy it without stressing.<\/span>We could really profit from the experience without breaking our heads over the slightest little thing.", "b": "On pourrait vraiment profiter de l'expérience sans se prendre la tête pour le moindre petit truc."}, {"id": "B:BP0763", "bid": "BAY403", "f": "<span class=\"glabel\" style=\"display:block\">They're professionals; they know what they're doing.<\/span><span class=\"dim\">After, obviously, it would make us all freak out, but <\/span><mark>the people who organise that, it's pros, they know what they're doing.<\/mark>", "b": "<span class=\"dim\">Après, évidemment, ça nous ferait tous flipper, mais <\/span><mark>les gens qui organisent ça, c'est des pros, ils savent ce qu'ils font.<\/mark>"}, {"id": "B:BP0045", "bid": "BAY403", "f": "<span class=\"glabel\" style=\"display:block\">They're professionals; they know what they're doing.<\/span>And listen, the chefs, you really don't have to worry yourself for them. They're pros, they know what they do.", "b": "Et écoute, les chefs, t'as vraiment pas à t'en faire pour eux. C'est des pros, ils savent ce qu'ils font."}, {"id": "B:BP0336", "bid": "BAY404", "f": "<span class=\"glabel\" style=\"display:block\">We'd have experienced guides with us.<\/span><mark>We would have experienced guides with us<\/mark><span class=\"dim\">, and I am quasi sure that they would reassure us on everything that is insurance and security stuff.<\/span>", "b": "<mark>On aurait des guides expérimentés avec nous<\/mark><span class=\"dim\">, et je suis quasiment sûr qu'ils nous rassureraient sur tout ce qui est assurance et trucs de sécurité.<\/span>"}, {"id": "B:BP0333", "bid": "BAY404", "f": "<span class=\"glabel\" style=\"display:block\">We'd have experienced guides with us.<\/span><span class=\"dim\">We would discover a new place, a whole new region, and on top <\/span><mark>we could have some experienced local guides with us.<\/mark>", "b": "<span class=\"dim\">On découvrirait un nouvel endroit, toute une nouvelle région, et en plus <\/span><mark>on pourrait avoir des guides locaux expérimentés avec nous.<\/mark>"}, {"id": "B:BP0337", "bid": "BAY405", "f": "<span class=\"glabel\" style=\"display:block\">The guides would reassure us about insurance and safety.<\/span><span class=\"dim\">We would have experienced guides with us, and <\/span><mark>I am quasi sure that they would reassure us on everything that is insurance and security stuff.<\/mark>", "b": "<span class=\"dim\">On aurait des guides expérimentés avec nous, et <\/span><mark>je suis quasiment sûr qu'ils nous rassureraient sur tout ce qui est assurance et trucs de sécurité.<\/mark>"}, {"id": "B:BP0684", "bid": "BAY406", "f": "<span class=\"glabel\" style=\"display:block\">Safety is taken care of; they have proper measures in place.<\/span><span class=\"dim\">That said, from what I saw, it had the air of being a serious and experienced organisation, so <\/span><mark>I'm sure that they've put in place what's needed on the security level.<\/mark>", "b": "<span class=\"dim\">Cela dit, de ce que j'ai vu, ça avait l'air d'être un organisme sérieux et expérimenté, donc <\/span><mark>je suis sûr qu'ils ont mis en place ce qu'il faut niveau sécurité.<\/mark>"}, {"id": "B:BP0338", "bid": "BAY406", "f": "<span class=\"glabel\" style=\"display:block\">Safety is taken care of; they have proper measures in place.<\/span>Apparently, all that would be well managed.", "b": "Apparemment, tout ça serait bien géré."}, {"id": "B:BP0768", "bid": "BAY406", "f": "<span class=\"glabel\" style=\"display:block\">Safety is taken care of; they have proper measures in place.<\/span>They would pass everything in review with us, they would take care of all the security side, and they would watch that the equipment and the parachutes are well maintained.", "b": "Ils passeraient tout en revue avec nous, ils s'occuperaient de tout le côté sécurité, et ils veilleraient à ce que le matériel et les parachutes soient bien entretenus."}, {"id": "B:BP0208", "bid": "BAY406", "f": "<span class=\"glabel\" style=\"display:block\">Safety is taken care of; they have proper measu
