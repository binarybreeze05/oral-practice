dans le sens où si tu retrouves quelqu'un et que ça se passe mal ou que tu te sens pas en sécurité, tu peux appeler une sorte de numéro d'assistance.<\/mark>"}, {"id": "B:BP1166", "bid": "BAY413", "f": "<span class=\"glabel\" style=\"display:block\">They probably check that everyone is respectful.<\/span>So then, I tell myself that they do the checks that are needed to make sure that all the people signed up, whether it be the hosts or the tourists, it's respectful people, normal people like us — not criminals.", "b": "Du coup, je me dis qu'ils font les vérifications qu'il faut pour s'assurer que tous les inscrits, que ce soit les hôtes ou les touristes, c'est des gens respectueux, des gens normaux comme nous — pas des criminels."}, {"id": "B:BP1167", "bid": "BAY414", "f": "<span class=\"glabel\" style=\"display:block\">You can talk to them first and check them out.<\/span>And on top, you can first exchange directly with the traveller on their platform, like that you do your own sorting before inviting him to your place.", "b": "Et en plus, tu peux d'abord échanger directement avec le voyageur sur leur plateforme, comme ça tu fais ton propre tri avant de l'inviter chez toi."}, {"id": "B:BP1168", "bid": "BAY415", "f": "<span class=\"glabel\" style=\"display:block\">No one just shows up at your door by surprise.<\/span>It's not the kind « surprise, you've got someone in front of your door », what.", "b": "C'est pas le genre « surprise, t'as quelqu'un devant ta porte », quoi."}, {"id": "B:BP0994", "bid": "BAY416", "f": "<span class=\"glabel\" style=\"display:block\">You can do all the communication on the site.<\/span>All the communication, you can do it on the site.", "b": "Toute la communication, tu peux la faire sur le site."}, {"id": "B:BP0997", "bid": "BAY417", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to share personal information.<\/span>You're not obliged to give your personal info to strangers.", "b": "T'es pas obligé de donner tes infos perso à des inconnus."}, {"id": "B:BP0995", "bid": "BAY417", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to share personal information.<\/span>You don't even need to show your profile photo.", "b": "T'as même pas besoin de montrer ta photo de profil."}, {"id": "B:BP0946", "bid": "BAY418", "f": "<span class=\"glabel\" style=\"display:block\">The ad says your data stays confidential.<\/span><span class=\"dim\">All the same, <\/span><mark>the ad specified well that your data stay confidential.<\/mark>", "b": "<span class=\"dim\">N'empêche, <\/span><mark>l'annonce précisait bien que tes données restent confidentielles.<\/mark>"}, {"id": "B:BP0963", "bid": "BAY419", "f": "<span class=\"glabel\" style=\"display:block\">They already have our data anyway.<\/span>Our data, it's already everywhere, so in the end, it doesn't change much.", "b": "Nos données, elles sont déjà partout, donc au final, ça change pas grand-chose."}, {"id": "B:BP0962", "bid": "BAY419", "f": "<span class=\"glabel\" style=\"display:block\">They already have our data anyway.<\/span>And so? In any case, this data, they already have it, it's just that we don't realise it.", "b": "Et alors ? De toute façon, ces données, elles les ont déjà, c'est juste qu'on s'en rend pas compte."}, {"id": "B:BP0960", "bid": "BAY420", "f": "<span class=\"glabel\" style=\"display:block\">The fear about your data is overblown.<\/span>Me, I find that all this fear that the companies resell your consumption data to third parties, it's a bit exaggerated.", "b": "Moi, je trouve que toute cette peur que les boîtes revendent tes données de conso à des tiers, c'est un peu exagéré."}, {"id": "B:BP0959", "bid": "BAY421", "f": "<span class=\"glabel\" style=\"display:block\">You can get your data deleted.<\/span><span class=\"dim\">Besides, <\/span><mark>there's plenty of tools online nowadays where you can sign up to their service and, roughly, they delete your personal data from no matter which site on the Internet, because legally, they're obliged to do it when one asks them.<\/mark>", "b": "<span class=\"dim\">D'ailleurs, <\/span><mark>y a plein d'outils en ligne de nos jours où tu peux t'inscrire à leur service et, en gros, ils suppriment tes données perso de n'importe quel site sur Internet, parce que légalement, ils sont obligés de le faire quand on leur demande.<\/mark>"}, {"id": "B:BP0988", "bid": "BAY422", "f": "<span class=\"glabel\" style=\"display:block\">For expensive items, don't pay until you see them.<\/span>For expensive items, what I do in general, it's that I don't pay as long as I haven't seen the thing for real.", "b": "Pour les articles chers, ce que je fais en général, c'est que je paye pas tant que j'ai pas vu le truc en vrai."}, {"id": "B:BP0989", "bid": "BAY423", "f": "<span class=\"glabel\" style=\"display:block\">There's buyer protection.<\/span><span class=\"dim\">And on top, <\/span><mark>I believe that there's a sort of buyer protection: if you buy a thing and it was misleading, there's a policy that slips you discount vouchers or rebates for your next purchases.<\/mark>", "b": "<span class=\"dim\">Et en plus, <\/span><mark>je crois qu'il y a une sorte de protection de l'acheteur : si t'achètes un truc et que c'était trompeur, y a une politique qui te file des bons de réduction ou des remises pour tes prochains achats.<\/mark>"}, {"id": "B:BP0482", "bid": "BAY424", "f": "<span class=\"glabel\" style=\"display:block\">They're the experts; they can tell us more.<\/span>It's them the experts. They know about it much better than me in there, so then they could give you the info that you're looking for.", "b": "C'est eux les experts. Ils s'y connaissent bien mieux que moi là-dedans, du coup ils pourraient te donner les infos que tu cherches."}, {"id": "B:BP0520", "bid": "BAY424", "f": "<span class=\"glabel\" style=\"display:block\">They're the experts; they can tell us more.<\/span>Them, they could tell us more about it, given that they really know what they're talking about.", "b": "Eux, ils pourraient nous en dire plus, vu qu'ils savent vraiment de quoi ils parlent."}]}, {"key": "B-BA13", "sec": "B", "code": "BA13", "name": "Don't let fear decide", "bucket": "Arguments", "items": [{"id": "B:BP0018", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span><span class=\"dim\">And in any case, I'm going to learn to paddle before we leave, so <\/span><mark>don't be so pessimistic.<\/mark>", "b": "<span class=\"dim\">Et de toute façon, je vais apprendre à pagayer avant qu'on parte, alors <\/span><mark>sois pas si pessimiste.<\/mark>"}, {"id": "B:BP0088", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Don't be so pessimistic.", "b": "Sois pas si pessimiste."}, {"id": "B:BP0171", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Come on, don't be so pessimistic.", "b": "Allez, sois pas si pessimiste."}, {"id": "B:BP0283", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Don't be so pessimistic.", "b": "Sois pas si pessimiste."}, {"id": "B:BP0321", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh come on, don't be so pessimistic on that.", "b": "Oh allez, sois pas si pessimiste là-dessus."}, {"id": "B:BP0381", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Well, OK, but don't be so pessimistic.", "b": "Bon, d'accord, mais sois pas si pessimiste."}, {"id": "B:BP0476", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh, come on, don't be so pessimistic.", "b": "Oh, allez, sois pas si pessimiste."}, {"id": "B:BP0596", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>No, don't be so pessimistic.", "b": "Non, sois pas si pessimiste."}, {"id": "B:BP0615", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh come on, don't be so pessimistic.", "b": "Oh allez, sois pas si pessimiste."}, {"id": "B:BP0666", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Yeah, but don't be so pessimistic.", "b": "Ouais, mais sois pas si pessimiste."}, {"id": "B:BP0778", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Come on, don't be so pessimistic about it.", "b": "Allez, sois pas si pessimiste là-dessus."}, {"id": "B:BP0800", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh come on, don't be so pessimistic!", "b": "Oh allez, sois pas si pessimiste !"}, {"id": "B:BP0847", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Don't be so pessimistic, come on.", "b": "Sois pas si pessimiste, enfin."}, {"id": "B:BP0911", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>No, don't be so pessimistic.", "b": "Non, sois pas si pessimiste."}, {"id": "B:BP0941", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Oh, come on, don't be so pessimistic!", "b": "Oh, allez, sois pas si pessimiste !"}, {"id": "B:BP0262", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span><span class=\"dim\">After, <\/span><mark>I find also that you're a bit too pessimistic on that.<\/mark>", "b": "<span class=\"dim\">Après, <\/span><mark>je trouve aussi que t'es un peu trop pessimiste là-dessus.<\/mark>"}, {"id": "B:BP0133", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span><span class=\"dim\">Yeah, I know, but <\/span><mark>don't be so pessimistic before even having tried.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais, mais <\/span><mark>sois pas aussi pessimiste avant même d'avoir essayé.<\/mark>"}, {"id": "B:BP0718", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>Ok, but frankly, I don't think that you should be so pessimistic right from now.", "b": "Ok, mais franchement, je pense pas que tu doives être aussi pessimiste dès maintenant."}, {"id": "B:BP0566", "bid": "BAY425", "f": "<span class=\"glabel\" style=\"display:block\">Don't be so pessimistic.<\/span>And don't be so pessimistic telling yourself that the tickets are necessarily already all sold.", "b": "Et sois pas si pessimiste en te disant que les billets sont forcément déjà tous vendus."}, {"id": "B:BP1130", "bid": "BAY426", "f": "<span class=\"glabel\" style=\"display:block\">By that logic, why do anything?<\/span>Bah, it's a bit pessimistic as a way of seeing, no? Well, at that count, why do whatever it may be?", "b": "Bah, c'est un peu pessimiste comme façon de voir, non ? Bon, à ce compte-là, pourquoi faire quoi que ce soit ?"}, {"id": "B:BP0322", "bid": "BAY427", "f": "<span class=\"glabel\" style=\"display:block\">Just keep an open mind.<\/span>Keep the mind open, that's all.", "b": "Garde l'esprit ouvert, c'est tout."}, {"id": "B:BP0170", "bid": "BAY427", "f": "<span class=\"glabel\" style=\"display:block\">Just keep an open mind.<\/span>You just have to be a bit more open-minded on that.", "b": "Faut juste que tu sois un peu plus ouvert d'esprit là-dessus."}, {"id": "B:BP0621", "bid": "BAY427", "f": "<span class=\"glabel\" style=\"display:block\">Just keep an open mind.<\/span>Just try to keep the mind open.", "b": "Essaie juste de garder l'esprit ouvert."}, {"id": "B:BP0096", "bid": "BAY428", "f": "<span class=\"glabel\" style=\"display:block\">Don't assume it's a problem before you know the details.<\/span><span class=\"dim\">So <\/span><mark>don't start from the principle that it's going to pose a problem before even knowing what there is really to do.<\/mark>", "b": "<span class=\"dim\">Donc <\/span><mark>pars pas du principe que ça va poser problème avant même de savoir ce qu'il y a vraiment à faire.<\/mark>"}, {"id": "B:BP0176", "bid": "BAY429", "f": "<span class=\"glabel\" style=\"display:block\">The idea isn't that crazy.<\/span><span class=\"dim\">So then, <\/span><mark>me, I don't find that the idea is as crazy as all that.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>moi, je trouve pas que l'idée soit si folle que ça.<\/mark>"}, {"id": "B:BP1021", "bid": "BAY430", "f": "<span class=\"glabel\" style=\"display:block\">We think about what could go wrong, not what could go right.<\/span>One has a tendency to focus too much on what could go badly, instead of thinking about what could go well.", "b": "On a tendance à trop se focaliser sur ce qui pourrait mal se passer, au lieu de penser à ce qui pourrait bien se passer."}, {"id": "B:BP1027", "bid": "BAY431", "f": "<span class=\"glabel\" style=\"display:block\">Lots of things could go right.<\/span>There's plenty of stuff that could go well.", "b": "Y a plein de trucs qui pourraient bien se passer."}, {"id": "B:BP1024", "bid": "BAY431", "f": "<span class=\"glabel\" style=\"display:block\">Lots of things could go right.<\/span>But what is it that could happen that's good?", "b": "Mais qu'est-ce qui pourrait se passer de bien ?"}, {"id": "B:BP0616", "bid": "BAY432", "f": "<span class=\"glabel\" style=\"display:block\">You never know how it will go.<\/span>One never knows how it's going to go.", "b": "On sait jamais comment ça va se passer."}, {"id": "B:BP0852", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>Me, I just tell myself that you have nothing to lose by applying.", "b": "Moi, je me dis juste que t'as rien à perdre à postuler."}, {"id": "B:BP0606", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>So in the end, you don't risk much by participating.", "b": "Donc au final, tu risques pas grand-chose à participer."}, {"id": "B:BP0849", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>And even if you apply and you don't get the job, in truth, what do you risk?", "b": "Et même si tu postules et que t'as pas le job, en vrai, qu'est-ce que tu risques ?"}, {"id": "B:BP1062", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span><span class=\"dim\">It's true that it's pressure, but <\/span><mark>the stakes, them, are not so high as that.<\/mark>", "b": "<span class=\"dim\">C'est vrai que c'est de la pression, mais <\/span><mark>les enjeux, eux, sont pas si élevés que ça.<\/mark>"}, {"id": "B:BP1129", "bid": "BAY433", "f": "<span class=\"glabel\" style=\"display:block\">You've got nothing to lose; the stakes are low.<\/span>Frankly, there's no pressure at all, man.", "b": "Franchement, y a aucune pression, mec."}, {"id": "B:BP0602", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>And even if everything went badly, you would come out of it despite everything with a precious experience.", "b": "Et même si tout se passait mal, t'en ressortirais malgré tout avec une expérience précieuse."}, {"id": "B:BP1170", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>At worst, you pass a good moment with someone from another country.", "b": "Au pire, tu passes un bon moment avec quelqu'un d'un autre pays."}, {"id": "B:BP0595", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>And even if for one reason or another you couldn't do the tour, just participating in the contest, that would already be a super experience.", "b": "Et même si pour une raison ou une autre tu pouvais pas faire la tournée, rien que participer au concours, ce serait déjà une super expérience."}, {"id": "B:BP0605", "bid": "BAY434", "f": "<span class=\"glabel\" style=\"display:block\">Even in the worst case, you still get a good experience.<\/span>In fact, it's that that I want to say — even if you don't win the contest, you would all the same be a winner otherwise, because you would have surpassed yourself and you would have acquired this experience.", "b": "En fait, c'est ça que je veux dire — même si tu gagnes pas le concours, tu serais quand même gagnant autrement, parce que tu te serais dépassé et t'aurais acquis cette expérience."}, {"id": "B:BP1023", "bid": "BAY435", "f": "<span class=\"glabel\" style=\"display:block\">Worst case, one embarrassing day you'll laugh about later.<\/span><span class=\"dim\">But <\/span><mark>at worst, you never see these people again, and you'll have had a day of shame that you'll be able to laugh about in a year.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>au pire, tu revois jamais ces gens, et t'auras eu une journée de honte dont tu pourras rigoler dans un an.<\/mark>"}, {"id": "B:BP0829", "bid": "BAY436", "f": "<span class=\"glabel\" style=\"display:block\">If something happened, you wouldn't be the only one responsible.<\/span>There would very probably be other people with you, so even if something happened — which would surprise me, huh — you wouldn't be the only one responsible.", "b": "Y aurait très probablement d'autres gens avec toi, donc même s'il arrivait quelque chose — ce qui m'étonnerait, hein — tu serais pas le seul responsable."}, {"id": "B:BP0603", "bid": "BAY437", "f": "<span class=\"glabel\" style=\"display:block\">The point isn't to win.<\/span>The goal, it's not necessarily to win the contest.", "b": "Le but, c'est pas forcément de gagner le concours."}, {"id": "B:BP1169", "bid": "BAY438", "f": "<span class=\"glabel\" style=\"display:block\">It's just for fun.<\/span>It's just to have fun.", "b": "C'est juste pour s'amuser."}, {"id": "B:BP1010", "bid": "BAY438", "f": "<span class=\"glabel\" style=\"display:block\">It's just for fun.<\/span><span class=\"dim\">But <\/span><mark>that, that has the air to me of being a thing just for the pleasure.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>ça, ça m'a l'air d'être un truc juste pour le plaisir.<\/mark>"}, {"id": "B:BP0217", "bid": "BAY438", "f": "<span class=\"glabel\" style=\"display:block\">It's just for fun.<\/span><mark>The main thing, it's to amuse yourself, to profit from the experience<\/mark><span class=\"dim\"> and to do a thing that has sense together.<\/span>", "b": "<mark>Le principal, c'est de s'amuser, de profiter de l'expérience<\/mark><span class=\"dim\"> et de faire un truc qui a du sens ensemble.<\/span>"}, {"id": "B:BP1029", "bid": "BAY439", "f": "<span class=\"glabel\" style=\"display:block\">It's a hobby; they're not paying you.<\/span>It's just a leisure for you.", "b": "C'est juste un loisir pour toi."}, {"id": "B:BP1028", "bid": "BAY439", "f": "<span class=\"glabel\" style=\"display:block\">It's a hobby; they're not paying you.<\/span>They don't pay you, huh.", "b": "Ils te paient pas, hein."}, {"id": "B:BP1157", "bid": "BAY440", "f": "<span class=\"glabel\" style=\"display:block\">Your motives don't have to be pure.<\/span>You're not obliged to have perfectly pure motivations.", "b": "T'es pas obligé d'avoir des motivations parfaitement pures."}, {"id": "B:BP1156", "bid": "BAY440", "f": "<span class=\"glabel\" style=\"display:block\">Your motives don't have to be pure.<\/span>I don't think that one ever does things with a single motivation, and frankly, it's not a worry.", "b": "Je pense pas qu'on fasse jamais les choses avec une seule motivation, et franchement, c'est pas un souci."}, {"id": "B:BP1158", "bid": "BAY440", "f": "<span class=\"glabel\" style=\"display:block\">Your motives don't have to be pure.<\/span>You can sincerely hold to the cause and at the same time do it for your CV — it's completely natural.", "b": "Tu peux sincèrement tenir à la cause et en même temps le faire pour ton CV — c'est complètement naturel."}, {"id": "B:BP0468", "bid": "BAY441", "f": "<span class=\"glabel\" style=\"display:block\">That problem is years away.<\/span>But well, that would be a thing to manage in, what, maybe 15 years?", "b": "Mais bon, ce serait un truc à gérer dans, quoi, peut-être 15 ans ?"}, {"id": "B:BP0469", "bid": "BAY442", "f": "<span class=\"glabel\" style=\"display:block\">A lot can change by then.<\/span>You don't know what your life is going to look like from here to there. In 15 years, there can happen some, things.", "b": "Tu sais pas à quoi ta vie va ressembler d'ici là. En 15 ans, il peut s'en passer, des choses."}, {"id": "B:BP0471", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>That, it's a problem that you'll be able to settle later.", "b": "Ça, c'est un problème que tu pourras régler plus tard."}, {"id": "B:BP0470", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>Me, I find that you shouldn't stress your head now for a thing so far away in time.", "b": "Moi, je trouve que tu devrais pas te prendre la tête maintenant pour un truc aussi loin dans le temps."}, {"id": "B:BP0592", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>No, don't worry yourself about the tour for the moment. That, you can think about it later.", "b": "Non, t'inquiète pas pour la tournée pour l'instant. Ça, tu pourras y penser plus tard."}, {"id": "B:BP0593", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>You haven't even won the contest yet, so it serves nothing to stress right from now on how you would organise yourself for the tour.", "b": "T'as même pas encore gagné le concours, donc ça sert à rien de stresser dès maintenant sur comment tu t'organiserais pour la tournée."}, {"id": "B:BP0139", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>The rest, we'll see later.", "b": "Le reste, on verra plus tard."}, {"id": "B:BP0174", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span><span class=\"dim\">And <\/span><mark>frankly, I don't think that you need to worry yourself about what will happen in six months.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>franchement, je pense pas que t'aies besoin de t'inquiéter de ce qui se passera dans six mois.<\/mark>"}, {"id": "B:BP0940", "bid": "BAY443", "f": "<span class=\"glabel\" style=\"display:block\">Don't stress about that now; you can deal with it later.<\/span>But frankly, you don't even need to see that far.", "b": "Mais franchement, t'as même pas besoin de voir aussi loin."}, {"id": "B:BP0074", "bid": "BAY444", "f": "<span class=\"glabel\" style=\"display:block\">Nobody will be hostile or boo you.<\/span>It's not as if they were going to be hostile and start to throw tomatoes at you, huh — so you really have no worry to make yourself on that.", "b": "C'est pas comme s'ils allaient être hostiles et se mettre à te lancer des tomates, hein — donc t'as vraiment pas de souci à te faire là-dessus."}, {"id": "B:BP0600", "bid": "BAY444", "f": "<span class=\"glabel\" style=\"display:block\">Nobody will be hostile or boo you.<\/span>It's not as if people were going to start throwing tomatoes at you if your story is not perfect or if your performance doesn't go exactly like you want.", "b": "C'est pas comme si les gens allaient se mettre à te jeter des tomates si ton histoire est pas parfaite ou si ta prestation se passe pas exactement comme tu veux."}, {"id": "B:BP1008", "bid": "BAY444", "f": "<span class=\"glabel\" style=\"display:block\">Nobody will be hostile or boo you.<\/span><span class=\"dim\">But <\/span><mark>in the end, you realise that you're in a benevolent setting and that nobody's going to boo you.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>au final, tu te rends compte que t'es dans un cadre bienveillant et que personne va te huer.<\/mark>"}, {"id": "B:BP0601", "bid": "BAY445", "f": "<span class=\"glabel\" style=\"display:block\">That won't happen, so don't worry about it.<\/span>That won't happen, so you really don't need to worry yourself about that.", "b": "Ça arrivera pas, donc t'as vraiment pas besoin de t'en faire pour ça."}, {"id": "B:BP1176", "bid": "BAY446", "f": "<span class=\"glabel\" style=\"display:block\">No one will judge you.<\/span><span class=\"dim\">You amuse yourself cooking as two, and <\/span><mark>there's nobody who judges you.<\/mark>", "b": "<span class=\"dim\">Tu t'amuses à cuisiner à deux, et <\/span><mark>y a personne qui te juge.<\/mark>"}, {"id": "B:BP1011", "bid": "BAY446", "f": "<span class=\"glabel\" style=\"display:block\">No one will judge you.<\/span>I don't think that the audience they talk about in the ad, it's a real audience with critics in it.", "b": "Je pense pas que le public dont ils parlent dans l'annonce, ce soit un vrai public avec des critiques dedans."}, {"id": "B:BP0073", "bid": "BAY447", "f": "<span class=\"glabel\" style=\"display:block\">The audience will be nice and reasonable.<\/span>And frankly, I'm quasi sure that the public, it's going to be nice and reasonable.", "b": "Et franchement, je suis quasiment sûr que le public, il va être sympa et raisonnable."}, {"id": "B:BP1012", "bid": "BAY448", "f": "<span class=\"glabel\" style=\"display:block\">At a small show, people clap for you no matter what.<\/span><span class=\"dim\">And then <\/span><mark>in a small independent show like that, people feel obliged to applaud you, whether your performance is really good or not. It's a bit the tacit rule, you know.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>dans un petit spectacle indépendant comme ça, les gens se sentent obligés de t'applaudir, que ta prestation soit vraiment bonne ou pas. C'est un peu la règle tacite, quoi.<\/mark>"}, {"id": "B:BP1183", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span>They didn't sign for a real resto meal. If it was that that they wanted, they would go rather to one of the thousands of restos that we have here.", "b": "Ils ont pas signé pour un vrai repas de resto. Si c'était ça qu'ils voulaient, ils iraient plutôt dans un des milliers de restos qu'on a ici."}, {"id": "B:BP1171", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span><span class=\"dim\">And then <\/span><mark>these travellers, they're not looking for a meal in five courses at your place.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>ces voyageurs, ils cherchent pas un repas en cinq plats chez toi.<\/mark>"}, {"id": "B:BP1172", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span>They know what to expect when they go to a perfect stranger's place — it's not a resto.", "b": "Ils savent à quoi s'attendre quand ils vont chez un parfait inconnu — c'est pas un resto."}, {"id": "B:BP1173", "bid": "BAY449", "f": "<span class=\"glabel\" style=\"display:block\">They don't expect a perfect, restaurant-style meal.<\/span><span class=\"dim\">So then, <\/span><mark>you don't have to put the pressure on yourself to serve them a perfect meal.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>t'as pas à te mettre la pression pour leur servir un repas parfait.<\/mark>"}, {"id": "B:BP1181", "bid": "BAY450", "f": "<span class=\"glabel\" style=\"display:block\">They know what they signed up for: a low-key experience.<\/span><span class=\"dim\">That said, <\/span><mark>I think that the tourists too, they're well conscious of what awaits them.<\/mark>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>je pense que les touristes aussi, ils sont bien conscients de ce qui les attend.<\/mark>"}, {"id": "B:BP1182", "bid": "BAY450", "f": "<span class=\"glabel\" style=\"display:block\">They know what they signed up for: a low-key experience.<\/span>When they signed up, the spirit of the thing, it was a cultural exchange without headache, a new experience, a bit unusual.", "b": "Quand ils se sont inscrits, l'esprit du truc, c'était un échange culturel sans prise de tête, une expérience nouvelle, un peu insolite."}, {"id": "B:BP1174", "bid": "BAY451", "f": "<span class=\"glabel\" style=\"display:block\">It's like having a friend over.<\/span>See that as if you were inviting someone to the house to make them something to eat, like when you receive a buddy.", "b": "Vois ça comme si t'invitais quelqu'un à la maison pour lui faire à manger, comme quand tu reçois un pote."}, {"id": "B:BP1149", "bid": "BAY452", "f": "<span class=\"glabel\" style=\"display:block\">Everyone is the new member at first.<\/span><span class=\"dim\">But <\/span><mark>it's the same for every new club that you join — at the start, you're always the little new one.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>c'est pareil pour chaque nouveau club que tu rejoins — au début, t'es toujours le petit nouveau.<\/mark>"}, {"id": "B:BP1127", "bid": "BAY453", "f": "<span class=\"glabel\" style=\"display:block\">It won't bring down the mood.<\/span><span class=\"dim\">If you don't feel like doing a thing, you're not obliged — <\/span><mark>that's not going to weigh down the atmosphere<\/mark><span class=\"dim\">, and in any case, we'll invite you all the same to the next outings.<\/span>", "b": "<span class=\"dim\">Si t'as pas envie de faire un truc, t'es pas obligé — <\/span><mark>ça va pas plomber l'ambiance<\/mark><span class=\"dim\">, et de toute façon, on t'invitera quand même aux prochaines sorties.<\/span>"}, {"id": "B:BP1128", "bid": "BAY454", "f": "<span class=\"glabel\" style=\"display:block\">We'll still invite you next time.<\/span><span class=\"dim\">If you don't feel like doing a thing, you're not obliged — that's not going to weigh down the atmosphere, and in any case, <\/span><mark>we'll invite you all the same to the next outings.<\/mark>", "b": "<span class=\"dim\">Si t'as pas envie de faire un truc, t'es pas obligé — ça va pas plomber l'ambiance, et de toute façon, <\/span><mark>on t'invitera quand même aux prochaines sorties.<\/mark>"}, {"id": "B:BP0347", "bid": "BAY455", "f": "<span class=\"glabel\" style=\"display:block\">Don't let what other people think stop you.<\/span>You shouldn't let pass occasions like that just because you worry yourself about what the others could think. It's not like that that one must live one's life.", "b": "Tu devrais pas laisser passer des occasions comme ça juste parce que tu t'inquiètes de ce que les autres pourraient penser. C'est pas comme ça qu'il faut vivre sa vie."}, {"id": "B:BP1209", "bid": "BAY455", "f": "<span class=\"glabel\" style=\"display:block\">Don't let what other people think stop you.<\/span><mark>The opinion of others, that should never put itself between us and our objectives<\/mark><span class=\"dim\"> — life is too short to take one's head over what people think.<\/span>", "b": "<mark>L'avis des autres, ça devrait jamais se mettre entre nous et nos objectifs<\/mark><span class=\"dim\"> — la vie est trop courte pour se prendre la tête avec ce que pensent les gens.<\/span>"}, {"id": "B:BP1210", "bid": "BAY455", "f": "<span class=\"glabel\" style=\"display:block\">Don't let what other people think stop you.<\/span><span class=\"dim\">The opinion of others, that should never put itself between us and our objectives — <\/span><mark>life is too short to take one's head over what people think.<\/mark>", "b": "<span class=\"dim\">L'avis des autres, ça devrait jamais se mettre entre nous et nos objectifs — <\/span><mark>la vie est trop courte pour se prendre la tête avec ce que pensent les gens.<\/mark>"}, {"id": "B:BP1206", "bid": "BAY456", "f": "<span class=\"glabel\" style=\"display:block\">We often care too much about what others think.<\/span><span class=\"dim\">And then <\/span><mark>we sometimes have a tendency to preoccupy ourselves too much with what the others think of us<\/mark><span class=\"dim\"> — it's a bit like a projector effect: we imagine that people interest themselves a lot in us, whereas in truth, they're much too taken by their own life to care about it.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>on a parfois tendance à trop se préoccuper de ce que les autres pensent de nous<\/mark><span class=\"dim\"> — c'est un peu comme un effet projecteur : on s'imagine que les gens s'intéressent beaucoup à nous, alors qu'en vrai, ils sont bien trop pris par leur propre vie pour s'en soucier.<\/span>"}, {"id": "B:BP1207", "bid": "BAY457", "f": "<span class=\"glabel\" style=\"display:block\">Others are too busy with their own lives to notice you.<\/span><span class=\"dim\">And then we sometimes have a tendency to preoccupy ourselves too much with what the others think of us — <\/span><mark>it's a bit like a projector effect: we imagine that people interest themselves a lot in us, whereas in truth, they're much too taken by their own life to care about it.<\/mark>", "b": "<span class=\"dim\">Et puis on a parfois tendance à trop se préoccuper de ce que les autres pensent de nous — <\/span><mark>c'est un peu comme un effet projecteur : on s'imagine que les gens s'intéressent beaucoup à nous, alors qu'en vrai, ils sont bien trop pris par leur propre vie pour s'en soucier.<\/mark>"}, {"id": "B:BP1208", "bid": "BAY458", "f": "<span class=\"glabel\" style=\"display:block\">Even if people look, so what?<\/span>And then even if it's the case, what can that do, huh?", "b": "Et puis même si c'est le cas, qu'est-ce que ça peut faire, hein ?"}, {"id": "B:BP1211", "bid": "BAY459", "f": "<span class=\"glabel\" style=\"display:block\">They might find it interesting and join you.<\/span><span class=\"dim\">And <\/span><mark>if ever they find that interesting, what you do, and they end up putting themselves to it with you? One never knows.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si jamais ils trouvent ça intéressant, ce que tu fais, et qu'ils finissent par s'y mettre avec toi ? On sait jamais.<\/mark>"}, {"id": "B:BP1205", "bid": "BAY460", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to do it where people watch you.<\/span><span class=\"dim\">Plus, <\/span><mark>you're not necessarily obliged to do that in a place where people watch you.<\/mark>", "b": "<span class=\"dim\">En plus, <\/span><mark>t'es pas forcément obligé de faire ça dans un endroit où les gens te regardent.<\/mark>"}, {"id": "B:BP0671", "bid": "BAY461", "f": "<span class=\"glabel\" style=\"display:block\">Your friends would understand why you're doing it.<\/span>And anyway, I think that your mates would understand why you're doing that.", "b": "Et de toute façon, je pense que tes potes comprendraient pourquoi tu fais ça."}, {"id": "B:BP0672", "bid": "BAY462", "f": "<span class=\"glabel\" style=\"display:block\">They know you're looking for work or extra income.<\/span>They know that you're searching for a new job, or at least to earn a bit of extra money, so it's not like they were going to ask themselves where that comes out from.", "b": "Ils savent que tu cherches un nouveau job, ou au moins à gagner un peu d'argent en plus, donc c'est pas comme s'ils allaient se demander d'où ça sort."}, {"id": "B:BP1030", "bid": "BAY463", "f": "<span class=\"glabel\" style=\"display:block\">If they don't like that you won't commit, don't care.<\/span>So yes, it maybe won't please them that you don't engage yourself all the way, but honestly, you don't have to preoccupy yourself with it.", "b": "Alors oui, ça leur plaira peut-être pas que tu t'engages pas à fond, mais honnêtement, t'as pas à t'en préoccuper."}, {"id": "B:BP1031", "bid": "BAY464", "f": "<span class=\"glabel\" style=\"display:block\">You can put yourself first sometimes.<\/span>You have the right to put yourself first from time to time.", "b": "T'as le droit de te faire passer en premier de temps en temps."}, {"id": "B:BP0681", "bid": "BAY465", "f": "<span class=\"glabel\" style=\"display:block\">The scary part is what makes it fun.<\/span><span class=\"dim\">I know that it can appear a bit risky, <\/span><mark>but at the same time, it's a bit that which makes the thing so interesting.<\/mark>", "b": "<span class=\"dim\">Je sais que ça peut paraître un peu risqué, <\/span><mark>mais en même temps, c'est un peu ça qui rend le truc aussi intéressant.<\/mark>"}, {"id": "B:BP1119", "bid": "BAY465", "f": "<span class=\"glabel\" style=\"display:block\">The scary part is what makes it fun.<\/span>It's that that's funny, no, the side that's a bit freaky?", "b": "C'est ça qui est marrant, non, le côté qui fait un peu flipper ?"}, {"id": "B:BP0759", "bid": "BAY466", "f": "<span class=\"glabel\" style=\"display:block\">Being scared is exactly why we should do it.<\/span><span class=\"dim\">And yeah, I totally understand that you're scared, <\/span><mark>but precisely, it's a bit for that that I tell myself we should do it.<\/mark>", "b": "<span class=\"dim\">Et ouais, je comprends tout à fait que t'aies peur, <\/span><mark>mais justement, c'est un peu pour ça que je me dis qu'on devrait le faire.<\/mark>"}, {"id": "B:BP1058", "bid": "BAY466", "f": "<span class=\"glabel\" style=\"display:block\">Being scared is exactly why we should do it.<\/span>That fear there, frankly, I have it also. But precisely, it's for that that I want to do it, you see?", "b": "Cette crainte-là, franchement, je l'ai aussi. Mais justement, c'est pour ça que je veux le faire, tu vois ?"}, {"id": "B:BP1117", "bid": "BAY467", "f": "<span class=\"glabel\" style=\"display:block\">Do things that scare you a little but are safe.<\/span>The whole interest, precisely, it's to do things that make you a bit afraid, but that don't really put your life in danger.", "b": "Tout l'intérêt, justement, c'est de faire des trucs qui te font un peu peur, mais qui mettent pas vraiment ta vie en danger."}, {"id": "B:BP1118", "bid": "BAY467", "f": "<span class=\"glabel\" style=\"display:block\">Do things that scare you a little but are safe.<\/span><span class=\"dim\">So then, <\/span><mark>yes, it's discomfort, but at the same time there's a safety net under our feet.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>oui, c'est de l'inconfort, mais en même temps y a un filet de sécurité sous nos pieds.<\/mark>"}, {"id": "B:BP1116", "bid": "BAY468", "f": "<span class=\"glabel\" style=\"display:block\">If you're already comfortable, it won't be memorable.<\/span>If it's a thing with which you're already at ease, agreed, it's an experience, but it won't be a really striking experience.", "b": "Si c'est un truc avec lequel t'es déjà à l'aise, d'accord, c'est une expérience, mais ce sera pas une expérience vraiment marquante."}, {"id": "B:BP1121", "bid": "BAY469", "f": "<span class=\"glabel\" style=\"display:block\">I was scared of something like this too, and I tried it.<\/span><span class=\"dim\">You cite me snowboarding as an example — but <\/span><mark>me too, before, I was afraid of it, and I tried all the same.<\/mark>", "b": "<span class=\"dim\">Tu me cites le snowboard en exemple — mais <\/span><mark>moi aussi, avant, j'en avais peur, et j'ai quand même essayé.<\/mark>"}, {"id": "B:BP1007", "bid": "BAY469", "f": "<span class=\"glabel\" style=\"display:block\">I was scared of something like this too, and I tried it.<\/span><span class=\"dim\">On the other hand, <\/span><mark>I've already played music in front of an audience, and at the start, it's clear that it was scary.<\/mark>", "b": "<span class=\"dim\">Par contre, <\/span><mark>j'ai déjà joué de la musique devant un public, et au début, c'est clair que ça faisait peur.<\/mark>"}, {"id": "B:BP0227", "bid": "BAY470", "f": "<span class=\"glabel\" style=\"display:block\">Don't let a chance like this slip by.<\/span>I just think that you shouldn't let slip away an occasion like that.", "b": "Je pense juste que tu devrais pas laisser filer une occasion pareille."}, {"id": "B:BP0247", "bid": "BAY470", "f": "<span class=\"glabel\" style=\"display:block\">Don't let a chance like this slip by.<\/span><span class=\"dim\">So there you go, <\/span><mark>me I really find that it's an occasion not to miss.<\/mark>", "b": "<span class=\"dim\">Donc voilà, <\/span><mark>moi je trouve vraiment que c'est une occasion à pas louper.<\/mark>"}, {"id": "B:BP0135", "bid": "BAY471", "f": "<span class=\"glabel\" style=\"display:block\">Don't miss the chance just because you're scared.<\/span><span class=\"dim\">All the same, <\/span><mark>I find that you shouldn't let the occasion pass just because you're scared.<\/mark>", "b": "<span class=\"dim\">N'empêche, <\/span><mark>je trouve que tu devrais pas laisser passer l'occasion juste parce que t'as peur.<\/mark>"}, {"id": "B:BP0751", "bid": "BAY472", "f": "<span class=\"glabel\" style=\"display:block\">Don't let being shy decide how you live.<\/span><span class=\"dim\">Yeah, I understand that you're introverted, but <\/span><mark>you shouldn't let that decide systematically how you live your life.<\/mark>", "b": "<span class=\"dim\">Ouais, je comprends que tu sois introverti, mais <\/span><mark>tu devrais pas laisser ça décider systématiquement de comment tu vis ta vie.<\/mark>"}, {"id": "B:BP0382", "bid": "BAY473", "f": "<span class=\"glabel\" style=\"display:block\">Don't give up the whole thing because of one problem.<\/span>Me, I don't think that you should push aside completely this opportunity just because there is one or two things that could get stuck for you.", "b": "Moi, je pense pas que tu doives écarter complètement cette opportunité juste parce qu'il y a un ou deux trucs qui pourraient coincer pour toi."}, {"id": "B:BP0313", "bid": "BAY473", "f": "<span class=\"glabel\" style=\"display:block\">Don't give up the whole thing because of one problem.<\/span>You mustn't let pass the occasion just because there's a part of the party that wouldn't please you.", "b": "Faut pas que tu laisses passer l'occasion juste parce qu'y a une partie de la fête qui te plairait pas."}, {"id": "B:BP0487", "bid": "BAY473", "f": "<span class=\"glabel\" style=\"display:block\">Don't give up the whole thing because of one problem.<\/span>You mustn't let fall an opportunity just because there's an obvious obstacle across the path.", "b": "Faut pas laisser tomber une opportunité juste parce qu'y a un obstacle évident en travers du chemin."}, {"id": "B:BP0633", "bid": "BAY474", "f": "<span class=\"glabel\" style=\"display:block\">Don't back out just because it takes some work.<\/span>You can't let it drop just because that demands a bit of work.", "b": "Tu peux pas laisser tomber juste parce que ça demande un peu de boulot."}, {"id": "B:BP0488", "bid": "BAY475", "f": "<span class=\"glabel\" style=\"display:block\">You can always find a way around an obstacle.<\/span>You can always try to find a means of getting around it.", "b": "Tu peux toujours essayer de trouver un moyen de le contourner."}, {"id": "B:BP0879", "bid": "BAY476", "f": "<span class=\"glabel\" style=\"display:block\">Good things come from getting around obstacles.<\/span><span class=\"dim\">All the same, <\/span><mark>plenty of great things in life, they happen because one finds a way to get around the obstacles instead of letting it drop as soon as it gets complicated.<\/mark>", "b": "<span class=\"dim\">N'empêche, <\/span><mark>plein de trucs géniaux dans la vie, ça arrive parce qu'on trouve un moyen de contourner les obstacles au lieu de laisser tomber dès que ça se complique.<\/mark>"}, {"id": "B:BP0632", "bid": "BAY477", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to put yourself out there.<\/span>What I want to say, it's that if you seriously want to find a job, sometimes, gotta just do this kind of stuff and throw yourself in.", "b": "Ce que je veux dire, c'est que si tu veux sérieusement trouver un job, des fois, faut juste faire ce genre de trucs et te lancer."}, {"id": "B:BP0647", "bid": "BAY478", "f": "<span class=\"glabel\" style=\"display:block\">You should keep all your options open.<\/span>In a situation like that, I really think that you should leave yourself all the doors open.", "b": "Dans une situation comme ça, je pense vraiment que tu devrais te laisser toutes les portes ouvertes."}]}, {"key": "B-BA14", "sec": "B", "code": "BA14", "name": "Take the first step", "bucket": "Arguments", "items": [{"id": "B:BP0030", "bid": "BAY479", "f": "<span class=\"glabel\" style=\"display:block\">I'll call them myself.<\/span>What I wanted to say, it's that I'm going to go on their site, find their number and call them.", "b": "Ce que je voulais dire, c'est que je vais aller sur leur site, trouver leur numéro et les appeler."}, {"id": "B:BP0883", "bid": "BAY480", "f": "<span class=\"glabel\" style=\"display:block\">We can just call them and ask.<\/span><span class=\"dim\">After, for the boat in itself, I don't know if they provide someone on board to help with the navigation, or if we could take someone for that, but <\/span><mark>we only have to call to ask.<\/mark>", "b": "<span class=\"dim\">Après, pour le bateau en lui-même, je sais pas s'ils fournissent quelqu'un à bord pour aider à la navigation, ou si on pourrait prendre quelqu'un pour ça, mais <\/span> e info.", "b": "Tout ce que je te demande, c'est de pas dire non avant qu'on les appelle au moins pour avoir plus d'infos."}, {"id": "B:BP0158", "bid": "BAY488", "f": "<span class=\"glabel\" style=\"display:block\">Don't say no before we find out more.<\/span><span class=\"dim\">So then, <\/span><mark>I really think that you shouldn't say no before having called them at least one time to know more about it.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>je pense vraiment que tu devrais pas dire non avant de les avoir appelés au moins une fois pour en savoir plus.<\/mark>"}, {"id": "B:BP0231", "bid": "BAY488", "f": "<span class=\"glabel\" style=\"display:block\">Don't say no before we find out more.<\/span>All that I ask of you, it's to not say no before we've really verified all that and that we know a bit more of it.", "b": "Tout ce que je te demande, c'est de pas dire non avant qu'on ait vraiment vérifié tout ça et qu'on en sache un peu plus."}, {"id": "B:BP0772", "bid": "BAY488", "f": "<span class=\"glabel\" style=\"display:block\">Don't say no before we find out more.<\/span>I'm just asking you to not say no before even we know the exact price.", "b": "Je te demande juste de pas dire non avant même qu'on connaisse le prix exact."}, {"id": "B:BP0779", "bid": "BAY488", "f": "<span class=\"glabel\" style=\"display:block\">Don't say no before we find out more.<\/span>At the limit, we should just call them once, just to have all the info, before deciding to let the occasion pass.", "b": "À la limite, on devrait juste les appeler une fois, histoire d'avoir toutes les infos, avant de décider de laisser passer l'occasion."}, {"id": "B:BP0106", "bid": "BAY488", "f": "<span class=\"glabel\" style=\"display:block\">Don't say no before we find out more.<\/span><span class=\"dim\">But <\/span><mark>you mustn't let the occasion pass just because you haven't yet spoken to the owners.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>faut pas laisser passer l'occasion juste parce que t'as pas encore parlé aux propriétaires.<\/mark>"}, {"id": "B:BP0298", "bid": "BAY489", "f": "<span class=\"glabel\" style=\"display:block\">Don't say no right away.<\/span>So frankly, I really think that you shouldn't say no straight away.", "b": "Donc franchement, je pense vraiment que tu devrais pas dire non tout de suite."}, {"id": "B:BP0090", "bid": "BAY490", "f": "<span class=\"glabel\" style=\"display:block\">I'm not asking you to commit right now.<\/span>It's precisely for that that I'm not asking you to engage yourself right away.", "b": "C'est justement pour ça que je te demande pas de t'engager tout de suite."}, {"id": "B:BP0771", "bid": "BAY490", "f": "<span class=\"glabel\" style=\"display:block\">I'm not asking you to commit right now.<\/span>And I'm not asking you to say yes right away, huh.", "b": "Et je te demande pas de dire oui tout de suite, hein."}, {"id": "B:BP0101", "bid": "BAY490", "f": "<span class=\"glabel\" style=\"display:block\">I'm not asking you to commit right now.<\/span>But once again, I'm just asking you to contact them, not to engage yourself on the long term.", "b": "Mais encore une fois, je te demande juste de les contacter, pas de t'engager sur le long terme."}, {"id": "B:BP1032", "bid": "BAY491", "f": "<span class=\"glabel\" style=\"display:block\">We should do more low-stakes things without long commitments.<\/span>Me, I find that one should do more stuff without stakes in life, without having the impression of having to commit over the long term.", "b": "Moi, je trouve qu'on devrait faire plus de trucs sans enjeu dans la vie, sans avoir l'impression de devoir s'engager sur le long terme."}, {"id": "B:BP0850", "bid": "BAY492", "f": "<span class=\"glabel\" style=\"display:block\">Applying takes an hour at most.<\/span>Sending a CV and a letter of motivation, that would take you what, a few minutes? Come on, one hour big max.", "b": "Envoyer un CV et une lettre de motivation, ça te prendrait quoi, quelques minutes ? Allez, une heure grand max."}, {"id": "B:BP0261", "bid": "BAY493", "f": "<span class=\"glabel\" style=\"display:block\">Don't rule it out before you've tried it once.<\/span><span class=\"dim\">Me, <\/span><mark>I just think that you shouldn't set that aside out of hand before even having tried a single time.<\/mark>", "b": "<span class=\"dim\">Moi, <\/span><mark>je pense juste que tu devrais pas écarter ça d'office avant même d'avoir essayé une seule fois.<\/mark>"}, {"id": "B:BP0434", "bid": "BAY494", "f": "<span class=\"glabel\" style=\"display:block\">At least give it a try; it's worth it.<\/span>Frankly, you should at least try the blow.", "b": "Franchement, tu devrais au moins tenter le coup."}, {"id": "B:BP0945", "bid": "BAY494", "f": "<span class=\"glabel\" style=\"display:block\">At least give it a try; it's worth it.<\/span>Try the shot, at least.", "b": "Tente le coup, au moins."}, {"id": "B:BP0620", "bid": "BAY494", "f": "<span class=\"glabel\" style=\"display:block\">At least give it a try; it's worth it.<\/span>Me, I really find that it's worth the blow to try.", "b": "Moi, je trouve vraiment que ça vaut le coup d'essayer."}, {"id": "B:BP0636", "bid": "BAY494", "f": "<span class=\"glabel\" style=\"display:block\">At least give it a try; it's worth it.<\/span>In any case, me, I find that it's worth at least the blow to try.", "b": "De toute façon, moi, je trouve que ça vaut au moins le coup de tenter."}, {"id": "B:BP0642", "bid": "BAY495", "f": "<span class=\"glabel\" style=\"display:block\">Just try it and see what it's like.<\/span>Like that, you could just try and see what that gives.", "b": "Comme ça, tu pourrais juste essayer et voir ce que ça donne."}, {"id": "B:BP0137", "bid": "BAY495", "f": "<span class=\"glabel\" style=\"display:block\">Just try it and see what it's like.<\/span><mark>We can see what it gives<\/mark><span class=\"dim\">, and if we don't feel like continuing, we stop.<\/span>", "b": "<mark>On peut voir ce que ça donne<\/mark><span class=\"dim\">, et si on a pas envie de continuer, on arrête.<\/span>"}, {"id": "B:BP1135", "bid": "BAY496", "f": "<span class=\"glabel\" style=\"display:block\">We can see how far this can go.<\/span><span class=\"dim\">But <\/span><mark>we can see up to where it can go.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>on peut voir jusqu'où ça peut aller.<\/mark>"}, {"id": "B:BP0536", "bid": "BAY497", "f": "<span class=\"glabel\" style=\"display:block\">Let's just try it once.<\/span>We try the blow, just one time.", "b": "On tente le coup, juste une fois."}, {"id": "B:BP0136", "bid": "BAY497", "f": "<span class=\"glabel\" style=\"display:block\">Let's just try it once.<\/span><span class=\"dim\">So there, <\/span><mark>me, I tell myself that if we try at least one time, that's enough.<\/mark>", "b": "<span class=\"dim\">Donc voilà, <\/span><mark>moi je me dis que si on essaie au moins une fois, ça suffit.<\/mark>"}, {"id": "B:BP0900", "bid": "BAY497", "f": "<span class=\"glabel\" style=\"display:block\">Let's just try it once.<\/span>At the limit, you could go there just a day or two, so as to live the experience and to see what it gives.", "b": "À la limite, tu pourrais y aller juste un jour ou deux, histoire de vivre l'expérience et de voir ce que ça donne."}, {"id": "B:BP0138", "bid": "BAY498", "f": "<span class=\"glabel\" style=\"display:block\">If you don't like it, you can stop.<\/span><span class=\"dim\">We can see what it gives, and <\/span><mark>if we don't feel like continuing, we stop.<\/mark>", "b": "<span class=\"dim\">On peut voir ce que ça donne, et <\/span><mark>si on a pas envie de continuer, on arrête.<\/mark>"}, {"id": "B:BP0134", "bid": "BAY498", "f": "<span class=\"glabel\" style=\"display:block\">If you don't like it, you can stop.<\/span>If you try the blow and it goes super badly or you totally detest it, well obviously, you're not obliged to continue.", "b": "Si tu tentes le coup et que ça se passe super mal ou que tu détestes carrément ça, bah évidemment, t'es pas obligé de continuer."}, {"id": "B:BP1055", "bid": "BAY498", "f": "<span class=\"glabel\" style=\"display:block\">If you don't like it, you can stop.<\/span>You can leave direct, eh? It's volunteering. They're going to do what? Fire us? We're not even paid, eh?", "b": "Tu peux partir direct, hein ? C'est du bénévolat. Ils vont faire quoi ? Nous virer ? On est même pas payés, hein ?"}, {"id": "B:BP0326", "bid": "BAY499", "f": "<span class=\"glabel\" style=\"display:block\">You can start small, step by step.<\/span>You can start little by little, quite simply.", "b": "Tu peux commencer petit à petit, tout simplement."}, {"id": "B:BP0990", "bid": "BAY499", "f": "<span class=\"glabel\" style=\"display:block\">You can start small, step by step.<\/span>We could maybe just go there little by little to start.", "b": "On pourrait peut-être juste y aller petit à petit pour commencer."}, {"id": "B:BP0160", "bid": "BAY499", "f": "<span class=\"glabel\" style=\"display:block\">You can start small, step by step.<\/span>You're not necessarily obliged to launch yourself straight into a whole garden outdoors.", "b": "T'es pas forcément obligé de te lancer direct dans tout un jardin en extérieur."}, {"id": "B:BP0993", "bid": "BAY500", "f": "<span class=\"glabel\" style=\"display:block\">Once you trust it, you can do more.<\/span>And after, when you'll have a bit of confidence in the site, you'll be able to think about buying.", "b": "Et après, quand t'auras un peu confiance dans le site, tu pourras penser à acheter."}, {"id": "B:BP1191", "bid": "BAY501", "f": "<span class=\"glabel\" style=\"display:block\">It's an easy way to get started.<\/span>I'm just saying that it's a fairly simple way to put yourself to it, just to set the machine going.", "b": "Je dis juste que c'est une façon assez simple de t'y mettre, histoire d'enclencher la machine."}, {"id": "B:BP1189", "bid": "BAY502", "f": "<span class=\"glabel\" style=\"display:block\">If you're serious, you have to start somewhere.<\/span>If you really hold to your objective of improving your physique and your health, got to start somewhere — it's not going to do itself all alone, as if by magic.", "b": "Si tu tiens vraiment à ton objectif d'améliorer ton physique et ta santé, faut bien commencer quelque part — ça va pas se faire tout seul, comme par magie."}, {"id": "B:BP1153", "bid": "BAY503", "f": "<span class=\"glabel\" style=\"display:block\">If you don't start now, when will you?<\/span><span class=\"dim\">So then, <\/span><mark>if you don't start now, you start when?<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>si tu commences pas maintenant, tu commences quand ?<\/mark>"}, {"id": "B:BP0439", "bid": "BAY503", "f": "<span class=\"glabel\" style=\"display:block\">If you don't start now, when will you?<\/span>And then if you don't learn that now, you'll do it when?", "b": "Et puis si t'apprends pas ça maintenant, tu le feras quand ?"}]}, {"key": "B-BC1", "sec": "B", "code": "BC1", "name": "Opening", "bucket": "Context", "items": [{"id": "B:BP0853", "bid": "BCY001", "f": "<span class=\"glabel\" style=\"display:block\">Hey, how's it going?<\/span>Hi, you're going well?", "b": "Salut, tu vas bien ?"}, {"id": "B:BP0505", "bid": "BCY002", "f": "<span class=\"glabel\" style=\"display:block\">I saw an ad last night.<\/span><mark>So there, I wanted to call you because I saw an ad last night<\/mark><span class=\"dim\">, and as soon as I saw it, I told myself: « Hey, that has the air really interesting, in fact. »<\/span>", "b": "<mark>Alors voilà, je voulais t'appeler parce que j'ai vu une pub hier soir<\/mark><span class=\"dim\">, et dès que je l'ai vue, je me suis dit : « Tiens, ça a l'air vraiment intéressant, en fait. »<\/span>"}, {"id": "B:BP0143", "bid": "BCY002", "f": "<span class=\"glabel\" style=\"display:block\">I saw an ad last night.<\/span><mark>I ask you that just because I saw an ad yesterday evening for gardening courses<\/mark><span class=\"dim\">, and frankly, I have the impression that it could be a really nice pastime.<\/span>", "b": "<mark>Je te demande ça juste parce que j'ai vu une pub hier soir pour des cours de jardinage<\/mark><span class=\"dim\">, et franchement, j'ai l'impression que ça pourrait être un passe-temps vraiment sympa.<\/span>"}, {"id": "B:BP0854", "bid": "BCY002", "f": "<span class=\"glabel\" style=\"display:block\">I saw an ad last night.<\/span>So there, I wanted to call you because I saw an ad, and it looked really interesting.", "b": "Alors voilà, je voulais t'appeler parce que j'ai vu une annonce, et elle avait l'air vraiment intéressante."}, {"id": "B:BP0538", "bid": "BCY003", "f": "<span class=\"glabel\" style=\"display:block\">I have an idea for something we could do.<\/span>Well, so, I had an idea, and I believe that I know what I want us to do.", "b": "Bon, alors, j'ai eu une idée, et je crois que je sais ce que j'ai envie qu'on fasse."}, {"id": "B:BP0329", "bid": "BCY003", "f": "<span class=\"glabel\" style=\"display:block\">I have an idea for something we could do.<\/span>I have an idea of a thing that we could do during the holidays.", "b": "J'ai une idée de truc qu'on pourrait faire pendant les vacances."}, {"id": "B:BP0142", "bid": "BCY004", "f": "<span class=\"glabel\" style=\"display:block\">Have you ever thought about doing this?<\/span>Have you already thought of gardening?", "b": "T'as déjà pensé au jardinage ?"}, {"id": "B:BP1159", "bid": "BCY005", "f": "<span class=\"glabel\" style=\"display:block\">It might sound crazy, but hear me out.<\/span>That can appear a bit crazy, but listen to me right to the end.", "b": "Ça peut paraître un peu fou, mais écoute-moi jusqu'au bout."}, {"id": "B:BP0035", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span><span class=\"dim\">So <\/span><mark>when I saw this ad, I right away thought of you<\/mark><span class=\"dim\">, seeing that you had told me that you wanted to organise a party, but that you were looking for new ideas so that it would be a bit different.<\/span>", "b": "<span class=\"dim\">Alors <\/span><mark>quand j'ai vu cette pub, j'ai tout de suite pensé à toi<\/mark><span class=\"dim\">, vu que tu m'avais dit que tu voulais organiser une soirée, mais que tu cherchais des nouvelles idées pour que ce soit un peu différent.<\/span>"}, {"id": "B:BP0057", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span><span class=\"dim\">So there, <\/span><mark>I'm calling you because I just fell on an ad, and it right away made me think of you<\/mark><span class=\"dim\">, seeing that I know to what point you love to dance.<\/span>", "b": "<span class=\"dim\">Alors voilà, <\/span><mark>je t'appelle parce que je viens de tomber sur une annonce, et ça m'a tout de suite fait penser à toi<\/mark><span class=\"dim\">, vu que je sais à quel point tu aimes danser.<\/span>"}, {"id": "B:BP0079", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span>In fact, if I thought that it could interest you, it's because when I saw the ad, I right away thought of you.", "b": "En fait, si j'ai pensé que ça pourrait t'intéresser, c'est parce que quand j'ai vu l'annonce, j'ai tout de suite pensé à toi."}, {"id": "B:BP0110", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span><span class=\"dim\">So there, <\/span><mark>I wanted to call you because I saw an ad yesterday evening, and it straight away made me think of you.<\/mark>", "b": "<span class=\"dim\">Alors voilà, <\/span><mark>je voulais t'appeler parce que j'ai vu une annonce hier soir, et ça m'a tout de suite fait penser à toi.<\/mark>"}, {"id": "B:BP0184", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span><span class=\"dim\">Yeah, in fact <\/span><mark>I wanted to call you because I fell upon an ad yesterday evening, and it straight away made me think of you.<\/mark>", "b": "<span class=\"dim\">Ouais, en fait <\/span><mark>je voulais t'appeler parce que je suis tombé sur une annonce hier soir, et ça m'a tout de suite fait penser à toi.<\/mark>"}, {"id": "B:BP0271", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span><mark>When I saw this ad, that straight away made me think of you<\/mark><span class=\"dim\">, seeing that I know that you quite like helping people and rendering them service.<\/span>", "b": "<mark>Quand j'ai vu cette annonce, ça m'a tout de suite fait penser à toi<\/mark><span class=\"dim\">, vu que je sais que t'aimes bien aider les gens et leur rendre service.<\/span>"}, {"id": "B:BP0361", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span><mark>When I saw this ad, I straight away thought of you<\/mark><span class=\"dim\">, seeing that I know to what point you adore animals.<\/span>", "b": "<mark>Quand j'ai vu cette annonce, j'ai tout de suite pensé à toi<\/mark><span class=\"dim\">, vu que je sais à quel point t'adores les animaux.<\/span>"}, {"id": "B:BP0391", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span>Yeah, in fact I'm calling you because I just fell on an ad, and as soon as I saw it, I thought of you.", "b": "Ouais, en fait je t'appelle parce que je viens de tomber sur une annonce, et dès que je l'ai vue, j'ai pensé à toi."}, {"id": "B:BP0457", "bid": "BCY006", "f": "<span class=\"glabel\" style=\"display:block\">When I saw this ad, I thought of you right away.<\/span>Yeah, so listen, I wanted to make you a sign because I fell on an ad, and direct, it made me think of you.", "b": "Ou both of us and that we have mates who adore that too.<\/span>", "b": "<mark>Quand j'ai vu cette annonce, j'ai tout de suite eu envie de t'en parler<\/mark><span class=\"dim\">, vu qu'on adore le sport tous les deux et qu'on a des potes qui adorent ça aussi.<\/span>"}, {"id": "B:BP0721", "bid": "BCY007", "f": "<span class=\"glabel\" style=\"display:block\">I'm only telling you because I thought of you.<\/span>If I'm talking to you about this ad, it's just because I saw it and that I thought of you.", "b": "Si je te parle de cette annonce, c'est juste parce que je l'ai vue et que j'ai pensé à toi."}, {"id": "B:BP0426", "bid": "BCY008", "f": "<span class=\"glabel\" style=\"display:block\">I thought of you because you have what it needs.<\/span><mark>I thought of you because I know that you have a car<\/mark><span class=\"dim\">, and the upkeep, that can quickly come back expensive.<\/span>", "b": "<mark>J'ai pensé à toi parce que je sais que t'as une voiture<\/mark><span class=\"dim\">, et l'entretien, ça peut vite revenir cher.<\/span>"}, {"id": "B:BP0185", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>I told myself that it could interest you.", "b": "Je me suis dit que ça pourrait t'intéresser."}, {"id": "B:BP0678", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>Frankly, I think that that would interest you.", "b": "Franchement, je pense que ça t'intéresserait."}, {"id": "B:BP0726", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>So when I saw that, I told myself that it was maybe exactly the kind of thing that could interest you.", "b": "Alors quand j'ai vu ça, je me suis dit que c'était peut-être exactement le genre de truc qui pourrait t'intéresser."}, {"id": "B:BP0421", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span
