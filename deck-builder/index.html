>, et êtes-vous reconnus dans le domaine ?<\/span><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q158", "bid": "QB065", "f": "<span class=\"glabel\" style=\"display:block\">How long have you been in business?<\/span>It would also help if you tell me the number of years that you have been operating for.", "b": "<span class=\"dim\">En revanche, <\/span><mark>cela m'aiderait que vous me disiez depuis combien d'années vous êtes en activité.<\/mark><span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN52", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span>Could you tell me how satisfied your clients are?", "b": "Pourriez-vous me dire dans quelle mesure vos clients sont satisfaits ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q084", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span><span class=\"dim\">I just want to ask you this directly. How long have you been doing this, and <\/span><mark>how well-known are you in this space?<\/mark>", "b": "<span class=\"dim\">Je vais être franc avec vous : depuis combien de temps exercez-vous ce métier, et <\/span><mark>êtes-vous reconnus dans le domaine ?<\/mark><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QN55", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span>What proportion of your clients come back to you?", "b": "Dans quelle proportion vos clients reviennent-ils vers vous ?<span class=\"tags\"><span class=\"st\"><b>8a<\/b> Dans quelle proportion…<\/span><\/span>"}, {"id": "A:QG009", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span>Do you have reviews I could look at?", "b": "Avez-vous des avis que je puisse consulter ?"}, {"id": "A:Q156", "bid": "QB114", "f": "<span class=\"glabel\" style=\"display:block\">Which bank backs you?<\/span>And what specific major banking group are you backed by?", "b": "Et à quel grand groupe bancaire êtes-vous adossés, précisément ?"}, {"id": "A:Q155", "bid": "QB114", "f": "<span class=\"glabel\" style=\"display:block\">Which bank backs you?<\/span><span class=\"dim\">So <\/span><mark>are you backed by any of the major banks?<\/mark>", "b": "Êtes-vous adossés à l'une des grandes banques ?"}, {"id": "A:QN53", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>What would happen if your bank went bankrupt?", "b": "Que se passerait-il si votre banque faisait faillite ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q157", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>And what specific national deposit protection are you covered by?", "b": "Par ailleurs, de quel système national de garantie des dépôts relevez-vous ?<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><\/span>"}, {"id": "A:QN54", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>How is your deposit protection different from a traditional bank's?", "b": "En quoi votre garantie des dépôts diffère-t-elle de celle d'une banque traditionnelle ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:QG010", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>Would my money be protected?", "b": "Mon argent serait-il protégé ?"}, {"id": "A:Q160", "bid": "QB117", "f": "<span class=\"glabel\" style=\"display:block\">What's the catch?<\/span><mark>What's the catch then?<\/mark><span class=\"dim\"> 'Cause this seems too good to be true, right?<\/span>", "b": "<mark>Où est le piège, alors ?<\/mark><span class=\"dim\"> Ça me paraît trop beau pour être vrai, vous ne trouvez pas ?<\/span><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QN20", "bid": "QB117", "f": "<span class=\"glabel\" style=\"display:block\">What's the catch?<\/span>How do you explain your fees being so much lower than traditional banks'?", "b": "Comment expliquez-vous que vos frais soient à ce point inférieurs à ceux des banques traditionnelles ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q202", "bid": "QB079", "f": "<span class=\"glabel\" style=\"display:block\">Is there any fine print I should know about?<\/span>Are there any conditions that we need to qualify for that you haven't mentioned yet?", "b": "Y a-t-il une condition particulière à remplir dont vous n'auriez pas encore parlé ?<span class=\"tags\"><span class=\"st\"><b>6c<\/b> Y a-t-il une condition particulière…<\/span><span class=\"gr\">dont/auquel · cond<\/span><\/span>"}, {"id": "A:Q099", "bid": "QB079", "f": "<span class=\"glabel\" style=\"display:block\">Is there any fine print I should know about?<\/span><mark>What's the fine print on the insurance that you offer?<\/mark><span class=\"dim\"> I just want to ask that directly.<\/span>", "b": "<span class=\"dim\">Je préfère vous poser la question directement : <\/span><mark>pourriez-vous me préciser les clauses en petits caractères de l'assurance que vous proposez ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q201", "bid": "QB079", "f": "<span class=\"glabel\" style=\"display:block\">Is there any fine print I should know about?<\/span>I'm just wondering if there's any other fine print to this insurance coverage.", "b": "Cela dit, qu'en est-il des éventuelles clauses en petits caractères de cette assurance ?<span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q065", "bid": "QB053", "f": "<span class=\"glabel\" style=\"display:block\">What do you do with the evaluation?<\/span>My question is more about what you're going to do with that evaluation.", "b": "Ma question porte plutôt sur ce que vous comptez faire de cette évaluation."}, {"id": "A:Q068", "bid": "QB054", "f": "<span class=\"glabel\" style=\"display:block\">Is it posted online, or just for internal use?<\/span><mark>So are the evaluations posted online<\/mark><span class=\"dim\">, or is it just for your internal knowledge base, to know about your competitors?<\/span>", "b": "<mark>Cela signifie-t-il que les évaluations sont publiées en ligne<\/mark><span class=\"dim\">, ou servent-elles uniquement à alimenter votre base de connaissances interne, pour mieux connaître vos concurrents ?<\/span><span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><\/span>"}, {"id": "A:Q066", "bid": "QB054", "f": "<span class=\"glabel\" style=\"display:block\">Is it posted online, or just for internal use?<\/span>Are you going to post about it online?", "b": "Allez-vous la publier en ligne ?"}, {"id": "A:Q069", "bid": "QB054", "f": "<span class=\"glabel\" style=\"display:block\">Is it posted online, or just for internal use?<\/span><span class=\"dim\">So are the evaluations posted online, <\/span><mark>or is it just for your internal knowledge base, to know about your competitors?<\/mark>", "b": "<span class=\"dim\">Cela signifie-t-il que les évaluations sont publiées en ligne, <\/span><mark>ou servent-elles uniquement à alimenter votre base de connaissances interne, pour mieux connaître vos concurrents ?<\/mark><span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><\/span>"}, {"id": "A:Q067", "bid": "QB055", "f": "<span class=\"glabel\" style=\"display:block\">Is our name on it?<\/span>Is our name involved with that?", "b": "Notre nom y figurera-t-il ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}]}, {"key": "A-P9", "sec": "A", "code": "P9", "name": "Process & logistics", "bucket": "Questions", "items": [{"id": "A:Q064", "bid": "QB052", "f": "<span class=\"glabel\" style=\"display:block\">What happens after we buy the service?<\/span>I know we'll essentially be buying other people's services, but then what's next after that?", "b": "Je crois comprendre qu'en gros, nous achèterons les services d'autres personnes, mais ensuite, comment les choses se passent-elles ?"}, {"id": "A:Q128", "bid": "QB097", "f": "<span class=\"glabel\" style=\"display:block\">What songwriting techniques do you use?<\/span>What are the techniques that you use for songwriting?", "b": "Quelles techniques d'écriture utilisez-vous pour vos chansons ?"}, {"id": "A:Q119", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span>So if I'm hearing you right, you have one for a simpler production and another one for richer instrumentation.", "b": "Si je comprends bien, vous voulez dire que vous en avez une pour une production plus simple, et une autre pour une instrumentation plus riche ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q141", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span>So before the first month, we would have to pay the first month's rent and also the security deposit and the pet deposit. Is that correct, or am I missing something?", "b": "Avant le premier mois, il faudrait donc que nous réglions le premier loyer, ainsi que le dépôt de garantie et la caution pour l'animal. Pourriez-vous me confirmer que c'est bien le cas, ou quelque chose m'échappe-t-il ?<span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q198", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span>So basically, you would come to Paris first and help me with the packing, and then I would do my flight to Barcelona, and then you would be waiting for me in Barcelona with my stuff. Is that how it works typically?", "b": "Si je vous suis bien, vous viendriez d'abord à Paris pour m'aider à faire les cartons, je prendrais ensuite mon vol pour Barcelone, et vous m'y attendriez avec mes affaires. Est-ce ainsi que les choses se passent, en général ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:QG002", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span><span class=\"dim\">Well, I guess it's mentioned in the ad that we have to call that number. <\/span><mark>Is that correct?<\/mark>", "b": "<span class=\"dim\">Il est indiqué dans l'annonce qu'il faut composer ce numéro : <\/span><mark>cela veut-il dire que la réservation par téléphone est obligatoire ?<\/mark>"}, {"id": "A:Q130", "bid": "QB098", "f": "<span class=\"glabel\" style=\"display:block\">What is the next step?<\/span>What would be the next step to continue with this project?", "b": "Quelle serait la prochaine étape pour donner suite à ce projet ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN30", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What documents should I have ready to finalize my registration?", "b": "Quels documents devrais-je prévoir pour finaliser mon inscription ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN31", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What steps would I need to take to apply?", "b": "Quelles démarches faudrait-il que j'entreprenne pour déposer ma candidature ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN32", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>And to put together the rental application, what documents would I need to provide?", "b": "Et pour constituer le dossier de location, quelles pièces justificatives faudrait-il que je fournisse ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN38", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What steps should we plan for to book the venue we choose?", "b": "Quelles démarches faudrait-il prévoir pour réserver la salle de notre choix ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN56", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What documents should I have ready to make a claim on the insurance, if it comes to that?", "b": "Quels documents devrais-je prévoir pour faire jouer l'assurance, le cas échéant ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:QN61", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What documents should we plan for the children: ID, proof of age?", "b": "Quels documents faudrait-il prévoir pour les enfants : une pièce d'identité, un justificatif d'âge ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN60", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>On that note, do I need to give you our pet's vaccination record?", "b": "À ce propos, faut-il que je vous fournisse le carnet de vaccination de notre animal ?<span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:QN33", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>Would you have an email or a direct contact for any further questions?", "b": "Auriez-vous une adresse e-mail ou un contact direct pour toute question complémentaire ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN34", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>While I'm away, is there a number I could reach you at in case I have any questions?", "b": "Pendant mon absence, y aurait-il un numéro auquel je pourrais vous joindre, au cas où j'aurais la moindre question ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond · dont/auquel<\/span><\/span>"}, {"id": "A:QN35", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>On moving day, who should I get in touch with if there's a problem?", "b": "Le jour du déménagement, à qui devrais-je m'adresser en cas de souci ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN46", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>Would you have a contact on site, in case I can't find the entrance to the center?", "b": "Auriez-vous un contact sur place, au cas où je ne trouverais pas l'entrée du centre ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN51", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>Would you have an emergency number to give me, so my family can reach the team on the day of the jump?", "b": "Auriez-vous un numéro d'urgence à me communiquer, pour que mes proches puissent joindre l'équipe le jour du saut ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q164", "bid": "QB120", "f": "<span class=\"glabel\" style=\"display:block\">Do we book by phone or online?<\/span>For these advising sessions, do we book via the telephone or do we have to book them online?", "b": "Pour ces rendez-vous avec un conseiller, la réservation se fait-elle par téléphone, ou faut-il passer par votre site ?"}, {"id": "A:Q241", "bid": "QB120", "f": "<span class=\"glabel\" style=\"display:block\">Do we book by phone or online?<\/span>In terms of booking, do we just call you to book?", "b": "Pour la réservation, suffit-il de vous appeler ?"}, {"id": "A:Q231", "bid": "QB151", "f": "<span class=\"glabel\" style=\"display:block\">Do I have to come in person to get more details?<\/span>So I would have to visit you to get more details about this?", "b": "Cela signifie-t-il qu'il faudrait que je me déplace jusque chez vous pour en savoir plus ?<span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><span class=\"gr\">cond · subj · en/y<\/span><\/span>"}, {"id": "A:Q150", "bid": "QB111", "f": "<span class=\"glabel\" style=\"display:block\">Where can I find out which lectures are on each night?<\/span>Where can I find out what kind of lectures are going to be available for a particular night?", "b": "Pouvez-vous m'indiquer où consulter le programme des conférences pour une soirée donnée ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q007", "bid": "QB006", "f": "<span class=\"glabel\" style=\"display:block\">What are the instructions I would have to follow?<\/span>And just to make me even more reassured, what are some of these instructions or procedures that I would have to follow?", "b": "Et, pour me rassurer un peu plus, pourriez-vous me préciser quelques-unes de ces consignes ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q100", "bid": "QB080", "f": "<span class=\"glabel\" style=\"display:block\">What medical proof do you need?<\/span>How exactly do we have to prove our pre-existing medical conditions to you, for you to be convinced that we don't have any?", "b": "De quelle manière devons-nous vous prouver que nous n'avons pas d'antécédents médicaux ?<span class=\"tags\"><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:QN19", "bid": "QB080", "f": "<span class=\"glabel\" style=\"display:block\">What medical proof do you need?<\/span>Is a medical certificate mandatory to jump, or is a signed waiver enough?", "b": "Un certificat médical est-il obligatoire pour sauter, ou une simple décharge suffit-elle ?<span class=\"tags\"><span class=\"st\"><b>6b<\/b> … est-il obligatoire ?<\/span><\/span>"}, {"id": "A:QN37", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>And if it's not allowed, what's the reason for that restriction?", "b": "Et si ce n'est pas autorisé, qu'est-ce qui justifie cette restriction ?<span class=\"tags\"><span class=\"st\"><b>4b<\/b> Qu'est-ce qui justifie…<\/span><\/span>"}, {"id": "A:QN42", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>How do you explain not delivering beyond that distance?", "b": "Comment expliquez-vous que vous ne livriez pas au-delà de cette distance ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:QN23", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>And for what reason is the age limit set at 13?", "b": "Et pour quelle raison la limite d'âge est-elle fixée à 13 ans ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><\/span>"}, {"id": "A:QN28", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>For what reason do you need proof of our medical history, exactly?", "b": "Pour quelle raison exigez-vous un justificatif médical, au juste ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QN21", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>And if our name did have to be on it, what would be the reason?", "b": "Et si notre nom devait y figurer, pour quelle raison serait-ce nécessaire ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><span class=\"gr\">si + imparf. · cond · en/y<\/span><\/span>"}, {"id": "A:Q137", "bid": "QB103", "f": "<span class=\"glabel\" style=\"display:block\">What are the rules about noise at night?<\/span><mark>What are the rules for how much noise we are allowed to make in the apartment at night<\/mark><span class=\"dim\">, in case we host parties or anything like that?<\/span>", "b": "<mark>Quelles sont les règles en matière de bruit la nuit dans l'appartement<\/mark><span class=\"dim\">, au cas où nous organiserions des soirées, ce genre de choses ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q121", "bid": "QB091", "f": "<span class=\"glabel\" style=\"display:block\">How much do we need to help write the lyrics?<\/span>To what extent do we need to play a part in helping you write the lyrics of the song?", "b": "Pourriez-vous me dire dans quelle mesure nous devrions participer à l'écriture des paroles ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q122", "bid": "QB092", "f": "<span class=\"glabel\" style=\"display:block\">How many revisions are free before you charge extra?<\/span><span class=\"dim\">Let's say you return us with a song and we don't really like it. <\/span><mark>How many revisions do we have free of charge before you start charging extra?<\/mark>", "b": "<span class=\"dim\">Admettons que vous nous livriez une chanson et qu'elle ne nous plaise pas vraiment : <\/span><mark>à combien de modifications gratuites aurions-nous droit avant que vous ne commenciez à facturer un supplément ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · ne explétif · cond<\/span><\/span>"}, {"id": "A:QN65", "bid": "QB173", "f": "<span class=\"glabel\" style=\"display:block\">How long after delivery can we ask for changes?<\/span>And for how long after delivery can those changes be requested?", "b": "Et sur quelle durée ces modifications peuvent-elles être demandées après la livraison ?<span class=\"tags\"><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><\/span>"}, {"id": "A:Q090", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span><span class=\"dim\">I also have to ask about the food. <\/span><mark>Do I need to buy a week's supply of food for my pets beforehand, or would you provide that yourself?<\/mark>", "b": "<span class=\"dim\">Par ailleurs, il faut que je vous pose une question sur la nourriture : <\/span><mark>dois-je acheter une semaine de nourriture pour mes animaux à l'avance, ou est-ce bien vous qui vous en occupez ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"st\"><b>6d<\/b> Est-ce bien vous qui vous occupez de…<\/span><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:Q034", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span>If we want to stay overnight, do we need to bring our own sleeping bags or any other camping equipment?", "b": "Si nous souhaitons passer la nuit sur place, est-il obligatoire que nous apportions nos propres sacs de couchage, ou d'autre matériel de camping ?<span class=\"tags\"><span class=\"st\"><b>6b<\/b> … est-il obligatoire ?<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q089", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span><span class=\"dim\">I also have to ask about the food. <\/span><mark>Do I need to buy a week's supply of food for my pets beforehand<\/mark><span class=\"dim\">, or would you provide that yourself?<\/span>", "b": "<span class=\"dim\">Par ailleurs, il faut que je vous pose une question sur la nourriture : <\/span><mark>dois-je acheter une semaine de nourriture pour mes animaux à l'avance<\/mark><span class=\"dim\">, ou est-ce bien vous qui vous en occupez ?<\/span><span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"st\"><b>6d<\/b> Est-ce bien vous qui vous occupez de…<\/span><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:Q177", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span>In terms of equipments and utensils, is there anything that we have to buy ourselves beforehand, like aprons? Or do you provide everything?", "b": "Côté matériel et ustensiles, y a-t-il des choses que nous devrions acheter nous-mêmes au préalable, comme des tabliers ? Ou fournissez-vous tout ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q025", "bid": "QB023", "f": "<span class=\"glabel\" style=\"display:block\">What kind of items could we bring that would be useful for making the lamps?<\/span>Could you give me a few examples of things we could bring that would be useful for making the lamps?", "b": "Pourriez-vous me donner quelques exemples d'objets que nous pourrions apporter et qui seraient utiles pour fabriquer les lampes ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q189", "bid": "QB137", "f": "<span class=\"glabel\" style=\"display:block\">Do you recommend bringing hats?<\/span><span class=\"dim\">I'm wondering if you have any shaded areas on the farm, and <\/span><mark>do you recommend us to bring hats with us?<\/mark>", "b": "<span class=\"dim\">Auriez-vous des coins à l'ombre à la ferme ? Et <\/span><mark>nous conseilleriez-vous d'apporter des chapeaux ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q191", "bid": "QB139", "f": "<span class=\"glabel\" style=\"display:block\">How much water should we bring with us?<\/span><span class=\"dim\">Because <\/span><mark>I'm just wondering how much water we have to bring along with us.<\/mark>", "b": "<span class=\"dim\">Parce que <\/span><mark>je me demande quelle quantité d'eau il faudrait que nous emportions.<\/mark><span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q190", "bid": "QB138", "f": "<span class=\"glabel\" style=\"display:block\">Are there water fountains at the farm?<\/span>Do you also offer water fountains and stuff at the farm?", "b": "Avez-vous aussi des fontaines à eau, ce genre de choses, à la ferme ?"}, {"id": "A:Q109", "bid": "QB084", "f": "<span class=\"glabel\" style=\"display:block\">Is it made fresh on the day, or the night before?<\/span>If the delivery is to be scheduled in the morning, when would the products be made?", "b": "Si la livraison a lieu le matin, à quel moment prépareriez-vous les produits ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q110", "bid": "QB084", "f": "<span class=\"glabel\" style=\"display:block\">Is it made fresh on the day, or the night before?<\/span>Is it usually made the morning of delivery, or the night before?", "b": "Plutôt le matin même, ou la veille au soir ?"}, {"id": "A:Q114", "bid": "QB088", "f": "<span class=\"glabel\" style=\"display:block\">Can it be left at the door?<\/span><mark>About the delivery itself, can it be left at the door<\/mark><span class=\"dim\"> or does it need to be handed over to the person that it's delivered to?<\/span>", "b": "<mark>À ce propos, la commande peut-elle être déposée devant la porte<\/mark><span class=\"dim\">, ou doit-elle être remise en mains propres à la destinataire ?<\/span><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><\/span>"}, {"id": "A:Q115", "bid": "QB088", "f": "<span class=\"glabel\" style=\"display:block\">Can it be left at the door?<\/span><span class=\"dim\">About the delivery itself, can it be left at the door or <\/span><mark>does it need to be handed over to the person that it's delivered to?<\/mark>", "b": "<span class=\"dim\">À ce propos, la commande peut-elle être déposée devant la porte, ou <\/span><mark>doit-elle être remise en mains propres à la destinataire ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><\/span>"}, {"id": "A:Q111", "bid": "QB085", "f": "<span class=\"glabel\" style=\"display:block\">Do you expect a tip for the delivery driver?<\/span>Do you usually expect any tips for the delivery drivers?", "b": "Est-il d'usage de laisser un pourboire aux livreurs ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q112", "bid": "QB086", "f": "<span class=\"glabel\" style=\"display:block\">Can I tip in advance?<\/span><mark>So would it be okay for me to tip beforehand<\/mark><span class=\"dim\"> and you let the delivery driver know that I've already tipped?<\/span>", "b": "<mark>Serait-il donc envisageable que je le règle à l'avance<\/mark><span class=\"dim\">, et que vous préveniez le livreur que c'est déjà fait ?<\/span><span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q113", "bid": "QB087", "f": "<span class=\"glabel\" style=\"display:block\">Could you tell the driver that I've already tipped?<\/span>So would it be okay for me to tip beforehand and you let the delivery driver know that I've already tipped?", "b": "Serait-il donc envisageable que je le règle à l'avance, et que vous préveniez le livreur que c'est déjà fait ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · cond<\/span><\/span>"}]}, {"key": "A-M1", "sec": "A", "code": "M1", "name": "Opening", "bucket": "Context", "items": [{"id": "A:C058", "bid": "CB001", "f": "<span class=\"glabel\" style=\"display:block\">I saw your ad.<\/span><span class=\"dim\">Hi, <\/span><mark>I wanted to call you because I just saw one of your ads<\/mark><span class=\"dim\">, and I wanted to ask some questions to clarify a few things before I place an order... if you don't mind.<\/span>", "b": "<span class=\"dim\">Bonjour, <\/span><mark>je me permets de vous appeler au sujet d'une de vos annonces que je viens de voir<\/mark><span class=\"dim\">, et j'aurais quelques questions à vous poser pour éclaircir certains points avant de passer commande… si cela ne vous dérange pas.<\/span>"}, {"id": "A:C001", "bid": "CB001", "f": "<span class=\"glabel\" style=\"display:block\">I saw your ad.<\/span><mark>Hi, I wanted to call you because I just saw your ad about the paragliding experience that you offer<\/mark><span class=\"dim\">, and I wanted to ask isplay:block\">I'd like X.<\/span><span class=\"dim\">The person I'm thinking of gifting this song to really loves Lana Del Rey, and <\/span><mark>I want to include some elements of her music.<\/mark>", "b": "<span class=\"dim\">La personne à qui je compte offrir cette chanson adore Lana Del Rey, et <\/span><mark>j'aimerais y glisser quelques clins d'œil à sa musique.<\/mark><span class=\"tags\"><span class=\"gr\">cond · en/y · idiome<\/span><\/span>"}, {"id": "A:C135", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span>I think I want help with packing as well.", "b": "Je pense que j'aurais aussi besoin d'aide pour l'emballage.<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C074", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span><span class=\"dim\">A boat that fits five will do, but <\/span><mark>we also want something that's safe and secure.<\/mark>", "b": "<span class=\"dim\">Un bateau pour cinq, ça fera l'affaire, mais <\/span><mark>il faudrait aussi qu'il soit sûr et rassurant.<\/mark><span class=\"tags\"><span class=\"gr\">dislocation · subj · cond<\/span><\/span>"}, {"id": "A:C088", "bid": "CB053", "f": "<span class=\"glabel\" style=\"display:block\">X is very important to me.<\/span>I think travel insurance is very important for me.", "b": "L'assurance voyage, pour moi, c'est primordial.<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:C142", "bid": "CB053", "f": "<span class=\"glabel\" style=\"display:block\">X is very important to me.<\/span>Because obviously there'll be the catering, there'll be the eating, but the activities make the party, right?", "b": "Parce qu'évidemment, il y aura le repas, mais ne trouvez-vous pas que ce sont les activités qui font une fête réussie ?<span class=\"tags\"><span class=\"gr\">mise en relief<\/span><\/span>"}, {"id": "A:C124", "bid": "CB072", "f": "<span class=\"glabel\" style=\"display:block\">I want to know how long my commute would be.<\/span>I'm just wondering how long my commute would take.", "b": "J'aimerais me faire une idée de la durée du trajet.<span class=\"tags\"><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:C091", "bid": "CB055", "f": "<span class=\"glabel\" style=\"display:block\">I'd rather look at the menu and choose the items myself.<\/span>For choosing the breakfast items, I think it's better that I look at the menu and choose.", "b": "Pour le choix des produits du petit déjeuner, je pense qu'il vaut mieux que je regarde la carte et que je choisisse moi-même."}, {"id": "A:C114", "bid": "CB066", "f": "<span class=\"glabel\" style=\"display:block\">We want to pick the night with the lecture topic that interests us most.<\/span><span class=\"dim\">Because <\/span><mark>we also want to pick the night where the topic of the lecture interests us the most.<\/mark>", "b": "Nous aimerions choisir celle dont le thème nous intéresse le plus.<span class=\"tags\"><span class=\"gr\">cond · dont/auquel<\/span><\/span>"}, {"id": "A:C100", "bid": "CB060", "f": "<span class=\"glabel\" style=\"display:block\">I don't want X.<\/span>I don't want the songwriting and the lyrics to be cheesy. You know what I mean?", "b": "Je ne voudrais surtout pas que la composition et les paroles fassent kitsch. Vous voyez ce que je veux dire ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:C094", "bid": "CB060", "f": "<span class=\"glabel\" style=\"display:block\">I don't want X.<\/span>Since this is a surprise delivery, I wouldn't expect my friend to tip.", "b": "Comme il s'agit d'une surprise, je ne voudrais pas que mon amie ait à laisser un pourboire.<span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:C096", "bid": "CB054", "f": "<span class=\"glabel\" style=\"display:block\">I want to give it as a birthday gift.<\/span>I'm thinking of gifting a song as a birthday gift to someone.", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler au sujet de votre annonce : <\/span><mark>je songe à offrir une chanson à quelqu'un pour son anniversaire.<\/mark>"}, {"id": "A:C090", "bid": "CB054", "f": "<span class=\"glabel\" style=\"display:block\">I want to give it as a birthday gift.<\/span>I was considering buying a breakfast delivery for one of my friends for her birthday.", "b": "J'envisageais de faire livrer un petit déjeuner à une amie pour son anniversaire."}, {"id": "A:C138", "bid": "CB079", "f": "<span class=\"glabel\" style=\"display:block\">I'm planning a birthday party for my five-year-old son.<\/span>I'm thinking of organizing a birthday party for my five-year-old son.", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler : <\/span><mark>j'envisage d'organiser l'anniversaire de mon fils, qui va avoir cinq ans.<\/mark>"}, {"id": "A:C108", "bid": "CB063", "f": "<span class=\"glabel\" style=\"display:block\">We might have parties sometimes.<\/span>What are the rules for how much noise we are allowed to make in the apartment at night, in case we host parties or anything like that?", "b": "Quelles sont les règles en matière de bruit la nuit dans l'appartement, au cas où nous organiserions des soirées, ce genre de choses ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C020", "bid": "CB014", "f": "<span class=\"glabel\" style=\"display:block\">I can't wait to take some pictures.<\/span>I honestly can’t wait to take some pictures.", "b": "Franchement, j'ai hâte de prendre quelques photos."}]}, {"key": "A-M5", "sec": "A", "code": "M5", "name": "What I assume or don't know", "bucket": "Context", "items": [{"id": "A:C089", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span>I'm assuming we will be traveling together with a tour group because there's a tour guide.", "b": "Je suppose que nous voyagerons en groupe, puisqu'il y a un guide."}, {"id": "A:C076", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span><mark>I'm pretty sure you offer life vests<\/mark><span class=\"dim\">, but in case we need rescuing, do you provide medical care, first aid and lifeguarding services?<\/span>", "b": "<mark>Je ne doute pas que vous fournissiez des gilets de sauvetage<\/mark><span class=\"dim\">, mais au cas où nous aurions besoin d'être secourus, proposez-vous une assistance médicale, des premiers secours et un service de sauvetage ?<\/span><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:C110", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span><span class=\"dim\">And speaking of deposits, how much is the security deposit as well? 'Cause <\/span><mark>I'm assuming we would have to pay some sort of security deposit, right?<\/mark>", "b": "<span class=\"dim\">Et, à ce propos, quel est le montant du dépôt de garantie ? Car <\/span><mark>j'imagine qu'il faudrait que nous en versions un, pourriez-vous me le confirmer ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><span class=\"st\"><b>6a<\/b> Puis-je confirmer que…<\/span><span class=\"gr\">subj · cond · en/y<\/span><\/span>"}, {"id": "A:C123", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span>I'm assuming they're in person because they are cooking classes.", "b": "J'imagine que les cours ont lieu en présentiel, s'agissant de cours de cuisine."}, {"id": "A:C129", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span>I'm imagining that it gets pretty hot in the afternoon.", "b": "J'imagine qu'il fait assez chaud l'après-midi."}, {"id": "A:C078", "bid": "CB050", "f": "<span class=\"glabel\" style=\"display:block\">As I understand it, X.<\/span><mark>I know we'll essentially be buying other people's services<\/mark><span class=\"dim\">, but then what's next after that?<\/span>", "b": "<mark>Je crois comprendre qu'en gros, nous achèterons les services d'autres personnes<\/mark><span class=\"dim\">, mais ensuite, comment les choses se passent-elles ?<\/span>"}, {"id": "A:C082", "bid": "CB050", "f": "<span class=\"glabel\" style=\"display:block\">As I understand it, X.<\/span><span class=\"dim\">Because <\/span><mark>I know you offer in-home care and also host-family care<\/mark><span class=\"dim\">, so I'm wondering what the difference in price is between the two.<\/span>", "b": "<mark>Je sais que vous assurez à la fois la garde à domicile et la garde en famille d'accueil<\/mark><span class=\"dim\"> : y a-t-il une différence notable de prix entre les deux ?<\/span><span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:C145", "bid": "CB080", "f": "<span class=\"glabel\" style=\"display:block\">To me, either you can ride a horse or you can't.<\/span><span class=\"dim\">Because <\/span><mark>in my head right now, you can either ride a horse or you can't.<\/mark>", "b": "<span class=\"dim\">Parce que, <\/span><mark>dans mon esprit, soit on sait monter à cheval, soit on ne sait pas.<\/mark>"}, {"id": "A:C119", "bid": "CB069", "f": "<span class=\"glabel\" style=\"display:block\">With an online bank we have to rely on the phone or your website.<\/span><span class=\"dim\">And what's the advantage of choosing an online bank account, rather than a traditional bank account where we can physically go to a branch, whereas <\/span><mark>for this one, we have to rely on telephone or your website<\/mark><span class=\"dim\">?<\/span>", "b": "<span class=\"dim\">Et quel serait l'avantage d'un compte en ligne par rapport à une banque traditionnelle, où l'on peut se rendre en agence, alors qu'<\/span><mark>avec vous, il faut passer par le téléphone ou par votre site<\/mark><span class=\"dim\"> ?<\/span>"}, {"id": "A:C122", "bid": "CB071", "f": "<span class=\"glabel\" style=\"display:block\">With online banks I sometimes see really high interest rates, like four or five percent.<\/span><span class=\"dim\">Because <\/span><mark>with these online banks, sometimes I see really high interest rates, like four to five percent.<\/mark>", "b": "<span class=\"dim\">Car <\/span><mark>avec les banques en ligne, je vois parfois des taux vraiment élevés, de l'ordre de quatre à cinq pour cent.<\/mark><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:C095", "bid": "CB008", "f": "<span class=\"glabel\" style=\"display:block\">I guess it depends on which one I choose.<\/span><mark>I guess it depends on the specific product that we're ordering<\/mark><span class=\"dim\">, so give me the different numbers based on the different options.<\/span>", "b": "<mark>J'imagine que cela dépend du produit<\/mark><span class=\"dim\">, auquel cas j'aimerais connaître les délais propres à chaque option.<\/span>"}, {"id": "A:C012", "bid": "CB008", "f": "<span class=\"glabel\" style=\"display:block\">I guess it depends on which one I choose.<\/span>I imagine the price varies depending on the type of dance class.", "b": "J'imagine que le prix varie selon le type de cours de danse."}, {"id": "A:C072", "bid": "CB008", "f": "<span class=\"glabel\" style=\"display:block\">I guess it depends on which one I choose.<\/span>I know it might be different for different sites, but in general?", "b": "Je me doute que cela varie d'un site à l'autre, mais qu'en est-il en règle générale ?<span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:C019", "bid": "CB013", "f": "<span class=\"glabel\" style=\"display:block\">I imagine the view is amazing.<\/span>I’m especially interested because I imagine the view must be breathtaking.", "b": "Ça m'intéresse tout particulièrement, parce que j'imagine que la vue doit être à couper le souffle."}, {"id": "A:C106", "bid": "CB013", "f": "<span class=\"glabel\" style=\ ou.<\/span><span class=\"dim\">I think $90 might be a bit expensive for me, but <\/span><mark>I'll definitely think about it.<\/mark>", "b": "<span class=\"dim\">Je pense que 90 euros, ça fait peut-être un peu cher pour moi, mais <\/span><mark>je vais y réfléchir, c'est sûr.<\/mark>"}, {"id": "A:C118", "bid": "CB041", "f": "<span class=\"glabel\" style=\"display:block\">I'll check that myself.<\/span>I'll look that one up myself.", "b": "Ça, je le vérifierai moi-même.<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:C064", "bid": "CB041", "f": "<span class=\"glabel\" style=\"display:block\">I'll check that myself.<\/span><span class=\"dim\">I don’t remember exactly what my prescription is off the top of my head, so <\/span><mark>I’ll have to check the note my doctor gave me.<\/mark>", "b": "<span class=\"dim\">Je ne me souviens plus exactement de ce qu'il y a sur mon ordonnance, comme ça de tête, donc <\/span><mark>il faudra que je vérifie sur le papier que mon médecin m'a donné.<\/mark>"}, {"id": "A:C029", "bid": "CB021", "f": "<span class=\"glabel\" style=\"display:block\">I'll look around the house and bring a few.<\/span>I’ll definitely have a look around the house and bring a few of them.", "b": "Je vais jeter un coup d'œil chez moi, c'est sûr, et j'en apporterai quelques-uns."}, {"id": "A:C048", "bid": "CB034", "f": "<span class=\"glabel\" style=\"display:block\">Maybe I'll just eat somewhere nearby.<\/span>Maybe I’ll just eat somewhere else nearby.", "b": "Je vais peut-être simplement manger ailleurs, dans le coin."}, {"id": "A:C068", "bid": "CB043", "f": "<span class=\"glabel\" style=\"display:block\">That's all the questions I have.<\/span><span class=\"dim\">Yeah, <\/span><mark>I think that's all the questions that I have for you.<\/mark>", "b": "<span class=\"dim\">Oui, <\/span><mark>je crois bien que je n'ai plus de questions à vous poser pour le moment.<\/mark>"}, {"id": "A:CG022", "bid": "CB043", "f": "<span class=\"glabe 01", "f": "<span class=\"glabel\" style=\"display:block\">You love this kind of thing.<\/span><span class=\"dim\">Obviously, you can do whatever you want, but <\/span><mark>you love animals<\/mark><span class=\"dim\">, and I really think this could be a great experience for you, especially because it's something you've never done before.<\/span>", "b": "<span class=\"dim\">Après, tu fais ce que tu veux, évidemment, mais <\/span><mark>t'adores les animaux<\/mark><span class=\"dim\">, et je pense vraiment que ça pourrait être une super expérience pour toi, surtout que c'est un truc que t'as jamais fait.<\/span>"}, {"id": "B:BP0576", "bid": "BAY001", "f": "<span class=\"glabel\" style=\"display:block\">You love this kind of thing.<\/span><span class=\"dim\">And when I saw this ad, I immediately thought of you because <\/span><mark>I know how much you like writing<\/mark><span class=\"dim\">, and I really think you've got talent.<\/span>", "b": "<span class=\"dim\">Et quand j'ai vu cette annonce, j'ai tout de suite pensé à toi, vu que <\/span><mark>je sais à quel point t'aimes écrire<\/mark><span class=\"dim\">, et je trouve vraiment que t'as du talent.<\/span>"}, {"id": "B:BP0677", "bid": "BAY001", "f": "<span class=\"glabel\" style=\"display:block\">You love this kind of thing.<\/span><span class=\"dim\">So, the reason I wanted to call you is that I saw this ad and immediately thought of you, because <\/span><mark>I know you’re into adventures and trying unusual things.<\/mark>", "b": "<span class=\"dim\">Alors en fait, si je voulais t'appeler, c'est que j'ai vu cette pub et que j'ai tout de suite pensé à toi, vu que <\/span><mark>je sais que t'aimes l'aventure et essayer des trucs insolites.<\/mark>"}, {"id": "B:BP0272", "bid": "BAY001", "f": "<span class=\"glabel\" style=\"display:block\">You love this kind of thing.<\/span><span class=\"dim\">When I saw this ad, it immediately made me think of you because <\/span><mark>I know you like helping people and doing favors for them.<\/mark>", "b": "<span class=\"dim\">Quand j'ai vu cette annonce, ça m'a tout de suite fait penser à toi, vu que <\/span><mark>je sais que t'aimes bien aider les gens et leur rendre service.<\/mark>"}, {"id": "B:BP1099", "bid": "BAY002", "f": "<span class=\"glabel\" style=\"display:block\">We both love this.<\/span><span class=\"dim\">When I saw this ad, I wanted to reach out because <\/span><mark>we both love sports and we have friends who love sports.<\/mark>", "b": "<span class=\"dim\">Quand j'ai vu cette annonce, j'ai tout de suite eu envie de t'en parler, vu qu'<\/span><mark>on adore le sport tous les deux et qu'on a des potes qui adorent ça aussi.<\/mark>"}, {"id": "B:BP0212", "bid": "BAY002", "f": "<span class=\"glabel\" style=\"display:block\">We both love this.<\/span><span class=\"dim\">I'm just asking you first because <\/span><mark>I know you're as into cycling as I am<\/mark><span class=\"dim\">, and I haven't mentioned this to anyone else yet.<\/span>", "b": "<span class=\"dim\">Je t'en parle juste en premier parce que <\/span><mark>je sais que t'es aussi mordu de vélo que moi<\/mark><span class=\"dim\">, et que j'en ai encore parlé à personne d'autre.<\/span>"}, {"id": "B:BP0392", "bid": "BAY003", "f": "<span class=\"glabel\" style=\"display:block\">You love this, so it's perfect for you.<\/span>You love movies—they’re really your thing—so this honestly seems perfect for you.", "b": "Toi, t'adores les films, c'est vraiment ton truc, du coup honnêtement, ça a l'air fait pour toi."}, {"id": "B:BP0396", "bid": "BAY003", "f": "<span class=\"glabel\" style=\"display:block\">You love this, so it's perfect for you.<\/span>I mean, you already love going to the movies, so getting to see previews and be more involved like that sounds like a really good opportunity.", "b": "Ce que je veux dire, c'est que t'adores déjà aller au ciné, donc pouvoir voir des films en avant-première et t'impliquer plus comme ça, ça a l'air d'être une super occasion."}, {"id": "B:BP1163", "bid": "BAY003", "f": "<span class=\"glabel\" style=\"display:block\">You love this, so it's perfect for you.<\/span>You like to cook, and doesn't it sound cool?", "b": "Et toi qui aimes cuisiner — franchement, tu trouves pas ça cool ?"}, {"id": "B:BP0414", "bid": "BAY004", "f": "<span class=\"glabel\" style=\"display:block\">You'd do what you already love, plus extras.<\/span><span class=\"dim\">So yeah, you wouldn’t be getting paid, but <\/span><mark>you’d be doing something you already love and getting all these extra experiences out of it.<\/mark>", "b": "<span class=\"dim\">Donc ouais, tu serais pas payé, mais <\/span><mark>tu ferais un truc que t'adores déjà, et t'en tirerais toutes ces expériences en bonus.<\/mark>"}, {"id": "B:BP0407", "bid": "BAY004", "f": "<span class=\"glabel\" style=\"display:block\">You'd do what you already love, plus extras.<\/span>You already go to the movies anyway, and with this you’d still be doing something you already enjoy, except now you’d also get access to previews.", "b": "De toute façon, tu vas déjà au ciné, et avec ça, tu continuerais à faire un truc que t'aimes déjà, sauf que là, en plus, t'aurais accès aux avant-premières."}, {"id": "B:BP0365", "bid": "BAY005", "f": "<span class=\"glabel\" style=\"display:block\">You'd do it because it means something to you.<\/span><span class=\"dim\">And I really think you’d be good at it because you genuinely care about animals, <\/span><mark>so you’d actually be doing it because it means something to you.<\/mark>", "b": "<span class=\"dim\">Et franchement, je pense que tu te débrouillerais super bien, parce que les animaux, tu les aimes vraiment. <\/span><mark>Du coup, tu le ferais parce que ça compte vraiment pour toi.<\/mark>"}, {"id": "B:BP0141", "bid": "BAY006", "f": "<span class=\"glabel\" style=\"display:block\">You told me you wanted something like this.<\/span><span class=\"dim\">So, <\/span><mark>you told me you’re looking for a new hobby.<\/mark>", "b": "<span class=\"dim\">Alors, <\/span><mark>tu m'as dit que tu te cherchais un nouveau passe-temps.<\/mark>"}, {"id": "B:BP0036", "bid": "BAY006", "f": "<span class=\"glabel\" style=\"display:block\">You told me you wanted something like this.<\/span><span class=\"dim\">So, when I saw this ad, I immediately thought of you because <\/span><mark>you told me you wanted to throw a party, but you were looking for some new ideas to make it a little different.<\/mark>", "b": "<span class=\"dim\">Alors quand j'ai vu cette pub, j'ai tout de suite pensé à toi, vu que <\/span><mark>tu m'avais dit que tu voulais organiser une soirée, mais que tu cherchais des nouvelles idées pour que ce soit un peu différent.<\/mark>"}, {"id": "B:BP0111", "bid": "BAY006", "f": "<span class=\"glabel\" style=\"display:block\">You told me you wanted something like this.<\/span><mark>You told me you were looking for something to do in your free time, something a little different and unusual<\/mark><span class=\"dim\">, and honestly, this seems like something you'd probably never have thought of trying.<\/span>", "b": "<mark>Tu m'avais dit que tu cherchais quelque chose à faire sur ton temps libre, un truc un peu différent, un peu original<\/mark><span class=\"dim\">, et franchement, ça m'a l'air d'être le genre de truc que t'aurais sûrement jamais eu l'idée d'essayer.<\/span>"}, {"id": "B:BP0725", "bid": "BAY006", "f": "<span class=\"glabel\" style=\"display:block\">You told me you wanted something like this.<\/span>Plus, you've told me a few times just this past week that you wanted a change of scenery and needed to clear your head a bit.", "b": "En plus, tu m'as dit plusieurs fois rien que cette semaine que tu voulais changer d'air et que t'avais besoin de te vider un peu la tête."}, {"id": "B:BP0787", "bid": "BAY006", "f": "<span class=\"glabel\" style=\"display:block\">You told me you wanted something like this.<\/span><span class=\"dim\">When I saw this ad, it immediately made me think of you becau
