ested in.", "b": "Je me suis dit que ça pourrait t'intéresser."}, {"id": "B:BP0678", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>I honestly think you’d be interested in it.", "b": "Franchement, je pense que ça t'intéresserait."}, {"id": "B:BP0726", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>So when I saw this, I thought it might be exactly the kind of thing that could interest you.", "b": "Alors quand j'ai vu ça, je me suis dit que c'était peut-être exactement le genre de truc qui pourrait t'intéresser."}, {"id": "B:BP0421", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>So, I wanted to call you because I saw this ad and immediately thought it might interest you.", "b": "Alors voilà, je voulais t'appeler parce que j'ai vu une pub et je me suis tout de suite dit que ça pourrait t'intéresser."}, {"id": "B:BP0705", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>Yeah, so I came across this ad last night, and I wanted to tell you about it because I immediately thought it might be something you'd be interested in.", "b": "Ouais, alors en fait, je suis tombé sur cette annonce hier soir, et je voulais t'en parler parce que je me suis tout de suite dit que ça pourrait t'intéresser."}, {"id": "B:BP0727", "bid": "BCY009", "f": "<span class=\"glabel\" style=\"display:block\">I think this might interest you.<\/span>So, I saw this ad, and I actually wanted to call you and tell you about it because I think it might interest you.", "b": "Alors voilà, j'ai vu une pub, et en fait je voulais t'appeler pour t'en parler parce que je pense que ça pourrait t'intéresser."}, {"id": "B:BP0115", "bid": "BCY010", "f": "<span class=\"glabel\" style=\"display:block\">That's exactly why I wanted to tell you.<\/span>That's exactly why I wanted to tell you about it.", "b": "C'est justement pour ça que je voulais t'en parler."}, {"id": "B:BP0921", "bid": "BCY010", "f": "<span class=\"glabel\" style=\"display:block\">That's exactly why I wanted to tell you.<\/span>Anyway, that’s actually one of the main reasons I wanted to tell you about it now.", "b": "Enfin bref, c'est justement une des principales raisons pour lesquelles je voulais t'en parler maintenant."}, {"id": "B:BP0211", "bid": "BCY011", "f": "<span class=\"glabel\" style=\"display:block\">You're the first person I'm asking.<\/span><mark>I'm just asking you first<\/mark><span class=\"dim\"> because I know you're as into cycling as I am, and I haven't mentioned this to anyone else yet.<\/span>", "b": "<mark>Je t'en parle juste en premier<\/mark><span class=\"dim\"> parce que je sais que t'es aussi mordu de vélo que moi, et que j'en ai encore parlé à personne d'autre.<\/span>"}, {"id": "B:BP0193", "bid": "BCY011", "f": "<span class=\"glabel\" style=\"display:block\">You're the first person I'm asking.<\/span>That's why I called you first.", "b": "C'est pour ça que je t'ai appelé en premier."}, {"id": "B:BP0213", "bid": "BCY011", "f": "<span class=\"glabel\" style=\"display:block\">You're the first person I'm asking.<\/span><span class=\"dim\">I'm just asking you first because I know you're as into cycling as I am, and <\/span><mark>I haven't mentioned this to anyone else yet.<\/mark>", "b": "<span class=\"dim\">Je t'en parle juste en premier parce que je sais que t'es aussi mordu de vélo que moi, et que <\/span><mark>j'en ai encore parlé à personne d'autre.<\/mark>"}]}, {"key": "B-BC2", "sec": "B", "code": "BC2", "name": "Describing the offer", "bucket": "Context", "items": [{"id": "B:BP0923", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span><span class=\"dim\">So, <\/span><mark>this ad is for a digital library.<\/mark>", "b": "<span class=\"dim\">Alors, <\/span><mark>cette pub, c'est pour une bibliothèque numérique.<\/mark>"}, {"id": "B:BP0508", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span>It was an ad for this restaurant called Le Criquet, and apparently they make food with insects.", "b": "C'était une pub pour un resto qui s'appelle Le Criquet, et apparemment, ils font à manger avec des insectes."}, {"id": "B:BP0539", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span>I saw this ad for a festival with a big music lineup from September 10th to the 13th.", "b": "J'ai vu une pub pour un festival avec plein d'artistes à l'affiche, du 10 au 13 septembre."}, {"id": "B:BP0611", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span>Well, it was an ad for a photo reporter position with the city magazine.", "b": "Eh ben, c'était une annonce pour un poste de reporter photo pour le magazine de la ville."}, {"id": "B:BP0788", "bid": "BCY012", "f": "<span class=\"glabel\" style=\"display:block\">It's an ad for this thing.<\/span><mark>It’s for a garage sale in your neighborhood<\/mark><span class=\"dim\">, and the town hall is organizing it.<\/span>", "b": "<mark>En fait, c'est pour un vide-grenier dans ton quartier<\/mark><span class=\"dim\">, et c'est la mairie qui l'organise.<\/span>"}, {"id": "B:BP0084", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><mark>Basically, they’re looking for people to look after houses while the owners are away<\/mark><span class=\"dim\">—things like keeping the place in order, watching the house, and sometimes taking care of pets and stuff like that.<\/span>", "b": "<mark>En gros, ils cherchent des gens pour s'occuper de maisons pendant que les proprios sont pas là<\/mark><span class=\"dim\"> — des trucs comme garder la maison en ordre, la surveiller, et des fois s'occuper des animaux, tout ça.<\/span>"}, {"id": "B:BP0059", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><mark>Basically, they’re looking for dancers for a good cause<\/mark><span class=\"dim\">, and it’s happening at the Kent Nagano Community Centre.<\/span>", "b": "<mark>En gros, ils cherchent des danseurs pour une bonne cause<\/mark><span class=\"dim\">, et ça se passe au centre communautaire Kent Nagano.<\/span>"}, {"id": "B:BP0081", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><mark>It’s an ad looking for house-sitters in a new region<\/mark><span class=\"dim\">, and honestly, I think it could be a real opportunity for you to discover a different kind of life for a while.<\/span>", "b": "<mark>C'est une annonce où ils cherchent des gens pour garder des maisons dans une autre région<\/mark><span class=\"dim\">, et honnêtement, je trouve que ça pourrait être une vraie occasion pour toi de découvrir un autre mode de vie pendant un temps.<\/span>"}, {"id": "B:BP0305", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span><span class=\"dim\">They’re organizing an end-of-year party, and <\/span><mark>they’re looking for parent volunteers to help out—running games, manning stands, and doing things like that.<\/mark>", "b": "<span class=\"dim\">Ils organisent une fête de fin d'année, et <\/span><mark>ils cherchent des parents bénévoles pour donner un coup de main — s'occuper des jeux, tenir des stands, ce genre de trucs.<\/mark>"}, {"id": "B:BP0363", "bid": "BCY013", "f": "<span class=\"glabel\" style=\"display:block\">Basically, they're looking for people to do this.<\/span>Basically, they’re looking for volunteers to help out at an animal shelter, doing things like taking care of the animals, keeping them company, grooming them, cleaning the stalls, that kind of stuff.", "b": "En gros, ils cherchent des bénévoles pour filer un coup de main dans un refuge pour animaux : s'occuper des animaux, leur tenir compagnie, les toiletter, nettoyer les boxes, ce genre de trucs."}, {"id": "B:BP0422", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>It’s basically a community-run garage where you can work on your car yourself.", "b": "En gros, c'est un garage associatif où tu peux bosser toi-même sur ta voiture."}, {"id": "B:BP0188", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span><mark>It's a charity cycling event where we'd raise money for an environmental cause<\/mark><span class=\"dim\">, and the challenge is 130 kilometers a day for two days.<\/span>", "b": "<span class=\"dim\">En gros, <\/span><mark>c'est un événement caritatif à vélo, où on récolterait de l'argent pour une cause environnementale<\/mark><span class=\"dim\">, et le défi, c'est 130 kilomètres par jour pendant deux jours.<\/span>"}, {"id": "B:BP0273", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>It’s basically a platform where people can exchange favors and services with each other.", "b": "En gros, c'est une plateforme où les gens peuvent s'échanger des services et des coups de main."}, {"id": "B:BP0304", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span><mark>They’re organizing an end-of-year party<\/mark><span class=\"dim\">, and they’re looking for parent volunteers to help out—running games, manning stands, and doing things like that.<\/span>", "b": "<mark>Ils organisent une fête de fin d'année<\/mark><span class=\"dim\">, et ils cherchent des parents bénévoles pour donner un coup de main — s'occuper des jeux, tenir des stands, ce genre de trucs.<\/span>"}, {"id": "B:BP0679", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Basically, it’s this experience where you can spend the night around wolves.", "b": "En gros, c'est une expérience où tu peux passer la nuit au milieu des loups."}, {"id": "B:BP0729", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Basically, it's a digital detox stay where you disconnect from your phone, computer, and all your other digital devices.", "b": "En gros, c'est un séjour de détox numérique où tu te déconnectes de ton téléphone, de ton ordi et de tous tes autres appareils numériques."}, {"id": "B:BP0753", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>And it’s skydiving.", "b": "Et en fait, c'est du saut en parachute."}, {"id": "B:BP0891", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>Basically, it’s for this kind of volunteer vacation where you help restore historic monuments.", "b": "En gros, c'est un genre de séjour bénévole où tu aides à restaurer des monuments historiques."}, {"id": "B:BP1160", "bid": "BCY014", "f": "<span class=\"glabel\" style=\"display:block\">Basically, it's a kind of X where you can Y.<\/span>It's like a cultural exchange opportunity where you can register as a host to invite travellers from all around the world to your house, where you can cook together with them and allow them to discover dishes from your home country.", "b": "En gros, c'est une sorte d'échange culturel : tu peux t'inscrire comme hôte pour inviter chez toi des voyageurs des quatre coins du monde, cuisiner avec eux et leur faire découvrir des plats de ton pays."}, {"id": "B:BP0924", "bid": "BCY015", "f": "<span class=\"glabel\" style=\"display:block\">It's an alternative to the usual way of doing it.<\/span>It’s basically an alternative to borrowing books from a physical library.", "b": "En gros, c'est une alternative à la bibliothèque classique pour emprunter des livres."}, {"id": "B:BP0976", "bid": "BCY016", "f": "<span class=\"glabel\" style=\"display:block\">It's like this familiar thing.<\/span><mark>It's sort of like Craigslist or Facebook Marketplace<\/mark><span class=\"dim\">, but I think this one in particular, maybe because it's new, the deals that I saw on there are amazing.<\/span>", "b": "<mark>C'est un peu comme Craigslist ou Facebook Marketplace<\/mark><span class=\"dim\">, mais celui-là en particulier, peut-être parce que c'est nouveau, les affaires que j'y ai vues, elles sont incroyables, je trouve.<\/span>"}, {"id": "B:BP0464", "bid": "BCY017", "f": "<span class=\"glabel\" style=\"display:block\">The ad suggests this as a way to deal with stress.<\/span><span class=\"dim\">The ad is from some kind of association or shelter—I’m not totally sure what exactly—but <\/span><mark>basically they’re encouraging people to adopt cats as a way of helping with stress.<\/mark>", "b": "<span class=\"dim\">La pub, elle vient d'une espèce d'association ou d'un refuge — je sais pas trop ce que c'est exactement — mais <\/span><mark>en gros, ils encouragent les gens à adopter des chats pour les aider à déstresser.<\/mark>"}, {"id": "B:BP0460", "bid": "BCY017", "f": "<span class=\"glabel\" style=\"display:block\">The ad suggests this as a way to deal with stress.<\/span>It was suggesting a completely different way of dealing with stress: getting a cat.", "b": "Elle proposait une façon complètement différente de gérer le stress : prendre un chat."}, {"id": "B:BP0511", "bid": "BCY018", "f": "<span class=\"glabel\" style=\"display:block\">The ad presents it as the eco food of the future.<\/span>They’re also presenting insects as this ecological food of the future.", "b": "Et en plus, ils présentent les insectes comme la bouffe écolo du futur."}, {"id": "B:BP1040", "bid": "BCY019", "f": "<span class=\"glabel\" style=\"display:block\">Volunteering is usually for others, not for yourself.<\/span><mark>It's an activity you do more often than not for others' sake and not for your own<\/mark><span class=\"dim\">, and I've always wondered how fulfilling it could feel.<\/span>", "b": "<mark>C'est un truc que la plupart du temps on fait pour les autres et pas pour soi<\/mark><span class=\"dim\"> — et justement, je me suis toujours demandé à quel point ça pouvait être épanouissant.<\/span>"}, {"id": "B:BP0001", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Basically, you paddle during the day, and then in the evening you get to sleep comfortably in a tent.", "b": "En gros, tu pagaies la journée, et puis le soir, tu dors bien confortablement sous une tente."}, {"id": "B:BP0113", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Basically, you'd get to do local radio shows and talk about topics you're interested in.", "b": "En gros, l'idée, c'est que tu ferais des émissions sur une radio locale, où tu parlerais de ce qui t'intéresse."}, {"id": "B:BP0330", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>We could take a trip and travel around by tuk-tuk.", "b": "On pourrait partir en voyage et se balader en tuk-tuk."}, {"id": "B:BP0579", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Basically, you tell your story in front of a jury for about 10 to 20 minutes.", "b": "En gros, tu racontes ton histoire devant un jury, pendant 10 à 20 minutes environ."}, {"id": "B:BP0648", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>So what you’d do is invite some friends over to your place and cook a dish of your choice.", "b": "Alors, le truc, c'est que t'invites des potes chez toi et tu cuisines le plat que tu veux."}, {"id": "B:BP0706", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Basically, you'd have to keep this dog company for ten months.", "b": "En gros, il faudrait que tu tiennes compagnie à ce chien pendant dix mois."}, {"id": "B:BP0823", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Basically, you'd be going on trips with groups of young people, welcoming them at the station, coordinating departures and returns, stuff like that.", "b": "En gros, tu partirais en voyage avec des groupes de jeunes, tu les accueillerais à la gare, tu coordonnerais les départs et les retours, des trucs comme ça."}, {"id": "B:BP0037", "bid": "BCY020", "f": "<span class=\"glabel\" style=\"display:block\">Basically, you'd do this activity.<\/span>Basically, you can book a chef to come and cook at your place.", "b": "En gros, tu peux réserver un chef pour qu'il vienne cuisiner chez toi."}, {"id": "B:BP0221", "bid": "BCY021", "f": "<span class=\"glabel\" style=\"display:block\">You basically become a travel tester.<\/span><mark>You basically become a travel tester<\/mark><span class=\"dim\">, and if we signed up to do it for them, we'd get the chance to travel all over the world.<\/span>", "b": "<mark>En gros, tu deviens testeur de voyages<\/mark><span class=\"dim\">, et si on s'inscrivait chez eux pour faire ça, on aurait la chance de voyager partout dans le monde.<\/span>"}, {"id": "B:BP0085", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span><span class=\"dim\">Basically, they’re looking for people to look after houses while the owners are away—<\/span><mark>things like keeping the place in order, watching the house, and sometimes taking care of pets and stuff like that.<\/mark>", "b": "<span class=\"dim\">En gros, ils cherchent des gens pour s'occuper de maisons pendant que les proprios sont pas là — <\/span><mark>des trucs comme garder la maison en ordre, la surveiller, et des fois s'occuper des animaux, tout ça.<\/mark>"}, {"id": "B:BP0223", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>From what I understand, they'd give us these little missions where we'd share our opinions and observations about different cultures, places, hotels, and stuff like that.", "b": "De ce que j'ai compris, ils nous fileraient des petites missions où on donnerait notre avis et nos observations sur différentes cultures, des endroits, des hôtels, des trucs comme ça."}, {"id": "B:BP0238", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>As for what they'd actually expect from you, it sounds like you'd mostly be doing reviews and sharing your observations.", "b": "Après, pour ce qu'ils attendraient de toi concrètement, on dirait que tu rédigerais surtout des avis et que tu partagerais tes observations."}, {"id": "B:BP0649", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>Then you’d show them the dish wrapped in this plastic wrap called Embal’Plast—that’s the product from the company that put out the ad.", "b": "Ensuite, tu leur montres le plat emballé dans ce film plastique qui s'appelle Embal'Plast — c'est le produit de la boîte qui a passé l'annonce."}, {"id": "B:BP0650", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>Basically, you’d tell your friends about it and try to convince them to buy some.", "b": "En gros, tu leur en parles et t'essaies de les convaincre d'en acheter."}, {"id": "B:BP0893", "bid": "BCY022", "f": "<span class=\"glabel\" style=\"display:block\">Your tasks would be things like this.<\/span>You’d help with things like clearing vegetation and doing simple maintenance work around historic sites.", "b": "Concrètement, tu donnerais un coup de main pour des trucs comme dégager la végétation ou faire des petits travaux d'entretien sur les sites historiques."}, {"id": "B:BP0089", "bid": "BCY023", "f": "<span class=\"glabel\" style=\"display:block\">The exact tasks would depend on the place.<\/span><span class=\"dim\">And <\/span><mark>the exact tasks would depend on the house anyway.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>de toute façon, les tâches exactes, ça dépendrait de la maison.<\/mark>"}, {"id": "B:BP0588", "bid": "BCY024", "f": "<span class=\"glabel\" style=\"display:block\">The ad says you have to memorize the text.<\/span>But the ad actually says you do have to memorize the text.", "b": "Mais en fait, l'annonce dit bien qu'il faut mémoriser le texte."}, {"id": "B:BP0164", "bid": "BCY025", "f": "<span class=\"glabel\" style=\"display:block\">With this card, you can buy meals and order online.<\/span><span class=\"dim\">And <\/span><mark>with this loyalty card, you’d have the option to buy 20 meals, order them online<\/mark><span class=\"dim\">, and get free delivery wherever you want.<\/span>", "b": "<span class=\"dim\">Et <\/span><mark>avec cette carte de fidélité, tu pourrais acheter 20 repas, les commander en ligne<\/mark><span class=\"dim\">, et te faire livrer gratuitement où tu veux.<\/span>"}, {"id": "B:BP0510", "bid": "BCY026", "f": "<span class=\"glabel\" style=\"display:block\">They cook it in all kinds of ways.<\/span>And the ad says they make them salty, sweet, all kinds of ways.", "b": "Et d'après la pub, ils les préparent salés, sucrés, de plein de façons différentes."}, {"id": "B:BP0754", "bid": "BCY027", "f": "<span class=\"glabel\" style=\"display:block\">You can do it tandem or solo.<\/span>They offer skydiving experiences, and you can either do it tandem or solo.", "b": "Ils proposent des sauts en parachute, et tu peux le faire soit en tandem, soit en solo."}, {"id": "B:BP1095", "bid": "BCY028", "f": "<span class=\"glabel\" style=\"display:block\">They plan trips tailored to what we want.<\/span>It's offering weekends tailor-made based on our preferences and wishes.", "b": "En fait, ils proposent des week-ends sur mesure, en fonction de nos préférences et de nos envies."}, {"id": "B:BP1096", "bid": "BCY029", "f": "<span class=\"glabel\" style=\"display:block\">We pick the destination and any sport we want.<\/span>We can choose a destination, whether it's the sea or the mountain, and any type of sports activities we want — hiking, snowboarding, skiing, climbing, surfing.", "b": "On peut choisir la destination — la mer ou la montagne — et toutes les activités sportives qu'on veut : rando, snowboard, ski, escalade, surf."}, {"id": "B:BP0790", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span>You can sign up to have a stall and sell your things.", "b": "Tu peux t'inscrire pour avoir un stand et vendre tes affaires."}, {"id": "B:BP0274", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span><mark>You create a profile, describe the kinds of things you can do<\/mark><span class=\"dim\">, and then other users can contact you if they need one of those services.<\/span>", "b": "<mark>Tu te crées un profil, tu décris le genre de trucs que tu sais faire<\/mark><span class=\"dim\">, et ensuite les autres utilisateurs peuvent te contacter s'ils ont besoin d'un de ces services.<\/span>"}, {"id": "B:BP0612", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span>Basically, to get the job, you have to enter this contest and submit your best photos so they can choose someone to become a photo reporter for the magazine.", "b": "En gros, pour avoir le job, il faut que tu participes à un concours et que tu envoies tes meilleures photos, pour qu'ils puissent choisir quelqu'un qui deviendra reporter photo pour le magazine."}, {"id": "B:BP0375", "bid": "BCY030", "f": "<span class=\"glabel\" style=\"display:block\">To take part, you sign up or apply like this.<\/span><span class=\"dim\">No, I get why you’d think that, but <\/span><mark>the ad says you’re supposed to contact the shelter closest to where you live.<\/mark>", "b": "<span class=\"dim\">Non mais je comprends pourquoi tu te dis ça, sauf que <\/span><mark>dans l'annonce, ils disent qu'il faut contacter le refuge le plus près de chez toi.<\/mark>"}, {"id": "B:BP0275", "bid": "BCY031", "f": "<span class=\"glabel\" style=\"display:block\">Other users contact you if they need your services.<\/span><span class=\"dim\">You create a profile, describe the kinds of things you can do, and then <\/span><mark>other users can contact you if they need one of those services.<\/mark>", "b": "<span class=\"dim\">Tu te crées un profil, tu décris le genre de trucs que tu sais faire, et ensuite <\/span><mark>les autres utilisateurs peuvent te contacter s'ils ont besoin d'un de ces services.<\/mark>"}, {"id": "B:BP1094", "bid": "BCY032", "f": "<span class=\"glabel\" style=\"display:block\">That's how we'd organize it.<\/span>That's how we would organize trips like this.", "b": "Voilà comment on organiserait ce genre de voyages."}, {"id": "B:BP1092", "bid": "BCY032", "f": "<span class=\"glabel\" style=\"display:block\">That's how we'd organize it.<\/span>That would be our plan for showers and freshening up.", "b": "Ce serait ça, notre plan pour se doucher et se rafraîchir."}, {"id": "B:BP0789", "bid": "BCY033", "f": "<span class=\"glabel\" style=\"display:block\">This organization is organizing it.<\/span><span class=\"dim\">It’s for a garage sale in your neighborhood, and <\/span><mark>the town hall is organizing it.<\/mark>", "b": "<span class=\"dim\">En fait, c'est pour un vide-grenier dans ton quartier, et <\/span><mark>c'est la mairie qui l'organise.<\/mark>"}, {"id": "B:BP0303", "bid": "BCY033", "f": "<span class=\"glabel\" style=\"display:block\">This organization is organizing it.<\/span>So the ad is from this school.", "b": "Alors en fait, l'annonce, ça vient d'une école."}, {"id": "B:BP0060", "bid": "BCY034", "f": "<span class=\"glabel\" style=\"display:block\">It's happening at this place.<\/span><span class=\"dim\">Basically, they’re looking for dancers for a good cause, and <\/span><mark>it’s happening at the Kent Nagano Community Centre.<\/mark>", "b": "<span class=\"dim\">En gros, ils cherchent des danseurs pour une bonne cause, et <\/span><mark>ça se passe au centre communautaire Kent Nagano.<\/mark>"}, {"id": "B:BP0895", "bid": "BCY035", "f": "<span class=\"glabel\" style=\"display:block\">You'd be in a group of this size.<\/span><span class=\"dim\">The full stay is two weeks, and <\/span><mark>you’d be in a group of about 20 people.<\/mark>", "b": "<span class=\"dim\">Le séjour complet, c'est deux semaines, et <\/span><mark>tu serais dans un groupe d'une vingtaine de personnes.<\/mark>"}, {"id": "B:BP0191", "bid": "BCY035", "f": "<span class=\"glabel\" style=\"display:block\">You'd be in a group of this size.<\/span><mark>We'd have to do it as a team of five cyclists<\/mark><span class=\"dim\">, and I really want to take part.<\/span>", "b": "<mark>Il faudrait qu'on le fasse en équipe de cinq cyclistes<\/mark><span class=\"dim\">, et moi, j'ai vraiment envie d'y participer.<\/span>"}, {"id": "B:BP0189", "bid": "BCY036", "f": "<span class=\"glabel\" style=\"display:block\">It's 130 km a day for two days.<\/span><span class=\"dim\">It's a charity cycling event where we'd raise money for an environmental cause, and <\/span><mark>the challenge is 130 kilometers a day for two days.<\/mark>", "b": "<span class=\"dim\">En gros, c'est un événement caritatif à vélo, où on récolterait de l'argent pour une cause environnementale, et <\/span><mark>le défi, c'est 130 kilomètres par jour pendant deux jours.<\/mark>"}, {"id": "B:BP0894", "bid": "BCY037", "f": "<span class=\"glabel\" style=\"display:block\">The stay is two weeks.<\/span><mark>The full stay is two weeks<\/mark><span class=\"dim\">, and you’d be in a group of about 20 people.<\/span>", "b": "<mark>Le séjour complet, c'est deux semaines<\/mark><span class=\"dim\">, et tu serais dans un groupe d'une vingtaine de personnes.<\/span>"}, {"id": "B:BP0730", "bid": "BCY038", "f": "<span class=\"glabel\" style=\"display:block\">No screens for at least two days.<\/span>For at least two days, you wouldn't have access to screens or anything like that.", "b": "Pendant au moins deux jours, t'aurais pas accès aux écrans, ni à rien de tout ça."}, {"id": "B:BP1108", "bid": "BCY039", "f": "<span class=\"glabel\" style=\"display:block\">It'll probably cost about this much.<\/span><mark>It will probably be about $200 for a weekend<\/mark><span class=\"dim\">, and we don't have to do this every week.<\/span>", "b": "<mark>Ça doit tourner autour de 200 euros le week-end<\/mark><span class=\"dim\">, et puis on est pas obligés d'en faire un toutes les semaines.<\/span>"}]}, {"key": "B-BC3", "sec": "B", "code": "BC3", "name": "My situation", "bucket": "Context", "items": [{"id": "B:BP1192", "bid": "BCY040", "f": "<span class=\"glabel\" style=\"display:block\">I haven't been consistent with this either.<\/span>I have historically not been super consistent as well, with online courses.", "b": "Bon, moi non plus j'ai jamais été super régulier avec les cours en ligne, c'est vrai."}, {"id": "B:BP0195", "bid": "BCY041", "f": "<span class=\"glabel\" style=\"display:block\">We do this a lot but never toward a goal.<\/span><span class=\"dim\">I think it'd be such a fun thing for us to do because <\/span><mark>we already spend so much time cycling and training, but usually we're not training toward anything in particular.<\/mark>", "b": "<span class=\"dim\">Je trouve que ce serait vraiment sympa à faire ensemble, vu qu'<\/span><mark>on passe déjà un temps fou à rouler et à s'entraîner, sauf que d'habitude, on s'entraîne pour rien de particulier.<\/mark>"}, {"id": "B:BP0186", "bid": "BCY041", "f": "<span class=\"glabel\" style=\"display:block\">We do this a lot but never toward a goal.<\/span>You know, we've been cycling for a long time, but we've never really had anything specific to train for.", "b": "Tu sais, ça fait longtemps qu'on fait du vélo, mais on a jamais vraiment eu d'objectif précis pour s'entraîner."}, {"id": "B:BP1087", "bid": "BCY042", "f": "<span class=\"glabel\" style=\"display:block\">What stopped us before was something we didn't want to do.<\/span><span class=\"dim\">We've talked about how we wanted to travel further out into the countryside, so we can go stargazing and see the Milky Way, but <\/span><mark>what held us back all along was that we didn't want to live the camping lifestyle. That wasn't a compromise we were willing to make.<\/mark>", "b": "<span class=\"dim\">On en a déjà parlé, qu'on voulait voyager plus loin dans la campagne pour pouvoir observer les étoiles et voir la Voie lactée, mais <\/span><mark>ce qui nous a toujours freinés, c'est que la vie en mode camping, ça nous tentait pas. Ça, c'était pas un compromis qu'on était prêts à faire.<\/mark>"}, {"id": "B:BP1101", "bid": "BCY043", "f": "<span class=\"glabel\" style=\"display:block\">I really want to do more this summer.<\/span><span class=\"dim\">We haven't hung out in a bit, and <\/span><mark>I really want to do more this summer<\/mark><span class=\"dim\"> — I think this will be really fun for all our friends.<\/span>", "b": "<span class=\"dim\">En plus, ça fait un petit moment qu'on s'est pas vus, et <\/span><mark>j'ai vraiment envie qu'on fasse plus de trucs cet été<\/mark><span class=\"dim\"> — je pense que ça va être vraiment sympa pour tous nos potes.<\/span>"}, {"id": "B:BP0489", "bid": "BCY044", "f": "<span class=\"glabel\" style=\"display:block\">That's kind of my philosophy.<\/span>Yeah, that’s kind of my philosophy.", "b": "Ouais, c'est un peu ma philosophie, ça."}, {"id": "B:BP0814", "bid": "BCY045", "f": "<span class=\"glabel\" style=\"display:block\">I have some things to sell too.<\/span>Because I’ve got a few things I could sell, and you probably do too.", "b": "Parce que moi, j'ai deux-trois trucs que je pourrais vendre, et toi aussi sûrement."}, {"id": "B:BP0927", "bid": "BCY046", "f": "<span class=\"glabel\" style=\"display:block\">I've got it set up on my phone too.<\/span><mark>I’ve got everything set up on my phone too<\/mark><span class=\"dim\">, but you could also try one of those e-readers that are made specifically for reading on a screen.<\/span>", "b": "<mark>Moi, j'ai tout installé sur mon téléphone aussi<\/mark><span class=\"dim\">, mais sinon, tu pourrais essayer une de ces liseuses qui sont faites exprès pour lire sur écran.<\/span>"}, {"id": "B:BP1073", "bid": "BCY047", "f": "<span class=\"glabel\" style=\"display:block\">I know a few others who'd be up for this.<\/span>I think I know maybe four to five other people that will be down for this.", "b": "Je crois que je connais quatre ou cinq autres personnes qui seraient partantes."}, {"id": "B:BP1212", "bid": "BCY048", "f": "<span class=\"glabel\" style=\"display:block\">I might not buy it myself, since I have my own plan.<\/span><mark>I may not buy the package myself, because I already have my own training plans<\/mark><span class=\"dim\">, but I could be your accountability partner.<\/span>", "b": "<mark>Moi, je vais peut-être pas le prendre, le forfait, vu que j'ai déjà mes propres programmes d'entraînement<\/mark><span class=\"dim\">, mais je pourrais être ton binôme de motivation.<\/span>"}]}, {"key": "B-BC4", "sec": "B", "code": "BC4", "name": "Checking in & clarifying", "bucket": "Context", "items": [{"id": "B:BP0279", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>What do you think?", "b": "T'en penses quoi ?"}, {"id": "B:BP0306", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>So, yeah, what do you think?", "b": "Bon, du coup, t'en penses quoi ?"}, {"id": "B:BP0429", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>So, what do you think?", "b": "Alors, t'en penses quoi ?"}, {"id": "B:BP0465", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>What do you think?", "b": "T'en penses quoi ?"}, {"id": "B:BP0542", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>What do you think?", "b": "T'en penses quoi ?"}, {"id": "B:BP0614", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>What do you think?", "b": "T'en penses quoi ?"}, {"id": "B:BP0708", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>What do you think?", "b": "T'en penses quoi ?"}, {"id": "B:BP0859", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>So, what do you think?", "b": "Alors, t'en penses quoi ?"}, {"id": "B:BP0898", "bid": "BCY049", "f": "<span class=\"glabel\" style=\"display:block\">What do you think?<\/span>Yeah, so what do you think?", "b": "Ouais, alors, t'en penses quoi ?"}, {"id": "B:BP0717", "bid": "BCY050", "f": "<span class=\"glabel\" style=\"display:block\">You're saying that's a problem for you?<\/span>Your landlord doesn't allow pets?", "b": "Ton proprio accepte pas les animaux ?"}, {"id": "B:BP0380", "bid": "BCY050", "f": "<span class=\"glabel\" style=\"display:block\">You're saying that's a problem for you?<\/span>You’re allergic to cats?", "b": "T'es allergique aux chats ?"}, {"id": "B:BP0435", "bid": "BCY051", "f": "<span class=\"glabel\" style=\"display:block\">I'm not sure what you mean.<\/span>I’m not sure I understand what you mean.", "b": "Je vois pas trop ce que tu veux dire."}, {"id": "B:BP0656", "bid": "BCY051", "f": "<span class=\"glabel\" style=\"display:block\">I'm not sure what you mean.<\/span>Well, actually, I’m not totally sure what you mean.", "b": "Alors là, en fait, je suis pas sûr de bien voir ce que tu veux dire."}, {"id": "B:BP0766", "bid": "BCY051", "f": "<span class=\"glabel\" style=\"display:block\">I'm not sure what you mean.<\/span><mark>I’m not totally sure what you mean<\/mark><span class=\"dim\">, but I’m pretty sure they’d give us some kind of training before we actually jumped.<\/span>", "b": "<mark>Je vois pas trop ce que tu veux dire<\/mark><span class=\"dim\">, mais à mon avis, ils nous feraient sûrement une petite formation avant qu'on saute pour de vrai.<\/span>"}, {"id": "B:BP1038", "bid": "BCY052", "f": "<span class=\"glabel\" style=\"display:block\">It sounds like you don't think it's worth your time.<\/span>I'm reading your response as that you don't think this will be worth your time.", "b": "Ce que je comprends de ta réponse, c'est que pour toi, ça vaudra pas le coup d'y passer ton temps."}, {"id": "B:BP0047", "bid": "BCY053", "f": "<span class=\"glabel\" style=\"display:block\">Forget about that for a second.<\/span>But forget about the price for a second.", "b": "Mais oublie le prix deux secondes."}, {"id": "B:BP0051", "bid": "BCY053", "f": "<span class=\"glabel\" style=\"display:block\">Forget about that for a second.<\/span>Actually, forget Instagram and social media.", "b": "Non mais en fait, laisse tomber Instagram et les réseaux."}, {"id": "B:BP0526", "bid": "BCY054", "f": "<span class=\"glabel\" style=\"display:block\">That's a bonus, not the main reason.<\/span>Obviously, the discount is a nice little bonus, but that shouldn’t be the only reason you go.", "b": "Bon, évidemment, la réduc, c'est un petit bonus sympa, mais ça devrait pas être ta seule raison d'y aller."}, {"id": "B:BP0056", "bid": "BCY055", "f": "<span class=\"glabel\" style=\"display:block\">The real question is whether it's worth doing.<\/span>I think the real question is just whether we decide this is something worth doing.", "b": "<span class=\"dim\">Au final, <\/span><mark>je pense que la vraie question, c'est juste de savoir si on décide que ça vaut le coup de le faire ou pas.<\/mark>"}, {"id": "B:BP1131", "bid": "BCY056", "f": "<span class=\"glabel\" style=\"display:block\">There are two parts to this.<\/span>There are two parts of this.", "b": "En fait, y a deux choses là-dedans."}, {"id": "B:BP0971", "bid": "BCY057", "f": "<span class=\"glabel\" style=\"display:block\">Here's another way to see it.<\/span>But here's another angle.", "b": "Mais y a un autre angle, en fait."}, {"id": "B:BP0153", "bid": "BCY058", "f": "<span class=\"glabel\" style=\"display:block\">Actually, I take that back; I had another thought.<\/span>Actually, you know what? I take that back. I just had another thought.", "b": "En fait, tu sais quoi ? Je retire ce que j'ai dit. Je viens de penser à un truc."}, {"id": "B:BP0531", "bid": "BCY059", "f": "<span class=\"glabel\" style=\"display:block\">When you think about it, it makes sense.<\/span>When you think about it, it does make sense.", "b": "Et franchement, quand on y réfléchit, ça se tient."}]}, {"key": "B-BC5", "sec": "B", "code": "BC5", "name": "Acknowledging the objection", "bucket": "Context", "items": [{"id": "B:BP0012", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, okay, you have a point.", "b": "Ouais, bon, d'accord, t'as pas tort."}, {"id": "B:BP0029", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, okay, fair point.", "b": "Ouais, c'est vrai, t'as raison sur ce coup-là."}, {"id": "B:BP0063", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span><mark>Yeah, you’re right<\/mark><span class=\"dim\">, but you don’t have to do it alone.<\/span>", "b": "<mark>Ouais, t'as raison<\/mark><span class=\"dim\">, mais t'es pas obligé de le faire tout seul.<\/span>"}, {"id": "B:BP0369", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, you’ve got a point, and I get what you mean.", "b": "Ouais, t'as pas tort, je vois ce que tu veux dire."}, {"id": "B:BP0466", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, that’s fair. I see what you mean.", "b": "Ouais, c'est pas faux. Je vois ce que tu veux dire."}, {"id": "B:BP0492", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Yeah, that’s fair.", "b": "Ouais, je te l'accorde."}, {"id": "B:BP0830", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Oh yeah, that's fair. I get what you mean.", "b": "Ah ouais, ça se tient. Je vois ce que tu veux dire."}, {"id": "B:BP1148", "bid": "BCY060", "f": "<span class=\"glabel\" style=\"display:block\">Fair point, you're right.<\/span>Sure, that's true.", "b": "Ça, c'est vrai, je te l'accorde."}, {"id": "B:BP0086", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><mark>Yeah, I get what you mean<\/mark><span class=\"dim\">, but usually people need house-sitters because they’re going on vacation, so I don’t think you’d have the owners breathing down your neck the whole time.<\/span>", "b": "<mark>Ouais, je vois ce que tu veux dire<\/mark><span class=\"dim\">, mais en général, les gens ont besoin de quelqu'un pour garder leur maison parce qu'ils partent en vacances, du coup je pense pas que t'aurais les proprios sur le dos tout le temps.<\/span>"}, {"id": "B:BP0125", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><mark>Yeah, I get what you mean<\/mark><span class=\"dim\">, but I don't think you should look at it as some huge long-term commitment.<\/span>", "b": "<mark>Ouais, je vois ce que tu veux dire<\/mark><span class=\"dim\">, mais je pense pas que tu doives voir ça comme un énorme engagement sur le long terme.<\/span>"}, {"id": "B:BP0311", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><mark>Yeah, I get that<\/mark><span class=\"dim\">, but there are different kinds of jobs you could do.<\/span>", "b": "<mark>Ouais, ça je comprends<\/mark><span class=\"dim\">, mais y a plein de trucs différents à faire.<\/span>"}, {"id": "B:BP0374", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><mark>No, I get why you’d think that<\/mark><span class=\"dim\">, but the ad says you’re supposed to contact the shelter closest to where you live.<\/span>", "b": "<mark>Non mais je comprends pourquoi tu te dis ça<\/mark><span class=\"dim\">, sauf que dans l'annonce, ils disent qu'il faut contacter le refuge le plus près de chez toi.<\/span>"}, {"id": "B:BP0132", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><mark>Yeah, I know<\/mark><span class=\"dim\">, but don't be so pessimistic about it before you've even tried it.<\/span>", "b": "<mark>Ouais, je sais<\/mark><span class=\"dim\">, mais sois pas aussi pessimiste avant même d'avoir essayé.<\/span>"}, {"id": "B:BP0147", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><span class=\"dim\">And <\/span><mark>I get what you mean about having to wait for the plants to grow<\/mark><span class=\"dim\">, but I don’t really think that’s an obstacle.<\/span>", "b": "<span class=\"dim\">Et <\/span><mark>je vois ce que tu veux dire sur le fait de devoir attendre que les plantes poussent<\/mark><span class=\"dim\">, mais je trouve pas vraiment que ce soit un obstacle.<\/span>"}, {"id": "B:BP0936", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><span class=\"dim\">And yeah, <\/span><mark>I get what you mean about only being able to borrow a book for 21 days<\/mark><span class=\"dim\">, but I really don’t think that’s a big problem.<\/span>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>le coup du livre qu'on peut emprunter que 21 jours, je vois ce que tu veux dire<\/mark><span class=\"dim\">, mais je pense vraiment pas que ce soit un gros problème.<\/span>"}, {"id": "B:BP1216", "bid": "BCY061", "f": "<span class=\"glabel\" style=\"display:block\">I get what you mean.<\/span><mark>Yeah, I know, but<\/mark><span class=\"dim\"> I really do think you're responsible.<\/span>", "b": "<mark>Ouais, je sais, mais<\/mark><span class=\"dim\"> moi, je trouve vraiment que t'es quelqu'un de responsable.<\/span>"}, {"id": "B:BP1111", "bid": "BCY062", "f": "<span class=\"glabel\" style=\"display:block\">I hadn't thought of that until you said it.<\/span>That's the part I hadn't even thought about until you mentioned the price.", "b": "<span class=\"dim\">Et <\/span><mark>ça, justement, j'y avais même pas pensé avant que tu me parles du prix.<\/mark>"}, {"id": "B:BP0987", "bid": "BCY063", "f": "<span class=\"glabel\" style=\"display:block\">You're right, I feel the same way.<\/span>You're not wrong. I do feel the same way about online shopping.", "b": "T'as pas tort. Franchement, les achats en ligne, moi aussi ça me fait pareil."}, {"id": "B:BP1120", "bid": "BCY064", "f": "<span class=\"glabel\" style=\"display:block\">You gave that as an example.<\/span><mark>You give me snowboarding as an example<\/mark><span class=\"dim\"> — I used to be scared of snowboarding as well, and I actually tried it.<\/span>", "b": "<mark>Tu me cites le snowboard en exemple<\/mark><span class=\"dim\"> — mais moi aussi, avant, j'en avais peur, et j'ai quand même essayé.<\/span>"}, {"id": "B:BP0750", "bid": "BCY065", "f": "<span class=\"glabel\" style=\"display:block\">I know that's how you are.<\/span><mark>Yeah, I get that you're introverted<\/mark><span class=\"dim\">, but you shouldn't automatically let that decide how you live your life.<\/span>", "b": "<mark>Ouais, je comprends que tu sois introverti<\/mark><span class=\"dim\">, mais tu devrais pas laisser ça décider systématiquement de comment tu vis ta vie.<\/span>"}, {"id": "B:BP0387", "bid": "BCY065", "f": "<span class=\"glabel\" style=\"display:block\">I know that's how you are.<\/span><mark>Yeah, I know you told me you’re allergic to animals<\/mark><span class=\"dim\">, but that could still be an alternative.<\/span>", "b": "<mark>Ouais, je sais, tu m'as dit que t'étais allergique aux animaux<\/mark><span class=\"dim\">, mais ça pourrait quand même être une alternative.<\/span>"}, {"id": "B:BP0105", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><span class=\"dim\">Oh, yeah, <\/span><mark>I get what’s worrying you.<\/mark>", "b": "<span class=\"dim\">Ah ouais, <\/span><mark>je vois ce qui t'inquiète.<\/mark>"}, {"id": "B:BP0202", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><mark>I get why you're concerned about where the money goes<\/mark><span class=\"dim\">, though.<\/span>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>je comprends que tu te demandes où va l'argent.<\/mark>"}, {"id": "B:BP0252", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><span class=\"dim\">Yeah, <\/span><mark>I get why you might hesitate because of the price.<\/mark>", "b": "<span class=\"dim\">Ouais, <\/span><mark>je comprends que tu puisses hésiter à cause du prix.<\/mark>"}, {"id": "B:BP0548", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span>And I get why the crowds might worry you.", "b": "Et je comprends que la foule, ça puisse t'inquiéter."}, {"id": "B:BP0714", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><mark>And I get why you're worried about the cost<\/mark><span class=\"dim\">, but the ad says they provide the food, so that's one big expense you wouldn't have to worry about.<\/span>", "b": "<mark>Et je comprends que le coût t'inquiète<\/mark><span class=\"dim\">, mais d'après l'annonce, c'est eux qui fournissent la nourriture, du coup ça, c'est déjà une grosse dépense en moins à gérer.<\/span>"}, {"id": "B:BP0758", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><mark>And yeah, I completely get why you’re scared<\/mark><span class=\"dim\">, but that’s kind of exactly why I think we should do it.<\/span>", "b": "<mark>Et ouais, je comprends tout à fait que t'aies peur<\/mark><span class=\"dim\">, mais justement, c'est un peu pour ça que je me dis qu'on devrait le faire.<\/span>"}, {"id": "B:BP0806", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><mark>I get why you’re worried about having to deal with people and negotiate prices<\/mark><span class=\"dim\">, but I really think it’ll be pretty relaxed.<\/span>", "b": "<mark>Je comprends que ça t'inquiète de devoir gérer les gens et de négocier les prix<\/mark><span class=\"dim\">, mais franchement, je pense que ce sera plutôt tranquille.<\/span>"}, {"id": "B:BP0555", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span><mark>And yeah, I know you’re worried it might be really expensive<\/mark><span class=\"dim\">, but because they’re trying to raise awareness about the environment, I feel like they’d have an incentive to make the event accessible to more people.<\/span>", "b": "<mark>Et ouais, je sais que t'as peur que ce soit vraiment cher<\/mark><span class=\"dim\">, mais vu qu'ils cherchent à sensibiliser les gens à l'environnement, j'ai l'impression qu'ils auraient tout intérêt à rendre l'événement accessible au plus grand nombre.<\/span>"}, {"id": "B:BP1164", "bid": "BCY066", "f": "<span class=\"glabel\" style=\"display:block\">I get why that worries you.<\/span>That's inviting strangers to your own home, so I get your concern.", "b": "Inviter des inconnus chez toi, ouais, je comprends que ça t'inquiète."}, {"id": "B:BP0518", "bid": "BCY067", "f": "<span class=\"glabel\" style=\"display:block\">I know you're wondering about that.<\/span>Yeah, I know you’re wondering about allergies.", "b": "Ouais, je sais, tu te poses la question des allergies."}, {"id": "B:BP0693", "bid": "BCY067", "f": "<span class=\"glabel\" style=\"display:block\">I know you're wondering about that.<\/span><mark>I know you might also be wondering about the wolves themselves<\/mark><span class=\"dim\">, but from what I can tell, they’re kept in large outdoor areas where they have plenty of space to run around.<\/span>", "b": "<mark>Je sais que tu te poses peut-être aussi des questions sur les loups eux-mêmes<\/mark><span class=\"dim\">, mais d'après ce que j'ai compris, ils vivent dans de grands espaces en plein air où ils ont largement la place de courir.<\/span>"}, {"id": "B:BP0026", "bid": "BCY068", "f": "<span class=\"glabel\" style=\"display:block\">I know it costs money.<\/span><span class=\"dim\">And yeah, <\/span><mark>I know it costs money<\/mark><span class=\"dim\">, but you know my philosophy: we should die with zero dollars in our bank accounts.<\/span>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>je sais que ça coûte de l'argent<\/mark><span class=\"dim\">, mais tu connais ma philosophie : on devrait mourir avec zéro dollar sur nos comptes en banque.<\/span>"}, {"id": "B:BP0416", "bid": "BCY068", "f": "<span class=\"glabel\" style=\"display:block\">I know it costs money.<\/span>And yeah, I know it’s not free to sign up.", "b": "Et ouais, je sais que l'inscription est pas gratuite."}, {"id": "B:BP0067", "bid": "BCY068", "f": "<span class=\"glabel\" style=\"display:block\">I know it costs money.<\/span><mark>I don’t think transportation is free<\/mark><span class=\"dim\">, and no, you wouldn’t get paid for it.<\/span>", "b": "<span class=\"dim\">Alors <\/span><mark>le transport, je pense pas que ce soit gratuit<\/mark><span class=\"dim\">, et non, tu serais pas payé pour ça.<\/span>"}, {"id": "B:BP0038", "bid": "BCY069", "f": "<span class=\"glabel\" style=\"display:block\">I know it's not the cheapest option.<\/span><span class=\"dim\">And yeah, <\/span><mark>I know it’s not the cheapest thing you could do<\/mark><span class=\"dim\">, but we wouldn’t be paying full price for the service.<\/span>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>je sais que c'est pas ce qu'il y a de moins cher<\/mark><span class=\"dim\">, mais nous, on paierait pas plein tarif pour le service.<\/span>"}, {"id": "B:BP0862", "bid": "BCY069", "f": "<span class=\"glabel\" style=\"display:block\">I know it's not the cheapest option.<\/span><mark>Yeah, I know it probably wouldn’t be the cheapest trip we could take<\/mark><span class=\"dim\">, but I think it could be worth it.<\/span>", "b": "<mark>Ouais, je sais que ce serait sûrement pas le voyage le moins cher qu'on pourrait faire<\/mark><span class=\"dim\">, mais je pense que ça pourrait valoir le coup.<\/span>"}, {"id": "B:BP0040", "bid": "BCY070", "f": "<span class=\"glabel\" style=\"display:block\">I know the discount isn't huge.<\/span><mark>I know the discount isn’t huge<\/mark><span class=\"dim\">, but this is supposed to be a unique party, right?<\/span>", "b": "<mark>La réduc est pas énorme, je sais<\/mark><span class=\"dim\">, mais c'est censé être une soirée unique, non ?<\/span>"}, {"id": "B:BP0954", "bid": "BCY071", "f": "<span class=\"glabel\" style=\"display:block\">Obviously, it's not a lot of money.<\/span>Obviously it's not gonna be a lot of money.", "b": "Bon, évidemment, ça va pas te rapporter des fortunes."}, {"id": "B:BP0068", "bid": "BCY072", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you wouldn't get paid.<\/span><span class=\"dim\">I don’t think transportation is free, and <\/span><mark>no, you wouldn’t get paid for it.<\/mark>", "b": "<span class=\"dim\">Alors le transport, je pense pas que ce soit gratuit, et <\/span><mark>non, tu serais pas payé pour ça.<\/mark>"}, {"id": "B:BP0404", "bid": "BCY072", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you wouldn't get paid.<\/span>No, I don’t think they pay you.", "b": "Non, je pense pas qu'ils te paient."}, {"id": "B:BP0413", "bid": "BCY072", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you wouldn't get paid.<\/span><mark>So yeah, you wouldn’t be getting paid<\/mark><span class=\"dim\">, but you’d be doing something you already love and getting all these extra experiences out of it.<\/span>", "b": "<mark>Donc ouais, tu serais pas payé<\/mark><span class=\"dim\">, mais tu ferais un truc que t'adores déjà, et t'en tirerais toutes ces expériences en bonus.<\/span>"}, {"id": "B:BP0103", "bid": "BCY073", "f": "<span class=\"glabel\" style=\"display:block\">You need to be paid.<\/span>You need to be paid.", "b": "Faut que tu sois payé."}, {"id": "B:BP1053", "bid": "BCY074", "f": "<span class=\"glabel\" style=\"display:block\">At your job, you put up with discomfort because you're paid.<\/span>You are able to deal with these uncomfortable scenarios in your part-time job because you are doing it for money, and something's at stake.", "b": "Dans ton job à temps partiel, t'arrives à gérer ces situations inconfortables parce que tu le fais pour l'argent — y a un enjeu, quoi."}, {"id": "B:BP0190", "bid": "BCY075", "f": "<span class=\"glabel\" style=\"display:block\">I'm not saying it'll be easy.<\/span><span class=\"dim\">So yeah, <\/span><mark>I'm definitely not saying it's going to be easy.<\/mark>", "b": "<span class=\"dim\">Alors ouais, <\/span><mark>je dis pas du tout que ça va être facile.<\/mark>"}, {"id": "B:BP0626", "bid": "BCY076", "f": "<span class=\"glabel\" style=\"display:block\">Sure, it takes a bit of effort.<\/span><mark>Yeah, you're right, it does take a little preparation<\/mark><span class=\"dim\">, but that's normal.<\/span>", "b": "<mark>Ouais, t'as raison, ça demande un peu de préparation<\/mark><span class=\"dim\">, mais ça, c'est normal.<\/span>"}, {"id": "B:BP1000", "bid": "BCY076", "f": "<span class=\"glabel\" style=\"display:block\">Sure, it takes a bit of effort.<\/span>It does take a bit of self-control.", "b": "Alors oui, ça demande un peu de discipline."}, {"id": "B:BP0559", "bid": "BCY077", "f": "<span class=\"glabel\" style=\"display:block\">You're right, it could be tiring, not relaxing.<\/span><mark>You’re right that spending hours at a festival could get tiring<\/mark><span class=\"dim\">, but we wouldn’t have to listen to music the entire time.<\/span>", "b": "<mark>T'as raison, passer des heures dans un festival, ça peut être fatigant<\/mark><span class=\"dim\">, mais on serait pas obligés d'écouter de la musique tout le temps.<\/span>"}, {"id": "B:BP0902", "bid": "BCY077", "f": "<span class=\"glabel\" style=\"display:block\">You're right, it could be tiring, not relaxing.<\/span>I mean, okay, it probably wouldn’t be the most relaxing or chilled-out vacation ever.", "b": "Bon, c'est vrai, ce serait sûrement pas les vacances les plus reposantes ou les plus tranquilles du monde."}, {"id": "B:BP1049", "bid": "BCY078", "f": "<span class=\"glabel\" style=\"display:block\">It's uncomfortable, I know.<\/span>It's uncomfortable, right?", "b": "C'est pas confortable, hein ?"}, {"id": "B:BP1061", "bid": "BCY079", "f": "<span class=\"glabel\" style=\"display:block\">Yes, it's high pressure.<\/span><mark>It is high pressure<\/mark><span class=\"dim\">, but the stakes are not high enough.<\/span>", "b": "<mark>C'est vrai que c'est de la pression<\/mark><span class=\"dim\">, mais les enjeux, eux, sont pas si élevés que ça.<\/span>"}, {"id": "B:BP0680", "bid": "BCY080", "f": "<span class=\"glabel\" style=\"display:block\">I know it sounds risky.<\/span><mark>I know that sounds a little risky<\/mark><span class=\"dim\">, but that’s also kind of what makes it so interesting.<\/span>", "b": "<mark>Je sais que ça peut paraître un peu risqué<\/mark><span class=\"dim\">, mais en même temps, c'est un peu ça qui rend le truc aussi intéressant.<\/span>"}, {"id": "B:BP0764", "bid": "BCY080", "f": "<span class=\"glabel\" style=\"display:block\">I know it sounds risky.<\/span><mark>When you first hear about skydiving, it sounds super risky<\/mark><span class=\"dim\">, but if you actually look at the statistics, it’s less risky than a lot of things we do every day, like driving.<\/span>", "b": "<mark>La première fois que t'entends parler de saut en parachute, ça a l'air hyper risqué<\/mark><span class=\"dim\">, mais en fait, si tu regardes vraiment les statistiques, c'est moins risqué que plein de trucs qu'on fait tous les jours, comme conduire.<\/span>"}, {"id": "B:BP0762", "bid": "BCY081", "f": "<span class=\"glabel\" style=\"display:block\">Of course it would be scary for all of us.<\/span><mark>Obviously it would be scary for all of us<\/mark><span class=\"dim\">, but the people running it are professionals and they know what they’re doing.<\/span>", "b": "<mark>Après, évidemment, ça nous ferait tous flipper<\/mark><span class=\"dim\">, mais les gens qui organisent ça, c'est des pros, ils savent ce qu'ils font.<\/span>"}, {"id": "B:BP0513", "bid": "BCY082", "f": "<span class=\"glabel\" style=\"display:block\">I know it's unusual.<\/span><mark>I know it’s unusual<\/mark><span class=\"dim\">, but that’s exactly why we should try it.<\/span>", "b": "<mark>Je sais que c'est pas banal<\/mark><span class=\"dim\">, mais justement, c'est pour ça qu'on devrait essayer.<\/span>"}, {"id": "B:BP0712", "bid": "BCY082", "f": "<span class=\"glabel\" style=\"display:block\">I know it's unusual.<\/span>Yeah, you're not wrong, it would definitely be an unusual experience for you.", "b": "Ouais, t'as pas tort, ce serait clairement une expérience pas banale pour toi."}, {"id": "B:BP1022", "bid": "BCY083", "f": "<span class=\"glabel\" style=\"display:block\">Sure, you might embarrass yourself.<\/span>For this one, what could go wrong? You could embarrass yourself, sure.", "b": "Là, pour le coup, qu'est-ce qui pourrait mal tourner ? Bon, tu pourrais te ridiculiser, c'est vrai."}, {"id": "B:BP1077", "bid": "BCY084", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there might be some conflicts with people.<\/span><mark>Sure, there may be some small conflicts here and there<\/mark><span class=\"dim\">, but it's all banter, and it's all love at the end of the day.<\/span>", "b": "<mark>Alors oui, y a parfois des petites tensions par-ci par-là<\/mark><span class=\"dim\">, mais c'est que des vannes, et au bout du compte, c'est que de l'amour.<\/span>"}, {"id": "B:BP1048", "bid": "BCY084", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there might be some conflicts with people.<\/span><span class=\"dim\">We might have to organize activities ourselves. <\/span><mark>We might have to deal with people who do not necessarily like us.<\/mark>", "b": "<span class=\"dim\">Après, c'est vrai, il se peut qu'on doive organiser des activités nous-mêmes, <\/span><mark>il se peut aussi qu'on doive gérer des gens qui nous apprécient pas forcément.<\/mark>"}, {"id": "B:BP1047", "bid": "BCY085", "f": "<span class=\"glabel\" style=\"display:block\">We might have to organize things ourselves.<\/span><mark>We might have to organize activities ourselves.<\/mark><span class=\"dim\"> We might have to deal with people who do not necessarily like us.<\/span>", "b": "<span class=\"dim\">Après, c'est vrai, <\/span><mark>il se peut qu'on doive organiser des activités nous-mêmes<\/mark><span class=\"dim\">, il se peut aussi qu'on doive gérer des gens qui nous apprécient pas forcément.<\/span>"}, {"id": "B:BP0543", "bid": "BCY086", "f": "<span class=\"glabel\" style=\"display:block\">I know there would be a lot of people.<\/span><mark>Yeah, I know it’s a festival, so there’d probably be a lot of people<\/mark><span class=\"dim\">, but it’s not every day we do something like this.<\/span>", "b": "<mark>Ouais, je sais, c'est un festival, du coup y aurait sûrement pas mal de monde<\/mark><span class=\"dim\">, mais c'est pas tous les jours qu'on fait un truc comme ça.<\/span>"}, {"id": "B:BP0734", "bid": "BCY087", "f": "<span class=\"glabel\" style=\"display:block\">You're right, being unreachable could be a problem.<\/span>Yeah, you're right, being completely unreachable could be a problem.", "b": "Ouais, t'as raison, être complètement injoignable, ça pourrait poser problème."}, {"id": "B:BP0259", "bid": "BCY088", "f": "<span class=\"glabel\" style=\"display:block\">I know it's not in person.<\/span><span class=\"dim\">And yeah, <\/span><mark>I know it’s not in person<\/mark><span class=\"dim\">, but it sounds like it’s pretty close to having that kind of support.<\/span>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>je sais bien que c'est pas en face à face<\/mark><span class=\"dim\">, mais on dirait que ça se rapproche pas mal de ce genre d'accompagnement.<\/span>"}, {"id": "B:BP0352", "bid": "BCY089", "f": "<span class=\"glabel\" style=\"display:block\">I know it's not the greenest way to travel.<\/span><mark>Yeah, I know it's not the most eco-friendly way to travel<\/mark><span class=\"dim\">, but it's still clearly more eco-friendly than going everywhere by car or bus.<\/span>", "b": "<mark>Ouais, je sais que c'est pas la façon la plus écolo de voyager<\/mark><span class=\"dim\">, mais n'empêche, c'est clairement plus écolo que de tout faire en voiture ou en bus.<\/span>"}, {"id": "B:BP0572", "bid": "BCY090", "f": "<span class=\"glabel\" style=\"display:block\">I agree: polluting to get to a green event makes no sense.<\/span>And I agree with you that, for an ecological event, it wouldn’t make much sense for us to do something that’s bad for the planet just to get there.", "b": "Et je suis d'accord avec toi : pour un événement écolo, ce serait pas très logique de faire un truc mauvais pour la planète juste pour y aller."}, {"id": "B:BP0100", "bid": "BCY091", "f": "<span class=\"glabel\" style=\"display:block\">You're right, there are still things you need to know.<\/span>Yeah, you’re right, there are still things you need to know.", "b": "Ouais, t'as raison, y a encore des trucs qu'il faudrait que tu saches."}, {"id": "B:BP0445", "bid": "BCY092", "f": "<span class=\"glabel\" style=\"display:block\">You're right, you can't do everything yourself.<\/span>Yeah, you’re right, you obviously can’t do everything yourself.", "b": "Ouais, t'as raison, c'est sûr que tu peux pas tout faire toi-même."}, {"id": "B:BP0307", "bid": "BCY093", "f": "<span class=\"glabel\" style=\"display:block\">You're right, the ad asks for parent volunteers.<\/span><mark>I know, you’re right, it does say they’re looking for parent volunteers<\/mark><span class=\"dim\">, but for one thing, I don’t think that’s necessarily a requirement.<\/span>", "b": "<mark>Je sais, t'as raison, c'est marqué qu'ils cherchent des parents bénévoles<\/mark><span class=\"dim\">, mais déjà, je pense pas que ce soit forcément obligatoire.<\/span>"}, {"id": "B:BP0376", "bid": "BCY094", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are already lots of volunteers.<\/span><mark>Sure, there are already 2,000 volunteers overall<\/mark><span class=\"dim\">, but we have no idea how many people have signed up at the shelter near you.<\/span>", "b": "<mark>Alors oui, y a déjà 2 000 bénévoles en tout<\/mark><span class=\"dim\">, mais on sait pas du tout combien de gens se sont inscrits dans le refuge à côté de chez toi.<\/span>"}, {"id": "B:BP0467", "bid": "BCY095", "f": "<span class=\"glabel\" style=\"display:block\">It would be hard to give up the animal later.<\/span>It would be hard to part with a cat after having it for all those years.", "b": "Ce serait dur de se séparer d'un chat après avoir passé toutes ces années avec lui."}, {"id": "B:BP0478", "bid": "BCY096", "f": "<span class=\"glabel\" style=\"display:block\">Of course the animal needs its owner.<\/span><mark>I mean, obviously they need their owner<\/mark><span class=\"dim\">, but they’re also capable of managing on their own for quite a while, even for weeks, maybe longer.<\/span>", "b": "<mark>Enfin, évidemment qu'ils ont besoin de leur maître<\/mark><span class=\"dim\">, mais ils sont aussi capables de se débrouiller tout seuls pendant pas mal de temps — même des semaines, voire plus.<\/span>"}, {"id": "B:BP0980", "bid": "BCY097", "f": "<span class=\"glabel\" style=\"display:block\">You're right to be skeptical.<\/span><span class=\"dim\">But <\/span><mark>that's a good thing to be skeptical about.<\/mark>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>t'as raison d'être méfiant là-dessus.<\/mark>"}, {"id": "B:BP0947", "bid": "BCY098", "f": "<span class=\"glabel\" style=\"display:block\">Sure, they might be lying.<\/span><mark>Sure, I don't rule out the possibility that they're lying<\/mark><span class=\"dim\">, but I can send you the website link and you can do your own research.<\/span>", "b": "<mark>Bon, après, j'exclus pas qu'ils mentent, hein<\/mark><span class=\"dim\">, mais je peux t'envoyer le lien du site et tu fais tes recherches de ton côté.<\/span>"}, {"id": "B:BP0961", "bid": "BCY099", "f": "<span class=\"glabel\" style=\"display:block\">Sure, they'd know your opinions and preferences.<\/span>Sure, these companies know your opinions and what your preferences are.", "b": "Alors oui, ces boîtes connaissent tes opinions et tes préférences."}, {"id": "B:BP1134", "bid": "BCY100", "f": "<span class=\"glabel\" style=\"display:block\">I don't think that method works.<\/span><span class=\"dim\">And it doesn't have to be brochures — <\/span><mark>I don't think handing out brochures is effective.<\/mark>", "b": "<span class=\"dim\">Et puis c'est pas obligé que ce soit des brochures — <\/span><mark>distribuer des brochures, je trouve pas ça efficace.<\/mark>"}, {"id": "B:BP1112", "bid": "BCY101", "f": "<span class=\"glabel\" style=\"display:block\">When you suggest something in the group chat, no one answers.<\/span>I've had experiences with this where you suggest something in the group chat and no one answers.", "b": "Ça, je l'ai déjà vécu : tu proposes un truc sur le groupe, et personne répond."}, {"id": "B:BP0496", "bid": "BCY102", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are other options.<\/span><mark>And sure, one option is therapy<\/mark><span class=\"dim\">, but therapy can be really expensive.<\/span>", "b": "<mark>Et c'est sûr, y a l'option de la thérapie<\/mark><span class=\"dim\">, mais une thérapie, ça peut coûter super cher.<\/span>"}, {"id": "B:BP0356", "bid": "BCY102", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are other options.<\/span><mark>And sure, we could use trams and buses<\/mark><span class=\"dim\">, but that's what all the tourists do.<\/span>", "b": "<mark>Et d'accord, on pourrait prendre les trams et les bus<\/mark><span class=\"dim\">, mais ça, c'est ce que font tous les touristes.<\/span>"}, {"id": "B:BP1104", "bid": "BCY102", "f": "<span class=\"glabel\" style=\"display:block\">Sure, there are other options.<\/span><mark>Sure, we can budget every penny<\/mark><span class=\"dim\">, but we're only 21 once, and we only have 10 summers in our 20s.<\/span>", "b": "<mark>Alors oui, on peut compter chaque centime<\/mark><span class=\"dim\">, mais on a 21 ans qu'une fois, et des étés entre 20 et 30 ans, on en a que dix.<\/span>"}, {"id": "B:BP1045", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span><mark>As a regular thing over months, sure, we can debate whether it's worth our time<\/mark><span class=\"dim\">, but for one afternoon, it's definitely worth our time.<\/span>", "b": "<mark>Alors oui, si c'était un truc régulier sur plusieurs mois, on pourrait débattre de savoir si ça vaut le coup d'y passer notre temps<\/mark><span class=\"dim\"> ; mais pour un après-midi, honnêtement, ça vaut carrément le coup.<\/span>"}, {"id": "B:BP0319", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span>If it were just a one-day event, then yeah, the connections you make might not be that strong because you’d only see those people once.", "b": "Si c'était juste sur une journée, là oui, les liens que tu crées seraient peut-être pas si forts que ça, parce que tu verrais ces gens qu'une seule fois."}, {"id": "B:BP1009", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span>If this were something serious, and you were gonna perform against a completely cold audience who paid a lot of dollars for the tickets, sure, there's more at stake and there's more chances that they will do something bad.", "b": "Si c'était un truc sérieux, où tu devais jouer devant un public complètement froid qui a payé sa place une fortune, là d'accord, y aurait plus d'enjeu et plus de risques qu'ils réagissent mal."}, {"id": "B:BP0985", "bid": "BCY103", "f": "<span class=\"glabel\" style=\"display:block\">In a different situation, sure, you'd be right.<\/span><mark>On something like Facebook Marketplace or Craigslist that probably would be the case<\/mark><span class=\"dim\">, but I don't think many people know about this website yet, so I don't think these deals go away that fast.<\/span>", "b": "<mark>Sur un truc comme Facebook Marketplace ou Craigslist, ce serait sûrement le cas<\/mark><span class=\"dim\">, mais je pense pas que beaucoup de gens le connaissent déjà, ce site, du coup à mon avis les bonnes affaires partent pas si vite que ça.<\/span>"}, {"id": "B:BP0280", "bid": "BCY104", "f": "<span class=\"g  <span class=\"del\" id=\"delcard\" title=\"Delete this card from EVERY study deck (d)\">delete<\/span>\n    <span class=\"rst\" id=\"reset\" title=\"Reset progress and reshuffle this deck\">reset<\/span>\n    <span class=\"rso\" id=\"reset-ordered\" title=\"Reset progress and restore the original card order\">reset in order<\/span>\n  <\/span>\n<\/div>\n<div id=\"app\"><\/div>\n<div id=\"delnote\" class=\"delnote hidden\"><\/div>\n<div id=\"blackout\" class=\"hidden\"><\/div>\n<script type=\"application/json\" id=\"deck-meta\">__DECK_META__<\/script>\n<script type=\"application/json\" id=\"deck-data\">__DECK_DATA__<\/script>\n<script>\n(function () {\n  \"use strict\";\n  // Progress is GLOBAL across every study deck: the same card appears in its\n  // prompt deck, its day deck, its section deck and the master deck, and\n  // answering it in any of them must count in all of them.  Card ids are\n  // unique across the whole corpus, so one shared { cardId: entry } map under\n  // STORAGE_KEY is the whole mechanism.  What is per-deck is the VIEW: which\n  // scope you're in, the shuffle, and the round counter, namespaced by\n  // VIEW_NS so decks don't stomp each other over the shared file:// origin.\n  var STORAGE_KEY = \"__STORAGE_KEY__\";\n  var VIEW_NS = \"__VIEW_NS__\";\n  var DELETED_KEY = \"study::studyor::deleted\";\n\n  // ---- Scope ---------------------------------------------------------------\n  // Cards come in two kinds and they are not equally urgent: `wrong` (red) are\n  // the actual errors that pull the language criteria down; `idiomatic`\n  // (amber) are the Parisian rewrites. Drilling both together buries the\n  // errors, so the deck opens on FIX -- every card carrying a red span -- and\n  // the amber-only cards are a separate rotation.\n  //\n  // A card's kind is the max of its spans (wrong > idiomatic), so \"carries\n  // any red span\" is exactly `k === \"wrong\"`. A mixed card therefore lands in\n  // FIX, which is right: you cannot drill its red span without saying the\n  // whole sentence.\n  //\n  // Progress lives under STORAGE_KEY and is keyed on the CARD ID, so it is\n  // deliberately SHARED across scopes -- a card you finish under \"fix\" is\n  // still finished when you switch to \"all\". Only the shuffle and the round\n  // counter are per-scope.\n  var SCOPE_KEY = VIEW_NS + \"::scope\";\n  var SCOPES = { fix: 1, polish: 1, all: 1 };\n\n  function loadScope() {\n    try {\n      var v = localStorage.getItem(SCOPE_KEY);\n      if (v && SCOPES[v]) return v;\n    } catch (e) {}\n    return \"fix\";\n  }\n\n  var scope = loadScope();\n  var ROUND_KEY = VIEW_NS + \"::round::\" + scope;\n  var ORDER_KEY = VIEW_NS + \"::order::\" + scope;\n  var REPEAT_MS = 10 * 60 * 1000;\n  var SOON_MS = 3 * 60 * 1000;\n  var TIMER_MS = 60 * 1000;\n  // ns decks: a card carries `t` (seconds) = 30 s per item on it.\n  function cardMs(i) { var t = cards[i] && cards[i].t; return (typeof t === 'number' && t > 0) ? t * 1000 : TIMER_MS; }\n\n  // ---- Deleted cards -------------------------------------------------------\n  // The one addition over the drill_or engine: \"d\" (or Delete/Backspace, or\n  // the header control) permanently removes the current card from EVERY study\n  // deck.  The deleted set is a global list of card ids under DELETED_KEY --\n  // the card stays in every deck's authored data, so restoring is just\n  // removing the id from the set.  Deleted cards are invisible to the\n  // rotation: pickCard, the status counts, round revival and the scope\n  // counters all skip them.\n  function loadDeleted() {\n    try {\n      var v = JSON.parse(localStorage.getItem(DELETED_KEY));\n      if (Array.isArray(v)) return v.filter(function (x) { return typeof x === \"string\"; });\n    } catch (e) {}\n    return [];\n  }\n  function saveDeleted() {\n    try { localStorage.setItem(DELETED_KEY, JSON.stringify(deletedList())); } catch (e) {}\n  }\n  var deleted = {};\n  loadDeleted().forEach(function (id) { deleted[id] = 1; });\n  function deletedList() {\n    var out = [];\n    for (var id in deleted) {\n      if (Object.prototype.hasOwnProperty.call(deleted, id)) out.push(id);\n    }\n    return out;\n  }\n  function isDeleted(i) { return !!deleted[cards[i].id]; }\n\n  // ORIGINAL_CARDS holds the deck in its authored order and is never mutated.\n  // `cards` is a working copy whose order can be reshuffled on reset; `order`\n  // is the persisted permutation (indices into ORIGINAL_CARDS) mapping the\n  // authored order onto the current one.  The whole engine relies on the\n  // invariant that state[i] corresponds to cards[i] positionally, so a\n  // reshuffle just rebuilds `cards` from `order` and starts from fresh state.\n  // Deleted cards are kept IN the arrays (so the persisted permutation stays\n  // valid) and skipped everywhere by isDeleted().\n  var ALL_CARDS = JSON.parse(document.getElementById(\"deck-data\").textContent);\n\n  // ns decks: user edits override the built front/back, keyed on card id.\n  var EDITS_KEY = \"study::studyor::ns::edits\";\n  function loadEdits() { try { var v = JSON.parse(localStorage.getItem(EDITS_KEY)); if (v && typeof v === \"object\") return v; } catch (e) {} return {}; }\n  (function () { var ed = loadEdits(); ALL_CARDS.forEach(function (c) {\n    c.f0 = c.f; c.b0 = c.b; var o = ed[c.id];\n    if (o) { if (typeof o.f === \"string\") c.f = o.f; if (typeof o.b === \"string\") c.b = o.b; }\n  }); })();\n\n  function inScope(c, s) {\n    if (s === \"all\") return true;\n    if (s === \"polish\") return c.k !== \"wrong\";\n    return c.k === \"wrong\";            // \"fix\": any red span\n  }\n\n  // A deck built before the scope filter existed has no `k` on its cards.\n  // Rather than silently drop every card, fall back to showing all of them\n  // and hide the control -- an empty deck reads as data loss, and the fix is\n  // just to re-run build_deck.py.\n  var HAS_KIND = ALL_CARDS.length > 0 && typeof ALL_CARDS[0].k === \"string\"
