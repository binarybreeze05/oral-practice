function isCustom(k) { return !CL[k]; }
function defaults(k) { var c = CL[k]; return {name: c.name, rows: c.items.map(function (it) { return {id: it.id, f: it.f, b: it.b, bid: it.bid}; })}; }
function deck() { var k = S.active; if (!k) return null; if (!S.decks[k]) { if (isCustom(k)) return null; S.decks[k] = defaults(k); } return S.decks[k]; }
function newBlank(name) { var k = "U-" + uid(); S.decks[k] = {name: name || "", rows: []}; S.active = k; saveNow(); return S.decks[k]; }

// ---------- small UI helpers ----------
var tt, undoFn = null;
function toast(m, undo) { var t = $("#toast"); t.innerHTML = esc(m) + (undo ? '<button id="undo">Undo</button>' : ""); undoFn = undo || null; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); undoFn = null; }, undo ? 6000 : 3500); }
$("#toast").addEventListener("click", function (e) { if (e.target.id === "undo" && undoFn) { undoFn(); undoFn = null; $("#toast").classList.remove("on"); } });
function ask(text, ok) {
  return new Promise(function (res) {
    $("#modal-text").textContent = text; $("#modal-yes").textContent = ok || "OK"; $("#modal").hidden = false; $("#modal-yes").focus();
    function done(v) { $("#modal").hidden = true; $("#modal-yes").onclick = $("#modal-no").onclick = null; res(v); }
    $("#modal-yes").onclick = function () { done(true); }; $("#modal-no").onclick = function () { done(false); };
  });
}
function show(view) {
  $("#view-decks").hidden = view !== "decks"; $("#view-build").hidden = view !== "build";
  $("#tab-decks").setAttribute("aria-pressed", view === "decks"); $("#tab-build").setAttribute("aria-pressed", view === "build");
  lsSet(VIEW_KEY, view);
  if (view === "decks") loadDecks(); else renderBuild();
}
$("#tab-decks").addEventListener("click", function () { saveNow(); show("decks"); });
$("#tab-build").addEventListener("click", function () { show("build"); });

// ---------- the store: exported decks in localStorage, next to drafts and progress ----------
var DECKS_KEY = "tef-decks::exported::v1";
var SERVER = (function () { try { var v = JSON.parse(lsGet(DECKS_KEY)); if (v && typeof v === "object") return v; } catch (e) {} return {}; })();
function saveDecks() { try { localStorage.setItem(DECKS_KEY, JSON.stringify(SERVER)); return true; } catch (e) { return false; } }
if (newFronts(SERVER)) saveDecks();
function progressOf(key, rows) {
  var st = {}; try { st = JSON.parse(lsGet(PROGRESS_KEY)) || {}; } catch (e) {}
  var done = 0, seen = 0;
  rows.forEach(function (r) { var e = st["ub::" + key + "::" + r.id]; if (!e || (e.p === "new" && !e.c)) return; seen++; if (e.p === "done") done++; });
  return seen ? done + " done · " + (seen - done) + " in play" : "not started";
}
function loadDecks() { renderDecks(); }

// ---------- backup / restore: a .json file, made and read on this computer ----------
$("#backup").addEventListener("click", function () {
  saveNow();
  var all = {}; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); all[k] = localStorage.getItem(k); } } catch (e) {}
  var blob = new Blob([JSON.stringify({app: "tef-decks", v: 1, saved: new Date().toISOString(), ls: all})], {type: "application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "tef-decks-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  toast("Backup downloaded");
});
$("#restore").addEventListener("click", function () { $("#restore-file").value = ""; $("#restore-file").click(); });
$("#restore-file").addEventListener("change", function (e) {
  var f = e.target.files[0]; if (!f) return;
  f.text().then(async function (txt) {
    var b; try { b = JSON.parse(txt); } catch (err) { toast("That file isn't a deck backup"); return; }
    if (!b || b.app !== "tef-decks" || !b.ls) { toast("That file isn't a deck backup"); return; }
    if (!(await ask("Restore this backup from " + String(b.saved || "").slice(0, 10) + "? Decks, drafts and progress in this browser are replaced by the backup's.", "Restore"))) return;
    try { Object.keys(b.ls).forEach(function (k) { localStorage.setItem(k, b.ls[k]); }); } catch (err) { toast("Couldn't restore: browser storage is full"); return; }
    location.reload();
  });
});
function renderDecks() {
  var keys = Object.keys(SERVER || {});
  $("#decks-sub").textContent = keys.length ? keys.length + (keys.length === 1 ? " deck" : " decks") + " · click Study to start" : "";
  if (!keys.length) { $("#decks").innerHTML = '<div class="empty">No decks yet. Open <b>Build</b>, make a deck (from a cluster or blank) and click <b>Export deck</b>.</div>'; return; }
  var groups = ["My decks", "Section A", "Section B"];
  keys.forEach(function (k) { var g = SERVER[k].group || "My decks"; if (groups.indexOf(g) < 0) groups.push(g); });
  $("#decks").innerHTML = groups.map(function (g) {
    var ks = keys.filter(function (k) { return (SERVER[k].group || "My decks") === g; }).sort(function (a, b) { return String(SERVER[a].name).localeCompare(String(SERVER[b].name)); });
    if (!ks.length) return "";
    return '<h2 class="' + (g === "Section B" ? "B" : "") + '">' + esc(g) + "</h2>" + ks.map(function (k) {
      var d = SERVER[k], n = (d.rows || []).length;
      return '<div class="deck" data-key="' + esc(k) + '"><span class="nm">' + esc(d.name || "Untitled deck") + '</span><span class="meta">' + n + (n === 1 ? " card" : " cards") + ' · <span class="pg">' + progressOf(k, d.rows || []) + '</span></span><span class="acts"><button class="btn primary" data-act="study">Study</button><button class="btn" data-act="edit">Edit</button><button class="btn danger" data-act="del">Delete</button></span></div>';
    }).join("");
  }).join("");
}
$("#decks").addEventListener("click", async function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var key = b.closest(".deck").dataset.key, d = SERVER[key]; if (!d) return;
  if (b.dataset.act === "study") { study(key, d); return; }
  if (b.dataset.act === "edit") {
    var local = S.decks[key];
    if (local && JSON.stringify(local.rows) !== JSON.stringify(d.rows) && !(await ask("This device has its own draft of “" + (d.name || "this deck") + "”. Replace it with the exported version?", "Replace draft"))) { S.active = key; saveNow(); show("build"); return; }
    S.decks[key] = {name: d.name || "", rows: (d.rows || []).map(function (r) { return {id: r.id, f: r.f, b: r.b, bid: r.bid || null}; })};
    S.active = key; saveNow(); show("build"); return;
  }
  if (b.dataset.act === "del") {
    if (!(await ask("Delete “" + (d.name || "this deck") + "” from My decks? Drafts in Build stay.", "Delete"))) return;
    delete SERVER[key]; saveDecks(); renderDecks();
    toast("Deleted from My decks", function () { SERVER[key] = d; saveDecks(); renderDecks(); });
  }
});

// ---------- study: the same deck template, rendered into this frame ----------
function buildPage(key, name, rows, forStudy) {
  rows = rows.filter(function (r) { return strip(r.f) || strip(r.b); });
  var data = rows.map(function (r) {
    return {id: "ub::" + key + "::" + r.id, f: '<div class="one"><span class="en" style="white-space:pre-wrap">' + r.f + "</span></div>",
            b: '<div class="one fr"><span class="frx" style="white-space:pre-wrap">' + r.b + "</span></div>", t: 30};
  });
  var meta = {deck_id: "ub-" + key, title: name, subtitle: rows.length + " cards", counts: {total: rows.length}};
  var page = TPL.split("__TITLE__").join(esc(name)).replace("__STORAGE_KEY__", PROGRESS_KEY)
    .replace("__VIEW_NS__", "study::studyor::ns::custom::view::" + key)
    .replace("__DECK_META__", JSON.stringify(meta).replace(/<\//g, "<\\/"))
    .replace("__DECK_DATA__", JSON.stringify(data).replace(/<\//g, "<\\/"));
  return {n: rows.length, html: page};
}
function strip(h) { var t = document.createElement("div"); t.innerHTML = h || ""; return t.textContent.trim(); }
function study(key, d) {
  saveNow(); lsSet(VIEW_KEY, "decks");
  var p = buildPage(key, d.name || "Untitled deck", d.rows || [], true);
  // "decks" in the deck's header comes back to this page
  p.html = p.html.replace("</body>", '<script>(function(){var h=document.getElementById("ub-home");if(h)h.addEventListener("click",function(e){e.preventDefault();location.reload();});})();<\/script></body>');
  document.open(); document.write(p.html); document.close();
}

// ---------- builder ----------
function rowHTML(r, i, prev) {
  return '<div class="row' + (prev && prev.bid && r.bid && prev.bid !== r.bid ? " newbox" : "") + '" data-id="' + esc(r.id) + '">' +
    '<div class="gut"><span>' + (i + 1) + '</span><span class="tl"><button data-act="up" title="Move up" aria-label="Move up">↑</button><button data-act="down" title="Move down" aria-label="Move down">↓</button><button data-act="ins" title="Add a card below" aria-label="Add a card below">＋</button><button class="del" data-act="del" title="Delete card" aria-label="Delete card">✕</button></span></div>' +
    '<div class="cell front" contenteditable="true" data-side="f" data-ph="Front">' + r.f + '</div>' +
    '<div class="cell back" contenteditable="true" data-side="b" data-ph="Back">' + r.b + "</div></div>";
}
function renderBuild() {
  var d = deck();
  $("#reset").disabled = !d; $("#reset").textContent = d && isCustom(S.active) ? "Delete draft" : "Reset";
  if (!d) {
    $("#dname").value = ""; $("#count").textContent = "";
    $("#rows").innerHTML = '<div class="hint">Type a deck name above and click <b>+ Add card</b> for a blank deck,<br>or open <b>☰ Clusters</b> and pick one to start from its cards.</div>';
    return;
  }
  $("#dname").value = d.name;
  $("#rows").innerHTML = d.rows.map(function (r, i) { return rowHTML(r, i, d.rows[i - 1]); }).join("") + '<div class="addrow"><button class="btn" id="add2">+ Add card</button></div>';
  count();
}
function count() { var d = deck(); $("#count").textContent = d ? d.rows.length + (d.rows.length === 1 ? " card" : " cards") : ""; }
function renderDrawer() {
  var h = "<h3>My decks</h3>";
  Object.keys(S.decks).filter(isCustom).forEach(function (k) { var d = S.decks[k]; h += '<button class="cl' + (S.active === k ? " on" : "") + '" data-key="' + k + '"><span class="ed"></span><span class="nm">' + esc(d.name || "Untitled deck") + '</span><span class="bk">blank</span><span class="n">' + d.rows.length + "</span></button>"; });
  h += '<button class="cl" data-new="1"><span class="ed"></span><span class="nm" style="color:var(--acc)">+ New blank deck</span></button>';
  ["A", "B"].forEach(function (s) {
    h += '<h3 class="' + s + '">Section ' + s + "</h3>";
    DATA.clusters.filter(function (c) { return c.sec === s; }).forEach(function (c) {
      h += '<button class="cl' + (S.active === c.key ? " on" : "") + '" data-key="' + c.key + '"><span class="ed' + (S.decks[c.key] ? " on" : "") + '"></span><span class="nm">' + esc(c.name) + '</span><span class="bk">' + esc(c.bucket) + '</span><span class="n">' + c.items.length + "</span></button>";
    });
  });
  $("#drawer").innerHTML = h;
}
function drawer(on) { if (on) renderDrawer(); $("#drawer").hidden = !on; $("#scrim").hidden = !on; }
$("#clusters").addEventListener("click", function () { drawer($("#drawer").hidden); });
$("#scrim").addEventListener("click", function () { drawer(false); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { drawer(false); if (!$("#modal").hidden) $("#modal-no").click(); } });
$("#drawer").addEventListener("click", function (e) {
  var b = e.target.closest(".cl"); if (!b) return;
  if (b.dataset.new) { newBlank(""); drawer(false); renderBuild(); $("#dname").focus(); return; }
  S.active = b.dataset.key; deck(); saveNow(); drawer(false); renderBuild(); window.scrollTo(0, 0);
});
function rowOf(el) { var d = deck(); var id = el.closest(".row").dataset.id; return {d: d, k: d.rows.findIndex(function (r) { return r.id === id; })}; }
$("#rows").addEventListener("input", function (e) { var c = e.target.closest(".cell"); if (!c) return; var x = rowOf(c); x.d.rows[x.k][c.dataset.side] = c.innerHTML === "<br>" ? "" : c.innerHTML; save(); });
$("#rows").addEventListener("paste", function (e) { if (!e.target.closest(".cell")) return; e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain")); });
function insertAfter(k) {
  var d = deck(); var r = {id: "n" + uid(), f: "", b: "", bid: null}; d.rows.splice(k + 1, 0, r); saveNow(); renderBuild();
  var el = document.querySelector('.row[data-id="' + r.id + '"] .front'); if (el) { el.focus(); el.scrollIntoView({block: "center"}); }
}
$("#rows").addEventListener("keydown", function (e) { var c = e.target.closest(".cell"); if (c && (e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); insertAfter(rowOf(c).k); } });
$("#rows").addEventListener("click", function (e) {
  if (e.target.id === "add2") { insertAfter(deck().rows.length - 1); return; }
  var b = e.target.closest("[data-act]"); if (!b) return;
  var x = rowOf(b), d = x.d, k = x.k, id = d.rows[k].id;
  if (b.dataset.act === "del") { var gone = d.rows.splice(k, 1)[0]; saveNow(); renderBuild(); toast("Card deleted", function () { d.rows.splice(k, 0, gone); saveNow(); renderBuild(); }); return; }
  if (b.dataset.act === "ins") { insertAfter(k); return; }
  var j = k + (b.dataset.act === "up" ? -1 : 1); if (j < 0 || j >= d.rows.length) return;
  d.rows.splice(j, 0, d.rows.splice(k, 1)[0]); saveNow(); renderBuild();
  var nb = document.querySelector('.row[data-id="' + id + '"] [data-act="' + b.dataset.act + '"]'); if (nb) nb.focus();
});
$("#dname").addEventListener("input", function (e) { var d = deck(); if (!d) d = newBlank(e.target.value); d.name = e.target.value; save(); });
$("#add").addEventListener("click", function () { var d = deck(); if (!d) { d = newBlank($("#dname").value.trim()); renderBuild(); } insertAfter(d.rows.length - 1); });
$("#reset").addEventListener("click", async function () {
  var d = deck(); if (!d) return; var k = S.active, old = JSON.stringify(d);
  if (isCustom(k)) {
    if (!(await ask("Delete this draft from this device? An exported copy in My decks stays.", "Delete draft"))) return;
    delete S.decks[k]; S.active = null; saveNow(); renderBuild();
    toast("Draft deleted", function () { S.decks[k] = JSON.parse(old); S.active = k; saveNow(); renderBuild(); }); return;
  }
  if (!(await ask("Put “" + CL[k].name + "” back to its default cards? Your edits on this device are discarded.", "Reset"))) return;
  S.decks[k] = defaults(k); saveNow(); renderBuild();
  toast("Reset to default", function () { S.decks[k] = JSON.parse(old); saveNow(); renderBuild(); });
});
$("#export").addEventListener("click", async function () {
  var d = deck(); if (!d) { toast("Type a deck name and add a card first, or pick a cluster"); return; }
  var key = S.active, name = (d.name || "").trim() || (CL[key] ? CL[key].name : "Untitled deck");
  var rows = d.rows.filter(function (r) { return strip(r.f) || strip(r.b); }).map(function (r) { return {id: r.id, f: r.f, b: r.b, bid: r.bid || null}; });
  if (!rows.length) { toast("This deck has no cards yet"); return; }
  var prev = SERVER[key];
  SERVER[key] = {name: name, group: CL[key] ? "Section " + CL[key].sec : "My decks", rows: rows, exported: new Date().toISOString()};
  if (!saveDecks()) { if (prev) SERVER[key] = prev; else delete SERVER[key]; toast("Browser storage is full. Delete a deck in My decks first."); return; }
  $("#status").textContent = "Exported “" + name + "” · " + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  toast("Exported “" + name + "” (" + rows.length + " cards) to My decks");
});

window.TEFDecks = {state: function () { return S; }, page: buildPage};   // for checks from the console
var v = lsGet(VIEW_KEY);
show(v === "build" ? "build" : "decks");
})();
</script>
</body>
