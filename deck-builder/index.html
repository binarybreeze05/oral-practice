yself that it could be a super occasion, and some very good holidays for us.", "b": "Moi, je me dis que ça pourrait être une super occasion, et de très bonnes vacances pour nous."}, {"id": "B:BP0795", "bid": "BAY055", "f": "<span class=\"glabel\" style=\"display:block\">It's a nice thing to do on your day off.<\/span>In truth, it looks like being a nice thing to do during your rest day.", "b": "En vrai, ça a l'air d'être un truc sympa à faire pendant ton jour de repos."}, {"id": "B:BP0124", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span><span class=\"dim\">And <\/span><mark>seeing how they present the thing, the ambiance has the air super relaxed and nice.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>vu comment ils présentent le truc, l'ambiance a l'air super détendue et sympa.<\/mark>"}, {"id": "B:BP0794", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span><span class=\"dim\">We would chat with the neighbours, the friends, and <\/span><mark>the ambiance looks rather relaxed.<\/mark>", "b": "<span class=\"dim\">On discuterait avec les voisins, les amis, et <\/span><mark>l'ambiance a l'air plutôt détendue.<\/mark>"}, {"id": "B:BP0241", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span>And frankly, all that looks rather tranquil.", "b": "Et franchement, tout ça a l'air plutôt tranquille."}, {"id": "B:BP0807", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span><span class=\"dim\">I understand that it worries you to have to manage the people and to negotiate the prices, but <\/span><mark>frankly, I think that it will be rather calm.<\/mark>", "b": "<span class=\"dim\">Je comprends que ça t'inquiète de devoir gérer les gens et de négocier les prix, mais <\/span><mark>franchement, je pense que ce sera plutôt tranquille.<\/mark>"}, {"id": "B:BP0808", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span>I don't think that people are hyper full-on about the haggling.", "b": "Je pense pas que les gens soient hyper à fond sur le marchandage."}, {"id": "B:BP0011", "bid": "BAY057", "f": "<span class=\"glabel\" style=\"display:block\">You can hang out and relax.<\/span>You hang around, you make a fire, you take your time, you relax yourself, all that, what.", "b": "Tu traînes, tu fais un feu, tu prends ton temps, tu te détends, tout ça, quoi."}, {"id": "B:BP0003", "bid": "BAY058", "f": "<span class=\"glabel\" style=\"display:block\">You'd be out in beautiful nature.<\/span><span class=\"dim\">Frankly, that has the air really interesting, seeing that <\/span><mark>you're in full nature<\/mark><span class=\"dim\"> and that you can see some of the most beautiful landscapes of the corner.<\/span>", "b": "<span class=\"dim\">Franchement, ça a l'air vraiment intéressant, vu que <\/span><mark>t'es en pleine nature<\/mark><span class=\"dim\"> et que tu peux voir quelques-uns des plus beaux paysages du coin.<\/span>"}, {"id": "B:BP0004", "bid": "BAY058", "f": "<span class=\"glabel\" style=\"display:block\">You'd be out in beautiful nature.<\/span><span class=\"dim\">Frankly, that has the air really interesting, seeing that you're in full nature and that <\/span><mark>you can see some of the most beautiful landscapes of the corner<\/mark><span class=\"dim\">.<\/span>", "b": "<span class=\"dim\">Franchement, ça a l'air vraiment intéressant, vu que t'es en pleine nature et que <\/span><mark>tu peux voir quelques-uns des plus beaux paysages du coin<\/mark><span class=\"dim\">.<\/span>"}, {"id": "B:BP0687", "bid": "BAY059", "f": "<span class=\"glabel\" style=\"display:block\">You might see the animals up close.<\/span>You could even glimpse the wolves through the windows of the chalet, or a thing like that.", "b": "Tu pourrais même apercevoir les loups par les fenêtres du chalet, ou un truc comme ça."}, {"id": "B:BP0222", "bid": "BAY060", "f": "<span class=\"glabel\" style=\"display:block\">We'd get to travel all over the world.<\/span><span class=\"dim\">Roughly, you become a tester of voyages, and <\/span><mark>if we signed up with them to do that, we would have the chance to travel everywhere in the world.<\/mark>", "b": "<span class=\"dim\">En gros, tu deviens testeur de voyages, et <\/span><mark>si on s'inscrivait chez eux pour faire ça, on aurait la chance de voyager partout dans le monde.<\/mark>"}, {"id": "B:BP0835", "bid": "BAY061", "f": "<span class=\"glabel\" style=\"display:block\">You'd travel and work at the same time.<\/span><mark>Concretely, you would travel all while working<\/mark><span class=\"dim\">, and I don't think that the tasks in themselves are so hard or so tiring as that.<\/span>", "b": "<mark>Concrètement, tu voyagerais tout en bossant<\/mark><span class=\"dim\">, et je pense pas que les tâches en elles-mêmes soient si dures ou si fatigantes que ça.<\/span>"}, {"id": "B:BP0242", "bid": "BAY062", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't even sound like a normal job.<\/span>It doesn't even resemble a normal job.", "b": "Ça ressemble même pas à un boulot normal."}, {"id": "B:BP0393", "bid": "BAY063", "f": "<span class=\"glabel\" style=\"display:block\">You'd get to see movies before everyone else.<\/span><mark>Roughly, you would have access to previews<\/mark><span class=\"dim\">, you could give your opinion to different juries, and you would have free cinema seats.<\/span>", "b": "<mark>En gros, t'aurais accès à des avant-premières<\/mark><span class=\"dim\">, tu pourrais donner ton avis à différents jurys, et t'aurais des places de ciné gratuites.<\/span>"}, {"id": "B:BP0564", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span>There would be lots of other things to do.", "b": "Y aurait plein d'autres choses à faire."}, {"id": "B:BP0561", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span><mark>We could go see a few debates<\/mark><span class=\"dim\">, do a tour of the grub stands, taste some organic and local stuff, or just put ourselves down on a bench somewhere and breathe a moment.<\/span>", "b": "<mark>On pourrait aller voir quelques débats<\/mark><span class=\"dim\">, faire un tour aux stands de bouffe, goûter des trucs bio et locaux, ou juste se poser sur un banc quelque part et souffler un moment.<\/span>"}, {"id": "B:BP0562", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span><span class=\"dim\">We could go see a few debates, <\/span><mark>do a tour of the grub stands, taste some organic and local stuff<\/mark><span class=\"dim\">, or just put ourselves down on a bench somewhere and breathe a moment.<\/span>", "b": "<span class=\"dim\">On pourrait aller voir quelques débats, <\/span><mark>faire un tour aux stands de bouffe, goûter des trucs bio et locaux<\/mark><span class=\"dim\">, ou juste se poser sur un banc quelque part et souffler un moment.<\/span>"}, {"id": "B:BP0792", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span>We could sell our stuff, do a tour, and maybe buy two-three little bits too, clothes or things like that.", "b": "On pourrait vendre nos affaires, faire un tour, et peut-être acheter deux-trois bricoles aussi, des vêtements ou des trucs comme ça."}, {"id": "B:BP0219", "bid": "BAY065", "f": "<span class=\"glabel\" style=\"display:block\">There's a big party at the end.<\/span><span class=\"dim\">And <\/span><mark>apparently, there's even a big party foreseen at the arrival, so I think that it could really be a super moment.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>apparemment, y a même une grosse fête de prévue à l'arrivée, donc je pense que ça pourrait vraiment être un super moment.<\/mark>"}, {"id": "B:BP0114", "bid": "BAY066", "f": "<span class=\"glabel\" style=\"display:block\">You could share your tastes and opinions.<\/span>Your tastes, the stuff that you like, all that pleases you — you could share all that, you know.", "b": "Tes goûts, les trucs que t'aimes, tout ce qui te plaît — tu pourrais partager tout ça, quoi."}, {"id": "B:BP0394", "bid": "BAY066", "f": "<span class=\"glabel\" style=\"display:block\">You could share your tastes and opinions.<\/span><span class=\"dim\">Roughly, you would have access to previews, <\/span><mark>you could give your opinion to different juries<\/mark><span class=\"dim\">, and you would have free cinema seats.<\/span>", "b": "<span class=\"dim\">En gros, t'aurais accès à des avant-premières, <\/span><mark>tu pourrais donner ton avis à différents jurys<\/mark><span class=\"dim\">, et t'aurais des places de ciné gratuites.<\/span>"}, {"id": "B:BP0173", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span>It's not as if you were going to be stuck eating the same thing each time.", "b": "C'est pas comme si t'allais être coincé à manger la même chose à chaque fois."}, {"id": "B:BP0172", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span>Precisely, the ad says that they have varied menus, so you could order plenty of different dishes, like local cuisine or vegetarian dishes if you're vegetarian.", "b": "Justement, la pub dit qu'ils ont des menus variés, donc tu pourrais commander plein de plats différents, comme de la cuisine locale ou des plats végétariens si t'es végétarien."}, {"id": "B:BP0179", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span><mark>With that, you would all the same have the choice between different meals<\/mark><span class=\"dim\">, and the ad doesn't say that one must order the same kind of dishes each time.<\/span>", "b": "<mark>Avec ça, t'aurais quand même le choix entre différents repas<\/mark><span class=\"dim\">, et la pub dit pas qu'il faut commander le même genre de plats à chaque fois.<\/span>"}, {"id": "B:BP0180", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span><span class=\"dim\">With that, you would all the same have the choice between different meals, and <\/span><mark>the ad doesn't say that one must order the same kind of dishes each time.<\/mark>", "b": "<span class=\"dim\">Avec ça, t'aurais quand même le choix entre différents repas, et <\/span><mark>la pub dit pas qu'il faut commander le même genre de plats à chaque fois.<\/mark>"}, {"id": "B:BP0181", "bid": "BAY068", "f": "<span class=\"glabel\" style=\"display:block\">Variety wouldn't really be a problem.<\/span>And honestly, in all cases, I don't think that it's as big a problem as all that, the variety.", "b": "Et honnêtement, dans tous les cas, je pense pas que ce soit un si gros problème que ça, la variété."}, {"id": "B:BP0182", "bid": "BAY069", "f": "<span class=\"glabel\" style=\"display:block\">You don't have much variety now either.<\/span><mark>It's not as if you were ordering in a completely different resto every day<\/mark><span class=\"dim\">, eh.<\/span>", "b": "<mark>C'est pas comme si tu commandais dans un resto complètement différent tous les jours<\/mark><span class=\"dim\">, hein.<\/span>"}, {"id": "B:BP0516", "bid": "BAY070", "f": "<span class=\"glabel\" style=\"display:block\">You might end up really liking it.<\/span>And then who knows? Maybe that it's going to please us, in the end.", "b": "Et puis qui sait ? Peut-être que ça va nous plaire, au final."}, {"id": "B:BP0266", "bid": "BAY070", "f": "<span class=\"glabel\" style=\"display:block\">You might end up really liking it.<\/span><span class=\"dim\">But <\/span><mark>if you try once, then twice, then again a few times, who knows ? You could end up really loving to cook<\/mark><span class=\"dim\">, and maybe even it would become a new passion for you.<\/span>", "b": "<span class=\"dim\">Mais <\/span><mark>si t'essaies une fois, puis deux, puis encore quelques fois, qui sait ? Tu pourrais finir par vraiment aimer cuisiner<\/mark><span class=\"dim\">, et peut-être même que ça deviendrait une nouvelle passion pour toi.<\/span>"}, {"id": "B:BP1025", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><mark>Imagine: you find it hyper nice, it becomes your new pastime<\/mark><span class=\"dim\">, you're so good that an entire room applauds you and acclaims you, and you feel super appreciated, super fulfilled.<\/span>", "b": "<mark>Imagine : tu trouves ça hyper sympa, ça devient ton nouveau passe-temps<\/mark><span class=\"dim\">, t'es tellement bon qu'une salle entière t'applaudit et t'acclame, et tu te sens super apprécié, super épanoui.<\/span>"}, {"id": "B:BP0066", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><span class=\"dim\">And <\/span><mark>if ever you're looking for something nice to do the evening, it could even become a regular thing, that you would do once per month.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si jamais tu cherches quelque chose de sympa à faire le soir, ça pourrait même devenir un truc régulier, que tu ferais une fois par mois.<\/mark>"}, {"id": "B:BP0144", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><span class=\"dim\">I ask you that just because I saw an ad yesterday evening for gardening courses, <\/span><mark>and frankly, I have the impression that it could be a really nice pastime.<\/mark>", "b": "<span class=\"dim\">Je te demande ça juste parce que j'ai vu une pub hier soir pour des cours de jardinage, <\/span><mark>et franchement, j'ai l'impression que ça pourrait être un passe-temps vraiment sympa.<\/mark>"}, {"id": "B:BP0267", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><span class=\"dim\">You could end up really loving to cook, and <\/span><mark>maybe even it would become a new passion for you.<\/mark>", "b": "<span class=\"dim\">Tu pourrais finir par vraiment aimer cuisiner, et <\/span><mark>peut-être même que ça deviendrait une nouvelle passion pour toi.<\/mark>"}, {"id": "B:BP0151", "bid": "BAY072", "f": "<span class=\"glabel\" style=\"display:block\">Later, you'd see the results growing.<\/span>And then a month later, you would come back to your garden, and there, you would really have new plants in the middle of growing.", "b": "Et puis un mois plus tard, tu reviendrais dans ton jardin, et là, t'aurais vraiment des nouvelles plantes en train de pousser."}, {"id": "B:BP0157", "bid": "BAY073", "f": "<span class=\"glabel\" style=\"display:block\">You'd have something lasting afterwards.<\/span><span class=\"dim\">And <\/span><mark>even once the course is finished, you would always have your garden to maintain.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>même une fois le cours fini, t'aurais toujours ton jardin à entretenir.<\/mark>"}, {"id": "B:BP0152", "bid": "BAY074", "f": "<span class=\"glabel\" style=\"display:block\">After that, it would be a lot more fun.<\/span>From there, gardening, it would surely be a lot more fun.", "b": "À partir de là, le jardinage, ce serait sûrement beaucoup plus marrant."}, {"id": "B:BP0956", "bid": "BAY075", "f": "<span class=\"glabel\" style=\"display:block\">It can be a fun replacement.<\/span><span class=\"dim\">Whereas <\/span><mark>that, that can be a nice alternative.<\/mark>", "b": "<span class=\"dim\">Alors que <\/span><mark>ça, ça peut être une alternative sympa.<\/mark>"}, {"id": "B:BP0957", "bid": "BAY076", "f": "<span class=\"glabel\" style=\"display:block\">You won't do it enough for it to feel like a chore.<\/span>You're surely not going to do enough of it for it to start to resemble a chore.", "b": "Tu vas sûrement pas en faire assez pour que ça commence à ressembler à une corvée."}, {"id": "B:BP0869", "bid": "BAY077", "f": "<span class=\"glabel\" style=\"display:block\">We'd come back with great memories.<\/span><mark>We would come back with plenty of super memories of the trip<\/mark><span class=\"dim\">, and I think that we would tell ourselves that it was really worth the pain.<\/span>", "b": "<mark>On reviendrait avec plein de super souvenirs du voyage<\/mark><span class=\"dim\">, et je pense qu'on se dirait que ça en valait vraiment la peine.<\/span>"}, {"id": "B:BP0776", "bid": "BAY078", "f": "<span class=\"glabel\" style=\"display:block\">They film it, so we'd have videos to look back on.<\/span>On top of that, they have a service where they take photos and videos of the whole thing, so then after, we would really have souvenirs to keep.", "b": "En plus de ça, ils ont un service où ils prennent des photos et des vidéos de tout le truc, du coup après, on aurait vraiment des souvenirs à garder."}, {"id": "B:BP0777", "bid": "BAY078", "f": "<span class=\"glabel\" style=\"display:block\">They film it, so we'd have videos to look back on.<\/span>We could replay ourselves the videos later and remember the whole experience.", "b": "On pourrait se repasser les vidéos plus tard et se rappeler toute l'expérience."}, {"id": "B:BP0528", "bid": "BAY079", "f": "<span class=\"glabel\" style=\"display:block\">We'd have a great story to tell.<\/span><span class=\"dim\">The real reason, it's that it would be a really unusual experience, and <\/span><mark>after, we would have a super story to tell to the pals.<\/mark>", "b": "<span class=\"dim\">La vraie raison, c'est que ce serait une expérience vraiment insolite, et <\/span><mark>après, on aurait une super histoire à raconter aux copains.<\/mark>"}, {"id": "B:BP1034", "bid": "BAY079", "f": "<span class=\"glabel\" style=\"display:block\">We'd have a great story to tell.<\/span>That'll make us a cool story to tell, the both of us.", "b": "Ça nous fera une histoire cool à raconter, à tous les deux."}, {"id": "B:BP0534", "bid": "BAY079", "f": "<span class=\"glabel\" style=\"display:block\">We'd have a great story to tell.<\/span>If we did it really, we would have a thing interesting to recount, above all with other people that ecology interests.", "b": "Si on le faisait vraiment, on aurait un truc intéressant à raconter, surtout avec d'autres gens que l'écologie intéresse."}, {"id": "B:BP0535", "bid": "BAY080", "f": "<span class=\"glabel\" style=\"display:block\">Maybe the media would want to hear about it.<\/span>And who knows, maybe even that blogs, magazines or people from the media would well like to know how it was, this experience.", "b": "Et qui sait, peut-être même que des blogs, des magazines ou des gens des médias voudraient bien savoir comment c'était, cette expérience."}, {"id": "B:BP0050", "bid": "BAY081", "f": "<span class=\"glabel\" style=\"display:block\">It would look great on social media.<\/span><span class=\"dim\">And yeah, <\/span><mark>on top, it would surely render super well on Instagram.<\/mark>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>en plus, ça rendrait sûrement super bien sur Instagram.<\/mark>"}, {"id": "B:BP1026", "bid": "BAY082", "f": "<span class=\"glabel\" style=\"display:block\">People might cheer for you and you'd feel proud.<\/span><span class=\"dim\">Imagine: you find it hyper nice, it becomes your new pastime, <\/span><mark>you're so good that an entire room applauds you and acclaims you, and you feel super appreciated, super fulfilled.<\/mark>", "b": "<span class=\"dim\">Imagine : tu trouves ça hyper sympa, ça devient ton nouveau passe-temps, <\/span><mark>t'es tellement bon qu'une salle entière t'applaudit et t'acclame, et tu te sens super apprécié, super épanoui.<\/mark>"}, {"id": "B:BP0054", "bid": "BAY083", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to celebrate.<\/span>You know, sometimes, one must mark the blow.", "b": "Tu sais, des fois, faut marquer le coup."}, {"id": "B:BP1035", "bid": "BAY084", "f": "<span class=\"glabel\" style=\"display:block\">We should do silly things sometimes.<\/span>Well, I don't know, I tell myself that we should do stuff a bit stupid sometimes.", "b": "Enfin, je sais pas, je me dis qu'on devrait faire des trucs un peu débiles parfois."}, {"id": "B:BP1122", "bid": "BAY085", "f": "<span class=\"glabel\" style=\"display:block\">It was exciting at first, then it became fun.<\/span>At the start, I had crazy adrenaline rushes, and after, very fast, I started to have a blast.", "b": "Au début, j'avais des montées d'adrénaline de dingue, et après, très vite, j'ai commencé à m'éclater."}, {"id": "B:BP1123", "bid": "BAY086", "f": "<span class=\"glabel\" style=\"display:block\">I couldn't stop, even when I was tired.<\/span>I couldn't manage to stop anymore, even if it exhausted me.", "b": "J'arrivais plus à m'arrêter, même si ça m'épuisait."}, {"id": "B:BP1124", "bid": "BAY087", "f": "<span class=\"glabel\" style=\"display:block\">I think you'll feel the same.<\/span><span class=\"dim\">And <\/span><mark>I'm sure that it will be the same for you.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>je suis sûr que ce sera pareil pour toi.<\/mark>"}]}, {"key": "B-BA4", "sec": "B", "code": "BA4", "name": "Growth & skills", "bucket": "Arguments", "items": [{"id": "B:BP0120", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span><span class=\"dim\">And <\/span><mark>on top, it would make you go out a bit of your comfort zone.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>en plus, ça te ferait sortir un peu de ta zone de confort.<\/mark>"}, {"id": "B:BP0072", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span>On top of that, it's the occasion to go out a bit from your comfort zone.", "b": "En plus de ça, c'est l'occasion de sortir un peu de ta zone de confort."}, {"id": "B:BP0198", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span><mark>I think that it would push us to go out of our comfort zone and to test our limits a bit<\/mark><span class=\"dim\">, and frankly, it could be a super experience for us all.<\/span>", "b": "<mark>Je pense que ça nous pousserait à sortir de notre zone de confort et à tester un peu nos limites<\/mark><span class=\"dim\">, et franchement, ça pourrait être une super expérience pour nous tous.<\/span>"}, {"id": "B:BP0760", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span>It would make us leave our comfort zone, and it would give us the occasion to do a thing that we would never do in normal time.", "b": "Ça nous ferait sortir de notre zone de confort, et ça nous donnerait l'occasion de faire un truc qu'on ferait jamais en temps normal."}, {"id": "B:BP0263", "bid": "BAY089", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to leave your comfort zone.<\/span>Sometimes, one has to get out of one's comfort zone.", "b": "Des fois, faut sortir de sa zone de confort."}, {"id": "B:BP0584", "bid": "BAY089", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to leave your comfort zone.<\/span>Sometimes, gotta do things that take you out a bit from your comfort zone, you see?", "b": "Des fois, faut faire des trucs qui te sortent un peu de ta zone de confort, tu vois ?"}, {"id": "B:BP0599", "bid": "BAY090", "f": "<span class=\"glabel\" style=\"display:block\">Leaving your comfort zone is how you grow.<\/span>It's like that that we grow, and it's in large part for that that I think that you should do it.", "b": "C'est comme ça qu'on grandit, et c'est en grande partie pour ça que je pense que tu devrais le faire."}, {"id": "B:BP0713", "bid": "BAY090", "f": "<span class=\"glabel\" style=\"display:block\">Leaving your comfort zone is how you grow.<\/span>You would have to go out a bit from your comfort zone, but precisely, I think that that could be a good thing.", "b": "Il faudrait que tu sortes un peu de ta zone de confort, mais justement, je pense que ça pourrait être une bonne chose."}, {"id": "B:BP0196", "bid": "BAY091", "f": "<span class=\"glabel\" style=\"display:block\">It would give us a real goal to work toward.<\/span>Here, it would give us a real challenge to prepare.", "b": "Là, ça nous donnerait un vrai défi à préparer."}, {"id": "B:BP0187", "bid": "BAY091", "f": "<span class=\"glabel\" style=\"display:block\">It would give us a real goal to work toward.<\/span>Precisely, this challenge, it would give us a real goal.", "b": "Justement, ce défi, ça nous donnerait un vrai but."}, {"id": "B:BP0264", "bid": "BAY092", "f": "<span class=\"glabel\" style=\"display:block\">Good things take effort and sacrifice.<\/span><mark>The good things, that can demand efforts and sacrifices<\/mark><span class=\"dim\">, and there, that surely seems difficult to you just because you haven't yet taken the habit.<\/span>", "b": "<mark>Les bonnes choses, ça peut demander des efforts et des sacrifices<\/mark><span class=\"dim\">, et là, ça te paraît sûrement difficile juste parce que t'as pas encore pris le pli.<\/span>"}, {"id": "B:BP0372", "bid": "BAY093", "f": "<span class=\"glabel\" style=\"display:block\">That's life: you can't only do fun things.<\/span>Well, that's part of life too, that. You can't do only stuff that pleases you or that you feel like, all the time.", "b": "Enfin, ça fait partie de la vie aussi, ça. Tu peux pas faire que des trucs qui te plaisent ou dont t'as envie, tout le temps."}, {"id": "B:BP0371", "bid": "BAY094", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn to do things that aren't always fun.<\/span><span class=\"dim\">But listen, I think all the same that it's worth the blow to try, because it would be a new experience for you, and <\/span><mark>you would learn to do stuff that is not always fun, or that you don't necessarily feel like doing.<\/mark>", "b": "<span class=\"dim\">Mais écoute, je pense quand même que ça vaut le coup d'essayer, parce que ce serait une nouvelle expérience pour toi, et <\/span><mark>t'apprendrais à faire des trucs qui sont pas toujours marrants, ou que t'as pas forcément envie de faire.<\/mark>"}, {"id": "B:BP0598", "bid": "BAY095", "f": "<span class=\"glabel\" style=\"display:block\">Doing something scary builds your confidence.<\/span>And precisely, that could be a good means to gain confidence — doing a thing that makes you a bit afraid and that takes you out of your comfort zone.", "b": "Et justement, ça pourrait être un bon moyen de prendre confiance — faire un truc qui te fait un peu peur et qui te sort de ta zone de confort."}, {"id": "B:BP0784", "bid": "BAY095", "f": "<span class=\"glabel\" style=\"display:block\">Doing something scary builds your confidence.<\/span>Because in truth, it's not just the jump in itself. It's also the fact of doing a thing that scares you, and of proving to yourself that you're capable of overcoming that.", "b": "Parce qu'en vrai, c'est pas juste le saut en lui-même. C'est aussi le fait de faire un truc qui te fait peur, et de te prouver que t'es capable de surmonter ça."}, {"id": "B:BP0785", "bid": "BAY096", "f": "<span class=\"glabel\" style=\"display:block\">After this, other things will feel less scary.<\/span>What I want to say, it's that jumping from a plane in free fall, it's without doubt one of the most freaky things to do. So then, if you manage to get past that, lots of other things are surely going to seem way less impressive to you after.", "b": "Ce que je veux dire, c'est que sauter d'un avion en chute libre, c'est sans doute un des trucs les plus flippants à faire. Du coup, si t'arrives à dépasser ça, plein d'autres choses vont sûrement te paraître vachement moins impressionnantes après."}, {"id": "B:BP1152", "bid": "BAY097", "f": "<span class=\"glabel\" style=\"display:block\">Afterward, you'll know you can do it again.<\/span>There, it's the occasion to learn and to live this experience, so that later, you know that you have the shoulders — that you be sure of being able to redo it again and again.", "b": "Là, c'est l'occasion d'apprendre et de vivre cette expérience, pour que plus tard, tu saches que t'as les épaules — que tu sois sûr de pouvoir le refaire encore et encore."}, {"id": "B:BP1052", "bid": "BAY097", "f": "<span class=\"glabel\" style=\"display:block\">Afterward, you'll know you can do it again.<\/span>There, we will know that this muscle there, we have it in us, and that we can make it play.", "b": "Là, on saura que ce muscle-là, on l'a en nous, et qu'on peut le faire jouer."}, {"id": "B:BP1057", "bid": "BAY098", "f": "<span class=\"glabel\" style=\"display:block\">It's a different kind of experience that works a different side of you.<\/span><span class=\"dim\">And you, <\/span><mark>you react how in those situations there? That, it's an experience of another kind.<\/mark>", "b": "<span class=\"dim\">Et toi, <\/span><mark>tu réagis comment dans ces situations-là ? Ça, c'est une expérience d'un autre genre.<\/mark>"}, {"id": "B:BP1054", "bid": "BAY098", "f": "<span class=\"glabel\" style=\"display:block\">It's a different kind of experience that works a different side of you.<\/span>There, for once, what is at stake, it's not you; what is at stake, it's maybe rather the people around you. So maybe that, that activates another side of your brain.", "b": "Là, pour le coup, ce qui est en jeu, c'est pas toi ; ce qui est en jeu, c'est peut-être plutôt les gens autour de toi. Alors peut-être que ça, ça active un autre côté de ton cerveau."}, {"id": "B:BP0121", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span><span class=\"dim\">So then, <\/span><mark>it wouldn't be just fun: you would also learn new stuff.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>ce serait pas juste marrant : t'apprendrais aussi de nouveaux trucs.<\/mark>"}, {"id": "B:BP0155", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span><mark>You would follow the course, you would learn things<\/mark><span class=\"dim\">, and you would surely meet new people, on top.<\/span>", "b": "<mark>Tu suivrais le cours, t'apprendrais des choses<\/mark><span class=\"dim\">, et tu rencontrerais sûrement des nouvelles personnes, en plus.<\/span>"}, {"id": "B:BP0410", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span><mark>You would learn maybe more about how it works, this milieu<\/mark><span class=\"dim\">, you would make interesting encounters, and maybe even that you would hear talk of other events or other opportunities thanks to them.<\/span>", "b": "<mark>T'en apprendrais peut-être plus sur comment ça marche, ce milieu<\/mark><span class=\"dim\">, tu ferais des rencontres intéressantes, et peut-être même que t'entendrais parler d'autres événements ou d'autres opportunités grâce à eux.<\/span>"}, {"id": "B:BP0433", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span>And then that would give you the occasion to learn more about how to take care of your car yourself.", "b": "Et puis ça te donnerait l'occasion d'en apprendre plus sur comment t'occuper de ta voiture toi-même."}, {"id": "B:BP0154", "bid": "BAY100", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't just be waiting around.<\/span>If it's a gardening course, you wouldn't be just there waiting for your plants to grow.", "b": "Si c'est un cours de jardinage, tu serais pas juste là à attendre que tes plantes poussent."}, {"id": "B:BP1044", "bid": "BAY101", "f": "<span class=\"glabel\" style=\"display:block\">You could learn a lot from people with more experience.<\/span><span class=\"dim\">It's seniors, they have need of help, agreed — but at the same time, <\/span><mark>they have dozens of years of experience behind them, and one never knows what one can learn just by rubbing shoulders with those people there, by discussing with them.<\/mark>", "b": "<span class=\"dim\">C'est des seniors, ils ont besoin d'aide, d'accord — mais en même temps, <\/span><mark>ils ont des dizaines d'années d'expérience derrière eux, et on sait jamais ce qu'on peut apprendre juste en côtoyant ces gens-là, en discutant avec eux.<\/mark>"}, {"id": "B:BP0159", "bid": "BAY102", "f": "<span class=\"glabel\" style=\"display:block\">Even if you might stop later, you can still learn the basics.<\/span><span class=\"dim\">And <\/span><mark>if what worries you, it's that you risk moving, you could all the same follow the course just for the pleasure, so as to learn the basics.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si ce qui t'inquiète, c'est que tu risques de déménager, tu pourrais quand même suivre le cours juste pour le plaisir, histoire d'apprendre les bases.<\/mark>"}, {"id": "B:BP0444", "bid": "BAY103", "f": "<span class=\"glabel\" style=\"display:block\">That know-how is useful to have.<\/span>Even if you don't continue repairing your car, that doesn't prevent that it's useful to have that know-how.", "b": "Même si tu continues pas à réparer ta voiture, n'empêche que c'est utile d'avoir ce savoir-faire."}, {"id": "B:BP0440", "bid": "BAY103", "f": "<span class=\"glabel\" style=\"display:block\">That know-how is useful to have.<\/span><mark>Me, I find that it's useful to know at least the basics of the upkeep of one's car<\/mark><span class=\"dim\">, because like that, you'll realise better what it really demands, a repair, and you'll see if a garage makes you pay too expensive for a simple thing.<\/span>", "b": "<mark>Moi, je trouve que c'est utile de connaître au moins les bases de l'entretien de sa voiture<\/mark><span class=\"dim\">, parce que comme ça, tu te rendras mieux compte de ce que ça demande vraiment, une réparation, et tu verras si un garage te fait payer trop cher pour un truc simple.<\/span>"}, {"id": "B:BP1060", "bid": "BAY104", "f": "<span class=\"glabel\" style=\"display:block\">It builds people skills and empathy.<\/span>And that makes us develop empathy for people.", "b": "Et ça nous fait développer de l'empathie pour les gens."}, {"id": "B:BP1059", "bid": "BAY104", "f": "<span class=\"glabel\" style=\"display:block\">It builds people skills and empathy.<\/span>That teaches us not only concrete competences — organising an event, organising activities, communicating — that helps us also to work on our emotional intelligence.", "b": "Ça nous apprend pas seulement des compétences concrètes — organiser un événement, organiser des activités, communiquer — ça nous aide aussi à travailler notre intelligence émotionnelle."}, {"id": "B:BP1050", "bid": "BAY105", "f": "<span class=\"glabel\" style=\"display:block\">It teaches you to manage when you're under pressure.<\/span><span class=\"dim\">Doesn't prevent, <\/span><mark>that teaches us to improvise in this kind of situations where we are at the foot of the wall.<\/mark>", "b": "<span class=\"dim\">N'empêche, <\/span><mark>ça nous apprend à improviser dans ce genre de situations où on est au pied du mur.<\/mark>"}, {"id": "B:BP0752", "bid": "BAY106", "f": "<span class=\"glabel\" style=\"display:block\">You'd find out something about yourself.<\/span><span class=\"dim\">That said, <\/span><mark>it could precisely be a good way to know if you're introverted by nature, or if it's the fact of passing so much time behind the screens that has made you more closed-in than what you would be otherwise.<\/mark>", "b": "<span class=\"dim\">Cela dit, <\/span><mark>ça pourrait justement être un bon moyen de savoir si t'es introverti de nature, ou si c'est le fait de passer autant de temps derrière les écrans qui t'a rendu plus renfermé que ce que tu serais autrement.<\/mark>"}, {"id": "B:BP1015", "bid": "BAY107", "f": "<span class=\"glabel\" style=\"display:block\">It could open your mind to new ideas.<\/span>Imagine all that it could unblock for you as creativity, by opening doors in your brain — creative capacities whose existence you don't even suspect.", "b": "Imagine tout ce que ça pourrait te débloquer comme créativité, en ouvrant des portes dans ton cerveau — des capacités créatives dont tu soupçonnes même pas l'existence."}, {"id": "B:BP1042", "bid": "BAY107", "f": "<span class=\"glabel\" style=\"display:block\">It could open your mind to new ideas.<\/span>Me, I think that this kind of experiences in general, the ones where we help the others without winning anything from it, that opens doors and that lights up neurons that we didn't even know that we had in the brain — and so then, that opens us to new ideas, to new ways of seeing life, to new perspectives.", "b": "Moi, je pense que ce genre d'expériences en général, celles où on aide les autres sans rien y gagner, ça ouvre des portes et ça allume des neurones qu'on savait même pas qu'on avait dans le cerveau — et du coup, ça nous ouvre à des idées nouvelles, à des nouvelles façons de voir la vie, à des nouvelles perspectives."}, {"id": "B:BP1051", "bid": "BAY108", "f": "<span class=\"glabel\" style=\"display:block\">This skill will help your career later.<\/span><span class=\"dim\">And <\/span><mark>this capacity to improvise, knowing that we have already done it, that's going to really serve us later in our careers — the day when they will ask us to do a thing of which we have no experience, that doesn't please us especially, that puts us ill at ease.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>cette capacité à improviser, en sachant qu'on l'a déjà fait, ça va vraiment nous servir plus tard dans nos carrières — le jour où on nous demandera de faire un truc dont on a aucune expérience, qui nous plaît pas spécialement, qui nous met mal à l'aise.<\/mark>"}, {"id": "B:BP1151", "bid": "BAY109", "f": "<span class=\"glabel\" style=\"display:block\">You'll always have to prove yourself to people.<\/span>Got to make your proofs with people.", "b": "Faut faire tes preuves auprès des gens."}, {"id": "B:BP1150", "bid": "BAY109", "f": "<span class=\"glabel\" style=\"display:block\">You'll always have to prove yourself to people.<\/span><span class=\"dim\">And <\/span><mark>all along your future career in politics or in the public service, you'll have hundreds of situations where it's you the new one. Nobody trusts you, nobody knows why you're there.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>tout au long de ta future carrière en politique ou dans le service public, t'auras des centaines de situations où c'est toi le nouveau. Personne te fait confiance, personne sait pourquoi t'es là.<\/mark>"}, {"id": "B:BP1138", "bid": "BAY110", "f": "<span class=\"glabel\" style=\"display:block\">It's a natural next step for you.<\/span>It's a point of departure, a springboard for your career.", "b": "C'est un point de départ, un tremplin pour ta carrière."}, {"id": "B:BP0586", "bid": "BAY110", "f": "<span class=\"glabel\" style=\"display:block\">It's a natural next step for you.<\/span>I have the impression that it's the logical next step, a bit like making your writing pass to another level.", "b": "J'ai l'impression que c'est la suite logique, un peu comme faire passer ton écriture à un autre niveau."}, {"id": "B:BP1137", "bid": "BAY111", "f": "<span class=\"glabel\" style=\"display:block\">It looks good on your resume.<\/span>Defending a public cause, it's clearly interesting to put on a CV, especially since you're aiming at a political career.", "b": "Défendre une cause publique, c'est clairement intéressant à mettre sur un CV, surtout que tu vises une carrière politique."}, {"id": "B:BP1141", "bid": "BAY112", "f": "<span class=\"glabel\" style=\"display:block\">This takes you from wanting change to making it happen.<\/span><span class=\"dim\">And precisely, <\/span><mark>that, it's the springboard that permits passing from an idea, from a desire for change, to something really concrete.<\/mark>", "b": "<span class=\"dim\">Et justement, <\/span><mark>ça, c'est le tremplin qui permet de passer d'une idée, d'une envie de changement, à quelque chose de vraiment concret.<\/mark>"}, {"id": "B:BP1142", "bid": "BAY113", "f": "<span class=\"glabel\" style=\"display:block\">Going from an idea to real change is hard from scratch.<\/span>Between the two, there's a big ditch, and frankly, it's super hard to fill starting from zero.", "b": "Entre les deux, y a un gros fossé, et franchement, c'est super dur à combler en partant de zéro."}, {"id": "B:BP1143", "bid": "BAY114", "f": "<span class=\"glabel\" style=\"display:block\">You get the experience without starting from scratch.<\/span>There, it's the occasion for you to not have to set up an association or a movement from nothing, and to have all the same this kind of militant experience.", "b": "Là, c'est l'occasion pour toi de pas avoir à monter une asso ou un mouvement à partir de rien, et d'avoir quand même ce genre d'expérience militante."}, {"id": "B:BP0581", "bid": "BAY115", "f": "<span class=\"glabel\" style=\"display:block\">If you win, you could go further with it.<\/span><span class=\"dim\">And you would have the possibility to win a prize, and <\/span><mark>if you won the contest, you could even do a tour and present your story in several shows.<\/mark>", "b": "<span class=\"dim\">Et t'aurais la possibilité de gagner un prix, et <\/span><mark>si tu gagnais le concours, tu pourrais même faire une tournée et présenter ton histoire dans plusieurs spectacles.<\/mark>"}, {"id": "B:BP0412", "bid": "BAY116", "f": "<span class=\"glabel\" style=\"display:block\">You might hear about other opportunities.<\/span><span class=\"dim\">You would learn maybe more about how it works, this milieu, you would make interesting encounters, and <\/span><mark>maybe even that you would hear talk of other events or other opportunities thanks to them.<\/mark>", "b": "<span class=\"dim\">T'en apprendrais peut-être plus sur comment ça marche, ce milieu, tu ferais des rencontres intéressantes, et <\/span><mark>peut-être même que t'entendrais parler d'autres événements ou d'autres opportunités grâce à eux.<\/mark>"}, {"id": "B:BP1003", "bid": "BAY117", "f": "<span class=\"glabel\" style=\"display:block\">You can build a good reputation over time.<\/span>The more you sell, the more you have stars and points, the more you receive good reviews, and that, that gives you credibility as a seller.", "b": "Plus tu vends, plus t'as d'étoiles et de points, plus tu reçois de bons avis, et ça, ça te donne de la crédibilité en tant que vendeur."}, {"id": "B:BP1002", "bid": "BAY117", "f": "<span class=\"glabel\" style=\"display:block\">You can build a good reputation over time.<\/span>There's a sort of profile and reputation that you can build yourself on this site.", "b": "Y a une sorte de profil et de réputation que tu peux te construire sur ce site."}, {"id": "B:BP1005", "bid": "BAY118", "f": "<span class=\"glabel\" style=\"display:block\">If you start early, you'll have an advantage.<\/span><span class=\"dim\">So then, <\/span><mark>there's a sort of advantage to having arrived first, you know.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>y a une sorte d'avantage à être arrivé en premier, quoi.<\/mark>"}, {"id": "B:BP1004", "bid": "BAY118", "f": "<span class=\"glabel\" style=\"display:block\">If you start early, you'll have an advantage.<\/span>Seeing that the platform is still at its beginnings, if you start to use this site regularly from now, the time that it takes off, you'll have become one of the best sellers. You'll have that weight there.", "b": "Vu que la plateforme en est encore à ses débuts, si tu te mets à utiliser ce site régulièrement dès maintenant, le temps qu'il décolle, tu seras devenu un des meilleurs vendeurs. T'auras ce poids-là."}]}, {"key": "B-BA5", "sec": "B", "code": "BA5", "name": "Health & wellbeing", "bucket": "Arguments", "items": [{"id": "B:BP0255", "bid": "BAY119", "f": "<span class=\"glabel\" style=\"display:block\">Your health is your number one priority.<\/span>Well, your health, it's all the same your priority number one.", "b": "Enfin, ta santé, c'est quand même ta priorité numéro un."}, {"id": "B:BP0251", "bid": "BAY120", "f": "<span class=\"glabel\" style=\"display:block\">This could help you take better care of your health.<\/span><span class=\"dim\">I know that you're stressed at the moment, and that these last months, your alimentary habits, it wasn't terrific, so <\/span><mark>I told myself that it could help you to better take care of your health.<\/mark>", "b": "<span class=\"dim\">Je sais que t'es stressé en ce moment, et que ces derniers mois, tes habitudes alimentaires, c'était pas terrible, alors <\/span><mark>je me suis dit que ça pourrait t'aider à mieux prendre soin de ta santé.<\/mark>"}, {"id": "B:BP0493", "bid": "BAY121", "f": "<span class=\"glabel\" style=\"display:block\">It's important to deal with your stress.<\/span><span class=\"dim\">But <\/span><mark>I think really that it's important to manage this stress<\/mark><span class=\"dim\">, because the stress, that ends up touching all the rest of your life.<\/span>", "b": "<span class=\"dim\">Mais <\/span><mark>je pense vraiment que c'est important de gérer ce stress<\/mark><span class=\"dim\">, parce que le stress, ça finit par toucher tout le reste de ta vie.<\/span>"}, {"id": "B:BP0495", "bid": "BAY121", "f": "<span class=\"glabel\" style=\"display:block\">It's important to deal with your stress.<\/span>It's the kind of thing to take seriously and to try to settle.", "b": "C'est le genre de truc à prendre au sérieux et à essayer de régler."}, {"id": "B:BP0494", "bid": "BAY122", "f": "<span class=\"glabel\" style=\"display:block\">Stress affects every part of your life.<\/span><span class=\"dim\">But I think really that it's important to manage this stress, because <\/span><mark>the stress, that ends up touching all the rest of your life.<\/mark>", "b": "<span class=\"dim\">Mais je pense vraiment que c'est important de gérer ce stress, parce que <\/span><mark>le stress, ça finit par toucher tout le reste de ta vie.<\/mark>"}, {"id": "B:BP0462", "bid": "BAY123", "f": "<span class=\"glabel\" style=\"display:block\">Studies show it improves mental health.<\/span>But apparently, there are scientific studies that show that having a cat, that can improve mental health, help to relax, things like that.", "b": "Mais apparemment, y a des études scientifiques qui montrent qu'avoir un chat, ça peut améliorer la santé mentale, aider à se détendre, des trucs comme ça."}, {"id": "B:BP0499", "bid": "BAY124", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't only help with stress.<\/span><span class=\"dim\">There, that would come back to you much less expensive than that, and on top, <\/span><mark>you wouldn't have just a thing that can help against stress.<\/mark>", "b": "<span class=\"dim\">Là, ça te reviendrait bien moins cher que ça, et en plus, <\/span><mark>t'aurais pas juste un truc qui peut aider contre le stress.<\/mark>"}, {"id": "B:BP0643", "bid": "BAY125", "f": "<span class=\"glabel\" style=\"display:block\">Getting out would clear your head.<\/span>Besides, that could even do you good to go out, to change décor and to empty your head a bit.", "b": "D'ailleurs, ça pourrait même te faire du bien de sortir, de changer de décor et de te vider un peu la tête."}, {"id": "B:BP0731", "bid": "BAY126", "f": "<span class=\"glabel\" style=\"display:block\">It's a real break from
