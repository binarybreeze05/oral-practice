>"}, {"id": "A:C002", "bid": "CB002", "f": "<span class=\"glabel\" style=\"display:block\">I have a few questions before I book.<\/span><span class=\"dim\">Hello, I permit myself to call you because I just came from seeing your ad on the subject of the paragliding experience that you propose, and <\/span><mark>I would have a few questions to pose you to clear up certain points before reserving… if that doesn't bother you.<\/mark>", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler parce que je viens de voir votre annonce au sujet de l'expérience de parapente que vous proposez, et <\/span><mark>j'aurais quelques questions à vous poser pour éclaircir certains points avant de réserver… si ça ne vous dérange pas.<\/mark>"}, {"id": "A:C011", "bid": "CB002", "f": "<span class=\"glabel\" style=\"display:block\">I have a few questions before I book.<\/span><span class=\"dim\">Hello, I permit myself to call you because I just came from seeing your ad on the subject of the dance courses that you propose, and <\/span><mark>I would have a few questions to pose you to clarify certain points before inscribing myself… if that doesn't bother you.<\/mark>", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler parce que je viens de voir votre annonce au sujet des cours de danse que vous proposez, et <\/span><mark>j'aurais quelques questions à vous poser pour clarifier certains points avant de m'inscrire… si ça ne vous dérange pas.<\/mark>"}, {"id": "A:C059", "bid": "CB002", "f": "<span class=\"glabel\" style=\"display:block\">I have a few questions before I book.<\/span><span class=\"dim\">Hello, I permit myself to call you on the subject of one of your ads that I just came from seeing, and <\/span><mark>I would have a few questions to pose you to clear up certain points before placing an order… if that doesn't bother you.<\/mark>", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler au sujet d'une de vos annonces que je viens de voir, et <\/span><mark>j'aurais quelques questions à vous poser pour éclaircir certains points avant de passer commande… si cela ne vous dérange pas.<\/mark>"}, {"id": "A:CG008", "bid": "CB085", "f": "<span class=\"glabel\" style=\"display:block\">I also want to ask about X.<\/span><mark>Besides, I must pose you a question on the food<\/mark><span class=\"dim\">: must I buy a week of food for my animals in advance, or is it indeed you who take care of it?<\/span>", "b": "<mark>Par ailleurs, il faut que je vous pose une question sur la nourriture<\/mark><span class=\"dim\"> : dois-je acheter une semaine de nourriture pour mes animaux à l'avance, ou est-ce bien vous qui vous en occupez ?<\/span>"}, {"id": "A:CG015", "bid": "CB085", "f": "<span class=\"glabel\" style=\"display:block\">I also want to ask about X.<\/span>On that subject, permit me first to pose you a question.", "b": "À ce propos, permettez-moi d'abord de vous poser une question."}, {"id": "A:CG017", "bid": "CB085", "f": "<span class=\"glabel\" style=\"display:block\">I also want to ask about X.<\/span>I would like still to pose you a few questions on the activities.", "b": "J'aimerais encore vous poser quelques questions sur les activités."}]}, {"key": "A-M2", "sec": "A", "code": "M2", "name": "Referring to the ad", "bucket": "Context", "items": [{"id": "A:C024", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>You indicate in the ad that we will create the lamps in small groups.", "b": "Vous indiquez dans l'annonce qu'on créera les lampes en petits groupes."}, {"id": "A:C021", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>It seems to me that the ad also mentions souvenir boutiques on the spot.", "b": "Il me semble que l'annonce mentionne aussi des boutiques de souvenirs sur place."}, {"id": "A:C026", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>You say also that one can bring one's own objects to recycle.", "b": "Vous dites aussi qu'on peut apporter ses propres objets à recycler."}, {"id": "A:C031", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>The ad specifies that it's qualified and experienced professionals who supervise the workshop.", "b": "L'annonce précise que ce sont des professionnels qualifiés et expérimentés qui encadrent l'atelier."}, {"id": "A:C044", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span><mark>You indicate in the ad that there is catering on the spot<\/mark><span class=\"dim\">: what kind of dishes do you propose?<\/span>", "b": "<mark>Vous indiquez dans l'annonce qu'il y a de la restauration sur place<\/mark><span class=\"dim\"> : quel genre de plats proposez-vous ?<\/span>"}, {"id": "A:C066", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>The ad says that you reimburse if one is not satisfied with the quality of the product.", "b": "L'annonce dit que vous remboursez si on n'est pas satisfait de la qualité du produit."}, {"id": "A:C070", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>You indicated in the ad that this outing is done with or without guide.", "b": "Vous avez indiqué dans l'annonce que cette sortie se fait avec ou sans guide."}, {"id": "A:C125", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>You indicate in the ad that you propose also visits of specialised shops.", "b": "Vous indiquez dans l'annonce que vous proposez aussi des visites de magasins spécialisés."}, {"id": "A:C139", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span>You indicated that the room is entirely equipped for children's parties.", "b": "Vous avez indiqué que la salle est entièrement équipée pour les fêtes d'enfants."}, {"id": "A:C140", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span><mark>You mention in the ad four different formulas<\/mark><span class=\"dim\">: in what do they consist?<\/span>", "b": "<mark>Vous mentionnez dans l'annonce quatre formules différentes<\/mark><span class=\"dim\"> : en quoi consistent-elles ?<\/span>"}, {"id": "A:C149", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span><mark>You say in the ad that it is advised to reserve rapidly<\/mark><span class=\"dim\">, I was wondering therefore if the places had a tendency to leave very fast.<\/span>", "b": "<mark>Vous dites dans l'annonce qu'il est conseillé de réserver rapidement<\/mark><span class=\"dim\">, je me demandais donc si les places avaient tendance à partir très vite.<\/span>"}, {"id": "A:C150", "bid": "CB015", "f": "<span class=\"glabel\" style=\"display:block\">The ad says that X.<\/span><mark>It is indicated in the ad that one must dial this number<\/mark><span class=\"dim\">: does that want to say that the reservation by telephone is obligatory?<\/span>", "b": "<mark>Il est indiqué dans l'annonce qu'il faut composer ce numéro<\/mark><span class=\"dim\"> : cela veut-il dire que la réservation par téléphone est obligatoire ?<\/span><span class=\"tags\"><span class=\"st\"><b>6b<\/b> … est-il obligatoire ?<\/span><\/span>"}, {"id": "A:C146", "bid": "CB044", "f": "<span class=\"glabel\" style=\"display:block\">The ad didn't mention that.<\/span>I don't believe that it's indicated in the ad.", "b": "Je ne crois pas que ce soit indiqué dans l'annonce.<span class=\"tags\"><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:C069", "bid": "CB044", "f": "<span class=\"glabel\" style=\"display:block\">The ad didn't mention that.<\/span>So, my first question, it would be on the subject of the price, since it wasn't mentioned in the ad.", "b": "Alors, ma première question, ce serait au sujet du prix, puisqu'il n'était pas mentionné dans l'annonce."}, {"id": "A:C107", "bid": "CB044", "f": "<span class=\"glabel\" style=\"display:block\">The ad didn't mention that.<\/span>I don't believe that it figures in the ad.", "b": "Je ne crois pas qu'il figure dans l'annonce.<span class=\"tags\"><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:C051", "bid": "CB003", "f": "<span class=\"glabel\" style=\"display:block\">You said that X.<\/span>You told me that you lend us a car for the time that ours is repaired.", "b": "Vous m'avez dit que vous nous prêtiez une voiture le temps que la nôtre soit réparée."}, {"id": "A:C003", "bid": "CB003", "f": "<span class=\"glabel\" style=\"display:block\">You said that X.<\/span><mark>I know that you have already specified that beginners without any experience in paragliding could participate<\/mark><span class=\"dim\">, but I really wanted to insist on that.<\/span>", "b": "<mark>Je sais que vous avez déjà précisé que les débutants sans aucune expérience en parapente pouvaient participer<\/mark><span class=\"dim\">, mais je tenais vraiment à insister là-dessus.<\/span>"}, {"id": "A:C040", "bid": "CB003", "f": "<span class=\"glabel\" style=\"display:block\">You said that X.<\/span><mark>You have also mentioned that one could sleep on the spot<\/mark><span class=\"dim\">, but the security, that worries me a bit.<\/span>", "b": "<mark>Vous avez aussi mentionné qu'on pouvait dormir sur place<\/mark><span class=\"dim\">, mais la sécurité, ça m'inquiète un peu.<\/span>"}, {"id": "A:C079", "bid": "CB003", "f": "<span class=\"glabel\" style=\"display:block\">You said that X.<\/span><mark>You said that it depended on the missions<\/mark><span class=\"dim\">: could you develop this point?<\/span>", "b": "<mark>Vous avez dit qu'elle dépendait des missions<\/mark><span class=\"dim\"> : pourriez-vous développer ce point ?<\/span><span class=\"tags\"><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C120", "bid": "CB003", "f": "<span class=\"glabel\" style=\"display:block\">You said that X.<\/span>You have mentioned on several reprises that your fees are reduced, even nonexistent.", "b": "Vous avez mentionné à plusieurs reprises que vos frais sont réduits, voire inexistants."}, {"id": "A:C067", "bid": "CB042", "f": "<span class=\"glabel\" style=\"display:block\">Right, you already mentioned that.<\/span>Ah yes, it's true. You already told it to me. I had forgotten.", "b": "Ah oui, c'est vrai. Vous me l'avez déjà dit. J'avais oublié."}, {"id": "A:CG010", "bid": "CB086", "f": "<span class=\"glabel\" style=\"display:block\">Sorry if you've already mentioned this, but...<\/span><mark>Pardon me if you have already evoked it, but<\/mark><span class=\"dim\"> your base formula, would it include also tourist guides?<\/span>", "b": "<mark>Pardonnez-moi si vous l'avez déjà évoqué, mais<\/mark><span class=\"dim\"> votre formule de base comprendrait-elle aussi des guides touristiques ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:CG012", "bid": "CB086", "f": "<span class=\"glabel\" style=\"display:block\">Sorry if you've already mentioned this, but...<\/span><mark>I should without doubt have posed you the question from the outset, but<\/mark><span class=\"dim\"> on what subjects do the conferences bear, in general?<\/span>", "b": "<mark>J'aurais sans doute dû vous poser la question d'emblée, mais<\/mark><span class=\"dim\"> sur quels sujets les conférences portent-elles, en général ?<\/span><span class=\"tags\"><span class=\"gr\">cond. passé · idiome<\/span><\/span>"}, {"id": "A:CG013", "bid": "CB086", "f": "<span class=\"glabel\" style=\"display:block\">Sorry if you've already mentioned this, but...<\/span><mark>Pardon me if you have already spoken of it, but<\/mark><span class=\"dim\"> would you also have credit cards to propose?<\/span>", "b": "<mark>Pardonnez-moi si vous en avez déjà parlé, mais<\/mark><span class=\"dim\"> auriez-vous également des cartes de crédit à proposer ?<\/span><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:CG016", "bid": "CB086", "f": "<span class=\"glabel\" style=\"display:block\">Sorry if you've already mentioned this, but...<\/span><mark>Pardon me if you have already mentioned it, but so that it be perfectly clear<\/mark><span class=\"dim\">: is there a notable difference between the formula the least expensive and the one just above? What does the second propose more?<\/span>", "b": "<mark>Pardonnez-moi si vous l'avez déjà mentionné, mais pour que ce soit parfaitement clair<\/mark><span class=\"dim\"> : y a-t-il une différence notable entre la formule la moins chère et celle juste au-dessus ? Que propose la seconde de plus ?<\/span><span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><span class=\"gr\">subj<\/span><\/span>"}]}, {"key": "A-M3", "sec": "A", "code": "M3", "name": "My situation", "bucket": "Context", "items": [{"id": "A:C131", "bid": "CB076", "f": "<span class=\"glabel\" style=\"display:block\">I'm a single 21-year-old student.<\/span><span class=\"dim\">For what concerns the volume, I live currently in a two-room in Paris, and <\/span><mark>I am a student, single, I have twenty-one years<\/mark><span class=\"dim\">, so I really don't have a lot of things.<\/span>", "b": "<span class=\"dim\">Pour ce qui est du volume, j'habite actuellement dans un deux-pièces à Paris, et <\/span><mark>je suis étudiant, célibataire, j'ai vingt et un ans<\/mark><span class=\"dim\">, donc je n'ai vraiment pas beaucoup d'affaires.<\/span>"}, {"id": "A:C130", "bid": "CB075", "f": "<span class=\"glabel\" style=\"display:block\">I live in a one-bedroom apartment in Paris.<\/span><mark>For what concerns the volume, I live currently in a two-room in Paris<\/mark><span class=\"dim\">, and I am a student, single, I have twenty-one years, so I really don't have a lot of things.<\/span>", "b": "<mark>Pour ce qui est du volume, j'habite actuellement dans un deux-pièces à Paris<\/mark><span class=\"dim\">, et je suis étudiant, célibataire, j'ai vingt et un ans, donc je n'ai vraiment pas beaucoup d'affaires.<\/span>"}, {"id": "A:C023", "bid": "CB017", "f": "<span class=\"glabel\" style=\"display:block\">I don't live far from there.<\/span><span class=\"dim\">Well, in fact, that really arranges me, because <\/span><mark>I don't live very far from there.<\/mark>", "b": "<span class=\"dim\">Eh bien, en fait, ça m'arrange vraiment, parce que <\/span><mark>je n'habite pas très loin de là.<\/mark>"}, {"id": "A:C132", "bid": "CB077", "f": "<span class=\"glabel\" style=\"display:block\">I don't have much stuff.<\/span><span class=\"dim\">For what concerns the volume, I live currently in a two-room in Paris, and I am a student, single, I have twenty-one years, so <\/span><mark>I really don't have a lot of things.<\/mark>", "b": "<span class=\"dim\">Pour ce qui est du volume, j'habite actuellement dans un deux-pièces à Paris, et je suis étudiant, célibataire, j'ai vingt et un ans, donc <\/span><mark>je n'ai vraiment pas beaucoup d'affaires.<\/mark>"}, {"id": "A:C133", "bid": "CB077", "f": "<span class=\"glabel\" style=\"display:block\">I don't have much stuff.<\/span><mark>I think that everything can hold in boxes<\/mark><span class=\"dim\">: apart from my sit-stand desk, I have no furniture.<\/span>", "b": "<mark>Je pense que tout peut tenir dans des cartons<\/mark><span class=\"dim\"> : hormis mon bureau assis-debout, je n'ai aucun meuble.<\/span>"}, {"id": "A:C134", "bid": "CB077", "f": "<span class=\"glabel\" style=\"display:block\">I don't have much stuff.<\/span><span class=\"dim\">I think that everything can hold in boxes: <\/span><mark>apart from my sit-stand desk, I have no furniture.<\/mark>", "b": "<span class=\"dim\">Je pense que tout peut tenir dans des cartons : <\/span><mark>hormis mon bureau assis-debout, je n'ai aucun meuble.<\/mark>"}, {"id": "A:C028", "bid": "CB020", "f": "<span class=\"glabel\" style=\"display:block\">I think I have some of those items at home.<\/span>Yes, I think that I have a few of them at home.", "b": "Oui, je pense que j'en ai quelques-uns à la maison."}, {"id": "A:C080", "bid": "CB051", "f": "<span class=\"glabel\" style=\"display:block\">I have a pet.<\/span>Me, I have a dog and a cat.", "b": "Moi, j'ai un chien et un chat.<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:C109", "bid": "CB051", "f": "<span class=\"glabel\" style=\"display:block\">I have a pet.<\/span>Us, we have a little one.", "b": "Nous, on en a un petit.<span class=\"tags\"><span class=\"gr\">dislocation · en/y<\/span><\/span>"}, {"id": "A:C073", "bid": "CB018", "f": "<span class=\"glabel\" style=\"display:block\">There will be N of us.<\/span>I count on coming with a group of five people.", "b": "Je compte venir avec un groupe de cinq personnes."}, {"id": "A:C025", "bid": "CB018", "f": "<span class=\"glabel\" style=\"display:block\">There will be N of us.<\/span>I think of coming with three friends.", "b": "Je pense venir avec trois amis."}, {"id": "A:C141", "bid": "CB018", "f": "<span class=\"glabel\" style=\"display:block\">There will be N of us.<\/span>It would be a group of eight children: my son and seven of his pals.", "b": "Ce serait un groupe de huit enfants : mon fils et sept de ses copains.<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C101", "bid": "CB061", "f": "<span class=\"glabel\" style=\"display:block\">The person I want to give the song to loves Lana Del Rey.<\/span><mark>The person to whom I count on offering this song adores Lana Del Rey<\/mark><span class=\"dim\">, and I would like to slip in there a few winks to her music.<\/span>", "b": "<mark>La personne à qui je compte offrir cette chanson adore Lana Del Rey<\/mark><span class=\"dim\">, et j'aimerais y glisser quelques clins d'œil à sa musique.<\/span>"}, {"id": "A:C050", "bid": "CB036", "f": "<span class=\"glabel\" style=\"display:block\">I know two or three people who could use your service.<\/span>Perfect, because I have precisely two or three people in head who could also have need of your services.", "b": "Parfait, parce que j'ai justement deux ou trois personnes en tête qui pourraient aussi avoir besoin de vos services."}, {"id": "A:C083", "bid": "CB052", "f": "<span class=\"glabel\" style=\"display:block\">I'll be away for nine days.<\/span><span class=\"dim\">So me, <\/span><mark>I leave nine days<\/mark><span class=\"dim\">, so that would make two hundred seventy dollars minimum.<\/span>", "b": "<span class=\"dim\">Alors moi, <\/span><mark>je pars neuf jours<\/mark><span class=\"dim\">, donc ça ferait deux cent soixante-dix dollars minimum.<\/span>"}, {"id": "A:C016", "bid": "CB012", "f": "<span class=\"glabel\" style=\"display:block\">I don't finish work until 7 p.m. on Tuesdays.<\/span><span class=\"dim\">I am not sure that that suits me, because <\/span><mark>the Tuesday, I only finish work at 19 hours.<\/mark>", "b": "<span class=\"dim\">Je ne suis pas sûr que ça me convienne, parce que <\/span><mark>le mardi, je ne finis le travail qu'à 19 heures.<\/mark>"}, {"id": "A:C005", "bid": "CB004", "f": "<span class=\"glabel\" style=\"display:block\">I'm a complete beginner, I've never done this before.<\/span><span class=\"dim\">Not only have I never done paragliding, but <\/span><mark>I have never done anything of this kind.<\/mark>", "b": "<span class=\"dim\">Non seulement je n'ai jamais fait de parapente, mais <\/span><mark>je n'ai jamais rien fait de ce genre.<\/mark>"}, {"id": "A:C004", "bid": "CB004", "f": "<span class=\"glabel\" style=\"display:block\">I'm a complete beginner, I've never done this before.<\/span>Not only have I never done paragliding, but I have never done anything of this kind.", "b": "Non seulement je n'ai jamais fait de parapente, mais je n'ai jamais rien fait de ce genre."}, {"id": "A:C006", "bid": "CB004", "f": "<span class=\"glabel\" style=\"display:block\">I'm a complete beginner, I've never done this before.<\/span>And, to tell you everything, I have never practised an extreme sport, nor anything whatsoever as dangerous.", "b": "Et, pour tout vous dire, je n'ai jamais pratiqué de sport extrême, ni quoi que ce soit d'aussi dangereux.<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}]}, {"key": "A-M4", "sec": "A", "code": "M4", "name": "What I want", "bucket": "Context", "items": [{"id": "A:C097", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span><mark>I would wish to go on a song with the orchestral production<\/mark><span class=\"dim\">, and I would hold to it that it lasts at least three minutes.<\/span>", "b": "<mark>Je souhaiterais partir sur une chanson à la production orchestrale<\/mark><span class=\"dim\">, et je tiendrais à ce qu'elle dure au moins trois minutes.<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C013", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span><span class=\"dim\">Yes, <\/span><mark>I believe that the salsa courses would tempt me well.<\/mark><span class=\"dim\"> Could you confirm to me that the tariff is indeed 45 dollars per course?<\/span>", "b": "<span class=\"dim\">Oui, <\/span><mark>je crois que les cours de salsa me tenteraient bien.<\/mark><span class=\"dim\"> Pourriez-vous me confirmer que le tarif est bien de 45 dollars par cours ?<\/span><span class=\"tags\"><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:C098", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span><span class=\"dim\">I would wish to go on a song with the orchestral production, and <\/span><mark>I would hold to it that it lasts at least three minutes.<\/mark>", "b": "<span class=\"dim\">Je souhaiterais partir sur une chanson à la production orchestrale, et <\/span><mark>je tiendrais à ce qu'elle dure au moins trois minutes.<\/mark><span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:C102", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span><span class=\"dim\">The person to whom I count on offering this song adores Lana Del Rey, and <\/span><mark>I would like to slip in there a few winks to her music.<\/mark>", "b": "<span class=\"dim\">La personne à qui je compte offrir cette chanson adore Lana Del Rey, et <\/span><mark>j'aimerais y glisser quelques clins d'œil à sa musique.<\/mark><span class=\"tags\"><span class=\"gr\">cond · en/y · idiome<\/span><\/span>"}, {"id": "A:C135", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span>I think that I would also need help for the packing.", "b": "Je pense que j'aurais aussi besoin d'aide pour l'emballage.<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C074", "bid": "CB009", "f": "<span class=\"glabel\" style=\"display:block\">I'd like X.<\/span><span class=\"dim\">A boat for five, that will do the affair, but <\/span><mark>it would also be needed that it be safe and reassuring.<\/mark>", "b": "<span class=\"dim\">Un bateau pour cinq, ça fera l'affaire, mais <\/span><mark>il faudrait aussi qu'il soit sûr et rassurant.<\/mark><span class=\"tags\"><span class=\"gr\">dislocation · subj · cond<\/span><\/span>"}, {"id": "A:C088", "bid": "CB053", "f": "<span class=\"glabel\" style=\"display:block\">X is very important to me.<\/span>The travel insurance, for me, it's primordial.", "b": "L'assurance voyage, pour moi, c'est primordial.<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:C142", "bid": "CB053", "f": "<span class=\"glabel\" style=\"display:block\">X is very important to me.<\/span>Because evidently, there will be the meal, but don't you find that it's the activities that make a successful party?", "b": "Parce qu'évidemment, il y aura le repas, mais ne trouvez-vous pas que ce sont les activités qui font une fête réussie ?<span class=\"tags\"><span class=\"gr\">mise en relief<\/span><\/span>"}, {"id": "A:C124", "bid": "CB072", "f": "<span class=\"glabel\" style=\"display:block\">I want to know how long my commute would be.<\/span>I would like to make myself an idea of the duration of the journey.", "b": "J'aimerais me faire une idée de la durée du trajet.<span class=\"tags\"><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:C091", "bid": "CB055", "f": "<span class=\"glabel\" style=\"display:block\">I'd rather look at the menu and choose the items myself.<\/span>For the choice of the breakfast products, I think that it's better that I look at the menu and that I choose myself.", "b": "Pour le choix des produits du petit déjeuner, je pense qu'il vaut mieux que je regarde la carte et que je choisisse moi-même."}, {"id": "A:C114", "bid": "CB066", "f": "<span class=\"glabel\" style=\"display:block\">We want to pick the night with the lecture topic that interests us most.<\/span>We would like to choose the one whose theme interests us the most.", "b": "Nous aimerions choisir celle dont le thème nous intéresse le plus.<span class=\"tags\"><span class=\"gr\">cond · dont/auquel<\/span><\/span>"}, {"id": "A:C100", "bid": "CB060", "f": "<span class=\"glabel\" style=\"display:block\">I don't want X.<\/span>I wouldn't want above all that the composition and the words make kitsch. You see what I want to say?", "b": "Je ne voudrais surtout pas que la composition et les paroles fassent kitsch. Vous voyez ce que je veux dire ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:C094", "bid": "CB060", "f": "<span class=\"glabel\" style=\"display:block\">I don't want X.<\/span>As it's about a surprise, I wouldn't want my friend to have to leave a tip.", "b": "Comme il s'agit d'une surprise, je ne voudrais pas que mon amie ait à laisser un pourboire.<span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:C096", "bid": "CB054", "f": "<span class=\"glabel\" style=\"display:block\">I want to give it as a birthday gift.<\/span><span class=\"dim\">Hello, I permit myself to call you on the subject of your ad: <\/span><mark>I am thinking of offering a song to someone for their birthday.<\/mark>", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler au sujet de votre annonce : <\/span><mark>je songe à offrir une chanson à quelqu'un pour son anniversaire.<\/mark>"}, {"id": "A:C090", "bid": "CB054", "f": "<span class=\"glabel\" style=\"display:block\">I want to give it as a birthday gift.<\/span>I was envisaging to have a breakfast delivered to a friend for her birthday.", "b": "J'envisageais de faire livrer un petit déjeuner à une amie pour son anniversaire."}, {"id": "A:C138", "bid": "CB079", "f": "<span class=\"glabel\" style=\"display:block\">I'm planning a birthday party for my five-year-old son.<\/span><span class=\"dim\">Hello, I permit myself to call you: <\/span><mark>I envisage organising the birthday of my son, who is going to have five years.<\/mark>", "b": "<span class=\"dim\">Bonjour, je me permets de vous appeler : <\/span><mark>j'envisage d'organiser l'anniversaire de mon fils, qui va avoir cinq ans.<\/mark>"}, {"id": "A:C108", "bid": "CB063", "f": "<span class=\"glabel\" style=\"display:block\">We might have parties sometimes.<\/span>What are the rules in matter of noise at night in the apartment, in case we would organise parties, that kind of thing?", "b": "Quelles sont les règles en matière de bruit la nuit dans l'appartement, au cas où nous organiserions des soirées, ce genre de choses ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:C020", "bid": "CB014", "f": "<span class=\"glabel\" style=\"display:block\">I can't wait to take some pictures.<\/span>Frankly, I have haste to take a few photos.", "b": "Franchement, j'ai hâte de prendre quelques photos."}]}, {"key": "A-M5", "sec": "A", "code": "M5", "name": "What I assume or don't know", "bucket": "Context", "items": [{"id": "A:C089", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span>I suppose that we will travel in group, since there is a guide.", "b": "Je suppose que nous voyagerons en groupe, puisqu'il y a un guide."}, {"id": "A:C076", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span><mark>I don't doubt that you furnish life jackets<\/mark><span class=\"dim\">, but in case we would need to be rescued, do you propose a medical assistance, first aid and a rescue service?<\/span>", "b": "<mark>Je ne doute pas que vous fournissiez des gilets de sauvetage<\/mark><span class=\"dim\">, mais au cas où nous aurions besoin d'être secourus, proposez-vous une assistance médicale, des premiers secours et un service de sauvetage ?<\/span><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:C110", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span><span class=\"dim\">And, on that subject, what is the amount of the guarantee deposit? Because <\/span><mark>I imagine that it would be necessary that we pay one, could you confirm it to me?<\/mark>", "b": "<span class=\"dim\">Et, à ce propos, quel est le montant du dépôt de garantie ? Car <\/span><mark>j'imagine qu'il faudrait que nous en versions un, pourriez-vous me le confirmer ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><span class=\"st\"><b>6a<\/b> Puis-je confirmer que…<\/span><span class=\"gr\">subj · cond · en/y<\/span><\/span>"}, {"id": "A:C123", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span>I imagine that the courses take place in person, it being about cooking courses.", "b": "J'imagine que les cours ont lieu en présentiel, s'agissant de cours de cuisine."}, {"id": "A:C129", "bid": "CB048", "f": "<span class=\"glabel\" style=\"display:block\">I assume that X.<\/span>I imagine that it's quite hot the afternoon.", "b": "J'imagine qu'il fait assez chaud l'après-midi."}, {"id": "A:C078", "bid": "CB050", "f": "<span class=\"glabel\" style=\"display:block\">As I understand it, X.<\/span><mark>I believe I understand that roughly, we will buy the services of other people<\/mark><span class=\"dim\">, but then, how do things go?<\/span>", "b": "<mark>Je crois comprendre qu'en gros, nous achèterons les services d'autres personnes<\/mark><span class=\"dim\">, mais ensuite, comment les choses se passent-elles ?<\/span>"}, {"id": "A:C082", "bid": "CB050", "f": "<span class=\"glabel\" style=\"display:block\">As I understand it, X.<\/span><mark>I know that you ensure at the same time the guarding at home and the guarding in a host family<\/mark><span class=\"dim\">: is there a notable difference of price between the two?<\/span>", "b": "<mark>Je sais que vous assurez à la fois la garde à domicile et la garde en famille d'accueil<\/mark><span class=\"dim\"> : y a-t-il une différence notable de prix entre les deux ?<\/span><span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:C145", "bid": "CB080", "f": "<span class=\"glabel\" style=\"display:block\">To me, either you can ride a horse or you can't.<\/span><span class=\"dim\">Because, <\/span><mark>in my mind, either one knows how to ride a horse, or one doesn't know.<\/mark>", "b": "<span class=\"dim\">Parce que, <\/span><mark>dans mon esprit, soit on sait monter à cheval, soit on ne sait pas.<\/mark>"}, {"id": "A:C119", "bid": "CB069", "f": "<span class=\"glabel\" style=\"display:block\">With an online bank we have to rely on the phone or your website.<\/span><span class=\"dim\">And what would be the advantage of an online account in relation to a traditional bank, where one can go to the branch, whereas <\/span><mark>with you, it's necessary to pass by the telephone or by your site<\/mark><span class=\"dim\">?<\/span>", "b": "<span class=\"dim\">Et quel serait l'avantage d'un compte en ligne par rapport à une banque traditionnelle, où l'on peut se rendre en agence, alors qu'<\/span><mark>avec vous, il faut passer par le téléphone ou par votre site<\/mark><span class=\"dim\"> ?<\/span>"}, {"id": "A:C122", "bid": "CB071", "f": "<span class=\"glabel\" style=\"display:block\">With online banks I sometimes see really high interest rates, like four or five percent.<\/span><span class=\"dim\">Because <\/span><mark>with the online banks, I see sometimes some rates really high, of the order of four to five percent.<\/mark>", "b": "<span class=\"dim\">Car <\/span><mark>avec les banques en ligne, je vois parfois des taux vraiment élevés, de l'ordre de quatre à cinq pour cent.<\/mark><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:C095", "bid": "CB008", "f": "<span class=\"glabel\" style=\"display:block\">I guess it depends on which one I choose.<\/span><mark>I imagine that that depends on the product<\/mark><span class=\"dim\">, in which case I would like to know the delays proper to each option.<\/span>", "b": "<mark>J'imagine que cela dépend du produit<\/mark><span class=\"dim\">, auquel cas j'aimerais connaître les délais propres à chaque option.<\/span>"}, {"id": "A:C012", "bid": "CB008", "f": "<span class=\"glabel\" style=\"display:block\">I guess it depends on which one I choose.<\/span>I imagine that the price varies according to the type of dance course.", "b": "J'imagine que le prix varie selon le type de cours de danse."}, {"id": "A:C072", "bid": "CB008", "f": "<span class=\"glabel\" style=\"display:block\">I guess it depends on which one I choose.<\/span>I suspect that that varies from one site to the other, but what is it as a general rule?", "b": "Je me doute que cela varie d'un site à l'autre, mais qu'en est-il en règle générale ?<span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela d >"}, {"id": "A:C127", "bid": "CB062", "f": "<span class=\"glabel\" style=\"display:block\">I'm worried about X.<\/span><span class=\"dim\">Pardon me if my question can appear naive, but <\/span><mark>what makes me particularly afraid in this kind of farm, it's the bees and the wasps<\/mark><span class=\"dim\">, seeing that there are fruits, vegetables and flowers a bit everywhere.<\/span>", "b": "<span class=\"dim\">Pardonnez-moi si ma question peut paraître naïve, mais <\/span><mark>ce qui me fait particulièrement peur dans ce genre de ferme, ce sont les abeilles et les guêpes<\/mark><span class=\"dim\">, vu qu'il y a des fruits, des légumes et des fleurs un peu partout.<\/span><span class=\"tags\"><span class=\"gr\">mise en relief<\/span><\/span>"}, {"id": "A:C104", "bid": "CB062", "f": "<span class=\"glabel\" style=\"display:block\">I'm worried about X.<\/span>What worries me with an apartment on the last floor, it's the risk of earthquake: I would want to assure myself that the foundations of the building are sufficiently solid and conform to the anti-seismic norms.", "b": "Ce qui m'inquiète avec un appartement au dernier étage, c'est le risque de tremblement de terre : je voudrais m'assurer que les fondations de l'immeuble sont suffisamment solides et conformes aux normes antisismiques.<span class=\"tags\"><span class=\"gr\">mise en relief · cond<\/span><\/span>"}, {"id": "A:C105", "bid": "CB062", "f": "<span class=\"glabel\" style=\"display:block\">I'm worried about X.<\/span>Other thing that worries me: in what measure is the apartment equipped in case of fire?", "b": "Autre chose qui m'inquiète : dans quelle mesure l'appartement est-il équipé en cas d'incendie ?"}, {"id": "A:C144", "bid": "CB062", "f": "<span class=\"glabel\" style=\"display:block\">I'm worried about X.<\/span>A fear that I have always had, it's to fall from a horse and that the horse gives me a kick of the hoof while I am on the ground.", "b": "Une peur que j'ai toujours eue, c'est de tombe s différents de nouvelles expériences.<\/span>"}, {"id": "B:BP1017", "bid": "BAY045", "f": "<span class=\"glabel\" style=\"display:block\">Time flies as we age because of routine.<\/span>The more you get old, the more time flies, and that, according to studies, it's because you redo the same things without stop, and your brain goes a bit numb in the routine.", "b": "Plus tu vieillis, plus le temps file, et ça, d'après des études, c'est parce que tu refais sans arrêt les mêmes choses, et que ton cerveau s'engourdit un peu dans la routine."}, {"id": "B:BP1019", "bid": "BAY046", "f": "<span class=\"glabel\" style=\"display:block\">Time feels slow for kids because every day is new.<\/span>Look, if time seems a lot slower when one is a kid, it's because every day, it's a new experience for us.", "b": "Regarde, si le temps paraît beaucoup plus lent quand on est gamin, c'est parce que chaque jour, c'est une nouvelle expérience pour nous."}, {"id": "B:BP1018", "bid": "BAY047", "f": "<span class=\"glabel\" style=\"display:block\">New experiences stop time from flying by.<\/span><span class=\"dim\">And <\/span><mark>what prevents that, it's to chain plenty of new experiences.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>ce qui empêche ça, c'est d'enchaîner plein de nouvelles expériences.<\/mark>"}, {"id": "B:BP1020", "bid": "BAY048", "f": "<span class=\"glabel\" style=\"display:block\">As adults, we can slow time by trying new things.<\/span>So that, it's a thing that one can reproduce at the adult age: it suffices to attempt new experiences, whether they're good or bad.", "b": "Donc ça, c'est un truc qu'on peut reproduire à l'âge adulte : il suffit de tenter de nouvelles expériences, qu'elles soient bonnes ou mauvaises."}, {"id": "B:BP0897", "bid": "BAY049", "f": "<span class=\"glabel\" style=\"display:block\">It's original but also useful.<\/span><span class=\"dim\">Me, I just told myself that it could please you, if you're looking for a thing a bit different to do
