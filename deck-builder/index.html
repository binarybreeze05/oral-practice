eally relaxed and friendly.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>vu comment ils présentent le truc, l'ambiance a l'air super détendue et sympa.<\/mark>"}, {"id": "B:BP0794", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span><span class=\"dim\">We’d get to chat with neighbors and friends, and <\/span><mark>the whole vibe sounds pretty relaxed.<\/mark>", "b": "<span class=\"dim\">On discuterait avec les voisins, les amis, et <\/span><mark>l'ambiance a l'air plutôt détendue.<\/mark>"}, {"id": "B:BP0241", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span>And honestly, the whole thing sounds pretty chill.", "b": "Et franchement, tout ça a l'air plutôt tranquille."}, {"id": "B:BP0807", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span><span class=\"dim\">I get why you’re worried about having to deal with people and negotiate prices, but <\/span><mark>I really think it’ll be pretty relaxed.<\/mark>", "b": "<span class=\"dim\">Je comprends que ça t'inquiète de devoir gérer les gens et de négocier les prix, mais <\/span><mark>franchement, je pense que ce sera plutôt tranquille.<\/mark>"}, {"id": "B:BP0808", "bid": "BAY056", "f": "<span class=\"glabel\" style=\"display:block\">The atmosphere sounds relaxed.<\/span>I don’t think anyone’s going to be super intense about bargaining.", "b": "Je pense pas que les gens soient hyper à fond sur le marchandage."}, {"id": "B:BP0011", "bid": "BAY057", "f": "<span class=\"glabel\" style=\"display:block\">You can hang out and relax.<\/span>You can hang out, make a fire, take your time, relax, all that.", "b": "Tu traînes, tu fais un feu, tu prends ton temps, tu te détends, tout ça, quoi."}, {"id": "B:BP0003", "bid": "BAY058", "f": "<span class=\"glabel\" style=\"display:block\">You'd be out in beautiful nature.<\/span><span class=\"dim\">It honestly sounds really interesting because <\/span><mark>you get to be out in nature<\/mark><span class=\"dim\"> and see some of the most beautiful landscapes in the region.<\/span>", "b": "<span class=\"dim\">Franchement, ça a l'air vraiment intéressant, vu que <\/span><mark>t'es en pleine nature<\/mark><span class=\"dim\"> et que tu peux voir quelques-uns des plus beaux paysages du coin.<\/span>"}, {"id": "B:BP0004", "bid": "BAY058", "f": "<span class=\"glabel\" style=\"display:block\">You'd be out in beautiful nature.<\/span><span class=\"dim\">It honestly sounds really interesting because you get to be out in nature and <\/span><mark>see some of the most beautiful landscapes in the region<\/mark><span class=\"dim\">.<\/span>", "b": "<span class=\"dim\">Franchement, ça a l'air vraiment intéressant, vu que t'es en pleine nature et que <\/span><mark>tu peux voir quelques-uns des plus beaux paysages du coin<\/mark><span class=\"dim\">.<\/span>"}, {"id": "B:BP0687", "bid": "BAY059", "f": "<span class=\"glabel\" style=\"display:block\">You might see the animals up close.<\/span>You might even get to see the wolves through the cabin windows or something like that.", "b": "Tu pourrais même apercevoir les loups par les fenêtres du chalet, ou un truc comme ça."}, {"id": "B:BP0222", "bid": "BAY060", "f": "<span class=\"glabel\" style=\"display:block\">We'd get to travel all over the world.<\/span><span class=\"dim\">You basically become a travel tester, and <\/span><mark>if we signed up to do it for them, we'd get the chance to travel all over the world.<\/mark>", "b": "<span class=\"dim\">En gros, tu deviens testeur de voyages, et <\/span><mark>si on s'inscrivait chez eux pour faire ça, on aurait la chance de voyager partout dans le monde.<\/mark>"}, {"id": "B:BP0835", "bid": "BAY061", "f": "<span class=\"glabel\" style=\"display:block\">You'd travel and work at the same time.<\/span><mark>You'd basically get to travel and work at the same time<\/mark><span class=\"dim\">, and I don't think the actual tasks would be that hard or exhausting.<\/span>", "b": "<mark>Concrètement, tu voyagerais tout en bossant<\/mark><span class=\"dim\">, et je pense pas que les tâches en elles-mêmes soient si dures ou si fatigantes que ça.<\/span>"}, {"id": "B:BP0242", "bid": "BAY062", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't even sound like a normal job.<\/span>It doesn't even sound like a normal job.", "b": "Ça ressemble même pas à un boulot normal."}, {"id": "B:BP0393", "bid": "BAY063", "f": "<span class=\"glabel\" style=\"display:block\">You'd get to see movies before everyone else.<\/span><mark>Basically, you’d get access to movie previews<\/mark><span class=\"dim\">, you’d have the chance to share your opinions with different juries, and you’d get some free movie tickets.<\/span>", "b": "<mark>En gros, t'aurais accès à des avant-premières<\/mark><span class=\"dim\">, tu pourrais donner ton avis à différents jurys, et t'aurais des places de ciné gratuites.<\/span>"}, {"id": "B:BP0564", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span>There’d be plenty of other things to do.", "b": "Y aurait plein d'autres choses à faire."}, {"id": "B:BP0561", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span><mark>We could go to some of the debates<\/mark><span class=\"dim\">, check out the food stands, try some organic and local food, or just sit down on a bench somewhere and rest for a while.<\/span>", "b": "<mark>On pourrait aller voir quelques débats<\/mark><span class=\"dim\">, faire un tour aux stands de bouffe, goûter des trucs bio et locaux, ou juste se poser sur un banc quelque part et souffler un moment.<\/span>"}, {"id": "B:BP0562", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span><span class=\"dim\">We could go to some of the debates, <\/span><mark>check out the food stands, try some organic and local food<\/mark><span class=\"dim\">, or just sit down on a bench somewhere and rest for a while.<\/span>", "b": "<span class=\"dim\">On pourrait aller voir quelques débats, <\/span><mark>faire un tour aux stands de bouffe, goûter des trucs bio et locaux<\/mark><span class=\"dim\">, ou juste se poser sur un banc quelque part et souffler un moment.<\/span>"}, {"id": "B:BP0792", "bid": "BAY064", "f": "<span class=\"glabel\" style=\"display:block\">There'd be lots of things to do there.<\/span>We could sell our stuff, have a look around and maybe buy a few things too, like clothes or whatever.", "b": "On pourrait vendre nos affaires, faire un tour, et peut-être acheter deux-trois bricoles aussi, des vêtements ou des trucs comme ça."}, {"id": "B:BP0219", "bid": "BAY065", "f": "<span class=\"glabel\" style=\"display:block\">There's a big party at the end.<\/span><span class=\"dim\">And <\/span><mark>apparently there's even a big party at the finish, so I think it could be a really great time.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>apparemment, y a même une grosse fête de prévue à l'arrivée, donc je pense que ça pourrait vraiment être un super moment.<\/mark>"}, {"id": "B:BP0114", "bid": "BAY066", "f": "<span class=\"glabel\" style=\"display:block\">You could share your tastes and opinions.<\/span>You could share your tastes, the things you like, whatever you're into.", "b": "Tes goûts, les trucs que t'aimes, tout ce qui te plaît — tu pourrais partager tout ça, quoi."}, {"id": "B:BP0394", "bid": "BAY066", "f": "<span class=\"glabel\" style=\"display:block\">You could share your tastes and opinions.<\/span><span class=\"dim\">Basically, you’d get access to movie previews, <\/span><mark>you’d have the chance to share your opinions with different juries<\/mark><span class=\"dim\">, and you’d get some free movie tickets.<\/span>", "b": "<span class=\"dim\">En gros, t'aurais accès à des avant-premières, <\/span><mark>tu pourrais donner ton avis à différents jurys<\/mark><span class=\"dim\">, et t'aurais des places de ciné gratuites.<\/span>"}, {"id": "B:BP0173", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span>It’s not like you’d be stuck eating the same thing every time.", "b": "C'est pas comme si t'allais être coincé à manger la même chose à chaque fois."}, {"id": "B:BP0172", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span>The ad actually says they have a varied menu, so you could order all kinds of different food, like local dishes or vegetarian options if you’re vegetarian.", "b": "Justement, la pub dit qu'ils ont des menus variés, donc tu pourrais commander plein de plats différents, comme de la cuisine locale ou des plats végétariens si t'es végétarien."}, {"id": "B:BP0179", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span><mark>With this, you’d still have a choice of different meals<\/mark><span class=\"dim\">, and the ad doesn’t say you have to order the same type of food every time.<\/span>", "b": "<mark>Avec ça, t'aurais quand même le choix entre différents repas<\/mark><span class=\"dim\">, et la pub dit pas qu'il faut commander le même genre de plats à chaque fois.<\/span>"}, {"id": "B:BP0180", "bid": "BAY067", "f": "<span class=\"glabel\" style=\"display:block\">You'd have lots of choice; it wouldn't always be the same.<\/span><span class=\"dim\">With this, you’d still have a choice of different meals, and <\/span><mark>the ad doesn’t say you have to order the same type of food every time.<\/mark>", "b": "<span class=\"dim\">Avec ça, t'aurais quand même le choix entre différents repas, et <\/span><mark>la pub dit pas qu'il faut commander le même genre de plats à chaque fois.<\/mark>"}, {"id": "B:BP0181", "bid": "BAY068", "f": "<span class=\"glabel\" style=\"display:block\">Variety wouldn't really be a problem.<\/span>And honestly, I don’t think variety would be that big of a problem anyway.", "b": "Et honnêtement, dans tous les cas, je pense pas que ce soit un si gros problème que ça, la variété."}, {"id": "B:BP0182", "bid": "BAY069", "f": "<span class=\"glabel\" style=\"display:block\">You don't have much variety now either.<\/span>It’s not like you order from a completely different restaurant every single day now.", "b": "<mark>C'est pas comme si tu commandais dans un resto complètement différent tous les jours<\/mark><span class=\"dim\">, hein.<\/span>"}, {"id": "B:BP0516", "bid": "BAY070", "f": "<span class=\"glabel\" style=\"display:block\">You might end up really liking it.<\/span>And who knows? Maybe we’ll actually like it.", "b": "Et puis qui sait ? Peut-être que ça va nous plaire, au final."}, {"id": "B:BP0266", "bid": "BAY070", "f": "<span class=\"glabel\" style=\"display:block\">You might end up really liking it.<\/span><span class=\"dim\">But <\/span><mark>if you try it once, then twice, then a few more times, who knows? You might actually end up really enjoying cooking<\/mark><span class=\"dim\">, and maybe it could even become a new passion for you.<\/span>", "b": "<span class=\"dim\">Mais <\/span><mark>si t'essaies une fois, puis deux, puis encore quelques fois, qui sait ? Tu pourrais finir par vraiment aimer cuisiner<\/mark><span class=\"dim\">, et peut-être même que ça deviendrait une nouvelle passion pour toi.<\/span>"}, {"id": "B:BP1025", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><mark>What if you find this really fun and this could become a new hobby for you<\/mark><span class=\"dim\">, and you're so good that a whole hall of people clap for you and cheer for you, and you just feel so appreciated and so fulfilled.<\/span>", "b": "<mark>Imagine : tu trouves ça hyper sympa, ça devient ton nouveau passe-temps<\/mark><span class=\"dim\">, t'es tellement bon qu'une salle entière t'applaudit et t'acclame, et tu te sens super apprécié, super épanoui.<\/span>"}, {"id": "B:BP0066", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span>If you’ve been looking for something fun to do in the evening, it could even become a regular thing you do once a month.", "b": "<span class=\"dim\">Et <\/span><mark>si jamais tu cherches quelque chose de sympa à faire le soir, ça pourrait même devenir un truc régulier, que tu ferais une fois par mois.<\/mark>"}, {"id": "B:BP0144", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><span class=\"dim\">I’m only asking because I saw an ad yesterday evening for gardening classes, <\/span><mark>and honestly, it seems like it could be a really nice hobby.<\/mark>", "b": "<span class=\"dim\">Je te demande ça juste parce que j'ai vu une pub hier soir pour des cours de jardinage, <\/span><mark>et franchement, j'ai l'impression que ça pourrait être un passe-temps vraiment sympa.<\/mark>"}, {"id": "B:BP0267", "bid": "BAY071", "f": "<span class=\"glabel\" style=\"display:block\">It could become a new hobby for you.<\/span><span class=\"dim\">You might actually end up really enjoying cooking, and <\/span><mark>maybe it could even become a new passion for you.<\/mark>", "b": "<span class=\"dim\">Tu pourrais finir par vraiment aimer cuisiner, et <\/span><mark>peut-être même que ça deviendrait une nouvelle passion pour toi.<\/mark>"}, {"id": "B:BP0151", "bid": "BAY072", "f": "<span class=\"glabel\" style=\"display:block\">Later, you'd see the results growing.<\/span>Then a month later, you’d go back to your garden and actually have new plants growing.", "b": "Et puis un mois plus tard, tu reviendrais dans ton jardin, et là, t'aurais vraiment des nouvelles plantes en train de pousser."}, {"id": "B:BP0157", "bid": "BAY073", "f": "<span class=\"glabel\" style=\"display:block\">You'd have something lasting afterwards.<\/span><span class=\"dim\">And <\/span><mark>even after the class was over, you’d still have your garden to take care of.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>même une fois le cours fini, t'aurais toujours ton jardin à entretenir.<\/mark>"}, {"id": "B:BP0152", "bid": "BAY074", "f": "<span class=\"glabel\" style=\"display:block\">After that, it would be a lot more fun.<\/span>From that point on, gardening would probably be a lot more fun.", "b": "À partir de là, le jardinage, ce serait sûrement beaucoup plus marrant."}, {"id": "B:BP0956", "bid": "BAY075", "f": "<span class=\"glabel\" style=\"display:block\">It can be a fun replacement.<\/span><span class=\"dim\">And <\/span><mark>this can be a fun replacement.<\/mark>", "b": "<span class=\"dim\">Alors que <\/span><mark>ça, ça peut être une alternative sympa.<\/mark>"}, {"id": "B:BP0957", "bid": "BAY076", "f": "<span class=\"glabel\" style=\"display:block\">You won't do it enough for it to feel like a chore.<\/span>You're probably not gonna be doing this enough for it to start seeming like a chore.", "b": "Tu vas sûrement pas en faire assez pour que ça commence à ressembler à une corvée."}, {"id": "B:BP0869", "bid": "BAY077", "f": "<span class=\"glabel\" style=\"display:block\">We'd come back with great memories.<\/span><mark>We’d come back with so many great memories from the trip<\/mark><span class=\"dim\">, and I think we’d feel like it was totally worth it.<\/span>", "b": "<mark>On reviendrait avec plein de super souvenirs du voyage<\/mark><span class=\"dim\">, et je pense qu'on se dirait que ça en valait vraiment la peine.<\/span>"}, {"id": "B:BP0776", "bid": "BAY078", "f": "<span class=\"glabel\" style=\"display:block\">They film it, so we'd have videos to look back on.<\/span>Plus, they have a service where they take photos and videos of the whole thing, so afterward we’d actually have something to look back on.", "b": "En plus de ça, ils ont un service où ils prennent des photos et des vidéos de tout le truc, du coup après, on aurait vraiment des souvenirs à garder."}, {"id": "B:BP0777", "bid": "BAY078", "f": "<span class=\"glabel\" style=\"display:block\">They film it, so we'd have videos to look back on.<\/span>We could rewatch the videos later and remember the whole experience.", "b": "On pourrait se repasser les vidéos plus tard et se rappeler toute l'expérience."}, {"id": "B:BP0528", "bid": "BAY079", "f": "<span class=\"glabel\" style=\"display:block\">We'd have a great story to tell.<\/span><span class=\"dim\">The real reason is that it’d be such an unusual experience, and <\/span><mark>we’d have a great story to tell our friends afterward.<\/mark>", "b": "<span class=\"dim\">La vraie raison, c'est que ce serait une expérience vraiment insolite, et <\/span><mark>après, on aurait une super histoire à raconter aux copains.<\/mark>"}, {"id": "B:BP1034", "bid": "BAY079", "f": "<span class=\"glabel\" style=\"display:block\">We'd have a great story to tell.<\/span>It'll be a cool story for both of us to tell.", "b": "Ça nous fera une histoire cool à raconter, à tous les deux."}, {"id": "B:BP0534", "bid": "BAY079", "f": "<span class=\"glabel\" style=\"display:block\">We'd have a great story to tell.<\/span>If we actually did it, we’d have something interesting to talk about, especially with other people who care about ecology.", "b": "Si on le faisait vraiment, on aurait un truc intéressant à raconter, surtout avec d'autres gens que l'écologie intéresse."}, {"id": "B:BP0535", "bid": "BAY080", "f": "<span class=\"glabel\" style=\"display:block\">Maybe the media would want to hear about it.<\/span>Who knows, maybe blogs, publications, or media people would even be interested in hearing about what the experience was like.", "b": "Et qui sait, peut-être même que des blogs, des magazines ou des gens des médias voudraient bien savoir comment c'était, cette expérience."}, {"id": "B:BP0050", "bid": "BAY081", "f": "<span class=\"glabel\" style=\"display:block\">It would look great on social media.<\/span><span class=\"dim\">And yeah, <\/span><mark>it would probably look great on Instagram too.<\/mark>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>en plus, ça rendrait sûrement super bien sur Instagram.<\/mark>"}, {"id": "B:BP1026", "bid": "BAY082", "f": "<span class=\"glabel\" style=\"display:block\">People might cheer for you and you'd feel proud.<\/span><span class=\"dim\">What if you find this really fun and this could become a new hobby for you, and <\/span><mark>you're so good that a whole hall of people clap for you and cheer for you, and you just feel so appreciated and so fulfilled.<\/mark>", "b": "<span class=\"dim\">Imagine : tu trouves ça hyper sympa, ça devient ton nouveau passe-temps, <\/span><mark>t'es tellement bon qu'une salle entière t'applaudit et t'acclame, et tu te sens super apprécié, super épanoui.<\/mark>"}, {"id": "B:BP0054", "bid": "BAY083", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to celebrate.<\/span>You know, sometimes you have to celebrate.", "b": "Tu sais, des fois, faut marquer le coup."}, {"id": "B:BP1035", "bid": "BAY084", "f": "<span class=\"glabel\" style=\"display:block\">We should do silly things sometimes.<\/span>I don't know, I think we should kinda do stupid stuff sometimes.", "b": "Enfin, je sais pas, je me dis qu'on devrait faire des trucs un peu débiles parfois."}, {"id": "B:BP1122", "bid": "BAY085", "f": "<span class=\"glabel\" style=\"display:block\">It was exciting at first, then it became fun.<\/span>At first I was getting so much adrenaline, then it quickly became fun.", "b": "Au début, j'avais des montées d'adrénaline de dingue, et après, très vite, j'ai commencé à m'éclater."}, {"id": "B:BP1123", "bid": "BAY086", "f": "<span class=\"glabel\" style=\"display:block\">I couldn't stop, even when I was tired.<\/span>I couldn't stop even if it exhausted me.", "b": "J'arrivais plus à m'arrêter, même si ça m'épuisait."}, {"id": "B:BP1124", "bid": "BAY087", "f": "<span class=\"glabel\" style=\"display:block\">I think you'll feel the same.<\/span>I think you'll feel the same.", "b": "<span class=\"dim\">Et <\/span><mark>je suis sûr que ce sera pareil pour toi.<\/mark>"}]}, {"key": "B-BA4", "sec": "B", "code": "BA4", "name": "Growth & skills", "bucket": "Arguments", "items": [{"id": "B:BP0120", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span><span class=\"dim\">And <\/span><mark>it would push you a little outside your comfort zone too.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>en plus, ça te ferait sortir un peu de ta zone de confort.<\/mark>"}, {"id": "B:BP0072", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span>Plus, it’s a chance to get out of your comfort zone a little.", "b": "En plus de ça, c'est l'occasion de sortir un peu de ta zone de confort."}, {"id": "B:BP0198", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span><mark>I think it would push us to get out of our comfort zone and test our limits a little<\/mark><span class=\"dim\">, and it could be a really good experience for all of us.<\/span>", "b": "<mark>Je pense que ça nous pousserait à sortir de notre zone de confort et à tester un peu nos limites<\/mark><span class=\"dim\">, et franchement, ça pourrait être une super expérience pour nous tous.<\/span>"}, {"id": "B:BP0760", "bid": "BAY088", "f": "<span class=\"glabel\" style=\"display:block\">It would push you out of your comfort zone.<\/span>It would push us out of our comfort zone and give us the chance to do something we’d normally never do.", "b": "Ça nous ferait sortir de notre zone de confort, et ça nous donnerait l'occasion de faire un truc qu'on ferait jamais en temps normal."}, {"id": "B:BP0263", "bid": "BAY089", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to leave your comfort zone.<\/span>Sometimes you have to get out of your comfort zone.", "b": "Des fois, faut sortir de sa zone de confort."}, {"id": "B:BP0584", "bid": "BAY089", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to leave your comfort zone.<\/span>Sometimes you have to do things that push you out of your comfort zone a little, you know?", "b": "Des fois, faut faire des trucs qui te sortent un peu de ta zone de confort, tu vois ?"}, {"id": "B:BP0599", "bid": "BAY090", "f": "<span class=\"glabel\" style=\"display:block\">Leaving your comfort zone is how you grow.<\/span>That's how you grow, and that's a big part of why I think you should do it.", "b": "C'est comme ça qu'on grandit, et c'est en grande partie pour ça que je pense que tu devrais le faire."}, {"id": "B:BP0713", "bid": "BAY090", "f": "<span class=\"glabel\" style=\"display:block\">Leaving your comfort zone is how you grow.<\/span>You'd have to step out of your comfort zone a little, but I think that could actually be a good thing.", "b": "Il faudrait que tu sortes un peu de ta zone de confort, mais justement, je pense que ça pourrait être une bonne chose."}, {"id": "B:BP0196", "bid": "BAY091", "f": "<span class=\"glabel\" style=\"display:block\">It would give us a real goal to work toward.<\/span>This would give us a real challenge to work toward.", "b": "Là, ça nous donnerait un vrai défi à préparer."}, {"id": "B:BP0187", "bid": "BAY091", "f": "<span class=\"glabel\" style=\"display:block\">It would give us a real goal to work toward.<\/span>This challenge would actually give us a goal.", "b": "Justement, ce défi, ça nous donnerait un vrai but."}, {"id": "B:BP0264", "bid": "BAY092", "f": "<span class=\"glabel\" style=\"display:block\">Good things take effort and sacrifice.<\/span><mark>Good things can take some effort and sacrifice<\/mark><span class=\"dim\">, and right now it probably feels difficult because you just haven’t built those habits yet.<\/span>", "b": "<mark>Les bonnes choses, ça peut demander des efforts et des sacrifices<\/mark><span class=\"dim\">, et là, ça te paraît sûrement difficile juste parce que t'as pas encore pris le pli.<\/span>"}, {"id": "B:BP0372", "bid": "BAY093", "f": "<span class=\"glabel\" style=\"display:block\">That's life: you can't only do fun things.<\/span>I mean, that’s part of life too. You can’t only do things that are fun or that you feel like doing all the time.", "b": "Enfin, ça fait partie de la vie aussi, ça. Tu peux pas faire que des trucs qui te plaisent ou dont t'as envie, tout le temps."}, {"id": "B:BP0371", "bid": "BAY094", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn to do things that aren't always fun.<\/span><span class=\"dim\">But listen, I still think it’s worth trying because it would be a new experience for you, and <\/span><mark>you’d learn how to do things that maybe aren’t always fun or that you don’t necessarily feel like doing.<\/mark>", "b": "<span class=\"dim\">Mais écoute, je pense quand même que ça vaut le coup d'essayer, parce que ce serait une nouvelle expérience pour toi, et <\/span><mark>t'apprendrais à faire des trucs qui sont pas toujours marrants, ou que t'as pas forcément envie de faire.<\/mark>"}, {"id": "B:BP0598", "bid": "BAY095", "f": "<span class=\"glabel\" style=\"display:block\">Doing something scary builds your confidence.<\/span>And actually, this could be a good way to build that confidence—to do something that scares you a little and pushes you out of your comfort zone.", "b": "Et justement, ça pourrait être un bon moyen de prendre confiance — faire un truc qui te fait un peu peur et qui te sort de ta zone de confort."}, {"id": "B:BP0784", "bid": "BAY095", "f": "<span class=\"glabel\" style=\"display:block\">Doing something scary builds your confidence.<\/span>Because it’s not just about the jump itself. It’s also about doing something that scares you and proving to yourself that you can get through it.", "b": "Parce qu'en vrai, c'est pas juste le saut en lui-même. C'est aussi le fait de faire un truc qui te fait peur, et de te prouver que t'es capable de surmonter ça."}, {"id": "B:BP0785", "bid": "BAY096", "f": "<span class=\"glabel\" style=\"display:block\">After this, other things will feel less scary.<\/span>I mean, free-falling out of a plane is probably one of the scariest things you could do. So if you can get past that, a lot of other things are probably going to feel way less intimidating afterward.", "b": "Ce que je veux dire, c'est que sauter d'un avion en chute libre, c'est sans doute un des trucs les plus flippants à faire. Du coup, si t'arrives à dépasser ça, plein d'autres choses vont sûrement te paraître vachement moins impressionnantes après."}, {"id": "B:BP1152", "bid": "BAY097", "f": "<span class=\"glabel\" style=\"display:block\">Afterward, you'll know you can do it again.<\/span>This is an opportunity to learn and have that experience, so later down the line you know you have the muscle in you — you have confidence that you can do it again and again.", "b": "Là, c'est l'occasion d'apprendre et de vivre cette expérience, pour que plus tard, tu saches que t'as les épaules — que tu sois sûr de pouvoir le refaire encore et encore."}, {"id": "B:BP1052", "bid": "BAY097", "f": "<span class=\"glabel\" style=\"display:block\">Afterward, you'll know you can do it again.<\/span>We'll know we have the muscle inside of us that we can flex.", "b": "Là, on saura que ce muscle-là, on l'a en nous, et qu'on peut le faire jouer."}, {"id": "B:BP1057", "bid": "BAY098", "f": "<span class=\"glabel\" style=\"display:block\">It's a different kind of experience that works a different side of you.<\/span>How do you react in those scenarios? That's a different kind of experience.", "b": "<span class=\"dim\">Et toi, <\/span><mark>tu réagis comment dans ces situations-là ? Ça, c'est une expérience d'un autre genre.<\/mark>"}, {"id": "B:BP1054", "bid": "BAY098", "f": "<span class=\"glabel\" style=\"display:block\">It's a different kind of experience that works a different side of you.<\/span>In this scenario, what's at stake isn't yourself, but maybe what's at stake is the people around you. So maybe that fires up a different side of your brain.", "b": "Là, pour le coup, ce qui est en jeu, c'est pas toi ; ce qui est en jeu, c'est peut-être plutôt les gens autour de toi. Alors peut-être que ça, ça active un autre côté de ton cerveau."}, {"id": "B:BP0121", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span><span class=\"dim\">So <\/span><mark>it wouldn't just be fun; you'd also get to learn something new.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>ce serait pas juste marrant : t'apprendrais aussi de nouveaux trucs.<\/mark>"}, {"id": "B:BP0155", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span><mark>You’d be taking the class, learning things<\/mark><span class=\"dim\">, and probably meeting new people too.<\/span>", "b": "<mark>Tu suivrais le cours, t'apprendrais des choses<\/mark><span class=\"dim\">, et tu rencontrerais sûrement des nouvelles personnes, en plus.<\/span>"}, {"id": "B:BP0410", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span><mark>You might learn more about how the industry works<\/mark><span class=\"dim\">, meet interesting people, and maybe even hear about other events or opportunities through them.<\/span>", "b": "<mark>T'en apprendrais peut-être plus sur comment ça marche, ce milieu<\/mark><span class=\"dim\">, tu ferais des rencontres intéressantes, et peut-être même que t'entendrais parler d'autres événements ou d'autres opportunités grâce à eux.<\/span>"}, {"id": "B:BP0433", "bid": "BAY099", "f": "<span class=\"glabel\" style=\"display:block\">You'd learn something new.<\/span>You’d also get a chance to learn more about how to take care of your car yourself.", "b": "Et puis ça te donnerait l'occasion d'en apprendre plus sur comment t'occuper de ta voiture toi-même."}, {"id": "B:BP0154", "bid": "BAY100", "f": "<span class=\"glabel\" style=\"display:block\">You wouldn't just be waiting around.<\/span>If it’s a gardening class, you wouldn’t just be sitting around waiting for your own plants to grow.", "b": "Si c'est un cours de jardinage, tu serais pas juste là à attendre que tes plantes poussent."}, {"id": "B:BP1044", "bid": "BAY101", "f": "<span class=\"glabel\" style=\"display:block\">You could learn a lot from people with more experience.<\/span><span class=\"dim\">They're seniors and they need help, but <\/span><mark>they also have decades of experience, and you never know what you could learn from just being around these people and talking to them.<\/mark>", "b": "<span class=\"dim\">C'est des seniors, ils ont besoin d'aide, d'accord — mais en même temps, <\/span><mark>ils ont des dizaines d'années d'expérience derrière eux, et on sait jamais ce qu'on peut apprendre juste en côtoyant ces gens-là, en discutant avec eux.<\/mark>"}, {"id": "B:BP0159", "bid": "BAY102", "f": "<span class=\"glabel\" style=\"display:block\">Even if you might stop later, you can still learn the basics.<\/span><span class=\"dim\">And <\/span><mark>if you’re worried because you might move, then you could still take the class just for fun and learn the basics.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si ce qui t'inquiète, c'est que tu risques de déménager, tu pourrais quand même suivre le cours juste pour le plaisir, histoire d'apprendre les bases.<\/mark>"}, {"id": "B:BP0444", "bid": "BAY103", "f": "<span class=\"glabel\" style=\"display:block\">That know-how is useful to have.<\/span>Even if you don’t keep fixing your own cars, it’s still useful to have that know-how.", "b": "Même si tu continues pas à réparer ta voiture, n'empêche que c'est utile d'avoir ce savoir-faire."}, {"id": "B:BP0440", "bid": "BAY103", "f": "<span class=\"glabel\" style=\"display:block\">That know-how is useful to have.<\/span><mark>I think it’s useful to know at least the basics of maintaining your own car<\/mark><span class=\"dim\">, because then you’ll have a better idea of what a repair should actually involve and whether a garage might be charging you too much for something simple.<\/span>", "b": "<mark>Moi, je trouve que c'est utile de connaître au moins les bases de l'entretien de sa voiture<\/mark><span class=\"dim\">, parce que comme ça, tu te rendras mieux compte de ce que ça demande vraiment, une réparation, et tu verras si un garage te fait payer trop cher pour un truc simple.<\/span>"}, {"id": "B:BP1060", "bid": "BAY104", "f": "<span class=\"glabel\" style=\"display:block\">It builds people skills and empathy.<\/span>It makes us build empathy with people.", "b": "Et ça nous fait développer de l'empathie pour les gens."}, {"id": "B:BP1059", "bid": "BAY104", "f": "<span class=\"glabel\" style=\"display:block\">It builds people skills and empathy.<\/span>It not only makes us learn these tangible skills like event organization, activity organization, communication, but also helps us learn emotional intelligence.", "b": "Ça nous apprend pas seulement des compétences concrètes — organiser un événement, organiser des activités, communiquer — ça nous aide aussi à travailler notre intelligence émotionnelle."}, {"id": "B:BP1050", "bid": "BAY105", "f": "<span class=\"glabel\" style=\"display:block\">It teaches you to manage when you're under pressure.<\/span><span class=\"dim\">But <\/span><mark>it also teaches us how to just wing it in these scenarios where we're against the wall.<\/mark>", "b": "<span class=\"dim\">N'empêche, <\/span><mark>ça nous apprend à improviser dans ce genre de situations où on est au pied du mur.<\/mark>"}, {"id": "B:BP0752", "bid": "BAY106", "f": "<span class=\"glabel\" style=\"display:block\">You'd find out something about yourself.<\/span>This could actually be a good way to find out whether you're naturally introverted or whether spending so much time behind screens has made you more withdrawn than you otherwise would be.", "b": "<span class=\"dim\">Cela dit, <\/span><mark>ça pourrait justement être un bon moyen de savoir si t'es introverti de nature, ou si c'est le fait de passer autant de temps derrière les écrans qui t'a rendu plus renfermé que ce que tu serais autrement.<\/mark>"}, {"id": "B:BP1015", "bid": "BAY107", "f": "<span class=\"glabel\" style=\"display:block\">It could open your mind to new ideas.<\/span>Think of how much creativity this could help you get by opening doors inside your brain, in terms of creative power that you do not even know exist.", "b": "Imagine tout ce que ça pourrait te débloquer comme créativité, en ouvrant des portes dans ton cerveau — des capacités créatives dont tu soupçonnes même pas l'existence."}, {"id": "B:BP1042", "bid": "BAY107", "f": "<span class=\"glabel\" style=\"display:block\">It could open your mind to new ideas.<\/span>I think these experiences in general, where we help others with nothing to gain ourselves, open up doors and fires up neurons in our brains that we don't know exist and make us think of new ideas, new ways of seeing life, and new perspectives.", "b": "Moi, je pense que ce genre d'expériences en général, celles où on aide les autres sans rien y gagner, ça ouvre des portes et ça allume des neurones qu'on savait même pas qu'on avait dans le cerveau — et du coup, ça nous ouvre à des idées nouvelles, à des nouvelles façons de voir la vie, à des nouvelles perspectives."}, {"id": "B:BP1051", "bid": "BAY108", "f": "<span class=\"glabel\" style=\"display:block\">This skill will help your career later.<\/span>That skill of winging it, knowing we have done this before, will really help us later down the line with our careers, where we're asked to do something we have no experience of, that we don't particularly like, that makes us uncomfortable.", "b": "<span class=\"dim\">Et <\/span><mark>cette capacité à improviser, en sachant qu'on l'a déjà fait, ça va vraiment nous servir plus tard dans nos carrières — le jour où on nous demandera de faire un truc dont on a aucune expérience, qui nous plaît pas spécialement, qui nous met mal à l'aise.<\/mark>"}, {"id": "B:BP1151", "bid": "BAY109", "f": "<span class=\"glabel\" style=\"display:block\">You'll always have to prove yourself to people.<\/span>You have to prove yourself to people.", "b": "Faut faire tes preuves auprès des gens."}, {"id": "B:BP1150", "bid": "BAY109", "f": "<span class=\"glabel\" style=\"display:block\">You'll always have to prove yourself to people.<\/span>Throughout your future career in politics or public service, you'll have hundreds of cases where you're the new person in the room. No one trusts you, no one knows why you're there.", "b": "<span class=\"dim\">Et <\/span><mark>tout au long de ta future carrière en politique ou dans le service public, t'auras des centaines de situations où c'est toi le nouveau. Personne te fait confiance, personne sait pourquoi t'es là.<\/mark>"}, {"id": "B:BP1138", "bid": "BAY110", "f": "<span class=\"glabel\" style=\"display:block\">It's a natural next step for you.<\/span>This is a starting point, a stepping stone for your career.", "b": "C'est un point de départ, un tremplin pour ta carrière."}, {"id": "B:BP0586", "bid": "BAY110", "f": "<span class=\"glabel\" style=\"display:block\">It's a natural next step for you.<\/span>It feels like a natural next step, like taking your writing to another level.", "b": "J'ai l'impression que c'est la suite logique, un peu comme faire passer ton écriture à un autre niveau."}, {"id": "B:BP1137", "bid": "BAY111", "f": "<span class=\"glabel\" style=\"display:block\">It looks good on your resume.<\/span>Advocating for a public cause is definitely something interesting to put in your resume, especially because you're looking for a political career.", "b": "Défendre une cause publique, c'est clairement intéressant à mettre sur un CV, surtout que tu vises une carrière politique."}, {"id": "B:BP1141", "bid": "BAY112", "f": "<span class=\"glabel\" style=\"display:block\">This takes you from wanting change to making it happen.<\/span><span class=\"dim\">And <\/span><mark>this is the stepping stone between having an idea and wanting change, to actually having executed change.<\/mark>", "b": "<span class=\"dim\">Et justement, <\/span><mark>ça, c'est le tremplin qui permet de passer d'une idée, d'une envie de changement, à quelque chose de vraiment concret.<\/mark>"}, {"id": "B:BP1142", "bid": "BAY113", "f": "<span class=\"glabel\" style=\"display:block\">Going from an idea to real change is hard from scratch.<\/span>There's a big gap between these two that is frankly very difficult to achieve from scratch.", "b": "Entre les deux, y a un gros fossé, et franchement, c'est super dur à combler en partant de zéro."}, {"id": "B:BP1143", "bid": "BAY114", "f": "<span class=\"glabel\" style=\"display:block\">You get the experience without starting from scratch.<\/span>This is an opportunity for you to not have to start an association or a movement from scratch, and still have these sorts of activism experiences.", "b": "Là, c'est l'occasion pour toi de pas avoir à monter une asso ou un mouvement à partir de rien, et d'avoir quand même ce genre d'expérience militante."}, {"id": "B:BP0581", "bid": "BAY115", "f": "<span class=\"glabel\" style=\"display:block\">If you win, you could go further with it.<\/span><span class=\"dim\">And you'd have the chance to win a prize, and <\/span><mark>if you won the contest, you could even go on a tour and perform your story at different shows.<\/mark>", "b": "<span class=\"dim\">Et t'aurais la possibilité de gagner un prix, et <\/span><mark>si tu gagnais le concours, tu pourrais même faire une tournée et présenter ton histoire dans plusieurs spectacles.<\/mark>"}, {"id": "B:BP0412", "bid": "BAY116", "f": "<span class=\"glabel\" style=\"display:block\">You might hear about other opportunities.<\/span><span class=\"dim\">You might learn more about how the industry works, meet interesting people, and <\/span><mark>maybe even hear about other events or opportunities through them.<\/mark>", "b": "<span class=\"dim\">T'en apprendrais peut-être plus sur comment ça marche, ce milieu, tu ferais des rencontres intéressantes, et <\/span><mark>peut-être même que t'entendrais parler d'autres événements ou d'autres opportunités grâce à eux.<\/mark>"}, {"id": "B:BP1003", "bid": "BAY117", "f": "<span class=\"glabel\" style=\"display:block\">You can build a good reputation over time.<\/span>The more you sell, the more stars and points you get, the more good reviews you get, and that gives you credibility as a seller.", "b": "Plus tu vends, plus t'as d'étoiles et de points, plus tu reçois de bons avis, et ça, ça te donne de la crédibilité en tant que vendeur."}, {"id": "B:BP1002", "bid": "BAY117", "f": "<span class=\"glabel\" style=\"display:block\">You can build a good reputation over time.<\/span>There's some sort of profile and reputation you can build on this website.", "b": "Y a une sorte de profil et de réputation que tu peux te construire sur ce site."}, {"id": "B:BP1005", "bid": "BAY118", "f": "<span class=\"glabel\" style=\"display:block\">If you start early, you'll have an advantage.<\/span><span class=\"dim\">So <\/span><mark>there's some sort of early-mover advantage to this.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>y a une sorte d'avantage à être arrivé en premier, quoi.<\/mark>"}, {"id": "B:BP1004", "bid": "BAY118", "f": "<span class=\"glabel\" style=\"display:block\">If you start early, you'll have an advantage.<\/span>Because the platform is still in its early stages, if you're going to use this site regularly right now, by the time this site takes off, you'll have become one of t ruc à prendre au sérieux et à essayer de régler."}, {"id": "B:BP0494", "bid": "BAY122", "f": "<span class=\"glabel\" style=\"display:block\">Stress affects every part of your life.<\/span><span class=\"dim\">But I really do think it’s important to deal with the stress, because <\/span><mark>stress ends up affecting every other part of your life.<\/mark>", "b": "<span class=\"dim\">Mais je pense vraiment que c'est important de gérer ce stress, parce que <\/span><mark>le stress, ça finit par toucher tout le reste de ta vie.<\/mark>"}, {"id": "B:BP0462", "bid": "BAY123", "f": "<span class=\"glabel\" style=\"display:block\">Studies show it improves mental health.<\/span>But apparently there are scientific studies showing that having a cat can improve your mental health, help you relax, and things like that.", "b": "Mais apparemment, y a des études scientifiques qui montrent qu'avoir un chat, ça peut améliorer la santé mentale, aider à se détendre, des trucs comme ça."}, {"id": "B:BP0499", "bid": "BAY124", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't only help with stress.<\/span><span class=\"dim\">This would cost way less than that, and <\/span><mark>you wouldn’t just be getting something that could help with stress.<\/mark>", "b": "<span class=\"dim\">Là, ça te reviendrait bien moins cher que ça, et en plus, <\/span><mark>t'aurais pas juste un truc qui peut aider contre le stress.<\/mark>"}, {"id": "B:BP0643", "bid": "BAY125", "f": "<span class=\"glabel\" style=\"display:block\">Getting out would clear your head.<\/span>It might even be good for you just to get out, have a change of scenery, and clear your head a little.", "b": "D'ailleurs, ça pourrait même te faire du bien de sortir, de changer de décor et de te vider un peu la tête."}, {"id": "B:BP0731", "bid": "BAY126", "f": "<span class=\"glabel\" style=\"display:block\">It's a real break from being always connected.<\/span>It's supposed to give you a real break from all the negative sides of being constantly connected.", "b": "C'est censé te faire une vraie coupure avec tous les côtés négatifs du fait d'être tout le temps connecté."}, {"id": "B:BP0864", "bid": "BAY127", "f": "<span class=\"glabel\" style=\"display:block\">It sounds relaxing and comfortable.<\/span><mark>It sounds really relaxing and comfortable<\/mark><span class=\"dim\">, and it would be a whole new experience.<\/span>", "b": "<mark>Ça a l'air vraiment reposant et confortable<\/mark><span class=\"dim\">, et en plus ce serait une expérience complètement nouvelle.<\/span>"}, {"id": "B:BP0741", "bid": "BAY128", "f": "<span class=\"glabel\" style=\"display:block\">Your resistance is exactly the sign you need it.<\/span>If the idea of going just a few days without your phone or social media feels impossible, that's kind of a sign that you probably need the break.", "b": "Si rien que l'idée de passer quelques jours sans ton téléphone ou les réseaux sociaux te semble impossible, c'est un peu le signe que t'as sûrement besoin de décrocher."}, {"id": "B:BP0740", "bid": "BAY128", "f": "<span class=\"glabel\" style=\"display:block\">Your resistance is exactly the sign you need it.<\/span>And yes, that's actually exactly why I think you should do it.", "b": "Bah oui, justement, c'est exactement pour ça que je pense que tu devrais le faire."}, {"id": "B:BP0746", "bid": "BAY128", "f": "<span class=\"glabel\" style=\"display:block\">Your resistance is exactly the sign you need it.<\/span>And the fact that it already sounds tiring to you is another reason I think it could be good for you.", "b": "Et puis, le fait que ça te paraisse déjà fatigant, c'est une raison de plus qui me fait dire que ça pourrait te faire du bien."}, {"id": "B:BP0742", "bid": "BAY129", "f": "<span class=\"glabel\" style=\"display:block\">It would show you how dependent you've become.<\/span>It would show you how dependent you've become on all of it and whether it's already affecting you more than you realize.", "b": "Ça te montrerait à quel point t'es devenu dépendant de tout ça, et si ça t'affecte déjà plus que ce que tu crois."}, {"id": "B:BP0935", "bid": "BAY130", "f": "<span class=\"glabel\" style=\"display:block\">Right now, your only other option is social media.<\/span>Right now, if you don’t feel like going to the library, your alternative is basically just going on social media.", "b": "<span class=\"dim\">Parce que là, <\/span><mark>pour l'instant, si t'as pas envie d'aller à la bibliothèque, ton alternative, en gros, c'est juste les réseaux sociaux, quoi.<\/mark>"}, {"id": "B:BP0928", "bid": "BAY131", "f": "<span class=\"glabel\" style=\"display:block\">You could try a device made for reading.<\/span><span class=\"dim\">I’ve got everything set up on my phone too, but <\/span><mark>you could also try one of those e-readers that are made specifically for reading on a screen.<\/mark>", "b": "<span class=\"dim\">Moi, j'ai tout installé sur mon téléphone aussi, mais sinon, <\/span><mark>tu pourrais essayer une de ces liseuses qui sont faites exprès pour lire sur écran.<\/mark>"}, {"id": "B:BP0929", "bid": "BAY132", "f": "<span class=\"glabel\" style=\"display:block\">It's much easier on your eyes.<\/span>They have a different kind of screen that’s non-reflective or something like that, so it’s much easier on your eyes.", "b": "Elles ont un autre type d'écran, anti-reflets ou un truc comme ça, du coup c'est beaucoup plus reposant pour les yeux."}, {"id": "B:BP0930", "bid": "BAY132", "f": "<span class=\"glabel\" style=\"display:block\">It's much easier on your eyes.<\/span>You can read for hours without your eyes hurting as much.", "b": "Tu peux lire pendant des heures et t'as beaucoup moins mal aux yeux."}]}, {"key": "B-BA6", "sec": "B", "code": "BA6", "name": "People & togetherness", "bucket": "Arguments", "items": [{"id": "B:BP0791", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span>And I’ll come with you, so we can do it together.", "b": "Et puis moi, je viendrai avec toi, comme ça on le fait ensemble."}, {"id": "B:BP0075", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span><span class=\"dim\">And yeah, <\/span><mark>I’ll come with you if you want.<\/mark>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>je viens avec toi si tu veux<\/mark><span class=\"dim\">, hein.<\/span>"}, {"id": "B:BP0755", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span>If you’re up for it, I’d be totally up for doing it with you too.", "b": "Et si ça te tente, moi aussi ça me dirait carrément de le faire avec toi."}, {"id": "B:BP0813", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span>Would you be more motivated to do it if I signed up too?", "b": "Ça te motiverait plus si je m'inscrivais aussi ?"}, {"id": "B:BP0064", "bid": "BAY134", "f": "<span class=\"glabel\" style=\"display:block\">You won't be alone; you'd have company.<\/span><span class=\"dim\">Yeah, you’re right, but <\/span><mark>you don’t have to do it alone.<\/mark>", "b": "<span class=\"dim\">Ouais, t'as raison, mais <\/span><mark>t'es pas obligé de le faire tout seul.<\/mark>"}, {"id": "B:BP0500", "bid": "BAY134", "f": "<span class=\"glabel\" style=\"display:block\">You won't be alone; you'd have company.<\/span><mark>You’d also have company<\/mark><span class=\"dim\">, you’d have something new to do, and it would be a bit of a change of scenery for you.<\/span>", "b": "<mark>T'aurais aussi de la compagnie<\/mark><span class=\"dim\">, t'aurais quelque chose de nouveau à faire, et ça te ferait un peu de changement.<\/span>"}, {"id": "B:BP0065", "bid": "BAY135", "f": "<span class=\"glabel\" style=\"display:block\">You can go with friends or family.<\/span>You could go with family or friends.", "b": "Tu pourrais y aller en famille ou avec des potes."}, {"id": "B:BP0690", "bid": "BAY135", "f": "<span class=\"glabel\" style=\"display:block\">You can go with friends or family.<\/span>And I don’t see why you’d have to do it with family.", "b": "Après, je vois pas pourquoi tu devrais forcément faire ça en famille."}, {"id": "B:BP0691", "bid": "BAY135", "f": "<span class=\"glabel\" style=\"display:block\">You can go with friends or family.<\/span>I’m pretty sure you could go with friends too.", "b": "Je suis quasiment sûr que tu peux y aller avec des amis aussi."}, {"id": "B:BP0052", "bid": "BAY136", "f": "<span class=\"glabel\" style=\"display:block\">I just want to spend time with you.<\/span><mark>I just want to spend that time with you<\/mark><span class=\"dim\">, and I really think it could be a memorable experience for all of us.<\/span>", "b": "<mark>Moi, ce que je veux, c'est juste passer ce moment avec toi<\/mark><span class=\"dim\">, et je pense vraiment que ça pourrait être une expérience mémorable pour nous tous.<\/span>"}, {"id": "B:BP1100", "bid": "BAY137", "f": "<span class=\"glabel\" style=\"display:block\">We haven't hung out in a while.<\/span><mark>We haven't hung out in a bit<\/mark><span class=\"dim\">, and I really want to do more this summer — I think this will be really fun for all our friends.<\/span>", "b": "<span class=\"dim\">En plus, <\/span><mark>ça fait un petit moment qu'on s'est pas vus<\/mark><span class=\"dim\">, et j'ai vraiment envie qu'on fasse plus de trucs cet été — je pense que ça va être vraiment sympa pour tous nos potes.<\/span>"}, {"id": "B:BP0218", "bid": "BAY138", "f": "<span class=\"glabel\" style=\"display:block\">We'd do something meaningful together.<\/span><span class=\"dim\">The main goal is to have fun, enjoy the experience, and <\/span><mark>do something meaningful together.<\/mark>", "b": "<span class=\"dim\">Le principal, c'est de s'amuser, de profiter de l'expérience et <\/span><mark>de faire un truc qui a du sens ensemble.<\/mark>"}, {"id": "B:BP0815", "bid": "BAY139", "f": "<span class=\"glabel\" style=\"display:block\">Together we'd have enough for it.<\/span><mark>If we put all our stuff together, we’d actually have plenty for a decent stall<\/mark><span class=\"dim\">, and I think it could be really good.<\/span>", "b": "<mark>Si on mettait toutes nos affaires ensemble, on aurait largement de quoi faire un stand correct<\/mark><span class=\"dim\">, et je pense que ça pourrait être vraiment bien.<\/span>"}, {"id": "B:BP0546", "bid": "BAY140", "f": "<span class=\"glabel\" style=\"display:block\">It's fun to go out with lots of people.<\/span>Sometimes it’s fun to go out and do something with a bunch of people.", "b": "Des fois, c'est sympa de sortir et de faire un truc avec plein de gens."}, {"id": "B:BP1074", "bid": "BAY141", "f": "<span class=\"glabel\" style=\"display:block\">The more people, the merrier.<\/span>The more people we have, the merrier, the bigger the van we can rent.", "b": "<span class=\"dim\">Et puis <\/span><mark>plus on est de fous, plus on rit — plus on est nombreux, plus on peut louer un gros van.<\/mark>"}, {"id": "B:BP1113", "bid": "BAY142", "f": "<span class=\"glabel\" style=\"display:block\">Once a few of us confirm, others will join.<\/span><span class=\"dim\">But <\/span><mark>if we have three people confirmed to go, and we mention it in the group chat like, \"Hey, we're going regardless if you guys are not,\" that will create a sense of FOMO, and people will start trying to fit this within their schedule.<\/mark>", "b": "<span class=\"dim\">Par contre, <\/span><mark>si on a déjà trois personnes qui sont sûres de venir, et qu'on l'annonce sur le groupe avec un message du style « nous, on y va, même si personne d'autre vient », ça va créer du FOMO, et là, les gens vont se mettre à chercher comment caser ça dans leur emploi du temps.<\/mark>"}, {"id": "B:BP0793", "bid": "BAY143", "f": "<span class=\"glabel\" style=\"display:block\">We'd chat with neighbors and friends.<\/span><mark>We’d get to chat with neighbors and friends<\/mark><span class=\"dim\">, and the whole vibe sounds pretty relaxed.<\/span>", "b": "<mark>On discuterait avec les voisins, les amis<\/mark><span class=\"dim\">, et l'ambiance a l'air plutôt détendue.<\/span>"}, {"id": "B:BP0917", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>I also think it’d be a really good way to meet people.", "b": "En plus de ça, je me dis que ce serait un super moyen de rencontrer du monde."}, {"id": "B:BP0156", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span><span class=\"dim\">You’d be taking the class, learning things, and <\/span><mark>probably meeting new people too.<\/mark>", "b": "<span class=\"dim\">Tu suivrais le cours, t'apprendrais des choses, et <\/span><mark>tu rencontrerais sûrement des nouvelles personnes, en plus.<\/mark>"}, {"id": "B:BP0747", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>Plus, you might actually meet some new people.", "b": "En plus de ça, tu pourrais très bien rencontrer du monde."}, {"id": "B:BP0411", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span><span class=\"dim\">You might learn more about how the industry works, <\/span><mark>meet interesting people<\/mark><span class=\"dim\">, and maybe even hear about other events or opportunities through them.<\/span>", "b": "<span class=\"dim\">T'en apprendrais peut-être plus sur comment ça marche, ce milieu, <\/span><mark>tu ferais des rencontres intéressantes<\/mark><span class=\"dim\">, et peut-être même que t'entendrais parler d'autres événements ou d'autres opportunités grâce à eux.<\/span>"}, {"id": "B:BP0318", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>But that’s kind of why I think it could be such a good opportunity to meet people and make friends.", "b": "Mais justement, c'est un peu pour ça que je me dis que ça pourrait être une super occasion de rencontrer des gens et de te faire des amis."}, {"id": "B:BP0749", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>If you're looking to meet people or make new friends, you'd probably have a pretty good opportunity there.", "b": "<span class=\"dim\">Du coup, <\/span><mark>si tu cherches à rencontrer des gens ou à te faire de nouveaux potes, t'aurais probablement une belle occasion là-bas.<\/mark>"}, {"id": "B:BP0547", "bid": "BAY145", "f": "<span class=\"glabel\" style=\"display:block\">With so many people, you'd have more chances to make friends.<\/span>And with so many people there, you’d have more chances to meet new people and maybe make some friends. I think it could actually be a really good opportunity for that.", "b": "Et puis justement, avec tout ce monde, t'aurais plus de chances de faire de nouvelles rencontres, et peut-être même de te faire des amis. Moi, je trouve que ça pourrait être une vraie bonne occasion pour ça."}, {"id": "B:BP0919", "bid": "BAY146", "f": "<span class=\"glabel\" style=\"display:block\">You never know who you might meet.<\/span>You never know who you could meet on a trip like that.", "b": "Tu sais jamais sur qui tu pourrais tomber pendant un voyage comme ça."}, {"id": "B:BP0644", "bid": "BAY146", "f": "<span class=\"glabel\" style=\"display:block\">You never know who you might meet.<\/span>And you don't know who you're going to meet at the contest either.", "b": "Et puis tu sais pas non plus qui tu vas rencontrer à ce concours."}, {"id": "B:BP0646", "bid": "BAY146", "f": "<span class=\"glabel\" style=\"display:block\">You never know who you might meet.<\/span>You never know.", "b": "On sait jamais."}, {"id": "B:BP0320", "bid": "BAY147", "f": "<span class=\"glabel\" style=\"display:block\">Several days with the same people builds stronger connections.<\/span>But if it takes place over several days and you’re doing activities with the same new people, you’d have more of a chance to actually get to know them and build stronger connections.", "b": "Mais si ça se passe sur plusieurs jours et que tu fais des activités avec les mêmes nouvelles personnes, t'aurais plus de chances de vraiment apprendre à les connaître et de créer des liens plus solides."}, {"id": "B:BP0918", "bid": "BAY148", "f": "<span class=\"glabel\" style=\"display:block\">A shared goal naturally brings people together.<\/span>Everyone would be there for the same reason, working toward the same goal, so it’s the kind of experience that would naturally bring people together.", "b": "Tout le monde serait là pour la même raison, à bosser pour le même objectif, du coup c'est le genre d'expérience qui rapproche naturellement les gens."}, {"id": "B:BP0748", "bid": "BAY149", "f": "<span class=\"glabel\" style=\"display:block\">Without phones, people would naturally talk to each other.<\/span>Nobody there would have their phones, so everyone would have to find other things to do, which would naturally push people to talk to each other.", "b": "Là-bas, personne aurait son téléphone, donc tout le monde serait obligé de se trouver d'autres trucs à faire, et forcément, ça pousserait les gens à se parler entre eux."}, {"id": "B:BP0323", "bid": "BAY150", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to like or befriend everyone.<\/span>You don’t have to like everyone you meet, and you definitely don’t have to become friends with everybody.", "b": "T'es pas obligé d'apprécier tous les gens que tu rencontres, et t'es vraiment pas obligé de devenir ami avec tout le monde."}, {"id": "B:BP0324", "bid": "BAY151", "f": "<span class=\"glabel\" style=\"display:block\">You only need to click with one person.<\/span><mark>You only need to click with one person<\/mark><span class=\"dim\">, and through that person, you could end up meeting even more people.<\/span>", "b": "<mark>Il suffit que t'accroches avec une seule personne<\/mark><span class=\"dim\">, et grâce à elle, tu pourrais finir par rencontrer encore plus de monde.<\/span>"}, {"id": "B:BP0325", "bid": "BAY152", "f": "<span class=\"glabel\" style=\"display:block\">Through one person, you could meet even more people.<\/span><span class=\"dim\">You only need to click with one person, and <\/span><mark>through that person, you could end up meeting even more people.<\/mark>", "b": "<span class=\"dim\">Il suffit que t'accroches avec une seule personne, et <\/span><mark>grâce à elle, tu pourrais finir par rencontrer encore plus de monde.<\/mark>"}, {"id": "B:BP0327", "bid": "BAY153", "f": "<span class=\"glabel\" style=\"display:block\">It opens a door for you.<\/span>It’s a way of opening a door for yourself.", "b": "C'est une façon de t'ouvrir une porte."}, {"id": "B:BP0409", "bid": "BAY154", "f": "<span class=\"glabel\" style=\"display:block\">You could meet people who work in that field.<\/span><span class=\"dim\">It’d be a new experience, and <\/span><mark>you could meet actors and other people who work in the film industry.<\/mark>", "b": "<span class=\"dim\">Ce serait une nouvelle expérience, et <\/span><mark>tu pourrais rencontrer des acteurs et d'autres gens qui bossent dans le cinéma.<\/mark>"}, {"id": "B:BP0645", "bid": "BAY155", "f": "<span class=\"glabel\" style=\"display:block\">You might meet people who help you find jobs.<\/span>Maybe you'll meet people who can help you find other jobs or connect you with something else.", "b": "Peut-être que tu tomberas sur des gens qui pourront t'aider à trouver d'autres jobs ou te mettre en contact avec d'autres gens."}, {"id": "B:BP0881", "bid": "BAY156", "f": "<span class=\"glabel\" style=\"display:block\">Trips like this bring friends closer.<\/span>Trips like that have always brought me and my friends closer.", "b": "Ce genre de voyages, ça m'a toujours rapproché de mes potes."}, {"id": "B:BP1079", "bid": "BAY156", "f": "<span class=\"glabel\" style=\"display:block\">Trips like this bring friends closer.<\/span>After all these trips, I ended up loving those people way more.", "b": "<span class=\"dim\">D'ailleurs, <\/span><mark>après tous ces voyages, j'ai fini par les aimer vachement plus, ces gens-là.<\/mark>"}, {"id": "B:BP1076", "bid": "BAY157", "f": "<span class=\"glabel\" style=\"display:block\">I've traveled with friends a lot and never ended up hating them.<\/span>I've gone on trips with friends a lot of times, and I've never once found myself hating on these people by the end.", "b": "Moi, je suis parti plein de fois en voyage avec des potes, et pas une seule fois je me suis retrouvé à détester ces gens à la fin."}, {"id": "B:BP0880", "bid": "BAY158", "f": "<span class=\"glabel\" style=\"display:block\">Spending that much time together won't be a problem.<\/span>And I think you’re being a little pessimistic about us spending that much time together.", "b": "Et je trouve que t'es un peu pessimiste sur le fait qu'on passe autant de temps ensemble."}, {"id": "B:BP1078", "bid": "BAY159", "f": "<span class=\"glabel\" style=\"display:block\">Little fights are just banter; in the end it's all love.<\/span><span class=\"dim\">Sure, there may be some small conflicts here and there, but <\/span><mark>it's all banter, and it's all love at the end of the day.<\/mark>", "b": "<span class=\"dim\">Alors oui, y a parfois des petites tensions par-ci par-là, mais <\/span><mark>c'est que des vannes, et au bout du compte, c'est que de l'amour.<\/mark>"}, {"id": "B:BP1125", "bid": "BAY160", "f": "<span class=\"glabel\" style=\"display:block\">They're real friends who won't mind if you need space.<\/span>The people we'll be going with are our actual real friends, who won't really care if you need your own space.", "b": "Les gens avec qui on partirait, c'est nos vrais potes, hein — ça les dérangera pas si t'as besoin d'avoir ton espace."}]}, {"key": "B-BA7", "sec": "B", "code": "BA7", "name": "Doing good", "bucket": "Arguments", "items": [{"id": "B:BP0328", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>And it wouldn’t only be something to do for fun or a chance to meet new people—you’d also be doing it for a good cause, helping the school and the kids there.", "b": "Et en plus, ce serait pas juste un truc à faire pour t'amuser ou une occasion de rencontrer du monde — tu le ferais aussi pour la bonne cause, pour aider l'école et les enfants."}, {"id": "B:BP0206", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>Either way, it does say it's for an environmental charity.", "b": "En tout cas, ils précisent bien que c'est pour une asso écolo."}, {"id": "B:BP0554", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span><span class=\"dim\">It looks more like a small, local festival, and <\/span><mark>it seems like it’s for a good cause too, especially with the environmental focus.<\/mark>", "b": "<span class=\"dim\">On dirait plutôt un petit festival local, et <\/span><mark>apparemment c'est aussi pour une bonne cause, surtout avec le côté environnement.<\/mark>"}, {"id": "B:BP0203", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>The ad says that all the proceeds go to an environmental organization.", "b": "Sur l'annonce, ils disent que tous les bénéfices vont à une asso pour l'environnement."}, {"id": "B:BP0070", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>All the profits from the show go to a foundation called Danse du cœur, which helps people with heart disease.", "b": "Et tous les bénéfices du spectacle, ils vont à une fondation qui s'appelle Danse du cœur, qui aide les gens qui ont des maladies cardiaques."}, {"id": "B:BP0069", "bid": "BAY162", "f": "<span class=\"glabel\" style=\"display:block\">You'd do what you love and support a good cause.<\/span>But the whole point is that you get the chance to dance in front of an audience while supporting a good cause.", "b": "Mais justement, le truc, c'est que t'as l'occasion de danser devant un public tout en soutenant une bonne cause."}, {"id": "B:BP0197", "bid": "BAY163", "f": "<span class=\"glabel\" style=\"display:block\">It's not about winning a prize; it's about raising money for charity.<\/span><span class=\"dim\">And <\/span><mark>the whole point isn't to win money or get some kind of prize. It's about raising funds for charity.<\/mark>", "b": "<span class=\"dim\">Et puis de toute façon, <\/span><mark>le but du truc, c'est pas de gagner de l'argent ni de repartir avec je sais pas quel prix. C'est de récolter des fonds pour une bonne cause.<\/mark>"}, {"id": "B:BP0071", "bid": "BAY164", "f": "<span class=\"glabel\" style=\"display:block\">It's important to give back.<\/span>And you know, I think it’s important sometimes to do things like this and give back to society.", "b": "Et puis tu sais, moi je trouve que c'est important, de temps en temps, de faire ce genre de trucs et de s'investir un peu pour les autres."}, {"id": "B:BP1139", "bid": "BAY165", "f": "<span class=\"glabel\" style=\"display:block\">It's not hollow, because you really believe in it.<\/span>I don't really think it's hollow though, because you actually believe in this yourself — you're fighting for what you believe in.", "b": "N'empêche, je trouve pas ça creux, vu que toi, t'y crois vraiment — tu te bats pour ce en quoi tu crois."}, {"id": "B:BP1140", "bid": "BAY166", "f": "<span class=\"glabel\" style=\"display:block\">The point is to make change.<\/span>What's the point of becoming a politician? It's for making change, right?", "b": "C'est quoi l'intérêt de devenir politicien ? C'est pour changer les choses, non ?"}, {"id": "B:BP1147", "bid": "BAY167", "f": "<span class=\"glabel\" style=\"display:block\">Nothing beats making a real impact.<\/span>What better experience is there than joining an association or a movement that already exists, changing the way it works, leading it into this new path, and creating change and making an impact to society while you're at it?", "b": "Honnêtement, quelle meilleure expérience que de rejoindre une asso ou un mouvement qui existe déjà, de changer sa façon de fonctionner, de l'amener sur cette nouvelle voie, et au passage, de créer du changement et d'avoir un impact sur la société ?"}, {"id": "B:BP1043", "bid": "BAY168", "f": "<span class=\"glabel\" style=\"display:block\">They really need help.<\/span><mark>They're seniors and they need help<\/mark><span class=\"dim\">, but they also have decades of experience, and you never know what you could learn from just being around these people and talking to them.<\/span>", "b": "<mark>C'est des seniors, ils ont besoin d'aide, d'accord<\/mark><span class=\"dim\"> — mais en même temps, ils ont des dizaines d'années d'expérience derrière eux, et on sait jamais ce qu'on peut apprendre juste en côtoyant ces gens-là, en discutant avec eux.<\/span>"}, {"id": "B:BP0378", "bid": "BAY168", "f": "<span class=\"glabel\" style=\"display:block\">They really need help.<\/span>Maybe that particular shelter still really needs volunteers. Maybe they only have three people helping out.", "b": "Peut-être que ce refuge-là, il a encore vraiment besoin de bénévoles. Peut-être qu'ils sont que trois à aider, en fait."}, {"id": "B:BP0377", "bid": "BAY169", "f": "<span class=\"glabel\" style=\"display:block\">We don't know how many volunteers they have.<\/span><span class=\"dim\">Sure, there are already 2,000 volunteers overall, but <\/span><mark>we have no idea how many people have signed up at the shelter near you.<\/mark>", "b": "<span class=\"dim\">Alors oui, y a déjà 2 000 bénévoles en tout, mais <\/span><mark>on sait pas du tout combien de gens se sont inscrits dans le refuge à côté de chez toi.<\/mark>"}, {"id": "B:BP1056", "bid": "BAY170", "f": "<span class=\"glabel\" style=\"display:block\">These are vulnerable people who need help.<\/span><span class=\"dim\">So <\/span><mark>you're not the one at stake here, but someone else is: these people who might be vulnerable.<\/mark>", "b": "<span class=\"dim\">Donc <\/span><mark>celui qui risque quelque chose ici, c'est pas toi — c'est quelqu'un d'autre : ces gens, qui sont peut-être vulnérables.<\/mark>"}, {"id": "B:BP0907", "bid": "BAY171", "f": "<span class=\"glabel\" style=\"display:block\">You'd actually be helping.<\/span><mark>You’d actually be helping restore them<\/mark><span class=\"dim\">, and afterward you could say, “I was part of the team that helped restore this place.”<\/span>", "b": "<mark>Tu aiderais vraiment à les restaurer<\/mark><span class=\"dim\">, et après tu pourrais dire : « J'ai fait partie de l'équipe qui a aidé à restaurer cet endroit ».<\/span>"}, {"id": "B:BP0389", "bid": "BAY172", "f": "<span class=\"glabel\" style=\"display:block\">You'd still help, just indirectly.<\/span>You’d still be helping the animals, just indirectly.", "b": "Tu continuerais à aider les animaux, juste indirectement, quoi."}, {"id": "B:BP0908", "bid": "BAY173", "f": "<span class=\"glabel\" style=\"display:block\">You could proudly say you were part of it.<\/span><span class=\"dim\">You’d actually be helping restore them, and <\/span><mark>afterward you could say, “I was part of the team that helped restore this place.”<\/mark>", "b": "<span class=\"dim\">Tu aiderais vraiment à les restaurer, et <\/span><mark>après tu pourrais dire : « J'ai fait partie de l'équipe qui a aidé à restaurer cet endroit ».<\/mark>"}, {"id": "B:BP1041", "bid": "BAY174", "f": "<span class=\"glabel\" style=\"display:block\">I've always wondered how fulfilling it feels to help.<\/span><span class=\"dim\">It's an activity you do more often than not for others' sake and not for your own, and <\/span><mark>I've always wondered how fulfilling it could feel.<\/mark>", "b": "<span class=\"dim\">C'est un truc que la plupart du temps on fait pour les autres et pas pour soi — et justement, <\/span><mark>je me suis toujours demandé à quel point ça pouvait être épanouissant.<\/mark>"}, {"id": "B:BP0373", "bid": "BAY175", "f": "<span class=\"glabel\" style=\"display:block\">It teaches you to do something for others.<\/span>Sometimes you have to do things that aren’t that enjoyable, and it teaches you to think beyond yourself and do something for someone else. In this case, for the animals.", "b": "Des fois, faut faire des choses qui sont pas super agréables, et justement, ça t'apprend à penser au-delà de toi-même, à faire un truc pour quelqu'un d'autre. Là, en l'occurrence, pour les animaux."}, {"id": "B:BP0334", "bid": "BAY176", "f": "<span class=\"glabel\" style=\"display:block\">It's a chance to try something eco-friendly.<\/span>Plus, it'd be a chance to try a more eco-friendly way of traveling, which is something I've never really done before.", "b": "Et puis ce serait l'occasion d'essayer une façon de voyager plus écolo, ce que j'ai jamais vraiment fait non plus."}, {"id": "B:BP0529", "bid": "BAY176", "f": "<span class=\"glabel\" style=\"display:block\">It's a chance to try something eco-friendly.<\/span>And it’s also a chance to actually try one of these alternative foods that’s supposed to use way less water and fewer resources than meat.", "b": "Sans compter que c'est aussi l'occasion de tester pour de vrai un de ces aliments alternatifs qui sont censés consommer beaucoup moins d'eau et de ressources que la viande."}, {"id": "B:BP0530", "bid": "BAY177", "f": "<span class=\"glabel\" style=\"display:block\">We care about this cause; it's a concrete way to act on it.<\/span>You know how much we both care about ecology and the planet, so this would be a concrete way for us to try something connected to that instead of just talking about it.", "b": "Tu sais à quel point l'écologie et la planète, ça nous tient à cœur tous les deux. Du coup, ce serait un moyen concret de tester un truc en rapport avec ça, au lieu de juste en parler."}, {"id": "B:BP0353", "bid": "BAY178", "f": "<span class=\"glabel\" style=\"display:block\">It's greener than the usual option.<\/span><span class=\"dim\">Yeah, I know it's not the most eco-friendly way to travel, but <\/span><mark>it's still clearly more eco-friendly than going everywhere by car or bus.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais que c'est pas la façon la plus écolo de voyager, mais <\/span><mark>n'empêche, c'est clairement plus écolo que de tout faire en voiture ou en bus.<\/mark>"}, {"id": "B:BP0532", "bid": "BAY178", "f": "<span class=\"glabel\" style=\"display:block\">It's greener than the usual option.<\/span>Ecologically, insects would cost a lot less in terms of resources.", "b": "Écologiquement, les insectes, ça coûterait beaucoup moins cher en ressources."}, {"id": "B:BP0802", "bid": "BAY179", "f": "<span class=\"glabel\" style=\"display:block\">It's good for the planet.<\/span><span class=\"dim\">These kinds of garage sales are usually really popular because everything’s cheaper, and <\/span><mark>they’re good for the planet too.<\/mark>", "b": "<span class=\"dim\">Ce genre de vide-greniers, en général, ça marche super bien, parce que tout est moins cher, et <\/span><mark>en plus c'est bon pour la planète.<\/mark>"}, {"id": "B:BP0355", "bid": "BAY180", "f": "<span class=\"glabel\" style=\"display:block\">It's a pretty good compromise.<\/span>So I think it's a pretty good compromise.", "b": "Au final, je trouve que c'est un assez bon compromis."}, {"id": "B:BP0659", "bid": "BAY181", "f": "<span class=\"glabel\" style=\"display:block\">The environmental impact is small.<\/span>And from an environmental point of view, I really don’t think it’d be that big of a problem.", "b": "Et niveau environnement, franchement, je pense pas que ce soit un si gros problème que ça."}, {"id": "B:BP0657", "bid": "BAY181", "f": "<span class=\"glabel\" style=\"display:block\">The environmental impact is small.<\/span>It wouldn’t be that much plastic.", "b": "Ça ferait pas tant de plastique que ça."}, {"id": "B:BP0660", "bid": "BAY181", "f": "<span class=\"glabel\" style=\"display:block\">The environmental impact is small.<\/span>You’re not going to ruin the planet by using a little more plastic.", "b": "C'est pas en utilisant un peu plus de plastique que tu vas ruiner la planète."}, {"id": "B:BP0662", "bid": "BAY182", "f": "<span class=\"glabel\" style=\"display:block\">Maybe their version is eco-friendly.<\/span>And who knows, maybe the plastic they use is eco-friendly.", "b": "Et puis qui sait, peut-être que le plastique qu'ils utilisent, il est écolo."}, {"id": "B:BP0661", "bid": "BAY183", "f": "<span class=\"glabel\" style=\"display:block\">You could make up for it in other ways.<\/span>You could also do other things to reduce your carbon footprint and make up for it.", "b": "En plus, tu pourrais faire d'autres trucs pour réduire ton empreinte carbone, histoire de compenser."}, {"id": "B:BP0663", "bid": "BAY184", "f": "<span class=\"glabel\" style=\"display:block\">It could even reduce waste.<\/span>Actually, it could even help cut down on food waste.", "b": "D'ailleurs, ça pourrait même aider à limiter le gaspillage alimentaire."}, {"id": "B:BP0664", "bid": "BAY184", "f": "<span class=\"glabel\" style=\"display:block\">It could even reduce waste.<\/span>If you weigh the two sides of it, this kind of wrapping can help food last longer, which means less food gets thrown away.", "b": "Si tu pèses le pour et le contre, ce genre d'emballage, ça aide la nourriture à se conserver plus longtemps, du coup on en jette moins."}, {"id": "B:BP0665", "bid": "BAY185", "f": "<span class=\"glabel\" style=\"display:block\">Overall, it could be a net positive.<\/span>So overall, I think it could still be a net positive.", "b": "Donc au final, je trouve que le bilan pourrait quand même être positif."}, {"id": "B:BP0697", "bid": "BAY186", "f": "<span class=\"glabel\" style=\"display:block\">The animals are well looked after.<\/span><span class=\"dim\">Obviously, I’m not the organizer, so I can’t tell you exactly what the conditions are like, but <\/span><mark>they seem to be well looked after and in good health.<\/mark>", "b": "<span class=\"dim\">Bon, évidemment, c'est pas moi qui organise, donc je peux pas te dire exactement quelles sont les conditions, mais <\/span><mark>ils ont l'air bien traités et en bonne santé.<\/mark>"}, {"id": "B:BP0694", "bid": "BAY186", "f": "<span class=\"glabel\" style=\"display:block\">The animals are well looked after.<\/span><span class=\"dim\">I know you might also be wondering about the wolves themselves, but <\/span><mark>from what I can tell, they’re kept in large outdoor areas where they have plenty of space to run around.<\/mark>", "b": "<span class=\"dim\">Je sais que tu te poses peut-être aussi des questions sur les loups eux-mêmes, mais <\/span><mark>d'après ce que j'ai compris, ils vivent dans de grands espaces en plein air où ils ont largement la place de courir.<\/mark>"}, {"id": "B:BP0695", "bid": "BAY186", "f": "<span class=\"glabel\" style=\"display:block\">The animals are well looked after.<\/span>It seems much better than having them stuck in a zoo.", "b": "Ça a l'air bien mieux que de les avoir coincés dans un zoo."}]}, {"key": "B-BA8", "sec": "B", "code": "BA8", "name": "Money & value", "bucket": "Arguments", "items": [{"id": "B:BP0027", "bid": "BAY187", "f": "<span class=\"glabel\" style=\"display:block\">We should spend our money before we die.<\/span><span class=\"dim\">And yeah, I know it costs money, but <\/span><mark>you know my philosophy: we should die with zero dollars in our bank accounts.<\/mark>", "b": "<span class=\"dim\">Et ouais, je sais que ça coûte de l'argent, mais <\/span><mark>tu connais ma philosophie : on devrait mourir avec zéro dollar sur n
