<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TEF Oral Decks</title>
<style>
/* One screen app: a top bar, then either the deck list or the two-column builder. Deliberately dark, like the study decks. */
:root{
  --bg:#17181A;--panel:#1F2023;--panel2:#292A2E;--line:#323338;--ink:#ECECEA;--ink2:#BDBDB8;--mute:#80817E;
  --acc:#57B5B0;--acc-ink:#0E1C1B;--a:#57B5B0;--b:#E3955E;--warn:#EE7B6E;--mark:#2C4F52;--markfr:#4A3F2A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:6px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:5px 12px;font-weight:600;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:#4a4b50}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger:hover{color:var(--warn);border-color:var(--warn)}
[hidden]{display:none!important}
/* ---- deck list ---- */
.list{max-width:820px;margin:0 auto;padding-block:20px 80px;padding-inline:16px}
.list h1{font-size:20px;margin:0 0 4px}
.list .sub{color:var(--mute);font-size:13px;margin:0 0 6px}
.list h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin:24px 0 6px}
.list h2.B{color:var(--b)}
.deck{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;padding:10px 12px;margin:6px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.deck .nm{font-weight:650;min-width:0;overflow-wrap:anywhere}
.deck .meta{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.deck .pg{color:#7fc49a}
.deck .acts{display:flex;gap:6px}
.deck .ask{grid-column:1/-1;display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:13px}
.note{color:var(--mute);font-size:13px;margin-top:18px;max-width:64ch}
.empty{color:var(--mute);padding:40px 0;text-align:center}
@media (max-width:560px){.deck{grid-template-columns:1fr}.deck .acts{flex-wrap:wrap}}
/* ---- builder ---- */
.bbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
#dname{flex:1 1 200px;min-width:0;font-size:16px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 8px}
#dname:hover,#dname:focus{border-color:var(--line);background:var(--panel)}
.count{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.heads,.row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr)}
.heads{border-bottom:1px solid var(--line)}
.heads div{padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.row{border-bottom:1px solid var(--line)}
.row.newbox{border-top:2px solid #45464b}
.row:focus-within{background:#1d2122}
.gut{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:10px;color:var(--mute);font:11px var(--mono)}
.gut .tl{display:none;flex-direction:column}
.row:hover .gut .tl,.row:focus-within .gut .tl{display:flex}
.gut button{border:0;background:transparent;color:var(--mute);padding:0 4px;font-size:12px;line-height:1.45;border-radius:4px}
.gut button:hover{color:var(--ink);background:var(--panel2)}
.gut button.del:hover{color:var(--warn)}
.cell{padding:10px 14px;min-height:44px;outline:none;border-left:1px solid var(--line);font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cell:focus{background:#202829;box-shadow:inset 0 0 0 1px #3d5a5c}
.cell:empty::before{content:attr(data-ph);color:#5a5b5f}
.cell.back{font-family:var(--serif);font-size:17px}
.cell .glabel{display:block;font:700 10.5px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:#7fa6a9;margin-bottom:2px;white-space:normal}
.cell mark{background:var(--mark);color:#fff;border-radius:3px;padding:0 2px}
.cell.back mark{background:var(--markfr)}
.cell .dim{color:#7a7a7a}
.cell .tags{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:6px;font:10.5px/1.4 var(--sans);white-space:normal}
.cell .tags .st{color:#8fb3b6}.cell .tags .st b{font-family:var(--mono);color:#b9a77e;margin-right:3px}
.cell .tags .gr{color:#6f7780;font-style:italic}
.addrow{padding:10px 12px 70px 52px}
.hint{color:var(--mute);text-align:center;padding:50px 16px;line-height:1.8}
@media (max-width:640px){.heads{display:none}.row{grid-template-columns:30px minmax(0,1fr)}.cell.back{grid-column:2;border-top:1px dashed var(--line)}}
/* cluster drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);z-index:21;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-bottom:20px}
.drawer h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:18px 16px 6px}
.drawer h3.A{color:var(--a)}.drawer h3.B{color:var(--b)}
.cl{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:7px 16px}
.cl:hover{background:var(--panel2)}
.cl.on{background:#26393a}
.cl .nm{flex:1;font-weight:600}
.cl .bk{color:var(--mute);font-size:11.5px}
.cl .n{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.cl .ed{width:7px;height:7px;border-radius:50%;flex:none;align-self:center}
.cl .ed.on{background:var(--b)}
/* in-page confirm + toast */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.55);padding-inline:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:420px;width:100%}
.modal p{margin:0 0 14px}
.modal .row2{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;pointer-events:auto}
.toast button{margin-left:10px;border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.gh{max-width:820px;margin:0 auto 4px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;gap:8px}
.gh label{font-size:13px;color:var(--ink2)}
.gh input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.gh .rowb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gh small{color:var(--mute)}
</style>
</head>
<body>

<div class="top">
  <span class="brand">TEF Oral Decks</span>
  <div class="tabs" role="group" aria-label="View">
    <button id="tab-decks" aria-pressed="true">My decks</button><button id="tab-build" aria-pressed="false">Build</button>
  </div>
  <span class="status" id="status">Drafts and progress stay on this device</span>
  <button class="btn" id="ghbtn" title="Turn on deck sync">Sync</button>
</div>

<section id="view-decks" class="list">
  <div class="gh" id="ghbox" hidden>
    <form id="ghunlock" class="gh-un">
      <label for="ghpass">Sync passphrase</label>
      <input id="ghpass" type="password" autocomplete="current-password" placeholder="four-words-with-dashes">
      <div class="rowb"><button class="btn primary" type="submit">Unlock sync</button><small id="ghmsg"></small></div>
    </form>
    <details><summary style="cursor:pointer;color:var(--mute);font-size:13px">Use a different sync key</summary>
      <div style="display:grid;gap:8px;margin-top:8px">
        <label for="ghtoken">Sync key (a fine-grained token for binarybreeze05/oral-practice, Contents: read and write). Kept only on this page.</label>
        <input id="ghtoken" type="password" autocomplete="off" placeholder="github_pat_…">
        <div class="rowb"><button class="btn" id="ghsave" type="button">Use this key</button><button class="btn" id="ghforget" type="button">Turn off sync</button></div>
      </div>
    </details>
  </div>
  <h1>My decks</h1>
  <p class="sub" id="decks-sub">Loading your exported decks…</p>
  <div id="decks"></div>
  <p class="note">Decks you export from <b>Build</b> are synced and appear here on every computer where you unlock sync. Study progress is kept on each device.</p>
</section>

<section id="view-build" hidden>
  <div class="bbar">
    <button class="btn" id="clusters">☰ Clusters</button>
    <input id="dname" aria-label="Deck name" placeholder="Deck name">
    <span class="count" id="count"></span>
    <button class="btn" id="add">+ Add card</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn primary" id="export">Export deck</button>
  </div>
  <div class="heads"><div></div><div>Front</div><div>Back</div></div>
  <div id="rows"></div>
</section>

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Clusters" hidden></nav>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="modal-text"></p><div class="row2"><button class="btn" id="modal-no">Cancel</button><button class="btn primary" id="modal-yes">OK</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script id="data" type="application/json">{"clusters": [{"key": "A-P2", "sec": "A", "code": "P2", "name": "The offer", "bucket": "Questions", "items": [{"id": "A:Q063", "bid": "QB051", "f": "<span class=\"glabel\" style=\"display:block\">What exactly do you mean by that?<\/span>What do you mean by missions?", "b": "Qu'entendez-vous exactement par « missions » ?<span class=\"tags\"><span class=\"st\"><b>3a<\/b> Qu'entendez-vous exactement par…<\/span><\/span>"}, {"id": "A:Q176", "bid": "QB051", "f": "<span class=\"glabel\" style=\"display:block\">What exactly do you mean by that?<\/span>What do you mean by that exactly? What are specialized shops?", "b": "Qu'entendez-vous exactement par là ? Pourriez-vous développer ce point ?<span class=\"tags\"><span class=\"st\"><b>3a<\/b> Qu'entendez-vous exactement par…<\/span><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q223", "bid": "QB051", "f": "<span class=\"glabel\" style=\"display:block\">What exactly do you mean by that?<\/span>What exactly are the basics?", "b": "Pourriez-vous me préciser en quoi consistent exactement les bases ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q207", "bid": "QB141", "f": "<span class=\"glabel\" style=\"display:block\">Can you tell me more about how the venue is equipped for kids' parties?<\/span>You mentioned that the venue is fully equipped for children's celebrations. Could you elaborate on that?", "b": "Vous avez indiqué que la salle est entièrement équipée pour les fêtes d'enfants. Pourriez-vous m'en dire davantage ?<span class=\"tags\"><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q056", "bid": "QB044", "f": "<span class=\"glabel\" style=\"display:block\">Can you describe what they look like?<\/span>Can you describe for me what they look like?", "b": "Sauriez-vous me les décrire ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q149", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span>Are the lectures different across different nights throughout the season or are they roughly the same lectures?", "b": "Y a-t-il une différence notable entre les conférences d'une soirée à l'autre, ou restent-elles à peu près les mêmes tout au long de la saison ?<span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:Q053", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span><mark>Is it a fixed journey for every single guided boat ride<\/mark><span class=\"dim\">, or do we get to choose which sites we want to discover?<\/span>", "b": "<mark>Le parcours est-il imposé pour chaque promenade guidée<\/mark><span class=\"dim\">, ou avons-nous la possibilité de choisir les sites que nous souhaitons découvrir ?<\/span>"}, {"id": "A:QN40", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span>How is the Tuesday class different from the Thursday one?", "b": "En quoi le cours du mardi diffère-t-il de celui du jeudi ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:QG008", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span>Is it the same level?", "b": "S'agit-il du même niveau ?"}, {"id": "A:Q236", "bid": "QB153", "f": "<span class=\"glabel\" style=\"display:block\">What do we jump over, a lake or a field?<\/span>What are we bungee jumping above? Is it a lake or is it something like a field?", "b": "Au-dessus de quoi saute-t-on, au juste ? S'agit-il d'un lac, ou plutôt d'un champ ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q208", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span>Like, what kind of activities do you offer?", "b": "Quel genre d'activités proposez-vous, par exemple ?"}, {"id": "A:Q023", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span>What kinds of souvenirs can we find in the souvenir shops?", "b": "Quel genre de souvenirs peut-on y trouver ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q033", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span><span class=\"dim\">So, <\/span><mark>what exactly do you sell at the artisan stalls?<\/mark>", "b": "<span class=\"dim\">Alors, <\/span><mark>pouvez-vous m'indiquer ce que vous vendez exactement sur les stands artisanaux ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q038", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span><mark>What kind of food do you offer?<\/mark><span class=\"dim\"> You mentioned in the ad that there’s catering on-site.<\/span>", "b": "<span class=\"dim\">Vous indiquez dans l'annonce qu'il y a de la restauration sur place : <\/span><mark>quel genre de plats proposez-vous ?<\/mark>"}, {"id": "A:Q161", "bid": "QB118", "f": "<span class=\"glabel\" style=\"display:block\">Do you offer that?<\/span><span class=\"dim\">Sorry if you've covered this already, but <\/span><mark>do you also offer credit cards?<\/mark>", "b": "<span class=\"dim\">Pardonnez-moi si vous en avez déjà parlé, mais <\/span><mark>auriez-vous également des cartes de crédit à proposer ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q162", "bid": "QB118", "f": "<span class=\"glabel\" style=\"display:block\">Do you offer that?<\/span>I'm assuming you also offer a savings account, right?", "b": "Si je ne m'abuse, vous proposez aussi un compte épargne ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q091", "bid": "QB071", "f": "<span class=\"glabel\" style=\"display:block\">If you buy the food, what kind would it be?<\/span>If I ask you to purchase the food yourself, what type of food would it be?", "b": "Si je vous demandais d'acheter la nourriture vous-mêmes, de quel type de nourriture s'agirait-il ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q175", "bid": "QB128", "f": "<span class=\"glabel\" style=\"display:block\">How many different cuisines can we learn?<\/span>How many different types of cooking classes do you offer? How many different cuisines can we learn?", "b": "Combien de types de cours de cuisine différents proposez-vous ? Et combien de cuisines différentes peut-on y apprendre ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q151", "bid": "QB112", "f": "<span class=\"glabel\" style=\"display:block\">What are the lectures usually about?<\/span><span class=\"dim\">I probably should have asked this in the beginning, but <\/span><mark>what are the lectures typically about?<\/mark>", "b": "<span class=\"dim\">J'aurais sans doute dû vous poser la question d'emblée, mais <\/span><mark>sur quels sujets les conférences portent-elles, en général ?<\/mark><span class=\"tags\"><span class=\"gr\">cond. passé · idiome<\/span><\/span>"}, {"id": "A:Q032", "bid": "QB027", "f": "<span class=\"glabel\" style=\"display:block\">Who is performing on each day?<\/span>Which artists are performing on each day?", "b": "Quels artistes se produisent chaque jour ?"}, {"id": "A:Q031", "bid": "QB027", "f": "<span class=\"glabel\" style=\"display:block\">Who is performing on each day?<\/span>Could y nd<\/span><\/span>"}, {"id": "A:Q211", "bid": "QB077", "f": "<span class=\"glabel\" style=\"display:block\">What does the higher package include that the basic one doesn't?<\/span><span class=\"dim\">I'm sorry if you've already mentioned this, but just to clarify, <\/span><mark>what does the second cheapest package offer that the cheapest package doesn't offer?<\/mark>", "b": "<span class=\"dim\">Pardonnez-moi si vous l'avez déjà mentionné, mais pour que ce soit parfaitement clair : <\/span><mark>y a-t-il une différence notable entre la formule la moins chère et celle juste au-dessus ? Que propose la seconde de plus ?<\/mark><span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q226", "bid": "QB149", "f": "<span class=\"glabel\" style=\"display:block\">Does that include any horse, not just trained ones?<\/span>Any horse, not just trained horses.", "b": "Et je parle de n'importe quel cheval, pas seulement de chevaux dressés."}, {"id": "A:Q206", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span>First of all, do we pick the venue ourselves, or do you pick it for us?", "b": "Tout d'abord, choisissons-nous la salle nous-mêmes, ou est-ce bien vous qui vous occupez de la choisir pour nous ?<span class=\"tags\"><span class=\"st\"><b>6d<\/b> Est-ce bien vous qui vous occupez de…<\/span><\/span>"}, {"id": "A:Q045", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span>Do we get to choose which car we use, or do you simply assign one based on availability?", "b": "Avons-nous la possibilité de choisir la voiture, ou vous contentez-vous d'en attribuer une selon les disponibilités ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q054", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose t t fairly even?", "b": "Est-il plutôt homogène ?"}, {"id": "A:Q017", "bid": "QB015", "f": "<span class=\"glabel\" style=\"display:block\">Is it easy to make friends there?<\/span>How easy would you say it is to make friends?", "b": "Pourriez-vous me dire dans quelle mesure il est facile de s'y faire des amis ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q016", "bid": "QB015", "f": "<span class=\"glabel\" style=\"display:block\">Is it easy to make friends there?<\/span>What’s the vibe like socially in these classes?", "b": "Quelle est l'ambiance, côté social, dans ces cours ?"}, {"id": "A:QN63", "bid": "QB129", "f": "<span class=\"glabel\" style=\"display:block\">How long until I get good at it?<\/span>Could you tell me how long I should expect before moving up to the intermediate level?", "b": "Pourriez-vous m'indiquer le délai à prévoir avant de passer au niveau intermédiaire ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q178", "bid": "QB129", "f": "<span class=\"glabel\" style=\"display:block\">How long until I get good at it?<\/span>How quickly can I expect to become proficient in the skill of cooking, assuming that I would start as a complete beginner who only knows how to fry an egg?", "b": "Sous quel délai puis-je espérer maîtriser la cuisine, sachant que je partirais de zéro et que je sais tout juste faire un œuf au plat ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q225", "bid": "QB129", "f": "<span class=\"glabel\" style=\"display:block\">How long until I get good at it?<\/span>How long would it take until I can ride a horse at a fast pace like you see in the movies?", "b": "Combien de temps faudrait-il avant que je puisse monter à cheval au galop, comme dans les films ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q222", "bid": "QB148", "f": "<span class=\"glabel\" style=\"display:block\">What progress can I expect along the way?<\/span><span class=\"dim\">Kind of walk me through this - <\/span><mark>what level of expertise can I expect to have by the end of one week, one month, and three months?<\/mark>", "b": "<span class=\"dim\">Pourriez-vous développer un peu ? <\/span><mark>Quel niveau puis-je espérer atteindre au bout d'une semaine, d'un mois, puis de trois mois ?<\/mark><span class=\"tags\"><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q224", "bid": "QB148", "f": "<span class=\"glabel\" style=\"display:block\">What progress can I expect along the way?<\/span>If it would take three months to learn how to ride a horse, I at least want to look forward to the milestones in between.", "b": "S'il faut trois mois pour apprendre à monter à cheval, j'aimerais qu'il y ait au moins des paliers intermédiaires que je puisse viser.<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN27", "bid": "QB171", "f": "<span class=\"glabel\" style=\"display:block\">How much would missing a week slow my progress?<\/span>How much would missing a week affect my progress?", "b": "Dans quelle mesure le fait de manquer une semaine affecterait-il ma progression ?<span class=\"tags\"><span class=\"st\"><b>5b<\/b> Dans quelle mesure cela affecterait-il…<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P1", "sec": "A", "code": "P1", "name": "Money", "bucket": "Questions", "items": [{"id": "A:Q136", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>How much is the rent exactly?", "b": "Pourriez-vous me préciser le montant exact du loyer ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q018", "bid": "QB016", "f": "<span class=\"  class=\"st\"><b>4b<\/b> Qu'est-ce qui justifie…<\/span><\/span>"}, {"id": "A:QN03", "bid": "QB159", "f": "<span class=\"glabel\" style=\"display:block\">Why is there such a price difference?<\/span>And what would justify an extra charge depending on the prescription?", "b": "Et qu'est-ce qui justifierait un supplément en fonction de l'ordonnance ?<span class=\"tags\"><span class=\"st\"><b>4b<\/b> Qu'est-ce qui justifie…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q182", "bid": "QB131", "f": "<span class=\"glabel\" style=\"display:block\">How do your prices compare to the farmers market and the grocery store?<\/span>How much are the prices typically, and how do they compare to the farmers market and the grocery store?", "b": "Je voudrais savoir quels sont vos prix en règle générale, et en quoi ils diffèrent de ceux du marché et du supermarché.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q019", "bid": "QB017", "f": "<span class=\"glabel\" style=\"display:block\">Is that included in the price?<\/span>Are the workshops included in the ticket price?", "b": "Je voudrais savoir si les ateliers sont compris dans le prix du billet.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q039", "bid": "QB017", "f": "<span class=\"glabel\" style=\"display:block\">Is that included in the price?<\/span>Is food included in the ticket price, or do we have to pay extra for it?", "b": "La restauration est-elle comprise dans le prix du billet, ou faut-il prévoir un supplément ?"}, {"id": "A:Q101", "bid": "QB017", "f": "<span class=\"glabel\" style=\"display:block\">Is that included in the price?<\/span><span class=\"dim\">I'm sorry if you've already mentioned this, but <\/span><mark>do you also offer tour guides in your basic package?<\/mark> ind of extra costs could come up?<\/span>If so, what kinds of extra costs might come up?", "b": "Et le cas échéant, quels types de frais pourraient venir s'ajouter ?<span class=\"tags\"><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:Q129", "bid": "QB067", "f": "<span class=\"glabel\" style=\"display:block\">Do you charge extra for that?<\/span>Would that cost extra, or can you do that within the price you charge?", "b": "Cela entraînerait-il un supplément, ou serait-il envisageable de l'inclure dans le prix que vous pratiquez ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q085", "bid": "QB067", "f": "<span class=\"glabel\" style=\"display:block\">Do you charge extra for that?<\/span>In the event that one of my pets gets into some sort of accident or they become ill, do you charge extra to take care of the sick animal or an injured animal?", "b": "Au cas où l'un de mes animaux aurait un accident ou tomberait malade, sa prise en charge entraînerait-elle un supplément ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q197", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span><span class=\"dim\">So <\/span><mark>how much exactly do you charge for packing and unpacking?<\/mark>", "b": "Pourriez-vous me préciser combien vous facturez exactement l'emballage et le déballage ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q098", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>If we want to add just the travel insurance on top of the basic package, what would the cost amount to?", "b": "Si nous voulions ajouter uniquement l'assurance voyage à la formule de base, à combien cela reviendrait-il ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q108", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>How much would the delivery fee be?", "b": "Et les frais de livraison, à combien s'élèveraient-ils ?<span class=\"tags\"><span class=\"gr\">dislocation · cond<\/span><\/span>"}, {"id": "A:Q153", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>In terms of parking, where can we park and how much do we have to pay for the parking?", "b": "Pour ce qui est du stationnement, pouvez-vous m'indiquer où nous pourrions nous garer, et combien il faudrait prévoir ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q004", "bid": "QB004", "f": "<span class=\"glabel\" style=\"display:block\">Do you give group discounts?<\/span>And if so, if we book as a group, do you offer group prices, group discounts, anything like that?", "b": "Et si oui, proposez-vous des tarifs de groupe, des réductions, ce genre de choses ?"}, {"id": "A:Q044", "bid": "QB036", "f": "<span class=\"glabel\" style=\"display:block\">Do you give a discount if I refer people to you?<\/span>Do you also offer any discounts for referring other people to your business?", "b": "Envisageriez-vous également la possibilité de m'accorder une réduction si je vous recommandais d'autres clients ?<span class=\"tags\"><span class=\"st\"><b>5d<\/b> Envisageriez-vous la possibilité de…<\/span><span class=\"gr\">cond · si + imparf.<\/span><\/span>"}, {"id": "A:Q179", "bid": "QB126", "f": "<span class=\"glabel\" style=\"display:block\">How do you charge for it?<\/span>How do you charge for the chance to pick and harvest products?", "b": "Comment facturez-vous, au juste, la cueillette et la récolte des produits ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q173", "bid": "QB126", "f": "<span class=\"glabel\" style=\"display:block\">How do you charge for it?<\/span>Do we pay with a membership fee, or do we have to buy a package of classes?", "b": "Comment le paiement fonctionne-t-il : par une cotisation d'adhésion, ou faut-il acheter un forfait de cours ?"}, {"id": "A:Q180", "bid": "QB126", "f": "<span class=\"glabel\" style=\"display:block\">How do you charge for it?<\/span>Do you charge by the weight of the products?", "b": "Le prix se calcule-t-il au poids ?"}, {"id": "A:Q010", "bid": "QB009", "f": "<span class=\"glabel\" style=\"display:block\">When does that price start to apply?<\/span>So does that take into effect once you've bought the monthly pass, or would it take into effect some other time?", "b": "J'aimerais savoir à partir de quand ce tarif s'applique : dès l'achat du pass mensuel, ou à un autre moment ?<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q140", "bid": "QB105", "f": "<span class=\"glabel\" style=\"display:block\">How much is the deposit?<\/span><mark>And speaking of deposits, how much is the security deposit as well?<\/mark><span class=\"dim\"> 'Cause I'm assuming we would have to pay some sort of security deposit, right?<\/span>", "b": "<mark>Et, à ce propos, quel est le montant du dépôt de garantie ?<\/mark><span class=\"dim\"> Car j'imagine qu'il faudrait que nous en versions un, pourriez-vous me le confirmer ?<\/span><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><span class=\"st\"><b>6a<\/b> Puis-je confirmer que…<\/span><span class=\"gr\">subj · cond · en/y<\/span><\/span>"}, {"id": "A:Q139", "bid": "QB105", "f": "<span class=\"glabel\" style=\"display:block\">How much is the deposit?<\/span>How much is the pet deposit?", "b": "À combien s'élève la caution pour l'animal ?"}, {"id": "A:QN36", "bid": "QB160", "f": "<span class=\"glabel\" style=\"display:block\">How long until we get the deposit back?<\/span>And once we've moved out, how long should we expect before the deposit comes back?", "b": "Et une fois que nous aurons quitté les lieux, pourriez-vous m'indiquer le délai à prévoir pour la restitution du dépôt de garantie ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">futur antérieur · cond<\/span><\/span>"}, {"id": "A:Q126", "bid": "QB095", "f": "<span class=\"glabel\" style=\"display:block\">Do we have to pay everything upfront?<\/span><mark>Do you need us to pay everything upfront<\/mark><span class=\"dim\">, or can we do a half-half where we pay half before you start writing and half after the project is done?<\/span>", "b": "<mark>Faut-il que nous réglions la totalité d'avance<\/mark><span class=\"dim\">, ou serait-il possible de procéder en deux fois : la moitié avant que vous ne commenciez à écrire, et le solde une fois le projet terminé ?<\/span><span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · ne explétif · cond<\/span><\/span>"}, {"id": "A:Q203", "bid": "QB095", "f": "<span class=\"glabel\" style=\"display:block\">Do we have to pay everything upfront?<\/span><mark>Do you need everything to be paid upfront?<\/mark><span class=\"dim\"> Or can we pay half after the move?<\/span>", "b": "<mark>Exigez-vous que tout soit réglé d'avance<\/mark><span class=\"dim\">, ou pourrions-nous verser la moitié après le déménagement ?<\/span><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q205", "bid": "QB096", "f": "<span class=\"glabel\" style=\"display:block\">Can we pay in instalments?<\/span>And can we also do a payment plan perhaps?", "b": "D'autre part, serait-il envisageable d'échelonner le paiement ?<span class=\"tags\"><span class=\"st\"><b>9d<\/b> D'autre part, serait-il envisageable de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q127", "bid": "QB096", "f": "<span class=\"glabel\" style=\"display:block\">Can we pay in instalments?<\/span><span class=\"dim\">Do you need us to pay everything upfront, or <\/span><mark>can we do a half-half where we pay half before you start writing and half after the project is done?<\/mark>", "b": "<span class=\"dim\">Faut-il que nous réglions la totalité d'avance, ou <\/span><mark>serait-il possible de procéder en deux fois : la moitié avant que vous ne commenciez à écrire, et le solde une fois le projet terminé ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · ne explétif · cond<\/span><\/span>"}, {"id": "A:Q204", "bid": "QB096", "f": "<span class=\"glabel\" style=\"display:block\">Can we pay in instalments?<\/span><span class=\"dim\">Do you need everything to be paid upfront? <\/span><mark>Or can we pay half after the move?<\/mark>", "b": "<span class=\"dim\">Exigez-vous que tout soit réglé d'avance, <\/span><mark>ou pourrions-nous verser la moitié après le déménagement ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:QN05", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>What would happen if I had to cancel at the last minute?", "b": "Que se passerait-il si je devais annuler à la dernière minute ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:QN06", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>And if I ever had to cancel a class last minute, would it still be taken off my package?", "b": "Et si jamais je devais annuler un cours au dernier moment, celui-ci serait-il tout de même décompté de mon forfait ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:QN10", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>What would happen if I missed a class?", "b": "Que se passerait-il si je manquais un cours ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:QG003", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>Would I lose my deposit?", "b": "Perdrais-je l'acompte versé ?"}, {"id": "A:QG005", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>Could I make it up?", "b": "Me serait-il possible de le rattraper ?"}, {"id": "A:Q163", "bid": "QB119", "f": "<span class=\"glabel\" style=\"display:block\">What interest rate do you offer?<\/span><span class=\"dim\">So <\/span><mark>what's the interest that you offer?<\/mark>", "b": "<span class=\"dim\">Dans ce cas, <\/span><mark>quel taux d'intérêt offrez-vous ?<\/mark>"}, {"id": "A:Q070", "bid": "QB056", "f": "<span class=\"glabel\" style=\"display:block\">How does the pay work?<\/span>And I also want to know more about the pay.", "b": "J'aimerais également en savoir davantage sur la rémunération.<span class=\"tags\"><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q074", "bid": "QB059", "f": "<span class=\"glabel\" style=\"display:block\">How much do they earn in total from all those missions?<\/span>What would their total pay across all the missions be?", "b": "Quelle serait sa rémunération totale sur l'ensemble des missions ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q075", "bid": "QB060", "f": "<span class=\"glabel\" style=\"display:block\">Are there bonuses on top of that?<\/span>And are there bonuses on top of this?", "b": "Par ailleurs, y a-t-il des primes en plus de cela ?<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><\/span>"}, {"id": "A:Q078", "bid": "QB063", "f": "<span class=\"glabel\" style=\"display:block\">If there's much more traffic than usual, do we get paid for the extra time on that mission?<\/span>In certain cases where there may be a lot more traffic than normal, do we get compensated for the extra time that we spend doing a particular mission?", "b": "Dans l'éventualité où la circulation serait bien plus dense que d'habitude, seriez-vous en mesure de nous dédommager pour le temps supplémentaire passé sur une mission ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P3", "sec": "A", "code": "P3", "name": "Time", "bucket": "Questions", "items": [{"id": "A:Q002", "bid": "QB002", "f": "<span class=\"glabel\" style=\"display:block\">What are your opening hours?<\/span>And I also wanted to know more about your operating hours.", "b": "Par ailleurs, j'aimerais en savoir un peu plus sur vos horaires d'ouverture.<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q012", "bid": "QB011", "f": "<span class=\"glabel\" style=\"display:block\">Which days of the week do you have salsa classes?<\/span>I would like to know the time and also the days of the week you offer salsa classes.", "b": "J'aimerais connaître l'horaire, ainsi que les jours de la semaine où vous les proposez.<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q011", "bid": "QB010", "f": "<span class=\"glabel\" style=\"display:block\">What time do the salsa classes start?<\/span>So when do the salsa classes start exactly?", "b": "Alors, quand les cours de salsa commencent-ils, exactement ?"}, {"id": "A:Q242", "bid": "QB133", "f": "<span class=\"glabel\" style=\"display:block\">Are you open all year round, or only in some months?<\/span>Is this something that's offered just for a season, or is this also offered year-round?", "b": "Je voudrais savoir si cette activité n'est proposée qu'en saison, ou bien toute l'année.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q184", "bid": "QB133", "f": "<span class=\"glabel\" style=\"display:block\">Are you open all year round, or only in some months?<\/span><mark>How many months of the year does the farm open<\/mark><span class=\"dim\">, and in which months are they closed?<\/span>", "b": "<mark>Combien de mois par an la ferme est-elle ouverte<\/mark><span class=\"dim\">, et pendant quels mois ferme-t-elle ses portes ?<\/span>"}, {"id": "A:Q185", "bid": "QB133", "f": "<span class=\"glabel\" style=\"display:block\">Are you open all year round, or only in some months?<\/span><span class=\"dim\">How many months of the year does the farm open, and <\/span><mark>in which months are they closed?<\/mark>", "b": "<span class=\"dim\">Combien de mois par an la ferme est-elle ouverte, et <\/span><mark>pendant quels mois ferme-t-elle ses portes ?<\/mark>"}, {"id": "A:QN13", "bid": "QB162", "f": "<span class=\"glabel\" style=\"display:block\">Why are you closed at that time?<\/span>And why do you close during those months?", "b": "Et pour quelle raison fermez-vous durant ces mois-là ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><\/span>"}, {"id": "A:QG006", "bid": "QB162", "f": "<span class=\"glabel\" style=\"display:block\">Why are you closed at that time?<\/span>Is it because of the harvest?", "b": "Est-ce lié aux récoltes ?"}, {"id": "A:Q057", "bid": "QB045", "f": "<span class=\"glabel\" style=\"display:block\">What's the best time of day to see these sites?<\/span>What's the best time of the day to discover these sites?", "b": "À quel moment de la journée vaut-il mieux découvrir ces sites ?"}, {"id": "A:Q014", "bid": "QB013", "f": "<span class=\"glabel\" style=\"display:block\">Could the salsa schedule change in a few months?<\/span>Is there any chance the salsa class schedule might change in the future, maybe in a few months?", "b": "Se pourrait-il que les horaires des cours de salsa changent à l'avenir, d'ici quelques mois peut-être ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q015", "bid": "QB014", "f": "<span class=\"glabel\" style=\"display:block\">Do you ever add new class times?<\/span>Or do you ever add new class times?", "b": "Ou vous arrive-t-il d'ajouter de nouveaux créneaux ?"}, {"id": "A:QN09", "bid": "QB014", "f": "<span class=\"glabel\" style=\"display:block\">Do you ever add new class times?<\/span>Would you consider opening a Wednesday evening slot, for people who finish late like me?", "b": "Envisageriez-vous la possibilité d'ouvrir un créneau le mercredi soir, pour ceux qui, comme moi, finissent tard ?<span class=\"tags\"><span class=\"st\"><b>5d<\/b> Envisageriez-vous la possibilité de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q027", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>How long does the workshop take exactly?", "b": "Pouvez-vous m'indiquer la durée exacte de l'atelier ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q013", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>And what's the duration of each class?", "b": "Et quelle est la durée de chaque cours ?"}, {"id": "A:Q212", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>How long would the party run for?", "b": "Sur quelle durée la fête s'étendrait-elle ?<span class=\"tags\"><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN39", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>So if I understand correctly, the workshop takes up the whole morning?", "b": "Si je comprends bien, l'atelier occupe donc toute la matinée ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><\/span>"}, {"id": "A:Q213", "bid": "QB143", "f": "<span class=\"glabel\" style=\"display:block\">Does the length depend on the package we choose?<\/span>And is that duration different based on what package we select?", "b": "Et cette durée dépend-elle de la formule que nous choisirions ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q221", "bid": "QB147", "f": "<span class=\"glabel\" style=\"display:block\">How long is the whole program?<\/span><span class=\"dim\">How many times do we have to show up per week, and <\/span><mark>how many months would the total program be?<\/mark>", "b": "<span class=\"dim\">À quelle fréquence faudrait-il venir, combien de fois par semaine, et <\/span><mark>sur quelle durée s'étalerait l'ensemble du programme ?<\/mark><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q227", "bid": "QB147", "f": "<span class=\"glabel\" style=\"display:block\">How long is the whole program?<\/span><mark>I want to know not only how long it takes from start to finish<\/mark><span class=\"dim\">, but also how many hours I would have to train per week, not only at your center, but also on my own.<\/span>", "b": "<mark>J'aimerais savoir non seulement combien de temps il faut compter du début à la fin<\/mark><span class=\"dim\">, mais aussi combien d'heures il faudrait que je m'entraîne par semaine, pas uniquement dans votre centre, mais aussi de mon côté.<\/span><span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q174", "bid": "QB127", "f": "<span class=\"glabel\" style=\"display:block\">Does the package expire after a certain time?<\/span>Are there expiration dates to the package? Like, do we need to take a certain amount of classes within a set time for the package to still be valid?", "b": "Le forfait a-t-il une date d'expiration ? Autrement dit, y a-t-il une condition particulière à respecter pour qu'il reste valable, comme suivre un certain nombre de cours dans un délai donné ?"}, {"id": "A:Q028", "bid": "QB025", "f": "<span class=\"glabel\" style=\"display:block\">Do you run it regularly, or is it a one-off?<\/span><mark>Is this a recurring workshop that you hold from time to time<\/mark><span class=\"dim\">, or is it just a one-time event?<\/span>", "b": "<mark>À quelle fréquence organisez-vous cet atelier ?<\/mark><span class=\"dim\"> Ou s'agit-il simplement d'un événement ponctuel ?<\/span><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q029", "bid": "QB025", "f": "<span class=\"glabel\" style=\"display:block\">Do you run it regularly, or is it a one-off?<\/span><span class=\"dim\">Is this a recurring workshop that you hold from time to time, or <\/span><mark>is it just a one-time event?<\/mark>", "b": "<span class=\"dim\">À quelle fréquence organisez-vous cet atelier ? Ou <\/span><mark>s'agit-il simplement d'un événement ponctuel ?<\/mark><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q143", "bid": "QB025", "f": "<span class=\"glabel\" style=\"display:block\">Do you run it regularly, or is it a one-off?<\/span>Does it take place during autumn every year or is it once every two years or something of that nature?", "b": "Cet événement se tient-il chaque automne, ou n'a-t-il lieu qu'une année sur deux, quelque chose de ce genre ?"}, {"id": "A:Q071", "bid": "QB057", "f": "<span class=\"glabel\" style=\"display:block\">How many missions can I get per month?<\/span>And how many missions can we expect to get per month?", "b": "Et à combien de missions par mois peut-on s'attendre ?"}, {"id": "A:Q073", "bid": "QB057", "f": "<span class=\"glabel\" style=\"display:block\">How many missions can I get per month?<\/span>And for an experienced shopper, what would that number look like?", "b": "Et pour un client mystère expérimenté, à combien s'élèverait ce chiffre ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN58", "bid": "QB057", "f": "<span class=\"glabel\" style=\"display:block\">How many missions can I get per month?<\/span>If I could only be free in the evenings, how much would that affect the number of missions I'd get?", "b": "Si je ne pouvais me libérer que le soir, dans quelle mesure cela affecterait-il le nombre de missions qu'on me confierait ?<span class=\"tags\"><span class=\"st\"><b>5b<\/b> Dans quelle mesure cela affecterait-il…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q072", "bid": "QB058", "f": "<span class=\"glabel\" style=\"display:block\">Is it steady once you have some experience?<\/span>I'm wondering if there will be some sort of consistency once we get a certain amount of experience.", "b": "Je me demande si une certaine régularité s'installe une fois qu'on a acquis un peu d'expérience."}, {"id": "A:Q076", "bid": "QB061", "f": "<span class=\"glabel\" style=\"display:block\">When do you expect us to do the missions?<\/span>In terms of availability, when do you normally expect us to take on missions?", "b": "Côté disponibilités, à quels moments vous attendez-vous, en général, à ce que nous prenions des missions ?<span class=\"tags\"><span class=\"gr\">subj · idiome<\/span><\/span>"}, {"id": "A:Q220", "bid": "QB125", "f": "<span class=\"glabel\" style=\"display:block\">How many times a week do I need to come?<\/span><mark>How many times do we have to show up per week<\/mark><span class=\"dim\">, and how many months would the total program be?<\/span>", "b": "<mark>À quelle fréquence faudrait-il venir, combien de fois par semaine<\/mark><span class=\"dim\">, et sur quelle durée s'étalerait l'ensemble du programme ?<\/span><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q172", "bid": "QB125", "f": "<span class=\"glabel\" style=\"display:block\">How many times a week do I need to come?<\/span>How many days per week do we usually have to take, or do you recommend us to take classes?", "b": "Combien de cours par semaine faut-il suivre, en général ? Ou plutôt, combien nous conseilleriez-vous d'en suivre ?<span class=\"tags\"><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q228", "bid": "QB125", "f": "<span class=\"glabel\" style=\"display:block\">How many times a week do I need to come?<\/span><span class=\"dim\">I want to know not only how long it takes from start to finish, <\/span><mark>but also how many hours I would have to train per week, not only at your center, but also on my own.<\/mark>", "b": "<span class=\"dim\">J'aimerais savoir non seulement combien de temps il faut compter du début à la fin, <\/span><mark>mais aussi combien d'heures il faudrait que je m'entraîne par semaine, pas uniquement dans votre centre, mais aussi de mon côté.<\/mark><span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q060", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>How far in advance do we usually have to book?", "b": "Combien de temps à l'avance faut-il réserver, en général ?"}, {"id": "A:Q116", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>How far in advance do you normally expect us to place an order?", "b": "Pourriez-vous m'indiquer le délai à prévoir pour passer commande ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q117", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span><span class=\"dim\">I guess it depends on the specific product that we're ordering, so <\/span><mark>give me the different numbers based on the different options.<\/mark>", "b": "<span class=\"dim\">J'imagine que cela dépend du produit, auquel cas <\/span><mark>j'aimerais connaître les délais propres à chaque option.<\/mark><span class=\"tags\"><span class=\"gr\">cond · dont/auquel<\/span><\/span>"}, {"id": "A:Q165", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>How far in advance do we need to book them?", "b": "Et ces rendez-vous, combien de temps à l'avance faut-il les réserver ?<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:Q239", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>And if that's the case, how far in advance should we book?", "b": "Et si tel est le cas, avec combien d'avance faudrait-il s'y prendre ?<span class=\"tags\"><span class=\"gr\">cond · idiome · en/y<\/span><\/span>"}, {"id": "A:Q030", "bid": "QB026", "f": "<span class=\"glabel\" style=\"display:block\">Do you have any spots left for next Saturday?<\/span>Do you happen to have any spots available for a workshop next Saturday?", "b": "Auriez-vous encore des places disponibles pour un atelier samedi prochain, par hasard ?<span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q107", "bid": "QB083", "f": "<span class=\"glabel\" style=\"display:block\">Would a delivery on July seventh at seven AM work for you?<\/span>The day would be July seventh, and the delivery time would be something like seven AM. Would that work for you?", "b": "Ce serait pour le sept juillet, vers sept heures du matin. Cela vous conviendrait-il ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q238", "bid": "QB155", "f": "<span class=\"glabel\" style=\"display:block\">Do tickets sell out fast?<\/span><span class=\"dim\">You mentioned in the ad that you advise us to book quickly, so <\/span><mark>I'm wondering if tickets tend to sell out really fast?<\/mark>", "b": "<span class=\"dim\">Vous dites dans l'annonce qu'il est conseillé de réserver rapidement, <\/span><mark>je me demandais donc si les places avaient tendance à partir très vite.<\/mark>"}, {"id": "A:Q050", "bid": "QB040", "f": "<span class=\"glabel\" style=\"display:block\">How long does delivery take after I order?<\/span>How soon can we expect the delivery to arrive after placing the order? What’s the average delivery time after placing an order?", "b": "Pourriez-vous m'indiquer le délai de livraison à prévoir une fois la commande passée ? En moyenne, combien de temps faut-il compter ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN12", "bid": "QB040", "f": "<span class=\"glabel\" style=\"display:block\">How long does delivery take after I order?<\/span>And how long should I expect between ordering and getting the song?", "b": "Et quel délai faudrait-il prévoir entre la commande et la livraison de la chanson ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P4", "sec": "A", "code": "P4", "name": "Place & access", "bucket": "Questions", "items": [{"id": "A:Q170", "bid": "QB123", "f": "<span class=\"glabel\" style=\"display:block\">Where exactly are you located?<\/span>If you don't mind, could you please give me the exact address of this studio?", "b": "Si cela ne vous dérange pas, auriez-vous l'amabilité de me communiquer l'adresse exacte de l'atelier ?<span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:Q168", "bid": "QB123", "f": "<span class=\"glabel\" style=\"display:block\">Where exactly are you located?<\/span>Where exactly do the classes take place?", "b": "Où se déroulent-ils, exactement ?"}, {"id": "A:Q232", "bid": "QB123", "f": "<span class=\"glabel\" style=\"display:block\">Where exactly are you located?<\/span>Where are you located again?", "b": "Sauriez-vous me rappeler où vous vous trouvez ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q169", "bid": "QB124", "f": "<span class=\"glabel\" style=\"display:block\">Do you have just one location, or several branches?<\/span>Do you only have one branch and one location of this studio, or do you also have multiple branches?", "b": "Votre atelier ne dispose-t-il que d'un seul local, ou avez-vous plusieurs établissements ?"}, {"id": "A:QN14", "bid": "QB163", "f": "<span class=\"glabel\" style=\"display:block\">Are your locations different from each other?<\/span>And if you have several locations, is there a real difference between them in terms of equipment?", "b": "Et si vous avez plusieurs établissements, y a-t-il une différence notable entre eux en matière d'équipement ?<span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:Q024", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span>And how exactly do we get there?", "b": "Et pouvez-vous m'indiquer comment s'y rendre, exactement ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q192", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span><mark>Is it possible for us to get there by bus<\/mark><span class=\"dim\">, or do we have to drive there?<\/span>", "b": "<mark>Savez-vous si la ferme est desservie par un bus<\/mark><span class=\"dim\">, ou faut-il impérativement venir en voiture ?<\/span><span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><\/span>"}, {"id": "A:Q193", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span><span class=\"dim\">Is it possible for us to get there by bus, or <\/span><mark>do we have to drive there?<\/mark>", "b": "<span class=\"dim\">Savez-vous si la ferme est desservie par un bus, ou <\/span><mark>faut-il impérativement venir en voiture ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><\/span>"}, {"id": "A:QN41", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span>Does that mean we'd absolutely need a car?", "b": "Cela signifie-t-il qu'il faudrait impérativement que nous ayons une voiture ?<span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN44", "bid": "QB164", "f": "<span class=\"glabel\" style=\"display:block\">How often do the buses come?<\/span>How often do the buses that go to the farm run?", "b": "À quelle fréquence passent les bus qui desservent la ferme ?<span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q142", "bid": "QB106", "f": "<span class=\"glabel\" style=\"display:block\">What's the nearest train station?<\/span>What is the nearest train station to the apartment?", "b": "Et la gare la plus proche de l'appartement, laquelle est-ce ?<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:Q194", "bid": "QB140", "f": "<span class=\"glabel\" style=\"display:block\">What is the road there like?<\/span>What's the condition of the road to the farm like?", "b": "Dans quel état se trouve la route qui mène à la ferme ?"}, {"id": "A:Q195", "bid": "QB140", "f": "<span class=\"glabel\" style=\"display:block\">What is the road there like?<\/span>I'm just wondering if they're in a bad quality with potholes, mud, stuff like that.", "b": "Je me demande si elle n'est pas trop abîmée, avec des nids-de-poule, de la boue, ce genre de choses."}, {"id": "A:Q152", "bid": "QB113", "f": "<span class=\"glabel\" style=\"display:block\">Where can we park?<\/span><span class=\"dim\">In terms of parking, <\/span><mark>where can we park<\/mark><span class=\"dim\"> and how much do we have to pay for the parking?<\/span>", "b": "<span class=\"dim\">Pour ce qui est du stationnement, <\/span><mark>pouvez-vous m'indiquer où nous pourrions nous garer<\/mark><span class=\"dim\">, et combien il faudrait prévoir ?<\/span><span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN45", "bid": "QB165", "f": "<span class=\"glabel\" style=\"display:block\">Can we reserve a parking spot in advance?<\/span>On the other hand, would it be possible to reserve a parking spot in advance?", "b": "D'autre part, serait-il envisageable de réserver une place de parking à l'avance ?<span class=\"tags\"><span class=\"st\"><b>9d<\/b> D'autre part, serait-il envisageable de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q046", "bid": "QB038", "f": "<span class=\"glabel\" style=\"display:block\">How far do you deliver?<\/span>How far do you deliver?", "b": "Jusqu'où livrez-vous, au juste ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QG001", "bid": "QB038", "f": "<span class=\"glabel\" style=\"display:block\">How far do you deliver?<\/span>Is there a distance limit for delivery?", "b": "Y a-t-il une limite de distance pour la livraison ?"}, {"id": "A:QN16", "bid": "QB166", "f": "<span class=\"glabel\" style=\"display:block\">Could you deliver further if I paid extra?<\/span>Would you consider delivering a little outside your usual area, even if I paid extra?", "b": "Envisageriez-vous la possibilité de livrer un peu au-delà de votre zone habituelle, quitte à ce que je paie un supplément ?<span class=\"tags\"><span class=\"st\"><b>5d<\/b> Envisageriez-vous la possibilité de…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q135", "bid": "QB102", "f": "<span class=\"glabel\" style=\"display:block\">Can you see the mountains from there?<\/span>So I'm wondering if you can see the mountains and also the waterfront.", "b": "J'aimerais donc savoir si l'on voit les montagnes, et aussi le front de mer.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q134", "bid": "QB102", "f": "<span class=\"glabel\" style=\"display:block\">Can you see the mountains from there?<\/span><mark>So I'm wondering if you can see the mountains<\/mark><span class=\"dim\"> and also the waterfront.<\/span>", "b": "<mark>J'aimerais donc savoir si l'on voit les montagnes<\/mark><span class=\"dim\">, et aussi le front de mer.<\/span><span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN43", "bid": "QB102", "f": "<span class=\"glabel\" style=\"display:block\">Can you see the mountains from there?<\/span>Can I confirm that the apartment really looks out on the waterfront, and not onto the courtyard?", "b": "Pourriez-vous me confirmer que l'appartement donne bien sur le front de mer, et non sur la cour ?"}]}, {"key": "A-P5", "sec": "A", "code": "P5", "name": "Safety & risk", "bucket": "Questions", "items": [{"id": "A:Q001", "bid": "QB001", "f": "<span class=\"glabel\" style=\"display:block\">How safe is it?<\/span>So obviously, one of the primary concerns I have is safety.", "b": "Alors évidemment, ce qui me préoccupe avant tout, c'est la sécurité.<span class=\"tags\"><span class=\"gr\">mise en relief<\/span><\/span>"}, {"id": "A:Q234", "bid": "QB152", "f": "<span class=\"glabel\" style=\"display:block\">What safety procedures do you follow?<\/span><span class=\"dim\">So <\/span><mark>can you tell me the specific safety procedures that you follow?<\/mark>", "b": "Pourriez-vous me décrire précisément les procédures de sécurité que vous suivez ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q218", "bid": "QB145", "f": "<span class=\"glabel\" style=\"display:block\">How likely is something like that to happen?<\/span>So how likely are scenarios like that to happen?", "b": "Pourriez-vous me dire dans quelle mesure ce genre de scénario risque de se produire ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN17", "bid": "QB167", "f": "<span class=\"glabel\" style=\"display:block\">What should I do if that happens?<\/span>In case the horse bolts while I'm in the saddle, what should I do?", "b": "Au cas où le cheval s'emballerait alors que je suis en selle, que devrais-je faire ?<span class=\"tags\"><span class=\"st\"><b>5c<\/b> Au cas où…, que devrais-je faire ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN15", "bid": "QB167", "f": "<span class=\"glabel\" style=\"display:block\">What should I do if that happens?<\/span>In case the road becomes impassable because of the rain, what should we do?", "b": "Au cas où la route deviendrait impraticable à cause de la pluie, que devrions-nous faire ?<span class=\"tags\"><span class=\"st\"><b>5c<\/b> Au cas où…, que devrais-je faire ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN29", "bid": "QB167", "f": "<span class=\"glabel\" style=\"display:block\">What should I do if that happens?<\/span>In case the delivery driver can't reach my friend, what should I do?", "b": "Au cas où le livreur n'arriverait pas à joindre mon amie, que devrais-je faire ?<span class=\"tags\"><span class=\"st\"><b>5c<\/b> Au cas où…, que devrais-je faire ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN48", "bid": "QB168", "f": "<span class=\"glabel\" style=\"display:block\">Why are accidents so rare?<\/span>How do you explain accidents like that being so rare?", "b": "Comment expliquez-vous que ce genre d'accident soit aussi rare ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q233", "bid": "QB146", "f": "<span class=\"glabel\" style=\"display:block\">Has that ever happened at your centre?<\/span><span class=\"dim\">So I just want to ask you directly, <\/span><mark>has there been any accidents at your center, throughout your history?<\/mark>", "b": "<span class=\"dim\">Permettez-moi de vous poser la question sans détour : <\/span><mark>y a-t-il déjà eu des accidents dans votre centre depuis sa création ?<\/mark><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q219", "bid": "QB146", "f": "<span class=\"glabel\" style=\"display:block\">Has that ever happened at your centre?<\/span>Have you ever had something like that happen before at your center?", "b": "Ce genre d'incident s'est-il déjà produit dans votre centre ?"}, {"id": "A:QN47", "bid": "QB146", "f": "<span class=\"glabel\" style=\"display:block\">Has that ever happened at your centre?<\/span>If I understand correctly, you mean there hasn't been a single accident since you opened?", "b": "Si je comprends bien, vous voulez dire qu'il n'y a jamais eu le moindre accident depuis l'ouverture ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><\/span>"}, {"id": "A:Q062", "bid": "QB050", "f": "<span class=\"glabel\" style=\"display:block\">Do you have lifeguards?<\/span><span class=\"dim\">I'm pretty sure you offer life vests, but <\/span><mark>in case we need rescuing, do you provide medical care, first aid and lifeguarding services?<\/mark>", "b": "<span class=\"dim\">Je ne doute pas que vous fournissiez des gilets de sauvetage, mais <\/span><mark>au cas où nous aurions besoin d'être secourus, proposez-vous une assistance médicale, des premiers secours et un service de sauvetage ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q131", "bid": "QB099", "f": "<span class=\"glabel\" style=\"display:block\">Are the foundations strong and earthquake-proof?<\/span><span class=\"dim\">One concern I have about a top-floor apartment is, in the event of an earthquake, <\/span><mark>I just wanna make sure that the foundations of the building are strong and earthquake-proof.<\/mark>", "b": "<span class=\"dim\">Ce qui m'inquiète avec un appartement au dernier étage, c'est le risque de tremblement de terre : <\/span><mark>je voudrais m'assurer que les fondations de l'immeuble sont suffisamment solides et conformes aux normes antisismiques.<\/mark><span class=\"tags\"><span class=\"gr\">mise en relief · cond<\/span><\/span>"}, {"id": "A:QN49", "bid": "QB099", "f": "<span class=\"glabel\" style=\"display:block\">Are the foundations strong and earthquake-proof?<\/span>How is this building different from more recent constructions in terms of earthquake standards?", "b": "En quoi cet immeuble diffère-t-il des constructions plus récentes en matière de normes antisismiques ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:Q133", "bid": "QB101", "f": "<span class=\"glabel\" style=\"display:block\">Is the fire escape up to standard?<\/span>Is the fire escape up to standard?", "b": "L'escalier de secours est-il bien aux normes ?"}, {"id": "A:QN50", "bid": "QB169", "f": "<span class=\"glabel\" style=\"display:block\">How often is the safety equipment checked?<\/span>How often is the fire safety equipment inspected?", "b": "À quelle fréquence les équipements de sécurité incendie sont-ils contrôlés ?<span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q132", "bid": "QB100", "f": "<span class=\"glabel\" style=\"display:block\">When was the building built?<\/span>When exactly was it constructed, the apartment building?", "b": "Savez-vous en quelle année l'immeuble a été construit, exactement ?<span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><\/span>"}, {"id": "A:Q237", "bid": "QB154", "f": "<span class=\"glabel\" style=\"display:block\">Is the lake deep enough to survive a fall if we wear a life vest?<\/span>Knock on wood that this never happens, but in the event that something horrible happens, is the lake deep enough for us to survive if we have a life vest on?", "b": "Je touche du bois pour que ça n'arrive jamais, mais au cas où il se produirait quelque chose d'horrible, le lac est-il suffisamment profond pour que l'on s'en sorte, à condition de porter un gilet de sauvetage ?<span class=\"tags\"><span class=\"gr\">idiome · subj · cond · en/y<\/span><\/span>"}, {"id": "A:Q187", "bid": "QB135", "f": "<span class=\"glabel\" style=\"display:block\">Are there bees and wasps around?<\/span><span class=\"dim\">So <\/span><mark>are there any sort of critters like that around?<\/mark>", "b": "Y a-t-il beaucoup de bestioles de ce genre chez vous ?"}, {"id": "A:Q188", "bid": "QB136", "f": "<span class=\"glabel\" style=\"display:block\">Is there any shade on the farm?<\/span><mark>I'm wondering if you have any shaded areas on the farm<\/mark><span class=\"dim\">, and do you recommend us to bring hats with us?<\/span>", "b": "<mark>Auriez-vous des coins à l'ombre à la ferme ?<\/mark><span class=\"dim\"> Et nous conseilleriez-vous d'apporter des chapeaux ?<\/span><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q183", "bid": "QB132", "f": "<span class=\"glabel\" style=\"display:block\">Do you use pesticides or other chemicals on your crops?<\/span>I'm wondering if you use any pesticides or any other chemicals to grow these crops.", "b": "Sauriez-vous m'indiquer si vous utilisez des pesticides ou d'autres produits chimiques pour vos cultures ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q035", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>I would also like to know what your plan is in the event that it rains.", "b": "J'aimerais également savoir ce que vous avez prévu en cas de pluie.<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN18", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>What would happen if the weather turned bad during the festival?", "b": "Que se passerait-il si la météo se dégradait pendant le festival ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q036", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>What’s the plan both during the performances and at night when we’re camping?", "b": "Qu'avez-vous prévu, aussi bien pendant les concerts que la nuit, lorsque nous camperons ?"}, {"id": "A:QG007", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>Would the concerts go ahead?", "b": "Les concerts seraient-ils maintenus ?"}, {"id": "A:Q059", "bid": "QB047", "f": "<span class=\"glabel\" style=\"display:block\">Is there somewhere on the boat to shelter from the rain?<\/span>Is there a place in the boat where we can shelter from the rain?", "b": "Y aurait-il un endroit sur le bateau où l'on puisse s'abriter en cas de pluie ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q235", "bid": "QB049", "f": "<span class=\"glabel\" style=\"display:block\">Is there medical help on site if something happens?<\/span><span class=\"dim\">And <\/span><mark>in the event that something happens, is there a medical team on site?<\/mark>", "b": "<span class=\"dim\">Cela dit, qu'en est-il de l'assistance médicale ? <\/span><mark>Au cas où il arriverait quelque chose, une équipe médicale serait-elle présente sur place ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q086", "bid": "QB068", "f": "<span class=\"glabel\" style=\"display:block\">What kind of care do you provide if that happens?<\/span>And what kind of service are you able to provide in that event?", "b": "Et dans ce cas-là, quel type de prise en charge seriez-vous en mesure d'assurer ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q199", "bid": "QB069", "f": "<span class=\"glabel\" style=\"display:block\">Are you insured if your staff damage something?<\/span>Do you offer any kind of insurance coverage in case some of my items get damaged by your staff during the move?", "b": "Disposez-vous d'une assurance au cas où votre équipe endommagerait certaines de mes affaires pendant le déménagement ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q087", "bid": "QB069", "f": "<span class=\"glabel\" style=\"display:block\">Are you insured if your staff damage something?<\/span><mark>In the hypothetical event that something happens to one of my animals and your staff is at fault for it, do you offer any sort of insurance coverage<\/mark><span class=\"dim\"> or refund policy?<\/span>", "b": "<mark>Dans l'hypothèse où il arriverait quelque chose à l'un de mes animaux et où votre personnel serait en tort, proposez-vous une assurance<\/mark><span class=\"dim\"> ou une politique de remboursement ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q088", "bid": "QB070", "f": "<span class=\"glabel\" style=\"display:block\">Do you have a refund policy?<\/span><span class=\"dim\">In the hypothetical event that something happens to one of my animals and your staff is at fault for it, <\/span><mark>do you offer any sort of insurance coverage or refund policy?<\/mark>", "b": "<span class=\"dim\">Dans l'hypothèse où il arriverait quelque chose à l'un de mes animaux et où votre personnel serait en tort, <\/span><mark>proposez-vous une assurance ou une politique de remboursement ?<\/mark><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q166", "bid": "QB121", "f": "<span class=\"glabel\" style=\"display:block\">If we need to lock our credit card right away because of theft, what insurance do you offer?<\/span>And in the event that we need to immediately lock our credit card 'cause of some sort of a theft, what kind of insurance do you offer us?", "b": "Et au cas où nous devrions faire opposition sur notre carte en urgence, suite à un vol, quel type d'assurance nous proposeriez-vous ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q167", "bid": "QB122", "f": "<span class=\"glabel\" style=\"display:block\">Do you offer chargebacks?<\/span>And do you also offer chargebacks?", "b": "D'autre part, serait-il envisageable d'obtenir un remboursement en cas de paiement contesté ?<span class=\"tags\"><span class=\"st\"><b>9d<\/b> D'autre part, serait-il envisageable de…<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P6", "sec": "A", "code": "P6", "name": "Trust", "bucket": "Questions", "items": [{"id": "A:Q083", "bid": "QB065", "f": "<span class=\"glabel\" style=\"display:block\">How long have you been in business?<\/span><span class=\"dim\">I just want to ask you this directly. <\/span><mark>How long have you been doing this<\/mark><span class=\"dim\">, and how well-known are you in this space?<\/span>", "b": "<span class=\"dim\">Je vais être franc avec vous : <\/span><mark>depuis combien de temps exercez-vous ce métier<\/mark><span class=\"dim\"
