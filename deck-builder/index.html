dependent you've become.<\/span>That would show you to what point you've become dependent on all that, and if it affects you already more than what you believe.", "b": "Ça te montrerait à quel point t'es devenu dépendant de tout ça, et si ça t'affecte déjà plus que ce que tu crois."}, {"id": "B:BP0935", "bid": "BAY130", "f": "<span class=\"glabel\" style=\"display:block\">Right now, your only other option is social media.<\/span><span class=\"dim\">Because there, <\/span><mark>for the moment, if you don't feel like going to the library, your alternative, roughly, it's just the social networks, you know.<\/mark>", "b": "<span class=\"dim\">Parce que là, <\/span><mark>pour l'instant, si t'as pas envie d'aller à la bibliothèque, ton alternative, en gros, c'est juste les réseaux sociaux, quoi.<\/mark>"}, {"id": "B:BP0928", "bid": "BAY131", "f": "<span class=\"glabel\" style=\"display:block\">You could try a device made for reading.<\/span><span class=\"dim\">Me, I installed everything on my phone too, but otherwise, <\/span><mark>you could try one of those e-readers that are made on purpose to read on screen.<\/mark>", "b": "<span class=\"dim\">Moi, j'ai tout installé sur mon téléphone aussi, mais sinon, <\/span><mark>tu pourrais essayer une de ces liseuses qui sont faites exprès pour lire sur écran.<\/mark>"}, {"id": "B:BP0929", "bid": "BAY132", "f": "<span class=\"glabel\" style=\"display:block\">It's much easier on your eyes.<\/span>They have another type of screen, anti-glare or a thing like that, so then it's much more restful for the eyes.", "b": "Elles ont un autre type d'écran, anti-reflets ou un truc comme ça, du coup c'est beaucoup plus reposant pour les yeux."}, {"id": "B:BP0930", "bid": "BAY132", "f": "<span class=\"glabel\" style=\"display:block\">It's much easier on your eyes.<\/span>You can read for hours and you have much less pain in the eyes.", "b": "Tu peux lire pendant des heures et t'as beaucoup moins mal aux yeux."}]}, {"key": "B-BA6", "sec": "B", "code": "BA6", "name": "People & togetherness", "bucket": "Arguments", "items": [{"id": "B:BP0791", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span>And then me, I'll come with you, like that we do it together.", "b": "Et puis moi, je viendrai avec toi, comme ça on le fait ensemble."}, {"id": "B:BP0075", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span><span class=\"dim\">And yeah, <\/span><mark>I come with you if you want<\/mark><span class=\"dim\">, huh.<\/span>", "b": "<span class=\"dim\">Et ouais, <\/span><mark>je viens avec toi si tu veux<\/mark><span class=\"dim\">, hein.<\/span>"}, {"id": "B:BP0755", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span>And if it tempts you, me too I'd squarely be up for doing it with you.", "b": "Et si ça te tente, moi aussi ça me dirait carrément de le faire avec toi."}, {"id": "B:BP0813", "bid": "BAY133", "f": "<span class=\"glabel\" style=\"display:block\">I'll come with you; we'll do it together.<\/span>It would motivate you more if I signed up too?", "b": "Ça te motiverait plus si je m'inscrivais aussi ?"}, {"id": "B:BP0064", "bid": "BAY134", "f": "<span class=\"glabel\" style=\"display:block\">You won't be alone; you'd have company.<\/span><span class=\"dim\">Yeah, you're right, but <\/span><mark>you're not obliged to do it all alone.<\/mark>", "b": "<span class=\"dim\">Ouais, t'as raison, mais <\/span><mark>t'es pas obligé de le faire tout seul.<\/mark>"}, {"id": "B:BP0500", "bid": "BAY134", "f": "<span class=\"glabel\" style=\"display:block\">You won't be alone; you'd have company.<\/span><mark>You would also have some company<\/mark><span class=\"dim\">, you would have something new to do, and that would make you a bit of change.<\/span>", "b": "<mark>T'aurais aussi de la compagnie<\/mark><span class=\"dim\">, t'aurais quelque chose de nouveau à faire, et ça te ferait un peu de changement.<\/span>"}, {"id": "B:BP0065", "bid": "BAY135", "f": "<span class=\"glabel\" style=\"display:block\">You can go with friends or family.<\/span>You could go there in family or with mates.", "b": "Tu pourrais y aller en famille ou avec des potes."}, {"id": "B:BP0690", "bid": "BAY135", "f": "<span class=\"glabel\" style=\"display:block\">You can go with friends or family.<\/span>After, I don't see why you should necessarily do that as a family.", "b": "Après, je vois pas pourquoi tu devrais forcément faire ça en famille."}, {"id": "B:BP0691", "bid": "BAY135", "f": "<span class=\"glabel\" style=\"display:block\">You can go with friends or family.<\/span>I'm practically sure that you can go there with friends too.", "b": "Je suis quasiment sûr que tu peux y aller avec des amis aussi."}, {"id": "B:BP0052", "bid": "BAY136", "f": "<span class=\"glabel\" style=\"display:block\">I just want to spend time with you.<\/span><mark>Me, what I want, it's just to pass this moment with you<\/mark><span class=\"dim\">, and I really think that it could be a memorable experience for us all.<\/span>", "b": "<mark>Moi, ce que je veux, c'est juste passer ce moment avec toi<\/mark><span class=\"dim\">, et je pense vraiment que ça pourrait être une expérience mémorable pour nous tous.<\/span>"}, {"id": "B:BP1100", "bid": "BAY137", "f": "<span class=\"glabel\" style=\"display:block\">We haven't hung out in a while.<\/span><span class=\"dim\">On top, <\/span><mark>it's been a little moment that we haven't seen each other<\/mark><span class=\"dim\">, and I really have the desire that we do more stuff this summer — I think that it's going to be really nice for all our mates.<\/span>", "b": "<span class=\"dim\">En plus, <\/span><mark>ça fait un petit moment qu'on s'est pas vus<\/mark><span class=\"dim\">, et j'ai vraiment envie qu'on fasse plus de trucs cet été — je pense que ça va être vraiment sympa pour tous nos potes.<\/span>"}, {"id": "B:BP0218", "bid": "BAY138", "f": "<span class=\"glabel\" style=\"display:block\">We'd do something meaningful together.<\/span><span class=\"dim\">The main thing, it's to amuse yourself, to profit from the experience and <\/span><mark>to do a thing that has sense together.<\/mark>", "b": "<span class=\"dim\">Le principal, c'est de s'amuser, de profiter de l'expérience et <\/span><mark>de faire un truc qui a du sens ensemble.<\/mark>"}, {"id": "B:BP0815", "bid": "BAY139", "f": "<span class=\"glabel\" style=\"display:block\">Together we'd have enough for it.<\/span><mark>If we put all our stuff together, we would largely have enough to make a correct stand<\/mark><span class=\"dim\">, and I think that it could be really good.<\/span>", "b": "<mark>Si on mettait toutes nos affaires ensemble, on aurait largement de quoi faire un stand correct<\/mark><span class=\"dim\">, et je pense que ça pourrait être vraiment bien.<\/span>"}, {"id": "B:BP0546", "bid": "BAY140", "f": "<span class=\"glabel\" style=\"display:block\">It's fun to go out with lots of people.<\/span>Sometimes, it's nice to go out and to do a thing with lots of people.", "b": "Des fois, c'est sympa de sortir et de faire un truc avec plein de gens."}, {"id": "B:BP1074", "bid": "BAY141", "f": "<span class=\"glabel\" style=\"display:block\">The more people, the merrier.<\/span><span class=\"dim\">And then <\/span><mark>the more fools we are, the more we laugh — the more numerous we are, the more we can rent a big van.<\/mark>", "b": "<span class=\"dim\">Et puis <\/span><mark>plus on est de fous, plus on rit — plus on est nombreux, plus on peut louer un gros van.<\/mark>"}, {"id": "B:BP1113", "bid": "BAY142", "f": "<span class=\"glabel\" style=\"display:block\">Once a few of us confirm, others will join.<\/span><span class=\"dim\">On the other hand, <\/span><mark>if we already have three people who are sure to come, and that we announce it on the group with a message of the style « us, we're going, even if nobody else comes », that's going to create FOMO, and there, people are going to start searching how to fit that into their schedule.<\/mark>", "b": "<span class=\"dim\">Par contre, <\/span><mark>si on a déjà trois personnes qui sont sûres de venir, et qu'on l'annonce sur le groupe avec un message du style « nous, on y va, même si personne d'autre vient », ça va créer du FOMO, et là, les gens vont se mettre à chercher comment caser ça dans leur emploi du temps.<\/mark>"}, {"id": "B:BP0793", "bid": "BAY143", "f": "<span class=\"glabel\" style=\"display:block\">We'd chat with neighbors and friends.<\/span><mark>We would chat with the neighbours, the friends<\/mark><span class=\"dim\">, and the ambiance looks rather relaxed.<\/span>", "b": "<mark>On discuterait avec les voisins, les amis<\/mark><span class=\"dim\">, et l'ambiance a l'air plutôt détendue.<\/span>"}, {"id": "B:BP0917", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>On top of that, I tell myself that it would be a super way to meet people.", "b": "En plus de ça, je me dis que ce serait un super moyen de rencontrer du monde."}, {"id": "B:BP0156", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span><span class=\"dim\">You would follow the course, you would learn things, and <\/span><mark>you would surely meet new people, on top.<\/mark>", "b": "<span class=\"dim\">Tu suivrais le cours, t'apprendrais des choses, et <\/span><mark>tu rencontrerais sûrement des nouvelles personnes, en plus.<\/mark>"}, {"id": "B:BP0747", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>On top of that, you could very well meet people.", "b": "En plus de ça, tu pourrais très bien rencontrer du monde."}, {"id": "B:BP0411", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span><span class=\"dim\">You would learn maybe more about how it works, this milieu, <\/span><mark>you would make interesting encounters<\/mark><span class=\"dim\">, and maybe even that you would hear talk of other events or other opportunities thanks to them.<\/span>", "b": "<span class=\"dim\">T'en apprendrais peut-être plus sur comment ça marche, ce milieu, <\/span><mark>tu ferais des rencontres intéressantes<\/mark><span class=\"dim\">, et peut-être même que t'entendrais parler d'autres événements ou d'autres opportunités grâce à eux.<\/span>"}, {"id": "B:BP0318", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span>But precisely, it's a bit for that that I tell myself that it could be a super occasion to meet people and to make yourself friends.", "b": "Mais justement, c'est un peu pour ça que je me dis que ça pourrait être une super occasion de rencontrer des gens et de te faire des amis."}, {"id": "B:BP0749", "bid": "BAY144", "f": "<span class=\"glabel\" style=\"display:block\">You'd meet new people and make friends.<\/span><span class=\"dim\">So then, <\/span><mark>if you're looking to meet people or to make yourself new mates, you'd probably have a nice occasion over there.<\/mark>", "b": "<span class=\"dim\">Du coup, <\/span><mark>si tu cherches à rencontrer des gens ou à te faire de nouveaux potes, t'aurais probablement une belle occasion là-bas.<\/mark>"}, {"id": "B:BP0547", "bid": "BAY145", "f": "<span class=\"glabel\" style=\"display:block\">With so many people, you'd have more chances to make friends.<\/span>And then precisely, with all these people, you would have more chances to make new encounters, and maybe even to make yourself some friends. Me, I find that that could be a real good occasion for that.", "b": "Et puis justement, avec tout ce monde, t'aurais plus de chances de faire de nouvelles rencontres, et peut-être même de te faire des amis. Moi, je trouve que ça pourrait être une vraie bonne occasion pour ça."}, {"id": "B:BP0919", "bid": "BAY146", "f": "<span class=\"glabel\" style=\"display:block\">You never know who you might meet.<\/span>You never know who you could fall on during a trip like that.", "b": "Tu sais jamais sur qui tu pourrais tomber pendant un voyage comme ça."}, {"id": "B:BP0644", "bid": "BAY146", "f": "<span class=\"glabel\" style=\"display:block\">You never know who you might meet.<\/span>And then you don't know either who you're going to meet at this contest.", "b": "Et puis tu sais pas non plus qui tu vas rencontrer à ce concours."}, {"id": "B:BP0646", "bid": "BAY146", "f": "<span class=\"glabel\" style=\"display:block\">You never know who you might meet.<\/span>One never knows.", "b": "On sait jamais."}, {"id": "B:BP0320", "bid": "BAY147", "f": "<span class=\"glabel\" style=\"display:block\">Several days with the same people builds stronger connections.<\/span>But if it happens over several days and you do activities with the same new people, you would have more chances to really learn to know them and to create more solid bonds.", "b": "Mais si ça se passe sur plusieurs jours et que tu fais des activités avec les mêmes nouvelles personnes, t'aurais plus de chances de vraiment apprendre à les connaître et de créer des liens plus solides."}, {"id": "B:BP0918", "bid": "BAY148", "f": "<span class=\"glabel\" style=\"display:block\">A shared goal naturally brings people together.<\/span>Everyone would be there for the same reason, working for the same objective, so then it's the kind of experience that naturally brings people closer.", "b": "Tout le monde serait là pour la même raison, à bosser pour le même objectif, du coup c'est le genre d'expérience qui rapproche naturellement les gens."}, {"id": "B:BP0748", "bid": "BAY149", "f": "<span class=\"glabel\" style=\"display:block\">Without phones, people would naturally talk to each other.<\/span>Over there, nobody would have their phone, so everybody would be obliged to find themselves other things to do, and forcibly, that would push people to talk to each other.", "b": "Là-bas, personne aurait son téléphone, donc tout le monde serait obligé de se trouver d'autres trucs à faire, et forcément, ça pousserait les gens à se parler entre eux."}, {"id": "B:BP0323", "bid": "BAY150", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to like or befriend everyone.<\/span>You're not obliged to appreciate all the people that you meet, and you're really not obliged to become friends with everybody.", "b": "T'es pas obligé d'apprécier tous les gens que tu rencontres, et t'es vraiment pas obligé de devenir ami avec tout le monde."}, {"id": "B:BP0324", "bid": "BAY151", "f": "<span class=\"glabel\" style=\"display:block\">You only need to click with one person.<\/span><mark>It suffices that you hook up with one single person<\/mark><span class=\"dim\">, and thanks to her, you could finish by meeting even more people.<\/span>", "b": "<mark>Il suffit que t'accroches avec une seule personne<\/mark><span class=\"dim\">, et grâce à elle, tu pourrais finir par rencontrer encore plus de monde.<\/span>"}, {"id": "B:BP0325", "bid": "BAY152", "f": "<span class=\"glabel\" style=\"display:block\">Through one person, you could meet even more people.<\/span><span class=\"dim\">It suffices that you hook up with one single person, and <\/span><mark>thanks to her, you could finish by meeting even more people.<\/mark>", "b": "<span class=\"dim\">Il suffit que t'accroches avec une seule personne, et <\/span><mark>grâce à elle, tu pourrais finir par rencontrer encore plus de monde.<\/mark>"}, {"id": "B:BP0327", "bid": "BAY153", "f": "<span class=\"glabel\" style=\"display:block\">It opens a door for you.<\/span>It's a way to open yourself a door.", "b": "C'est une façon de t'ouvrir une porte."}, {"id": "B:BP0409", "bid": "BAY154", "f": "<span class=\"glabel\" style=\"display:block\">You could meet people who work in that field.<\/span><span class=\"dim\">It would be a new experience, and <\/span><mark>you could meet actors and other people who work in the cinema.<\/mark>", "b": "<span class=\"dim\">Ce serait une nouvelle expérience, et <\/span><mark>tu pourrais rencontrer des acteurs et d'autres gens qui bossent dans le cinéma.<\/mark>"}, {"id": "B:BP0645", "bid": "BAY155", "f": "<span class=\"glabel\" style=\"display:block\">You might meet people who help you find jobs.<\/span>Maybe you'll fall on people who will be able to help you to find other jobs or put you in contact with other people.", "b": "Peut-être que tu tomberas sur des gens qui pourront t'aider à trouver d'autres jobs ou te mettre en contact avec d'autres gens."}, {"id": "B:BP0881", "bid": "BAY156", "f": "<span class=\"glabel\" style=\"display:block\">Trips like this bring friends closer.<\/span>This kind of trips, that has always brought me closer to my mates.", "b": "Ce genre de voyages, ça m'a toujours rapproché de mes potes."}, {"id": "B:BP1079", "bid": "BAY156", "f": "<span class=\"glabel\" style=\"display:block\">Trips like this bring friends closer.<\/span><span class=\"dim\">Besides, <\/span><mark>after all these trips, I ended up loving them way more, those people there.<\/mark>", "b": "<span class=\"dim\">D'ailleurs, <\/span><mark>après tous ces voyages, j'ai fini par les aimer vachement plus, ces gens-là.<\/mark>"}, {"id": "B:BP1076", "bid": "BAY157", "f": "<span class=\"glabel\" style=\"display:block\">I've traveled with friends a lot and never ended up hating them.<\/span>Me, I went lots of times on trips with mates, and not one single time I found myself detesting these people at the end.", "b": "Moi, je suis parti plein de fois en voyage avec des potes, et pas une seule fois je me suis retrouvé à détester ces gens à la fin."}, {"id": "B:BP0880", "bid": "BAY158", "f": "<span class=\"glabel\" style=\"display:block\">Spending that much time together won't be a problem.<\/span>And I find that you're a bit pessimistic on the fact that we spend so much time together.", "b": "Et je trouve que t'es un peu pessimiste sur le fait qu'on passe autant de temps ensemble."}, {"id": "B:BP1078", "bid": "BAY159", "f": "<span class=\"glabel\" style=\"display:block\">Little fights are just banter; in the end it's all love.<\/span><span class=\"dim\">So yes, there are sometimes little tensions here and there, but <\/span><mark>it's only jokes, and at the end of the count, it's only love.<\/mark>", "b": "<span class=\"dim\">Alors oui, y a parfois des petites tensions par-ci par-là, mais <\/span><mark>c'est que des vannes, et au bout du compte, c'est que de l'amour.<\/mark>"}, {"id": "B:BP1125", "bid": "BAY160", "f": "<span class=\"glabel\" style=\"display:block\">They're real friends who won't mind if you need space.<\/span>The people with whom we would leave, it's our real mates, eh — that won't bother them if you need to have your space.", "b": "Les gens avec qui on partirait, c'est nos vrais potes, hein — ça les dérangera pas si t'as besoin d'avoir ton espace."}]}, {"key": "B-BA7", "sec": "B", "code": "BA7", "name": "Doing good", "bucket": "Arguments", "items": [{"id": "B:BP0328", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>And on top, it would not be just a thing to do to amuse yourself or an occasion to meet people — you would do it also for the good cause, to help the school and the children.", "b": "Et en plus, ce serait pas juste un truc à faire pour t'amuser ou une occasion de rencontrer du monde — tu le ferais aussi pour la bonne cause, pour aider l'école et les enfants."}, {"id": "B:BP0206", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>In any case, they specify clearly that it's for an eco association.", "b": "En tout cas, ils précisent bien que c'est pour une asso écolo."}, {"id": "B:BP0554", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span><span class=\"dim\">One would say rather a small local festival, and <\/span><mark>apparently it's also for a good cause, above all with the environment side.<\/mark>", "b": "<span class=\"dim\">On dirait plutôt un petit festival local, et <\/span><mark>apparemment c'est aussi pour une bonne cause, surtout avec le côté environnement.<\/mark>"}, {"id": "B:BP0203", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>On the ad, they say that all the profits go to an association for the environment.", "b": "Sur l'annonce, ils disent que tous les bénéfices vont à une asso pour l'environnement."}, {"id": "B:BP0070", "bid": "BAY161", "f": "<span class=\"glabel\" style=\"display:block\">It's for a good cause.<\/span>And all the profits of the show, they go to a foundation that's called Danse du cœur, that helps the people who have cardiac illnesses.", "b": "Et tous les bénéfices du spectacle, ils vont à une fondation qui s'appelle Danse du cœur, qui aide les gens qui ont des maladies cardiaques."}, {"id": "B:BP0069", "bid": "BAY162", "f": "<span class=\"glabel\" style=\"display:block\">You'd do what you love and support a good cause.<\/span>But precisely, the thing, it's that you have the occasion to dance in front of a public all while supporting a good cause.", "b": "Mais justement, le truc, c'est que t'as l'occasion de danser devant un public tout en soutenant une bonne cause."}, {"id": "B:BP0197", "bid": "BAY163", "f": "<span class=\"glabel\" style=\"display:block\">It's not about winning a prize; it's about raising money for charity.<\/span><span class=\"dim\">And then in any case, <\/span><mark>the goal of the thing, it's not to earn money nor to leave with I don't know what prize. It's to collect funds for a good cause.<\/mark>", "b": "<span class=\"dim\">Et puis de toute façon, <\/span><mark>le but du truc, c'est pas de gagner de l'argent ni de repartir avec je sais pas quel prix. C'est de récolter des fonds pour une bonne cause.<\/mark>"}, {"id": "B:BP0071", "bid": "BAY164", "f": "<span class=\"glabel\" style=\"display:block\">It's important to give back.<\/span>And then you know, me I find that it's important, from time to time, to do this kind of things and to invest yourself a bit for the others.", "b": "Et puis tu sais, moi je trouve que c'est important, de temps en temps, de faire ce genre de trucs et de s'investir un peu pour les autres."}, {"id": "B:BP1139", "bid": "BAY165", "f": "<span class=\"glabel\" style=\"display:block\">It's not hollow, because you really believe in it.<\/span>All the same, I don't find that hollow, seeing that you, you really believe in it — you fight for that in which you believe.", "b": "N'empêche, je trouve pas ça creux, vu que toi, t'y crois vraiment — tu te bats pour ce en quoi tu crois."}, {"id": "B:BP1140", "bid": "BAY166", "f": "<span class=\"glabel\" style=\"display:block\">The point is to make change.<\/span>What is it, the interest of becoming a politician? It's to change things, no?", "b": "C'est quoi l'intérêt de devenir politicien ? C'est pour changer les choses, non ?"}, {"id": "B:BP1147", "bid": "BAY167", "f": "<span class=\"glabel\" style=\"display:block\">Nothing beats making a real impact.<\/span>Honestly, what better experience than to join an association or a movement that exists already, to change its way of functioning, to bring it onto this new path, and in passing, to create change and to have an impact on society?", "b": "Honnêtement, quelle meilleure expérience que de rejoindre une asso ou un mouvement qui existe déjà, de changer sa façon de fonctionner, de l'amener sur cette nouvelle voie, et au passage, de créer du changement et d'avoir un impact sur la société ?"}, {"id": "B:BP1043", "bid": "BAY168", "f": "<span class=\"glabel\" style=\"display:block\">They really need help.<\/span><mark>It's seniors, they have need of help, agreed<\/mark><span class=\"dim\"> — but at the same time, they have dozens of years of experience behind them, and one never knows what one can learn just by rubbing shoulders with those people there, by discussing with them.<\/span>", "b": "<mark>C'est des seniors, ils ont besoin d'aide, d'accord<\/mark><span class=\"dim\"> — mais en même temps, ils ont des dizaines d'années d'expérience derrière eux, et on sait jamais ce qu'on peut apprendre juste en côtoyant ces gens-là, en discutant avec eux.<\/span>"}, {"id": "B:BP0378", "bid": "BAY168", "f": "<span class=\"glabel\" style=\"display:block\">They really need help.<\/span>Maybe that this refuge there, it still really needs volunteers. Maybe that they're only three helping, in fact.", "b": "Peut-être que ce refuge-là, il a encore vraiment besoin de bénévoles. Peut-être qu'ils sont que trois à aider, en fait."}, {"id": "B:BP0377", "bid": "BAY169", "f": "<span class=\"glabel\" style=\"display:block\">We don't know how many volunteers they have.<\/span><span class=\"dim\">So yes, there are already 2 000 volunteers in total, but <\/span><mark>we don't know at all how many people have signed up in the refuge next to your place.<\/mark>", "b": "<span class=\"dim\">Alors oui, y a déjà 2 000 bénévoles en tout, mais <\/span><mark>on sait pas du tout combien de gens se sont inscrits dans le refuge à côté de chez toi.<\/mark>"}, {"id": "B:BP1056", "bid": "BAY170", "f": "<span class=\"glabel\" style=\"display:block\">These are vulnerable people who need help.<\/span><span class=\"dim\">So <\/span><mark>the one who risks something here, it's not you — it's someone else: these people, who are maybe vulnerable.<\/mark>", "b": "<span class=\"dim\">Donc <\/span><mark>celui qui risque quelque chose ici, c'est pas toi — c'est quelqu'un d'autre : ces gens, qui sont peut-être vulnérables.<\/mark>"}, {"id": "B:BP0907", "bid": "BAY171", "f": "<span class=\"glabel\" style=\"display:block\">You'd actually be helping.<\/span><mark>You would really help to restore them<\/mark><span class=\"dim\">, and after you could say: « I was part of the team that helped to restore this place ».<\/span>", "b": "<mark>Tu aiderais vraiment à les restaurer<\/mark><span class=\"dim\">, et après tu pourrais dire : « J'ai fait partie de l'équipe qui a aidé à restaurer cet endroit ».<\/span>"}, {"id": "B:BP0389", "bid": "BAY172", "f": "<span class=\"glabel\" style=\"display:block\">You'd still help, just indirectly.<\/span>You would continue to help the animals, just indirectly, like.", "b": "Tu continuerais à aider les animaux, juste indirectement, quoi."}, {"id": "B:BP0908", "bid": "BAY173", "f": "<span class=\"glabel\" style=\"display:block\">You could proudly say you were part of it.<\/span><span class=\"dim\">You would really help to restore them, and <\/span><mark>after you could say: « I was part of the team that helped to restore this place ».<\/mark>", "b": "<span class=\"dim\">Tu aiderais vraiment à les restaurer, et <\/span><mark>après tu pourrais dire : « J'ai fait partie de l'équipe qui a aidé à restaurer cet endroit ».<\/mark>"}, {"id": "B:BP1041", "bid": "BAY174", "f": "<span class=\"glabel\" style=\"display:block\">I've always wondered how fulfilling it feels to help.<\/span><span class=\"dim\">It's a thing that most of the time one does for the others and not for oneself — and precisely, <\/span><mark>I have always asked myself to what point that could be fulfilling.<\/mark>", "b": "<span class=\"dim\">C'est un truc que la plupart du temps on fait pour les autres et pas pour soi — et justement, <\/span><mark>je me suis toujours demandé à quel point ça pouvait être épanouissant.<\/mark>"}, {"id": "B:BP0373", "bid": "BAY175", "f": "<span class=\"glabel\" style=\"display:block\">It teaches you to do something for others.<\/span>Sometimes, you have to do things that are not super agreeable, and precisely, that teaches you to think beyond yourself, to do a thing for somebody else. There, in this occurrence, for the animals.", "b": "Des fois, faut faire des choses qui sont pas super agréables, et justement, ça t'apprend à penser au-delà de toi-même, à faire un truc pour quelqu'un d'autre. Là, en l'occurrence, pour les animaux."}, {"id": "B:BP0334", "bid": "BAY176", "f": "<span class=\"glabel\" style=\"display:block\">It's a chance to try something eco-friendly.<\/span>And then it would be the occasion to try a way of travelling more eco, which I've never really done either.", "b": "Et puis ce serait l'occasion d'essayer une façon de voyager plus écolo, ce que j'ai jamais vraiment fait non plus."}, {"id": "B:BP0529", "bid": "BAY176", "f": "<span class=\"glabel\" style=\"display:block\">It's a chance to try something eco-friendly.<\/span>Without counting that it's also the occasion to test for real one of those alternative foods that are supposed to consume much less water and resources than meat.", "b": "Sans compter que c'est aussi l'occasion de tester pour de vrai un de ces aliments alternatifs qui sont censés consommer beaucoup moins d'eau et de ressources que la viande."}, {"id": "B:BP0530", "bid": "BAY177", "f": "<span class=\"glabel\" style=\"display:block\">We care about this cause; it's a concrete way to act on it.<\/span>You know at what point the ecology and the planet, that holds us at heart both of us. So then, it would be a concrete means to test a thing in relation with that, instead of just talking about it.", "b": "Tu sais à quel point l'écologie et la planète, ça nous tient à cœur tous les deux. Du coup, ce serait un moyen concret de tester un truc en rapport avec ça, au lieu de juste en parler."}, {"id": "B:BP0353", "bid": "BAY178", "f": "<span class=\"glabel\" style=\"display:block\">It's greener than the usual option.<\/span><span class=\"dim\">Yeah, I know that it's not the most eco way to travel, but <\/span><mark>all the same, it's clearly more eco than to do everything by car or by bus.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais que c'est pas la façon la plus écolo de voyager, mais <\/span><mark>n'empêche, c'est clairement plus écolo que de tout faire en voiture ou en bus.<\/mark>"}, {"id": "B:BP0532", "bid": "BAY178", "f": "<span class=\"glabel\" style=\"display:block\">It's greener than the usual option.<\/span>Ecologically, insects, that would cost a lot less dear in resources.", "b": "Écologiquement, les insectes, ça coûterait beaucoup moins cher en ressources."}, {"id": "B:BP0802", "bid": "BAY179", "f": "<span class=\"glabel\" style=\"display:block\">It's good for the planet.<\/span><span class=\"dim\">This kind of garage sales, in general, it works super well, because everything is less expensive, and <\/span><mark>on top it's good for the planet.<\/mark>", "b": "<span class=\"dim\">Ce genre de vide-greniers, en général, ça marche super bien, parce que tout est moins cher, et <\/span><mark>en plus c'est bon pour la planète.<\/mark>"}, {"id": "B:BP0355", "bid": "BAY180", "f": "<span class=\"glabel\" style=\"display:block\">It's a pretty good compromise.<\/span>In the end, I find that it's a pretty good compromise.", "b": "Au final, je trouve que c'est un assez bon compromis."}, {"id": "B:BP0659", "bid": "BAY181", "f": "<span class=\"glabel\" style=\"display:block\">The environmental impact is small.<\/span>And environment level, frankly, I don't think that it's such a big problem as that.", "b": "Et niveau environnement, franchement, je pense pas que ce soit un si gros problème que ça."}, {"id": "B:BP0657", "bid": "BAY181", "f": "<span class=\"glabel\" style=\"display:block\">The environmental impact is small.<\/span>That wouldn't make so much plastic as that.", "b": "Ça ferait pas tant de plastique que ça."}, {"id": "B:BP0660", "bid": "BAY181", "f": "<span class=\"glabel\" style=\"display:block\">The environmental impact is small.<\/span>It's not by using a bit more plastic that you're going to ruin the planet.", "b": "C'est pas en utilisant un peu plus de plastique que tu vas ruiner la planète."}, {"id": "B:BP0662", "bid": "BAY182", "f": "<span class=\"glabel\" style=\"display:block\">Maybe their version is eco-friendly.<\/span>And then who knows, maybe the plastic that they use, it's ecological.", "b": "Et puis qui sait, peut-être que le plastique qu'ils utilisent, il est écolo."}, {"id": "B:BP0661", "bid": "BAY183", "f": "<span class=\"glabel\" style=\"display:block\">You could make up for it in other ways.<\/span>On top, you could do other things to reduce your carbon footprint, just to compensate.", "b": "En plus, tu pourrais faire d'autres trucs pour réduire ton empreinte carbone, histoire de compenser."}, {"id": "B:BP0663", "bid": "BAY184", "f": "<span class=\"glabel\" style=\"display:block\">It could even reduce waste.<\/span>Besides, that could even help to limit food waste.", "b": "D'ailleurs, ça pourrait même aider à limiter le gaspillage alimentaire."}, {"id": "B:BP0664", "bid": "BAY184", "f": "<span class=\"glabel\" style=\"display:block\">It could even reduce waste.<\/span>If you weigh the for and the against, this kind of packaging, it helps the food to conserve itself longer, so then we throw less of it away.", "b": "Si tu pèses le pour et le contre, ce genre d'emballage, ça aide la nourriture à se conserver plus longtemps, du coup on en jette moins."}, {"id": "B:BP0665", "bid": "BAY185", "f": "<span class=\"glabel\" style=\"display:block\">Overall, it could be a net positive.<\/span>So in the end, I find that the balance could all the same be positive.", "b": "Donc au final, je trouve que le bilan pourrait quand même être positif."}, {"id": "B:BP0697", "bid": "BAY186", "f": "<span class=\"glabel\" style=\"display:block\">The animals are well looked after.<\/span><span class=\"dim\">Well, obviously, it's not me who organises, so I can't tell you exactly what the conditions are, but <\/span><mark>they have the air of being well treated and in good health.<\/mark>", "b": "<span class=\"dim\">Bon, évidemment, c'est pas moi qui organise, donc je peux pas te dire exactement quelles sont les conditions, mais <\/span><mark>ils ont l'air bien traités et en bonne santé.<\/mark>"}, {"id": "B:BP0694", "bid": "BAY186", "f": "<span class=\"glabel\" style=\"display:block\">The animals are well looked after.<\/span><span class=\"dim\">I know that you maybe also ask yourself questions about the wolves themselves, but <\/span><mark>from what I understood, they live in big spaces in the open air where they have largely the room to run.<\/mark>", "b": "<span class=\"dim\">Je sais que tu te poses peut-être aussi des questions sur les loups eux-mêmes, mais <\/span><mark>d'après ce que j'ai compris, ils vivent dans de grands espaces en plein air où ils ont largement la place de courir.<\/mark>"}, {"id": "B:BP0695", "bid": "BAY186", "f": "<span class=\"glabel\" style=\"display:block\">The animals are well looked after.<\/span>That has the air of being much better than having them stuck in a zoo.", "b": "Ça a l'air bien mieux que de les avoir coincés dans un zoo."}]}, {"key": "B-BA8", "sec": "B", "code": "BA8", "name": "Money & value", "bucket": "Arguments", "items": [{"id": "B:BP0027", "bid": "BAY187", "f": "<span class=\"glabel\" style=\"display:block\">We should spend our money before we die.<\/span><span class=\"dim\">And yeah, I know that it costs money, but <\/span><mark>you know my philosophy: we should die with zero dollars on our bank accounts.<\/mark>", "b": "<span class=\"dim\">Et ouais, je sais que ça coûte de l'argent, mais <\/span><mark>tu connais ma philosophie : on devrait mourir avec zéro dollar sur nos comptes en banque.<\/mark>"}, {"id": "B:BP1103", "bid": "BAY188", "f": "<span class=\"glabel\" style=\"display:block\">We both work, so what are we saving for?<\/span>You and me, we work both of us — frankly, we're going to save for what?", "b": "Toi et moi, on bosse tous les deux — franchement, on va économiser pour quoi ?"}, {"id": "B:BP0867", "bid": "BAY189", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to spend money on things like this.<\/span>Well, sometimes, one really has to put a bit of money in this kind of stuff.", "b": "Enfin, des fois, il faut bien mettre un peu d'argent dans ce genre de trucs."}, {"id": "B:BP0028", "bid": "BAY189", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to spend money on things like this.<\/span>Sometimes, one must really spend one's money and profit from it.", "b": "Des fois, faut vraiment dépenser son argent et en profiter."}, {"id": "B:BP0055", "bid": "BAY189", "f": "<span class=\"glabel\" style=\"display:block\">Sometimes you have to spend money on things like this.<\/span>Sometimes, there's no harm in putting money in a special thing.", "b": "Des fois, y a pas de mal à mettre de l'argent dans un truc spécial."}, {"id": "B:BP0783", "bid": "BAY190", "f": "<span class=\"glabel\" style=\"display:block\">This kind of thing is worth spending money on.<\/span>Frankly, I find that this kind of experiences, it's one of the best things that we can pay ourselves, compared to things like deliveries or any little entertainment that you barely remember after.", "b": "Franchement, je trouve que ce genre d'expériences, c'est un des meilleurs trucs qu'on puisse se payer, comparé à des trucs comme les livraisons ou n'importe quel petit divertissement dont tu te souviens à peine après."}, {"id": "B:BP0254", "bid": "BAY190", "f": "<span class=\"glabel\" style=\"display:block\">This kind of thing is worth spending money on.<\/span><span class=\"dim\">Me, <\/span><mark>I really find that health, it's the kind of thing where it's worth the blow to put money in.<\/mark>", "b": "<span class=\"dim\">Moi, <\/span><mark>je trouve vraiment que la santé, c'est le genre de truc où ça vaut le coup de mettre de l'argent.<\/mark>"}, {"id": "B:BP0418", "bid": "BAY191", "f": "<span class=\"glabel\" style=\"display:block\">You already spend money on this kind of thing anyway.<\/span><span class=\"dim\">But you have all the same some free cinema seats, and <\/span><mark>at base, the cinema, you already put money in it.<\/mark>", "b": "<span class=\"dim\">Mais t'as quand même des places de ciné gratuites, et <\/span><mark>de base, le ciné, t'y mets déjà de l'argent.<\/mark>"}, {"id": "B:BP0420", "bid": "BAY192", "f": "<span class=\"glabel\" style=\"display:block\">It's a better way to spend money you'd spend anyway.<\/span>Me, I just tell myself that it would be maybe a better manner of spending that money.", "b": "Moi, je me dis juste que ce serait peut-être une meilleure manière de dépenser cet argent."}, {"id": "B:BP0702", "bid": "BAY192", "f": "<span class=\"glabel\" style=\"display:block\">It's a better way to spend money you'd spend anyway.<\/span>And if it's to spend that money on a trip anyway, a thing in this style, that could be squarely more worth the blow than one of the usual options.", "b": "Et quitte à dépenser cet argent pour un voyage de toute façon, un truc dans ce style, ça pourrait valoir carrément plus le coup qu'une des options habituelles."}, {"id": "B:BP0781", "bid": "BAY193", "f": "<span class=\"glabel\" style=\"display:block\">Look at your budget and what you spend now.<\/span>And for the money question, you could always look at your budget, and see where your money already goes at the moment.", "b": "Et pour la question argent, tu pourrais toujours regarder ton budget, et voir où part déjà ton argent en ce moment."}, {"id": "B:BP0048", "bid": "BAY194", "f": "<span class=\"glabel\" style=\"display:block\">Spend less on other things and put that money toward this.<\/span><mark>We can make some economies on other things and put a bit more in an experience like that<\/mark><span class=\"dim\">, a thing that we've never done.<\/span>", "b": "<mark>On peut faire des économies sur d'autres trucs et mettre un peu plus dans une expérience comme ça<\/mark><span class=\"dim\">, un truc qu'on a jamais fait.<\/span>"}, {"id": "B:BP0419", "bid": "BAY194", "f": "<span class=\"glabel\" style=\"display:block\">Spend less on other things and put that money toward this.<\/span>So then, you could economise on the seats that you buy usually, and put that money in there instead.", "b": "Du coup, tu pourrais économiser sur les places que t'achètes d'habitude, et mettre cet argent là-dedans à la place."}, {"id": "B:BP0782", "bid": "BAY194", "f": "<span class=\"glabel\" style=\"display:block\">Spend less on other things and put that money toward this.<\/span>There are maybe little expenses in there that you could replace with this.", "b": "Y a peut-être des petites dépenses là-dedans que tu pourrais remplacer par ça."}, {"id": "B:BP1109", "bid": "BAY195", "f": "<span class=\"glabel\" style=\"display:block\">We don't have to do it often.<\/span><span class=\"dim\">That must turn around 200 euros the weekend, and then <\/span><mark>we're not obliged to do one every week.<\/mark>", "b": "<span class=\"dim\">Ça doit tourner autour de 200 euros le week-end, et puis <\/span><mark>on est pas obligés d'en faire un toutes les semaines.<\/mark>"}, {"id": "B:BP0107", "bid": "BAY196", "f": "<span class=\"glabel\" style=\"display:block\">Maybe your landlord would let your rent slide.<\/span>One never knows. Your current landlord, he would maybe even go as far as to tell you: « Yeah, for this month, I can make you skip the rent. »", "b": "On sait jamais. Ton proprio actuel, il irait peut-être même jusqu'à te dire : « Ouais, pour ce mois-ci, je peux te faire sauter le loyer. »"}, {"id": "B:BP0863", "bid": "BAY197", "f": "<span class=\"glabel\" style=\"display:block\">It's worth it; we wouldn't regret it.<\/span><span class=\"dim\">Yeah, I know that it would surely not be the least expensive trip that we could do, but <\/span><mark>I think that it could be worth the blow.<\/mark>", "b": "<span class=\"dim\">Ouais, je sais que ce serait sûrement pas le voyage le moins cher qu'on pourrait faire, mais <\/span><mark>je pense que ça pourrait valoir le coup.<\/mark>"}, {"id": "B:BP0245", "bid": "BAY197", "f": "<span class=\"glabel\" style=\"display:block\">It's worth it; we wouldn't regret it.<\/span>When one thinks about it, it's squarely worth the blow.", "b": "Quand on y pense, ça vaut carrément le coup."}, {"id": "B:BP0870", "bid": "BAY197", "f": "<span class=\"glabel\" style=\"display:block\">It's worth it; we wouldn't regret it.<\/span><span class=\"dim\">We would come back with plenty of super memories of the trip, and <\/span><mark>I think that we would tell ourselves that it was really worth the pain.<\/mark>", "b": "<span class=\"dim\">On reviendrait avec plein de super souvenirs du voyage, et <\/span><mark>je pense qu'on se dirait que ça en valait vraiment la peine.<\/mark>"}, {"id": "B:BP0868", "bid": "BAY197", "f": "<span class=\"glabel\" style=\"display:block\">It's worth it; we wouldn't regret it.<\/span>And frankly, I don't think that we would regret it after.", "b": "Et franchement, je pense pas qu'on le regretterait après."}, {"id": "B:BP0415", "bid": "BAY197", "f": "<span class=\"glabel\" style=\"display:block\">It's worth it; we wouldn't regret it.<\/span>Frankly, I think that it could be worth the blow.", "b": "Franchement, je pense que ça pourrait valoir le coup."}, {"id": "B:BP0629", "bid": "BAY198", "f": "<span class=\"glabel\" style=\"display:block\">This one could be worth the effort.<\/span><mark>And I think that this one, it could really be worth the pain<\/mark><span class=\"dim\">, because if you had the job, your travel would be taken in charge and you would have a free transport card for your trips.<\/span>", "b": "<mark>Et je pense que celui-là, ça pourrait vraiment en valoir la peine<\/mark><span class=\"dim\">, parce que si t'avais le job, tes déplacements seraient pris en charge et t'aurais une carte de transport gratuite pour tes trajets.<\/span>"}, {"id": "B:BP0774", "bid": "BAY199", "f": "<span class=\"glabel\" style=\"display:block\">Even if it's a bit expensive, it's worth it.<\/span><mark>And even if it's a bit expensive, I think all the same that it could be worth the blow<\/mark><span class=\"dim\">, because it's the kind of thing that you'll maybe do only one single time in your life.<\/span>", "b": "<mark>Et même si c'est un peu cher, je pense quand même que ça pourrait valoir le coup<\/mark><span class=\"dim\">, parce que c'est le genre de truc que tu feras peut-être qu'une seule fois dans ta vie.<\/span>"}, {"id": "B:BP0146", "bid": "BAY200", "f": "<span class=\"glabel\" style=\"display:block\">Price shouldn't be the main reason to say no.<\/span><span class=\"dim\">I don't know exactly how much it costs, the course, seeing as it wasn't marked in the ad, but <\/span><mark>I don't think that the price should be the principal reason to not do it.<\/mark>", "b": "<span class=\"dim\">Je sais pas exactement combien il coûte, le cours, vu que c'était pas marqué dans la pub, mais <\/span><mark>je pense pas que le prix doive être la raison principale de pas le faire.<\/mark>"}, {"id": "B:BP0043", "bid": "BAY201", "f": "<span class=\"glabel\" style=\"display:block\">If the price isn't too high, it's worth considering.<\/span>So then, if the price is not too high, I find that it merits at least that we reflect on it.", "b": "Du coup, si le prix est pas trop élevé, je trouve que ça mérite au moins qu'on y réfléchisse."}, {"id": "B:BP1197", "bid": "BAY202", "f": "<span class=\"glabel\" style=\"display:block\">You get a lot of value in one package.<\/span>Frankly, for a single package, you get your money's worth.", "b": "Franchement, pour un seul forfait, t'en as pour ton argent."}, {"id": "B:BP0523", "bid": "BAY203", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't be too expensive.<\/span>And price-level, it's not as if we were going to pay a delirious sum.", "b": "Et niveau prix, c'est pas comme si on allait payer une somme délirante."}, {"id": "B:BP0557", "bid": "BAY203", "f": "<span class=\"glabel\" style=\"display:block\">It wouldn't be too expensive.<\/span>So I don't think that the tickets are necessarily out of price.", "b": "Donc je pense pas que les billets soient forcément hors de prix."}, {"id": "B:BP0524", "bid": "BAY204", "f": "<span class=\"glabel\" style=\"display:block\">It's a normal price, about 15 euros a plate.<\/span>It's a normal dish, what, in the 15 euros the plate roughly.", "b": "C'est un plat normal, quoi, dans les 15 euros l'assiette à peu près."}, {"id": "B:BP0558", "bid": "BAY205", "f": "<span class=\"glabel\" style=\"display:block\">They want lots of people to come, so they'd keep it affordable.<\/span>They surely want that a maximum of people come discover the cause.", "b": "Ils ont sûrement envie qu'un maximum de gens viennent découvrir la cause."}, {"id": "B:BP0556", "bid": "BAY205", "f": "<span class=\"glabel\" style=\"display:block\">They want lots of people to come, so they'd keep it affordable.<\/span><span class=\"dim\">And yeah, I know that you're afraid that it's really expensive, but <\/span><mark>seeing as they seek to sensitise people to the environment, I have the impression that they would have every interest in rendering the event accessible to the greatest number.<\/mark>", "b": "<span class=\"dim\">Et ouais, je sais que t'as peur que ce soit vraiment cher, mais <\/span><mark>vu qu'ils cherchent à sensibiliser les gens à l'environnement, j'ai l'impression qu'ils auraient tout intérêt à rendre l'événement accessible au plus grand nombre.<\/mark>"}, {"id": "B:BP0360", "bid": "BAY206", "f": "<span class=\"glabel\" style=\"display:block\">The prices and deals look really good.<\/span>And on top of all that, the prices look rather interesting too.", "b": "Et en plus de tout ça, les prix ont l'air plutôt intéressants aussi."}, {"id": "B:BP0977", "bid": "BAY206", "f": "<span class=\"glabel\" style=\"display:block\">The prices and deals look really good.<\/span><span class=\"dim\">It's a bit like Craigslist or Facebook Marketplace, but <\/span><mark>that one in particular, maybe because it's new, the deals that I saw there, they're incredible, I find.<\/mark>", "b": "<span class=\"dim\">C'est un peu comme Craigslist ou Facebook Marketplace, mais <\/span><mark>celui-là en particulier, peut-être parce que c'est nouveau, les affaires que j'y ai vues, elles sont incroyables, je trouve.<\/mark>"}, {"id": "B:BP0978", "bid": "BAY207", "f": "<span class=\"glabel\" style=\"display:block\">For example, I saw a brand-new item for a very low price.<\/span>I saw a microwave on promo at 30 dollars, and apparently it's all new.", "b": "J'ai vu un micro-ondes en promo à 30 dollars, et apparemment il est tout neuf."}, {"id": "B:BP0984", "bid": "BAY208", "f": "<span class=\"glabel\" style=\"display:block\">The site is still new.<\/span>The thing, it's that this site, it's still all new.", "b": "Le truc, c'est que ce site, il est encore tout nouveau."}, {"id": "B:BP0986", "bid": "BAY209", "f": "<span class=\"glabel\" style=\"display:block\">Few people know the site yet, so the deals last.<\/span><span class=\"dim\">On a thing like Facebook Marketplace or Craigslist, that would surely be the case, but <\/span><mark>I don't think that many people know it already, this site, so then in my opinion the good deals don't leave so fast as that.<\/mark>", "b": "<span class=\"dim\">Sur un truc comme Facebook Marketplace ou Craigslist, ce serait sûrement le cas, mais <\/span><mark>je pense pas que beaucoup de gens le connaissent déjà, ce site, du coup à mon avis les bonnes affaires partent pas si vite que ça.<\/mark>"}, {"id": "B:BP0039", "bid": "BAY210", "f": "<span class=\"glabel\" style=\"display:block\">There's a discount, so we wouldn't pay full price.<\/span><span class=\"dim\">And yeah, I know that it's not what there is of least expensive, but <\/span><mark>us, we wouldn't pay full tariff for the service.<\/mark>", "b": "<span class=\"dim\">Et ouais, je sais que c'est pas ce qu'il y a de moins cher, mais <\/span><mark>nous, on paierait pas plein tarif pour le service.<\/mark>"}, {"id": "B:BP0525", "bid": "BA 6", "bid": "BAY228", "f": "<span class=\"glabel\" style=\"display:block\">Doing it on your own would take years of saving.<\/span>If you had to work and put enough money aside to travel everywhere in the world by your own means, that could take years.", "b": "Si tu devais bosser et mettre assez d'argent de côté pour voyager partout dans le monde par tes propres moyens, ça pourrait prendre des années."}, {"id": "B:BP1081", "bid": "BAY229", "f": "<span class=\"glabel\" style=\"display:block\">We pay per van, not per person.<\/span><span class=\"dim\">Me, I really think that it's less dear as an option, seeing that they often do group rates, and then <\/span><mark>we pay per van, no?<\/mark>", "b": "<span class=\"dim\">Moi, je pense vraiment que c'est moins cher comme option, vu qu'ils font souvent des tarifs de groupe, et puis <\/span><mark>on paie par van, non ?<\/mark>"}, {"id": "B:BP1082", "bid": "BAY230", "f": "<span class=\"glabel\" style=\"display:block\">In a hotel, separate rooms cost much more.<\/span>At the hotel, if each one wants their intimacy, it would be necessary that we each take a separate room, and that, that costs a lot more dear.", "b": "À l'hôtel, si chacun veut son intimité, il faudrait qu'on prenne chacun une chambre à part, et ça, ça coûte beaucoup plus cher."}, {"id": "B:BP1083", "bid": "BAY231", "f": "<span class=\"glabel\" style=\"display:block\">The van is also our transport, so no car rental.<\/span>With these vans, we kind of make two blows with one stone, because you have also your means of transport — you don't even have to think about renting a car.", "b": "Avec ces vans, on fait un peu d'une pierre deux coups, parce que t'as aussi ton moyen de transport — t'as même pas à penser à louer une voiture."}, {"id": "B:BP1084", "bid": "BAY232", "f": "<span class=\"glabel\" style=\"display:block\">In a hotel, we only sleep.<\/span><span class=\"dim\">And then <\/span><mark>the hotels, we're not even there when we travel. We go there just to sleep<\/mark><span class=\"dim\">, and we blow 150 dollars the night just to sleep.<\/span>", "b": "<span class=\"dim\">Et puis <\/span><mark>les hôtels, on y est même pas quand on voyage. On y va juste pour dormir<\/mark><span class=\"dim\">, et on claque 150 dollars la nuit juste pour dormir.<\/span>"}, {"id": "B:BP1085", "bid": "BAY233", "f": "<span class=\"glabel\" style=\"display:block\">Paying a lot for a hotel just to sleep isn't fun.<\/span><span class=\"dim\">We go there just to sleep, and <\/span><mark>we blow 150 dollars the night just to sleep. Frankly, it's not crazy.<\/mark>", "b": "<span class=\"dim\">On y va juste pour dormir, et <\/span><mark>on claque 150 dollars la nuit juste pour dormir. Franchement, c'est pas fou.<\/mark>"}, {"id": "B:BP0801", "bid": "BAY234", "f": "<span class=\"glabel\" style=\"display:block\">These sales are popular because things are cheaper.<\/span><mark>This kind of garage sales, in general, it works super well, because everything is less expensive<\/mark><span class=\"dim\">, and on top it's good for the planet.<\/span>", "b": "<mark>Ce genre de vide-greniers, en général, ça marche super bien, parce que tout est moins cher<\/mark><span class=\"dim\">, et en plus c'est bon pour la planète.<\/span>"}, {"id": "B:BP0803", "bid": "BAY235", "f": "<span class=\"glabel\" style=\"display:block\">Otherwise you'd give it away or it would gather dust.<\/span>And then think of your other options: either you give your stuff for free, or it stays in your attic taking the dust, and it brings you nothing at all.", "b": "Et puis pense à tes autres options : soit tu donnes tes affaires gratuitement, soit ça reste dans ton grenier à prendre la poussière, et ça te rapporte rien du tout."}, {"id": "B:BP0804", "bid": "BAY236", "f": "<span class=\"glabel\" style=\"display:block\">Compared with that, this is a good option.<\/span>So then, next to that, I find that the garage sale, it's rather a good option.", "b": "Du coup, à côté de ça, je trouve que le vide-grenier, c'est plutôt une bonne option."}, {"id": "B:BP1001", "bid": "BAY237", "f": "<span class=\"glabel\" style=\"display:block\">At least you can sell it back on the same site.<\/span><span class=\"dim\">But <\/span><mark>at least, you can resell it on the same site.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>au moins, tu peux le revendre sur le même site.<\/mark>"}, {"id": "B:BP0639", "bid": "BAY238", "f": "<span class=\"glabel\" style=\"display:block\">You could make extra money while you look for a job.<\/span>You could do that all while continuing to search for other jobs, just to make yourself a bit of extra money while waiting.", "b": "Tu pourrais faire ça tout en continuant à chercher d'autres jobs, histoire de te faire un peu d'argent en plus en attendant."}, {"id": "B:BP0831", "bid": "BAY238", "f": "<span class=\"glabel\" style=\"display:block\">You could make extra money while you look for a job.<\/span>But all the same, it could be a good way to make yourself a bit of money extra, especially since you're already looking for a new job.", "b": "Mais quand même, ça pourrait être un bon moyen de te faire un peu d'argent en plus, surtout que tu cherches déjà un nouveau boulot."}, {"id": "B:BP0640", "bid": "BAY239", "f": "<span class=\"glabel\" style=\"display:block\">If you need money fast, this is a real option.<\/span><span class=\"dim\">And <\/span><mark>if you have need of money coming in rapidly, that could be a real option, the time that you see what else you want to do.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si t'as besoin de rentrées d'argent rapidement, ça pourrait être une vraie option, le temps que tu voies ce que tu veux faire d'autre.<\/mark>"}, {"id": "B:BP0834", "bid": "BAY240", "f": "<span class=\"glabel\" style=\"display:block\">For a temporary job, it sounds good.<\/span>And for a temporary job, honestly, it looks not bad.", "b": "Et pour un boulot temporaire, honnêtement, ça a l'air pas mal."}, {"id": "B:BP0674", "bid": "BAY241", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't have to be your only side income.<\/span>After, I'm not saying either that it has to be your only extra money coming in, eh.", "b": "Après, je dis pas non plus que ça doit être ta seule rentrée d'argent en plus, hein."}, {"id": "B:BP0675", "bid": "BAY241", "f": "<span class=\"glabel\" style=\"display:block\">It doesn't have to be your only side income.<\/span>That could just be one thing among others that you would do on the side.", "b": "Ça pourrait juste être un truc parmi d'autres que tu ferais à côté."}, {"id": "B:BP0651", "bid": "BAY242", "f": "<span class=\"glabel\" style=\"display:block\">You'd make some money and get gifts.<\/span>And like that, you could make yourself a bit of money, and on top have some gifts from the company.", "b": "Et comme ça, tu pourrais te faire un peu d'argent, et en plus avoir des cadeaux de la boîte."}, {"id": "B:BP0955", "bid": "BAY243", "f": "<span class=\"glabel\" style=\"display:block\">What you do now (scrolling) doesn't pay you anything.<\/span><span class=\"dim\">But <\/span><mark>hanging around on the networks, that brings you nothing either, huh?<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>traîner sur les réseaux, ça te rapporte rien non plus, hein ?<\/mark>"}, {"id": "B:BP0958", "bid": "BAY244", "f": "<span class=\"glabel\" style=\"display:block\">You'd earn a little money from your couch.<\/span><span class=\"dim\">On the other hand, <\/span><mark>you're going to do enough of it to have enough to pay yourself a few meals per month — and that, just by clicking on two-three buttons, tranquil in your couch.<\/mark>", "b": "<span class=\"dim\">Par contre, <\/span><mark>tu vas en faire assez pour avoir de quoi te payer quelques repas par mois — et ça, juste en cliquant sur deux-trois boutons, tranquille dans ton canapé.<\/mark>"}, {"id": "B:BP0967", "bid": "BAY245", "f": "<span class=\"glabel\" style=\"display:block\">You'd start making real money faster.<\/span><span class=\"dim\">And like that, <\/span><mark>you start to make yourself real money faster.<\/mark>", "b": "<span class=\"dim\">Et comme ça, <\/span><mark>tu commences à te faire du vrai argent plus vite.<\/mark>"}, {"id": "B:BP0405", "bid": "BAY246", "f": "<span class=\"glabel\" style=\"display:block\">See it as a hobby, not a job.<\/span>But I wouldn't take it too much as a job, I would see it more as a leisure.", "b": "Mais je le prendrais pas trop comme un job, je le verrais plus comme un loisir."}]}, {"key": "B-BA9", "sec": "B", "code": "BA9", "name": "You can do it", "bucket": "Arguments", "items": [{"id": "B:BP0077", "bid": "BAY247", "f": "<span class=\"glabel\" style=\"display:block\">It's open to everyone.<\/span>And in fact, in the ad, they say that it's open to everyone, whether you come all alone, in family or in team.", "b": "Et en fait, dans l'annonce, ils disent que c'est ouvert à tout le monde, que tu viennes tout seul, en famille ou en équipe."}, {"id": "B:BP0123", "bid": "BAY248", "f": "<span class=\"glabel\" style=\"display:block\">Beginners are welcome.<\/span>They specify also that it's open to beginners, so it's not serious if you've never done anything of this kind. It's a bit that, the idea, by the way.", "b": "Ils précisent aussi que c'est ouvert aux débutants, donc c'est pas grave si t'as jamais rien fait de ce genre. C'est un peu ça, l'idée, d'ailleurs."}, {"id": "B:BP0861", "bid": "BAY248", "f": "<span class=\"glabel\" style=\"display:block\">Beginners are welcome.<\/span>Precisely, it's written in the ad that the itineraries are adapted as well to beginners as to more experienced people, so then I really don't think that it would be a problem.", "b": "Justement, c'est écrit dans l'annonce que les itinéraires sont adaptés aussi bien aux débutants qu'aux gens plus expérimentés, du coup je pense vraiment pas que ce serait un problème."}, {"id": "B:BP0843", "bid": "BAY249", "f": "<span class=\"glabel\" style=\"display:block\">You don't need experience.<\/span><span class=\"dim\">It doesn't look too complicated, <\/span><mark>you don't need experience<\/mark><span class=\"dim\">, and it doesn't have the air of being an enormous engagement on the long term.<\/span>", "b": "<span class=\"dim\">Ça a pas l'air trop compliqué, <\/span><mark>t'as pas besoin d'expérience<\/mark><span class=\"dim\">, et ça a pas l'air d'être un engagement énorme sur le long terme.<\/span>"}, {"id": "B:BP0825", "bid": "BAY249", "f": "<span class=\"glabel\" style=\"display:block\">You don't need experience.<\/span><span class=\"dim\">The tasks look rather simple, and on top, <\/span><mark>the ad even says that there's no need of experience nor of training.<\/mark>", "b": "<span class=\"dim\">Les tâches ont l'air plutôt simples, et en plus, <\/span><mark>l'annonce dit même qu'y a pas besoin d'expérience ni de formation.<\/mark>"}, {"id": "B:BP0848", "bid": "BAY249", "f": "<span class=\"glabel\" style=\"display:block\">You don't need experience.<\/span>The ad says black on white that there's no need of training, so necessarily, they're not looking only for people who already have experience with young people.", "b": "L'annonce dit noir sur blanc qu'y a pas besoin de formation, donc forcément, ils cherchent pas que des gens qui ont déjà de l'expérience avec les jeunes."}, {"id": "B:BP0858", "bid": "BAY249", "f": "<span class=\"glabel\" style=\"display:block\">You don't need experience.<\/span>And what's good, it's that one doesn't need experience, nor a licence, nothing of all that.", "b": "Et ce qui est bien, c'est qu'on a pas besoin d'expérience, ni de permis, rien de tout ça."}, {"id": "B:BP0969", "bid": "BAY249", "f": "<span class=\"glabel\" style=\"display:block\">You don't need experience.<\/span><span class=\"dim\">I have the impression that this technology, it's still under-exploited today, because in fact, <\/span><mark>not many people know that one can already create automations like that without any experience in code.<\/mark>", "b": "<span class=\"dim\">J'ai l'impression que cette technologie, elle est encore sous-exploitée aujourd'hui, parce qu'en fait, <\/span><mark>pas grand monde sait qu'on peut déjà créer des automatisations comme ça sans aucune expérience en code.<\/mark>"}, {"id": "B:BP0308", "bid": "BAY250", "f": "<span class=\"glabel\" style=\"display:block\">I don't think that's a requirement.<\/span><span class=\"dim\">I know, you're right, it's marked that they're looking for volunteer parents, <\/span><mark>but already, I don't think that it's necessarily obligatory.<\/mark>", "b": "<span class=\"dim\">Je sais, t'as raison, c'est marqué qu'ils cherchent des parents bénévoles, <\/span><mark>mais déjà, je pense pas que ce soit forcément obligatoire.<\/mark>"}, {"id": "B:BP0288", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span>So it's not as if one had to be a pro to sign up.", "b": "Donc c'est pas comme s'il fallait être un pro pour s'inscrire."}, {"id": "B:BP0009", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span>I even think not that one has to be super sporty for this kind of thing.", "b": "Je pense même pas qu'il faille être super sportif pour ce genre de truc."}, {"id": "B:BP0078", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">So <\/span><mark>I really think not that you have need to be a professional dancer to participate.<\/mark>", "b": "<span class=\"dim\">Donc <\/span><mark>je pense vraiment pas que t'aies besoin d'être danseur professionnel pour participer.<\/mark>"}, {"id": "B:BP0214", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">And <\/span><mark>you have no need to be a pro cyclist or someone hyper sporty to do it.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>t'as pas besoin d'être un cycliste pro ou quelqu'un d'hyper sportif pour le faire.<\/mark>"}, {"id": "B:BP0285", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">You have plenty of competences that you could share, and <\/span><mark>it's not obliged that it be of pro level either.<\/mark>", "b": "<span class=\"dim\">T'as plein de compétences que tu pourrais partager, et <\/span><mark>c'est pas obligé que ce soit du niveau pro non plus.<\/mark>"}, {"id": "B:BP0401", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span>I don't think that you need to be a professional critic with ten years of experience.", "b": "Je pense pas que t'aies besoin d'être un critique professionnel avec dix ans d'expérience."}, {"id": "B:BP0403", "bid": "BAY251", "f": "<span class=\"glabel\" style=\"display:block\">You don't need to be a professional or an expert.<\/span><span class=\"dim\">At the limit, they would maybe ask you to write a little critique or to send them your opinion on a film, but <\/span><mark>I don't think that one must be super at ease orally or whatever. In any case, the ad doesn't talk about it.<\/mark>", "b": "<span class=\"dim\">À la limite, ils te demanderaient peut-être d'écrire une petite critique ou de leur envoyer ton avis sur un film, mais <\/span><mark>je pense pas qu'il faille être super à l'aise à l'oral ou quoi. En tout cas, l'annonce en parle pas.<\/mark>"}, {"id": "B:BP0845", "bid": "BAY252", "f": "<span class=\"glabel\" style=\"display:block\">Other jobs want experience; this is short-term.<\/span>Plenty of other jobs that you're going to look at risk asking for experience or demanding that you stay well longer, whereas there, it's just short term with a bit of money in addition.", "b": "Plein d'autres boulots que tu vas regarder risquent de demander de l'expérience ou d'exiger que tu restes bien plus longtemps, alors que là, c'est juste du court terme avec un peu de sous en plus."}, {"id": "B:BP0912", "bid": "BAY253", "f": "<span class=\"glabel\" style=\"display:block\">The others there would be beginners like you.<\/span>I'm quasi sure that the others in the group, it would be people like you.", "b": "Je suis quasiment sûr que les autres du groupe, ce serait des gens comme toi."}, {"id": "B:BP0913", "bid": "BAY253", "f": "<span class=\"glabel\" style=\"display:block\">The others there would be beginners like you.<\/span>They would probably have seen the same kind of ad while telling themselves « hey, that looks interesting », even without any experience in the restoration of historic sites.", "b": "Ils auraient probablement vu le même genre d'annonce en se disant « tiens, ça a l'air intéressant », même sans aucune expérience dans la restauration de sites historiques."}, {"id": "B:BP0008", "bid": "BAY254", "f": "<span class=\"glabel\" style=\"display:block\">I've never done it either; it's my first time too.<\/span><span class=\"dim\">That learns itself, and then <\/span><mark>me neither I've never done any, so it will be my first time also.<\/mark>", "b": "<span class=\"dim\">Ça s'apprend, et puis <\/span><mark>moi non plus j'en ai jamais fait, donc ce sera ma première fois aussi.<\/mark>"}, {"id": "B:BP1006", "bid": "BAY254", "f": "<span class=\"glabel\" style=\"display:block\">I've never done it either; it's my first time too.<\/span>Me, I've never done theatre.", "b": "Moi, j'ai jamais fait de théâtre."}, {"id": "B:BP1039", "bid": "BAY254", "f": "<span class=\"glabel\" style=\"display:block\">I've never done it either; it's my first time too.<\/span><span class=\"dim\">But <\/span><mark>you have already done volunteering, you? Me, never.<\/mark>", "b": "<span class=\"dim\">Mais <\/span><mark>t'as déjà fait du bénévolat, toi ? Moi, jamais.<\/mark>"}, {"id": "B:BP0824", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span><mark>The tasks look rather simple<\/mark><span class=\"dim\">, and on top, the ad even says that there's no need of experience nor of training.<\/span>", "b": "<mark>Les tâches ont l'air plutôt simples<\/mark><span class=\"dim\">, et en plus, l'annonce dit même qu'y a pas besoin d'expérience ni de formation.<\/span>"}, {"id": "B:BP0836", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span><span class=\"dim\">Concretely, you would travel all while working, and <\/span><mark>I don't think that the tasks in themselves are so hard or so tiring as that.<\/mark>", "b": "<span class=\"dim\">Concrètement, tu voyagerais tout en bossant, et <\/span><mark>je pense pas que les tâches en elles-mêmes soient si dures ou si fatigantes que ça.<\/mark>"}, {"id": "B:BP0842", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span><mark>It doesn't look too complicated<\/mark><span class=\"dim\">, you don't need experience, and it doesn't have the air of being an enormous engagement on the long term.<\/span>", "b": "<mark>Ça a pas l'air trop compliqué<\/mark><span class=\"dim\">, t'as pas besoin d'expérience, et ça a pas l'air d'être un engagement énorme sur le long terme.<\/span>"}, {"id": "B:BP0914", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span>And frankly, I don't think that the work is so difficult as that.", "b": "Et franchement, je pense pas que le travail soit si difficile que ça."}, {"id": "B:BP0915", "bid": "BAY255", "f": "<span class=\"glabel\" style=\"display:block\">The tasks are simple and not hard.<\/span>Apparently, it's simple tasks that anyone or almost could do, or in any case learn to do quite fast.", "b": "Apparemment, c'est des tâches simples que n'importe qui ou presque pourrait faire, ou en tout cas apprendre à faire assez vite."}, {"id": "B:BP0286", "bid": "BAY256", "f": "<span class=\"glabel\" style=\"display:block\">What you'd do could be something small and simple.<\/span>That could be a thing all simple, like helping someone to write an email or a letter.", "b": "Ça pourrait être un truc tout simple, comme aider quelqu'un à écrire un mail ou une lettre."}, {"id": "B:BP0402", "bid": "BAY256", "f": "<span class=\"glabel\" style=\"display:block\">What you'd do could be something small and simple.<\/span><mark>At the limit, they would maybe ask you to write a little critique or to send them your opinion on a film<\/mark><span class=\"dim\">, but I don't think that one must be super at ease orally or whatever.<\/span>", "b": "<mark>À la limite, ils te demanderaient peut-être d'écrire une petite critique ou de leur envoyer ton avis sur un film<\/mark><span class=\"dim\">, mais je pense pas qu'il faille être super à l'aise à l'oral ou quoi.<\/span>"}, {"id": "B:BP0822", "bid": "BAY257", "f": "<span class=\"glabel\" style=\"display:block\">This seems like something you could do.<\/span><span class=\"dim\">And well, when I saw this ad, I right away thought of you, seeing as I know that you're looking for a new job — and <\/span><mark>frankly, it looks like being a thing that you could do.<\/mark>", "b": "<span class=\"dim\">Et bah, quand j'ai vu cette annonce, j'ai tout de suite pensé à toi, vu que je sais que tu cherches un nouveau boulot — et <\/span><mark>franchement, ça a l'air d'être un truc que tu pourrais faire.<\/mark>"}, {"id": "B:BP0215", "bid": "BAY258", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to finish; just do what you can.<\/span>In truth, it's more a challenge where each one does their best. The idea, it's just to do the most possible of it.", "b": "En vrai, c'est plus un défi où chacun fait de son mieux. L'idée, c'est juste d'en faire le plus possible."}, {"id": "B:BP0200", "bid": "BAY258", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to finish; just do what you can.<\/span><mark>But well, obviously, it's not serious to the point where we would be obliged to continue if ever we were completely wiped out or we felt that we couldn't take any more. We could stop<\/mark><span class=\"dim\">, eh.<\/span>", "b": "<mark>Mais bon, évidemment, c'est pas sérieux au point où on serait obligés de continuer si jamais on était complètement crevés ou qu'on sentait qu'on en pouvait plus. On pourrait s'arrêter<\/mark><span class=\"dim\">, hein.<\/span>"}, {"id": "B:BP0216", "bid": "BAY258", "f": "<span class=\"glabel\" style=\"display:block\">You don't have to finish; just do what you can.<\/span>Going to the end, it's not really what counts.", "b": "Aller au bout, c'est pas vraiment ce qui compte."}, {"id": "B:BP0265", "bid": "BAY259", "f": "<span class=\"glabel\" style=\"display:block\">It only feels hard because you haven't built the habits yet.<\/span><span class=\"dim\">The good things, that can demand efforts and sacrifices, and <\/span><mark>there, that surely seems difficult to you just because you haven't yet taken the habit.<\/mark>", "b": "<span class=\"dim\">Les bonnes choses, ça peut demander des efforts et des sacrifices, et <\/span><mark>là, ça te paraît sûrement difficile juste parce que t'as pas encore pris le pli.<\/mark>"}, {"id": "B:BP0628", "bid": "BAY260", "f": "<span class=\"glabel\" style=\"display:block\">Preparing is normal; lots of jobs need it.<\/span>There are lots of jobs where one has to prepare oneself, so at bottom, it's not really different.", "b": "Y a plein de jobs où il faut se préparer, donc au fond, c'est pas vraiment différent."}, {"id": "B:BP0627", "bid": "BAY260", "f": "<span class=\"glabel\" style=\"display:block\">Preparing is normal; lots of jobs need it.<\/span><span class=\"dim\">Yeah, you're right, that demands a bit of preparation, <\/span><mark>but that, it's normal. ça se rapproche pas mal de ce genre d'accompagnement.<\/mark>"}, {"id": "B:BP0269", "bid": "BAY269", "f": "<span class=\"glabel\" style=\"display:block\">Doing it with support is easier than alone.<\/span>Either you try to do everything all alone in your corner, without concrete advice nor a pro's opinion, or you do it accompanied by people who know what they're doing. And me, I just tell myself that the second option, that would make all that much more simple.", "b": "Soit t'essaies de tout faire tout seul dans ton coin, sans conseils concrets ni avis de pro, soit tu le fais accompagné par des gens qui savent ce qu'ils font. Et moi, je me dis juste que la deuxième option, ça rendrait tout ça bien plus simple."}, {"id": "B:BP0270", "bid": "BAY269", "f": "<span class=\"glabel\" style=\"display:block\">Doing it with support is easier than alone.<\/span><span class=\"dim\">And <\/span><mark>if you're counting in any case on launching yourself into this whole approach to eat better, I find that doing it with this kind of accompaniment, that would be a better way of going about it, because there would just be less headache.<\/mark>", "b": "<span class=\"dim\">Et <\/span><mark>si tu comptes de toute manière te lancer dans toute cette démarche pour mieux manger, je trouve que le faire avec ce genre d'accompagnement, ce serait une meilleure façon de s'y prendre, parce qu'il y aurait juste moins de prise de tête.<\/mark>"}, {"id": "B:BP1199", "bid": "BAY270", "f": "<span class=\"glabel\" style=\"display:block\">You'd work with real trainers.<\/span><span class=\"dim\">After, I'm not sure at 100 %, but <\/span><mark>seeing how they formulated the ad, I think that you'll be able to train with a certified coach.<\/mark>", "b": "<span class=\"dim\">Après, je suis pas sûr à 100 %, mais <\/span><mark>vu comment ils ont formulé l'annonce, je pense que tu pourras t'entraîner avec un coach certifié.<\/mark>"}, {"id": "B:BP1200", "bid": "BAY270", "f": "<span class=\"glabel\" style=\"d
