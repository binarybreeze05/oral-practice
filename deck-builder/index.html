<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>TEF Oral Decks</title>
<style>
/* One screen app: a top bar, then either the deck list or the two-column builder. Deliberately dark, like the study decks. */
:root{
  --bg:#17181A;--panel:#1F2023;--panel2:#292A2E;--line:#323338;--ink:#ECECEA;--ink2:#BDBDB8;--mute:#80817E;
  --acc:#57B5B0;--acc-ink:#0E1C1B;--a:#57B5B0;--b:#E3955E;--warn:#EE7B6E;--mark:#2C4F52;--markfr:#4A3F2A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:6px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:5px 12px;font-weight:600;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:#4a4b50}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger:hover{color:var(--warn);border-color:var(--warn)}
[hidden]{display:none!important}
/* ---- deck list ---- */
.list{max-width:820px;margin:0 auto;padding-block:20px 80px;padding-inline:16px}
.list h1{font-size:20px;margin:0 0 4px}
.list .sub{color:var(--mute);font-size:13px;margin:0 0 6px}
.list h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin:24px 0 6px}
.list h2.B{color:var(--b)}
.deck{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;padding:10px 12px;margin:6px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.deck .nm{font-weight:650;min-width:0;overflow-wrap:anywhere}
.deck .meta{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.deck .pg{color:#7fc49a}
.deck .acts{display:flex;gap:6px}
.deck .ask{grid-column:1/-1;display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:13px}
.note{color:var(--mute);font-size:13px;margin-top:18px;max-width:64ch}
.empty{color:var(--mute);padding:40px 0;text-align:center}
@media (max-width:560px){.deck{grid-template-columns:1fr}.deck .acts{flex-wrap:wrap}}
/* ---- builder ---- */
.bbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
#dname{flex:1 1 200px;min-width:0;font-size:16px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 8px}
#dname:hover,#dname:focus{border-color:var(--line);background:var(--panel)}
.count{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.heads,.row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr)}
.heads{border-bottom:1px solid var(--line)}
.heads div{padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.row{border-bottom:1px solid var(--line)}
.row.newbox{border-top:2px solid #45464b}
.row:focus-within{background:#1d2122}
.gut{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:10px;color:var(--mute);font:11px var(--mono)}
.gut .tl{display:none;flex-direction:column}
.row:hover .gut .tl,.row:focus-within .gut .tl{display:flex}
.gut button{border:0;background:transparent;color:var(--mute);padding:0 4px;font-size:12px;line-height:1.45;border-radius:4px}
.gut button:hover{color:var(--ink);background:var(--panel2)}
.gut button.del:hover{color:var(--warn)}
.cell{padding:10px 14px;min-height:44px;outline:none;border-left:1px solid var(--line);font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cell:focus{background:#202829;box-shadow:inset 0 0 0 1px #3d5a5c}
.cell:empty::before{content:attr(data-ph);color:#5a5b5f}
.cell.back{font-family:var(--serif);font-size:17px}
.cell .glabel{display:block;font:700 10.5px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:#7fa6a9;margin-bottom:2px;white-space:normal}
.cell mark{background:var(--mark);color:#fff;border-radius:3px;padding:0 2px}
.cell.back mark{background:var(--markfr)}
.cell .dim{color:#7a7a7a}
.cell .tags{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:6px;font:10.5px/1.4 var(--sans);white-space:normal}
.cell .tags .st{color:#8fb3b6}.cell .tags .st b{font-family:var(--mono);color:#b9a77e;margin-right:3px}
.cell .tags .gr{color:#6f7780;font-style:italic}
.addrow{padding:10px 12px 70px 52px}
.hint{color:var(--mute);text-align:center;padding:50px 16px;line-height:1.8}
@media (max-width:640px){.heads{display:none}.row{grid-template-columns:30px minmax(0,1fr)}.cell.back{grid-column:2;border-top:1px dashed var(--line)}}
/* cluster drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);z-index:21;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-bottom:20px}
.drawer h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:18px 16px 6px}
.drawer h3.A{color:var(--a)}.drawer h3.B{color:var(--b)}
.cl{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:7px 16px}
.cl:hover{background:var(--panel2)}
.cl.on{background:#26393a}
.cl .nm{flex:1;font-weight:600}
.cl .bk{color:var(--mute);font-size:11.5px}
.cl .n{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.cl .ed{width:7px;height:7px;border-radius:50%;flex:none;align-self:center}
.cl .ed.on{background:var(--b)}
/* in-page confirm + toast */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.55);padding-inline:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:420px;width:100%}
.modal p{margin:0 0 14px}
.modal .row2{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;pointer-events:auto}
.toast button{margin-left:10px;border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.bk-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>

<div class="top">
  <span class="brand">TEF Oral Decks</span>
  <div class="tabs" role="group" aria-label="View">
    <button id="tab-decks" aria-pressed="true">My decks</button><button id="tab-build" aria-pressed="false">Build</button>
  </div>
  <span class="status" id="status">Drafts and progress stay on this device</span>
</div>

<section id="view-decks" class="list">
  <h1>My decks</h1>
  <p class="sub" id="decks-sub"></p>
  <div id="decks"></div>
  <p class="note">Everything is saved in this browser only; nothing is sent anywhere. To move decks to another computer, click <b>Backup</b> here and <b>Restore</b> that file there. Clearing this browser's site data erases it.</p>
  <div class="bk-row"><button class="btn" id="backup" type="button">Backup (download .json)</button><button class="btn" id="restore" type="button">Restore from .json</button><input type="file" id="restore-file" accept=".json,application/json" hidden></div>
</section>

<section id="view-build" hidden>
  <div class="bbar">
    <button class="btn" id="clusters">☰ Clusters</button>
    <input id="dname" aria-label="Deck name" placeholder="Deck name">
    <span class="count" id="count"></span>
    <button class="btn" id="add">+ Add card</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn primary" id="export">Export deck</button>
  </div>
  <div class="heads"><div></div><div>Front</div><div>Back</div></div>
  <div id="rows"></div>
</section>

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Clusters" hidden></nav>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="modal-text"></p><div class="row2"><button class="btn" id="modal-no">Cancel</button><button class="btn primary" id="modal-yes">OK</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script id="data" type="application/json">{"clusters": [{"key": "A-P2", "sec": "A", "code": "P2", "name": "The offer", "bucket": "Questions", "items": [{"id": "A:Q063", "bid": "QB051", "f": "<span class=\"glabel\" style=\"display:block\">What exactly do you mean by that?<\/span>What do you understand exactly by « missions »?", "b": "Qu'entendez-vous exactement par « missions » ?<span class=\"tags\"><span class=\"st\"><b>3a<\/b> Qu'entendez-vous exactement par…<\/span><\/span>"}, {"id": "A:Q176", "bid": "QB051", "f": "<span class=\"glabel\" style=\"display:block\">What exactly do you mean by that?<\/span>What do you understand exactly by that? Could you develop this point?", "b": "Qu'entendez-vous exactement par là ? Pourriez-vous développer ce point ?<span class=\"tags\"><span class=\"st\"><b>3a<\/b> Qu'entendez-vous exactement par…<\/span><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q223", "bid": "QB051", "f": "<span class=\"glabel\" style=\"display:block\">What exactly do you mean by that?<\/span>Could you specify to me in what exactly the basics consist?", "b": "Pourriez-vous me préciser en quoi consistent exactement les bases ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q207", "bid": "QB141", "f": "<span class=\"glabel\" style=\"display:block\">Can you tell me more about how the venue is equipped for kids' parties?<\/span>You indicated that the room is entirely equipped for children's parties. Could you tell me more of it?", "b": "Vous avez indiqué que la salle est entièrement équipée pour les fêtes d'enfants. Pourriez-vous m'en dire davantage ?<span class=\"tags\"><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q056", "bid": "QB044", "f": "<span class=\"glabel\" style=\"display:block\">Can you describe what they look like?<\/span>Would you know how to describe them to me?", "b": "Sauriez-vous me les décrire ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q149", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span>Is there a notable difference between the conferences from one evening to the other, or do they stay more or less the same all along the season?", "b": "Y a-t-il une différence notable entre les conférences d'une soirée à l'autre, ou restent-elles à peu près les mêmes tout au long de la saison ?<span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:Q053", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span><mark>Is the route imposed for each guided walk<\/mark><span class=\"dim\">, or do we have the possibility to choose the sites that we wish to discover?<\/span>", "b": "<mark>Le parcours est-il imposé pour chaque promenade guidée<\/mark><span class=\"dim\">, ou avons-nous la possibilité de choisir les sites que nous souhaitons découvrir ?<\/span>"}, {"id": "A:QN40", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span>In what does the Tuesday class differ from the one of Thursday?", "b": "En quoi le cours du mardi diffère-t-il de celui du jeudi ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:QG008", "bid": "QB042", "f": "<span class=\"glabel\" style=\"display:block\">Is it the same every time, or does it change?<\/span>Is it a question of the same level?", "b": "S'agit-il du même niveau ?"}, {"id": "A:Q236", "bid": "QB153", "f": "<span class=\"glabel\" style=\"display:block\">What do we jump over, a lake or a field?<\/span>Above what does one jump, exactly? Is it a question of a lake, or rather of a field?", "b": "Au-dessus de quoi saute-t-on, au juste ? S'agit-il d'un lac, ou plutôt d'un champ ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q208", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span>What kind of activities do you propose, for example?", "b": "Quel genre d'activités proposez-vous, par exemple ?"}, {"id": "A:Q023", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span>What kind of souvenirs can one find there?", "b": "Quel genre de souvenirs peut-on y trouver ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q033", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span><span class=\"dim\">So, <\/span><mark>can you indicate to me what you sell exactly on the artisanal stands?<\/mark>", "b": "<span class=\"dim\">Alors, <\/span><mark>pouvez-vous m'indiquer ce que vous vendez exactement sur les stands artisanaux ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q038", "bid": "QB142", "f": "<span class=\"glabel\" style=\"display:block\">What kind of things do you offer?<\/span><span class=\"dim\">You indicate in the ad that there is catering on the spot: <\/span><mark>what kind of dishes do you propose?<\/mark>", "b": "<span class=\"dim\">Vous indiquez dans l'annonce qu'il y a de la restauration sur place : <\/span><mark>quel genre de plats proposez-vous ?<\/mark>"}, {"id": "A:Q161", "bid": "QB118", "f": "<span class=\"glabel\" style=\"display:block\">Do you offer that?<\/span><span class=\"dim\">Pardon me if you have already spoken of it, but <\/span><mark>would you also have credit cards to propose?<\/mark>", "b": "<span class=\"dim\">Pardonnez-moi si vous en avez déjà parlé, mais <\/span><mark>auriez-vous également des cartes de crédit à proposer ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q162", "bid": "QB118", "f": "<span class=\"glabel\" style=\"display:block\">Do you offer that?<\/span>If I don't deceive myself, you propose also a savings account?", "b": "Si je ne m'abuse, vous proposez aussi un compte épargne ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q091", "bid": "QB071", "f": "<span class=\"glabel\" style=\"display:block\">If you buy the food, what kind would it be?<\/span>If I asked you to buy the food yourselves, of what type of food would it be a matter?", "b": "Si je vous demandais d'acheter la nourriture vous-mêmes, de quel type de nourriture s'agirait-il ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q175", "bid": "QB128", "f": "<span class=\"glabel\" style=\"display:block\">How many different cuisines can we learn?<\/span>How many types of different cooking courses do you propose? And how many different cuisines can one learn there?", "b": "Combien de types de cours de cuisine différents proposez-vous ? Et combien de cuisines différentes peut-on y apprendre ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q151", "bid": "QB112", "f": "<span class=\"glabel\" style=\"display:block\">What are the lectures usually about?<\/span><span class=\"dim\">I should without doubt have posed you the question from the outset, but <\/span><mark>on what subjects do the conferences bear, in general?<\/mark>", "b": "<span class=\"dim\">J'aurais sans doute dû vous poser la question d'emblée, mais <\/span><mark>sur quels sujets les conférences portent-elles, en général ?<\/mark><span class=\"tags\"><span class=\"gr\">cond. passé · idiome<\/span><\/span>"}, {"id": "A:Q032", "bid": "QB027", "f": "<span class=\"glabel\" style=\"display:block\">Who is performing on each day?<\/span>What artists perform each day?", "b": "Quels artistes se produisent chaque jour ?"}, {"id": "A:Q031", "bid": "QB027", "f": "<span class=\"glabel\" style=\"display:block\">Who is performing on each day?<\/span>Would it be possible to know a bit more on the programming?", "b": "Serait-il possible d'en savoir un peu plus sur la programmation ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q055", "bid": "QB043", "f": "<span class=\"glabel\" style=\"display:block\">What are some of these sites?<\/span>Could you cite me a few of them, of these sites?", "b": "Pourriez-vous m'en citer quelques-uns, de ces sites ?<span class=\"tags\"><span class=\"gr\">cond · dislocation · en/y<\/span><\/span>"}, {"id": "A:Q118", "bid": "QB089", "f": "<span class=\"glabel\" style=\"display:block\">What packages do you offer?<\/span>Could you present me the different formulas that you propose?", "b": "Pourriez-vous me présenter les différentes formules que vous proposez ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q209", "bid": "QB089", "f": "<span class=\"glabel\" style=\"display:block\">What packages do you offer?<\/span>You mention in the ad four different formulas: in what do they consist?", "b": "Vous mentionnez dans l'annonce quatre formules différentes : en quoi consistent-elles ?"}, {"id": "A:Q200", "bid": "QB077", "f": "<span class=\"glabel\" style=\"display:block\">What does the higher package include that the basic one doesn't?<\/span>And in what does the all-risks insurance differ from the basic insurance? What does it cover more?", "b": "Et en quoi l'assurance tous risques diffère-t-elle de l'assurance de base ? Que couvre-t-elle de plus ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:Q097", "bid": "QB077", "f": "<span class=\"glabel\" style=\"display:block\">What does the higher package include that the basic one doesn't?<\/span>I ask myself what I would have more if I opted for one of your top-of-the-range formulas.", "b": "Je me demande ce que j'aurais de plus si j'optais pour l'une de vos formules haut de gamme.<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q211", "bid": "QB077", "f": "<span class=\"glabel\" style=\"display:block\">What does the higher package include that the basic one doesn't?<\/span><span class=\"dim\">Pardon me if you have already mentioned it, but so that it be perfectly clear: <\/span><mark>is there a notable difference between the formula the least expensive and the one just above? What does the second propose more?<\/mark>", "b": "<span class=\"dim\">Pardonnez-moi si vous l'avez déjà mentionné, mais pour que ce soit parfaitement clair : <\/span><mark>y a-t-il une différence notable entre la formule la moins chère et celle juste au-dessus ? Que propose la seconde de plus ?<\/mark><span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q226", "bid": "QB149", "f": "<span class=\"glabel\" style=\"display:block\">Does that include any horse, not just trained ones?<\/span>And I'm talking about any horse, not only about trained horses.", "b": "Et je parle de n'importe quel cheval, pas seulement de chevaux dressés."}, {"id": "A:Q206", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span>First of all, do we choose the room ourselves, or is it well you who take care of choosing it for us?", "b": "Tout d'abord, choisissons-nous la salle nous-mêmes, ou est-ce bien vous qui vous occupez de la choisir pour nous ?<span class=\"tags\"><span class=\"st\"><b>6d<\/b> Est-ce bien vous qui vous occupez de…<\/span><\/span>"}, {"id": "A:Q045", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span>Do we have the possibility to choose the car, or do you content yourselves with attributing one according to the availabilities?", "b": "Avons-nous la possibilité de choisir la voiture, ou vous contentez-vous d'en attribuer une selon les disponibilités ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q054", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span><span class=\"dim\">Is the route imposed for each guided walk, or <\/span><mark>do we have the possibility to choose the sites that we wish to discover?<\/mark>", "b": "<span class=\"dim\">Le parcours est-il imposé pour chaque promenade guidée, ou <\/span><mark>avons-nous la possibilité de choisir les sites que nous souhaitons découvrir ?<\/mark>"}, {"id": "A:Q215", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span><mark>For the birthday cake, is it necessary that we choose one among those that you propose<\/mark><span class=\"dim\">, or can we take the cake of our choice, whatever it is?<\/span>", "b": "<mark>Pour le gâteau d'anniversaire, faut-il que nous en choisissions un parmi ceux que vous proposez<\/mark><span class=\"dim\">, ou pouvons-nous prendre le gâteau de notre choix, quel qu'il soit ?<\/span><span class=\"tags\"><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:Q216", "bid": "QB037", "f": "<span class=\"glabel\" style=\"display:block\">Can we choose that ourselves, or do you decide?<\/span><span class=\"dim\">For the birthday cake, is it necessary that we choose one among those that you propose, <\/span><mark>or can we take the cake of our choice, whatever it is?<\/mark>", "b": "<span class=\"dim\">Pour le gâteau d'anniversaire, faut-il que nous en choisissions un parmi ceux que vous proposez, <\/span><mark>ou pouvons-nous prendre le gâteau de notre choix, quel qu'il soit ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:Q214", "bid": "QB144", "f": "<span class=\"glabel\" style=\"display:block\">How much can we customize the catering?<\/span>Up to what point could we personalise the catering planned for the party?", "b": "Jusqu'à quel point pourrions-nous personnaliser la restauration prévue pour la fête ?<span class=\"tags\"><span class=\"st\"><b>8d<\/b> Jusqu'à quel point…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QG004", "bid": "QB144", "f": "<span class=\"glabel\" style=\"display:block\">How much can we customize the catering?<\/span>Would you be in measure to adapt the menu?", "b": "Seriez-vous en mesure d'adapter le menu ?"}, {"id": "A:QN07", "bid": "QB161", "f": "<span class=\"glabel\" style=\"display:block\">What happens if someone has a food allergy?<\/span>What would happen if one of the children suffered from a food allergy?", "b": "Que se passerait-il si l'un des enfants souffrait d'une allergie alimentaire ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q026", "bid": "QB024", "f": "<span class=\"glabel\" style=\"display:block\">Can we sell the lamp we make after the workshop?<\/span>Would you know how to indicate to me if one has the right to sell, after the workshop, the lamp that one will have fabricated?", "b": "Sauriez-vous m'indiquer si l'on a le droit de vendre, après l'atelier, la lampe qu'on aura fabriquée ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P7", "sec": "A", "code": "P7", "name": "Fit & eligibility", "bucket": "Questions", "items": [{"id": "A:Q079", "bid": "QB005", "f": "<span class=\"glabel\" style=\"display:block\">Is it OK for a complete beginner with no experience?<\/span>Last question: is there a particular condition to fill, in matter of experience, so that you study my candidacy?", "b": "Dernière question : y a-t-il une condition particulière à remplir, en matière d'expérience, pour que vous étudiiez ma candidature ?<span class=\"tags\"><span class=\"st\"><b>6c<\/b> Y a-t-il une condition particulière…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q005", "bid": "QB005", "f": "<span class=\"glabel\" style=\"display:block\">Is it OK for a complete beginner with no experience?<\/span>I know that you have already specified that beginners without any experience in paragliding could participate, but I really wanted to insist on that.", "b": "Je sais que vous avez déjà précisé que les débutants sans aucune expérience en parapente pouvaient participer, mais je tenais vraiment à insister là-dessus."}, {"id": "A:Q006", "bid": "QB005", "f": "<span class=\"glabel\" style=\"display:block\">Is it OK for a complete beginner with no experience?<\/span>As regards the security instructions or the procedures to respect to practise in all security, do you think that a true beginner like me would be capable of following them all?", "b": "S'agissant des consignes de sécurité ou des procédures à respecter pour pratiquer en toute sécurité, pensez-vous qu'un vrai débutant comme moi soit capable de toutes les suivre ?<span class=\"tags\"><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q020", "bid": "QB018", "f": "<span class=\"glabel\" style=\"display:block\">Are children under 13 allowed on the guided tours?<\/span>The children of less than 13 years, are they admitted to the guided visits?", "b": "Les enfants de moins de 13 ans sont-ils admis aux visites guidées ?"}, {"id": "A:Q080", "bid": "QB064", "f": "<span class=\"glabel\" style=\"display:block\">Which pets do you look after?<\/span>For which animals do you propose your guarding services?", "b": "Pour quels animaux proposez-vous vos services de garde ?"}, {"id": "A:QN57", "bid": "QB064", "f": "<span class=\"glabel\" style=\"display:block\">Which pets do you look after?<\/span>I would like to know if you keep also the aged animals that have need of a treatment.", "b": "Je voudrais savoir si vous gardez aussi les animaux âgés qui ont besoin d'un traitement.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q138", "bid": "QB104", "f": "<span class=\"glabel\" style=\"display:block\">How big can the pet be?<\/span>What do you understand exactly by « reasonable size »? Up to what size do you accept them?", "b": "Qu'entendez-vous exactement par « taille raisonnable » ? Jusqu'à quelle taille les acceptez-vous ?"}, {"id": "A:Q003", "bid": "QB003", "f": "<span class=\"glabel\" style=\"display:block\">Can we book as a group instead of individually?<\/span>If we reserve, would it be possible to do it in a group rather than individually?", "b": "Si nous réservons, serait-il possible de le faire en groupe plutôt qu'individuellement ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q058", "bid": "QB046", "f": "<span class=\"glabel\" style=\"display:block\">Do you have a boat that fits five people?<\/span><mark>A boat for five, that will do the affair<\/mark><span class=\"dim\">, but it would also be needed that it be safe and reassuring.<\/span>", "b": "<mark>Un bateau pour cinq, ça fera l'affaire<\/mark><span class=\"dim\">, mais il faudrait aussi qu'il soit sûr et rassurant.<\/span><span class=\"tags\"><span class=\"gr\">dislocation · subj · cond<\/span><\/span>"}, {"id": "A:Q077", "bid": "QB062", "f": "<span class=\"glabel\" style=\"display:block\">Can I fit this in after my day job?<\/span>I ask myself if I could carry them out after my day of work.", "b": "Je me demande si je pourrais les effectuer après ma journée de travail.<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P8", "sec": "A", "code": "P8", "name": "Experience & results", "bucket": "Questions", "items": [{ que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:QN11", "bid": "QB170", "f": "<span class=\"glabel\" style=\"display:block\">Why is it so popular?<\/span>How do you explain that the places leave so fast?", "b": "Comment expliquez-vous que les places partent aussi vite ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q106", "bid": "QB073", "f": "<span class=\"glabel\" style=\"display:block\">What's trending right now?<\/span>And would you know how to indicate to me what has the wind in its sails at the moment?", "b": "Et sauriez-vous m'indiquer ce qui a le vent en poupe en ce moment ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:Q093", "bid": "QB073", "f": "<span class=\"glabel\" style=\"display:block\">What's trending right now?<\/span>And could you tell me which ones are trendy at the moment?", "b": "Et pourriez-vous me dire lesquelles sont tendance en ce moment ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN25", "bid": "QB074", "f": "<span class=\"glabel\" style=\"display:block\">Which one would you recommend?<\/span>Among the cuisines that you teach, which one would you recommend to a big beginner like me?", "b": "Parmi les cuisines que vous enseignez, laquelle recommanderiez-vous à un grand débutant comme moi ?<span class=\"tags\"><span class=\"st\"><b>7b<\/b> Lequel recommanderiez-vous ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q094", "bid": "QB074", "f": "<span class=\"glabel\" style=\"display:block\">Which one would you recommend?<\/span>If you had to recommend me personally a few little-known destinations, some little nuggets in some sort, which ones would you advise me?", "b": "Si vous deviez me recommander personnellement quelques destinations méconnues, des petites pépites en quelque sorte, lesquelles rmarchés comme Whole Foods, par exemple ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:Q159", "bid": "QB134", "f": "<span class=\"glabel\" style=\"display:block\">How are you different from the usual alternative?<\/span><mark>And what would be the advantage of an online account in relation to a traditional bank, where one can go to the branch<\/mark><span class=\"dim\">, whereas with you, it's necessary to pass by the telephone or by your site?<\/span>", "b": "<mark>Et quel serait l'avantage d'un compte en ligne par rapport à une banque traditionnelle, où l'on peut se rendre en agence<\/mark><span class=\"dim\">, alors qu'avec vous, il faut passer par le téléphone ou par votre site ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q123", "bid": "QB093", "f": "<span class=\"glabel\" style=\"display:block\">Is it original, or a parody?<\/span>Up to what point would the melody be original?", "b": "Jusqu'à quel point la mélodie serait-elle originale ?<span class=\"tags\"><span class=\"st\"><b>8d<\/b> Jusqu'à quel point…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q125", "bid": "QB093", "f": "<span class=\"glabel\" style=\"display:block\">Is it original, or a parody?<\/span>Would it be about something catchy, or rather the pastiche of a song already known?", "b": "S'agirait-il de quelque chose d'entraînant, ou plutôt du pastiche d'une chanson déjà connue ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q124", "bid": "QB094", "f": "<span class=\"glabel\" style=\"display:block\">Will it be catchy?<\/span><mark>Would it be about something catchy<\/mark><span class=\"dim\">, or rather the pastiche of a song already known?<\/span>", "b": "<mark>S'agirait-il de quelque chose d'entraînant<\/mark><span class=\"dim\">, ou plutôt du pastiche d'une chanson déjà connue ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q144", "bid": "QB107", "f": "<span class=\"glabel\" style=\"display:block\">What is the museum like at night?<\/span><span class=\"dim\">I don't know very well this event, so <\/span><mark>I ask myself what the museum resembles at night.<\/mark>", "b": "<span class=\"dim\">Je ne connais pas très bien cet événement, alors <\/span><mark>je me demande à quoi ressemble le musée la nuit.<\/mark>"}, {"id": "A:Q145", "bid": "QB108", "f": "<span class=\"glabel\" style=\"display:block\">Is it crowded?<\/span>Do you know if there is generally a crowd?", "b": "Savez-vous s'il y a généralement foule ?<span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q146", "bid": "QB109", "f": "<span class=\"glabel\" style=\"display:block\">Is there a dress code?<\/span>A particular outfit, is it obligatory for this kind of evening?", "b": "Une tenue particulière est-elle obligatoire pour ce genre de soirée ?<span class=\"tags\"><span class=\"st\"><b>6b<\/b> … est-il obligatoire ?<\/span><\/span>"}, {"id": "A:Q147", "bid": "QB109", "f": "<span class=\"glabel\" style=\"display:block\">Is there a dress code?<\/span>Is it about an evening where one could put oneself on one's thirty-one?", "b": "S'agit-il d'une soirée où l'on pourrait se mettre sur son trente-et-un ?<span class=\"tags\"><span class=\"gr\">idiome · cond<\/span><\/span>"}, {"id": "A:Q148", "bid": "QB110", "f": "<span class=\"glabel\" style=\"display:block\">Are there good spots in the museum for taking photos?<\/span>Are there in the museum some photogenic corners where one can take photos?", "b": "Y a-t-il dans le musée des coins photogéniques où l'on puisse prendre des photos ?<span class=\"tags\"><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q022", "bid": "QB020", "f": "<span class=\"glabel\" style=\"display:block\">Can we take photos there?<\/span>Would it be possible to take photos on the spot?", "b": "Serait-il possible de prendre des photos sur place ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q171", "bid": "QB081", "f": "<span class=\"glabel\" style=\"display:block\">How many people are in a group?<\/span>Concerning the courses themselves, what is the size of the groups? How many people does each course welcome?", "b": "Concernant les cours eux-mêmes, quelle est la taille des groupes ? Combien de personnes chaque cours accueille-t-il ?"}, {"id": "A:Q102", "bid": "QB081", "f": "<span class=\"glabel\" style=\"display:block\">How many people are in a group?<\/span><mark>How many people does the group count in total<\/mark><span class=\"dim\">, and what is the profile of the travellers?<\/span>", "b": "<mark>Combien de personnes le groupe compte-t-il au total<\/mark><span class=\"dim\">, et quel est le profil des voyageurs ?<\/span>"}, {"id": "A:Q240", "bid": "QB081", "f": "<span class=\"glabel\" style=\"display:block\">How many people are in a group?<\/span>And a session, how many people can it welcome?", "b": "Et une session, combien de personnes peut-elle accueillir ?<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:Q103", "bid": "QB082", "f": "<span class=\"glabel\" style=\"display:block\">What kind of people are in the group?<\/span><span class=\"dim\">How many people does the group count in total, and <\/span><mark>what is the profile of the travellers?<\/mark>", "b": "<span class=\"dim\">Combien de personnes le groupe compte-t-il au total, et <\/span><mark>quel est le profil des voyageurs ?<\/mark>"}, {"id": "A:QN26", "bid": "QB082", "f": "<span class=\"glabel\" style=\"display:block\">What kind of people are in the group?<\/span>In what proportion do the travellers leave alone rather than in a couple or between friends?", "b": "Dans quelle proportion les voyageurs partent-ils seuls plutôt qu'en couple ou entre amis ?<span class=\"tags\"><span class=\"st\"><b>8a<\/b> Dans quelle proportion…<\/span><\/span>"}, {"id": "A:QN22", "bid": "QB082", "f": "<span class=\"glabel\" style=\"display:block\">What kind of people are in the group?<\/span>In what proportion are your participants real beginners?", "b": "Dans quelle proportion vos participants sont-ils de vrais débutants ?<span class=\"tags\"><span class=\"st\"><b>8a<\/b> Dans quelle proportion…<\/span><\/span>"}, {"id": "A:QN62", "bid": "QB082", "f": "<span class=\"glabel\" style=\"display:block\">What kind of people are in the group?<\/span>That said, what is it of the level of the other students?", "b": "Cela dit, qu'en est-il du niveau des autres élèves ?<span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><\/span>"}, {"id": "A:QG011", "bid": "QB082", "f": "<span class=\"glabel\" style=\"display:block\">What kind of people are in the group?<\/span>Is it rather homogeneous?", "b": "Est-il plutôt homogène ?"}, {"id": "A:Q017", "bid": "QB015", "f": "<span class=\"glabel\" style=\"display:block\">Is it easy to make friends there?<\/span>Could you tell me to what extent it is easy to make friends there?", "b": "Pourriez-vous me dire dans quelle mesure il est facile de s'y faire des amis ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q016", "bid": "QB015", "f": "<span class=\"glabel\" style=\"display:block\">Is it easy to make friends there?<\/span>What is the ambiance, on the social side, in these courses?", "b": "Quelle est l'ambiance, côté social, dans ces cours ?"}, {"id": "A:QN63", "bid": "QB129", "f": "<span class=\"glabel\" style=\"display:block\">How long until I get good at it?<\/span>Could you indicate to me the delay to foresee before passing to the intermediate level?", "b": "Pourriez-vous m'indiquer le délai à prévoir avant de passer au niveau intermédiaire ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q178", "bid": "QB129", "f": "<span class=\"glabel\" style=\"display:block\">How long until I get good at it?<\/span>Under what delay can I hope to master cooking, knowing that I would start from zero and that I know just barely how to make a fried egg?", "b": "Sous quel délai puis-je espérer maîtriser la cuisine, sachant que je partirais de zéro et que je sais tout juste faire un œuf au plat ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q225", "bid": "QB129", "f": "<span class=\"glabel\" style=\"display:block\">How long until I get good at it?<\/span>How much time would it take before I can ride a horse at the gallop, like in the films?", "b": "Combien de temps faudrait-il avant que je puisse monter à cheval au galop, comme dans les films ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q222", "bid": "QB148", "f": "<span class=\"glabel\" style=\"display:block\">What progress can I expect along the way?<\/span><span class=\"dim\">Could you develop a little? <\/span><mark>What level can I hope to reach at the end of a week, of a month, then of three months?<\/mark>", "b": "<span class=\"dim\">Pourriez-vous développer un peu ? <\/span><mark>Quel niveau puis-je espérer atteindre au bout d'une semaine, d'un mois, puis de trois mois ?<\/mark><span class=\"tags\"><span class=\"st\"><b>3b<\/b> Pourriez-vous développer ce point ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q224", "bid": "QB148", "f": "<span class=\"glabel\" style=\"display:block\">What progress can I expect along the way?<\/span>If it takes three months to learn to ride a horse, I would like that there be at least some intermediate levels that I could aim for.", "b": "S'il faut trois mois pour apprendre à monter à cheval, j'aimerais qu'il y ait au moins des paliers intermédiaires que je puisse viser.<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN27", "bid": "QB171", "f": "<span class=\"glabel\" style=\"display:block\">How much would missing a week slow my progress?<\/span>In what measure would the fact of missing a week affect my progression?", "b": "Dans quelle mesure le fait de manquer une semaine affecterait-il ma progression ?<span class=\"tags\"><span class=\"st\"><b>5b<\/b> Dans quelle mesure cela affecterait-il…<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P1", "sec": "A", "code": "P1", "name": "Money", "bucket": "Questions", "items": [{"id": "A:Q136", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>Could you specify to me the exact amount of the rent?", "b": "Pourriez-vous me préciser le montant exact du loyer ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q018", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>Can you indicate to me the tariff of an adult ticket for the guided visit?", "b": "Pouvez-vous m'indiquer le tarif d'un billet adulte pour la visite guidée ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q051", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>I would have wanted to know what would be the tariff of a complete day of rental, from nine hours to seventeen hours.", "b": "J'aurais voulu savoir quel serait le tarif d'une journée complète de location, de neuf heures à dix-sept heures.<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond. passé · cond<\/span><\/span>"}, {"id": "A:Q120", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>I would wish to go on a song with the orchestral production, and I would hold to it that it lasts at least three minutes. How much would that cost me?", "b": "Je souhaiterais partir sur une chanson à la production orchestrale, et je tiendrais à ce qu'elle dure au moins trois minutes. Combien cela me coûterait-il ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q196", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>Starting from there, at how much would you estimate the cost?", "b": "Partant de là, à combien estimeriez-vous le coût ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q210", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>In that case, to how much would that come back, in total?", "b": "Dans ce cas, à combien cela reviendrait-il, au total ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q021", "bid": "QB016", "f": "<span class=\"glabel\" style=\"display:block\">How much does it cost?<\/span>And what is it about the tariff for a child?", "b": "Et qu'en est-il du tarif pour un enfant ?<span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q081", "bid": "QB007", "f": "<span class=\"glabel\" style=\"display:block\">What are the prices for the different options?<\/span>Could you specify me the tariffs of the different guarding formulas that you propose?", "b": "Pourriez-vous me préciser les tarifs des différentes formules de garde que vous proposez ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q008", "bid": "QB007", "f": "<span class=\"glabel\" style=\"display:block\">What are the prices for the different options?<\/span>Would you have a few examples of tariffs to give me for the different courses?", "b": "Auriez-vous quelques exemples de tarifs à me donner pour les différents cours ?<span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q181", "bid": "QB007", "f": "<span class=\"glabel\" style=\"display:block\">What are the prices for the different options?<\/span><mark>I would like to know what are your prices as a general rule<\/mark><span class=\"dim\">, and in what they differ from those of the market and of the supermarket.<\/span>", "b": "<mark>Je voudrais savoir quels sont vos prix en règle générale<\/mark><span class=\"dim\">, et en quoi ils diffèrent de ceux du marché et du supermarché.<\/span><span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q009", "bid": "QB008", "f": "<span class=\"glabel\" style=\"display:block\">Is salsa 45 dollars per class?<\/span><span class=\"dim\">Yes, I believe that the salsa courses would tempt me well. <\/span><mark>Could you confirm to me that the tariff is indeed 45 dollars per course?<\/mark>", "b": "<span class=\"dim\">Oui, je crois que les cours de salsa me tenteraient bien. <\/span><mark>Pourriez-vous me confirmer que le tarif est bien de 45 dollars par cours ?<\/mark><span class=\"tags\"><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:Q095", "bid": "QB075", "f": "<span class=\"glabel\" style=\"display:block\">What's the cheapest package you offer for two weeks in Albania, Georgia and Slovenia?<\/span>If, by hypothesis, I wished to leave for Albania, Georgia and Slovenia, what would be the least expensive formula that you propose? Let's say that I would want the stay to last two weeks.", "b": "Si, par hypothèse, je souhaitais partir en Albanie, en Géorgie et en Slovénie, quelle serait la formule la moins chère que vous proposez ? Disons que je voudrais que le séjour dure deux semaines.<span class=\"tags\"><span class=\"gr\">si + imparf. · cond · subj<\/span><\/span>"}, {"id": "A:Q047", "bid": "QB039", "f": "<span class=\"glabel\" style=\"display:block\">Does the price depend on that?<\/span>The price, does it depend on the frame that one chooses?", "b": "Le prix dépend-il de la monture que l'on choisit ?"}, {"id": "A:Q048", "bid": "QB039", "f": "<span class=\"glabel\" style=\"display:block\">Does the price depend on that?<\/span>Would there be a risk that I must pay a supplement as a function of my prescription?", "b": "Y aurait-il un risque que je doive payer un supplément en fonction de mon ordonnance ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN04", "bid": "QB076", "f": "<span class=\"glabel\" style=\"display:block\">How much would that change the price?<\/span>If ever two children came to add themselves to the group, in what measure would that affect the price?", "b": "Si jamais deux enfants venaient s'ajouter au groupe, dans quelle mesure cela affecterait-il le prix ?<span class=\"tags\"><span class=\"st\"><b>5b<\/b> Dans quelle mesure cela affecterait-il…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q096", "bid": "QB076", "f": "<span class=\"glabel\" style=\"display:block\">How much would that change the price?<\/span>If I shortened rather the stay to seven days, to how much would the price of the formula then rise?", "b": "Si je raccourcissais plutôt le séjour à sept jours, à combien s'élèverait alors le prix de la formule ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q082", "bid": "QB041", "f": "<span class=\"glabel\" style=\"display:block\">What's the price difference between the two options?<\/span><span class=\"dim\">I know that you ensure at the same time the guarding at home and the guarding in a host family: <\/span><mark>is there a notable difference of price between the two?<\/mark>", "b": "<span class=\"dim\">Je sais que vous assurez à la fois la garde à domicile et la garde en famille d'accueil : <\/span><mark>y a-t-il une différence notable de prix entre les deux ?<\/mark><span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:Q052", "bid": "QB041", "f": "<span class=\"glabel\" style=\"display:block\">What's the price difference between the two options?<\/span>What difference of price is there between the two formulas?", "b": "Quelle différence de prix y a-t-il entre les deux formules ?"}, {"id": "A:QN01", "bid": "QB159", "f": "<span class=\"glabel\" style=\"display:block\">Why is there such a price difference?<\/span>To what is due the fact that the tariffs vary so much from one course to the other?", "b": "À quoi est dû le fait que les tarifs varient autant d'un cours à l'autre ?<span class=\"tags\"><span class=\"st\"><b>4d<\/b> À quoi est dû le fait que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:QN02", "bid": "QB159", "f": "<span class=\"glabel\" style=\"display:block\">Why is there such a price difference?<\/span>What justifies such a gap of price between the formula with guide and the one without guide?", "b": "Qu'est-ce qui justifie un tel écart de prix entre la formule avec guide et celle sans guide ?<span class=\"tags\"><span class=\"st\"><b>4b<\/b> Qu'est-ce qui justifie…<\/span><\/span>"}, {"id": "A:QN03", "bid": "QB159", "f": "<span class=\"glabel\" style=\"display:block\">Why is there such a price difference?<\/span>And what would justify a supplement as a function of the prescription?", "b": "Et qu'est-ce qui justifierait un supplément en fonction de l'ordonnance ?<span class=\"tags\"><span class=\"st\"><b>4b<\/b> Qu'est-ce qui justifie…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q182", "bid": "QB131", "f": "<span class=\"glabel\" style=\"display:block\">How do your prices compare to the farmers market and the grocery store?<\/span>I would like to know what are your prices as a general rule, and in what they differ from those of the market and of the supermarket.", "b": "Je voudrais savoir quels sont vos prix en règle générale, et en quoi ils diffèrent de ceux du marché et du supermarché.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q019", "bid": "QB017", "f": "<span class=\"glabel\" style=\"display:block\">Is that included in the price?<\/span>I would like to know if the workshops are included in the price of the ticket.", "b": "Je voudrais savoir si les ateliers sont compris dans le prix du billet.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q039", "bid": "QB017", "f": "<span class=\"glabel\" style=\"display:block\">Is that included in the price?<\/span>The catering, is it included in the price of the ticket, or must one plan a supplement?", "b": "La restauration est-elle comprise dans le prix du billet, ou faut-il prévoir un supplément ?"}, {"id": "A:Q101", "bid": "QB017", "f": "<span class=\"glabel\" style=\"display:block\">Is that included in the price?<\/span><span class=\"dim\">Pardon me if you have already evoked it, but <\/span><mark>your base formula, would it include also tourist guides?<\/mark>", "b": "<span class=\"dim\">Pardonnez-moi si vous l'avez déjà évoqué, mais <\/span><mark>votre formule de base comprendrait-elle aussi des guides touristiques ?<\/mark><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q041", "bid": "QB033", "f": "<span class=\"glabel\" style=\"display:block\">How many visits are included in that price?<\/span>How many maintenance visits at home does the annual subscription of 240 euros comprise, exactly?", "b": "Combien de visites d'entretien à domicile l'abonnement annuel de 240 euros comprend-il, au juste ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q040", "bid": "QB033", "f": "<span class=\"glabel\" style=\"display:block\">How many visits are included in that price?<\/span>Does that signify that the annual package of 240 euros covers only one single visit, or does it comprise several maintenance interventions?", "b": "Cela signifie-t-il que le forfait annuel de 240 euros ne couvre qu'une seule visite, ou comprend-il plusieurs interventions d'entretien ?<span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><\/span>"}, {"id": "A:Q049", "bid": "QB034", "f": "<span class=\"glabel\" style=\"display:block\">Are there any extra costs?<\/span>Besides, I would like to know if there is a risk of there being supplementary fees.", "b": "Par ailleurs, je voudrais savoir s'il risque d'y avoir des frais supplémentaires.<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q042", "bid": "QB034", "f": "<span class=\"glabel\" style=\"display:block\">Are there any extra costs?<\/span>Would one need to plan possible fees on top of the annual subscription of 240 euros?", "b": "Faudrait-il prévoir d'éventuels frais en sus de l'abonnement annuel de 240 euros ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q043", "bid": "QB035", "f": "<span class=\"glabel\" style=\"display:block\">What kind of extra costs could come up?<\/span>And should the case arise, what types of fees could come to add themselves?", "b": "Et le cas échéant, quels types de frais pourraient venir s'ajouter ?<span class=\"tags\"><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:Q129", "bid": "QB067", "f": "<span class=\"glabel\" style=\"display:block\">Do you charge extra for that?<\/span>Would that lead to a supplement, or would it be envisageable to include it in the price that you practise?", "b": "Cela entraînerait-il un supplément, ou serait-il envisageable de l'inclure dans le prix que vous pratiquez ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q085", "bid": "QB067", "f": "<span class=\"glabel\" style=\"display:block\">Do you charge extra for that?<\/span>In case one of my animals would have an accident or would fall sick, would its taking in charge lead to a supplement?", "b": "Au cas où l'un de mes animaux aurait un accident ou tomberait malade, sa prise en charge entraînerait-elle un supplément ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q197", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>Could you specify to me how much you invoice exactly the packing and the unpacking?", "b": "Pourriez-vous me préciser combien vous facturez exactement l'emballage et le déballage ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q098", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>If we wanted to add only the travel insurance to the base formula, to how much would that come?", "b": "Si nous voulions ajouter uniquement l'assurance voyage à la formule de base, à combien cela reviendrait-il ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q108", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>And the delivery fees, to how much would they rise?", "b": "Et les frais de livraison, à combien s'élèveraient-ils ?<span class=\"tags\"><span class=\"gr\">dislocation · cond<\/span><\/span>"}, {"id": "A:Q153", "bid": "QB078", "f": "<span class=\"glabel\" style=\"display:block\">How much is the fee for that?<\/span>For what concerns the parking, can you indicate to me where we could park ourselves, and how much it would be necessary to plan?", "b": "Pour ce qui est du stationnement, pouvez-vous m'indiquer où nous pourrions nous garer, et combien il faudrait prévoir ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q004", "bid": "QB004", "f": "<span class=\"glabel\" style=\"display:block\">Do you give group discounts?<\/span>And if yes, do you propose group tariffs, reductions, that kind of thing?", "b": "Et si oui, proposez-vous des tarifs de groupe, des réductions, ce genre de choses ?"}, {"id": "A:Q044", "bid": "QB036", "f": "<span class=\"glabel\" style=\"display:block\">Do you give a discount if I refer people to you?<\/span>Would you envisage equally the possibility of according me a reduction if I recommended other clients to you?", "b": "Envisageriez-vous également la possibilité de m'accorder une réduction si je vous recommandais d'autres clients ?<span class=\"tags\"><span class=\"st\"><b>5d<\/b> Envisageriez-vous la possibilité de…<\/span><span class=\"gr\">cond · si + imparf.<\/span><\/span>"}, {"id": "A:Q179", "bid": "QB126", "f": "<span class=\"glabel\" style=\"display:block\">How do you charge for it?<\/span>How do you invoice, exactly, the picking and the harvest of the products?", "b": "Comment facturez-vous, au juste, la cueillette et la récolte des produits ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q173", "bid": "QB126", "f": "<span class=\"glabel\" style=\"display:block\">How do you charge for it?<\/span>How does the payment function: by a membership contribution, or is it necessary to buy a package of courses?", "b": "Comment le paiement fonctionne-t-il : par une cotisation d'adhésion, ou faut-il acheter un forfait de cours ?"}, {"id": "A:Q180", "bid": "QB126", "f": "<span class=\"glabel\" style=\"display:block\">How do you charge for it?<\/span>The price, does it calculate itself by weight?", "b": "Le prix se calcule-t-il au poids ?"}, {"id": "A:Q010", "bid": "QB009", "f": "<span class=\"glabel\" style=\"display:block\">When does that price start to apply?<\/span>I would like to know from when this tariff applies: from the purchase of the monthly pass, or at another moment?", "b": "J'aimerais savoir à partir de quand ce tarif s'applique : dès l'achat du pass mensuel, ou à un autre moment ?<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q140", "bid": "QB105", "f": "<span class=\"glabel\" style=\"display:block\">How much is the deposit?<\/span><mark>And, on that subject, what is the amount of the guarantee deposit?<\/mark><span class=\"dim\"> Because I imagine that it would be necessary that we pay one, could you confirm it to me?<\/span>", "b": "<mark>Et, à ce propos, quel est le montant du dépôt de garantie ?<\/mark><span class=\"dim\"> Car j'imagine qu'il faudrait que nous en versions un, pourriez-vous me le confirmer ?<\/span><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><span class=\"st\"><b>6a<\/b> Puis-je confirmer que…<\/span><span class=\"gr\">subj · cond · en/y<\/span><\/span>"}, {"id": "A:Q139", "bid": "QB105", "f": "<span class=\"glabel\" style=\"display:block\">How much is the deposit?<\/span>To how much does the deposit for the animal rise?", "b": "À combien s'élève la caution pour l'animal ?"}, {"id": "A:QN36", "bid": "QB160", "f": "<span class=\"glabel\" style=\"display:block\">How long until we get the deposit back?<\/span>And once that we will have left the premises, could you indicate to me the delay to plan for the restitution of the security deposit?", "b": "Et une fois que nous aurons quitté les lieux, pourriez-vous m'indiquer le délai à prévoir pour la restitution du dépôt de garantie ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">futur antérieur · cond<\/span><\/span>"}, {"id": "A:Q126", "bid": "QB095", "f": "<span class=\"glabel\" style=\"display:block\">Do we have to pay everything upfront?<\/span><mark>Is it necessary that we settle the totality in advance<\/mark><span class=\"dim\">, or would it be possible to proceed in two times: the half before you start to write, and the balance once the project finished?<\/span>", "b": "<mark>Faut-il que nous réglions la totalité d'avance<\/mark><span class=\"dim\">, ou serait-il possible de procéder en deux fois : la moitié avant que vous ne commenciez à écrire, et le solde une fois le projet terminé ?<\/span><span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · ne explétif · cond<\/span><\/span>"}, {"id": "A:Q203", "bid": "QB095", "f": "<span class=\"glabel\" style=\"display:block\">Do we have to pay everything upfront?<\/span><mark>Do you demand that everything be settled in advance<\/mark><span class=\"dim\">, or could we pay the half after the move?<\/span>", "b": "<mark>Exigez-vous que tout soit réglé d'avance<\/mark><span class=\"dim\">, ou pourrions-nous verser la moitié après le déménagement ?<\/span><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q205", "bid": "QB096", "f": "<span class=\"glabel\" style=\"display:block\">Can we pay in instalments?<\/span>On the other hand, would it be envisageable to stagger the payment?", "b": "D'autre part, serait-il envisageable d'échelonner le paiement ?<span class=\"tags\"><span class=\"st\"><b>9d<\/b> D'autre part, serait-il envisageable de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q127", "bid": "QB096", "f": "<span class=\"glabel\" style=\"display:block\">Can we pay in instalments?<\/span><span class=\"dim\">Is it necessary that we settle the totality in advance, or <\/span><mark>would it be possible to proceed in two times: the half before you start to write, and the balance once the project finished?<\/mark>", "b": "<span class=\"dim\">Faut-il que nous réglions la totalité d'avance, ou <\/span><mark>serait-il possible de procéder en deux fois : la moitié avant que vous ne commenciez à écrire, et le solde une fois le projet terminé ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · ne explétif · cond<\/span><\/span>"}, {"id": "A:Q204", "bid": "QB096", "f": "<span class=\"glabel\" style=\"display:block\">Can we pay in instalments?<\/span><span class=\"dim\">Do you demand that everything be settled in advance, <\/span><mark>or could we pay the half after the move?<\/mark>", "b": "<span class=\"dim\">Exigez-vous que tout soit réglé d'avance, <\/span><mark>ou pourrions-nous verser la moitié après le déménagement ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:QN05", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>What would happen if I had to cancel at the last minute?", "b": "Que se passerait-il si je devais annuler à la dernière minute ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:QN06", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>And if ever I had to cancel a class at the last moment, would it all the same be deducted from my package?", "b": "Et si jamais je devais annuler un cours au dernier moment, celui-ci serait-il tout de même décompté de mon forfait ?<span class=\"tags\"><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:QN10", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>What would happen if I missed a class?", "b": "Que se passerait-il si je manquais un cours ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:QG003", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>Would I lose the deposit paid?", "b": "Perdrais-je l'acompte versé ?"}, {"id": "A:QG005", "bid": "QB156", "f": "<span class=\"glabel\" style=\"display:block\">What happens if I cancel or miss it?<\/span>Would it be possible for me to catch it up?", "b": "Me serait-il possible de le rattraper ?"}, {"id": "A:Q163", "bid": "QB119", "f": "<span class=\"glabel\" style=\"display:block\">What interest rate do you offer?<\/span><span class=\"dim\">In that case, <\/span><mark>what interest rate do you offer?<\/mark>", "b": "<span class=\"dim\">Dans ce cas, <\/span><mark>quel taux d'intérêt offrez-vous ?<\/mark>"}, {"id": "A:Q070", "bid": "QB056", "f": "<span class=\"glabel\" style=\"display:block\">How does the pay work?<\/span>I would like also to know more on the remuneration.", "b": "J'aimerais également en savoir davantage sur la rémunération.<span class=\"tags\"><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q074", "bid": "QB059", "f": "<span class=\"glabel\" style=\"display:block\">How much do they earn in total from all those missions?<\/span>What would be his total remuneration over the whole of the missions?", "b": "Quelle serait sa rémunération totale sur l'ensemble des missions ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q075", "bid": "QB060", "f": "<span class=\"glabel\" style=\"display:block\">Are there bonuses on top of that?<\/span>Besides, are there bonuses in addition to that?", "b": "Par ailleurs, y a-t-il des primes en plus de cela ?<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><\/span>"}, {"id": "A:Q078", "bid": "QB063", "f": "<span class=\"glabel\" style=\"display:block\">If there's much more traffic than usual, do we get paid for the extra time on that mission?<\/span>In the eventuality where the traffic would be much more dense than usual, would you be in measure to compensate us for the supplementary time passed on a mission?", "b": "Dans l'éventualité où la circulation serait bien plus dense que d'habitude, seriez-vous en mesure de nous dédommager pour le temps supplémentaire passé sur une mission ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P3", "sec": "A", "code": "P3", "name": "Time", "bucket": "Questions", "items": [{"id": "A:Q002", "bid": "QB002", "f": "<span class=\"glabel\" style=\"display:block\">What are your opening hours?<\/span>Besides, I would like to know a bit more on your hours of opening.", "b": "Par ailleurs, j'aimerais en savoir un peu plus sur vos horaires d'ouverture.<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q012", "bid": "QB011", "f": "<span class=\"glabel\" style=\"display:block\">Which days of the week do you have salsa classes?<\/span>I would like to know the hour, as well as the days of the week where you propose them.", "b": "J'aimerais connaître l'horaire, ainsi que les jours de la semaine où vous les proposez.<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q011", "bid": "QB010", "f": "<span class=\"glabel\" style=\"display:block\">What time do the salsa classes start?<\/span>So, when do the salsa courses start, exactly?", "b": "Alors, quand les cours de salsa commencent-ils, exactement ?"}, {"id": "A:Q242", "bid": "QB133", "f": "<span class=\"glabel\" style=\"display:block\">Are you open all year round, or only in some months?<\/span>I would like to know if this activity is only proposed in season, or else all the year.", "b": "Je voudrais savoir si cette activité n'est proposée qu'en saison, ou bien toute l'année.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q184", "bid": "QB133", "f": "<span class=\"glabel\" style=\"display:block\">Are you open all year round, or only in some months?<\/span><mark>How many months per year is the farm open<\/mark><span class=\"dim\">, and during which months does it close its doors?<\/span>", "b": "<mark>Combien de mois par an la ferme est-elle ouverte<\/mark><span class=\"dim\">, et pendant quels mois ferme-t-elle ses portes ?<\/span>"}, {"id": "A:Q185", "bid": "QB133", "f": "<span class=\"glabel\" style=\"display:block\">Are you open all year round, or only in some months?<\/span><span class=\"dim\">How many months per year is the farm open, and <\/span><mark>during which months does it close its doors?<\/mark>", "b": "<span class=\"dim\">Combien de mois par an la ferme est-elle ouverte, et <\/span><mark>pendant quels mois ferme-t-elle ses portes ?<\/mark>"}, {"id": "A:QN13", "bid": "QB162", "f": "<span class=\"glabel\" style=\"display:block\">Why are you closed at that time?<\/span>And for what reason do you close during those months there?", "b": "Et pour quelle raison fermez-vous durant ces mois-là ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><\/span>"}, {"id": "A:QG006", "bid": "QB162", "f": "<span class=\"glabel\" style=\"display:block\">Why are you closed at that time?<\/span>Is it linked to the harvests?", "b": "Est-ce lié aux récoltes ?"}, {"id": "A:Q057", "bid": "QB045", "f": "<span class=\"glabel\" style=\"display:block\">What's the best time of day to see these sites?<\/span>At what moment of the day is it better to discover these sites?", "b": "À quel moment de la journée vaut-il mieux découvrir ces sites ?"}, {"id": "A:Q014", "bid": "QB013", "f": "<span class=\"glabel\" style=\"display:block\">Could the salsa schedule change in a few months?<\/span>Could it be that the hours of the salsa courses change in the future, from here to a few months maybe?", "b": "Se pourrait-il que les horaires des cours de salsa changent à l'avenir, d'ici quelques mois peut-être ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q015", "bid": "QB014", "f": "<span class=\"glabel\" style=\"display:block\">Do you ever add new class times?<\/span>Or does it happen to you to add new slots?", "b": "Ou vous arrive-t-il d'ajouter de nouveaux créneaux ?"}, {"id": "A:QN09", "bid": "QB014", "f": "<span class=\"glabel\" style=\"display:block\">Do you ever add new class times?<\/span>Would you envisage the possibility of opening a slot on Wednesday evening, for those who, like me, finish late?", "b": "Envisageriez-vous la possibilité d'ouvrir un créneau le mercredi soir, pour ceux qui, comme moi, finissent tard ?<span class=\"tags\"><span class=\"st\"><b>5d<\/b> Envisageriez-vous la possibilité de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q027", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>Can you indicate to me the exact duration of the workshop?", "b": "Pouvez-vous m'indiquer la durée exacte de l'atelier ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q013", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>And what is the duration of each course?", "b": "Et quelle est la durée de chaque cours ?"}, {"id": "A:Q212", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>Over what duration would the party extend itself?", "b": "Sur quelle durée la fête s'étendrait-elle ?<span class=\"tags\"><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN39", "bid": "QB012", "f": "<span class=\"glabel\" style=\"display:block\">How long does it last?<\/span>If I understand well, the workshop occupies therefore all the morning?", "b": "Si je comprends bien, l'atelier occupe donc toute la matinée ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><\/span>"}, {"id": "A:Q213", "bid": "QB143", "f": "<span class=\"glabel\" style=\"display:block\">Does the length depend on the package we choose?<\/span>And does this duration depend on the formula that we would choose?", "b": "Et cette durée dépend-elle de la formule que nous choisirions ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q221", "bid": "QB147", "f": "<span class=\"glabel\" style=\"display:block\">How long is the whole program?<\/span><span class=\"dim\">At what frequency would it be necessary to come, how many times per week, and <\/span><mark>over what duration would the whole of the programme spread out?<\/mark>", "b": "<span class=\"dim\">À quelle fréquence faudrait-il venir, combien de fois par semaine, et <\/span><mark>sur quelle durée s'étalerait l'ensemble du programme ?<\/mark><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q227", "bid": "QB147", "f": "<span class=\"glabel\" style=\"display:block\">How long is the whole program?<\/span><mark>I would like to know not only how much time one must count from the start to the end<\/mark><span class=\"dim\">, but also how many hours it would be necessary that I train per week, not only in your centre, but also on my side.<\/span>", "b": "<mark>J'aimerais savoir non seulement combien de temps il faut compter du début à la fin<\/mark><span class=\"dim\">, mais aussi combien d'heures il faudrait que je m'entraîne par semaine, pas uniquement dans votre centre, mais aussi de mon côté.<\/span><span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q174", "bid": "QB127", "f": "<span class=\"glabel\" style=\"display:block\">Does the package expire after a certain time?<\/span>The package, does it have an expiry date? Otherwise said, is there a particular condition to respect so that it stays valid, like following a certain number of courses within a given delay?", "b": "Le forfait a-t-il une date d'expiration ? Autrement dit, y a-t-il une condition particulière à respecter pour qu'il reste valable, comme suivre un certain nombre de cours dans un délai donné ?"}, {"id": "A:Q028", "bid": "QB025", "f": "<span class=\"glabel\" style=\"display:block\">Do you run it regularly, or is it a one-off?<\/span><mark>At what frequency do you organise this workshop?<\/mark><span class=\"dim\"> Or is it simply about a one-off event?<\/span>", "b": "<mark>À quelle fréquence organisez-vous cet atelier ?<\/mark><span class=\"dim\"> Ou s'agit-il simplement d'un événement ponctuel ?<\/span><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q029", "bid": "QB025", "f": "<span class=\"glabel\" style=\"display:block\">Do you run it regularly, or is it a one-off?<\/span><span class=\"dim\">At what frequency do you organise this workshop? Or <\/span><mark>is it simply about a one-off event?<\/mark>", "b": "<span class=\"dim\">À quelle fréquence organisez-vous cet atelier ? Ou <\/span><mark>s'agit-il simplement d'un événement ponctuel ?<\/mark><span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q143", "bid": "QB025", "f": "<span class=\"glabel\" style=\"display:block\">Do you run it regularly, or is it a one-off?<\/span>This event, does it hold itself each autumn, or does it only take place one year out of two, something of that kind?", "b": "Cet événement se tient-il chaque automne, ou n'a-t-il lieu qu'une année sur deux, quelque chose de ce genre ?"}, {"id": "A:Q071", "bid": "QB057", "f": "<span class=\"glabel\" style=\"display:block\">How many missions can I get per month?<\/span>And to how many missions per month can one expect?", "b": "Et à combien de missions par mois peut-on s'attendre ?"}, {"id": "A:Q073", "bid": "QB057", "f": "<span class=\"glabel\" style=\"display:block\">How many missions can I get per month?<\/span>And for an experienced mystery client, to how much would this figure rise?", "b": "Et pour un client mystère expérimenté, à combien s'élèverait ce chiffre ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN58", "bid": "QB057", "f": "<span class=\"glabel\" style=\"display:block\">How many missions can I get per month?<\/span>If I could free myself only the evening, in what measure would that affect the number of missions that one would confide to me?", "b": "Si je ne pouvais me libérer que le soir, dans quelle mesure cela affecterait-il le nombre de missions qu'on me confierait ?<span class=\"tags\"><span class=\"st\"><b>5b<\/b> Dans quelle mesure cela affecterait-il…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q072", "bid": "QB058", "f": "<span class=\"glabel\" style=\"display:block\">Is it steady once you have some experience?<\/span>I ask myself if a certain regularity installs itself once one has acquired a bit of experience.", "b": "Je me demande si une certaine régularité s'installe une fois qu'on a acquis un peu d'expérience."}, {"id": "A:Q076", "bid": "QB061", "f": "<span class=\"glabel\" style=\"display:block\">When do you expect us to do the missions?<\/span>Side availabilities, at what moments do you expect, in general, that we take missions?", "b": "Côté disponibilités, à quels moments vous attendez-vous, en général, à ce que nous prenions des missions ?<span class=\"tags\"><span class=\"gr\">subj · idiome<\/span><\/span>"}, {"id": "A:Q220", "bid": "QB125", "f": "<span class=\"glabel\" style=\"display:block\">How many times a week do I need to come?<\/span><mark>At what frequency would it be necessary to come, how many times per week<\/mark><span class=\"dim\">, and over what duration would the whole of the programme spread out?<\/span>", "b": "<mark>À quelle fréquence faudrait-il venir, combien de fois par semaine<\/mark><span class=\"dim\">, et sur quelle durée s'étalerait l'ensemble du programme ?<\/span>
