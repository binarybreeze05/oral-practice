<span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q172", "bid": "QB125", "f": "<span class=\"glabel\" style=\"display:block\">How many times a week do I need to come?<\/span>How many courses per week is it necessary to follow, in general? Or rather, how many would you advise us to follow?", "b": "Combien de cours par semaine faut-il suivre, en général ? Ou plutôt, combien nous conseilleriez-vous d'en suivre ?<span class=\"tags\"><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:Q228", "bid": "QB125", "f": "<span class=\"glabel\" style=\"display:block\">How many times a week do I need to come?<\/span><span class=\"dim\">I would like to know not only how much time one must count from the start to the end, <\/span><mark>but also how many hours it would be necessary that I train per week, not only in your centre, but also on my side.<\/mark>", "b": "<span class=\"dim\">J'aimerais savoir non seulement combien de temps il faut compter du début à la fin, <\/span><mark>mais aussi combien d'heures il faudrait que je m'entraîne par semaine, pas uniquement dans votre centre, mais aussi de mon côté.<\/mark><span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q060", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>How much time in advance must one reserve, in general?", "b": "Combien de temps à l'avance faut-il réserver, en général ?"}, {"id": "A:Q116", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>Could you indicate to me the delay to plan for placing an order?", "b": "Pourriez-vous m'indiquer le délai à prévoir pour passer commande ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q117", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span><span class=\"dim\">I imagine that that depends on the product, in which case <\/span><mark>I would like to know the delays proper to each option.<\/mark>", "b": "<span class=\"dim\">J'imagine que cela dépend du produit, auquel cas <\/span><mark>j'aimerais connaître les délais propres à chaque option.<\/mark><span class=\"tags\"><span class=\"gr\">cond · dont/auquel<\/span><\/span>"}, {"id": "A:Q165", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>And these appointments, how much time in advance is it necessary to reserve them?", "b": "Et ces rendez-vous, combien de temps à l'avance faut-il les réserver ?<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:Q239", "bid": "QB048", "f": "<span class=\"glabel\" style=\"display:block\">How far in advance do we need to book?<\/span>And if such is the case, with how much advance would it be necessary to go about it?", "b": "Et si tel est le cas, avec combien d'avance faudrait-il s'y prendre ?<span class=\"tags\"><span class=\"gr\">cond · idiome · en/y<\/span><\/span>"}, {"id": "A:Q030", "bid": "QB026", "f": "<span class=\"glabel\" style=\"display:block\">Do you have any spots left for next Saturday?<\/span>Would you still have places available for a workshop next Saturday, by chance?", "b": "Auriez-vous encore des places disponibles pour un atelier samedi prochain, par hasard ?<span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q107", "bid": "QB083", "f": "<span class=\"glabel\" style=\"display:block\">Would a delivery on July seventh at seven AM work for you?<\/span>It would be for the seventh of July, towards seven o'clock in the morning. Would that suit you?", "b": "Ce serait pour le sept juillet, vers sept heures du matin. Cela vous conviendrait-il ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q238", "bid": "QB155", "f": "<span class=\"glabel\" style=\"display:block\">Do tickets sell out fast?<\/span><span class=\"dim\">You say in the ad that it is advised to reserve rapidly, <\/span><mark>I was wondering therefore if the places had a tendency to leave very fast.<\/mark>", "b": "<span class=\"dim\">Vous dites dans l'annonce qu'il est conseillé de réserver rapidement, <\/span><mark>je me demandais donc si les places avaient tendance à partir très vite.<\/mark>"}, {"id": "A:Q050", "bid": "QB040", "f": "<span class=\"glabel\" style=\"display:block\">How long does delivery take after I order?<\/span>Could you indicate to me the delivery delay to plan once the order is placed? On average, how much time must one count?", "b": "Pourriez-vous m'indiquer le délai de livraison à prévoir une fois la commande passée ? En moyenne, combien de temps faut-il compter ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN12", "bid": "QB040", "f": "<span class=\"glabel\" style=\"display:block\">How long does delivery take after I order?<\/span>And what delay would it be necessary to plan between the order and the delivery of the song?", "b": "Et quel délai faudrait-il prévoir entre la commande et la livraison de la chanson ?<span class=\"tags\"><span class=\"st\"><b>10b<\/b> Le délai à prévoir<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P4", "sec": "A", "code": "P4", "name": "Place & access", "bucket": "Questions", "items": [{"id": "A:Q170", "bid": "QB123", "f": "<span class=\"glabel\" style=\"display:block\">Where exactly are you located?<\/span>If that doesn't bother you, would you have the amiability to communicate to me the exact address of the workshop?", "b": "Si cela ne vous dérange pas, auriez-vous l'amabilité de me communiquer l'adresse exacte de l'atelier ?<span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:Q168", "bid": "QB123", "f": "<span class=\"glabel\" style=\"display:block\">Where exactly are you located?<\/span>Where do they unfold, exactly?", "b": "Où se déroulent-ils, exactement ?"}, {"id": "A:Q232", "bid": "QB123", "f": "<span class=\"glabel\" style=\"display:block\">Where exactly are you located?<\/span>Would you know how to remind me where you are located?", "b": "Sauriez-vous me rappeler où vous vous trouvez ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q169", "bid": "QB124", "f": "<span class=\"glabel\" style=\"display:block\">Do you have just one location, or several branches?<\/span>Your workshop, does it only have at its disposal one single premises, or do you have several establishments?", "b": "Votre atelier ne dispose-t-il que d'un seul local, ou avez-vous plusieurs établissements ?"}, {"id": "A:QN14", "bid": "QB163", "f": "<span class=\"glabel\" style=\"display:block\">Are your locations different from each other?<\/span>And if you have several establishments, is there a notable difference between them in matter of equipment?", "b": "Et si vous avez plusieurs établissements, y a-t-il une différence notable entre eux en matière d'équipement ?<span class=\"tags\"><span class=\"st\"><b>7c<\/b> Y a-t-il une différence notable entre…<\/span><\/span>"}, {"id": "A:Q024", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span>And can you indicate to me how to get there, exactly?", "b": "Et pouvez-vous m'indiquer comment s'y rendre, exactement ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q192", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span><mark>Do you know if the farm is served by a bus<\/mark><span class=\"dim\">, or must one imperatively come by car?<\/span>", "b": "<mark>Savez-vous si la ferme est desservie par un bus<\/mark><span class=\"dim\">, ou faut-il impérativement venir en voiture ?<\/span><span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><\/span>"}, {"id": "A:Q193", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span><span class=\"dim\">Do you know if the farm is served by a bus, or <\/span><mark>must one imperatively come by car?<\/mark>", "b": "<span class=\"dim\">Savez-vous si la ferme est desservie par un bus, ou <\/span><mark>faut-il impérativement venir en voiture ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><\/span>"}, {"id": "A:QN41", "bid": "QB022", "f": "<span class=\"glabel\" style=\"display:block\">How do we get there? By public transport, or do we have to drive?<\/span>Does that signify that it would be imperatively necessary that we have a car?", "b": "Cela signifie-t-il qu'il faudrait impérativement que nous ayons une voiture ?<span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN44", "bid": "QB164", "f": "<span class=\"glabel\" style=\"display:block\">How often do the buses come?<\/span>At what frequency pass the buses that serve the farm?", "b": "À quelle fréquence passent les bus qui desservent la ferme ?<span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q142", "bid": "QB106", "f": "<span class=\"glabel\" style=\"display:block\">What's the nearest train station?<\/span>And the closest station to the apartment, which one is it?", "b": "Et la gare la plus proche de l'appartement, laquelle est-ce ?<span class=\"tags\"><span class=\"gr\">dislocation<\/span><\/span>"}, {"id": "A:Q194", "bid": "QB140", "f": "<span class=\"glabel\" style=\"display:block\">What is the road there like?<\/span>In what state is the road that leads to the farm?", "b": "Dans quel état se trouve la route qui mène à la ferme ?"}, {"id": "A:Q195", "bid": "QB140", "f": "<span class=\"glabel\" style=\"display:block\">What is the road there like?<\/span>I ask myself if it's not too damaged, with potholes, mud, that kind of thing.", "b": "Je me demande si elle n'est pas trop abîmée, avec des nids-de-poule, de la boue, ce genre de choses."}, {"id": "A:Q152", "bid": "QB113", "f": "<span class=\"glabel\" style=\"display:block\">Where can we park?<\/span><span class=\"dim\">For what concerns the parking, <\/span><mark>can you indicate to me where we could park ourselves<\/mark><span class=\"dim\">, and how much it would be necessary to plan?<\/span>", "b": "<span class=\"dim\">Pour ce qui est du stationnement, <\/span><mark>pouvez-vous m'indiquer où nous pourrions nous garer<\/mark><span class=\"dim\">, et combien il faudrait prévoir ?<\/span><span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN45", "bid": "QB165", "f": "<span class=\"glabel\" style=\"display:block\">Can we reserve a parking spot in advance?<\/span>On the other hand, would it be envisageable to reserve a parking place in advance?", "b": "D'autre part, serait-il envisageable de réserver une place de parking à l'avance ?<span class=\"tags\"><span class=\"st\"><b>9d<\/b> D'autre part, serait-il envisageable de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q046", "bid": "QB038", "f": "<span class=\"glabel\" style=\"display:block\">How far do you deliver?<\/span>Up to where do you deliver, exactly?", "b": "Jusqu'où livrez-vous, au juste ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QG001", "bid": "QB038", "f": "<span class=\"glabel\" style=\"display:block\">How far do you deliver?<\/span>Is there a distance limit for the delivery?", "b": "Y a-t-il une limite de distance pour la livraison ?"}, {"id": "A:QN16", "bid": "QB166", "f": "<span class=\"glabel\" style=\"display:block\">Could you deliver further if I paid extra?<\/span>Would you envisage the possibility of delivering a little beyond your usual zone, even if it means that I pay a supplement?", "b": "Envisageriez-vous la possibilité de livrer un peu au-delà de votre zone habituelle, quitte à ce que je paie un supplément ?<span class=\"tags\"><span class=\"st\"><b>5d<\/b> Envisageriez-vous la possibilité de…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q135", "bid": "QB102", "f": "<span class=\"glabel\" style=\"display:block\">Can you see the mountains from there?<\/span>I would like therefore to know if one sees the mountains, and also the sea front.", "b": "J'aimerais donc savoir si l'on voit les montagnes, et aussi le front de mer.<span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q134", "bid": "QB102", "f": "<span class=\"glabel\" style=\"display:block\">Can you see the mountains from there?<\/span><mark>I would like therefore to know if one sees the mountains<\/mark><span class=\"dim\">, and also the sea front.<\/span>", "b": "<mark>J'aimerais donc savoir si l'on voit les montagnes<\/mark><span class=\"dim\">, et aussi le front de mer.<\/span><span class=\"tags\"><span class=\"st\"><b>2a<\/b> Je voudrais savoir si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN43", "bid": "QB102", "f": "<span class=\"glabel\" style=\"display:block\">Can you see the mountains from there?<\/span>Could you confirm to me that the apartment gives well onto the seafront, and not onto the courtyard?", "b": "Pourriez-vous me confirmer que l'appartement donne bien sur le front de mer, et non sur la cour ?"}]}, {"key": "A-P5", "sec": "A", "code": "P5", "name": "Safety & risk", "bucket": "Questions", "items": [{"id": "A:Q001", "bid": "QB001", "f": "<span class=\"glabel\" style=\"display:block\">How safe is it?<\/span>So evidently, what preoccupies me before all, it's the security.", "b": "Alors évidemment, ce qui me préoccupe avant tout, c'est la sécurité.<span class=\"tags\"><span class=\"gr\">mise en relief<\/span><\/span>"}, {"id": "A:Q234", "bid": "QB152", "f": "<span class=\"glabel\" style=\"display:block\">What safety procedures do you follow?<\/span>Could you describe to me precisely the security procedures that you follow?", "b": "Pourriez-vous me décrire précisément les procédures de sécurité que vous suivez ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q218", "bid": "QB145", "f": "<span class=\"glabel\" style=\"display:block\">How likely is something like that to happen?<\/span>Could you tell me in what measure this kind of scenario risks to happen?", "b": "Pourriez-vous me dire dans quelle mesure ce genre de scénario risque de se produire ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN17", "bid": "QB167", "f": "<span class=\"glabel\" style=\"display:block\">What should I do if that happens?<\/span>In case the horse would bolt while I am in the saddle, what should I do?", "b": "Au cas où le cheval s'emballerait alors que je suis en selle, que devrais-je faire ?<span class=\"tags\"><span class=\"st\"><b>5c<\/b> Au cas où…, que devrais-je faire ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN15", "bid": "QB167", "f": "<span class=\"glabel\" style=\"display:block\">What should I do if that happens?<\/span>In case the road would become impracticable because of the rain, what should we do?", "b": "Au cas où la route deviendrait impraticable à cause de la pluie, que devrions-nous faire ?<span class=\"tags\"><span class=\"st\"><b>5c<\/b> Au cas où…, que devrais-je faire ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN29", "bid": "QB167", "f": "<span class=\"glabel\" style=\"display:block\">What should I do if that happens?<\/span>In case the delivery man wouldn't manage to reach my friend, what should I do?", "b": "Au cas où le livreur n'arriverait pas à joindre mon amie, que devrais-je faire ?<span class=\"tags\"><span class=\"st\"><b>5c<\/b> Au cas où…, que devrais-je faire ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN48", "bid": "QB168", "f": "<span class=\"glabel\" style=\"display:block\">Why are accidents so rare?<\/span>How do you explain that this kind of accident is so rare?", "b": "Comment expliquez-vous que ce genre d'accident soit aussi rare ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q233", "bid": "QB146", "f": "<span class=\"glabel\" style=\"display:block\">Has that ever happened at your centre?<\/span><span class=\"dim\">Permit me to pose you the question without detour: <\/span><mark>have there already been accidents in your centre since its creation?<\/mark>", "b": "<span class=\"dim\">Permettez-moi de vous poser la question sans détour : <\/span><mark>y a-t-il déjà eu des accidents dans votre centre depuis sa création ?<\/mark><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q219", "bid": "QB146", "f": "<span class=\"glabel\" style=\"display:block\">Has that ever happened at your centre?<\/span>Has this kind of incident already happened in your centre?", "b": "Ce genre d'incident s'est-il déjà produit dans votre centre ?"}, {"id": "A:QN47", "bid": "QB146", "f": "<span class=\"glabel\" style=\"display:block\">Has that ever happened at your centre?<\/span>If I understand well, you want to say that there has never been the least accident since the opening?", "b": "Si je comprends bien, vous voulez dire qu'il n'y a jamais eu le moindre accident depuis l'ouverture ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><\/span>"}, {"id": "A:Q062", "bid": "QB050", "f": "<span class=\"glabel\" style=\"display:block\">Do you have lifeguards?<\/span><span class=\"dim\">I don't doubt that you furnish life jackets, but <\/span><mark>in case we would need to be rescued, do you propose a medical assistance, first aid and a rescue service?<\/mark>", "b": "<span class=\"dim\">Je ne doute pas que vous fournissiez des gilets de sauvetage, mais <\/span><mark>au cas où nous aurions besoin d'être secourus, proposez-vous une assistance médicale, des premiers secours et un service de sauvetage ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q131", "bid": "QB099", "f": "<span class=\"glabel\" style=\"display:block\">Are the foundations strong and earthquake-proof?<\/span><span class=\"dim\">What worries me with an apartment on the last floor, it's the risk of earthquake: <\/span><mark>I would want to assure myself that the foundations of the building are sufficiently solid and conform to the anti-seismic norms.<\/mark>", "b": "<span class=\"dim\">Ce qui m'inquiète avec un appartement au dernier étage, c'est le risque de tremblement de terre : <\/span><mark>je voudrais m'assurer que les fondations de l'immeuble sont suffisamment solides et conformes aux normes antisismiques.<\/mark><span class=\"tags\"><span class=\"gr\">mise en relief · cond<\/span><\/span>"}, {"id": "A:QN49", "bid": "QB099", "f": "<span class=\"glabel\" style=\"display:block\">Are the foundations strong and earthquake-proof?<\/span>In what does this building differ from the more recent constructions in matter of anti-seismic norms?", "b": "En quoi cet immeuble diffère-t-il des constructions plus récentes en matière de normes antisismiques ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:Q133", "bid": "QB101", "f": "<span class=\"glabel\" style=\"display:block\">Is the fire escape up to standard?<\/span>The emergency staircase, is it well up to the norms?", "b": "L'escalier de secours est-il bien aux normes ?"}, {"id": "A:QN50", "bid": "QB169", "f": "<span class=\"glabel\" style=\"display:block\">How often is the safety equipment checked?<\/span>At what frequency is the fire security equipment controlled?", "b": "À quelle fréquence les équipements de sécurité incendie sont-ils contrôlés ?<span class=\"tags\"><span class=\"st\"><b>8b<\/b> À quelle fréquence…<\/span><\/span>"}, {"id": "A:Q132", "bid": "QB100", "f": "<span class=\"glabel\" style=\"display:block\">When was the building built?<\/span>Do you know in what year the building was constructed, exactly?", "b": "Savez-vous en quelle année l'immeuble a été construit, exactement ?<span class=\"tags\"><span class=\"st\"><b>1e<\/b> Savez-vous si…<\/span><\/span>"}, {"id": "A:Q237", "bid": "QB154", "f": "<span class=\"glabel\" style=\"display:block\">Is the lake deep enough to survive a fall if we wear a life vest?<\/span>I touch wood so that it never happens, but in case something horrible would occur, is the lake sufficiently deep so that one gets out of it, on condition of wearing a life jacket?", "b": "Je touche du bois pour que ça n'arrive jamais, mais au cas où il se produirait quelque chose d'horrible, le lac est-il suffisamment profond pour que l'on s'en sorte, à condition de porter un gilet de sauvetage ?<span class=\"tags\"><span class=\"gr\">idiome · subj · cond · en/y<\/span><\/span>"}, {"id": "A:Q187", "bid": "QB135", "f": "<span class=\"glabel\" style=\"display:block\">Are there bees and wasps around?<\/span>Are there a lot of critters of this kind at your place?", "b": "Y a-t-il beaucoup de bestioles de ce genre chez vous ?"}, {"id": "A:Q188", "bid": "QB136", "f": "<span class=\"glabel\" style=\"display:block\">Is there any shade on the farm?<\/span><mark>Would you have some corners in the shade at the farm?<\/mark><span class=\"dim\"> And would you advise us to bring hats?<\/span>", "b": "<mark>Auriez-vous des coins à l'ombre à la ferme ?<\/mark><span class=\"dim\"> Et nous conseilleriez-vous d'apporter des chapeaux ?<\/span><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q183", "bid": "QB132", "f": "<span class=\"glabel\" style=\"display:block\">Do you use pesticides or other chemicals on your crops?<\/span>Would you know how to indicate to me if you use pesticides or other chemical products for your crops?", "b": "Sauriez-vous m'indiquer si vous utilisez des pesticides ou d'autres produits chimiques pour vos cultures ?<span class=\"tags\"><span class=\"st\"><b>2d<\/b> Sauriez-vous m'indiquer si…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q035", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>I would like equally to know what you have planned in case of rain.", "b": "J'aimerais également savoir ce que vous avez prévu en cas de pluie.<span class=\"tags\"><span class=\"st\"><b>2c<\/b> J'aimerais savoir comment / quand…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN18", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>What would happen if the weather degraded during the festival?", "b": "Que se passerait-il si la météo se dégradait pendant le festival ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q036", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>What have you planned, as much during the concerts as the night, when we will camp?", "b": "Qu'avez-vous prévu, aussi bien pendant les concerts que la nuit, lorsque nous camperons ?"}, {"id": "A:QG007", "bid": "QB029", "f": "<span class=\"glabel\" style=\"display:block\">What's your plan if it rains?<\/span>Would the concerts be maintained?", "b": "Les concerts seraient-ils maintenus ?"}, {"id": "A:Q059", "bid": "QB047", "f": "<span class=\"glabel\" style=\"display:block\">Is there somewhere on the boat to shelter from the rain?<\/span>Would there be a place on the boat where one can shelter in case of rain?", "b": "Y aurait-il un endroit sur le bateau où l'on puisse s'abriter en cas de pluie ?<span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q235", "bid": "QB049", "f": "<span class=\"glabel\" style=\"display:block\">Is there medical help on site if something happens?<\/span><span class=\"dim\">That said, what is it of the medical assistance? <\/span><mark>In case something would happen, would a medical team be present on site?<\/mark>", "b": "<span class=\"dim\">Cela dit, qu'en est-il de l'assistance médicale ? <\/span><mark>Au cas où il arriverait quelque chose, une équipe médicale serait-elle présente sur place ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q086", "bid": "QB068", "f": "<span class=\"glabel\" style=\"display:block\">What kind of care do you provide if that happens?<\/span>And in that case there, what type of taking in charge would you be in measure to ensure?", "b": "Et dans ce cas-là, quel type de prise en charge seriez-vous en mesure d'assurer ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q199", "bid": "QB069", "f": "<span class=\"glabel\" style=\"display:block\">Are you insured if your staff damage something?<\/span>Do you have at your disposal an insurance in case your team would damage certain of my things during the move?", "b": "Disposez-vous d'une assurance au cas où votre équipe endommagerait certaines de mes affaires pendant le déménagement ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q087", "bid": "QB069", "f": "<span class=\"glabel\" style=\"display:block\">Are you insured if your staff damage something?<\/span><mark>In the hypothesis where something would happen to one of my animals and where your personnel would be in the wrong, do you propose an insurance<\/mark><span class=\"dim\"> or a reimbursement policy?<\/span>", "b": "<mark>Dans l'hypothèse où il arriverait quelque chose à l'un de mes animaux et où votre personnel serait en tort, proposez-vous une assurance<\/mark><span class=\"dim\"> ou une politique de remboursement ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q088", "bid": "QB070", "f": "<span class=\"glabel\" style=\"display:block\">Do you have a refund policy?<\/span><span class=\"dim\">In the hypothesis where something would happen to one of my animals and where your personnel would be in the wrong, <\/span><mark>do you propose an insurance or a reimbursement policy?<\/mark>", "b": "<span class=\"dim\">Dans l'hypothèse où il arriverait quelque chose à l'un de mes animaux et où votre personnel serait en tort, <\/span><mark>proposez-vous une assurance ou une politique de remboursement ?<\/mark><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q166", "bid": "QB121", "f": "<span class=\"glabel\" style=\"display:block\">If we need to lock our credit card right away because of theft, what insurance do you offer?<\/span>And in case we should have to put an opposition on our card in urgency, following a theft, what type of insurance would you propose to us?", "b": "Et au cas où nous devrions faire opposition sur notre carte en urgence, suite à un vol, quel type d'assurance nous proposeriez-vous ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q167", "bid": "QB122", "f": "<span class=\"glabel\" style=\"display:block\">Do you offer chargebacks?<\/span>On the other hand, would it be envisageable to obtain a reimbursement in case of contested payment?", "b": "D'autre part, serait-il envisageable d'obtenir un remboursement en cas de paiement contesté ?<span class=\"tags\"><span class=\"st\"><b>9d<\/b> D'autre part, serait-il envisageable de…<\/span><span class=\"gr\">cond<\/span><\/span>"}]}, {"key": "A-P6", "sec": "A", "code": "P6", "name": "Trust", "bucket": "Questions", "items": [{"id": "A:Q083", "bid": "QB065", "f": "<span class=\"glabel\" style=\"display:block\">How long have you been in business?<\/span><span class=\"dim\">I'm going to be frank with you: <\/span><mark>since how long do you exercise this trade<\/mark><span class=\"dim\">, and are you recognised in the domain?<\/span>", "b": "<span class=\"dim\">Je vais être franc avec vous : <\/span><mark>depuis combien de temps exercez-vous ce métier<\/mark><span class=\"dim\">, et êtes-vous reconnus dans le domaine ?<\/span><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q158", "bid": "QB065", "f": "<span class=\"glabel\" style=\"display:block\">How long have you been in business?<\/span><span class=\"dim\">On the other hand, <\/span><mark>it would help me that you tell me since how many years you are in activity.<\/mark>", "b": "<span class=\"dim\">En revanche, <\/span><mark>cela m'aiderait que vous me disiez depuis combien d'années vous êtes en activité.<\/mark><span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN52", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span>Could you tell me in what measure your clients are satisfied?", "b": "Pourriez-vous me dire dans quelle mesure vos clients sont satisfaits ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q084", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span><span class=\"dim\">I'm going to be frank with you: since how long do you exercise this trade, and <\/span><mark>are you recognised in the domain?<\/mark>", "b": "<span class=\"dim\">Je vais être franc avec vous : depuis combien de temps exercez-vous ce métier, et <\/span><mark>êtes-vous reconnus dans le domaine ?<\/mark><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QN55", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span>In what proportion do your clients come back towards you?", "b": "Dans quelle proportion vos clients reviennent-ils vers vous ?<span class=\"tags\"><span class=\"st\"><b>8a<\/b> Dans quelle proportion…<\/span><\/span>"}, {"id": "A:QG009", "bid": "QB066", "f": "<span class=\"glabel\" style=\"display:block\">What's your reputation like?<\/span>Do you have reviews that I could consult?", "b": "Avez-vous des avis que je puisse consulter ?"}, {"id": "A:Q156", "bid": "QB114", "f": "<span class=\"glabel\" style=\"display:block\">Which bank backs you?<\/span>And onto which big banking group are you backed, precisely?", "b": "Et à quel grand groupe bancaire êtes-vous adossés, précisément ?"}, {"id": "A:Q155", "bid": "QB114", "f": "<span class=\"glabel\" style=\"display:block\">Which bank backs you?<\/span>Are you backed onto one of the big banks?", "b": "Êtes-vous adossés à l'une des grandes banques ?"}, {"id": "A:QN53", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>What would happen if your bank went bankrupt?", "b": "Que se passerait-il si votre banque faisait faillite ?<span class=\"tags\"><span class=\"st\"><b>5a<\/b> Que se passerait-il si…<\/span><span class=\"gr\">si + imparf. · cond<\/span><\/span>"}, {"id": "A:Q157", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>Besides, which national system of guarantee of deposits do you come under?", "b": "Par ailleurs, de quel système national de garantie des dépôts relevez-vous ?<span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><\/span>"}, {"id": "A:QN54", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>In what does your deposit guarantee differ from the one of a traditional bank?", "b": "En quoi votre garantie des dépôts diffère-t-elle de celle d'une banque traditionnelle ?<span class=\"tags\"><span class=\"st\"><b>7a<\/b> En quoi… diffère-t-il de…<\/span><\/span>"}, {"id": "A:QG010", "bid": "QB115", "f": "<span class=\"glabel\" style=\"display:block\">How is my money protected?<\/span>Would my money be protected?", "b": "Mon argent serait-il protégé ?"}, {"id": "A:Q160", "bid": "QB117", "f": "<span class=\"glabel\" style=\"display:block\">What's the catch?<\/span><mark>Where is the trap, then?<\/mark><span class=\"dim\"> That appears to me too beautiful to be true, don't you find?<\/span>", "b": "<mark>Où est le piège, alors ?<\/mark><span class=\"dim\"> Ça me paraît trop beau pour être vrai, vous ne trouvez pas ?<\/span><span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QN20", "bid": "QB117", "f": "<span class=\"glabel\" style=\"display:block\">What's the catch?<\/span>How do you explain that your fees are to this point inferior to those of the traditional banks?", "b": "Comment expliquez-vous que vos frais soient à ce point inférieurs à ceux des banques traditionnelles ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q202", "bid": "QB079", "f": "<span class=\"glabel\" style=\"display:block\">Is there any fine print I should know about?<\/span>Is there a particular condition to fulfil that you wouldn't have yet spoken of?", "b": "Y a-t-il une condition particulière à remplir dont vous n'auriez pas encore parlé ?<span class=\"tags\"><span class=\"st\"><b>6c<\/b> Y a-t-il une condition particulière…<\/span><span class=\"gr\">dont/auquel · cond<\/span><\/span>"}, {"id": "A:Q099", "bid": "QB079", "f": "<span class=\"glabel\" style=\"display:block\">Is there any fine print I should know about?<\/span><span class=\"dim\">I prefer to pose you the question directly: <\/span><mark>could you specify me the clauses in small characters of the insurance that you propose?<\/mark>", "b": "<span class=\"dim\">Je préfère vous poser la question directement : <\/span><mark>pourriez-vous me préciser les clauses en petits caractères de l'assurance que vous proposez ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q201", "bid": "QB079", "f": "<span class=\"glabel\" style=\"display:block\">Is there any fine print I should know about?<\/span>That said, what is it of the possible clauses in small characters of this insurance?", "b": "Cela dit, qu'en est-il des éventuelles clauses en petits caractères de cette assurance ?<span class=\"tags\"><span class=\"st\"><b>9b<\/b> Cela dit, qu'en est-il de…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q065", "bid": "QB053", "f": "<span class=\"glabel\" style=\"display:block\">What do you do with the evaluation?<\/span>My question bears rather on what you count on doing with this evaluation.", "b": "Ma question porte plutôt sur ce que vous comptez faire de cette évaluation."}, {"id": "A:Q068", "bid": "QB054", "f": "<span class=\"glabel\" style=\"display:block\">Is it posted online, or just for internal use?<\/span><mark>Does that signify that the evaluations are published online<\/mark><span class=\"dim\">, or do they serve only to feed your internal knowledge base, to better know your competitors?<\/span>", "b": "<mark>Cela signifie-t-il que les évaluations sont publiées en ligne<\/mark><span class=\"dim\">, ou servent-elles uniquement à alimenter votre base de connaissances interne, pour mieux connaître vos concurrents ?<\/span><span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><\/span>"}, {"id": "A:Q066", "bid": "QB054", "f": "<span class=\"glabel\" style=\"display:block\">Is it posted online, or just for internal use?<\/span>Are you going to publish it online?", "b": "Allez-vous la publier en ligne ?"}, {"id": "A:Q069", "bid": "QB054", "f": "<span class=\"glabel\" style=\"display:block\">Is it posted online, or just for internal use?<\/span><span class=\"dim\">Does that signify that the evaluations are published online, <\/span><mark>or do they serve only to feed your internal knowledge base, to better know your competitors?<\/mark>", "b": "<span class=\"dim\">Cela signifie-t-il que les évaluations sont publiées en ligne, <\/span><mark>ou servent-elles uniquement à alimenter votre base de connaissances interne, pour mieux connaître vos concurrents ?<\/mark><span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><\/span>"}, {"id": "A:Q067", "bid": "QB055", "f": "<span class=\"glabel\" style=\"display:block\">Is our name on it?<\/span>Will our name figure in it?", "b": "Notre nom y figurera-t-il ?<span class=\"tags\"><span class=\"gr\">en/y<\/span><\/span>"}]}, {"key": "A-P9", "sec": "A", "code": "P9", "name": "Process & logistics", "bucket": "Questions", "items": [{"id": "A:Q064", "bid": "QB052", "f": "<span class=\"glabel\" style=\"display:block\">What happens after we buy the service?<\/span>I believe I understand that roughly, we will buy the services of other people, but then, how do things go?", "b": "Je crois comprendre qu'en gros, nous achèterons les services d'autres personnes, mais ensuite, comment les choses se passent-elles ?"}, {"id": "A:Q128", "bid": "QB097", "f": "<span class=\"glabel\" style=\"display:block\">What songwriting techniques do you use?<\/span>What writing techniques do you use for your songs?", "b": "Quelles techniques d'écriture utilisez-vous pour vos chansons ?"}, {"id": "A:Q119", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span>If I understand well, you want to say that you have one for a simpler production, and another for a richer instrumentation?", "b": "Si je comprends bien, vous voulez dire que vous en avez une pour une production plus simple, et une autre pour une instrumentation plus riche ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><span class=\"gr\">en/y<\/span><\/span>"}, {"id": "A:Q141", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span>Before the first month, it would be necessary therefore that we settle the first rent, as well as the guarantee deposit and the deposit for the animal. Could you confirm to me that it's well the case, or does something escape me?", "b": "Avant le premier mois, il faudrait donc que nous réglions le premier loyer, ainsi que le dépôt de garantie et la caution pour l'animal. Pourriez-vous me confirmer que c'est bien le cas, ou quelque chose m'échappe-t-il ?<span class=\"tags\"><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q198", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span>If I follow you well, you would come first to Paris to help me do the boxes, I would take next my flight for Barcelona, and you would wait for me there with my things. Is it thus that things happen, in general?", "b": "Si je vous suis bien, vous viendriez d'abord à Paris pour m'aider à faire les cartons, je prendrais ensuite mon vol pour Barcelone, et vous m'y attendriez avec mes affaires. Est-ce ainsi que les choses se passent, en général ?<span class=\"tags\"><span class=\"st\"><b>3d<\/b> Si je comprends bien…<\/span><span class=\"gr\">cond · en/y<\/span><\/span>"}, {"id": "A:QG002", "bid": "QB090", "f": "<span class=\"glabel\" style=\"display:block\">So just to confirm, it works like this, is that right?<\/span><span class=\"dim\">It is indicated in the ad that one must dial this number: <\/span><mark>does that want to say that the reservation by telephone is obligatory?<\/mark>", "b": "<span class=\"dim\">Il est indiqué dans l'annonce qu'il faut composer ce numéro : <\/span><mark>cela veut-il dire que la réservation par téléphone est obligatoire ?<\/mark>"}, {"id": "A:Q130", "bid": "QB098", "f": "<span class=\"glabel\" style=\"display:block\">What is the next step?<\/span>What would be the next step to give follow-up to this project?", "b": "Quelle serait la prochaine étape pour donner suite à ce projet ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN30", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What documents should I plan to finalise my inscription?", "b": "Quels documents devrais-je prévoir pour finaliser mon inscription ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN31", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What steps would it be necessary that I undertake to submit my candidacy?", "b": "Quelles démarches faudrait-il que j'entreprenne pour déposer ma candidature ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN32", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>And to constitute the rental file, what supporting documents would it be necessary that I furnish?", "b": "Et pour constituer le dossier de location, quelles pièces justificatives faudrait-il que je fournisse ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:QN38", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What steps would it be necessary to plan to reserve the room of our choice?", "b": "Quelles démarches faudrait-il prévoir pour réserver la salle de notre choix ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN56", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What documents should I plan to make the insurance play, if the case arises?", "b": "Quels documents devrais-je prévoir pour faire jouer l'assurance, le cas échéant ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond · idiome<\/span><\/span>"}, {"id": "A:QN61", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>What documents would it be necessary to foresee for the children: a piece of identity, a proof of age?", "b": "Quels documents faudrait-il prévoir pour les enfants : une pièce d'identité, un justificatif d'âge ?<span class=\"tags\"><span class=\"st\"><b>10a<\/b> Quels documents / démarches dois-je prévoir ?<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN60", "bid": "QB157", "f": "<span class=\"glabel\" style=\"display:block\">What documents or steps do I need?<\/span>On that subject, is it necessary that I furnish you the vaccination booklet of our animal?", "b": "À ce propos, faut-il que je vous fournisse le carnet de vaccination de notre animal ?<span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:QN33", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>Would you have an e-mail address or a direct contact for any complementary question?", "b": "Auriez-vous une adresse e-mail ou un contact direct pour toute question complémentaire ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN34", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>During my absence, would there be a number at which I could reach you, in case I would have the least question?", "b": "Pendant mon absence, y aurait-il un numéro auquel je pourrais vous joindre, au cas où j'aurais la moindre question ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond · dont/auquel<\/span><\/span>"}, {"id": "A:QN35", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>The day of the move, to whom should I address myself in case of worry?", "b": "Le jour du déménagement, à qui devrais-je m'adresser en cas de souci ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN46", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>Would you have a contact on site, in case I wouldn't find the entrance of the centre?", "b": "Auriez-vous un contact sur place, au cas où je ne trouverais pas l'entrée du centre ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:QN51", "bid": "QB158", "f": "<span class=\"glabel\" style=\"display:block\">Who can I contact if I have questions or a problem?<\/span>Would you have an emergency number to communicate to me, so that my close ones can reach the team the day of the jump?", "b": "Auriez-vous un numéro d'urgence à me communiquer, pour que mes proches puissent joindre l'équipe le jour du saut ?<span class=\"tags\"><span class=\"st\"><b>10c<\/b> Auriez-vous un contact…<\/span><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q164", "bid": "QB120", "f": "<span class=\"glabel\" style=\"display:block\">Do we book by phone or online?<\/span>For these appointments with an advisor, the reservation, does it get done by telephone, or is it necessary to pass by your site?", "b": "Pour ces rendez-vous avec un conseiller, la réservation se fait-elle par téléphone, ou faut-il passer par votre site ?"}, {"id": "A:Q241", "bid": "QB120", "f": "<span class=\"glabel\" style=\"display:block\">Do we book by phone or online?<\/span>For the reservation, does it suffice to call you?", "b": "Pour la réservation, suffit-il de vous appeler ?"}, {"id": "A:Q231", "bid": "QB151", "f": "<span class=\"glabel\" style=\"display:block\">Do I have to come in person to get more details?<\/span>Does that signify that it would be necessary that I travel all the way to your place to know more about it?", "b": "Cela signifie-t-il qu'il faudrait que je me déplace jusque chez vous pour en savoir plus ?<span class=\"tags\"><span class=\"st\"><b>3c<\/b> Cela signifie-t-il que…<\/span><span class=\"gr\">cond · subj · en/y<\/span><\/span>"}, {"id": "A:Q150", "bid": "QB111", "f": "<span class=\"glabel\" style=\"display:block\">Where can I find out which lectures are on each night?<\/span>Can you indicate to me where to consult the programme of the conferences for a given evening?", "b": "Pouvez-vous m'indiquer où consulter le programme des conférences pour une soirée donnée ?<span class=\"tags\"><span class=\"st\"><b>1d<\/b> Pouvez-vous m'indiquer…<\/span><\/span>"}, {"id": "A:Q007", "bid": "QB006", "f": "<span class=\"glabel\" style=\"display:block\">What are the instructions I would have to follow?<\/span>And, to reassure me a bit more, could you specify for me a few of these instructions?", "b": "Et, pour me rassurer un peu plus, pourriez-vous me préciser quelques-unes de ces consignes ?<span class=\"tags\"><span class=\"st\"><b>1a<\/b> Pourriez-vous me préciser…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q100", "bid": "QB080", "f": "<span class=\"glabel\" style=\"display:block\">What medical proof do you need?<\/span>In what manner must we prove to you that we don't have medical antecedents?", "b": "De quelle manière devons-nous vous prouver que nous n'avons pas d'antécédents médicaux ?<span class=\"tags\"><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:QN19", "bid": "QB080", "f": "<span class=\"glabel\" style=\"display:block\">What medical proof do you need?<\/span>Is a medical certificate obligatory to jump, or does a simple waiver suffice?", "b": "Un certificat médical est-il obligatoire pour sauter, ou une simple décharge suffit-elle ?<span class=\"tags\"><span class=\"st\"><b>6b<\/b> … est-il obligatoire ?<\/span><\/span>"}, {"id": "A:QN37", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>And if it's not authorised, what justifies this restriction?", "b": "Et si ce n'est pas autorisé, qu'est-ce qui justifie cette restriction ?<span class=\"tags\"><span class=\"st\"><b>4b<\/b> Qu'est-ce qui justifie…<\/span><\/span>"}, {"id": "A:QN42", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>How do you explain that you don't deliver beyond this distance?", "b": "Comment expliquez-vous que vous ne livriez pas au-delà de cette distance ?<span class=\"tags\"><span class=\"st\"><b>4a<\/b> Comment expliquez-vous que…<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:QN23", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>And for what reason is the age limit fixed at 13 years?", "b": "Et pour quelle raison la limite d'âge est-elle fixée à 13 ans ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><\/span>"}, {"id": "A:QN28", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>For what reason do you require a medical proof, exactly?", "b": "Pour quelle raison exigez-vous un justificatif médical, au juste ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:QN21", "bid": "QB172", "f": "<span class=\"glabel\" style=\"display:block\">What is the reason for that rule?<\/span>And if our name had to figure on it, for what reason would it be necessary?", "b": "Et si notre nom devait y figurer, pour quelle raison serait-ce nécessaire ?<span class=\"tags\"><span class=\"st\"><b>4c<\/b> Pour quelle raison…<\/span><span class=\"gr\">si + imparf. · cond · en/y<\/span><\/span>"}, {"id": "A:Q137", "bid": "QB103", "f": "<span class=\"glabel\" style=\"display:block\">What are the rules about noise at night?<\/span><mark>What are the rules in matter of noise at night in the apartment<\/mark><span class=\"dim\">, in case we would organise parties, that kind of thing?<\/span>", "b": "<mark>Quelles sont les règles en matière de bruit la nuit dans l'appartement<\/mark><span class=\"dim\">, au cas où nous organiserions des soirées, ce genre de choses ?<\/span><span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q121", "bid": "QB091", "f": "<span class=\"glabel\" style=\"display:block\">How much do we need to help write the lyrics?<\/span>Could you tell me in what measure we should participate in the writing of the words?", "b": "Pourriez-vous me dire dans quelle mesure nous devrions participer à l'écriture des paroles ?<span class=\"tags\"><span class=\"st\"><b>2b<\/b> Pourriez-vous me dire dans quelle mesure…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q122", "bid": "QB092", "f": "<span class=\"glabel\" style=\"display:block\">How many revisions are free before you charge extra?<\/span><span class=\"dim\">Let's admit that you deliver us a song and that it doesn't really please us: <\/span><mark>to how many free modifications would we have right before you start to invoice a supplement?<\/mark>", "b": "<span class=\"dim\">Admettons que vous nous livriez une chanson et qu'elle ne nous plaise pas vraiment : <\/span><mark>à combien de modifications gratuites aurions-nous droit avant que vous ne commenciez à facturer un supplément ?<\/mark><span class=\"tags\"><span class=\"gr\">subj · ne explétif · cond<\/span><\/span>"}, {"id": "A:QN65", "bid": "QB173", "f": "<span class=\"glabel\" style=\"display:block\">How long after delivery can we ask for changes?<\/span>And over what duration can these modifications be asked after the delivery?", "b": "Et sur quelle durée ces modifications peuvent-elles être demandées après la livraison ?<span class=\"tags\"><span class=\"st\"><b>8c<\/b> Sur quelle durée…<\/span><\/span>"}, {"id": "A:Q090", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span><span class=\"dim\">Besides, I must pose you a question on the food: <\/span><mark>must I buy a week of food for my animals in advance, or is it indeed you who take care of it?<\/mark>", "b": "<span class=\"dim\">Par ailleurs, il faut que je vous pose une question sur la nourriture : <\/span><mark>dois-je acheter une semaine de nourriture pour mes animaux à l'avance, ou est-ce bien vous qui vous en occupez ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"st\"><b>6d<\/b> Est-ce bien vous qui vous occupez de…<\/span><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:Q034", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span>If we wish to pass the night on the spot, is it obligatory that we bring our own sleeping bags, or other camping material?", "b": "Si nous souhaitons passer la nuit sur place, est-il obligatoire que nous apportions nos propres sacs de couchage, ou d'autre matériel de camping ?<span class=\"tags\"><span class=\"st\"><b>6b<\/b> … est-il obligatoire ?<\/span><span class=\"gr\">subj<\/span><\/span>"}, {"id": "A:Q089", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span><span class=\"dim\">Besides, I must pose you a question on the food: <\/span><mark>must I buy a week of food for my animals in advance<\/mark><span class=\"dim\">, or is it indeed you who take care of it?<\/span>", "b": "<span class=\"dim\">Par ailleurs, il faut que je vous pose une question sur la nourriture : <\/span><mark>dois-je acheter une semaine de nourriture pour mes animaux à l'avance<\/mark><span class=\"dim\">, ou est-ce bien vous qui vous en occupez ?<\/span><span class=\"tags\"><span class=\"st\"><b>9a<\/b> Par ailleurs…<\/span><span class=\"st\"><b>6d<\/b> Est-ce bien vous qui vous occupez de…<\/span><span class=\"gr\">subj · en/y<\/span><\/span>"}, {"id": "A:Q177", "bid": "QB028", "f": "<span class=\"glabel\" style=\"display:block\">Do we bring our own, or do you provide it?<\/span>On the side of equipment and utensils, are there things that we should buy ourselves beforehand, like aprons? Or do you furnish everything?", "b": "Côté matériel et ustensiles, y a-t-il des choses que nous devrions acheter nous-mêmes au préalable, comme des tabliers ? Ou fournissez-vous tout ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q025", "bid": "QB023", "f": "<span class=\"glabel\" style=\"display:block\">What kind of items could we bring that would be useful for making the lamps?<\/span>Could you give me a few examples of objects that we could bring and that would be useful to fabricate the lamps?", "b": "Pourriez-vous me donner quelques exemples d'objets que nous pourrions apporter et qui seraient utiles pour fabriquer les lampes ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q189", "bid": "QB137", "f": "<span class=\"glabel\" style=\"display:block\">Do you recommend bringing hats?<\/span><span class=\"dim\">Would you have some corners in the shade at the farm? And <\/span><mark>would you advise us to bring hats?<\/mark>", "b": "<span class=\"dim\">Auriez-vous des coins à l'ombre à la ferme ? Et <\/span><mark>nous conseilleriez-vous d'apporter des chapeaux ?<\/mark><span class=\"tags\"><span class=\"st\"><b>1c<\/b> Auriez-vous…<\/span><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q191", "bid": "QB139", "f": "<span class=\"glabel\" style=\"display:block\">How much water should we bring with us?<\/span><span class=\"dim\">Because <\/span><mark>I ask myself what quantity of water it would be necessary that we take with us.<\/mark>", "b": "<span class=\"dim\">Parce que <\/span><mark>je me demande quelle quantité d'eau il faudrait que nous emportions.<\/mark><span class=\"tags\"><span class=\"gr\">cond · subj<\/span><\/span>"}, {"id": "A:Q190", "bid": "QB138", "f": "<span class=\"glabel\" style=\"display:block\">Are there water fountains at the farm?<\/span>Do you have also water fountains, that kind of thing, at the farm?", "b": "Avez-vous aussi des fontaines à eau, ce genre de choses, à la ferme ?"}, {"id": "A:Q109", "bid": "QB084", "f": "<span class=\"glabel\" style=\"display:block\">Is it made fresh on the day, or the night before?<\/span>If the delivery takes place the morning, at what moment would you prepare the products?", "b": "Si la livraison a lieu le matin, à quel moment prépareriez-vous les produits ?<span class=\"tags\"><span class=\"gr\">cond<\/span><\/span>"}, {"id": "A:Q110", "bid": "QB084", "f": "<span class=\"glabel\" style=\"display:block\">Is it made fresh on the day, or the night before?<\/span>Rather the same morning, or the evening before?", "b": "Plutôt le matin même, ou la veille au soir ?"}, {"id": "A:Q114", "bid": "QB088", "f": "<span class=\"glabel\" style=\"display:block\">Can it be left at the door?<\/span><mark>On this subject, can the order be dropped in front of the door<\/mark><span class=\"dim\">, or must it be handed in own hands to the recipient?<\/span>", "b": "<mark>À ce propos, la commande peut-elle être déposée devant la porte<\/mark><span class=\"dim\">, ou doit-elle être remise en mains propres à la destinataire ?<\/span><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><\/span>"}, {"id": "A:Q115", "bid": "QB088", "f": "<span class=\"glabel\" style=\"display:block\">Can it be left at the door?<\/span><span class=\"dim\">On this subject, can the order be dropped in front of the door, or <\/span><mark>must it be handed in own hands to the recipient?<\/mark>", "b": "<span class=\"dim\">À ce propos, la commande peut-elle être déposée devant la porte, ou <\/span><mark>doit-elle être remise en mains propres à la destinataire ?<\/mark><span class=\"tags\"><span class=\"st\"><b>9c<\/b> À ce propos…<\/span><\/span>"}, {"id": "A:Q111", "bid": "QB085", "f": "<span class=\"glabel\" style=\"display:block\">Do you expect a tip for the delivery driver?<\/span>Is it of usage to leave a tip to the delivery people?", "b": "Est-il d'usage de laisser un pourboire aux livreurs ?<span class=\"tags\"><span class=\"gr\">idiome<\/span><\/span>"}, {"id": "A:Q112", "bid": "QB086", "f": "<span class=\"glabel\" style=\"display:block\">Can I tip in advance?<\/span><mark>Would it therefore be envisageable that I settle it in advance<\/mark><span class=\"dim\">, and that you warn the delivery man that it's already done?<\/span>", "b": "<mark>Serait-il donc envisageable que je le règle à l'avance<\/mark><span class=\"dim\">, et que vous préveniez le livreur que c'est déjà fait ?<\/span><span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · cond<\/span><\/span>"}, {"id": "A:Q113", "bid": "QB087", "f": "<span class=\"glabel\" style=\"display:block\">Could you tell the driver that I've already tipped?<\/span>Would it therefore be envisageable that I settle it in advance, and that you warn the delivery man that it's already done?", "b": "Serait-il donc envisageable que je le règle à l'avance, et que vous préveniez le livreur que c'est déjà fait ?<span class=\"tags\"><span class=\"st\"><b>1b<\/b> Serait-il possible de…<\/span><span class=\"gr\">subj · cond<\/span><\/span>"}]}, {"key": "A-M1", "sec": "A", "code": "M1", "name": "Opening", "bucket": "Context", "items": [{"id": "A:C058", "bid": "CB001", "f": "<span class=\"glabel\" style=\"display:block\">I saw your ad.<\/span><span class=\"dim\">Hello, <\/span><mark>I permit myself to call you on the subject of one of your ads that I just came from seeing<\/mark><span class=\"dim\">, and I would have a few questions to pose you to clear up certain points before placing an order… if that doesn't bother you.<\/span>", "b": "<span class=\"dim\">Bonjour, <\/span><mark>je me permets de vous appeler au sujet d'une de vos annonces que je viens de voir<\/mark><span class=\"dim\">, et j'aurais quelques questions à vous poser pour éclaircir certains points avant de passer commande… si cela ne vous dérange pas.<\/span>"}, {"id": "A:C001", "bid": "CB001", "f": "<span class=\"glabel\" style=\"display:block\">I saw your ad.<\/span><mark>Hello, I permit myself to call you because I just came from seeing your ad on the subject of the paragliding experience that you propose<\/mark><span class=\"dim\">, and I would have a few questions to pose you to clear up certain points before reserving… if that doesn't bother you.<\/span>", "b": "<mark>Bonjour, je me permets de vous appeler parce que je viens de voir votre annonce au sujet de l'expérience de parapente que vous proposez<\/mark><span class=\"dim\">, et j'aurais quelques questions à vous poser pour éclaircir certains points avant de réserver… si ça ne vous dérange pas.<\/span>"}, {"id": "A:C010", "bid": "CB001", "f": "<span class=\"glabel\" style=\"display:block
