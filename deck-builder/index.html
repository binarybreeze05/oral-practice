function rowHTML(r, i, prev) {
  return '<div class="row' + (prev && prev.bid && r.bid && prev.bid !== r.bid ? " newbox" : "") + '" data-id="' + esc(r.id) + '">' +
    '<div class="gut"><span>' + (i + 1) + '</span><span class="tl"><button data-act="up" title="Move up" aria-label="Move up">↑</button><button data-act="down" title="Move down" aria-label="Move down">↓</button><button data-act="ins" title="Add a card below" aria-label="Add a card below">＋</button><button class="del" data-act="del" title="Delete card" aria-label="Delete card">✕</button></span></div>' +
    '<div class="cell front" contenteditable="true" data-side="f" data-ph="Front">' + r.f + '</div>' +
    '<div class="cell back" contenteditable="true" data-side="b" data-ph="Back">' + r.b + "</div></div>";
}
function renderBuild() {
  var d = deck();
  $("#reset").disabled = !d; $("#reset").textContent = d && isCustom(S.active) ? "Delete draft" : "Reset";
  if (!d) {
    $("#dname").value = ""; $("#count").textContent = "";
    $("#rows").innerHTML = '<div class="hint">Type a deck name above and click <b>+ Add card</b> for a blank deck,<br>or open <b>☰ Clusters</b> and pick one to start from its cards.</div>';
    return;
  }
  $("#dname").value = d.name;
  $("#rows").innerHTML = d.rows.map(function (r, i) { return rowHTML(r, i, d.rows[i - 1]); }).join("") + '<div class="addrow"><button class="btn" id="add2">+ Add card</button></div>';
  count();
}
function count() { var d = deck(); $("#count").textContent = d ? d.rows.length + (d.rows.length === 1 ? " card" : " cards") : ""; }
function renderDrawer() {
  var h = "<h3>My decks</h3>";
  Object.keys(S.decks).filter(isCustom).forEach(function (k) { var d = S.decks[k]; h += '<button class="cl' + (S.active === k ? " on" : "") + '" data-key="' + k + '"><span class="ed"></span><span class="nm">' + esc(d.name || "Untitled deck") + '</span><span class="bk">blank</span><span class="n">' + d.rows.length + "</span></button>"; });
  h += '<button class="cl" data-new="1"><span class="ed"></span><span class="nm" style="color:var(--acc)">+ New blank deck</span></button>';
  ["A", "B"].forEach(function (s) {
    h += '<h3 class="' + s + '">Section ' + s + "</h3>";
    DATA.clusters.filter(function (c) { return c.sec === s; }).forEach(function (c) {
      h += '<button class="cl' + (S.active === c.key ? " on" : "") + '" data-key="' + c.key + '"><span class="ed' + (S.decks[c.key] ? " on" : "") + '"></span><span class="nm">' + esc(c.name) + '</span><span class="bk">' + esc(c.bucket) + '</span><span class="n">' + c.items.length + "</span></button>";
    });
  });
  $("#drawer").innerHTML = h;
}
function drawer(on) { if (on) renderDrawer(); $("#drawer").hidden = !on; $("#scrim").hidden = !on; }
$("#clusters").addEventListener("click", function () { drawer($("#drawer").hidden); });
$("#scrim").addEventListener("click", function () { drawer(false); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { drawer(false); if (!$("#modal").hidden) $("#modal-no").click(); } });
$("#drawer").addEventListener("click", function (e) {
  var b = e.target.closest(".cl"); if (!b) return;
  if (b.dataset.new) { newBlank(""); drawer(false); renderBuild(); $("#dname").focus(); return; }
  S.active = b.dataset.key; deck(); saveNow(); drawer(false); renderBuild(); window.scrollTo(0, 0);
});
function rowOf(el) { var d = deck(); var id = el.closest(".row").dataset.id; return {d: d, k: d.rows.findIndex(function (r) { return r.id === id; })}; }
$("#rows").addEventListener("input", function (e) { var c = e.target.closest(".cell"); if (!c) return; var x = rowOf(c); x.d.rows[x.k][c.dataset.side] = c.innerHTML === "<br>" ? "" : c.innerHTML; save(); });
$("#rows").addEventListener("paste", function (e) { if (!e.target.closest(".cell")) return; e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain")); });
function insertAfter(k) {
  var d = deck(); var r = {id: "n" + uid(), f: "", b: "", bid: null}; d.rows.splice(k + 1, 0, r); saveNow(); renderBuild();
  var el = document.querySelector('.row[data-id="' + r.id + '"] .front'); if (el) { el.focus(); el.scrollIntoView({block: "center"}); }
}
$("#rows").addEventListener("keydown", function (e) { var c = e.target.closest(".cell"); if (c && (e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); insertAfter(rowOf(c).k); } });
$("#rows").addEventListener("click", function (e) {
  if (e.target.id === "add2") { insertAfter(deck().rows.length - 1); return; }
  var b = e.target.closest("[data-act]"); if (!b) return;
  var x = rowOf(b), d = x.d, k = x.k, id = d.rows[k].id;
  if (b.dataset.act === "del") { var gone = d.rows.splice(k, 1)[0]; saveNow(); renderBuild(); toast("Card deleted", function () { d.rows.splice(k, 0, gone); saveNow(); renderBuild(); }); return; }
  if (b.dataset.act === "ins") { insertAfter(k); return; }
  var j = k + (b.dataset.act === "up" ? -1 : 1); if (j < 0 || j >= d.rows.length) return;
  d.rows.splice(j, 0, d.rows.splice(k, 1)[0]); saveNow(); renderBuild();
  var nb = document.querySelector('.row[data-id="' + id + '"] [data-act="' + b.dataset.act + '"]'); if (nb) nb.focus();
});
$("#dname").addEventListener("input", function (e) { var d = deck(); if (!d) d = newBlank(e.target.value); d.name = e.target.value; save(); });
$("#add").addEventListener("click", function () { var d = deck(); if (!d) { d = newBlank($("#dname").value.trim()); renderBuild(); } insertAfter(d.rows.length - 1); });
$("#reset").addEventListener("click", async function () {
  var d = deck(); if (!d) return; var k = S.active, old = JSON.stringify(d);
  if (isCustom(k)) {
    if (!(await ask("Delete this draft from this device? An exported copy in My decks stays.", "Delete draft"))) return;
    delete S.decks[k]; S.active = null; saveNow(); renderBuild();
    toast("Draft deleted", function () { S.decks[k] = JSON.parse(old); S.active = k; saveNow(); renderBuild(); }); return;
  }
  if (!(await ask("Put “" + CL[k].name + "” back to its default cards? Your edits on this device are discarded.", "Reset"))) return;
  S.decks[k] = defaults(k); saveNow(); renderBuild();
  toast("Reset to default", function () { S.decks[k] = JSON.parse(old); saveNow(); renderBuild(); });
});
$("#export").addEventListener("click", async function () {
  var d = deck(); if (!d) { toast("Type a deck name and add a card first, or pick a cluster"); return; }
  var key = S.active, name = (d.name || "").trim() || (CL[key] ? CL[key].name : "Untitled deck");
  var rows = d.rows.filter(function (r) { return strip(r.f) || strip(r.b); }).map(function (r) { return {id: r.id, f: r.f, b: r.b, bid: r.bid || null}; });
  if (!rows.length) { toast("This deck has no cards yet"); return; }
  if (!token()) { show("decks"); $("#ghbox").hidden = false; toast("Unlock sync first (Sync button). Your draft is saved on this device."); return; }
  var btn = $("#export"); btn.disabled = true; btn.textContent = "Exporting…";
  var doc = {name: name, group: CL[key] ? "Section " + CL[key].sec : "My decks", rows: rows, exported: new Date().toISOString()};
  try {
    var path = GH.dir + "/" + key + ".json", cur = await gh(path);
    await writeJSON(path, doc, cur && cur.sha, "Deck builder: " + name);
    var meta = {name: doc.name, group: doc.group, n: rows.length, exported: doc.exported};
    await updateIndex(function (idx) { idx.decks[key] = meta; }, "Deck builder: index");
    cachePut(key, doc); if (SERVER) SERVER[key] = meta;
    $("#status").textContent = "Exported “" + name + "” · " + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    toast("Exported “" + name + "” (" + rows.length + (rows.length === 1 ? " card" : " cards") + ") to My decks");
  } catch (e) {
    toast(e.code === 401 ? "The sync key was refused. Unlock sync again (Sync button)." : "Export failed (" + (e.code || "network") + "). Your draft is safe; try again.");
  } finally { btn.disabled = false; btn.textContent = "Export deck"; }
});

window.TEFDecks = {state: function () { return S; }, page: buildPage};   // for checks from the console
var v = lsGet(VIEW_KEY);
show(v === "build" ? "build" : "decks");
})();
</script>
</body>
</html>
