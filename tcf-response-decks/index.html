oit l'autre, tout noir ou tout blanc."},"EO3-F.10":{"en":"And the position on the spectrum depends from country to country.","l1":"And where to place the cursor, that depends on the country.","fr":"Et où placer le curseur, ça dépend du pays."},"EO3-F.11":{"en":"But just to make it clear, I do think it's definitely possible to develop the economy while preserving the environment in general, but I don't think this is necessarily possible for every single country.","l1":"But just to be clear, I think really that it's totally possible, in general, to develop the economy all while preserving the environment, but I don't think that it is necessarily possible for each country without exception.","fr":"Mais juste pour être clair, je pense vraiment que c'est tout à fait possible, en général, de développer l'économie tout en préservant l'environnement, mais je ne pense pas que ce soit forcément possible pour chaque pays sans exception."},"EO3-F.12":{"en":"It really depends on the country's economy, and what economic development specifically means for them.","l1":"That really depends on the economy of the country, and on what economic development means precisely for it.","fr":"Ça dépend vraiment de l'économie du pays, et de ce que le développement économique veut dire précisément pour lui."},"EO3-F.13":{"en":"For less developed countries, developing the economy may be more of a question of how they could improve education and increase literacy rates, like building more schools, having more college-educated citizens, and attracting more foreign investment.","l1":"For the less developed countries, developing the economy, it's maybe rather a question of knowing how they could improve education and increase the literacy rate, for example by building more schools, by having more graduates of higher education and by attracting more foreign investments.","fr":"Pour les pays moins développés, développer l'économie, c'est peut-être plutôt une question de savoir comment ils pourraient améliorer l'éducation et augmenter le taux d'alphabétisation, par exemple en construisant plus d'écoles, en ayant plus de diplômés du supérieur et en attirant plus d'investissements étrangers."},"EO3-F.14":{"en":"Developing the economy may mean moving away from having more manufacturing plants within the country, and outsourcing more of their manufacturing to another country, and transitioning to more of a white-collar economy.","l1":"Developing the economy, that can mean giving up on having more factories in the country, relocating a bigger part of their production to another country and turning more towards an economy of services.","fr":"Développer l'économie, ça peut vouloir dire renoncer à avoir plus d'usines dans le pays, délocaliser une plus grande partie de leur production dans un autre pays et se tourner davantage vers une économie de services."},"EO3-F.15":{"en":"This would be an example of a case where developing the economy also benefits the environment.","l1":"That would be an example of a case where developing the economy profits the environment too.","fr":"Ce serait un exemple de cas où développer l'économie profite aussi à l'environnement."},"EO3-F.16":{"en":"But for more developed countries, further developing their economy, which is already quite developed, would often prompt them to do things like building more data centers for AI, which pollutes the environment, reduces the amount of fresh water, and causes deforestation.","l1":"But for the more developed countries, developing their economy further, which is already quite developed, would often push them to build, for example, more data centres for IA, which pollutes the environment, reduces the reserves of fresh water and provokes deforestation.","fr":"Mais pour les pays plus développés, développer encore leur économie, qui est déjà assez développée, les pousserait souvent à construire, par exemple, plus de centres de données pour l'IA, ce qui pollue l'environnement, réduit les réserves d'eau douce et provoque la déforestation."},"EO3-F.17":{"en":"So it's definitely harder for them to preservi the environment while developing the economy.","l1":"So it's clearly more difficult for them to preserve the environment while developing the economy.","fr":"Donc c'est clairement plus difficile pour eux de préserver l'environnement tout en développant l'économie."},"EO3-F.18":{"en":"It doesn't mean it's impossible though.","l1":"That doesn't mean that it's impossible for all that.","fr":"Ça ne veut pas dire que c'est impossible pour autant."},"EO3-F.19":{"en":"I think there could be ways in which these developed countries can further develop their economy, while making a net-positive environmental impact.","l1":"I think that there could be ways for these developed countries to develop their economy further while having a net positive impact on the environment.","fr":"Je pense qu'il pourrait y avoir des moyens pour ces pays développés de développer encore leur économie tout en ayant un impact net positif sur l'environnement."},"EO3-F.20":{"en":"Let's see.","l1":"Let's see to see.","fr":"Voyons voir."},"EO3-F.21":{"en":"They could build enough green infrastructure around the new data centers to ensure that they are powered by clean energy and are carbon-neutral.","l1":"They could construct enough green infrastructure around the new data centers to make sure that they are powered with clean energy and neutral in carbon.","fr":"Ils pourraient construire assez d'infrastructures vertes autour des nouveaux centres de données pour faire en sorte qu'ils soient alimentés en énergie propre et neutres en carbone."},"EO3-F.22":{"en":"They could also make sure to build these data centers on barren land or infertile soil.","l1":"They could also see to constructing these data centers on arid lands or infertile soils.","fr":"Ils pourraient aussi veiller à construire ces centres de données sur des terres arides ou des sols infertiles."},"EO3-F.23":{"en":"So yea, I definitely think there are ways.","l1":"So yes, I really think that there is a way.","fr":"Donc oui, je pense vraiment qu'il y a moyen."},"EO3-G.01":{"en":"The answer to this question depends entirely on what “abroad” means to you.","l1":"The answer to this question depends entirely on what one understands by “abroad”.","fr":"La réponse à cette question dépend entièrement de ce qu'on entend par « l'étranger »."},"EO3-G.02":{"en":"It depends on what your home country is.","l1":"That depends on the country one comes from.","fr":"Ça dépend du pays d'où on vient."},"EO3-G.03":{"en":"We need to have that sort of base, that starting point, for us to compare an alternative to.","l1":"We have need of this kind of base, of this starting point, to be able to compare another option to it.","fr":"On a besoin de ce genre de base, de ce point de départ, pour pouvoir y comparer une autre option."},"EO3-G.04":{"en":"Your answer to this question would differ based on what your home country is.","l1":"The answer one gives to this question would be different according to the country one comes from.","fr":"La réponse qu'on donne à cette question serait différente selon le pays d'où on vient."},"EO3-G.05":{"en":"When I came to Canada, and the answer to this question, for me was undoubtedly yes, 100% yes.","l1":"When I arrived in Canada, the answer to this question, for me, it was without any doubt yes, yes at 100%.","fr":"Quand je suis arrivé au Canada, la réponse à cette question, pour moi, c'était sans aucun doute oui, oui à 100 %."},"EO3-G.06":{"en":"The benefits of living in Canada and settling in Canada long-term far outweighed staying in my home country.","l1":"There were largely more advantages to living in Canada and settling there on the long term than to staying in my country of origin.","fr":"Il y avait largement plus d'avantages à vivre au Canada et à m'y installer sur le long terme qu'à rester dans mon pays d'origine."},"EO3-G.07":{"en":"But it was also an easy decision for me, because when I left in 2021, there was a lot of civil unrest going on because our authoritarian military staged a coup.","l1":"But for me, it has also been an easy decision, because when I left in 2021, there were big troubles in the country, because our authoritarian army had done a coup d'État.","fr":"Mais pour moi, ça a aussi été une décision facile, parce que quand je suis parti en 2021, il y avait de gros troubles dans le pays, parce que notre armée autoritaire avait fait un coup d'État."},"EO3-G.08":{"en":"And overnight our country went from a democratic state to an authoritarian state, ruled by an evil regime that shot down over 7000 peaceful protestors in 2021.","l1":"And from one day to the next, our country passed from a democratic État to an authoritarian État, directed by a criminal regime that shot down more than 7000 peaceful protesters in 2021.","fr":"Et du jour au lendemain, notre pays est passé d'un État démocratique à un État autoritaire, dirigé par un régime criminel qui a abattu plus de 7 000 manifestants pacifiques en 2021."},"EO3-G.09":{"en":"I don't wanna get too much into it, but that's the gist of it.","l1":"I don't want to enter too much into the details, but basically, it's that.","fr":"Je ne veux pas trop entrer dans les détails, mais en gros, c'est ça."},"EO3-G.10":{"en":"So yea, in my case, 100% the benefits of escaping this regime, outweighed whatever drawbacks my 17-year old self faced in 2021 - whether it'd be loneliness or financial hardship due to the cost of living - I mean I had those problems yes but...I was smiling through it all, because I felt grateful that I had the privilege of having these first-world problems instead of having my survival threatened.","l1":"So yes, in my case, the advantages of escaping this regime won out at 100% over all the inconveniences that I knew at 17 years in 2021, whether it be the solitude or the financial difficulties because of the cost of living, well, I had these problems, yes, but… I kept the smile despite all that, because I was grateful to have the privilege of knowing these problems of rich people rather than seeing my survival threatened.","fr":"Donc oui, dans mon cas, les avantages d'échapper à ce régime l'emportaient à 100 % sur tous les inconvénients que j'ai connus à 17 ans en 2021, que ce soit la solitude ou les difficultés financières à cause du coût de la vie, enfin, j'avais ces problèmes, oui, mais… je gardais le sourire malgré tout ça, parce que j'étais reconnaissant d'avoir le privilège de connaître ces problèmes de riches plutôt que de voir ma survie menacée."},"EO3-G.11":{"en":"Now obviously this is more of an extreme scenario, and in some cases it is also possible that living abroad has more drawbacks than benefits.","l1":"So obviously, it's a rather extreme scenario, and in certain cases, it is also possible that living abroad has more inconveniences than advantages.","fr":"Alors évidemment, c'est un scénario plutôt extrême, et dans certains cas, il est aussi possible que vivre à l'étranger ait plus d'inconvénients que d'avantages."},"EO3-G.12":{"en":"You're often likely to end up feeling lonelier if you live abroad because the people in this new country might not fully accept you as one of them.","l1":"One often risks ending up feeling more alone if one lives abroad, because the people of this new country maybe don't accept us completely as one of theirs.","fr":"On risque souvent de finir par se sentir plus seul si on vit à l'étranger, parce que les gens de ce nouveau pays ne nous acceptent peut-être pas complètement comme l'un des leurs."},"EO3-G.13":{"en":"Sure, they're nice to you, but breaking into their friend circles and connecting with them on a deeper basis is difficult.","l1":"Of course, they are kind with us, but making oneself a place in their circles of friends and creating deeper links with them, it's difficult.","fr":"Bien sûr, ils sont gentils avec nous, mais se faire une place dans leurs cercles d'amis et créer des liens plus profonds avec eux, c'est difficile."},"EO3-G.14":{"en":"The cost of living could also be higher for you, depending on what your salary is in this new country, and you could be underemployed.","l1":"The cost of living can also be higher, according to the salary one has in this new country, and one can find oneself underemployed.","fr":"Le coût de la vie peut aussi être plus élevé, selon le salaire qu'on a dans ce nouveau pays, et on peut se retrouver sous-employé."},"EO3-G.15":{"en":"There are many people who have doctorate degrees from their home countries working in junior positions abroad, when they could have a quote-unquote \"higher-status\" job title back home.","l1":"There are a lot of people who have a doctorate obtained in their country of origin and who work abroad in beginner positions, whereas they could have a position, between quotation marks, \"more prestigious\" back home.","fr":"Il y a beaucoup de gens qui ont un doctorat obtenu dans leur pays d'origine et qui travaillent à l'étranger à des postes de débutant, alors qu'ils pourraient avoir un poste, entre guillemets, « plus prestigieux » chez eux."},"EO3-G.16":{"en":"But they decided to make that trade, because, I don't know, there's better health care abroad or because they can provide a better life for their children, or better education.","l1":"But they decided to make this compromise, because, I don't know, the system of health is better abroad or because they can offer a better life to their children, or a better education.","fr":"Mais ils ont décidé de faire ce compromis, parce que, je ne sais pas, le système de santé est meilleur à l'étranger ou parce qu'ils peuvent offrir une meilleure vie à leurs enfants, ou une meilleure éducation."},"EO3-G.17":{"en":"It all depends on what your goals are.","l1":"Everything depends on the objectives one has.","fr":"Tout dépend des objectifs qu'on a."},"EO3-G.18":{"en":"And how much you value certain factors.","l1":"And of the importance that one gives to certain factors.","fr":"Et de l'importance qu'on accorde à certains facteurs."},"EO3-G.19":{"en":"And what you would be willing to sacrifice.","l1":"And on what one would be ready to sacrifice.","fr":"Et de ce qu'on serait prêt à sacrifier."},"EO3-G.20":{"en":"And what life specifically looks like for you, in your new country, as opposed to your home country.","l1":"And on what one's life concretely looks like in one's new country, in relation to one's country of origin.","fr":"Et de ce à quoi ressemble concrètement sa vie dans son nouveau pays, par rapport à son pays d'origine."},"EO3-H.01":{"en":"This is definitely a touchy topic.","l1":"It's clearly a sensitive subject.","fr":"C'est clairement un sujet sensible."},"EO3-H.02":{"en":"I'm going to frame my response like this.","l1":"I am going to present my answer in this manner.","fr":"Je vais présenter ma réponse de cette manière."},"EO3-H.03":{"en":"The way I see this question...","l1":"The way in which I understand this question…","fr":"La façon dont je comprends cette question…"},"EO3-H.04":{"en":"I think it's asking whether or not there is a net benefit, like whether or not immigration has a net benefit to the host country.","l1":"I think that the question, it's to know if there is a net benefit or not, well, if immigration brings or not a net benefit to the host country.","fr":"Je pense que la question, c'est de savoir s'il y a un bénéfice net ou pas, enfin, si l'immigration apporte ou non un bénéfice net au pays d'accueil."},"EO3-H.05":{"en":"I think that's what is being referred to by the term \"added value\".","l1":"I think that it's what one wants to say by the term “added value”.","fr":"Je pense que c'est ce qu'on veut dire par le terme « valeur ajoutée »."},"EO3-H.06":{"en":"And...","l1":"And…","fr":"Et…"},"EO3-H.07":{"en":"I think it depends.","l1":"I think that it depends.","fr":"Je pense que ça dépend."},"EO3-H.08":{"en":"It depends on a lot of things.","l1":"It depends on a lot of things.","fr":"Ça dépend de beaucoup de choses."},"EO3-H.09":{"en":"There are nuances to this, right?","l1":"There are nuances, no?","fr":"Il y a des nuances, non ?"},"EO3-H.10":{"en":"There's nuance to any question.","l1":"Each question has its nuances.","fr":"Chaque question a ses nuances."},"EO3-H.11":{"en":"It depends on the type of immigration, the amount of immigration, the country's specific need that they are hoping immigration would fill, its rate of population growth, its day-to-day living cost, it depends on all these things.","l1":"It depends on the type of immigration, on the volume of immigration, on the precise need that the country hopes to fill with immigration, on its rate of demographic growth, on the cost of daily life, it depends on all that.","fr":"Ça dépend du type d'immigration, du volume d'immigration, du besoin précis que le pays espère combler avec l'immigration, de son taux de croissance démographique, du coût de la vie au quotidien, ça dépend de tout ça."},"EO3-H.12":{"en":"More often than not, the selling point of immigration for a country is added labor force, because there are these job openings that cannot be filled by just the locals... maybe they're too low-skilled for the average citizen in that country, too high-skilled and niche... or maybe they're in a rural area... whatever the case may be.","l1":"Most often, the selling argument of immigration for a country, it's the extra workforce, because there are these vacant posts that one cannot fill with only the people of the country… maybe that they are too little qualified for the average citizen of this country, too qualified and too specialized… or maybe that they are in a rural zone… whatever it may be.","fr":"Le plus souvent, l'argument de vente de l'immigration pour un pays, c'est la main-d'œuvre supplémentaire, parce qu'il y a ces postes vacants qu'on ne peut pas pourvoir avec seulement les gens du pays… peut-être qu'ils sont trop peu qualifiés pour le citoyen moyen de ce pays, trop qualifiés et trop pointus… ou peut-être qu'ils sont en zone rurale… quoi qu'il en soit."},"EO3-H.13":{"en":"So why not have foreigners fill these roles?","l1":"So why not entrust these positions to foreigners?","fr":"Alors pourquoi ne pas confier ces postes à des étrangers ?"},"EO3-H.14":{"en":"It makes sense, like... immigration usually works in theory.","l1":"It's logical, well… in theory, immigration works generally.","fr":"C'est logique, enfin… en théorie, l'immigration fonctionne généralement."},"EO3-H.15":{"en":"Same goes for something like entrepreneurial immigration.","l1":"It's the same for the immigration of entrepreneurs, for example.","fr":"C'est pareil pour l'immigration d'entrepreneurs, par exemple."},"EO3-H.16":{"en":"Why don't we have these rich people come into the country to start businesses or invest and create jobs for our citizens?","l1":"Why not make these rich people come into the country to set up businesses or invest and create jobs for our citizens?","fr":"Pourquoi ne pas faire venir ces gens riches dans le pays pour monter des entreprises ou investir et créer des emplois pour nos citoyens ?"},"EO3-H.17":{"en":"Like I said, it just makes sense, and in theory, immigration usually, if not always, brings added value to a country.","l1":"Like I said, it's quite simply logical, and in theory, immigration brings most of the time, if not always, an added value to a country.","fr":"Comme je l'ai dit, c'est tout simplement logique, et en théorie, l'immigration apporte la plupart du temps, sinon toujours, une valeur ajoutée à un pays."},"EO3-H.18":{"en":"But that's in theory.","l1":"But that, it's in theory.","fr":"Mais ça, c'est en théorie."},"EO3-H.19":{"en":"In practice, it is also important for us to note that there are a lot of things that could go wrong, and potential for these immigration policies to backfire, based on how diligently they are implemented.","l1":"In practice, it is also important to note that there are a lot of things that could turn out badly, and that these immigration policies risk having the inverse effect, according to the care that one puts into applying them.","fr":"En pratique, il est aussi important de noter qu'il y a beaucoup de choses qui pourraient mal tourner, et que ces politiques d'immigration risquent d'avoir l'effet inverse, selon le soin qu'on met à les appliquer."},"EO3-H.20":{"en":"Do we have enough housing and infrastructure to sustain our immigration targets?","l1":"Do we have enough housing and infrastructure to hold our immigration objectives?","fr":"A-t-on assez de logements et d'infrastructures pour tenir nos objectifs d'immigration ?"},"EO3-H.21":{"en":"Are the foreign workers filling in for roles that we cannot reliably fill with the locals, or are they taking away jobs from our teenagers and recent college graduates?","l1":"Do the foreign workers occupy positions that we don't always manage to fill with the people of the country, or else they take jobs from our adolescents and from our young graduates?","fr":"Les travailleurs étrangers occupent-ils des postes qu'on n'arrive pas toujours à pourvoir avec les gens du pays, ou bien ils prennent des emplois à nos adolescents et à nos jeunes diplômés ?"},"EO3-H.22":{"en":"Are we doing our due diligence with regards to detecting misrepresentation and fraud, so we can ensure that the people we're bringing in truthfully meet our criteria in terms of work experience or demographic, and that they are coming for the reason they claim they are?","l1":"Do we do the necessary verifications to detect the false declarations and the fraud, in such a way as to make sure that the people we bring in really fulfill our criteria in matter of professional experience or demographic profile, and that they come indeed for the reason they put forward?","fr":"Fait-on les vérifications nécessaires pour détecter les fausses déclarations et la fraude, de façon à s'assurer que les gens qu'on fait venir remplissent vraiment nos critères en matière d'expérience professionnelle ou de profil démographique, et qu'ils viennent bien pour la raison qu'ils avancent ?"},"EO3-H.23":{"en":"Are there any loopholes in our immigration system that they are exploiting to legally not fulfill what we want them to fulfill with our policy?","l1":"Are there flaws in our system of immigration that they exploit to not do, in all legality, what our policy expects of them?","fr":"Y a-t-il des failles dans notre système d'immigration qu'ils exploitent pour ne pas faire, en toute légalité, ce que notre politique attend d'eux ?"},"EO3-H.24":{"en":"A lot of things we need to make sure to do due diligence around... and truthfully speaking, it's hard to do that - it's hard to implement all these things correctly in practice.","l1":"There are a lot of things that one must make sure to verify well… and to tell the truth, it's difficult to do, it's difficult to apply correctly all that in practice.","fr":"Il y a beaucoup de choses qu'on doit s'assurer de bien vérifier… et à vrai dire, c'est difficile à faire, c'est difficile d'appliquer correctement tout ça en pratique."},"EO3-H.25":{"en":"But I don't think it's impossible, and the good thing is, if it's done correctly, immigration can be really valuable for a country.","l1":"But I don't think that it's impossible, and what is good, it's that if it's done correctly, immigration can be really beneficial for a country.","fr":"Mais je ne pense pas que ce soit impossible, et ce qui est bien, c'est que si c'est fait correctement, l'immigration peut être vraiment bénéfique pour un pays."},"EO3-I.01":{"en":"I'm going to frame my response like this.","l1":"I am going to present my answer in this manner.","fr":"Je vais présenter ma réponse de cette manière."},"EO3-I.02":{"en":"The way I see this question...","l1":"The way in which I understand this question…","fr":"La façon dont je comprends cette question…"},"EO3-I.03":{"en":"I think it's asking whether or not there is net job loss due to new technologies - whether there will be more jobs that are destroyed by these technologies than jobs that are created as a result of these technologies.","l1":"I think that the question, it's to know if there is or not a net loss of jobs because of the new technologies, if there will be more jobs destroyed by these technologies than jobs created thanks to them.","fr":"Je pense que la question, c'est de savoir s'il y a ou non une perte nette d'emplois à cause des nouvelles technologies, s'il y aura plus d'emplois détruits par ces technologies que d'emplois créés grâce à elles."},"EO3-I.04":{"en":"The reason I frame it this way is because... it is a fact that new technologies cause job loss, and make certain jobs obsolete - we've seen this consistently throughout history.","l1":"If I present things like that, it's because… it's a fact that the new technologies bring job losses and render certain trades obsolete, we have seen it constantly all throughout history.","fr":"Si je présente les choses comme ça, c'est parce que… c'est un fait que les nouvelles technologies entraînent des pertes d'emplois et rendent certains métiers obsolètes, on l'a vu constamment tout au long de l'histoire."},"EO3-I.05":{"en":"But we have also seen new jobs being created as a result of new technologies and I would say, at least in the 21st century, there has globally been more jobs created due to new technologies like social media and computers, then there has been jobs destroyed.","l1":"But we have also seen new jobs create themselves with the new technologies, and I would say that at least in the 21st century, there have been in the world more jobs created thanks to the new technologies like social networks and computers than jobs destroyed.","fr":"Mais on a aussi vu de nouveaux emplois se créer avec les nouvelles technologies, et je dirais qu'au moins au 21e siècle, il y a eu dans le monde plus d'emplois créés grâce aux nouvelles technologies comme les réseaux sociaux et les ordinateurs que d'emplois détruits."},"EO3-I.06":{"en":"That has been the trend.","l1":"That has been the trend.","fr":"Ça a été la tendance."},"EO3-I.07":{"en":"The question is... would that trend continue with the newer technologies today?","l1":"The question, it's… is this tendency going to continue with the more recent technologies that we have today?","fr":"La question, c'est… cette tendance va-t-elle se poursuivre avec les technologies plus récentes qu'on a aujourd'hui ?"},"EO3-I.08":{"en":"If you were to ask me this five years ago, I would've said \"of course, new technologies always create more jobs than it destroy\", but today, in 2026, it's the first time that I'm not really sure about this anymore.","l1":"If one had asked me the question five years ago, I would have said “of course, the new technologies always create more jobs than they destroy”, but today, in 2026, it's the first time that I am no longer really sure of it.","fr":"Si on m'avait posé la question il y a cinq ans, j'aurais dit « bien sûr, les nouvelles technologies créent toujours plus d'emplois qu'elles n'en détruisent », mais aujourd'hui, en 2026, c'est la première fois que je n'en suis plus vraiment sûr."},"EO3-I.09":{"en":"So obviously, the elephant in the room, the technology that everyone and their grandma is talking about, is AI.","l1":"So obviously, the unavoidable subject, the technology that everyone talks about, even our grandmothers, it's IA.","fr":"Alors évidemment, le sujet incontournable, la technologie dont tout le monde parle, même nos grands-mères, c'est l'IA."},"EO3-I.10":{"en":"Firstly, it's no question that AI has already been a massive driver behind recent unemployment or underemployment rates.","l1":"First, there is no doubt that IA has already played an enormous role in the recent rates of unemployment or of underemployment.","fr":"D'abord, il ne fait aucun doute que l'IA a déjà joué un rôle énorme dans les taux récents de chômage ou de sous-emploi."},"EO3-I.11":{"en":"And this is because this is the first time in history that we have a technology that seem to be able do tasks that we thought were uniquely human, and would always continue to be only doable by humans - like writing, coding, generating images, summarizing documents, and all these white-collar jobs.","l1":"And it's because it's the first time in history that we have a technology that seems capable of doing tasks that we thought were proper to the human being and that would always stay reserved to humans, like writing, coding, generating images, summarizing documents, and all these office trades.","fr":"Et c'est parce que c'est la première fois dans l'histoire qu'on a une technologie qui semble capable de faire des tâches qu'on pensait propres à l'être humain et qui resteraient toujours réservées aux humains, comme écrire, coder, générer des images, résumer des documents, et tous ces métiers de bureau."},"EO3-I.12":{"en":"It doesn't matter how true this is, the fact that AI is able to do all these things, at much faster rates than humans, and simultaneously, has already become a major selling point to company executives.","l1":"No matter to what point it's true, the fact that IA is capable of doing all these things, much more quickly than humans, and at the same time, it has already become a major selling argument with company directors.","fr":"Peu importe à quel point c'est vrai, le fait que l'IA soit capable de faire toutes ces choses, beaucoup plus vite que les humains, et en même temps, c'est déjà devenu un argument de vente majeur auprès des dirigeants d'entreprise."},"EO3-I.13":{"en":"And as a result, we're seeing a lot of headlines today of companies doing mass layoffs because they now believe they don't need as much workforce, because the remaining workforce can do 10x the work or whatever with assistance from AI tools.","l1":"And so then, we see today a lot of big headlines about companies that are doing massive layoffs because they think now that they no longer need as much workforce, because the employees who remain can do 10 times more work or I don't know what with the help of IA tools.","fr":"Et du coup, on voit aujourd'hui beaucoup de gros titres sur des entreprises qui font des licenciements massifs parce qu'elles pensent maintenant qu'elles n'ont plus besoin d'autant de main-d'œuvre, parce que les employés qui restent peuvent faire 10 fois plus de travail ou je ne sais quoi avec l'aide des outils d'IA."},"EO3-I.14":{"en":"And it's not just these big companies, it's also these local small business owners, who no longer need to rely on agencies or freelancers.","l1":"And it's not only these big companies, it's also these bosses of small local companies, who no longer need to go through agencies or independents.","fr":"Et ce ne sont pas seulement ces grandes entreprises, ce sont aussi ces patrons de petites entreprises locales, qui n'ont plus besoin de passer par des agences ou des indépendants."},"EO3-I.15":{"en":"So yes, it is undeniable that AI is already causing widespread job loss, the real question is whether or not we'll start seeing unemployment rates go back to normal due to the amount of new jobs created by AI.","l1":"So yes, it is undeniable that IA already provokes job losses on a large scale, the true question, it's to know if we are going to start or not to see the unemployment rates come back to normal thanks to the number of new jobs created by IA.","fr":"Donc oui, il est indéniable que l'IA provoque déjà des pertes d'emplois à grande échelle, la vraie question, c'est de savoir si on va commencer ou non à voir les taux de chômage revenir à la normale grâce au nombre de nouveaux emplois créés par l'IA."},"EO3-I.16":{"en":"And in my opinion, there are two main ways in which this could play out.","l1":"And in my opinion, it could happen in two big ways.","fr":"Et à mon avis, ça pourrait se passer de deux grandes façons."},"EO3-I.17":{"en":"The first way, is that we realize five years from now that AI has mostly just been hype.","l1":"The first way, it's that in five years, we realize that IA, it has mostly been media hype.","fr":"La première façon, c'est que dans cinq ans, on se rend compte que l'IA, ça a surtout été du battage médiatique."},"EO3-I.18":{"en":"This is a real possibility.","l1":"It's totally possible.","fr":"C'est tout à fait possible."},"EO3-I.19":{"en":"In my experience, AI does certain things amazingly well, and is downright horrible at certain things.","l1":"From my experience, IA does certain things incredibly well and it is frankly catastrophic for others.","fr":"D'après mon expérience, l'IA fait certaines choses incroyablement bien et elle est franchement catastrophique pour d'autres."},"EO3-I.20":{"en":"For the types of work where the quality of output is more deterministic, like coding where you know, this thing you build either works or it doesn't, AI is exceptional, it's almost miraculous.","l1":"For the types of work where the quality of the result is more deterministic, like programming, where, you know, what one builds, either it works, or it doesn't work, IA is exceptional, it's almost miraculous.","fr":"Pour les types de travail où la qualité du résultat est plus déterministe, comme la programmation, où, vous savez, ce qu'on construit, soit ça marche, soit ça ne marche pas, l'IA est exceptionnelle, c'est presque miraculeux."},"EO3-I.21":{"en":"But for the types of work where the quality of output judged subjectively and is more \"human\", like writing or content generation, AI is horrible to this day.","l1":"But for the types of work where we judge the quality of the result in a subjective way, where it's more \"human\", like writing or content generation, IA is still catastrophic today.","fr":"Mais pour les types de travail où on juge la qualité du résultat de façon subjective, où c'est plus « humain », comme l'écriture ou la génération de contenu, l'IA est encore catastrophique aujourd'hui."},"EO3-I.22":{"en":"The amount of times I have painfully cringed at the content AI generated for me, no matter how well I prompt it...is, is a lot.","l1":"The number of times where the content that IA generated for me has really made me grind my teeth, no matter the care that I put into formulating my request… it makes, it makes a lot.","fr":"Le nombre de fois où le contenu que l'IA a généré pour moi m'a vraiment fait grincer des dents, peu importe le soin que je mets à formuler ma demande… ça fait, ça fait beaucoup."},"EO3-I.23":{"en":"And I do not yet see a possibility of it being great at this domain of work, due to the nature of the technology itself - it's fundamentally designed to produce work that's 80% good, and for deterministic work, that probably achieves the outcome and is good enough, but for more creative stuff, 80% good is actually bad, because it's generic, and robotic, and predictable, and boring.","l1":"And I don't see yet how IA could be excellent in this domain, because of the very nature of this technology, which is fundamentally conceived to produce a work good at 80%, and for a deterministic work, it reaches without doubt the objective and it's sufficient, but for the more creative things, a work good at 80%, it's in fact bad, because it's generic, and robotic, and predictable, and boring.","fr":"Et je ne vois pas encore comment l'IA pourrait être excellente dans ce domaine, à cause de la nature même de cette technologie, qui est fondamentalement conçue pour produire un travail bon à 80 %, et pour un travail déterministe, ça atteint sans doute l'objectif et c'est suffisant, mais pour les choses plus créatives, un travail bon à 80 %, c'est en fait mauvais, parce que c'est générique, et robotique, et prévisible, et ennuyeux."},"EO3-I.24":{"en":"So yea, it is a real possibility, that these company executives realize a few years from now that AI has done their company more harm than good, and they revert back to their old ways, and hire back the employees that they laid off to fix the mess that AI has made.","l1":"So yes, it is totally possible that these company directors realize in a few years that IA has done more harm than good to their company, that they come back to their old methods and that they rehire the employees that they fired to repair the damage that IA has caused.","fr":"Donc oui, il est tout à fait possible que ces dirigeants d'entreprise se rendent compte dans quelques années que l'IA a fait plus de mal que de bien à leur entreprise, qu'ils reviennent à leurs anciennes méthodes et qu'ils réembauchent les employés qu'ils ont licenciés pour réparer les dégâts que l'IA a causés."},"EO3-I.25":{"en":"There was even a report that came out last year from MIT, that stated that 95% of AI implementation initiatives in companies were deemed as failures by their executives.","l1":"There was even a report from MIT, released last year, that said that company leaders considered 95% of their initiatives of IA deployment as failures.","fr":"Il y a même eu un rapport du MIT, sorti l'année dernière, qui disait que les dirigeants d'entreprise considéraient 95 % de leurs initiatives de déploiement de l'IA comme des échecs."},"EO3-I.26":{"en":"So yea...definitely a possibility.","l1":"So yes… it's clearly a possibility.","fr":"Donc oui… c'est clairement une possibilité."},"EO3-I.27":{"en":"The second trajectory is...AI does actually become even more capable than it currently is, and somehow also becomes great at even the most human tasks like writing, and can genuinely generate content and communicate better and more tastefully than humans.","l1":"The second trajectory, it's… that IA becomes really even more performant than today, that it becomes also, in one way or another, excellent even for the most human tasks like writing, and that it can really generate content and communicate better and with more taste than humans.","fr":"La deuxième trajectoire, c'est… que l'IA devient réellement encore plus performante qu'aujourd'hui, qu'elle devient aussi, d'une manière ou d'une autre, excellente même pour les tâches les plus humaines comme l'écriture, et qu'elle peut vraiment générer du contenu et communiquer mieux et avec plus de goût que les humains."},"EO3-I.28":{"en":"And in this scenario, in a society that's rooted in capitalism, where the primary motive is always to generate more profit, it's hard to see why companies would not continue with these layoffs in favor for AI.","l1":"And in this scenario, in a society anchored in capitalism, where the principal goal is always to make more profit, one sees badly why the companies would not pursue these layoffs in favour of IA.","fr":"Et dans ce scénario, dans une société ancrée dans le capitalisme, où le but principal est toujours de faire plus de profit, on voit mal pourquoi les entreprises ne poursuivraient pas ces licenciements en faveur de l'IA."},"EO3-I.29":{"en":"I think there will always be some jobs that can never be replaced, ones where we always prefer to have human touch, like teachers or nurses... but I think it is possible that AI reduces the total number of jobs available, and that those losses never end up being made up for.","l1":"I think that there will always be trades that one will never be able to replace, those where one always prefers to have a human contact, like the teachers or the nurses… but I think that it is possible that IA reduces the total number of jobs available, and that in the end these losses are never compensated.","fr":"Je pense qu'il y aura toujours des métiers qu'on ne pourra jamais remplacer, ceux où on préfère toujours avoir un contact humain, comme les enseignants ou les infirmiers… mais je pense qu'il est possible que l'IA réduise le nombre total d'emplois disponibles, et qu'au final ces pertes ne soient jamais compensées."},"EO3-I.30":{"en":"I mean there can only be so many AI prompters and AI engineers right?","l1":"Well, there cannot be that many request writers for IA and engineers in IA, no?","fr":"Enfin, il ne peut pas y avoir tant que ça de rédacteurs de requêtes pour l'IA et d'ingénieurs en IA, non ?"},"EO3-I.31":{"en":"But you know, this level of job loss would be a significant issue, and I'm sure if this actually happens, there would be widespread protestes, and probably some kind of government mandate for businesses to keep people employed.","l1":"But you know, such a level of job losses would be an important problem, and I am sure that if it really happened, there would be demonstrations a bit everywhere, and without doubt a sort of obligation imposed by the government so that the companies continue to employ people.","fr":"Mais vous savez, un tel niveau de pertes d'emplois serait un problème important, et je suis sûr que si ça arrivait vraiment, il y aurait des manifestations un peu partout, et sans doute une sorte d'obligation imposée par le gouvernement pour que les entreprises continuent à employer les gens."},"EO3-I.32":{"en":"And also, with all that being said, I do think the first trajectory, the one where AI ends up being more hype than good, is more likely.","l1":"And then, that said, I think really that the first trajectory, the one where IA finishes by making more noise than good, is more probable.","fr":"Et puis, cela dit, je pense vraiment que la première trajectoire, celle où l'IA finit par faire plus de bruit que de bien, est plus probable."},"EO3-I.33":{"en":"I just wanna end this on a more optimistic note.","l1":"I want just to finish on a more optimistic note.","fr":"Je veux juste terminer sur une note plus optimiste."},"EE1-1.01":{"en":"Hey Bernard,","l1":"Hi Bernard,","fr":"Salut Bernard,"},"EE1-1.02":{"en":"So there's this market that I really like, called St. John's Market.","l1":"So, there is a market that I like a lot, which is called St. John's Market.","fr":"Alors, il y a un marché que j'aime beaucoup, qui s'appelle St. John's Market."},"EE1-1.03":{"en":"It's at the corner of St. John's Avenue and 5th Street.","l1":"It's at the corner of St. John's Avenue and of 5th Street.","fr":"C'est au coin de St. John's Avenue et de 5th Street."},"EE1-1.04":{"en":"You can take the number 41 bus to get there.","l1":"You can take the bus 41 to go there.","fr":"Tu peux prendre le bus 41 pour y aller."},"EE1-1.05":{"en":"It's open from 10 a.m. to 6 p.m. every single day.","l1":"It's open from 10 am to 6 pm every day without exception.","fr":"C'est ouvert de 10h à 18h tous les jours sans exception."},"EE1-1.06":{"en":"I have never seen any other market in our city that has products as authentic as what you'll find at St. John's Market.","l1":"I have never seen another market in our city that has products as authentic as those that you will find at St. John's Market.","fr":"Je n'ai jamais vu d'autre marché dans notre ville qui ait des produits aussi authentiques que ceux que tu trouveras au St. John's Market."},"EE1-1.07":{"en":"Spices directly sourced from Thailand, chilli powder that's actually spicy.","l1":"Spices imported directly from Thaïlande, chili in powder that really stings.","fr":"Des épices importées directement de Thaïlande, du piment en poudre qui pique vraiment."},"EE1-1.08":{"en":"Organic produce that's actually organic, unlike the ones you find at Whole Foods.","l1":"Organic fruits and vegetables that are really organic, contrary to those that one finds at Whole Foods.","fr":"Des fruits et légumes bio qui sont vraiment bio, contrairement à ceux qu'on trouve chez Whole Foods."},"EE1-1.09":{"en":"You'll also find rare stuff you need for making Burmese traditional dishes, like unripe mangoes and mustard pickle.","l1":"You will also find there rare things that one needs to prepare traditional Burmese dishes, like green mangoes and mustard in brine.","fr":"Tu y trouveras aussi des choses rares dont on a besoin pour préparer des plats traditionnels birmans, comme des mangues vertes et de la moutarde en saumure."},"EE1-1.10":{"en":"I just know you'll love that place!","l1":"I'm sure that you're going to adore this place!","fr":"Je suis sûr que tu vas adorer cet endroit !"},"EE1-2.01":{"en":"Hey Nicolas,","l1":"Hi Nicolas,","fr":"Salut Nicolas,"},"EE1-2.02":{"en":"I'm glad you loved the meal!","l1":"I'm happy that you adored the meal!","fr":"Je suis content que tu aies adoré le repas !"},"EE1-2.03":{"en":"It's actually a traditional fried rice dish from my home country.","l1":"In fact, it's a traditional fried rice dish from my country of origin.","fr":"En fait, c'est un plat de riz sauté traditionnel de mon pays d'origine."},"EE1-2.04":{"en":"What makes it different, is its uniquely spicy and tangy flavor, which comes from the fresh chilli and mustard pickle.","l1":"What makes it different, it's its unique taste, spicy and tangy, which comes from the fresh chili and the mustard in brine.","fr":"Ce qui le rend différent, c'est son goût unique, épicé et acidulé, qui vient du piment frais et de la moutarde en saumure."},"EE1-2.05":{"en":"Heat about 2 tablespoons of oil in a wok, then add 3 sliced chilies, along with some diced garlic and onion.","l1":"Heat up about 2 soup spoons of oil in a wok, then add 3 thinly sliced chilies, with some garlic and onion cut into dice.","fr":"Fais chauffer environ 2 cuillères à soupe d'huile dans un wok, puis ajoute 3 piments émincés, avec de l'ail et de l'oignon coupés en dés."},"EE1-2.06":{"en":"After about a minute, add your veggies of choice and cook them for two more minutes, before adding cooled rice.","l1":"At the end of about a minute, add the vegetables of your choice and cook them two minutes more, before adding some cooled rice.","fr":"Au bout d'une minute environ, ajoute les légumes de ton choix et fais-les cuire deux minutes de plus, avant d'ajouter du riz refroidi."},"EE1-2.07":{"en":"Stir-fry over high heat for about 5 minutes, then add some mustard pickle, and mix everything well so that the rice is evenly coated.","l1":"Sauté on a high heat for about 5 minutes, then add a bit of mustard in brine and mix the whole thing well so that the rice is uniformly coated.","fr":"Fais sauter à feu vif pendant environ 5 minutes, puis ajoute un peu de moutarde en saumure et mélange bien le tout pour que le riz soit uniformément enrobé."},"EE1-2.08":{"en":"And that's it.","l1":"And that's all.","fr":"Et c'est tout."},"EE1-2.09":{"en":"Let me know how it goes if you try it!","l1":"Tell me what it gives if you try!","fr":"Dis-moi ce que ça donne si tu essaies !"},"EE1-3.01":{"en":"Hey everyone,","l1":"Hi everybody,","fr":"Salut tout le monde,"},"EE1-3.02":{"en":"Veronica's birthday is coming up, and you know how she has been raving about Taylor Swift's Eras Tour?","l1":"The birthday of Veronica is approaching, and you know how she doesn't stop getting ecstatic about the Eras Tour of Taylor Swift?","fr":"L'anniversaire de Veronica approche, et vous savez comme elle n'arrête pas de s'extasier sur l'Eras Tour de Taylor Swift ?"},"EE1-3.03":{"en":"There's nothing she would want more than getting to go to the final show of the Eras Tour this Sunday in Vancouver.","l1":"What she would like more than anything, it's to be able to go to the last concert of the Eras Tour this Sunday in Vancouver.","fr":"Ce qu'elle voudrait plus que tout, c'est pouvoir aller au dernier concert de l'Eras Tour ce dimanche à Vancouver."},"EE1-3.04":{"en":"She couldn't get tickets for it unfortunately, and she's actually pretty sad about it.","l1":"Unfortunately, she didn't succeed in getting tickets, and that makes her rather sad, in fact.","fr":"Malheureusement, elle n'a pas réussi à avoir de billets, et ça la rend assez triste, en fait."},"EE1-3.05":{"en":"But, as it turns out, one of my friends wants to sell her ticket to that show on December 10th, and she's selling it for $200.","l1":"But it turns out that one of my friends wants to sell her ticket for this concert of 10 December, and she sells it at $200.","fr":"Mais il se trouve qu'une de mes amies veut vendre son billet pour ce concert du 10 décembre, et elle le vend 200 $."},"EE1-3.06":{"en":"I'm wondering if e déjeuner pour tout le monde et de nous aider à décharger, puisque Kyle et Tyler devront partir après le déjeuner."},"EE1-4.11":{"en":"We'll continue with the unloading throughout the afternoon, and then head to Big Way Hot Pot for dinner once we're done!","l1":"We will continue unloading all afternoon, and then we will go dine at Big Way Hot Pot once we have finished!","fr":"On continuera à décharger tout l'après-midi, et ensuite on ira dîner chez Big Way Hot Pot une fois qu'on aura fini !"},"EE1-4.12":{"en":"And of course, lunch and dinner are on me.","l1":"And of course, lunch and dinner, it's me who's treating.","fr":"Et bien sûr, le déjeuner et le dîner, c'est moi qui régale."},"EE1-4.13":{"en":"See y'all this Saturday!","l1":"We'll see each other Saturday!","fr":"On se voit samedi !"},"EE1-5.01":{"en":"Hi all,","l1":"Hi all,","fr":"Salut à tous,"},"EE1-5.02":{"en":"As some of you may know, my time here at Hiros Ltd. is coming to an end, and I would like to invite you all out to dinner to celebrate our time together.","l1":"As some among you maybe know, my time here at Hiros Ltd. is reaching its end, and I would like to invite you all to dine at the restaurant to celebrate the time we spent together.","fr":"Comme certains d'entre vous le savent peut-être, mon passage ici chez Hiros Ltd. touche à sa fin, et j'aimerais vous inviter tous à dîner au restaurant pour fêter le temps qu'on a passé ensemble."},"EE1-5.03":{"en":"The dinner is scheduled for 7 pm on May 28th at La Verde, 123 Rose St, Vancouver.","l1":"The dinner is planned for 28 May at 7 pm, at La Verde, 123 Rose St, Vancouver.","fr":"Le dîner est prévu le 28 mai à 19h, à La Verde, 123 Rose St, Vancouver."},"EE1-5.04":{"en":"When you arrive, please mention my name to the receptionist.","l1":"When you will arrive, give my name at the reception, please.","fr":"Quand vous arriverez, donnez mon nom à l'accueil, s'il vous plaît."},"EE1-5.05":{"en":"They will show you to our private terrace at the restaurant." es en colocation (vue magnifique !)"},"EE1-7.02":{"en":"I'm looking for a flatmate to share a 2-bedroom apartment near Lion's Gate Bridge.","l1":"I'm looking for a flatmate to share an apartment of 2 bedrooms near the Lion's Gate Bridge.","fr":"Je cherche un colocataire pour partager un appartement de 2 chambres près du Lion's Gate Bridge."},"EE1-7.03":{"en":"The apartment is 1,000 sq ft, and it's located in Rosevale, a safe and lively neighborhood in North Vancouver.","l1":"The apartment makes 1,000 square feet and it is found in Rosevale, a safe and lively neighborhood of North Vancouver.","fr":"L'appartement fait 1 000 pieds carrés et il se trouve à Rosevale, un quartier sûr et animé de North Vancouver."},"EE1-7.04":{"en":"Your bedroom is spacious and furnished, with floor-to-ceiling windows and breathtaking views of the sea and the mountains (see photos below).","l1":"Your bedroom is spacious and furnished, with glass bays from the floor to the ceiling and a view to cut the breath over the sea and the mountains (see photos below).","fr":"Votre chambre est spacieuse et meublée, avec des baies vitrées du sol au plafond et une vue à couper le souffle sur la mer et les montagnes (voir photos ci-dessous)."},"EE1-7.05":{"en":"The total rent is $3000, so your share would be $1500.","l1":"The total rent is $3,000, your share would therefore be $1,500.","fr":"Le loyer total est de 3 000 $, votre part serait donc de 1 500 $."},"EE1-7.06":{"en":"We do not necessarily need to share hobbies or have similar personalities (although that would be a huge bonus!)","l1":"We don't necessarily need to share the same hobbies or to have similar personalities (even if that would be an enormous plus!)","fr":"Nous n'avons pas forcément besoin de partager les mêmes loisirs ou d'avoir des personnalités similaires (même si ce serait un énorme plus !)"},"EE1-7.07":{"en":"I'm just looking for someone who's respectful, considerate, and quiet in the mornings and after 11 pm.","l1":"I'm looking simply for someone respectful, attentive and who doesn't make noise in the morning and after 11 pm.","fr":"Je cherche simplement quelqu'un de respectueux, d'attentionné et qui ne fait pas de bruit le matin et après 23 h."},"EE1-7.08":{"en":"If that's you, and you're interested in the apartment, send me a message so we can arrange a viewing.","l1":"If you recognize yourself and the apartment interests you, send me a message so that we can organize a visit.","fr":"Si vous vous reconnaissez et que l'appartement vous intéresse, envoyez-moi un message pour qu'on puisse organiser une visite."},"EE1-8.01":{"en":"Hi everyone!","l1":"Hello to all!","fr":"Bonjour à tous !"},"EE1-8.02":{"en":"My name is Min, I'm 21 years old, and I work as a software developer.","l1":"I call myself Min, I have 21 years and I work as a software developer.","fr":"Je m'appelle Min, j'ai 21 ans et je travaille comme développeur logiciel."},"EE1-8.03":{"en":"I just moved here to Vancouver, so I haven't had the chance to visit everything yet, but my favorite place so far has got to be the Seawall.","l1":"I have just settled here, in Vancouver, so I haven't yet had the occasion to visit everything, but for the moment, my favorite place is without any doubt the Seawall.","fr":"Je viens de m'installer ici, à Vancouver, donc je n'ai pas encore eu l'occasion de tout visiter, mais pour l'instant, mon endroit préféré est sans aucun doute le Seawall."},"EE1-8.04":{"en":"There's nothing I currently love more than running or biking along the Seawall, with my friends, on a cool, breezy summer evening.","l1":"There is nothing that I love more at this moment than running or cycling along the Seawall, with my friends, on a fresh and windy summer evening.","fr":"Il n'y a rien que j'aime plus en ce moment que courir ou faire du vélo le long du Seawall, avec mes amis, par une soirée d'été fraîche et ventée."},"EE1-8.05":{"en":"The views are second to none!","l1":"The view is incomparable!","fr":"La vue est incomparable !"},"EE1-8.06":{"en":"It's almost like being on a train ride through some of the most scenic spots in all of North America...except they're all here in one city, just a few kilometers apart.","l1":"It's almost like a train trip across some of the most beautiful spots of all Amérique du Nord… except that they are all here, in a single city, at only a few kilometers from one another.","fr":"C'est presque comme un voyage en train à travers certains des plus beaux endroits de toute l'Amérique du Nord… sauf qu'ils sont tous ici, dans une seule ville, à seulement quelques kilomètres les uns des autres."},"EE1-8.07":{"en":"I also absolutely love the beaches.","l1":"The beaches also, I truly adore them.","fr":"Les plages aussi, je les adore vraiment."},"EE1-8.08":{"en":"All of them.","l1":"All of them.","fr":"Toutes."},"EE1-8.09":{"en":"I think my favorite is Third Beach though, because it has the best sunset in my opinion.","l1":"I think that my favorite is all the same Third Beach, because it's there that the sunset is the most beautiful, in my opinion.","fr":"Je pense que ma préférée est quand même Third Beach, parce que c'est là que le coucher de soleil est le plus beau, à mon avis."},"EE1-8.10":{"en":"I can't wait to go up to Whistler later this month.","l1":"I can't wait to go up to Whistler later in the month.","fr":"J'ai hâte de monter à Whistler plus tard dans le mois."},"EE1-8.11":{"en":"The city just keeps on giving, and I feel really grateful that I get to be here.","l1":"The city always has something to offer, and I am really grateful to have the chance to be here.","fr":"La ville a toujours quelque chose à offrir, et je suis vraiment reconnaissant d'avoir la chance d'être ici."},"EE1-9.01":{"en":"Hi,","l1":"Hello,","fr":"Bonjour,"},"EE1-9.02":{"en":"I'm writing to request a full refund for this microwave that I ordered last week (Order #29248).","l1":"I write to you to ask for the integral reimbursement of this microwave that I ordered last week (order no. 29248).","fr":"Je vous écris pour demander le remboursement intégral de ce micro-ondes que j'ai commandé la semaine dernière (commande n° 29248)."},"EE1-9.03":{"en":"I received it this morning, and as soon as I plugged it in, it started making this weird electrical hissing sound.","l1":"I received it this morning and, as soon as I plugged it in, it started to emit a bizarre electrical whistling.","fr":"Je l'ai reçu ce matin et, dès que je l'ai branché, il s'est mis à émettre un sifflement électrique bizarre."},"EE1-9.04":{"en":"I have attached a video to this email as proof.","l1":"I attached a video to this message as proof.","fr":"J'ai joint une vidéo à ce message comme preuve."},"EE1-9.05":{"en":"This understandably makes me concerned about continuing to use it.","l1":"You will understand that I'm worried at the idea of continuing to use it.","fr":"Vous comprendrez que je sois inquiet à l'idée de continuer à l'utiliser."},"EE1-9.06":{"en":"The manual itself also explicitly states that we should not keep using the appliance if it makes a strange sound.","l1":"The user manual itself also specifies explicitly that one must not continue to use the appliance if it makes a strange noise.","fr":"Le mode d'emploi lui-même précise aussi explicitement qu'on ne doit pas continuer à utiliser l'appareil s'il fait un bruit étrange."},"EE1-9.07":{"en":"Ideally, I would like a full refund without having to return it, because I'm really busy these days.","l1":"In the ideal, I would like an integral reimbursement without having to send it back, because I'm really busy at the moment.","fr":"Dans l'idéal, j'aimerais un remboursement intégral sans avoir à le renvoyer, parce que je suis vraiment occupé en ce moment."},"EE1-9.08":{"en":"However, if you need the item returned for a full refund, please let me know.","l1":"However, if you need that I send you back the article for an integral reimbursement, thank you for letting me know.","fr":"Cependant, si vous avez besoin que je vous renvoie l'article pour un remboursement intégral, merci de me le faire savoir."},"EE1-9.09":{"en":"Thank you very much for your help.","l1":"I thank you very much for your help.","fr":"Je vous remercie beaucoup de votre aide."},"EE1-9.10":{"en":"Kind regards,","l1":"Very cordially,","fr":"Bien cordialement,"},"EE1-9.11":{"en":"Min","l1":"Min","fr":"Min"},"EE1-10.01":{"en":"Hey Jason,","l1":"Hi Jason,","fr":"Salut Jason,"},"EE1-10.02":{"en":"Why don't you join me for volleyball this Sunday at Merino Center?","l1":"Why wouldn't you come play volleyball with me this Sunday at the Merino Center?","fr":"Pourquoi tu ne viendrais pas jouer au volley avec moi ce dimanche au Merino Center ?"},"EE1-10.03":{"en":"I know I've already tried to get you to come a few times, so I'll try taking a different approach this time.","l1":"I know that I have already tried several times to make you come, so this time, I'm going to try to go about it differently.","fr":"Je sais que j'ai déjà essayé plusieurs fois de te faire venir, alors cette fois-ci, je vais essayer de m'y prendre autrement."},"EE1-10.04":{"en":"You've been telling me about how you're struggling to make friends after college, and honestly, I totally get that because I went through the same thing a few years ago.","l1":"It's been a while that you tell me that you have trouble making friends since the end of college, and honestly, I understand you totally because I lived the same thing a few years ago.","fr":"Ça fait un moment que tu me dis que tu as du mal à te faire des amis depuis la fin de la fac, et honnêtement, je te comprends tout à fait parce que j'ai vécu la même chose il y a quelques années."},"EE1-10.05":{"en":"The only reason I have the social life I do now is because I joined this volleyball club, started showing up regularly, made a few friends, and then I began meeting more and more people through them.","l1":"If I have the social life that I have today, it's uniquely because I joined this volleyball club, that I started to go there regularly, that I made myself a few friends, and that then I started to meet more and more people thanks to them.","fr":"Si j'ai la vie sociale que j'ai aujourd'hui, c'est uniquement parce que j'ai rejoint ce club de volley, que j'ai commencé à y aller régulièrement, que je me suis fait quelques amis, et qu'ensuite je me suis mis à rencontrer de plus en plus de monde grâce à eux."},"EE1-10.06":{"en":"I'm not saying you will have the exact same outcome, but I really think taking up a physical activity is one of the best ways to meet new people and make friends.","l1":"I'm not saying that you will have exactly the same result, but I really think that getting yourself into a physical activity is one of the best means to meet new people and to make friends.","fr":"Je ne dis pas que tu auras exactement le même résultat, mais je pense vraiment que se mettre à une activité physique est l'un des meilleurs moyens de rencontrer de nouvelles personnes et de se faire des amis."},"EE1-10.07":{"en":"It's also just super fun!","l1":"In addition, it's quite simply super amusing!","fr":"En plus, c'est tout simplement super amusant !"},"EE1-10.08":{"en":"You'll love it.","l1":"You're going to adore it.","fr":"Tu vas adorer."},"EE1-10.09":{"en":"Plus, you've been trying to lose weight, so why not kill two birds with one stone?","l1":"And then, you're trying to lose weight, so why not make two blows with one stone?","fr":"Et puis, tu essaies de perdre du poids, alors pourquoi ne pas faire d'une pierre deux coups ?"},"EE1-10.10":{"en":"Let me know if you're down!","l1":"Tell me if it tempts you!","fr":"Dis-moi si ça te tente !"},"EE1-A.01":{"en":"Hi,","l1":"Hello,","fr":"Bonjour,"},"EE1-A.02":{"en":"I'm looking to rent a one-bedroom apartment in Vancouver.","l1":"I'm looking to rent an apartment with one bedroom in Vancouver.","fr":"Je cherche à louer un appartement avec une chambre à Vancouver."},"EE1-A.03":{"en":"I want it to be at least 500 square feet and no more than a 20-minute drive from Douglas College, where I'll be taking my classes this summer.","l1":"I wish that it makes at least 500 square feet and that it is not at more than 20 minutes by car from Douglas College, where I will follow my courses this summer.","fr":"Je souhaite qu'il fasse au moins 500 pieds carrés et qu'il ne soit pas à plus de 20 minutes en voiture de Douglas College, où je suivrai mes cours cet été."},"EE1-A.04":{"en":"My budget is up to $2,000 a month, including utilities.","l1":"My budget goes up to 2,000 dollars per month, charges included.","fr":"Mon budget va jusqu'à 2 000 dollars par mois, charges comprises."},"EE1-A.05":{"en":"My current place has floor-to-ceiling windows in the living room and I really love that, so I would prefer a place that receives plenty of sunlight.","l1":"In my current lodging, the living room has bay windows from the floor to the ceiling and I adore that, so I would prefer a lodging well sunlit.","fr":"Dans mon logement actuel, le salon a des baies vitrées du sol au plafond et j'adore ça, donc je préférerais un logement bien ensoleillé."},"EE1-A.06":{"en":"If you have a place that meets these criteria, I am willing to pay the deposit as soon as possible, since I want to have something secured by the end of the month.","l1":"If you have a lodging that responds to these criteria, I am ready to pay the deposit as soon as possible, because I would like that it be settled by the end of the month.","fr":"Si vous avez un logement qui répond à ces critères, je suis prêt à verser la caution dès que possible, car je voudrais que ce soit réglé d'ici la fin du mois."},"EE1-A.07":{"en":"I have my documents and references ready if you need them.","l1":"My documents and my references are ready if you need them.","fr":"Mes documents et mes références sont prêts si vous en avez besoin."},"EE1-A.08":{"en":"Thank you very much for your help.","l1":"I thank you very much for your help.","fr":"Je vous remercie beaucoup de votre aide."},"EE1-B.01":{"en":"Hey Sylvie,","l1":"Hi Sylvie,","fr":"Salut Sylvie,"},"EE1-B.02":{"en":"Remember the last time you came over, when we were talking about changing up the aesthetics of the living room?","l1":"You remember the last time that you came by, when we were talking about changing the deco of the living room?","fr":"Tu te souviens de la dernière fois que tu es passée, quand on parlait de changer la déco du salon ?"},"EE1-B.03":{"en":"And how it should better complement its amazing view of the sea and the mountains?","l1":"And that it should better put in value its incredible view on the sea and the mountains?","fr":"Et qu'il devrait mieux mettre en valeur sa vue incroyable sur la mer et les montagnes ?"},"EE1-B.04":{"en":"It stuck with me, and I've decided to go forward with redesigning this space.","l1":"It stayed in my head, and I decided to launch myself into the rearrangement of this room.","fr":"Ça m'est resté en tête, et j'ai décidé de me lancer dans le réaménagement de cette pièce."},"EE1-B.05":{"en":"I particularly want to paint the walls sky blue and add a few touches of lime green and lemon yellow around the house with some furniture, some indoor plants or even some vinyl records.","l1":"I want above all to paint the walls in sky blue and add some touches of lime green and of lemon yellow a bit everywhere in the house, with furniture, interior plants or even vinyls.","fr":"Je veux surtout peindre les murs en bleu ciel et ajouter quelques touches de vert citron et de jaune citron un peu partout dans la maison, avec des meubles, des plantes d'intérieur ou même des vinyles."},"EE1-B.06":{"en":"I'm going to begin this Sunday, starting with painting the walls.","l1":"I'm getting to it this Sunday, starting by painting the walls.","fr":"Je m'y mets ce dimanche, en commençant par peindre les murs."},"EE1-B.07":{"en":"If you'd like to help, I'd really appreciate it.","l1":"If you feel like helping me, it will really please me.","fr":"Si tu as envie de m'aider, ça me fera vraiment plaisir."},"EE1-B.08":{"en":"We can put on Taylor's new album while we work.","l1":"We will be able to put the new album of Taylor while we work.","fr":"On pourra mettre le nouvel album de Taylor pendant qu'on travaille."},"EE1-B.09":{"en":"And of course, lunch and dinner are on me.","l1":"And of course, lunch and dinner, it's me who's treating.","fr":"Et bien sûr, le déjeuner et le dîner, c'est moi qui régale."},"EE1-B.10":{"en":"Let me know if you're down!","l1":"Tell me if it tempts you!","fr":"Dis-moi si ça te tente !"},"EE2-1.01":{"en":"**I will never be the same again.**","l1":"**I will no longer ever be the same.**","fr":"**Je ne serai plus jamais le même.**"},"EE2-1.02":{"en":"Not after what I experienced last night at The Eras Tour.","l1":"Not after what I lived last night at the Eras Tour.","fr":"Pas après ce que j'ai vécu hier soir à l'Eras Tour."},"EE2-1.03":{"en":"And before any of you start rolling your eyes at what sounds like exaggeration, I'm telling you, I mean every bit of it.","l1":"And before certain ones among you raise their eyes to the sky in front of what resembles exaggeration, I tell you so, I weigh each one of my words.","fr":"Et avant que certains d'entre vous ne lèvent les yeux au ciel devant ce qui ressemble à de l'exagération, je vous le dis, je pèse chacun de mes mots."},"EE2-1.04":{"en":"Some of you already know that I'm a big fan of Taylor Swift.","l1":"Certain among you already know that I am a big fan of Taylor Swift.","fr":"Certains d'entre vous savent déjà que je suis un grand fan de Taylor Swift."},"EE2-1.05":{"en":"But last night was more than just about the music.","l1":"But last night, it was not only a question of music.","fr":"Mais hier soir, ce n'était pas qu'une question de musique."},"EE2-1.06":{"en":"It was a testament to how great someone can be at their craft.","l1":"It was the proof of the level that one can reach in one's art.","fr":"C'était la preuve du niveau qu'on peut atteindre dans son art."},"EE2-1.07":{"en":"The concert was three hours long, nonstop.","l1":"The concert lasted three hours, without interruption.","fr":"Le concert a duré trois heures, sans interruption."},"EE2-1.08":{"en":"That's three full hours of Taylor running around on stage, in high heels and tight corsets, hitting high notes, leading the choreography, and doing a dozen costume changes, all without missing even a single beat, a single note, or sounding even slightly out of breath.","l1":"For three entire hours, Taylor runs everywhere on stage, in high heels and in tight corsets, climbs into the high notes, leads the choreography and changes costume a dozen times, all that without losing the rhythm a single time, without missing a single note and without looking the least in the world out of breath.","fr":"Pendant trois heures entières, Taylor court partout sur scène, en talons hauts et en corsets serrés, monte dans les aigus, mène la chorégraphie et change une douzaine de fois de costume, tout ça sans perdre le rythme une seule fois, sans rater une seule note et sans avoir l'air le moins du monde essoufflée."},"EE2-1.09":{"en":"And you know who else didn't miss a single beat?","l1":"And you know who else did not lose the rhythm a single time?","fr":"Et vous savez qui d'autre n'a pas perdu le rythme une seule fois ?"},"EE2-1.10":{"en":"The fans.","l1":"The fans.","fr":"Les fans."},"EE2-1.11":{"en":"All 80,000 of them.","l1":"All the 80,000.","fr":"Tous les 80 000."},"EE2-1.12":{"en":"It didn't matter if the song was from her first album or her latest album.","l1":"It mattered little that the song came from her first album or from her last.","fr":"Peu importait que la chanson vienne de son premier album ou de son dernier."},"EE2-1.13":{"en":"Every single fan, across all ages, knew every single song, and sang every single lyric.","l1":"Each fan, all ages mixed together, knew each song and sang each lyric.","fr":"Chaque fan, tous âges confondus, connaissait chaque chanson et chantait chaque parole."},"EE2-1.14":{"en":"This is mastery.","l1":"That, that is mastery.","fr":"Ça, c'est de la maîtrise."},"EE2-1.15":{"en":"This is decades of hard work culminating into a magnum opus.","l1":"Those are decades of relentless work that lead to a masterpiece.","fr":"Ce sont des décennies de travail acharné qui aboutissent à un chef-d'œuvre."},"EE2-1.16":{"en":"This is a testament to how great someone can be at their craft.","l1":"It is the proof of the level that one can reach in one's art.","fr":"C'est la preuve du niveau qu'on peut atteindre dans son art."},"EE2-1.17":{"en":"I mean, how can you witness something like this, and not feel compelled to devote years of your life to mastering something?","l1":"How can one attend a thing like that without feeling the need to consecrate years of one's life to mastering something?","fr":"Comment peut-on assister à une chose pareille sans ressentir le besoin de consacrer des années de sa vie à maîtriser quelque chose ?"},"EE2-1.18":{"en":"This is why I will never be the same again.","l1":"It is for that that I will never again be the same.","fr":"C'est pour ça que je ne serai plus jamais le même."},"EE2-1.19":{"en":"Anyway, if you still haven't been to an Eras Tour concert, I highly encourage you to grab a ticket.","l1":"In any case, if you still have not gone to a concert of the Eras Tour, I encourage you vividly to take a ticket.","fr":"En tout cas, si vous n'êtes toujours pas allés à un concert de l'Eras Tour, je vous encourage vivement à prendre une place."},"EE2-1.20":{"en":"Because it's not just a music show.","l1":"Because it is not only a simple concert.","fr":"Parce que ce n'est pas qu'un simple concert."},"EE2-1.21":{"en":"It's a life-altering experience.","l1":"It is an experience that changes life.","fr":"C'est une expérience qui change la vie."},"EE2-2.01":{"en":"Hey guys!","l1":"Hi friends!","fr":"Salut les amis !"},"EE2-2.02":{"en":"Yeah, as Kyle mentioned, I volunteered at an orphanage as an English teacher.","l1":"Yes, like Kyle said it, I have been a volunteer teacher of English in an orphanage.","fr":"Oui, comme Kyle l'a dit, j'ai été prof d'anglais bénévole dans un orphelinat."},"EE2-2.03":{"en":"This was my first time doing any sort of volunteer work, let alone being a teacher.","l1":"I had never done the least volunteering, and even less been a teacher.","fr":"Je n'avais jamais fait le moindre bénévolat, et encore moins été prof."},"EE2-2.04":{"en":"And it was intimidating at first, not gonna lie.","l1":"And I am not going to lie to you, at the start, it was intimidating.","fr":"Et je ne vais pas vous mentir, au début, c'était intimidant."},"EE2-2.05":{"en":"My first classes had a lot of awkward silences, and I didn't quite feel confident that my students were having fun.","l1":"There have been a lot of embarrassing silences during my first classes, and I wasn't completely sure that my students were amusing themselves.","fr":"Il y a eu beaucoup de silences gênants pendant mes premiers cours, et je n'étais pas tout à fait sûr que mes élèves s'amusent."},"EE2-2.06":{"en":"But the moment it shifted was when I started incorporating more games into my lessons, like tic-tac-toe and hangman, which they were already familiar with and absolutely loved.","l1":"But things changed at the moment when I started to integrate more games into my classes, like tic-tac-toe and hangman, which they already knew and which they really adored.","fr":"Mais les choses ont changé au moment où j'ai commencé à intégrer plus de jeux dans mes cours, comme le morpion et le pendu, qu'ils connaissaient déjà et qu'ils adoraient vraiment."},"EE2-2.07":{"en":"Not long after, every lesson started feeling genuinely more fun, not only for the students but also for me.","l1":"Shortly after, each class became really more fun, not only for the students, but also for me.","fr":"Peu après, chaque cours est devenu vraiment plus amusant, pas seulement pour les élèves, mais aussi pour moi."},"EE2-2.08":{"en":"There are very few things in life that have ever brought me more joy than seeing their smiles.","l1":"There are very few things in life that have brought me more joy than to see their smiles.","fr":"Il y a très peu de choses dans la vie qui m'aient apporté plus de joie que de voir leurs sourires."},"EE2-2.09":{"en":"It was quite a fulfilling experience for me, and I'm seriously considering doing this again next year!","l1":"That has been a very enriching experience for me, and I am seriously envisaging redoing that next year!","fr":"Ça a été une expérience très enrichissante pour moi, et j'envisage sérieusement de refaire ça l'année prochaine !"},"EE2-2.10":{"en":"What about you guys?","l1":"And you?","fr":"Et vous ?"},"EE2-2.11":{"en":"How were your summer vacations?","l1":"Your summer vacations, how did that go?","fr":"Vos vacances d'été, comment ça s'est passé ?"},"EE2-2.12":{"en":"Did you do any sort of temporary work?","l1":"Have you done a temporary work, whatever it may be?","fr":"Avez-vous fait un travail temporaire, quel qu'il soit ?"},"EE2-3.01":{"en":"Hi all,","l1":"Hello to all,","fr":"Bonjour à tous,"},"EE2-3.02":{"en":"I attended the \"AI Productivity for IT Professionals\" training last Friday, and I wanted to share a bit about my experience for those who are still on the fence about registering.","l1":"I followed the training \"Productivité IA pour les professionnels de l'informatique\" last Friday, and I wanted to share a bit my experience for those who still hesitate to register.","fr":"J'ai suivi la formation « Productivité IA pour les professionnels de l'informatique » vendredi dernier, et je voulais partager un peu mon expérience pour ceux qui hésitent encore à s'inscrire."},"EE2-3.03":{"en":"There's a lot of hype surrounding AI right now, and it's genuinely hard to separate the signal from the noise.","l1":"There is a lot of frenzy around the IA at the moment, and it is really difficult to do the sorting between what counts and what is only noise.","fr":"Il y a beaucoup d'emballement autour de l'IA en ce moment, et c'est vraiment difficile de faire le tri entre ce qui compte et ce qui n'est que du bruit."},"EE2-3.04":{"en":"This training helped me do exactly that.","l1":"It is precisely what this training helped me to do.","fr":"C'est justement ce que cette formation m'a aidé à faire."},"EE2-3.05":{"en":"Within the first hour, I had a working pipeline that turns newly assigned tickets into submitted change requests in seconds.","l1":"In less than an hour, I had an operational pipeline that transforms newly assigned tickets into submitted change requests in a few seconds.","fr":"En moins d'une heure, j'avais un pipeline opérationnel qui transforme les tickets nouvellement assignés en demandes de changement soumises en quelques secondes."},"EE2-3.06":{"en":"This is something that used to take me a few hours per week.","l1":"Before, that took me a few hours per week.","fr":"Avant, ça me prenait quelques heures par semaine."},"EE2-3.07":{"en":"The quick wins kept coming throughout the day.","l1":"The small victories chained themselves together all day long.","fr":"Les petites victoires se sont enchaînées toute la journée."},"EE2-3.08":{"en":"By the end of the training, we had AI automations for most of our time-consuming, lower-leverage work, like writing documentation and generating inventory reports.","l1":"At the end of the training, we had automated thanks to the IA most of our tasks time-consuming and with low added value, like writing the documentation and generating the inventory reports.","fr":"À la fin de la formation, nous avions automatisé grâce à l'IA la plupart de nos tâches chronophages et à faible valeur ajoutée, comme rédiger la documentation et générer les rapports d'inventaire."},"EE2-3.09":{"en":"All the instructors were very hands-on in helping us get our automations working, and that makes a huge difference.","l1":"All the trainers really put their hand to the dough to help us make our automations work, and that makes an enormous difference.","fr":"Tous les formateurs ont vraiment mis la main à la pâte pour nous aider à faire fonctionner nos automatisations, et ça fait une énorme différence."},"EE2-3.10":{"en":"If you still haven't registered, I highly encourage you to do so.","l1":"If you still have not registered, I encourage you vividly to do it.","fr":"Si vous ne vous êtes toujours pas inscrits, je vous encourage vivement à le faire."},"EE2-3.11":{"en":"And if you have already attended, let me know about your experience and what you built!","l1":"And if you have already participated in it, speak to me about your experience and about what you created!","fr":"Et si vous y avez déjà participé, parlez-moi de votre expérience et de ce que vous avez créé !"},"EE2-3.12":{"en":"Cheers,","l1":"See you soon,","fr":"À bientôt,"},"EE2-3.13":{"en":"Min","l1":"Min","fr":"Min"},"EE2-4.01":{"en":"**\"Have you eaten yet?\"**","l1":"**\"Already eaten?\"**","fr":"**« Déjà mangé ? »**"},"EE2-4.02":{"en":"This greeting is what you'll commonly hear in Myanmar, instead of \"How are you?\" or even \"Hello\".","l1":"This greeting, it is what one hears commonly in Myanmar, in place of \"How is it going?\" or even of \"Hello\".","fr":"Cette salutation, c'est ce qu'on entend couramment au Myanmar, à la place de « Comment ça va ? » ou même de « Bonjour »."},"EE2-4.03":{"en":"It makes sense when you look at the relationship our country has with eating.","l1":"It is logical when one looks at the relationship of our country to food.","fr":"C'est logique quand on regarde le rapport de notre pays à la nourriture."},"EE2-4.04":{"en":"Meals are more than just food for us.","l1":"For us, the meals are not summed up by the food.","fr":"Pour nous, les repas ne se résument pas à la nourriture."},"EE2-4.05":{"en":"They are vessels through which we practice our spirit of generosity, whether it's waking up at the crack of dawn to donate to monks, hosting weekly neighbo
