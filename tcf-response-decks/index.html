:"That, I think that it's an enormous waste of money, because that did not help the world in anything.","fr":"Ça, je pense que c'est un énorme gaspillage d'argent, parce que ça n'a en rien aidé le monde."},"EO3-6.13":{"en":"It didn’t contribute to the development of the economy.","l1":"That did not contribute to the development of the economy.","fr":"Ça n'a pas contribué au développement de l'économie."},"EO3-6.14":{"en":"So yes, I think in that case it is entirely useless.","l1":"So yes, I think that in this case, it's totally useless.","fr":"Donc oui, je pense que dans ce cas, c'est totalement inutile."},"EO3-6.15":{"en":"But space travel is currently done for many other purposes.","l1":"But currently, we go into space for a lot of other reasons.","fr":"Mais actuellement, on va dans l'espace pour beaucoup d'autres raisons."},"EO3-6.16":{"en":"And I am sure that some of them do contribute heavily to the development of the ecnomy and is net positive for society.","l1":"And I am sure that certain of them contribute strongly to the development of the economy and have a globally positive effect on society.","fr":"Et je suis sûr que certaines d'entre elles contribuent fortement au développement de l'économie et ont un effet globalement positif sur la société."},"EO3-6.17":{"en":"For example, as a result of space travel, the launching of satellites, the launching of exploration of rovers on other planets, we have been able to make significant progress in research in domains like chemistry, medicine, and sustainable development.","l1":"For example, thanks to space voyages, to the launching of satellites, to the launching of exploration robots on other planets, we were able to make research progress markedly in domains like chemistry, medicine and sustainable development.","fr":"Par exemple, grâce aux voyages spatiaux, au lancement de satellites, au lancement de robots d'exploration sur d'autres planètes, on a pu faire nettement progresser la recherche dans des domaines comme la chimie, la médecine et le développement durable."},"EO3-6.18":{"en":"I don’t know too much about these domains to give you very specific examples, unfortunately, but I have a good impression that it does contribute to the betterment of society through scientific research.","l1":"I don't know these domains enough to give you very precise examples, unfortunately, but I do have the impression that it contributes really to the amelioration of society thanks to scientific research.","fr":"Je ne connais pas assez ces domaines pour vous donner des exemples très précis, malheureusement, mais j'ai bien l'impression que ça contribue vraiment à l'amélioration de la société grâce à la recherche scientifique."},"EO3-6.19":{"en":"I think it is useful.","l1":"I think that it's useful.","fr":"Je pense que c'est utile."},"EO3-6.20":{"en":"But then comes the question: how much does it cost them to do this sort of exploration, and is there a good enough return on investment that we’re getting here in terms of what we end up doing with this research?","l1":"But then, the question poses itself, how much does it cost them to do this kind of exploration, and is there a sufficient return on investment there in relation to what we end up doing with this research?","fr":"Mais ensuite, la question se pose, combien ça leur coûte de faire ce genre d'exploration, et y a-t-il là un retour sur investissement suffisant par rapport à ce qu'on finit par faire de cette recherche ?"},"EO3-6.21":{"en":"Could we be using this money for other causes like building better infrastructure on Earth to support the homeless, or better infrastructure to reduce world hunger?","l1":"Could we use this money for other causes, like building better infrastructures on Terre to help the homeless, or better infrastructures to reduce hunger in the world?","fr":"Pourrait-on utiliser cet argent pour d'autres causes, comme construire de meilleures infrastructures sur Terre pour aider les sans-abri, ou de meilleures infrastructures pour réduire la faim dans le monde ?"},"EO3-6.22":{"en":"These are all valid questions, but I think we can start with stopping the domains of space travel, that are obviously useless and not beneficial to society as a whole, like space tourism.","l1":"They are all legitimate questions, but I think that one can start by stopping the space activities that clearly serve for nothing and that do not profit society in its entirety, like space tourism.","fr":"Ce sont toutes des questions légitimes, mais je pense qu'on peut commencer par arrêter les activités spatiales qui ne servent clairement à rien et qui ne profitent pas à la société dans son ensemble, comme le tourisme spatial."},"EO3-6.23":{"en":"That is a good enough starting point for now.","l1":"It's a point of departure sufficient for the moment.","fr":"C'est un point de départ suffisant pour l'instant."},"EO3-7.01":{"en":"There are both advantages and disadvantages to this.","l1":"There are at the same time advantages and inconveniences to that.","fr":"Il y a à la fois des avantages et des inconvénients à ça."},"EO3-7.02":{"en":"I think this could be a viable way to improve public safety, because having these security cameras would mean that we catch more crimes and we catch more criminals.","l1":"I think that it could be a realistic means to ameliorate public security, because with these surveillance cameras, one would spot more offences and one would catch more criminals.","fr":"Je pense que ça pourrait être un moyen réaliste d'améliorer la sécurité publique, parce qu'avec ces caméras de surveillance, on repérerait plus de délits et on attraperait plus de criminels."},"EO3-7.03":{"en":"But this would also violate everyone’s privacy.","l1":"But that would also violate the private life of everyone.","fr":"Mais ça violerait aussi la vie privée de tout le monde."},"EO3-7.04":{"en":"I guess the answer to this question would depend on who’s installing these surveillance cameras and what they’re going to do with this data, right?","l1":"I imagine that the answer to this question depends on who installs these surveillance cameras and on what they're going to do with these data, no?","fr":"J'imagine que la réponse à cette question dépend de qui installe ces caméras de surveillance et de ce qu'ils vont faire de ces données, non ?"},"EO3-7.05":{"en":"Because they might just say that this data is only to ensure public safety, but what if this data is also sold to third parties?","l1":"Because they could simply say that this data serves only to ensure public security, but what if this data was also sold to third parties?","fr":"Parce qu'ils pourraient simplement dire que ces données servent uniquement à assurer la sécurité publique, mais et si ces données étaient aussi vendues à des tiers ?"},"EO3-7.06":{"en":"If these cameras are installed by a corporation, then how can we trust that this corporation will handle this really sensitive data correctly and put it to good use?","l1":"If these cameras are installed by a company, how can one then trust this company to treat correctly these really sensitive data and make good use of them?","fr":"Si ces caméras sont installées par une entreprise, comment peut-on alors faire confiance à cette entreprise pour traiter correctement ces données vraiment sensibles et en faire bon usage ?"},"EO3-7.07":{"en":"What if they sell it to third parties and it eventually ends up in the hands of hackers or criminals who steal your identity?","l1":"And if they sell them to third parties and they end up in the hands of computer pirates or criminals who usurp your identity?","fr":"Et s'ils les vendent à des tiers et qu'elles finissent par se retrouver entre les mains de pirates informatiques ou de criminels qui usurpent votre identité ?"},"EO3-7.08":{"en":"These are threats that we need to consider for sure.","l1":"Those are threats that we must take into account, that's sure.","fr":"Ce sont des menaces qu'on doit prendre en compte, c'est sûr."},"EO3-7.09":{"en":"I think in some countries they have these public surveillance cameras in the name of public safety and reducing crime.","l1":"I think that in certain countries, there are these public surveillance cameras in the name of public security and of the reduction of criminality.","fr":"Je pense que dans certains pays, il y a ces caméras de surveillance publiques au nom de la sécurité publique et de la réduction de la criminalité."},"EO3-7.10":{"en":"But the data from these cameras is also used to spy on people.","l1":"But the data from these cameras also serves to spy on people.","fr":"Mais les données de ces caméras servent aussi à espionner les gens."},"EO3-7.11":{"en":"This might not necessarily be a problem if you’re always following the law, so you don’t have anything to worry about.","l1":"It's not necessarily a problem if one always respects the law, so one has nothing to fear.","fr":"Ce n'est pas forcément un problème si on respecte toujours la loi, donc on n'a rien à craindre."},"EO3-7.12":{"en":"But in some countries where you don’t have full freedom, like freedom of speech, and you have laws that infringe on basic human rights...","l1":"But in certain countries where one doesn't have a total liberty, like the liberty of expression, and where there are laws that infringe on fundamental human rights…","fr":"Mais dans certains pays où on n'a pas une liberté totale, comme la liberté d'expression, et où il y a des lois qui portent atteinte aux droits humains fondamentaux…"},"EO3-7.13":{"en":"In those cases, these surveillance cameras would not necessarily be fair to society.","l1":"In those cases, these surveillance cameras, it wouldn't necessarily be fair for society.","fr":"Dans ces cas-là, ces caméras de surveillance, ce ne serait pas forcément juste pour la société."},"EO3-7.14":{"en":"Having these cameras in public spaces would also mean that your location, 24/7, would be known.","l1":"To have these cameras in public places, that would want to say also that one would know your position 24 h on 24, 7 days on 7.","fr":"Avoir ces caméras dans les lieux publics, ça voudrait aussi dire qu'on connaîtrait votre position 24 heures sur 24, 7 jours sur 7."},"EO3-7.15":{"en":"That is very sensitive data.","l1":"They are some very sensitive data.","fr":"Ce sont des données très sensibles."},"EO3-7.16":{"en":"How can we trust someone who has this data not to use it unethically?","l1":"How can one have confidence in someone who holds these data to not use them in a non-ethical manner?","fr":"Comment peut-on faire confiance à quelqu'un qui détient ces données pour ne pas les utiliser de manière non éthique ?"},"EO3-7.17":{"en":"How can we trust that they will use this data in good faith?","l1":"How can one have confidence in them to use these data in good faith?","fr":"Comment peut-on leur faire confiance pour utiliser ces données de bonne foi ?"},"EO3-7.18":{"en":"And there’s also just a lot that goes on behind the scenes within the government that we don't know about.","l1":"And there are also quite simply many things that happen in the wings within the government and of which one is not aware.","fr":"Et il y a aussi tout simplement beaucoup de choses qui se passent en coulisses au sein du gouvernement et dont on n'est pas au courant."},"EO3-7.19":{"en":"It's kind of unsettling.","l1":"It's a bit disquieting.","fr":"C'est un peu inquiétant."},"EO3-7.20":{"en":"And I'm not even trying to be controversial.","l1":"And I don't even seek to polemicize.","fr":"Et je ne cherche même pas à polémiquer."},"EO3-7.21":{"en":"It's impossible to know the true intentions of anyone, no matter who they are, and what reputation they have.","l1":"It's impossible to know the true intentions of whoever it may be, no matter who it is and what their reputation is.","fr":"C'est impossible de connaître les vraies intentions de qui que ce soit, peu importe qui c'est et quelle est sa réputation."},"EO3-7.22":{"en":"These government officials may look like they’re always in support of the public, for the public, and for the people.","l1":"These representatives of the government can have the air of being always on the side of the public, for the public and for the people.","fr":"Ces représentants du gouvernement peuvent avoir l'air d'être toujours du côté du public, pour le public et pour le peuple."},"EO3-7.23":{"en":"But what if they’re evil people behind the scenes?","l1":"But what if, in the wings, they were malevolent people?","fr":"Mais et si, en coulisses, c'étaient des gens malveillants ?"},"EO3-7.24":{"en":"I’m not saying they are, I’m just saying we never know, and that’s unsettling.","l1":"I don't say that it's the case, I say just that one never knows, and it's disquieting.","fr":"Je ne dis pas que c'est le cas, je dis juste qu'on ne sait jamais, et c'est inquiétant."},"EO3-7.25":{"en":"So...yea we should probably not do this.","l1":"So… yes, one should without doubt not do that.","fr":"Donc… oui, on ne devrait sans doute pas faire ça."},"EO3-7.26":{"en":"This is my final answer to this question.","l1":"It's my definitive answer to this question.","fr":"C'est ma réponse définitive à cette question."},"EO3-8.01":{"en":"How important are clothes in a professional setting, especially in the context of remote work?","l1":"What importance do clothes have in a professional setting, especially in the context of remote work?","fr":"Quelle importance ont les vêtements dans un cadre professionnel, surtout dans le contexte du télétravail ?"},"EO3-8.02":{"en":"It depends.","l1":"That depends.","fr":"Ça dépend."},"EO3-8.03":{"en":"We need to frame this question a bit more specifically, as I try to do with most of these questions.","l1":"One must pose this question in a manner a bit more precise, like I try to do it with most of these questions.","fr":"Il faut poser cette question de façon un peu plus précise, comme j'essaie de le faire avec la plupart de ces questions."},"EO3-8.04":{"en":"It depends on what your goal is.","l1":"That depends on the objective one has.","fr":"Ça dépend de l'objectif qu'on a."},"EO3-8.05":{"en":"First of all, let’s frame this from the employee's perspective, from your perspective, from the perspective of your life and your goals.","l1":"First of all, let's pose the question from the point of view of the employee, from your point of view, from the point of view of your life and of your objectives.","fr":"Tout d'abord, posons la question du point de vue de l'employé, de votre point de vue, du point de vue de votre vie et de vos objectifs."},"EO3-8.06":{"en":"You’re in that professional setting to work toward your goal.","l1":"If one is in this professional setting, it's to advance toward one's objective.","fr":"Si on est dans ce cadre professionnel, c'est pour avancer vers son objectif."},"EO3-8.07":{"en":"Maybe it’s to make money, and your goal is to make more money and advance in your career.","l1":"Maybe it's to earn money, and one's objective, it's to earn more money and to progress in one's career.","fr":"Peut-être que c'est pour gagner de l'argent, et que son objectif, c'est de gagner plus d'argent et de progresser dans sa carrière."},"EO3-8.08":{"en":"Or maybe it’s just to be comfortable, to spend your day to day life feeling comfortable, both physically and mentally.","l1":"Or maybe it's just to be at ease, to feel at ease in the everyday, as much physically as mentally.","fr":"Ou peut-être que c'est juste pour être à l'aise, pour se sentir à l'aise au quotidien, aussi bien physiquement que mentalement."},"EO3-8.09":{"en":"The answer would depend on those goals.","l1":"The answer depends on these objectives.","fr":"La réponse dépend de ces objectifs."},"EO3-8.10":{"en":"Another variable in this equation is how companies, or the workplace that you work in, value appearance and the professionalism of your appearance.","l1":"Another variable in this equation, it's the importance that companies, or the place where one works, accord to appearance and to the fact of having a professional appearance.","fr":"Une autre variable dans cette équation, c'est l'importance que les entreprises, ou le lieu où on travaille, accordent à l'apparence et au fait d'avoir une apparence professionnelle."},"EO3-8.11":{"en":"Maybe you work in finance or law.","l1":"Maybe one works in finance or in law.","fr":"Peut-être qu'on travaille dans la finance ou dans le droit."},"EO3-8.12":{"en":"In that case, they tend to value more professional, formal attire.","l1":"In that case, they have a tendency to attach importance to a more professional, more formal attire.","fr":"Dans ce cas, ils ont tendance à attacher de l'importance à une tenue plus professionnelle, plus formelle."},"EO3-8.13":{"en":"But if you’re working in IT or tech, then this isn’t really an important factor in your workplace, as long as you’re not in a role where appearance matters as much, specifically when you’re on camera or something like that.","l1":"But if one works in computing or tech, it doesn't really have importance at work, as long as one isn't in a post where the appearance counts as much, notably when one is in front of the camera or something like that.","fr":"Mais si on travaille dans l'informatique ou la tech, ça n'a pas vraiment d'importance au travail, tant qu'on n'est pas dans un poste où l'apparence compte autant, notamment quand on est devant la caméra ou quelque chose comme ça."},"EO3-8.14":{"en":"It also depends on the role.","l1":"That depends also on the post.","fr":"Ça dépend aussi du poste."},"EO3-8.15":{"en":"If you’re in a role where you’re more front-facing to customers, then clothing choices will become more important.","l1":"If one has a post where one is more in direct contact with the clients, the choice of clothes takes more importance.","fr":"Si on a un poste où on est plus en contact direct avec les clients, le choix des vêtements prend plus d'importance."},"EO3-8.16":{"en":"Roles like IT and tech are more backend, so it’s not really that important for those professions.","l1":"The posts in informatics and tech are more in the background, so it's not really so important as that for these trades.","fr":"Les postes dans l'informatique et la tech sont plus en arrière-plan, donc ce n'est pas vraiment si important que ça pour ces métiers."},"EO3-8.17":{"en":"In the context of remote work, I think it’s the same as if you were to work in person.","l1":"In the context of remote work, I think that it's the same thing as if one worked in person.","fr":"Dans le contexte du télétravail, je pense que c'est la même chose que si on travaillait en présentiel."},"EO3-8.18":{"en":"Again, it depends from company to company, but it’s roughly the same as it would be if you were to work in person.","l1":"Once again, that depends from one company to another, but it's more or less the same thing as if one worked in person.","fr":"Encore une fois, ça dépend d'une entreprise à l'autre, mais c'est à peu près la même chose que si on travaillait en présentiel."},"EO3-8.19":{"en":"If companies have certain enforced rules around attire and clothing choices in person, then they will probably have the same rules be applicable in the context of remote work...if they require you to turn on your camera and do that stuff...but if they are more relaxed with camera use, then you don’t really have to I guess.","l1":"If companies impose certain rules on dress and vestimentary choices in person, they will apply probably the same rules in telework… if they demand that one turn on one's camera and all that… but if they are more supple on the use of the camera, then one is not really obliged, I imagine.","fr":"Si les entreprises imposent certaines règles sur la tenue et les choix vestimentaires en présentiel, elles appliqueront probablement les mêmes règles en télétravail… si elles exigent qu'on allume sa caméra et tout ça… mais si elles sont plus souples sur l'utilisation de la caméra, alors on n'est pas vraiment obligé, j'imagine."},"EO3-8.20":{"en":"Then comes the debate of whether you should turn on your camera, how important that is in the context of remote work, and stuff like that.","l1":"Next, there is the debate to know if one must turn on one's camera, to what point it's important in the context of telework, and this kind of things.","fr":"Ensuite, il y a le débat pour savoir s'il faut allumer sa caméra, à quel point c'est important dans le contexte du télétravail, et ce genre de choses."},"EO3-8.21":{"en":"There’s probably a whole bunch of things that we can get into with this, but that’s my elaborated “it depends” answer to this question.","l1":"There are probably a whole lot of things that one can approach on that, but my answer to this question, it's \"it depends\", in the detailed version.","fr":"Il y a probablement tout un tas de choses qu'on peut aborder là-dessus, mais ma réponse à cette question, c'est « ça dépend », en version détaillée."},"EO3-9.01":{"en":"What do I believe is the most pressing issue in today’s world?","l1":"According to me, what is the problem the most urgent in the world of today?","fr":"Selon moi, quel est le problème le plus urgent dans le monde d'aujourd'hui ?"},"EO3-9.02":{"en":"This is a big question because there are a lot of issues happening right now.","l1":"It's a vast question because there are a lot of problems at the moment.","fr":"C'est une vaste question parce qu'il y a beaucoup de problèmes en ce moment."},"EO3-9.03":{"en":"It’s kind of hard to immediately think of what the most pressing issue is.","l1":"It's a bit difficult to find right away what is the most urgent problem.","fr":"C'est un peu difficile de trouver tout de suite quel est le problème le plus urgent."},"EO3-9.04":{"en":"I want to take a first-principles approach to this.","l1":"I want to approach the question by starting from the base principles.","fr":"Je veux aborder la question en partant des principes de base."},"EO3-9.05":{"en":"If we’re solely looking at what’s pressing, what’s most urgent, what poses the most risk, we would have to look at it through an existential lens.","l1":"If one looks uniquely at what is pressing, what is the most urgent, what presents the most risks, one must see things under an existential angle.","fr":"Si on regarde uniquement ce qui est pressant, ce qui est le plus urgent, ce qui présente le plus de risques, il faut voir les choses sous un angle existentiel."},"EO3-9.06":{"en":"At the end of the day, regardless of what country or culture we’re from, we’re all human beings.","l1":"In the final, it matters little from what country or from what culture one comes, we are all human beings.","fr":"Au final, peu importe de quel pays ou de quelle culture on vient, on est tous des êtres humains."},"EO3-9.07":{"en":"I think this question, to me, is actually a question of what the most existential risk to human beings on Earth is in today’s world.","l1":"I think that this question, for me, comes back in fact to asking oneself what is the biggest existential risk for the human beings on Terre in the world of today.","fr":"Je pense que cette question, pour moi, revient en fait à se demander quel est le plus grand risque existentiel pour les êtres humains sur Terre dans le monde d'aujourd'hui."},"EO3-9.08":{"en":"There are two things that come to mind right now.","l1":"There, right away, there are two things that come to my mind.","fr":"Là, tout de suite, il y a deux choses qui me viennent à l'esprit."},"EO3-9.09":{"en":"One of them, obviously, is climate change.","l1":"One of them, evidently, it's the climatic change.","fr":"L'une d'elles, évidemment, c'est le changement climatique."},"EO3-9.10":{"en":"It’s undeniable that global temperatures are rising at unprecedented rates.","l1":"It's undeniable that the world temperatures augment at a rhythm without precedent.","fr":"C'est indéniable que les températures mondiales augmentent à un rythme sans précédent."},"EO3-9.11":{"en":"It is important for us, as a species, to be able to mitigate this issue because the consequences of global warming and climate change will hit us hard and fast.","l1":"It's important that we manage, as a species, to limit this problem, because the consequences of the warming of the planet and of climate change are going to hit us hard and fast.","fr":"Il est important qu'on arrive, en tant qu'espèce, à limiter ce problème, parce que les conséquences du réchauffement de la planète et du changement climatique vont nous frapper fort et vite."},"EO3-9.12":{"en":"It’s kind of like an exponential graph.","l1":"It's a bit like an exponential curve.","fr":"C'est un peu comme une courbe exponentielle."},"EO3-9.13":{"en":"We're starting to see the effects of it, but we're still at this point in the graph... and this is a dangerous point because it is easy to fall into the trap of thinking that climate change is not bad... but it's because we're still here, and very quickly the graph can start going up, and when it starts going up, the rate of change also becomes faster.","l1":"One starts to see the effects of it, but one is still at this stage of the curve… and it's there that it's dangerous, because one falls easily into the trap of believing that the climatic change is not serious… but it's because one is still there, and the curve can very quickly start to climb, and when it starts to climb, the rhythm of change accelerates also.","fr":"On commence à en voir les effets, mais on en est encore à ce stade de la courbe… et c'est là que c'est dangereux, parce qu'on tombe facilement dans le piège de croire que le changement climatique n'est pas grave… mais c'est parce qu'on en est encore là, et la courbe peut très vite se mettre à monter, et quand elle commence à monter, le rythme du changement s'accélère aussi."},"EO3-9.14":{"en":"It would hit us pretty hard before we are ready.","l1":"That would hit us quite hard before we are ready.","fr":"Ça nous frapperait assez fort avant qu'on soit prêts."},"EO3-9.15":{"en":"So yea, it's really important to mitigate climate change in today's word.","l1":"So yes, it's really important to attenuate the climate change in the world of today.","fr":"Donc oui, c'est vraiment important d'atténuer le changement climatique dans le monde d'aujourd'hui."},"EO3-9.16":{"en":"The other pressing issue I was thinking of was the threat of nuclear warfare.","l1":"The other urgent problem I was thinking of, it was the menace of a nuclear war.","fr":"L'autre problème urgent auquel je pensais, c'était la menace d'une guerre nucléaire."},"EO3-9.17":{"en":"But now that I think about it, I think climate change is more pressing than that because I still like to believe that we, as a collective species, still agree on this concept of mutually assured destruction — that no one would actually use a nuclear weapon, because that would mean that the species of human beings would likely go extinct.","l1":"But now that I think of it, I think that climate change is more urgent than that, because I still have the desire to believe that we, as a species, collectively, we're always in agreement on this concept of mutual assured destruction, the idea that nobody would really use a nuclear weapon, because that would mean that the human species would probably go extinct.","fr":"Mais maintenant que j'y pense, je pense que le changement climatique est plus urgent que ça, parce que j'ai encore envie de croire que nous, en tant qu'espèce, collectivement, on est toujours d'accord sur ce concept de destruction mutuelle assurée, l'idée que personne n'utiliserait vraiment une arme nucléaire, parce que ça voudrait dire que l'espèce humaine s'éteindrait probablement."},"EO3-9.18":{"en":"With climate change, it’s sort of this thing where some governments do not prioritize it at all or do not take it into consideration because they’ve not really seeing enough impact caused by climate change, to be startled by the issue.","l1":"With climate change, we're a bit in a situation where certain governments don't make it a priority at all or don't take it into account, because they don't really see enough impact of climate change for the problem to alarm them.","fr":"Avec le changement climatique, on est un peu dans une situation où certains gouvernements n'en font pas du tout une priorité ou ne le prennent pas en compte, parce qu'ils ne voient pas vraiment assez d'impact du changement climatique pour que le problème les alarme."},"EO3-9.19":{"en":"Well...that's because we're still in this part of the graph.","l1":"Well… it's because one is still in this part of the curve.","fr":"Eh bien… c'est parce qu'on est encore dans cette partie de la courbe."},"EO3-9.20":{"en":"It's really important for us to be aware of this, and to not be complacent about this.","l1":"It's really important that we be conscious of it and that we don't take that lightly.","fr":"C'est vraiment important qu'on en soit conscients et qu'on ne prenne pas ça à la légère."},"EO3-9.21":{"en":"And we need to reverse our trajectory on this graph, because we do not want this graph to go up.","l1":"And we have to reverse the tendency on this curve, because we don't want this curve to go up.","fr":"Et il faut qu'on inverse la tendance sur cette courbe, parce qu'on ne veut pas que cette courbe monte."},"EO3-9.22":{"en":"Because if it does, it will hit us hard and fast and we will likely not be ready for it.","l1":"Because if it's the case, that is going to hit us hard and fast, and one will probably not be ready.","fr":"Parce que si c'est le cas, ça va nous frapper fort et vite, et on ne sera probablement pas prêts."},"EO3-10.01":{"en":"So I don’t necessarily play games of chance myself.","l1":"So me, I don't necessarily play games of chance.","fr":"Alors moi, je ne joue pas forcément aux jeux de hasard."},"EO3-10.02":{"en":"I’ve never gambled before in my life.","l1":"I have never played money in my life.","fr":"Je n'ai jamais joué d'argent de ma vie."},"EO3-10.03":{"en":"I know people who do.","l1":"I know people who play.","fr":"Je connais des gens qui jouent."},"EO3-10.04":{"en":"I would personally never play them because I know I have addictive tendencies.","l1":"Personally, I would never play at them, because I know that I have addictive tendencies.","fr":"Personnellement, je n'y jouerais jamais, parce que je sais que j'ai des tendances addictives."},"EO3-10.05":{"en":"I’ve never played games of chance because I recognized from an early age that I tend to have an addictive personality.","l1":"I have never played games of chance because I understood very young that I had rather an addictive personality.","fr":"Je n'ai jamais joué aux jeux de hasard parce que j'ai compris très jeune que j'avais plutôt une personnalité addictive."},"EO3-10.06":{"en":"When it came to TV shows, I always ended up binge-watching and stuff like that.","l1":"With TV series, I always ended up chaining the episodes, and this kind of things.","fr":"Avec les séries télé, je finissais toujours par enchaîner les épisodes, et ce genre de choses."},"EO3-10.07":{"en":"That’s also why I’ve never drunk alcohol.","l1":"It's also for that that I have never drunk alcohol.","fr":"C'est aussi pour ça que je n'ai jamais bu d'alcool."},"EO3-10.08":{"en":"I’ve never consumed tobacco in any sort of way.","l1":"I have never consumed tobacco, under any form.","fr":"Je n'ai jamais consommé de tabac, sous aucune forme."},"EO3-10.09":{"en":"I never opened the door to these sorts of activities to begin with because I know it can lead me down a dark path.","l1":"From the departure, I never opened the door to this kind of activities, because I know that it can drag me down a bad slope.","fr":"Dès le départ, je n'ai jamais ouvert la porte à ce genre d'activités, parce que je sais que ça peut m'entraîner sur une mauvaise pente."},"EO3-10.10":{"en":"I’m also a big believer in the fact that most things in moderation are fine, including games of chance.","l1":"I believe also a lot in the idea that most things are acceptable with moderation, including games of chance.","fr":"Je crois aussi beaucoup à l'idée que la plupart des choses sont acceptables avec modération, y compris les jeux de hasard."},"EO3-10.11":{"en":"I know friends of mine who just go to a casino, and they just spend a hundred dollars or something.","l1":"I have friends who go just to the casino and who spend just 100 dollars, something like that.","fr":"J'ai des amis qui vont juste au casino et qui dépensent juste 100 dollars, quelque chose comme ça."},"EO3-10.12":{"en":"They win some, they lose some; they end the night with like a hundred ninety dollars, they’re satisfied, they leave, and it’s just like a fun night experience.","l1":"They win a bit, they lose a bit, they finish the evening with about 190 dollars, they are satisfied, they go away, and it's just a nice evening.","fr":"Ils gagnent un peu, ils perdent un peu, ils finissent la soirée avec à peu près 190 dollars, ils sont satisfaits, ils s'en vont, et c'est juste une soirée sympa."},"EO3-10.13":{"en":"I don’t personally know someone who’s in huge gambling debt or anything of that nature.","l1":"Personally, I know nobody who has enormous gaming debts, or whatever it be of this kind.","fr":"Personnellement, je ne connais personne qui ait d'énormes dettes de jeu, ou quoi que ce soit de ce genre."},"EO3-10.14":{"en":"I also don’t know people who have won a lot of money from gambling.","l1":"I don't know either people who have won a lot of money at gaming.","fr":"Je ne connais pas non plus de gens qui aient gagné beaucoup d'argent au jeu."},"EO3-10.15":{"en":"So yea, in moderation, I think it’s fine, as long as you can control yourself.","l1":"So yes, with moderation, I think that it's okay, as long as one manages to control oneself.","fr":"Donc oui, avec modération, je pense que ça va, tant qu'on arrive à se contrôler."},"EO3-10.16":{"en":"I do think though that games of chance are becoming popular at an alarming rate, and I do feel a bit concerned about that.","l1":"On the other hand, I think really that games of chance are becoming popular at an alarming speed, and that worries me a bit.","fr":"Par contre, je pense vraiment que les jeux de hasard deviennent populaires à une vitesse alarmante, et ça m'inquiète un peu."},"EO3-10.17":{"en":"It’s only been one or two years that we’ve seen prediction markets really take over mainstream media.","l1":"That makes only one or two years that one really sees prediction markets invade the mainstream media.","fr":"Ça ne fait qu'un ou deux ans qu'on voit vraiment les marchés de prédiction envahir les médias grand public."},"EO3-10.18":{"en":"Back in the day, it used to be crypto, which people were kind of treating it like gambling.","l1":"At the time, it was crypto, that people saw a bit like a game of money.","fr":"À l'époque, c'était la crypto, que les gens voyaient un peu comme un jeu d'argent."},"EO3-10.19":{"en":"But now that prediction markets have become popular and mainstream, I’ve actually seen a huge influx of people start gambling for the first time, which it just makes it a lot more accessible.","l1":"But now that prediction markets have become popular and mainstream, I have in fact seen an enormous influx of people who start to bet for the first time, which renders quite simply gaming much more accessible.","fr":"Mais maintenant que les marchés de prédiction sont devenus populaires et grand public, j'ai en fait vu un énorme afflux de gens qui se mettent à parier pour la première fois, ce qui rend tout simplement le jeu beaucoup plus accessible."},"EO3-10.20":{"en":"They’ll have things like, “Do you think so-and-so person would say a certain word during this speech?”","l1":"They propose things like “Do you think that such person is going to say a certain word during this speech?”","fr":"Ils proposent des choses comme « Pensez-vous que telle personne va dire un certain mot pendant ce discours ? »"},"EO3-10.21":{"en":"You can even gamble on stuff like these days.","l1":"One can even bet on this kind of things in our days.","fr":"On peut même parier sur ce genre de choses de nos jours."},"EO3-10.22":{"en":"You can gamble on anything.","l1":"One can bet on no matter what.","fr":"On peut parier sur n'importe quoi."},"EO3-10.23":{"en":"I do feel concerned about it, even though everything in moderation is fine.","l1":"That worries me really, even if everything is acceptable with moderation.","fr":"Ça m'inquiète vraiment, même si tout est acceptable avec modération."},"EO3-10.24":{"en":"We have not seen gambling this prevalent before, I think, in the history of mankind.","l1":"One has never seen games of money so widespread, I think, in the history of humanity.","fr":"On n'a jamais vu les jeux d'argent aussi répandus, je pense, dans l'histoire de l'humanité."},"EO3-10.25":{"en":"And I don’t know where this will take us as a society.","l1":"And I don't know where that is going to lead us as a society.","fr":"Et je ne sais pas où ça va nous mener en tant que société."},"EO3-10.26":{"en":"I think it is predatory at times that these companies have taken over media this much, and that makes me a bit concerned.","l1":"I think that it's sometimes predatory that these companies have so much invaded the media, and that worries me a bit.","fr":"Je pense que c'est parfois prédateur que ces entreprises aient autant envahi les médias, et ça m'inquiète un peu."},"EO3-10.27":{"en":"Because not everyone will have self-control, right?","l1":"Because not everybody will know how to control themselves, no?","fr":"Parce que tout le monde ne saura pas se contrôler, non ?"},"EO3-10.28":{"en":"And seeing this many new people start gambling and stuff like this in the past year...yea it's definitely something.","l1":"And to see so many new people start to bet and this kind of things since a year… yes, it's clearly something.","fr":"Et voir autant de nouvelles personnes se mettre à parier et ce genre de choses depuis un an… oui, c'est clairement quelque chose."},"EO3-A.01":{"en":"Upon hearing this question, my first instinctive answer is to say no, it doesn't always guarantee attention and respect.","l1":"When I hear this question, my first reflex, it's to say no, that doesn't always guarantee attention and respect.","fr":"Quand j'entends cette question, mon premier réflexe, c'est de dire non, ça ne garantit pas toujours l'attention et le respect."},"EO3-A.02":{"en":"“Guarantee” is a strong word.","l1":"“To guarantee”, it's a big word.","fr":"« Garantir », c'est un grand mot."},"EO3-A.03":{"en":"To say that kindness always guarantees attention and respect would be to say that it is certain that if you're kind to someone, they will eventually give you attention and respect.","l1":"To say that kindness always guarantees the attention and the respect, that would be to say that it is certain that, if one is kind with someone, he will end up according us his attention and his respect.","fr":"Dire que la gentillesse garantit toujours l'attention et le respect, ce serait dire qu'il est certain que, si on est gentil avec quelqu'un, il finira par nous accorder son attention et son respect."},"EO3-A.04":{"en":"It's like a 100% likelihood, like it can be proven mathematically, no.","l1":"It's like a probability of 100%, as if that could be proven mathematically, no.","fr":"C'est comme une probabilité de 100 %, comme si ça pouvait se prouver mathématiquement, non."},"EO3-A.05":{"en":"That's why I wouldn't say it always guarantees it; it makes it more likely, for sure.","l1":"That's why I wouldn't say that it always guarantees them, it makes them more probable, that's sure.","fr":"Voilà pourquoi je ne dirais pas que ça les garantit toujours, ça les rend plus probables, c'est sûr."},"EO3-A.06":{"en":"I like to believe that humans are inherently good creatures and that we lean toward doing good more than doing harm, or at least that's what I like to believe.","l1":"I have the desire to believe that human beings are good by nature and that we have more tendency to do good than to do harm, or at least, that's what I have the desire to believe.","fr":"J'ai envie de croire que les êtres humains sont bons par nature et qu'on a plus tendance à faire le bien qu'à faire du mal, ou du moins, c'est ce que j'ai envie de croire."},"EO3-A.07":{"en":"Although it may not always guarantee attention and respect, I think if you're kind to someone, they'll remember it for sure.","l1":"Even if that maybe doesn't always guarantee the attention and the respect, I think that if one is kind with someone, he will remember it, that's sure.","fr":"Même si ça ne garantit peut-être pas toujours l'attention et le respect, je pense que si on est gentil avec quelqu'un, il s'en souviendra, c'est sûr."},"EO3-A.08":{"en":"I have this value that if someone has been kind to me, I think of myself as owing something to them.","l1":"One of my values, it's that if someone has been kind with me, I consider that I owe him something.","fr":"Une de mes valeurs, c'est que si quelqu'un a été gentil avec moi, je considère que je lui dois quelque chose."},"EO3-A.09":{"en":"I may not be able to repay that kindness immediately, always, but I always try to remember and remind myself that because they have been kind to me, I should give back to them.","l1":"I will perhaps not always be able to return the favor right away, but I always try to remember it and to remind myself that, since he has been kind with me, I should do something for him in return.","fr":"Je ne pourrai peut-être pas toujours rendre la pareille tout de suite, mais j'essaie toujours de m'en souvenir et de me rappeler que, comme il a été gentil avec moi, je devrais faire quelque chose pour lui en retour."},"EO3-A.10":{"en":"Now that I think more about this, there are also certain cases where, what people give respect to and what people give attention to may not always even correlate with kindness.","l1":"Now that I reflect on it a bit more, there are also certain cases where what people respect and what attracts their attention don't even necessarily have a relation with kindness.","fr":"Maintenant que j'y réfléchis un peu plus, il y a aussi certains cas où ce que les gens respectent et ce qui attire leur attention n'ont même pas forcément de rapport avec la gentillesse."},"EO3-A.11":{"en":"Will kindness get respect more often than not?","l1":"With kindness, does one obtain respect most of the time?","fr":"Avec la gentillesse, obtient-on le respect la plupart du temps ?"},"EO3-A.12":{"en":"For sure.","l1":"It's sure.","fr":"C'est sûr."},"EO3-A.13":{"en":"But for certain people, it is possible that being even a little bit mean  to them gets their attention and respect more.","l1":"But for certain people, it is possible that by being even a bit mean with them, one obtains more of their attention and their respect.","fr":"Mais pour certaines personnes, il est possible qu'en étant même un peu méchant avec elles, on obtienne davantage leur attention et leur respect."},"EO3-A.14":{"en":"There are people like that.","l1":"There are people like that.","fr":"Il y a des gens comme ça."},"EO3-A.15":{"en":"In certain cases, maybe because they are in a position where they have a lot of power or money, kindness may be a signal to them that this person wants something from them or needs something from them.","l1":"In certain cases, perhaps because they have a lot of power or money, kindness can be for them the sign that the person in front wants something from them or needs them for something.","fr":"Dans certains cas, peut-être parce qu'ils ont beaucoup de pouvoir ou d'argent, la gentillesse peut être pour eux le signe que la personne en face veut quelque chose d'eux ou a besoin d'eux pour quelque chose."},"EO3-A.16":{"en":"They could interpret it that way.","l1":"They could interpret it like that.","fr":"Ils pourraient l'interpréter comme ça."},"EO3-A.17":{"en":"Not being kind, but also not being cruel or rude, might earn those people more respect in certain people's minds.","l1":"Not being kind, but without being cruel or impolite either, that could earn these people more respect in the eyes of some.","fr":"Ne pas être gentil, mais sans être cruel ou impoli non plus, ça pourrait valoir à ces gens-là plus de respect aux yeux de certains."},"EO3-A.18":{"en":"All that to say, I don't think kindness always guarantees attention and respect.","l1":"All that to say that I don't think that kindness always guarantees the attention and the respect.","fr":"Tout ça pour dire que je ne pense pas que la gentillesse garantisse toujours l'attention et le respect."},"EO3-A.19":{"en":"It makes it more likely, for sure.","l1":"It makes them more probable, that's sure.","fr":"Ça les rend plus probables, c'est sûr."},"EO3-A.20":{"en":"That's probably all I have to say about this.","l1":"It's without doubt all that I have to say on that.","fr":"C'est sans doute tout ce que j'ai à dire là-dessus."},"EO3-B.01":{"en":"Alright, so do I think whether two different people can remain friends for life?","l1":"Okay, so, to my opinion, two different people, can they stay friends all their life?","fr":"D'accord, alors, à mon avis, deux personnes différentes peuvent-elles rester amies toute leur vie ?"},"EO3-B.02":{"en":"Well, that depends on how different they are, because I'm assuming if they are totally different, they would probably not be friends to begin with.","l1":"Well, it depends to what point they are different, because I suppose that if they were completely different, they would probably never have become friends.","fr":"Bon, ça dépend à quel point ils sont différents, parce que je suppose que s'ils étaient complètement différents, ils ne seraient sans doute jamais devenus amis."},"EO3-B.03":{"en":"We have to take into account the fact that people grow apart from each other.","l1":"One has to take into account the fact that people distance themselves from one another.","fr":"Il faut prendre en compte le fait que les gens s'éloignent les uns des autres."},"EO3-B.04":{"en":"If they were different from the start, they could grow to become more similar to each other...but if they grow apart more, then I don't really see them being friends for a long time, let alone being friends for life.","l1":"If they were different at the start, they could end up resembling each other more… but if they distance themselves even more, then I don't really see them staying friends for long, even less staying friends all their life.","fr":"S'ils étaient différents au départ, ils pourraient finir par se ressembler davantage… mais s'ils s'éloignent encore plus, alors je ne les vois pas vraiment rester amis longtemps, encore moins rester amis toute la vie."},"EO3-B.05":{"en":"Uh...Let me think of a scenario where two very different people can remain friends.","l1":"So… I am going to reflect on a scenario where two very different people can stay friends.","fr":"Alors… je vais réfléchir à un scénario où deux personnes très différentes peuvent rester amies."},"EO3-B.06":{"en":"I'm struggling to think of something like that because I feel like, to become friends with someone, you at least have to have something in common—because if you don't, I don't think you can become friends with someone, by definition of a friend—so... we're going to assume that in this case.","l1":"I have trouble finding something like that, because I have the impression that, to become friend with someone, one must at least have something in common, because otherwise, I don't think that one can become friend with someone, by definition of what is a friend, so… we are going to start from this principle here.","fr":"J'ai du mal à trouver quelque chose comme ça, parce que j'ai l'impression que, pour devenir ami avec quelqu'un, il faut au moins avoir quelque chose en commun, parce que sinon, je ne pense pas qu'on puisse devenir ami avec quelqu'un, par définition de ce qu'est un ami, donc… on va partir de ce principe ici."},"EO3-B.07":{"en":"As long as they have that one thing, or whatever they share in common, as long as they still have that—or there are shared values, maybe a shared environment in which they live, or a shared interest in something, a shared hobby, shared routines—then they can remain friends as long as that still remains.","l1":"As long as they have that thing there, or what they share in common, as long as they still have it, or there are common values, maybe a common environment where they live, or a common interest for something, a common hobby, common routines, then they can stay friends as long as that still exists.","fr":"Tant qu'ils ont cette chose-là, ou ce qu'ils partagent en commun, tant qu'ils l'ont encore, ou qu'il y a des valeurs communes, peut-être un environnement commun où ils vivent, ou un intérêt commun pour quelque chose, un loisir commun, des routines communes, alors ils peuvent rester amis tant que ça existe encore."},"EO3-B.08":{"en":"Even if they have other things apart from that common ground that kind of differentiate them, even if everything else other than that common ground is totally different, as long as it doesn't conflict with whatever they share as common ground, I think it is possible for them to remain friends for as long as the common ground remains.","l1":"Even if they have other things, apart from these common points, that differentiate them a bit, even if all the rest, outside of these common points, is completely different, as long as that does not enter into conflict with what they share as common points, I think that it is possible that they stay friends as long as these common points exist.","fr":"Même s'ils ont d'autres choses, à part ces points communs, qui les différencient un peu, même si tout le reste, en dehors de ces points communs, est complètement différent, tant que ça n'entre pas en conflit avec ce qu'ils partagent comme points communs, je pense qu'il est possible qu'ils restent amis aussi longtemps que ces points communs existent."},"EO3-B.09":{"en":"It also depends.","l1":"That depends too.","fr":"Ça dépend aussi."},"EO3-B.10":{"en":"You become friends with someone due to the common ground, but whatever differences you may have may or may not be a deal breaker, depending on how much you value the certain differences that you have.","l1":"One becomes friends with someone thanks to the common points, but the differences one can have can be deal breakers or not, depending on the importance one accords to those differences there.","fr":"On devient ami avec quelqu'un grâce aux points communs, mais les différences qu'on peut avoir peuvent être rédhibitoires ou pas, selon l'importance qu'on accorde à ces différences-là."},"EO3-B.11":{"en":"For example, maybe you share a common job, you're coworkers, you're sharing the same work environment, but maybe as you grow in life, it becomes a certain political belief becomes a deal breaker for you, for example.","l1":"For example, maybe that one has the same trade, one is colleagues, one shares the same environment of work, but maybe that in advancing in life, a certain political conviction becomes a deal-breaker for us, for example.","fr":"Par exemple, peut-être qu'on a le même métier, on est collègues, on partage le même environnement de travail, mais peut-être qu'en avançant dans la vie, une certaine conviction politique devient rédhibitoire pour nous, par exemple."},"EO3-B.12":{"en":"So as you grow in life, maybe you grow to value only people who share the same political beliefs as you, and if that person doesn't share that particular belief, then that person is no longer your friend.","l1":"So in advancing in life, maybe we come to accord importance only to people who share the same political convictions as us, and if this person doesn't share that conviction there, then this person is no longer our friend.","fr":"Donc en avançant dans la vie, peut-être qu'on en vient à n'accorder d'importance qu'aux gens qui partagent les mêmes convictions politiques que nous, et si cette personne ne partage pas cette conviction-là, alors cette personne n'est plus notre amie."},"EO3-B.13":{"en":"Maybe you grow in life to adopt that kind of rule, and in that case, then you wouldn't really be friends anymore.","l1":"Maybe that in advancing in life, we end up adopting that kind of rule, and in that case, we wouldn't really be friends anymore.","fr":"Peut-être qu'en avançant dans la vie, on finit par adopter ce genre de règle, et dans ce cas, on ne serait plus vraiment amis."},"EO3-B.14":{"en":"To conclude, it is possible, it can happen, but only as long as any of the differences you may have don't outweigh the common ground that you guys share.","l1":"To conclude, it's possible, it can happen, but only as long as the differences we can have don't win out over the common points we share.","fr":"Pour conclure, c'est possible, ça peut arriver, mais seulement tant que les différences qu'on peut avoir ne l'emportent pas sur les points communs qu'on partage."},"EO3-B.15":{"en":"Uh...yea I hope that makes sense.","l1":"So… yes, I hope that it's clear.","fr":"Alors… oui, j'espère que c'est clair."},"EO3-C.01":{"en":"Okay, do I think salary is the most important aspect of a job?","l1":"Well, is the salary, in my opinion, the most important aspect of a job?","fr":"Bon, le salaire est-il, à mon avis, l'aspect le plus important d'un travail ?"},"EO3-C.02":{"en":"It depends, like most answers to questions like this.","l1":"It depends, like for most questions of this kind.","fr":"Ça dépend, comme pour la plupart des questions de ce genre."},"EO3-C.03":{"en":"It depends on the stage of life you're in.","l1":"That depends on the stage of life where one finds oneself.","fr":"Ça dépend de l'étape de la vie où on se trouve."},"EO3-C.04":{"en":"If we break this question down, um...Any action you take is to fulfill a need, and there's this sort of Maslow's hierarchy of needs.","l1":"If one dissects this question… each action that one does, it's to satisfy a need, and there is what one calls the hierarchy of needs of Maslow.","fr":"Si on décortique cette question… chaque action qu'on fait, c'est pour satisfaire un besoin, et il y a ce qu'on appelle la hiérarchie des besoins de Maslow."},"EO3-C.05":{"en":"Some needs outweigh the others in terms of importance, and at the very bottom of this pyramid are basically survival needs: food, shelter, water, stuff like that.","l1":"Certain needs pass before the others, and all at the bottom of this pyramid, there are roughly the needs of survival, food, a roof, water, things like that.","fr":"Certains besoins passent avant les autres, et tout en bas de cette pyramide, il y a en gros les besoins de survie, la nourriture, un toit, l'eau, des choses comme ça."},"EO3-C.06":{"en":"If you're in a position in life where the foundational needs, survival needs, are not yet fulfilled, then yeah, nothing's more important than money because you need your salary to get shelter, get food, get water.","l1":"If one is at a stage of one's life where the fundamental needs, the survival needs, are not yet satisfied, then yes, nothing is more important than money, because one needs one's salary to have a roof, have something to eat, have water.","fr":"Si on est à un stade de sa vie où les besoins fondamentaux, les besoins de survie, ne sont pas encore satisfaits, alors oui, rien n'est plus important que l'argent, parce qu'on a besoin de son salaire pour avoir un toit, avoir à manger, avoir de l'eau."},"EO3-C.07":{"en":"If you're at risk of getting evicted, losing shelter, going weeks without nutritious food, then nothing's more important than money and your salary.","l1":"If one risks getting oneself expelled, finding oneself without a roof, passing weeks without eating correctly, then nothing is more important than money and one's salary.","fr":"Si on risque de se faire expulser, de se retrouver sans toit, de passer des semaines sans manger correctement, alors rien n'est plus important que l'argent et son salaire."},"EO3-C.08":{"en":"But if you jump one more tier higher, then comes other needs like the need for fulfillment, the need for belonging, relationships, stuff like that.","l1":"But if one climbs up one level, then other needs appear, like the need for fulfillment, the need for belonging, relationships, things like that.","fr":"Mais si on monte d'un niveau, alors d'autres besoins apparaissent, comme le besoin d'épanouissement, le besoin d'appartenance, les relations, des choses comme ça."},"EO3-C.09":{"en":"When you're in a stage of life where you can think about those higher tiers, it's more of asking yourself: \"What am I losing if I try to get more money, if I try to go for a job with a better or higher salary?\"","l1":"When we are at a stage of life where we can think about these superior levels, we ask ourselves rather: \"What do I lose if I try to earn more money, if I try to aim for a post with a better salary or a higher salary?\"","fr":"Quand on est à une étape de la vie où on peut penser à ces niveaux supérieurs, on se demande plutôt : « Qu'est-ce que je perds si j'essaie de gagner plus d'argent, si j'essaie de viser un poste avec un meilleur salaire ou un salaire plus élevé ? »"},"EO3-C.10":{"en":"It is sort of like a decision that you have to make, by comparing pros and cons.","l1":"It's a bit like a decision that one must take, while weighing the for and the against.","fr":"C'est un peu comme une décision qu'on doit prendre, en pesant le pour et le contre."},"EO3-C.11":{"en":"So if you're in those staegs, then it depends on what you find important in life.","l1":"So if one is at those stages there, then that depends on what one finds important in life.","fr":"Donc si on en est à ces étapes-là, alors ça dépend de ce qu'on trouve important dans la vie."},"EO3-C.12":{"en":"It depends on what your goals are, and if money is the bottleneck to the life that you want to live and the goals that you want to attain, then sure, salary would still be the most important aspect of a job for you.","l1":"That depends on our objectives, and if it's money that prevents us from leading the life that we want and from attaining our objectives, then of course, the salary will remain the most important aspect of a job for us.","fr":"Ça dépend de nos objectifs, et si c'est l'argent qui nous empêche de mener la vie qu'on veut et d'atteindre nos objectifs, alors bien sûr, le salaire restera l'aspect le plus important d'un travail pour nous."},"EO3-C.13":{"en":"But if your life goal is to simply spend time with people you love, maybe salary isn't the most important aspect of the job.","l1":"But if our goal in life, it's simply to pass time with the people we love, maybe the salary is not the most important aspect of the job.","fr":"Mais si notre but dans la vie, c'est simplement de passer du temps avec les gens qu'on aime, peut-être que le salaire n'est pas l'aspect le plus important du travail."},"EO3-C.14":{"en":"If we were to reframe this question a bit, if you were to choose between your current job where you have people you work with - co-workers and other people that you love and find fulfillment around - versus another job that pays more but lacks those things, and your North Star in life is whatever brings you more time to spend with people you love, whatever brings you fulfillment then salary wouldn't be the most important aspect of a job.","l1":"If one reformulated a bit the question, if one had to choose between our current job, where one has people with whom one works, colleagues and other people that one loves and near whom one blossoms, and another job that pays more but where one does not have all that, and if our compass in life, it was all that gives us more time to pass with the people that one loves, all that makes us blossom, then the salary would not be the most important aspect of a job.","fr":"Si on reformulait un peu la question, si on devait choisir entre notre travail actuel, où on a des gens avec qui on travaille, des collègues et d'autres personnes qu'on aime et auprès de qui on s'épanouit, et un autre travail qui paie plus mais où on n'a pas tout ça, et si notre boussole dans la vie, c'était tout ce qui nous donne plus de temps à passer avec les gens qu'on aime, tout ce qui nous épanouit, alors le salaire ne serait pas l'aspect le plus important d'un travail."},"EO3-C.15":{"en":"Same goes for when you have a purpose, like a particular purpose that you feel compelled to work towards, like helping the world in some type of way.","l1":"It's the same when one has a goal, well a precise goal that one feels pushed to pursue, like helping the world in one manner or another.","fr":"C'est pareil quand on a un but, enfin un but précis qu'on se sent poussé à poursuivre, comme aider le monde d'une manière ou d'une autre."},"EO3-C.16":{"en":"In that case, salary wouldn't necessarily be the most important aspect.","l1":"In this case, the salary would not necessarily be the most important aspect.","fr":"Dans ce cas, le salaire ne serait pas forcément l'aspect le plus important."},"EO3-C.17":{"en":"That's my opinion on this.","l1":"It's my opinion on that.","fr":"C'est mon avis là-dessus."},"EO3-D.01":{"en":"Upon hearing this question, my first instinctive answer is to say no.","l1":"When I hear this question, my first reflex, it's to say no.","fr":"Quand j'entends cette question, mon premier réflexe, c'est de dire non."},"EO3-D.02":{"en":"I don't think anyone can just take on a leadership role, whether it's in a department, store, or an organization.","l1":"I don't think that just anyone can take a leadership position like that, whether it be in a department, a store or an organization.","fr":"Je ne pense pas que n'importe qui puisse prendre un poste de direction comme ça, que ce soit dans un service, un magasin ou une organisation."},"EO3-D.03":{"en":"Like...no, haha.","l1":"Well… no, haha.","fr":"Enfin… non, haha."},"EO3-D.04":{"en":"First of all, being a leader—...well, ah, actually, now that I think about this, I think it might depend on the size of the organization or your workplace and what you do.","l1":"First, to be a leader… well, ah, in fact, now that I reflect on it, I think that it could depend on the size of the organisation or of the place of work, and of what one does.","fr":"D'abord, être dirigeant… bon, ah, en fait, maintenant que j'y réfléchis, je pense que ça pourrait dépendre de la taille de l'organisation ou du lieu de travail, et de ce qu'on fait."},"EO3-D.05":{"en":"But...hmm, even then, it's hard.","l1":"But… hmm, even in this case, it's difficult.","fr":"Mais… hum, même dans ce cas, c'est difficile."},"EO3-D.06":{"en":"I wouldn't say it's impossible; very few things in life are impossible.","l1":"I wouldn't say that it's impossible, very few things in life are impossible.","fr":"Je ne dirais pas que c'est impossible, très peu de choses dans la vie sont impossibles."},"EO3-D.07":{"en":"I try not to say anything is impossible.","l1":"I try not to say that something is impossible.","fr":"J'essaie de ne pas dire que quelque chose est impossible."},"EO3-D.08":{"en":"I try to believe that most things are possible.","l1":"I try to believe that most things are possible.","fr":"J'essaie de croire que la plupart des choses sont possibles."},"EO3-D.09":{"en":"Especially in a large organization—any organization with more than 50 people—being a leader requires you to make decisions, and the consequences of these decisions are propagated downward through the organizational structure.","l1":"Especially in a big organization, any organization of more than 50 people, being a director, that demands taking decisions, and the consequences of these decisions reverberate in cascade over the whole hierarchy.","fr":"Surtout dans une grande organisation, n'importe quelle organisation de plus de 50 personnes, être dirigeant, ça demande de prendre des décisions, et les conséquences de ces décisions se répercutent en cascade sur toute la hiérarchie."},"EO3-D.10":{"en":"Being a leader in a working team means that you have to make decisions, and to make decisions, you need to have experience, you need to have skills, and you need to have a lot of experience with what works, what factors could come into play, and what the risk profile is of any decision that you make.","l1":"To be at the head of a team of work, that wants to say that one must take decisions, and to take decisions, one must have experience, one must have competences, and one must have a lot of experience to know what works, what factors could enter into play and what is the risk profile of each decision that one takes.","fr":"Être à la tête d'une équipe de travail, ça veut dire qu'on doit prendre des décisions, et pour prendre des décisions, il faut avoir de l'expérience, il faut avoir des compétences, et il faut avoir beaucoup d'expérience pour savoir ce qui marche, quels facteurs pourraient entrer en jeu et quel est le profil de risque de chaque décision qu'on prend."},"EO3-D.11":{"en":"To make a good decision, you need to have had experiences in the past which help provide more input for you in order to make these judgments that decide the fate of your team that you're a leader for—or, if you're in a senior leadership role, departments...or even entire organizations.","l1":"To take a good decision, one must have already lived situations that help us to have more elements to carry these judgments that decide the fate of the team that one directs, or, if one is in the top direction, of departments… or even of entire organisations.","fr":"Pour prendre une bonne décision, il faut avoir déjà vécu des situations qui nous aident à avoir plus d'éléments pour porter ces jugements qui décident du sort de l'équipe qu'on dirige, ou, si on est dans la haute direction, de services… ou même d'organisations entières."},"EO3-D.12":{"en":"Right now, I'm in a junior role.","l1":"At the moment, I am in a junior position.","fr":"En ce moment, je suis à un poste junior."},"EO3-D.13":{"en":"I'm a junior software developer, and I cannot imagine taking on a leadership role...like, I don't think I should be a leader.","l1":"I am a junior developer, and I don't manage to imagine myself taking a post of direction… well, I don't think that it's up to me to direct.","fr":"Je suis développeur junior, et je n'arrive pas à m'imaginer prendre un poste de direction… enfin, je ne pense pas que ce soit à moi de diriger."},"EO3-D.14":{"en":"I don't have enough experience yet, and I don't have enough touchpoints with the rest of the organization to have a wide enough perspective to make those key decisions.","l1":"I don't yet have enough experience, and I don't have enough contacts with the rest of the organization to have a vision wide enough to make those key decisions.","fr":"Je n'ai pas encore assez d'expérience, et je n'ai pas assez de contacts avec le reste de l'organisation pour avoir une vision assez large pour prendre ces décisions clés."},"EO3-D.15":{"en":"Now, let's talk about a much smaller workplace—a small shop, maybe like a convenience store.","l1":"Now, let's talk about a much smaller workplace, a small shop, maybe a convenience store.","fr":"Maintenant, parlons d'un lieu de travail beaucoup plus petit, un petit commerce, peut-être une supérette."},"EO3-D.16":{"en":"And even in such a case, because you're asking whether \"anyone\" can take on a leadership role - i'd still say \"no\".","l1":"And even in this case, as the question asks if “no matter who” can take a post of direction, I would say all the same “no”.","fr":"Et même dans ce cas, comme la question demande si « n'importe qui » peut prendre un poste de direction, je dirais quand même « non »."},"EO3-D.17":{"en":"Like, \"anyone\" is a strong word.","l1":"I want to say, “no matter who”, it's a big word.","fr":"Je veux dire, « n'importe qui », c'est un grand mot."},"EO3-D.18":{"en":"It implies that you can just give a leadership role to even the junior, new hire, regardless of what workplace you work in.","l1":"That implies that one can quite simply give a post of direction even to the new junior employee, no matter where one works.","fr":"Ça sous-entend qu'on peut tout simplement donner un poste de direction même au nouvel employé junior, peu importe où on travaille."},"EO3-D.19":{"en":"You would not give a new hire a leadership role, if they're in a junior position.","l1":"One is not going to give a position with responsibilities to a new employee if he is junior.","fr":"On ne va pas donner un poste à responsabilités à un nouvel employé s'il est junior."},"EO3-D.20":{"en":"Whether it's in a small convenience store—in that case, the new hire might be a teenager—you wouldn't ask them to lead that convenience store after one day.","l1":"If it was in a small convenience store, where the new employee could be an adolescent, we would not ask him to direct this convenience store after one day.","fr":"Si c'était dans une petite supérette, où le nouvel employé pourrait être un adolescent, on ne lui demanderait pas de diriger cette supérette au bout d'une journée."},"EO3-D.21":{"en":"So yeah, my answer is no.","l1":"So yes, my answer, it's no.","fr":"Donc oui, ma réponse, c'est non."},"EO3-E.01":{"en":"Do I think stress is a good motivator?","l1":"Stress, is it, to my opinion, a good motor?","fr":"Le stress est-il, à mon avis, un bon moteur ?"},"EO3-E.02":{"en":"So first, let’s define the terms.","l1":"So first, let's define the terms.","fr":"Donc d'abord, définissons les termes."},"EO3-E.03":{"en":"This is something I like to do, because with these questions, there are a lot of possible answers based on how you interpret certain terms.","l1":"It's something that I like to do, because with these questions there, there are many possible answers according to the manner in which one interprets certain terms.","fr":"C'est quelque chose que j'aime faire, parce qu'avec ces questions-là, il y a beaucoup de réponses possibles selon la façon dont on interprète certains termes."},"EO3-E.04":{"en":"To me, I think there’s a distinction between \"stress\" and \"pressure\", or rather, the feeling of stress and the circumstance of being in a high-pressure scenario.","l1":"For me, I think that there is a distinction between \"stress\" and \"pressure\", or rather between the sensation of stress and the fact of finding oneself in a situation of strong pressure.","fr":"Pour moi, je pense qu'il y a une distinction entre « stress » et « pression », ou plutôt entre la sensation de stress et le fait de se trouver dans une situation de forte pression."},"EO3-E.05":{"en":"The latter is a good motivator, but I don’t think the \"feeling\" of stress is a good motivator.","l1":"The second is a good motor, but I don't think that the \"sensation\" of stress is a good motor.","fr":"La deuxième est un bon moteur, mais je ne pense pas que la « sensation » de stress soit un bon moteur."},"EO3-E.06":{"en":"That’s how I would sum up my opinion on this issue.","l1":"It's like that that I would summarise my opinion on this question.","fr":"C'est comme ça que je résumerais mon avis sur cette question."},"EO3-E.07":{"en":"So what do I mean by this?","l1":"So, what is it that I want to say by that?","fr":"Alors, qu'est-ce que je veux dire par là ?"},"EO3-E.08":{"en":"Stress... if I were to define the feeling of stress, it's basically when you feel that choking feeling inside your chest.","l1":"Stress… if I had to define the sensation of stress, it would be roughly when one feels this sensation of suffocation in the chest.","fr":"Le stress… si je devais définir la sensation de stress, ce serait en gros quand on ressent cette sensation d'étouffement dans la poitrine."},"EO3-E.09":{"en":"It’s like your heart is beating, you feel something stabbing inside your throat, and your vision becomes kinda blurry.","l1":"The heart beats, one feels like something that pierces through our throat, and the sight becomes a bit blurry.","fr":"Le cœur bat, on sent comme quelque chose qui nous transperce la gorge, et la vue devient un peu floue."},"EO3-E.10":{"en":"I think when you’re in this state, you make more bad decisions than you make good decisions... at least for me.","l1":"I think that when we are in this state, we take more bad decisions than good ones… in any case for me.","fr":"Je pense que quand on est dans cet état, on prend plus de mauvaises décisions que de bonnes… en tout cas pour moi."},"EO3-E.11":{"en":"I think it’s hard to think, let alone make a good decision.","l1":"I think that it's difficult to reflect, without speaking of making a good decision.","fr":"Je pense que c'est difficile de réfléchir, sans parler de prendre une bonne décision."},"EO3-E.12":{"en":"I’ve been in these sort of scenarios before a lot of times, and when I’m particularly in that state of anxiety, I kind of freeze.","l1":"I have already often found myself in this kind of situation, and especially when I am in this state of anxiety, I block, in a way.","fr":"Je me suis déjà souvent retrouvé dans ce genre de situation, et surtout quand je suis dans cet état d'anxiété, je me bloque, en quelque sorte."},"EO3-E.13":{"en":"Whereas, when you’re in a situation where there’s a deadline approaching that has a lot of stakes, but your mind is focused... you’re in a flow state.","l1":"On the other hand, when we are in a situation where there is a deadline that approaches, with big stakes, but we have the mind concentrated… we are in a state of flow.","fr":"Par contre, quand on est dans une situation où il y a une date limite qui approche, avec de gros enjeux, mais qu'on a l'esprit concentré… on est dans un état de flow."},"EO3-E.14":{"en":"You don’t feel any sort of anxiety.","l1":"One feels no form of anxiety.","fr":"On ne ressent aucune forme d'anxiété."},"EO3-E.15":{"en":"You’re calm, but you’re focused.","l1":"One is calm, but one is concentrated.","fr":"On est calme, mais on est concentré."},"EO3-E.16":{"en":"You know exactly what you have to do to meet that deadline... or to do whatever it is to make sure that you don’t face the consequences of this high-stakes scenario.","l1":"One knows exactly what one has to do to respect this limit date… or to do what is needed to be sure to not suffer the consequences of this situation with big stakes.","fr":"On sait exactement ce qu'on a à faire pour respecter cette date limite… ou pour faire ce qu'il faut pour être sûr de ne pas subir les conséquences de cette situation à gros enjeux."},"EO3-E.17":{"en":"And you're confronting it.","l1":"And one faces up to it.","fr":"Et on y fait face."},"EO3-E.18":{"en":"You're doing the work and nothing else.","l1":"One does the work, and nothing else.","fr":"On fait le travail, et rien d'autre."},"EO3-E.19":{"en":"And when I'm in that flow state, I don't know what it is about it, but I get far more work done and usually at a higher quality as well.","l1":"And when I am in this state of flow, I don't know what does that, but I knock out much more work, and in general of better quality too.","fr":"Et quand je suis dans cet état de flow, je ne sais pas ce qui fait ça, mais j'abats bien plus de travail, et en général de meilleure qualité aussi."},"EO3-E.20":{"en":"Some of the last-minute essays I wrote in college, just before the deadline, ended up being some of my best writing that I've ever done.","l1":"Certain of the essays that I wrote at the last minute at university, just before the deadline, ended up being part of what I have written best in my life.","fr":"Certaines des dissertations que j'ai écrites à la dernière minute à la fac, juste avant la date limite, ont fini par faire partie de ce que j'ai écrit de mieux dans ma vie."},"EO3-E.21":{"en":"Because I was just in a high-pressure scenario, I was not \"stressed\", I didn't have a thumping heartbeat or a stabbing feeling that was distracting me in that moment... which is how we defined stress.","l1":"Because I was just in a situation of strong pressure, I was not “stressed”, I did not have the heart that pounded nor a sharp pain that deconcentrated me at that moment… it's like that that we defined stress.","fr":"Parce que j'étais juste dans une situation de forte pression, je n'étais pas « stressé », je n'avais pas le cœur qui cognait ni de douleur aiguë qui me déconcentrait à ce moment-là… c'est comme ça qu'on a défini le stress."},"EO3-E.22":{"en":"That's my answer to this question.","l1":"It's my answer to this question.","fr":"C'est ma réponse à cette question."},"EO3-F.01":{"en":"Is it possible to develop the economy while preserving the environment?","l1":"Is it possible to develop the economy all while preserving the environment?","fr":"Est-il possible de développer l'économie tout en préservant l'environnement ?"},"EO3-F.02":{"en":"First of all, I just want to preface this by saying that I haven't done research on this extensively.","l1":"First of all, I want just to start by saying that I have not done in-depth researches on the subject.","fr":"Tout d'abord, je veux juste commencer par dire que je n'ai pas fait de recherches approfondies sur le sujet."},"EO3-F.03":{"en":"I think this is a very heavy question, probably one of the core questions of any political issue, because a lot of issues are tied to this particular question.","l1":"I think that it's a very big question, without doubt one of the central questions of no matter which political issue, because a lot of issues are linked to this question in particular.","fr":"Je pense que c'est une très grosse question, sans doute l'une des questions centrales de n'importe quel enjeu politique, parce que beaucoup d'enjeux sont liés à cette question en particulier."},"EO3-F.04":{"en":"Such a question needs extensive research, looking at a lot of data and information, for a viable conclusion.","l1":"This kind of question demands in-depth researches, with a lot of data and of information to study, to arrive at a valid conclusion.","fr":"Ce genre de question demande des recherches approfondies, avec beaucoup de données et d'informations à étudier, pour arriver à une conclusion valable."},"EO3-F.05":{"en":"But to answer the question...","l1":"But to answer to the question…","fr":"Mais pour répondre à la question…"},"EO3-F.06":{"en":"I don't think this is an either-or thing.","l1":"I don't think that it is the one or the other.","fr":"Je ne pense pas que ce soit l'un ou l'autre."},"EO3-F.07":{"en":"Rather, it's about how much you want to develop the economy and how much you want to preserve the environment.","l1":"It is rather about knowing to what point one wants to develop the economy and to what point one wants to preserve the environment.","fr":"Il s'agit plutôt de savoir à quel point on veut développer l'économie et à quel point on veut préserver l'environnement."},"EO3-F.08":{"en":"The question a country would have to ask is: is it possible to develop the economy to the extent that we want, while preserving the environment to the extent that we want, or while still meeting our sustainable development goals or our climate goals?","l1":"The question that a country should ask itself, it's: is it possible to develop the economy as much as one wants it, all while preserving the environment as much as one wants it, or all while reaching all the same our objectives of sustainable development or our climate objectives?","fr":"La question qu'un pays devrait se poser, c'est : est-il possible de développer l'économie autant qu'on le veut, tout en préservant l'environnement autant qu'on le veut, ou tout en atteignant quand même nos objectifs de développement durable ou nos objectifs climatiques ?"},"EO3-F.09":{"en":"I think most things in life are spectrums; they're not either-or, black-and-white.","l1":"I think that in life, most things are a question of cursor, it's not either the one or the other, all black or all white.","fr":"Je pense que dans la vie, la plupart des choses sont une question de curseur, ce n'est pas soit l'un s
