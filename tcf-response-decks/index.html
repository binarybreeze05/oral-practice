rhood food events, or sharing leftovers with neighbors.","l1":"It is through them that we make live our spirit of generosity, whether it be by getting up at the dawn to make offerings to the monks, by organizing each week neighborhood meals or by sharing our leftovers with our neighbors.","fr":"C'est à travers eux que nous faisons vivre notre esprit de générosité, que ce soit en nous levant aux aurores pour faire des offrandes aux moines, en organisant chaque semaine des repas de quartier ou en partageant nos restes avec nos voisins."},"EE2-4.06":{"en":"This is what I love about our eating habits: an undertone of generosity that defines our culture.","l1":"That is what I love in our eating habits, this foundation of generosity that defines our culture.","fr":"Voilà ce que j'aime dans nos habitudes alimentaires, ce fond de générosité qui définit notre culture."},"EE2-4.07":{"en":"That said, we could be making healthier choices.","l1":"That said, we could make healthier choices.","fr":"Cela dit, nous pourrions faire des choix plus sains."},"EE2-4.08":{"en":"Breakfast is often a bowl of fiery fish soup or oil-slicked noodles, which just made my mouth water writing it out, but is far from the gentle start your body needs in the morning.","l1":"Breakfast is often a bowl of well-spiced fish soup or of noodles coated in oil, which has just put the water in my mouth just from writing it, but which is far from the gentle start that the body needs in the morning.","fr":"Le petit-déjeuner est souvent un bol de soupe de poisson bien pimentée ou de nouilles nappées d'huile, ce qui vient de me mettre l'eau à la bouche rien que de l'écrire, mais qui est loin du démarrage en douceur dont le corps a besoin le matin."},"EE2-4.09":{"en":"We also adore milk tea, loaded with condensed milk and sugar: the cherry on top of the diabetes cake for a diet that's already carb-heavy.","l1":"We also adore milk tea, stuffed with condensed milk and sugar, the cherry on the diabetes cake for a diet already rich in carbohydrates.","fr":"Nous adorons aussi le thé au lait, bourré de lait concentré et de sucre, la cerise sur le gâteau du diabète pour une alimentation déjà riche en glucides."},"EE2-4.10":{"en":"Then again, if you ask me whether I've eaten yet at 7 am, at a lively neighborhood food event, I'll take that spicy fish soup any day.","l1":"On another side, if one asks me whether I have already eaten at 7 am, at a lively neighborhood meal, I take that spicy fish soup without hesitating.","fr":"D'un autre côté, si on me demande si j'ai déjà mangé à 7 h du matin, à un repas de quartier animé, je prends cette soupe de poisson pimentée sans hésiter."},"EE2-4.11":{"en":"Sue me.","l1":"I plead guilty.","fr":"Je plaide coupable."},"EE2-5.01":{"en":"**Riverside Film Festival: Worth the Hype?**","l1":"**Riverside Film Festival: at the height of the hype?**","fr":"**Riverside Film Festival : à la hauteur du battage ?**"},"EE2-5.02":{"en":"Throughout the entire month of June, it seemed almost impossible to escape the marketing campaigns for the Riverside Film Festival, which was being touted as \"the emblem of the next generation's filmography\".","l1":"During the whole month of June, it seemed almost impossible to escape the marketing campaigns of the Riverside Film Festival, which one vaunted as \"the emblem of the cinema of the new generation\".","fr":"Pendant tout le mois de juin, il semblait presque impossible d'échapper aux campagnes marketing du Riverside Film Festival, qu'on vantait comme « l'emblème du cinéma de la nouvelle génération »."},"EE2-5.03":{"en":"They got me.","l1":"They had me.","fr":"Ils m'ont eu."},"EE2-5.04":{"en":"I bit.","l1":"I bit at the hook.","fr":"J'ai mordu à l'hameçon."},"EE2-5.05":{"en":"How could I not?","l1":"How would I have been able to do otherwise?","fr":"Comment aurais-je pu faire autrement ?"},"EE2-5.06":{"en":"However, what I experienced last weekend fell far from that slogan.","l1":"Yet, what I lived last weekend was well far from that slogan.","fr":"Pourtant, ce que j'ai vécu le week-end dernier était bien loin de ce slogan."},"EE2-5.07":{"en":"I did see a few genuinely inspiring films from the students of our very own University of Riverside.","l1":"I did see a few films really inspiring, made by students from home, at the Université de Riverside.","fr":"J'ai bien vu quelques films vraiment inspirants, réalisés par des étudiants de chez nous, à l'Université de Riverside."},"EE2-5.08":{"en":"But that was pretty much it.","l1":"But that was about all.","fr":"Mais c'était à peu près tout."},"EE2-5.09":{"en":"Only 6 of the 20 films came from students.","l1":"Only 6 of the 20 films came from students.","fr":"Seuls 6 des 20 films venaient d'étudiants."},"EE2-5.10":{"en":"Whilst we were promised a buffet of student-made films by the marketing, what we got instead was a buffet of AI-generated slop.","l1":"While the marketing had promised us a buffet of films made by students, what we got in its place, it is a buffet of mush generated by IA.","fr":"Alors que le marketing nous avait promis un buffet de films faits par des étudiants, ce que nous avons eu à la place, c'est un buffet de bouillie générée par IA."},"EE2-5.11":{"en":"The remaining 14 films were all either fully or partialy AI-generated.","l1":"The 14 other films were all entirely or partially generated by IA.","fr":"Les 14 autres films étaient tous entièrement ou partiellement générés par IA."},"EE2-5.12":{"en":"It all started to make sense once the sponsors of the festival were revealed: \"Hybriz\" and \"a78y\", the two biggest AI video startups in the world.","l1":"Everything began to clear up once the sponsors of the festival unveiled, \"Hybriz\" and \"a78y\", the two biggest start-ups of video by IA in the world.","fr":"Tout a commencé à s'éclairer une fois les sponsors du festival dévoilés, « Hybriz » et « a78y », les deux plus grandes start-up de vidéo par IA au monde."},"EE2-5.13":{"en":"Yes, the AI films were unwatchably cringe, but that's almost beside the point.","l1":"Yes, the IA films were embarrassing to the point of being unwatchable, but that's not really the question.","fr":"Oui, les films IA étaient gênants au point d'être irregardables, mais ce n'est pas vraiment la question."},"EE2-5.14":{"en":"To stage and heavily market a film festival, of all things, only to have the AI films outnumber the human-made ones two-to-one, was definitely a choice.","l1":"To organize and massively promote a film festival, precisely, to finally find oneself with two times more IA films than films made by humans, that was clearly a choice.","fr":"Organiser et promouvoir massivement un festival de cinéma, justement, pour finalement se retrouver avec deux fois plus de films IA que de films faits par des humains, c'était clairement un choix."},"EE2-5.15":{"en":"It was a choice that felt like a betrayal to the audience, to the film students, and to the art of film itself.","l1":"It was a choice that made the effect of a betrayal towards the public, towards the students in cinema and towards the art of cinema itself.","fr":"C'était un choix qui faisait l'effet d'une trahison envers le public, envers les étudiants en cinéma et envers l'art du cinéma lui-même."},"EE2-6.01":{"en":"Hey everyone,","l1":"Hello to all,","fr":"Bonjour à tous,"},"EE2-6.02":{"en":"I'm looking for someone to hit the gym with after classes.","l1":"I am looking for someone with whom to go to the sports hall after the classes.","fr":"Je cherche quelqu'un avec qui aller à la salle de sport après les cours."},"EE2-6.03":{"en":"I've been lifting for about 6 months now, and the weights are getting heavier, so I'm starting to need a reliable spotter (also, it's always more fun to have a training partner!).","l1":"It's been about 6 months that I do weight training, and the loads are more and more heavy, so I am starting to have need of someone reliable to spot me (and then, it's always nicer to have a training partner!).","fr":"Ça fait environ 6 mois que je fais de la muscu, et les charges sont de plus en plus lourdes, donc je commence à avoir besoin de quelqu'un de fiable pour me parer (et puis, c'est toujours plus sympa d'avoir un partenaire d'entraînement !)."},"EE2-6.04":{"en":"I usually train after classes, between 3-4 pm on Mondays, Wednesdays and Fridays, and 9 am on Sundays.","l1":"I generally train after classes, between 3 pm and 4 pm on Mondays, Wednesdays and Fridays, and at 9 am on Sunday.","fr":"Je m'entraîne généralement après les cours, entre 15 h et 16 h les lundis, mercredis et vendredis, et à 9 h le dimanche."},"EE2-6.05":{"en":"I'm happy to work around your schedule too, as long as we finish before 7 pm on weekdays and before noon on Sundays.","l1":"I am quite willing also to adapt myself to your timetable, as long as we finish before 7 pm in the week and before noon on Sundays.","fr":"Je veux bien aussi m'adapter à votre emploi du temps, du moment qu'on finit avant 19 h en semaine et avant midi le dimanche."},"EE2-6.06":{"en":"DM me on IG @min_2005 if you're down!","l1":"Send me an MP on IG, @min_2005, if that tempts you!","fr":"Envoyez-moi un MP sur IG, @min_2005, si ça vous tente !"},"EE2-6.07":{"en":"I don't mind if you're a complete beginner.","l1":"That does not bother me if you are a big beginner.","fr":"Ça ne me dérange pas si vous êtes grand débutant."},"EE2-6.08":{"en":"In fact, if you are, I encourage you to reach out, because having a training partner helps with consistency, especially in the early days.","l1":"In fact, if that is the case, I encourage you to contact me, because having a training partner helps to stay regular, above all at the start.","fr":"En fait, si c'est le cas, je vous encourage à me contacter, parce qu'avoir un partenaire d'entraînement aide à rester régulier, surtout au début."},"EE2-7.01":{"en":"Dear Editor,","l1":"Dear editorial staff,","fr":"Chère rédaction,"},"EE2-7.02":{"en":"I believe taking a year off to travel is riskier not to do than to do, provided you do so within the right time window.","l1":"I think that it is more risky to not take a year to travel than to take it, on condition of doing it at the right moment.","fr":"Je pense qu'il est plus risqué de ne pas prendre une année pour voyager que de la prendre, à condition de le faire au bon moment."},"EE2-7.03":{"en":"I was that guy who wanted to \"be ahead of everyone else\".","l1":"I was the guy who wanted to \"be ahead of everyone\".","fr":"J'étais le gars qui voulait « être en avance sur tout le monde »."},"EE2-7.04":{"en":"I finished college at age 20 and immediately started a six-figure tech career.","l1":"I finished my studies at 20 years old and I right away started a career in tech with a six-figure salary.","fr":"J'ai fini mes études à 20 ans et j'ai tout de suite commencé une carrière dans la tech avec un salaire à six chiffres."},"EE2-7.05":{"en":"Three years later, I'm in a senior role with enough savings for a down payment.","l1":"Three years later, I occupy a post with responsibilities and I have enough savings for a down payment.","fr":"Trois ans plus tard, j'occupe un poste à responsabilités et j'ai assez d'économies pour un apport."},"EE2-7.06":{"en":"From the outside, I look successful.","l1":"Seen from the exterior, I have the air of having succeeded.","fr":"Vu de l'extérieur, j'ai l'air d'avoir réussi."},"EE2-7.07":{"en":"But inside, something feels off.","l1":"But on the interior, something is off.","fr":"Mais à l'intérieur, quelque chose cloche."},"EE2-7.08":{"en":"All I've known is school and work.","l1":"All that I have known, it is the school and the work.","fr":"Tout ce que j'ai connu, c'est l'école et le travail."},"EE2-7.09":{"en":"I don't feel like I have enough perspective on life to know what I truly want.","l1":"I do not have the impression of having enough distance on life to know what I really want.","fr":"Je n'ai pas l'impression d'avoir assez de recul sur la vie pour savoir ce que je veux vraiment."},"EE2-7.10":{"en":"I think travelling gives you this perspective: compressing years' worth of life experience into a short period, meeting people from different cultures, and learning how they see life.","l1":"I think that travelling gives this step back, by condensing in little time the equivalent of several years of life experience, by meeting people of different cultures and by discovering their way of seeing life.","fr":"Je pense que voyager donne ce recul, en condensant en peu de temps l'équivalent de plusieurs années d'expérience de vie, en rencontrant des gens de cultures différentes et en découvrant leur façon de voir la vie."},"EE2-7.11":{"en":"It would've been smarter to have this alignment first, before devoting years to a path I chose with limited information.","l1":"It would have been smarter to have this alignment first, before consecrating years to a path that I chose with limited information.","fr":"Il aurait été plus malin d'avoir cet alignement d'abord, avant de consacrer des années à une voie que j'ai choisie avec des informations limitées."},"EE2-7.12":{"en":"What if this really is not what I want?","l1":"And if this really was not what I want?","fr":"Et si ce n'était vraiment pas ce que je veux ?"},"EE2-7.13":{"en":"That's years wasted.","l1":"These are lost years.","fr":"Ce sont des années perdues."},"EE2-7.14":{"en":"So if you're between the ages of 18 and 23, this is the time to travel.","l1":"So if you are between 18 and 23 years old, it is the moment to travel.","fr":"Alors si vous avez entre 18 et 23 ans, c'est le moment de voyager."},"EE2-7.15":{"en":"Moving slow in the right direction is better than moving fast in the wrong direction.","l1":"Advancing slowly in the right direction, it's better than advancing fast in the wrong one.","fr":"Avancer lentement dans la bonne direction, c'est mieux qu'avancer vite dans la mauvaise."},"EE2-7.16":{"en":"Yours sincerely,","l1":"Well to you,","fr":"Bien à vous,"},"EE2-7.17":{"en":"Min","l1":"Min","fr":"Min"},"EE2-8.01":{"en":"**This Tweet Got 50M Views**","l1":"**This tweet has made 50 million views**","fr":"**Ce tweet a fait 50 millions de vues**"},"EE2-8.02":{"en":"Should we have a television in the bedroom?","l1":"Must one have a television in the bedroom?","fr":"Faut-il avoir une télévision dans la chambre ?"},"EE2-8.03":{"en":"This debate has been going viral on social media for the past week.","l1":"This debate has been inflaming the social networks for a week.","fr":"Ce débat enflamme les réseaux sociaux depuis une semaine."},"EE2-8.04":{"en":"Apparently, we've run out of things to argue about.","l1":"Apparently, we are short of subjects of dispute.","fr":"Apparemment, on est à court de sujets de dispute."},"EE2-8.05":{"en":"I personally don't have a television in my bedroom.","l1":"Personally, I do not have a television in my bedroom.","fr":"Personnellement, je n'ai pas de télévision dans ma chambre."},"EE2-8.06":{"en":"My bedroom is for one thing only, and that is sleep.","l1":"My bedroom serves only for one single thing, sleeping.","fr":"Ma chambre ne sert qu'à une seule chose, dormir."},"EE2-8.07":{"en":"In fact, I don't even allow myself to bring my phone into the bedroom.","l1":"In fact, I do not even authorize myself to bring my phone into the bedroom.","fr":"En fait, je ne m'autorise même pas à apporter mon téléphone dans la chambre."},"EE2-8.08":{"en":"Sleep scientists find that reserving your bedroom exclusively for sleep improves its quality, which in turn leads to better mood, recovery and decision-making.","l1":"Sleep specialists observe that reserving one's bedroom exclusively for sleep improves its quality, which brings in its turn a better mood, a better recovery and a better decision-making.","fr":"Les spécialistes du sommeil constatent que réserver sa chambre exclusivement au sommeil en améliore la qualité, ce qui entraîne à son tour une meilleure humeur, une meilleure récupération et une meilleure prise de décision."},"EE2-8.09":{"en":"That being said, not everyone is a huge health nerd like I am.","l1":"That said, not everybody is as obsessed with health as me.","fr":"Cela dit, tout le monde n'est pas aussi obsédé par la santé que moi."},"EE2-8.10":{"en":"Some of you would gladly sacrifice some sleep quality to use your bedroom as a leisure space.","l1":"Some of you would willingly sacrifice a little the quality of their sleep to make of their bedroom a place of relaxation.","fr":"Certains d'entre vous sacrifieraient volontiers un peu la qualité de leur sommeil pour faire de leur chambre un lieu de détente."},"EE2-8.11":{"en":"And I must admit, watching TV in bed sounds genuinely relaxing.","l1":"And I must admit that watching TV in bed looks really relaxing.","fr":"Et je dois admettre que regarder la télé au lit a l'air vraiment relaxant."},"EE2-8.12":{"en":"You know what's not relaxing?","l1":"You know what is not relaxing?","fr":"Vous savez ce qui n'est pas relaxant ?"},"EE2-8.13":{"en":"Staying up late, scrolling social media, and arguing with strangers online.","l1":"Going to bed late, hanging around on the social networks and arguing with strangers online.","fr":"Se coucher tard, traîner sur les réseaux sociaux et se disputer avec des inconnus en ligne."},"EE2-9.01":{"en":"Hey Paul and Naima,","l1":"Hello Paul and Naima,","fr":"Bonjour Paul et Naima,"},"EE2-9.02":{"en":"That sounds lovely, ugh...","l1":"That has the air of being great, oh la la…","fr":"Ça a l'air génial, ah là là…"},"EE2-9.03":{"en":"I just love seeing people take unconventional risks to chase what they actually want.","l1":"I adore seeing people take unconventional risks to go looking for what they really want.","fr":"J'adore voir des gens prendre des risques peu conventionnels pour aller chercher ce qu'ils veulent vraiment."},"EE2-9.04":{"en":"Honestly, I think a lot of people dream of doing something like this, but never end up taking that leap (which you did!)","l1":"Honestly, I think that a lot of people dream of doing something like that, but never end up making the big leap (which you did, you!)","fr":"Honnêtement, je pense que beaucoup de gens rêvent de faire quelque chose comme ça, mais ne finissent jamais par faire le grand saut (ce que vous avez fait, vous !)"},"EE2-9.05":{"en":"That leap for me is going all-in on Hyros, a free exam-revision app I built when I was 16.","l1":"For me, this big leap, it is betting everything on Hyros, a free exam-revision app that I created when I was 16 years old.","fr":"Pour moi, ce grand saut, c'est tout miser sur Hyros, une appli gratuite de révision pour les examens que j'ai créée quand j'avais 16 ans."},"EE2-9.06":{"en":"I really want to start monetizing it because it now has over 10k daily users, but I just don't have enough time outside my 9-to-5 to maintain the level of product quality that monetization calls for.","l1":"I really have the desire to start to monetize it because it now has more than 10,000 users per day, but I simply do not have enough time outside of my job from 9 am to 5 pm to maintain the level of quality of the product that the monetization demands.","fr":"J'ai vraiment envie de commencer à la monétiser parce qu'elle a maintenant plus de 10 000 utilisateurs par jour, mais je n'ai tout simplement pas assez de temps en dehors de mon boulot de 9 h à 17 h pour maintenir le niveau de qualité du produit que demande la monétisation."},"EE2-9.07":{"en":"I'm willing to quit my job and move somewhere with lower living costs so I have more runway to build Hyros, but my main fear is starting a social life from scratch and being away from my family.","l1":"I am ready to quit my job and to install myself somewhere where the cost of living is lower, so as to have more margin to develop Hyros, but my biggest fear, it is to build myself a social life starting from zero and to be far from my family.","fr":"Je suis prêt à quitter mon travail et à m'installer quelque part où le coût de la vie est plus bas, de façon à avoir plus de marge pour développer Hyros, mais ma plus grande peur, c'est de me construire une vie sociale en partant de zéro et d'être loin de ma famille."},"EE2-9.08":{"en":"Did either of you have that fear as well?","l1":"Did one of you two have the same fear?","fr":"L'un de vous deux a-t-il eu la même peur ?"},"EE2-9.09":{"en":"And if so, how did you deal with it?","l1":"And if yes, how did you manage it?","fr":"Et si oui, comment l'avez-vous gérée ?"},"EE2-10.01":{"en":"Subject: Welcome Day - What You Need to Know","l1":"Object: Day of welcome, what you must know","fr":"Objet : Journée d'accueil, ce que vous devez savoir"},"EE2-10.02":{"en":"Dear students,","l1":"Dear students,","fr":"Chers étudiants,"},"EE2-10.03":{"en":"I am delighted to welcome you to our institution and to invite you to our upcoming Welcome Day.","l1":"I am delighted to welcome you into our establishment and to invite you to our next Journée d'accueil.","fr":"Je suis ravi de vous accueillir dans notre établissement et de vous inviter à notre prochaine Journée d'accueil."},"EE2-10.04":{"en":"Date & Time: Tuesday, 28 July, 9 am to 5 pm","l1":"Date and time: Tuesday 28 July, from 9 am to 5 pm","fr":"Date et heure : mardi 28 juillet, de 9h à 17h"},"EE2-10.05":{"en":"Location: Multipurpose Room, Building C","l1":"Place: multipurpose room, building C","fr":"Lieu : salle polyvalente, bâtiment C"},"EE2-10.06":{"en":"The agenda includes orientation sessions, campus tours, and fun activities designed to help you connect with your peers.","l1":"The programme includes information meetings, visits of the campus and playful activities thought up to help you get to know your classmates.","fr":"Le programme comprend des réunions d'information, des visites du campus et des activités ludiques pensées pour vous aider à faire connaissance avec vos camarades."},"EE2-10.07":{"en":"Please arrive by 8:30 am to allow enough time for check-in.","l1":"Thank you for arriving before 8:30 am in order to have enough time for the check-in.","fr":"Merci d'arriver avant 8h30 afin d'avoir assez de temps pour l'enregistrement."},"EE2-10.08":{"en":"Do not forget your student ID as you will need it to check in.","l1":"Do not forget your student card, because you will need it to check yourself in.","fr":"N'oubliez pas votre carte d'étudiant, car vous en aurez besoin pour vous enregistrer."},"EE2-10.09":{"en":"Lunch and refreshments will be provided.","l1":"Lunch and refreshments will be offered to you.","fr":"Le déjeuner et des rafraîchissements vous seront offerts."},"EE2-10.10":{"en":"Please complete this [online form] by 14 June to submit your meal preference and dietary restrictions (if any).","l1":"Thank you for filling in this [online form] before 14 June to indicate your choice of meal and your eventual dietary restrictions.","fr":"Merci de remplir ce [formulaire en ligne] avant le 14 juin pour indiquer votre choix de repas et vos éventuelles restrictions alimentaires."},"EE2-10.11":{"en":"Should you have any questions, please do not hesitate to contact the Student Office at studentlife@brcollege.com.","l1":"If you have questions, do not hesitate to contact the Bureau of the Students at the address studentlife@brcollege.com.","fr":"Si vous avez des questions, n'hésitez pas à contacter le Bureau des étudiants à l'adresse studentlife@brcollege.com."},"EE2-10.12":{"en":"We look forward to meeting you all in person.","l1":"We have haste to meet you all in person.","fr":"Nous avons hâte de tous vous rencontrer en personne."},"EE2-10.13":{"en":"Best regards,","l1":"Very cordially,","fr":"Bien cordialement,"},"EE2-10.14":{"en":"Min","l1":"Min","fr":"Min"},"EE2-10.15":{"en":"Student Life Coordinator","l1":"Coordinator of the student life","fr":"Coordinateur de la vie étudiante"},"EE2-11.01":{"en":"Subject: Poor Experience with Gold Package","l1":"Object: Bad experience with the formula Gold Package","fr":"Objet : Mauvaise expérience avec la formule Gold Package"},"EE2-11.02":{"en":"Dear Customer Service,","l1":"Madame, Monsieur,","fr":"Madame, Monsieur,"},"EE2-11.03":{"en":"I just returned from my trip to Buenos Aires, booked through your agency under the Gold Package.","l1":"I have just come back from my trip to Buenos Aires, reserved with your agency with the Gold Package formula.","fr":"Je viens de rentrer de mon voyage à Buenos Aires, réservé auprès de votre agence avec la formule Gold Package."},"EE2-11.04":{"en":"Unfortunately, my experience fell significantly short of the standards advertised for the package I bought.","l1":"Unfortunately, my experience has been clearly below the standards announced for the formula that I bought.","fr":"Malheureusement, mon expérience a été nettement en dessous des standards annoncés pour la formule que j'ai achetée."},"EE2-11.05":{"en":"Firstly, I was given confirmation that my ticket already included two 23kg checked bags.","l1":"Firstly, one confirmed to me that my ticket already comprised two checked bags of 23 kg.","fr":"Premièrement, on m'a confirmé que mon billet comprenait déjà deux bagages en soute de 23 kg."},"EE2-11.06":{"en":"When I got to the airport, I found out this wasn't true, and I was charged $210 for the additional bag.","l1":"When I arrived at the airport, I discovered that it was not true, and one billed me 210 dollars for the supplementary bag.","fr":"Quand je suis arrivé à l'aéroport, j'ai découvert que ce n'était pas vrai, et on m'a facturé 210 dollars pour le bagage supplémentaire."},"EE2-11.07":{"en":"Moreover, I did not feel safe at all at the hotel arranged by your agency.","l1":"What is more, I did not at all feel in security at the hotel reserved by your agency.","fr":"De plus, je ne me suis pas du tout senti en sécurité à l'hôtel réservé par votre agence."},"EE2-11.08":{"en":"Not only was it in a sketchy neighborhood far from the city center, but I also received unsolicited stares from strangers loitering around the hotel.","l1":"Not only was it situated in a shady neighborhood, far from the city center, but on top of that I got stared down by strangers who were hanging around the hotel.","fr":"Non seulement il était situé dans un quartier louche, loin du centre-ville, mais en plus je me suis fait dévisager par des inconnus qui traînaient autour de l'hôtel."},"EE2-11.09":{"en":"I ended up staying somewhere else at my own expense.","l1":"I ended up lodging elsewhere at my own expense.","fr":"J'ai fini par loger ailleurs à mes frais."},"EE2-11.10":{"en":"For these reasons, I believe it is only fair to request a refund of at least 50%.","l1":"For these reasons, I think that it is legitimate to ask for a refund of at least 50%.","fr":"Pour ces raisons, je pense qu'il est légitime de demander un remboursement d'au moins 50 %."},"EE2-11.11":{"en":"I look forward to your response.","l1":"I remain awaiting your response.","fr":"Je reste dans l'attente de votre réponse."},"EE2-11.12":{"en":"Regards,","l1":"Please accept, Madame, Monsieur, the expression of my distinguished salutations.","fr":"Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées."},"EE2-11.13":{"en":"Min","l1":"Min","fr":"Min"},"EE3-1.01":{"en":"The issue is more nuanced than being \"for or against\" free public-transit.","l1":"The question of free access to public transit is more nuanced than a simple \"for or against\".","fr":"La question de la gratuité des transports en commun est plus nuancée qu'un simple « pour ou contre »."},"EE3-1.02":{"en":"Firstly, it is important to recognize that the increase in economic activity that free public transit generates, which Document A highlighted, pays back for lost revenue.","l1":"First of all, it is important to recognize that free public transport generates more economic activity, which document A underlined, and that this rise compensates the lost earnings.","fr":"Tout d'abord, il est important de reconnaître que la gratuité des transports en commun génère plus d'activité économique, ce qu'a souligné le document A, et que cette hausse compense le manque à gagner."},"EE3-1.03":{"en":"The question though is whether or not it pays back enough to justify not deploying this money to other causes for a bigger return.","l1":"But the question, it is to know if that brings in enough to justify that one does not put this money in other causes that would have a better return.","fr":"Mais la question, c'est de savoir si cela rapporte assez pour justifier qu'on ne mette pas cet argent dans d'autres causes qui auraient un meilleur rendement."},"EE3-1.04":{"en":"To cite Document B's example, if designing green spaces generate more value per dollar than investment in free public transit, then the city of Denver should absolutely do that.","l1":"To take back the example of document B, if laying out green spaces generates more value per dollar than investing in free public transport, then the city of Denver should absolutely do it.","fr":"Pour reprendre l'exemple du document B, si aménager des espaces verts génère plus de valeur par dollar qu'investir dans la gratuité des transports en commun, alors la ville de Denver devrait absolument le faire."},"EE3-1.05":{"en":"Furthermore, although I agree with Document B's emphasis on extending public transit, lifting fares is a faster lever, from which we see results within weeks, not years.","l1":"Moreover, even if I am in agreement with document B to put the accent on the extension of the network of public transport, passing to free, it is a faster lever, of which one sees the results in a few weeks and not in a few years.","fr":"De plus, même si je suis d'accord avec le document B pour mettre l'accent sur l'extension du réseau de transports en commun, passer à la gratuité, c'est un levier plus rapide, dont on voit les résultats en quelques semaines et non en quelques années."},"EE3-1.06":{"en":"It is also a more easily reversible decision.","l1":"It's also a decision on which we can go back more easily.","fr":"C'est aussi une décision sur laquelle on peut revenir plus facilement."},"EE3-1.07":{"en":"Lastly, I disagree with Document B's claim about the loss of respect for public equipment if it becomes free.","l1":"Finally, I am not in agreement with the affirmation of document B according to which one would respect less the public equipment if it became free.","fr":"Enfin, je ne suis pas d'accord avec l'affirmation du document B selon laquelle on respecterait moins les équipements publics s'ils devenaient gratuits."},"EE3-1.08":{"en":"We have not seen more frequent vandalism on vehicles in countries where transit became free.","l1":"In the countries where transport became free, one has not seen more vandalism in the vehicles.","fr":"Dans les pays où les transports sont devenus gratuits, on n'a pas vu plus de vandalisme dans les véhicules."},"EE3-2.01":{"en":"Both documents raise valid points.","l1":"The two documents advance valid arguments.","fr":"Les deux documents avancent des arguments valables."},"EE3-2.02":{"en":"To add to Document A's argument, even if you do not become friends with your roommate as described in Document A, the mere observer effect from being around another human keeps you subconsciously accountable.","l1":"To complete the argument of document A, even if you do not bind yourself in friendship with your roommate as document A describes it, the simple observer effect linked to the presence of another human being makes you responsible unconsciously.","fr":"Pour compléter l'argument du document A, même si vous ne vous liez pas d'amitié avec votre colocataire comme le décrit le document A, le simple effet d'observateur lié à la présence d'un autre être humain vous responsabilise inconsciemment."},"EE3-2.03":{"en":"You are less likely to fall into a rabbit hole of bad habits like ordering fast food or neglecting basic hygiene.","l1":"You risk less sinking into a spiral of bad habits, like ordering fast food or neglecting basic hygiene.","fr":"Vous risquez moins de vous enfoncer dans une spirale de mauvaises habitudes, comme commander de la restauration rapide ou négliger l'hygiène de base."},"EE3-2.04":{"en":"However, regardless of the potential for benefits, shared living always carries an asymmetric risk that even Document B failed to highlight: it is not an easily reversible decision.","l1":"However, whatever the potential advantages may be, flat-sharing always carries an asymmetric risk that even document B omitted to underline: it is not a decision easily reversible.","fr":"Cependant, quels que soient les avantages potentiels, la colocation comporte toujours un risque asymétrique que même le document B a omis de souligner : ce n'est pas une décision facilement réversible."},"EE3-2.05":{"en":"Even if compatibility seems strong in the first few months, things can be completely different further down the line, in ways you could never have predicted.","l1":"Even if the understanding seems solid the first months, things can be completely different afterwards, in a way that you could never have foreseen.","fr":"Même si l'entente semble solide les premiers mois, les choses peuvent être complètement différentes par la suite, d'une façon que vous n'auriez jamais pu prévoir."},"EE3-2.06":{"en":"Not only does no one want to move frequently, moving itself also becomes considerably harder in shared living scenarios.","l1":"Not only does nobody want to move often, but in flat-sharing, the move itself also becomes clearly more difficult.","fr":"Non seulement personne ne veut déménager souvent, mais en colocation, le déménagement lui-même devient aussi nettement plus difficile."},"EE3-2.07":{"en":"Since you likely cannot afford your own place, you would have to find a new roommate on top of a new apartment.","l1":"As you probably do not have the means to have your own lodging, you would have to find a new roommate on top of a new apartment.","fr":"Comme vous n'avez probablement pas les moyens d'avoir votre propre logement, il vous faudrait trouver un nouveau colocataire en plus d'un nouvel appartement."},"EE3-2.08":{"en":"This asymmetry is compounded by the fact that conflicts at home, the one place you cannot escape, contaminate every other area of your life.","l1":"What aggravates this asymmetry, it is that the conflicts at home, the only place that you cannot flee, contaminate all the other domains of your life.","fr":"Ce qui aggrave cette asymétrie, c'est que les conflits à la maison, le seul endroit que vous ne pouvez pas fuir, contaminent tous les autres domaines de votre vie."},"EE3-3.01":{"en":"Both documents make subtle generalizations, glossing over the highly contextual nature of deciding to homeschool a child.","l1":"The two documents generalize in a subtle manner and pass under silence to what point the decision to school a child at home depends on the context.","fr":"Les deux documents généralisent de manière subtile et passent sous silence à quel point la décision de scolariser un enfant à domicile dépend du contexte."},"EE3-3.02":{"en":"Document A insinuates that homeschooling offers a less stressful learning experience.","l1":"Document A insinuates that schooling at home offers a less stressful learning experience.","fr":"Le document A insinue que la scolarisation à domicile offre une expérience d'apprentissage moins stressante."},"EE3-3.03":{"en":"However, some children feel more pressure being around their parents, leading to a claustrophobic environment in the one place they seek refuge.","l1":"Yet, certain children feel more pressure when they're with their parents, which creates a suffocating environment in the only place where they seek refuge.","fr":"Pourtant, certains enfants ressentent plus de pression quand ils sont avec leurs parents, ce qui crée un environnement étouffant dans le seul endroit où ils cherchent refuge."},"EE3-3.04":{"en":"Moreover, the touted \"individualized teaching approach\" hinges on the premise that the parents can competently deliver a pedagogically sound curriculum, otherwise it is outright parental malpractice.","l1":"Moreover, the \"individualized teaching approach\" so much vaunted rests on the postulate that the parents have the competences to dispense a solid pedagogical program, without which it is purely and simply a parental fault.","fr":"De plus, l'« approche d'enseignement individualisée » tant vantée repose sur le postulat que les parents ont les compétences pour dispenser un programme pédagogique solide, sans quoi il s'agit purement et simplement d'une faute parentale."},"EE3-3.05":{"en":"On the other hand, Document B brushes past the comparable palette of social interactions, often of higher variety, that homeschooling can provide through community involvement, volunteer work, and mentorships.","l1":"On the other hand, document B passes rapidly over the comparable range of social interactions, often more varied, that school at home can offer thanks to associative life, volunteering and mentoring.","fr":"En revanche, le document B passe rapidement sur l'éventail comparable d'interactions sociales, souvent plus variées, que l'école à la maison peut offrir grâce à la vie associative, au bénévolat et au mentorat."},"EE3-3.06":{"en":"Ultimately, the decision is not between the caricatures of homeschooling and traditional schooling, but rather between the capability and resourcefulness of the specific parents, compared to that of the specific school their child would otherwise attend, both weighed against the child's specific needs.","l1":"At the end of the count, it is not about choosing between the caricatures of the school at home and of the traditional school, but rather between the capacities and the ingenuity of the parents in question, compared to those of the precise school that their child would attend otherwise, the two being put in balance with the precise needs of the child.","fr":"En fin de compte, il ne s'agit pas de choisir entre les caricatures de l'école à la maison et de l'école traditionnelle, mais plutôt entre les capacités et l'ingéniosité des parents en question, comparées à celles de l'école précise que leur enfant fréquenterait sinon, les deux étant mises en balance avec les besoins précis de l'enfant."},"EE3-3.07":{"en":"Even more important is the likelihood of the parents sustaining this standard over years, something traditional schooling is more likely to guarantee, because schools are accountable for hundreds of children, not just one.","l1":"What counts even more, it is the probability that the parents maintain this level during years, which the traditional school has more chances of guaranteeing, because the schools are responsible for hundreds of children, and not for only one.","fr":"Ce qui compte encore plus, c'est la probabilité que les parents maintiennent ce niveau pendant des années, ce que l'école traditionnelle a plus de chances de garantir, parce que les écoles sont responsables de centaines d'enfants, et non d'un seul."},"EE3-4.01":{"en":"It is hard to disagree with Document B. It does not make absolute claims; it simply points to the existence of evidence of these major sporting events being financially devastating, and there is indeed substantial evidence to support this.","l1":"It is difficult to not be in agreement with document B. It does not advance absolute affirmations, it contents itself with signaling that there exist proofs that these big sporting events are financially disastrous, and there are indeed solid proofs in support.","fr":"Il est difficile de ne pas être d'accord avec le document B. Il n'avance pas d'affirmations absolues, il se contente de signaler qu'il existe des preuves que ces grands événements sportifs sont financièrement désastreux, et il y a effectivement de solides preuves à l'appui."},"EE3-4.02":{"en":"This raises the key question of whether the return these events generate is material enough to justify neglecting other public interests.","l1":"That raises the essential question of knowing if the return on investment of these events is important enough to justify that one neglects other public interests.","fr":"Cela soulève la question essentielle de savoir si le retour sur investissement de ces événements est assez important pour justifier que l'on néglige d'autres intérêts publics."},"EE3-4.03":{"en":"Firstly, the practical economic boost from international attention is negligible or immeasurable at best.","l1":"Firstly, the concrete economic spin-offs of international attention are negligible, or at best impossible to measure.","fr":"Premièrement, les retombées économiques concrètes de l'attention internationale sont négligeables, ou au mieux impossibles à mesurer."},"EE3-4.04":{"en":"The primary association people make with a country is rarely a major event they hosted in the past.","l1":"The first thing that people associate with a country is rarely a big event that it hosted in the past.","fr":"La première chose que les gens associent à un pays est rarement un grand événement qu'il a accueilli par le passé."},"EE3-4.05":{"en":"Studies have also routinely dismissed meaningful long-term tourism gains resulting from these events.","l1":"Besides, some studies have regularly set aside the idea that these events have notable touristic repercussions in the long term.","fr":"Par ailleurs, des études ont régulièrement écarté l'idée que ces événements aient des retombées touristiques notables à long terme."},"EE3-4.06":{"en":"As a fallback, Document A leans on the economic boost, but misattributes its cause.","l1":"For want of better, document A leans on the economic fallout, but it is mistaken on its cause.","fr":"Faute de mieux, le document A s'appuie sur les retombées économiques, mais il se trompe sur leur cause."},"EE3-4.07":{"en":"The boost comes from infrastructure modernization.","l1":"The fallout comes from the modernization of the infrastructures.","fr":"Les retombées viennent de la modernisation des infrastructures."},"EE3-4.08":{"en":"Why not directly invest in infrastructure, without the pretext of a sporting event?","l1":"Why not invest directly in infrastructures, without the pretext of a sporting event?","fr":"Pourquoi ne pas investir directement dans les infrastructures, sans le prétexte d'un événement sportif ?"},"EE3-4.09":{"en":"The only implicit benefit of these events remains unnamed: the deadline.","l1":"The only implicit advantage of these events is never named: the deadline.","fr":"Le seul avantage implicite de ces événements n'est jamais nommé : la date butoir."},"EE3-4.10":{"en":"While it is true that these deadlines force host countries to build infrastructure faster, the mere completion of projects is a vanity metric that distracts us from metrics that actually indicate long-term return on investment.","l1":"If it is true that these deadlines oblige host countries to construct infrastructures faster, the simple completion of projects is a facade indicator that diverts us from the indicators that really reflect the long-term return on investment.","fr":"S'il est vrai que ces dates butoirs obligent les pays hôtes à construire des infrastructures plus vite, le simple achèvement des projets est un indicateur de façade qui nous détourne des indicateurs qui reflètent réellement le retour sur investissement à long terme."},"EE3-4.11":{"en":"These immovable deadlines also breed rash decisions and inflated spending because they back governments into a corner.","l1":"These immovable deadlines also engender precipitated decisions and inflated spending, because they put governments at the foot of the wall.","fr":"Ces dates butoirs immuables engendrent aussi des décisions précipitées et des dépenses gonflées, parce qu'elles mettent les gouvernements au pied du mur."},"EE3-4.12":{"en":"With all these supposed benefits collapsing upon closer examination, I conclude that these major sporting events do not generate a return that justifies their cost.","l1":"As all these so-called advantages collapse when one looks at them more closely, I conclude from it that these big sporting events do not generate a return on investment that justifies their cost.","fr":"Comme tous ces prétendus avantages s'effondrent quand on y regarde de plus près, j'en conclus que ces grands événements sportifs ne génèrent pas un retour sur investissement qui justifie leur coût."},"EE3-5.01":{"en":"To make this debate viable, we first need to define what a true chef is.","l1":"For this debate to have a sense, we must first define what is a true chef.","fr":"Pour que ce débat ait un sens, nous devons d'abord définir ce qu'est un vrai chef."},"EE3-5.02":{"en":"It should be defined as someone who has mastered the skill of cooking, without requirement for expertise in kitchen management.","l1":"One should define him as someone who masters the culinary art, without an expertise in kitchen management being required.","fr":"On devrait le définir comme quelqu'un qui maîtrise l'art culinaire, sans qu'une expertise en gestion de cuisine soit requise."},"EE3-5.03":{"en":"Establishing this foundation is necessary because mastering a restaurant kitchen at home is obviously impossible and would render this conversation pointless.","l1":"It is necessary to lay this base, because it is evidently impossible to master at home a restaurant cuisine, which would render this discussion without object.","fr":"Il faut poser cette base, car il est évidemment impossible de maîtriser chez soi une cuisine de restaurant, ce qui rendrait cette discussion sans objet."},"EE3-5.04":{"en":"Document A makes the absolute claim that formal training is \"essential\" to master cooking.","l1":"The document A affirms categorically that a supervised training is \"indispensable\" to master the cooking.","fr":"Le document A affirme catégoriquement qu'une formation encadrée est « indispensable » pour maîtriser la cuisine."},"EE3-5.05":{"en":"This is simply not true.","l1":"It is quite simply false.","fr":"C'est tout simplement faux."},"EE3-5.06":{"en":"To build on Document B's cited example, there are thousands of home cooks who have published cookbooks with glowing reviews thanks to the quality of their recipes.","l1":"To prolong the example cited by document B, there exist thousands of amateur cooks who have published cookbooks having received glowing reviews thanks to the quality of their recipes.","fr":"Pour prolonger l'exemple cité par le document B, il existe des milliers de cuisiniers amateurs qui ont publié des livres de cuisine ayant reçu des critiques élogieuses grâce à la qualité de leurs recettes."},"EE3-5.07":{"en":"This itself is proof of their excelling cooking skills.","l1":"It's in itself the proof that they excel in cooking.","fr":"C'est en soi la preuve qu'ils excellent en cuisine."},"EE3-5.08":{"en":"I will concede to Document A that advanced techniques are harder to self-learn, even with the plethora of online learning resources and communities available in 2026, as they require more precise feedback loops.","l1":"I concede to document A that advanced techniques are more difficult to learn alone, even with the plethora of online learning resources and communities available in 2026, because they demand more precise feedback loops.","fr":"Je concède au document A que les techniques avancées sont plus difficiles à apprendre seul, même avec la pléthore de ressources et de communautés d'apprentissage en ligne disponibles en 2026, car elles exigent des boucles de rétroaction plus précises."},"EE3-5.09":{"en":"Therefore, formal training is more optimal.","l1":"By consequence, a supervised training is closer to the optimum.","fr":"Par conséquent, une formation encadrée est plus proche de l'optimum."},"EE3-5.10":{"en":"However, the word \"essential\" frames the debate around feasibility instead of optimality, which ultimately invalidates Document A's position.","l1":"However, the word \"indispensable\" places the debate on the terrain of feasibility rather than of optimality, which definitively invalidates the position of document A.","fr":"Cependant, le mot « indispensable » place le débat sur le terrain de la faisabilité plutôt que de l'optimalité, ce qui invalide en définitive la position du document A."},"EE3-6.01":{"en":"Both documents examine the impact of video games, but on different audiences: Document A on adults and Document B on children.","l1":"The two documents examine the impact of video games, but on different publics: the adults for document A and the children for document B.","fr":"Les deux documents examinent l'impact des jeux vidéo, mais sur des publics différents : les adultes pour le document A et les enfants pour le document B."},"EE3-6.02":{"en":"Since the harm to children is the more pressing concern, that is the lens through which I will address this issue.","l1":"As the damages caused to children are the most pressing preoccupation, it is under this angle that I will approach this question.","fr":"Comme les dommages causés aux enfants sont la préoccupation la plus pressante, c'est sous cet angle que j'aborderai cette question."},"EE3-6.03":{"en":"Numerous studies support Document B's concerns, and even Document A concedes that not all video games are beneficial.","l1":"Numerous studies support the worries of document B, and even document A concedes that the video games are not all beneficial.","fr":"De nombreuses études appuient les inquiétudes du document B, et même le document A concède que les jeux vidéo ne sont pas tous bénéfiques."},"EE3-6.04":{"en":"This matters because research in human behavior indicates that childhood experiences shape adult behavior far more than we tend to credit them for.","l1":"That has its importance, because the research on human behavior indicates that the experiences of childhood shape the behavior at adult age much more than we have a tendency to believe it.","fr":"Cela a son importance, car les recherches sur le comportement humain indiquent que les expériences de l'enfance façonnent le comportement à l'âge adulte bien plus que nous n'avons tendance à le croire."},"EE3-6.05":{"en":"For that reason, anything that compromises child development deserves to be weighed just as seriously.","l1":"For this reason, all that compromises the development of the child merits to be taken just as seriously.","fr":"Pour cette raison, tout ce qui compromet le développement de l'enfant mérite d'être pris tout aussi au sérieux."},"EE3-6.06":{"en":"With that gravity in mind, while Document B rightly advises parents to be more mindful if their children's exposure to video games, I believe this is inadequate.","l1":"In view of this gravity, if document B rightly advises the parents to pay more attention to the exposure of their children to video games, I think that it is insufficient.","fr":"Au vu de cette gravité, si le document B conseille à juste titre aux parents de faire plus attention à l'exposition de leurs enfants aux jeux vidéo, je pense que c'est insuffisant."},"EE3-6.07":{"en":"Stricter legislation is necessary, both to restrict children's access to mature video games, and to rein in the addictive elements in them.","l1":"A stricter legislation is necessary, at the same time to restrict the access of children to video games for adults and to frame the addictive elements that they contain.","fr":"Une législation plus stricte est nécessaire, à la fois pour restreindre l'accès des enfants aux jeux vidéo pour adultes et pour encadrer les éléments addictifs qu'ils comportent."},"EE3-6.08":{"en":"It is true that some video games offer the benefits mentioned in Document A, even for children.","l1":"It is true that certain video games offer the advantages mentioned in document A, even for the children.","fr":"Il est vrai que certains jeux vidéo offrent les avantages mentionnés dans le document A, même pour les enfants."},"EE3-6.09":{"en":"However, these benefits are not unique to video games.","l1":"However, these advantages are not specific to video games.","fr":"Cependant, ces avantages ne sont pas propres aux jeux vidéo."},"EE3-6.10":{"en":"Playing sports, for example, develop the same cognitive abilities, with the bonus of improving communication skills and physical health.","l1":"Doing sport, for example, develops the same cognitive capacities, with as a bonus an improvement of communication competences and of physical health.","fr":"Faire du sport, par exemple, développe les mêmes capacités cognitives, avec en prime une amélioration des compétences en communication et de la santé physique."},"EE3-6.11":{"en":"The risks of gaming far outweigh its advantages, especially considering that the fallout from its traumatic effects extends beyond the children and also to the society around them.","l1":"The risks linked to video games carry it largely over their advantages, all the more that their traumatizing effects do not limit themselves to the children and reverberate also on the society that surrounds them.","fr":"Les risques liés aux jeux vidéo l'emportent largement sur leurs avantages, d'autant plus que leurs effets traumatisants ne se limitent pas aux enfants et se répercutent aussi sur la société qui les entoure."},"EE3-7.01":{"en":"I agree with Sophie that retirement homes are a valid option for the elderly, and that they can indeed provide quality care and much-needed access to a social life.","l1":"I am in agreement with Sophie to say that retirement homes are a valid option for elderly persons and that they can effectively offer quality care and an access to a social life of which they have great need.","fr":"Je suis d'accord avec Sophie pour dire que les maisons de retraite sont une option valable pour les personnes âgées et qu'elles peuvent effectivement offrir des soins de qualité et un accès à une vie sociale dont elles ont grand besoin."},"EE3-7.02":{"en":"I also appreciate that Sophie qualifies this as a better choice only \"in some cases\", introducing welcome nuance into this debate rather than treating it as black and white.","l1":"I appreciate also that Sophie only presents this solution as a better choice \"in certain cases\" and that she brings thus to the debate a welcome nuance instead of treating it in a binary fashion.","fr":"J'apprécie aussi que Sophie ne présente cette solution comme un meilleur choix que « dans certains cas » et qu'elle apporte ainsi au débat une nuance bienvenue au lieu de le traiter de façon binaire."},"EE3-7.03":{"en":"So much depends on which facilities are available to you specifically, how suitable they are, and what your specific home care arrangement would realistically look like.","l1":"So many things depend on the establishments available in your precise case, on their adequacy and on what your own organization of the help at home would concretely resemble.","fr":"Tant de choses dépendent des établissements disponibles dans votre cas précis, de leur adéquation et de ce à quoi ressemblerait concrètement votre propre organisation de l'aide à domicile."},"EE3-7.04":{"en":"With that being said, I lean towards John's position.","l1":"That being said, I lean for the position of John.","fr":"Cela étant dit, je penche pour la position de John."},"EE3-7.05":{"en":"Not even the finest, most well-run retirement home can provide the love and warmth that the elderly receive in the presence of their own family.","l1":"Even the best and the best managed of the retirement homes cannot offer the love and the warmth that the elderly persons receive with their own family.","fr":"Même la meilleure et la mieux gérée des maisons de retraite ne peut offrir l'amour et la chaleur que les personnes âgées reçoivent auprès de leur propre famille."},"EE3-7.06":{"en":"Therefore, home care should be prioritized, and retirement homes considered only when confident that the facility in question can provide better care than your best attempt at home care.","l1":"By consequence, it would be necessary to privilege the help at home and to envisage the retirement homes only when you are convinced that the establishment in question can offer better care than those that you could ensure at home in doing your best.","fr":"Par conséquent, il faudrait privilégier l'aide à domicile et n'envisager les maisons de retraite que lorsque vous êtes convaincu que l'établissement en question peut offrir de meilleurs soins que ceux que vous pourriez assurer à domicile en faisant de votre mieux."},"EE3-7.07":{"en":"Emphasis on \"best attempt\", because we owe it to our elderly family members to repay them the love and care they once gave us.","l1":"I insist on \"your best\", because we must give back to our elderly close ones the love and the care that they once gave us.","fr":"J'insiste sur « de votre mieux », car nous devons rendre à nos proches âgés l'amour et les soins qu'ils nous ont autrefois donnés."},"EE3-8.01":{"en":"Before anything else, we must establish that this debate particularly concerns industries where a photo on the resume is not mandatory, unlike the modelling industry or the entertainment industry for example.","l1":"Before all thing, it is necessary to specify that this debate concerns particularly the sectors where the photo on the CV is not obligatory, contrary to modelling or to the world of the show, for example.","fr":"Avant toute chose, il faut préciser que ce débat concerne particulièrement les secteurs où la photo sur le CV n'est pas obligatoire, contrairement au mannequinat ou au monde du spectacle, par exemple."},"EE3-8.02":{"en":"On that basis, I am not convinced by Document B's claim that a photo helps candidates stand out in the eyes of the recruiters.","l1":"Starting from there, I am not convinced by the affirmation of document B according to which a photo helps the candidates to stand out in the eyes of the recruiters.","fr":"Partant de là, je ne suis pas convaincu par l'affirmation du document B selon laquelle une photo aide les candidats à se démarquer aux yeux des recruteurs."},"EE3-8.03":{"en":"In today's job market, employers routinely receive hundreds, if not thousands, of applications, and as a result spend an average of six seconds on each resume before deciding its fate.","l1":"On the job market of today, employers commonly receive hundreds, or even thousands of candidatures, which makes that they spend on average six seconds on each CV before deciding its fate.","fr":"Sur le marché du travail d'aujourd'hui, les employeurs reçoivent couramment des centaines, voire des milliers de candidatures, ce qui fait qu'ils passent en moyenne six secondes sur chaque CV avant de décider de son sort."},"EE3-8.04":{"en":"The photo is rarely the deciding factor in these six seconds; it is the names of previous employers, the university attended, and the numbers, which quickly register as real results.","l1":"During these six seconds, it is rarely the photo that makes the difference, it is the names of the former employers, the university attended and the figures, that one perceives quickly as concrete results.","fr":"Pendant ces six secondes, c'est rarement la photo qui fait la différence, ce sont les noms des anciens employeurs, l'université fréquentée et les chiffres, que l'on perçoit rapidement comme des résultats concrets."},"EE3-8.05":{"en":"In fact, a photo often backfires.","l1":"In fact, a photo often has the inverse effect.","fr":"En fait, une photo a souvent l'effet inverse."},"EE3-8.06":{"en":"Recruiters often interpret it as gap filler, as every centimeter of space on a resume is precious; even entry-level professionals have little room to spare for a photo.","l1":"The recruiters often interpret it as filling, because each centimeter is precious on a CV, and even at the start of career, one has little room to devote to a photo.","fr":"Les recruteurs l'interprètent souvent comme du remplissage, car chaque centimètre est précieux sur un CV, et même en début de carrière, on a peu de place à consacrer à une photo."},"EE3-8.07":{"en":"On top of this, the discrimination concern raised by Document A is real.","l1":"Moreover, the fear of discrimination raised by document A is real.","fr":"De plus, la crainte de discrimination soulevée par le document A est réelle."},"EE3-8.08":{"en":"Although unfair, the split-second subconscious bias sparking unintentional discrimination based on appearance is far more common than we like to acknowledge.","l1":"Even if it's unjust, the unconscious bias that plays out in a fraction of a second and that triggers an involuntary discrimination founded on appearance is much more common than we want to admit.","fr":"Même si c'est injuste, le biais inconscient qui se joue en une fraction de seconde et qui déclenche une discrimination involontaire fondée sur l'apparence est bien plus courant qu'on veut bien l'admettre."},"EE3-8.09":{"en":"Could a photo land you on the favorable side of this bias?","l1":"Could a photo make this bias play in your favor?","fr":"Une photo pourrait-elle faire jouer ce biais en votre faveur ?"},"EE3-8.10":{"en":"Yes.","l1":"Yes.","fr":"Oui."},"EE3-8.11":{"en":"But do you really want to work for such an employer?","l1":"But do you really want to work for such an employer?","fr":"Mais voulez-vous vraiment travailler pour un tel employeur ?"},"EE3-8.12":{"en":"For all these reasons, I am against the practice of including a photo on a resume.","l1":"For all these reasons, I am against the practice consisting of putting a photo on a CV.","fr":"Pour toutes ces raisons, je suis contre la pratique consistant à mettre une photo sur un CV."},"EE3-9.01":{"en":"This debate, at its core, is less about advertising than about our culture of consumerism within a capitalist society.","l1":"This debate, at bottom, bears less on advertising than on our culture of consumerism within a capitalist society.","fr":"Ce débat, au fond, porte moins sur la publicité que sur notre culture du consumérisme au sein d'une société capitaliste."},"EE3-9.02":{"en":"Lucas makes a fair point that advertising helps consumers save money by surfacing options.","l1":"Lucas rightly points out that advertising helps the consumers to make economies by making them discover different offers.","fr":"Lucas fait remarquer à juste titre que la publicité aide les consommateurs à faire des économies en leur faisant découvrir différentes offres."},"EE3-9.03":{"en":"After all, that is the very selling point of capitalism.","l1":"After all, it is precisely the selling argument of capitalism.","fr":"Après tout, c'est précisément l'argument de vente du capitalisme."},"EE3-9.04":{"en":"However, while I appreciate that Lucas enjoys listening to ads, I would argue that the underlying phenomenon at play is the consumerist mindset ingrained in our society and the manufactured need to buy.","l1":"However, if I understand that Lucas likes to listen to the ads, I would say that at the bottom, the phenomenon at play is the consumerist mentality anchored in our society and the need to buy created out of whole cloth.","fr":"Cependant, si je comprends que Lucas aime écouter les publicités, je dirais qu'au fond, le phénomène en jeu est la mentalité consumériste ancrée dans notre société et le besoin d'acheter créé de toutes pièces."},"EE3-9.05":{"en":"One could plausibly argue that Lucas would never have been interested in some of the items he now compares prices for, had he simply not been so saturated by the ads.","l1":"One could reasonably maintain that Lucas would never have been interested in certain of the articles of which he compares today the prices if he had simply not been so saturated with ads.","fr":"On pourrait raisonnablement soutenir que Lucas ne se serait jamais intéressé à certains des articles dont il compare aujourd'hui les prix s'il n'avait tout simplement pas été aussi saturé de publicités."},"EE3-9.06":{"en":"This is why I align more firmly with Document B. Not only are we inundated with advertising today, but its sheer volume breeds a culture of overconsumption, which in turn magnifies the environmental harm Document Alma rightly highlights.","l1":"That is why I range myself more clearly on the side of document B. Not only are we flooded with advertising today, but its volume alone engenders a culture of overconsumption, which amplifies in its turn the environmental damage that the document of Alma rightly underlines.","fr":"C'est pourquoi je me range plus nettement du côté du document B. Non seulement nous sommes inondés de publicité aujourd'hui, mais son seul volume engendre une culture de la surconsommation, qui amplifie à son tour les dégâts environnementaux que le document d'Alma souligne à juste titre."}}}</script>
