<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>TCF Response Decks</title>
<style>:root{--bg:#17181A;--panel:#1F2023;--line:#323338;--ink:#ECECEA;--ink2:#BDBDB8;--mute:#80817E;--a:#57B5B0;--b:#E3955E;
  --full:#57B5B0;--most:#8DBF6A;--half:#E3B95E;--below:#E07A6A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
main{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 14px}
.how{color:var(--ink2);font-size:13px;margin:0 0 16px;padding:10px 12px;border-left:2px solid var(--line)}
.stub{color:#1a1a1a;background:var(--below);font-weight:700;padding:8px 12px;border-radius:6px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.bar button{font:inherit;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.bar button.on{color:var(--ink);border-color:var(--a);font-weight:600}
.bar button:disabled{opacity:.4;cursor:default}
.bar .lab{color:var(--mute);font-size:12.5px}
.bar .n{color:var(--mute);font-variant-numeric:tabular-nums;margin-left:5px;font-weight:400}
.deck{display:grid;grid-template-columns:34px 1fr auto;gap:2px 12px;align-items:baseline;padding:10px 14px;margin-bottom:7px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;color:inherit;text-decoration:none}
.deck:hover,.deck:focus-visible{border-color:var(--a);outline:none}
.rk{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;text-align:right}
.nm{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pg{color:var(--ink2);font-size:12.5px;white-space:nowrap}
.meta{grid-column:2/4;color:var(--mute);font-size:12.5px}
.lv{font-size:11px;font-weight:700;letter-spacing:.03em;padding:0 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.lv.full{color:var(--full)}.lv.most{color:var(--most)}.lv.half{color:var(--half)}.lv.below{color:var(--below)}
.none{color:var(--mute);padding:16px 2px}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:7px}
.row .deck{flex:1;margin-bottom:0;min-width:0}
.ck{display:flex;align-items:center;justify-content:center;width:34px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer}
.ck input{width:17px;height:17px;margin:0;accent-color:var(--a);cursor:pointer}
.row.done .deck{border-color:#2f5654}.row.done .nm{color:var(--ink2)}
.prog{margin:2px 0 14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.prog .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.prog .t b{font-size:15px;font-variant-numeric:tabular-nums}
.prog .track{height:8px;background:var(--line);border-radius:4px;margin:7px 0 6px;overflow:hidden}
.prog .fill{height:100%;background:var(--a);border-radius:4px}
.prog .s{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:12.5px;margin-top:22px}
@media (max-width:520px){.deck{grid-template-columns:26px 1fr}.pg,.meta{grid-column:2}.ck{width:30px}}

.rk{font-family:ui-monospace,Menlo,monospace;font-size:12px;text-align:left}
.deck{grid-template-columns:58px 1fr auto}
.who{color:var(--mute);font-weight:400}
.side{color:var(--mute);font-size:12.5px;margin-top:18px}
.side a{color:var(--a)}
@media (max-width:520px){.deck{grid-template-columns:52px 1fr}}
</style></head><body>

take their cars because the city lacks public transit in certain outlying neighborhoods. Finally, in my opinion, public transit should remain paid. People will show more respect for the equipment if they contribute to its funding by paying a fare.\n\nQuestion: Free public transit: for or against? What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nLes transports en commun gratuits, c’est une très bonne idée. Cela permet de diminuer le nombre de voitures en ville et d’éviter les bouchons. C’est aussi une bonne mesure pour réduire la pollution et donc les risques de maladies respiratoires. Dans ma ville, il y a des transports en commun gratuits. On observe que les gens utilisent plus souvent les transports publics depuis que la gratuité est en place. Cette mesure a aussi profité aux commerçants : les gens reviennent faire leurs achats dans le centre-ville et vont moins dans les hypermarchés.\n\nDocument B :\nL’idée n’est pas bonne. D’une part, cela coûterait cher aux villes. Or, il me semble que la ville de Toulouse a d’autres problèmes à régler en priorité. Par exemple, il faudrait d’abord réaménager les espaces verts, cela profiterait à tout le monde. D’autre part, il vaudrait mieux réorganiser les transports publics au lieu de les rendre gratuits. Aujourd’hui, les gens préfèrent prendre leur voiture parce que la ville manque de transports publics dans certains quartiers éloignés. Enfin, selon moi, il faut garder les transports publics payants. Les gens respecteront davantage les équipements s’ils participent à leur financement en payant un titre de transport.\n\nQuestion : La gratuité des transports en commun : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::4ee2a4a893b46f0a","sid":"EE3-1.01","p":0,"nw":false},{"id":"tcfr::4d60fa0a001cf4e9","sid":"EE3-1.02","p":1,"nw":true},{"id":"tcfr::afbba6c13ce912f2","sid":"EE3-1.03","p":1,"nw":true},{"id":"tcfr::adcecb66bcb94b74","sid":"EE3-1.04","p":1,"nw":true},{"id":"tcfr::6d04a71a1575bbbd","sid":"EE3-1.05","p":2,"nw":true},{"id":"tcfr::ac56357448c432ba","sid":"EE3-1.06","p":2,"nw":false},{"id":"tcfr::fb04e90358ecd0f9","sid":"EE3-1.07","p":3,"nw":true},{"id":"tcfr::777f21d03210bb12","sid":"EE3-1.08","p":3,"nw":false}],"words":206,"answer":[[["EE3-1.01"]],[["EE3-1.02","EE3-1.03","EE3-1.04"]],[["EE3-1.05","EE3-1.06"]],[["EE3-1.07","EE3-1.08"]]],"range":[120,180]},{"key":"EE3-2","task":"EE3","pos":2,"who":"essay","paras":4,"freq":{"rank":4,"of":53,"box":10,"n":44,"size":3,"listed":23,"tied":1,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#g-EE_T3-10"},"en":"Document A:\nLiving with roommates can be a wonderful human experience. Whether with a friend or someone you are getting to know, it allows you to create new bonds, to share pleasant moments when you come home in the evening, such as chatting over a meal or watching a movie together. It is also a good way to divide up household chores and benefit from each person's skills, whether in cooking or home repairs.\n\nDocument B:\nLiving with roommates is a very different experience from living with family. Everyone has their own rhythm, personality, and priorities, which can sometimes complicate cohabitation. If you do not get along with your roommate, it can quickly become difficult to live with. Conflicts often arise due to failure to do shared chores or a lack of privacy. Noise can also be a problem, such as a roommate playing video games late into the night.\n\nQuestion: Shared living: between advantages and disadvantages. What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nVivre en colocation peut être une belle expérience humaine. Que ce soit avec un ami ou une personne que l’on apprend à connaître, cela permet de créer de nouveaux liens, de partager des moments agréables en rentrant le soir, comme discuter autour d’un repas ou regarder un film ensemble. C’est aussi un bon moyen de se répartir les tâches ménagères et de bénéficier des compétences de chacun, que ce soit en cuisine ou en bricolage.\n\nDocument B :\nVivre en colocation est une expérience bien différente de la vie en famille. Chacun a son propre rythme, sa personnalité et ses priorités, ce qui peut parfois compliquer la cohabitation. Si le courant ne passe pas avec le colocataire, cela peut vite devenir difficile à vivre. Les conflits surviennent souvent à cause du non-respect des tâches partagées ou du manque d’intimité. Le bruit peut aussi poser problème, comme un colocataire qui joue à des jeux vidéo tard dans la nuit.\n\nQuestion : La colocation : entre avantages et inconvénients : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::6f6daa2600e8a884","sid":"EE3-2.01","p":0,"nw":false},{"id":"tcfr::44324e739a87b5f4","sid":"EE3-2.02","p":1,"nw":true},{"id":"tcfr::ef6b28763fadad2b","sid":"EE3-2.03","p":1,"nw":false},{"id":"tcfr::f7158370fbb03fd4","sid":"EE3-2.04","p":2,"nw":true},{"id":"tcfr::13800782ffccb2e2","sid":"EE3-2.05","p":2,"nw":false},{"id":"tcfr::ba7f02c0e64af65a","sid":"EE3-2.06","p":2,"nw":true},{"id":"tcfr::c82306f134336c08","sid":"EE3-2.07","p":2,"nw":false},{"id":"tcfr::eba1a74bdda54046","sid":"EE3-2.08","p":3,"nw":false}],"words":193,"answer":[[["EE3-2.01"]],[["EE3-2.02","EE3-2.03"]],[["EE3-2.04","EE3-2.05","EE3-2.06","EE3-2.07"]],[["EE3-2.08"]]],"range":[120,180]},{"key":"EE3-3","task":"EE3","pos":3,"who":"essay","paras":4,"freq":{"rank":40,"of":53,"box":null,"n":37,"size":1,"listed":5,"tied":2,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#p-37"},"en":"Document A:\nThe reasons that drive parents to choose homeschooling are numerous. It gives the possibility to adopt a more individualized teaching approach. One can spend more time on the points where the child struggles or offer educational games from time to time. The child manages their learning at their own pace, delves deeper into subjects that fascinate them, and does not face pressure from other students who may progress faster or slower. Another advantage of homeschooling is a different type of development. With school at home, there are no grades that can sometimes be discouraging, but rather continuous assessment of knowledge, no stress from tests and homework.\n\nDocument B:\nThe choice of homeschooling represents a real challenge and therefore comes with some disadvantages to consider before getting started. Homeschooling requires a lot of time, good organization, and it also has a cost. All the materials, books, textbooks, and outings are the responsibility of the families, and one of the two parents often has to put their career on hold. In total, homeschooling generally costs more than attending a public school. Moreover, the child does not interact with classmates on a daily basis, as homeschooling does not allow the child to interact with other children as they would in a traditional school setting.\n\nQuestion: Homeschooling, for or against? What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nLes raisons qui poussent les parents à opter pour la scolarisation à domicile sont nombreuses. Elle donne la possibilité d’adopter une pédagogie plus individualisée. On peut passer plus de temps sur les points sur lesquels l’enfant bute ou lui proposer, à l’occasion, des jeux éducatifs. L’enfant gère son apprentissage à son rythme, il creuse les sujets qui le passionnent et ne subit pas la pression des autres élèves qui peuvent avancer plus au moins vite que lui. Autre avantage de l’instruction en famille, une évolution différente. Avec l’école à la maison, pas de notes qui peuvent parfois être décourageantes, mais un contrôle continu des connaissances, pas de stress dû aux évaluations et aux devoirs.\n\nDocument B :\nLe choix de la scolarisation à domicile représente un véritable défi et donc, quelques inconvénients à prendre en compte avant de se lancer. La scolarisation à domicile nécessite beaucoup de temps, une bonne organisation et elle a aussi un coût. Tout le matériel, les livres, les manuels, et les sorties sont à la charge des familles, et l’un des deux parents est souvent amené à mettre entre parenthèses son emploi. Au total, l’école à domicile coûte généralement plus cher qu’une scolarisation dans le public. De plus, l’enfant ne côtoie pas de camarades au quotidien, car l’école à domicile ne permet pas à l’enfant d’entrer en interaction avec d’autres enfants comme il le ferait dans un cadre scolaire classique.\n\nQuestion : L'école à la maison, pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::5a182897f75fca8e","sid":"EE3-3.01","p":0,"nw":false},{"id":"tcfr::c21b2e4a9e5637b7","sid":"EE3-3.02","p":1,"nw":false},{"id":"tcfr::d15fa4a5352426e2","sid":"EE3-3.03","p":1,"nw":false},{"id":"tcfr::d51788b0a1c92998","sid":"EE3-3.04","p":1,"nw":true},{"id":"tcfr::3691eff8daf255e1","sid":"EE3-3.05","p":2,"nw":false},{"id":"tcfr::b063d9dd52201d8e","sid":"EE3-3.06","p":3,"nw":true},{"id":"tcfr::0a62598f1f8e65bc","sid":"EE3-3.07","p":3,"nw":true}],"words":229,"answer":[[["EE3-3.01"]],[["EE3-3.02","EE3-3.03","EE3-3.04"]],[["EE3-3.05"]],[["EE3-3.06","EE3-3.07"]]],"range":[120,180]},{"key":"EE3-4","task":"EE3","pos":4,"who":"essay","paras":5,"freq":{"rank":49,"of":53,"box":null,"n":41,"size":1,"listed":2,"tied":3,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#p-41"},"en":"Document A:\nThe organization by the government of major sporting events such as the Olympics, the World Cup, or the Africa Cup represents an exceptional opportunity. It is a unique occasion to promote our culture on a global scale and capture international attention. Moreover, these competitions stimulate the local economy through job creation and the modernization of infrastructure, which generates lasting benefits for the entire population.\n\nDocument B:\nOrganizing major sporting events involves significant costs for the government. It would be wiser to invest public funds primarily in health and education. Experience shows that these competitions can put host countries into debt without bringing concrete benefits to the population.\n\nQuestion: The impact of major sporting events. What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nL’organisation par l’État d’événements sportifs majeurs comme les Jeux Olympiques, la Coupe du Monde ou la Coupe d’Afrique représente une opportunité exceptionnelle. C’est une occasion unique de promouvoir notre culture à l’échelle mondiale et de capter l’attention internationale. De plus, ces compétitions stimulent l’économie locale par la création d’emplois et la modernisation des infrastructures, ce qui engendre des bénéfices durables pour toute la population.\n\nDocument B :\nOrganiser de grands événements sportifs engendre des coûts importants pour l’État. Il serait plus judicieux d’investir les fonds publics en priorité dans la santé et l’éducation. L’expérience montre que ces compétitions peuvent endetter les pays hôtes sans apporter de bénéfices concrets à la population.\n\nQuestion : L'impact des grands événements sportifs : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::c84e37bb71d1a7b1","sid":"EE3-4.01","p":0,"nw":true},{"id":"tcfr::2e98de66ca008d4e","sid":"EE3-4.02","p":0,"nw":true},{"id":"tcfr::aee32a86dba7daed","sid":"EE3-4.03","p":1,"nw":false},{"id":"tcfr::47e828273755f959","sid":"EE3-4.04","p":1,"nw":false},{"id":"tcfr::4bcb7f12011a23e8","sid":"EE3-4.05","p":1,"nw":false},{"id":"tcfr::d9e9d65ed4e70311","sid":"EE3-4.06","p":2,"nw":true},{"id":"tcfr::39a5fd763d241436","sid":"EE3-4.07","p":2,"nw":true},{"id":"tcfr::df1f3927bd66800c","sid":"EE3-4.08","p":2,"nw":false},{"id":"tcfr::00f9451c62433e1f","sid":"EE3-4.09","p":2,"nw":false},{"id":"tcfr::442989c71505d814","sid":"EE3-4.10","p":3,"nw":false},{"id":"tcfr::9c5d34cb093bf42a","sid":"EE3-4.11","p":3,"nw":false},{"id":"tcfr::e6584bc13fe5ebb2","sid":"EE3-4.12","p":4,"nw":true}],"words":274,"answer":[[["EE3-4.01","EE3-4.02"]],[["EE3-4.03","EE3-4.04","EE3-4.05"]],[["EE3-4.06","EE3-4.07","EE3-4.08","EE3-4.09"]],[["EE3-4.10","EE3-4.11"]],[["EE3-4.12"]]],"range":[120,180]},{"key":"EE3-5","task":"EE3","pos":5,"who":"essay","paras":4,"freq":{"rank":13,"of":53,"box":null,"n":30,"size":1,"listed":14,"tied":2,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#p-30"},"en":"Document A:\nAmateurs manage to make some recipes, but they often lack the skills and techniques needed. That is why training and experience are essential to becoming a true chef.\n\nDocument B:\nHe discusses cooks who learned their craft on the internet and gained popularity on social media. He also tells the story of an amateur who became a professional and wrote several cookbooks aimed at home cooking enthusiasts.\n\nQuestion: Amateur Cook or Professional Chef? What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nLes amateurs réussissent certaines recettes, mais il leur manque souvent les compétences et les techniques nécessaires. C’est pourquoi la formation et l’expérience sont indispensables pour devenir un véritable cuisinier.\n\nDocument B :\nIl évoque les cuisiniers ayant appris leur métier sur internet et qui ont gagné en popularité sur les réseaux sociaux. Il raconte également l’histoire d’une amatrice devenue professionnelle, qui a écrit plusieurs livres de cuisine destinés aux passionnés de cuisine à domicile.\n\nQuestion : Cuisinier amateur ou chef professionnel : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::909c9391d970c42b","sid":"EE3-5.01","p":0,"nw":false},{"id":"tcfr::26cd400345ed5ed0","sid":"EE3-5.02","p":0,"nw":false},{"id":"tcfr::ed9e2684b9fb5ee1","sid":"EE3-5.03","p":0,"nw":false},{"id":"tcfr::bc3f068068aefe9b","sid":"EE3-5.04","p":1,"nw":true},{"id":"tcfr::93214cc04abae4b2","sid":"EE3-5.05","p":1,"nw":false},{"id":"tcfr::d1d27c92fa098f09","sid":"EE3-5.06","p":1,"nw":false},{"id":"tcfr::87a7a2774cacd354","sid":"EE3-5.07","p":1,"nw":false},{"id":"tcfr::144afefbaf61ebbe","sid":"EE3-5.08","p":2,"nw":false},{"id":"tcfr::79699c39b605176c","sid":"EE3-5.09","p":2,"nw":true},{"id":"tcfr::daf95b2937abb714","sid":"EE3-5.10","p":3,"nw":true}],"words":197,"answer":[[["EE3-5.01","EE3-5.02","EE3-5.03"]],[["EE3-5.04","EE3-5.05","EE3-5.06","EE3-5.07"]],[["EE3-5.08","EE3-5.09"]],[["EE3-5.10"]]],"range":[120,180]},{"key":"EE3-6","task":"EE3","pos":6,"who":"essay","paras":4,"freq":{"rank":2,"of":53,"box":9,"n":82,"size":3,"listed":26,"tied":0,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#g-EE_T3-9"},"en":"Document A:\nResearch has shown that certain parts of the adult brain can develop thanks to video games. Thus, playing can be beneficial, as it helps, for example, to strengthen analysis, decision-making, and reaction speed. This is good news, since 83% of gamers are adults. However, one must remain vigilant, as some video games do not produce these positive effects on the brain.\n\nDocument B:\nOver three years, researchers observed children aged 8 to 17 to study the effects of video games. The conclusions indicate that children who play a lot become more violent, more tense, and more stressed than others. They also perform less well in school. That is why parents are advised to be careful and to monitor the time spent playing video games.\n\nQuestion: Video games: a useful hobby or a dangerous one? What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nDes recherches ont montré que certaines parties du cerveau des adultes peuvent se développer grâce aux jeux vidéo. Ainsi, jouer peut-être bénéfique, car cela aide, par exemple, à renforcer l’analyse, la prise de décision et la rapidité de réaction. C’est une bonne nouvelle, puisque 83 % des joueurs sont des adultes. Toutefois, il faut rester vigilant, car certains jeux vidéo n’apportent pas ces effets positifs sur le cerveau.\n\nDocument B :\nDurant trois ans, des chercheurs ont observé des enfants de 8 à 17 ans pour étudier les effets des jeux vidéo. Les conclusions indiquent que les enfants qui y jouent beaucoup deviennent plus violents, plus tendus et plus stressés que les autres. Ils réussissent aussi moins bien à l’école. C’est pourquoi il est conseillé aux parents de faire attention et de contrôler le temps passé devant les jeux vidéo.\n\nRéussir l'expression écrite\nPour partager les sujets de votre session:\nLes pages\nActualité\nCompréhension Écrite\nCompréhension Orale\nExpression écrite\nExpression orale\nNos Formations\nConsultation\nContactez-nous\nPolitique de retour\nPolitique de confidentialité\nMentions Légales et CGU\nBlog\nCentre d'examen TCF Canada\nÀ propos – Packs Nabil\nFAQ\nNos Contacts\ninfo@reussir-tcfcanada.com\n+212 647-908046\nles méthodologies\nCompréhension Écrite\nCompréhension Orale\nExpression écrite\nExpression orale\nÀ propos de nous\nPlateforme spécialisée dans la préparation au TCF Canada avec des tests adaptés et des sujets mis à jour.\n\nPartager avec votre réseau\nNous acceptons\nPaiment\nCliquez ici\nRéussir TCF Canada LTD. © 2026  | Tous les droits sont réservés\n\nAccueil\nSe connecter\nS’inscrire\nCompréhension écrite\nCompréhension Orale\nExpression Écrite\nExpression Orale\nNos Formations\nCentre d’examen TCF Canada\nTarifs\nConsultation\nContactez-nous\nBlog\nNous utilisons des cookies pour améliorer votre expérience sur notre site Web. En naviguant sur ce site, vous acceptez notre utilisation des cookies.\nPlus d'informations Plus d'informationsAccepter\n\n\n\nSkip to navigation\nSkip to main content\nBienvenue sur la plateforme de Réussir Tcf Canada\nFORMATIONS\nTarifs\nConsultation\nBlog\nCabinet d’immigration\nRéussir TCF Canada\nCompréhension Écrite\nCompréhension Orale\nExpression Écrite\nExpression Orale\nSe connecter\nS’inscrire\nOctobre 2025\nSujets d'actualité\nAttention!\nCes contenus sont inspirés de vrais essais ! Ils ne constituent pas les originaux.\n×\nConsignes\nFormations\nExemples corrigés\n\nQuestion : Les jeux vidéo : un loisir utile ou dangereux : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::0f6ce4d3db6d530c","sid":"EE3-6.01","p":0,"nw":true},{"id":"tcfr::3c1a1913c1d88d63","sid":"EE3-6.02","p":0,"nw":false},{"id":"tcfr::a9d5364398953543","sid":"EE3-6.03","p":1,"nw":true},{"id":"tcfr::42ffa6f92e3e0b0b","sid":"EE3-6.04","p":1,"nw":false},{"id":"tcfr::6b2c4189d3c2d32d","sid":"EE3-6.05","p":1,"nw":true},{"id":"tcfr::255f1b4cc7a58653","sid":"EE3-6.06","p":2,"nw":true},{"id":"tcfr::afa39f5d702d47cf","sid":"EE3-6.07","p":2,"nw":false},{"id":"tcfr::c3578c0eacddb921","sid":"EE3-6.08","p":3,"nw":true},{"id":"tcfr::fc884a0d497fd930","sid":"EE3-6.09","p":3,"nw":false},{"id":"tcfr::2edfbcc3b50ce122","sid":"EE3-6.10","p":3,"nw":false},{"id":"tcfr::9126e06a5e1b1f9a","sid":"EE3-6.11","p":3,"nw":false}],"words":265,"answer":[[["EE3-6.01","EE3-6.02"]],[["EE3-6.03","EE3-6.04","EE3-6.05"]],[["EE3-6.06","EE3-6.07"]],[["EE3-6.08","EE3-6.09","EE3-6.10","EE3-6.11"]]],"range":[120,180]},{"key":"EE3-7","task":"EE3","pos":7,"who":"essay","paras":4,"freq":{"rank":46,"of":53,"box":26,"n":65,"size":2,"listed":4,"tied":4,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#g-EE_T3-26"},"en":"Document A:\nRetirement homes represent a suitable solution for elderly people. They receive appropriate care and professional supervision there. In addition, they have the opportunity to participate in various activities that allow them to maintain a social life and avoid loneliness. In some cases, it is better than staying alone at home. (Sophie, nurse)\n\nDocument B:\nRetirement homes can deprive elderly people of their family's presence and give them the feeling of being abandoned. Moreover, the living conditions are not always satisfactory, and some facilities sometimes lack competent staff. In my opinion, home care is a better solution for aging near loved ones. (John, retiree)\n\nQuestion: Retirement homes or staying at home? What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nLes maisons de retraite représentent une solution adaptée pour les personnes âgées. Elles y bénéficient de soins appropriés et d’un encadrement professionnel. En plus, elles ont la possibilité de participer à diverses activités qui leur permettent de garder une vie sociale et d’éviter la solitude. Dans certains cas, c’est mieux que de rester seules chez elles.\n\n(Sophie, infirmière)\n\nDocument B :\nLes maisons de retraite peuvent priver les personnes âgées de la présence de leur famille et donner l’impression d’être abandonné. De plus, les conditions de vie ne sont pas toujours satisfaisantes et certains établissements manquent parfois de personnel compétent. Selon moi, l’aide à domicile est une meilleure solution pour vieillir auprès de ses proches.\n\n(Jean, retraité)\n\nQuestion : Maisons de retraite ou maintien à domicile : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::3d832a1b12c622cc","sid":"EE3-7.01","p":0,"nw":false},{"id":"tcfr::b91f3ac43448e6f9","sid":"EE3-7.02","p":1,"nw":false},{"id":"tcfr::17a0aa05fbd0b6b9","sid":"EE3-7.03","p":1,"nw":true},{"id":"tcfr::c92ff26be323c33a","sid":"EE3-7.04","p":2,"nw":true},{"id":"tcfr::a966e2865c4cd567","sid":"EE3-7.05","p":2,"nw":false},{"id":"tcfr::a37b15f17f395a3f","sid":"EE3-7.06","p":3,"nw":true},{"id":"tcfr::d64262f148781e93","sid":"EE3-7.07","p":3,"nw":false}],"words":203,"answer":[[["EE3-7.01"]],[["EE3-7.02","EE3-7.03"]],[["EE3-7.04","EE3-7.05"]],[["EE3-7.06","EE3-7.07"]]],"range":[120,180]},{"key":"EE3-8","task":"EE3","pos":8,"who":"essay","paras":4,"freq":{"rank":38,"of":53,"box":null,"n":42,"size":1,"listed":6,"tied":3,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#p-42"},"en":"Document A:\nNowadays, some job applicants add a photo to their resume, while others do not. Experts recommend banning it to avoid any form of discrimination. A study shows that recruiters are primarily interested in experience (32%) and degrees (15%), while only 2% start by looking at the photo. A surprising statistic, given the importance often placed on appearance.\n\nDocument B:\nThe presence of a photo on a resume is debated among employers. Some believe that it helps them better visualize the candidate and remember them more easily among many applications. Others think that it depends on the position: in front-desk or reception jobs, for example, a photo can be useful, provided it is professional and conveys a positive image.\n\nQuestion: Photo on the resume: for or against? What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nDe nos jours, certains candidats ajoutent une photo sur leur CV, d’autres non. Des experts recommandent de l’interdire pour éviter toute forme de discrimination. Une étude montre que les recruteurs s’intéressent d’abord à l’expérience (32 %) et aux diplômes (15 %), tandis que seulement 2 % commencent par regarder la photo. Une statistique étonnante, vu l’importance souvent accordée à l’apparence.\n\nDocument B :\nLa présence d’une photo sur le CV fait débat chez les employeurs. Certains estiment qu’elle permet de mieux visualiser le candidat et de s’en souvenir plus facilement parmi de nombreux dossiers. D’autres pensent que cela dépend du poste : dans les métiers d’accueil, par exemple, une photo peut être utile, à condition qu’elle soit professionnelle et transmette une image positive.\n\nQuestion : La photo sur le CV : pour ou contre ? Quel est votre point de vue sur ces deux documents et quelle est votre position sur ce sujet ?","cards":[{"id":"tcfr::a068da9ad7ef7076","sid":"EE3-8.01","p":0,"nw":true},{"id":"tcfr::e2ffa1759ab6a4f1","sid":"EE3-8.02","p":1,"nw":true},{"id":"tcfr::1ddb788693a2ec9f","sid":"EE3-8.03","p":1,"nw":false},{"id":"tcfr::9c09b84d810ac2ef","sid":"EE3-8.04","p":1,"nw":false},{"id":"tcfr::977fefefefad7187","sid":"EE3-8.05","p":1,"nw":true},{"id":"tcfr::053cf93e6a308fff","sid":"EE3-8.06","p":1,"nw":true},{"id":"tcfr::b115ad72fd892f1a","sid":"EE3-8.07","p":2,"nw":true},{"id":"tcfr::00e275544ac344f6","sid":"EE3-8.08","p":2,"nw":false},{"id":"tcfr::93e9642522f403be","sid":"EE3-8.09","p":2,"nw":false},{"id":"tcfr::823e5b9cad7b62cd","sid":"EE3-8.10","p":2,"nw":true},{"id":"tcfr::82afa2944085bdc0","sid":"EE3-8.11","p":2,"nw":false},{"id":"tcfr::2b2c2512d315a1cd","sid":"EE3-8.12","p":3,"nw":true}],"words":246,"answer":[[["EE3-8.01"]],[["EE3-8.02","EE3-8.03","EE3-8.04","EE3-8.05","EE3-8.06"]],[["EE3-8.07","EE3-8.08","EE3-8.09","EE3-8.10","EE3-8.11"]],[["EE3-8.12"]]],"range":[120,180]},{"key":"EE3-9","task":"EE3","pos":9,"who":"essay","paras":3,"freq":{"rank":35,"of":53,"box":24,"n":92,"size":5,"listed":7,"tied":0,"close":false,"url_en":"https://binarybreeze05.github.io/tcf-prompts/ee-t3-EN.html#g-EE_T3-24"},"en":"Document A:\nMany people find advertising annoying, but in my opinion, it is very useful for businesses. It serves to introduce a product or service. Sometimes, it is even funny! I like listening to it when I drive. It also helps me discover new products and special offers. For me, comparing products through advertising allows you to save a lot of money. Finally, free games on phones depend on advertising; without it, they would be paid. -- Lucas, 28 years old\n\nDocument B:\nWe are surrounded by advertising every day: newspapers, radio, television, smartphones, the internet... For example, television shows are often interrupted by ads, which can be irritating. Receiving piles of advertising every year in the mailbox is not good for the environment either! In my opinion, it would be useful to create a law to limit advertising on television and by mail. More subtle advertising would be better received. -- Alma, 35 years old\n\nQuestion: Advertising targeting children. What is your point of view on these two documents and what is your position on this topic?","fr":"Document A :\nBeaucoup trouvent la publicité agaçante, mais à mon avis, elle est très utile pour les entreprises. Elle sert à présenter un produit ou un service. Parfois, elle est même drôle ! J’aime bien l’écouter quand je conduis. Elle m’aide également à découvrir les nouveautés et les offres spéciales. Pour moi, comparer les articles grâce à la publicité permet de faire de bonnes économies. Enfin, les jeux gratuits sur téléphone dépendent des publicités ; sans elles, ils seraient payants.\n— Lucien, 28 ans\n\nDocument B :\nNous sommes entourés de publicité tous les jours : journaux, radios, télévisions, smartphones, Internet… Par exemple, les émissions télévisées sont souvent coupées par des pubs, ce qui peut être irritant. Recevoir des kilos de publicité chaque année dans la boîte aux lettres n’est pas non plus bon pour l’environnement ! Selon moi, il serait utile de créer une loi pour limiter les publicités à la télévision et par courrier. Des publicités plus discrètes seraient mieux reçues.\n\n— Alma, 35 ans\n\nRéussir l'expression écrite\nPour partager les sujets de votre session:\nLes pages\nActualité\nCompréhension Écrite\nCompréhension Orale\nExpression écrite\nExpression orale\nNos Formations\nConsultation\nContactez-nous\nPolitique de retour\nPolitique de confidentialité\nMentions Légales et CGU\nBl -9.06"]]],"range":[120,180]}],"cards":{"EO2-1.01":{"en":"Yeah, so I just arrived in Quebec and I'm looking for an apartment.","l1":"Yes, so I've just arrived in Québec and I'm looking for an apartment.","fr":"Oui, donc je viens d'arriver au Québec et je cherche un appartement."},"EO2-1.02":{"en":"I'm looking for like a one-bedroom apartment.","l1":"I'm looking for an apartment with one bedroom.","fr":"Je cherche un appartement avec une chambre."},"EO2-1.03":{"en":"And I guess my first question is...if you're looking for housing here, where do you usually start searching?","l1":"And I imagine that my first question, it's… when one looks for housing here, one starts by looking where, usually?","fr":"Et j'imagine que ma première question, c'est… quand on cherche un logement ici, on commence par regarder où, d'habitude ?"},"EO2-1.04":{"en":"How much do your charge for your services to help people look for places to rent?","l1":"How much do your services cost to help people look for housing to rent?","fr":"Combien coûtent vos services pour aider les gens à chercher un logement à louer ?"},"EO2-1.05":{"en":"So is this like a one-time thing, or is this recurring?","l1":"So then, it is a one-time thing, or it is regular?","fr":"Du coup, c'est un truc ponctuel, ou c'est régulier ?"},"EO2-1.06":{"en":"So, do you, in your catalog, do you have any one-bedroom apartments?","l1":"So, you have, in your catalogue, you have apartments with one bedroom?","fr":"Donc, vous avez, dans votre catalogue, vous avez des appartements avec une chambre ?"},"EO2-1.07":{"en":"Do you have any that are potentially like at at most 20 minutes by car to Montreal College?","l1":"You have some that would be at 20 minutes maximum by car from the Montreal College?","fr":"Vous en avez qui seraient à 20 minutes maximum en voiture du Montreal College ?"},"EO2-1.08":{"en":"Okay, that's great.","l1":"Very good, it's super.","fr":"Très bien, c'est super."},"EO2-1.09":{"en":"Are these apartments clean?","l1":"Th certain of the causes of death the most common, like the cancer of the lung, in the case of tobacco, and driving in a state of drunkenness, in the case of alcohol, without speaking of the fact that alcohol is a frequent factor in all sorts of crimes, you know… conjugal violence, homicides, and I pass over the rest.","fr":"Ils sont sans doute responsables de certaines des causes de décès les plus courantes, comme le cancer du poumon, dans le cas du tabac, et la conduite en état d'ivresse, dans le cas de l'alcool, sans parler du fait que l'alcool est un facteur fréquent dans toutes sortes de crimes, vous savez… les violences conjugales, les homicides, et j'en passe."},"EO3-1.07":{"en":"So yes, I think in a hypothetical society where no one consumes tobacco or alcohol, we would probably see less crime and longer lives.","l1":"So yes, I think that in a society where nobody would smoke nor would drink alcohol, we would see without doubt less criminality and people would live longer.","fr":"Donc oui, je pense que dans une société où personne ne fumerait ni ne boirait d'alcool, on verrait sans doute moins de criminalité et les gens vivraient plus longtemps."},"EO3-1.08":{"en":"The question though is... whether or not the state banning the sale of tobacco and alcohol actually creates this sort of society.","l1":"But the question, it's… to know if, by forbidding the sale of tobacco and of alcohol, the État creates really this kind of society.","fr":"Mais la question, c'est… de savoir si, en interdisant la vente de tabac et d'alcool, l'État crée vraiment ce genre de société."},"EO3-1.09":{"en":"We have seen before. in the past, that banning alcohol doesn’t really go well.","l1":"One has already seen in the past that to forbid alcohol, that does not go really well.","fr":"On a déjà vu par le passé qu'interdire l'alcool, ça ne se passe pas vraiment bien."},"EO3-1.10":{"en":"There was this period in the United States called The Prohibition.","l1":"In the États-Unis, there was a period that we call the Prohibition.","fr":"Aux États-Unis, il y a eu une période qu'on appelle la Prohibition."},"EO3-1.11":{"en":"I don’t know too much about it, but the idea is that they tried to ban alcohol and it led to more harm than good.","l1":"I don't know much of it, but the idea, it's that they tried to forbid alcohol and that it did more harm than good.","fr":"Je n'en sais pas grand-chose, mais l'idée, c'est qu'ils ont essayé d'interdire l'alcool et que ça a fait plus de mal que de bien."},"EO3-1.12":{"en":"And this was because alcohol didn't stop being available just because the state banned it.","l1":"And it was because alcohol did not cease to be available just because the État forbade it.","fr":"Et c'était parce que l'alcool n'a pas cessé d'être disponible juste parce que l'État l'a interdit."},"EO3-1.13":{"en":"It just became available through other means and those means were more dangerous, and often involved gangs, and guns, and people shooting each other.","l1":"It just became available by other means, and these means were more dangerous, with often gangs, weapons and people who shot at each other.","fr":"C'est juste devenu disponible par d'autres moyens, et ces moyens étaient plus dangereux, avec souvent des gangs, des armes et des gens qui se tiraient dessus."},"EO3-1.14":{"en":"And so the US saw an increase in homicides and gang violence during this period.","l1":"And so, the États-Unis knew a rise of homicides and of the violence of gangs during this period.","fr":"Et donc, les États-Unis ont connu une hausse des homicides et de la violence des gangs pendant cette période."},"EO3-1.15":{"en":"People also just became more drunk in general, and consumed way more alcohol, during this period when it was supposedly banned.","l1":"People were also quite simply more drunk in general, and consumed a lot more alcohol, during this period when it was so-called forbidden.","fr":"Les gens étaient aussi tout simplement plus ivres en général, et consommaient beaucoup plus d'alcool, pendant cette période où c'était soi-disant interdit."},"EO3-1.16":{"en":"Because when you don't have guaranteed access to something, the moment you get it, you tend to go crazy with it, because you might not get it ever again.","l1":"Because when one does not have a guaranteed access to something, as soon as one obtains it, one has a tendency to abuse it, because one will perhaps never have it again.","fr":"Parce que quand on n'a pas un accès garanti à quelque chose, dès qu'on l'obtient, on a tendance à en abuser, parce qu'on ne l'aura peut-être plus jamais."},"EO3-1.17":{"en":"This is a consequence of banning these substances that are harmful but also quite popular.","l1":"It's a consequence of the fact of forbidding these substances, which are harmful but also quite popular.","fr":"C'est une conséquence du fait d'interdire ces substances, qui sont nocives mais aussi assez populaires."},"EO3-1.18":{"en":"They won’t necessarily stop being available.","l1":"They are not going to necessarily disappear.","fr":"Elles ne vont pas forcément disparaître."},"EO3-1.19":{"en":"Most recreational drugs are banned, but that doesn’t mean we don’t have a drug crisis right now in most major cities in North America.","l1":"Most recreational drugs are forbidden, but that doesn't mean that we don't have a drug crisis at this moment in most of the big cities of Amérique du Nord.","fr":"La plupart des drogues récréatives sont interdites, mais ça ne veut pas dire qu'on n'a pas de crise de la drogue en ce moment dans la plupart des grandes villes d'Amérique du Nord."},"EO3-1.20":{"en":"These drugs just become available through other means.","l1":"These drugs, we just find them by other means.","fr":"Ces drogues, on les trouve juste par d'autres moyens."},"EO3-1.21":{"en":"I think the same would happen for tobacco and alcohol because they are quite popular, recreational substances, and people will still try to get their hands on them through any means available.","l1":"I think that the same thing would happen with the tobacco and the alcohol, because they are some recreational substances quite widespread, and people will all the same try to put their hand on them by all means.","fr":"Je pense qu'il se passerait la même chose avec le tabac et l'alcool, parce que ce sont des substances récréatives assez répandues, et les gens essaieront quand même de mettre la main dessus par tous les moyens."},"EO3-1.22":{"en":"So yea, that's why even though they are harmful substances, I don't think the state should ban them.","l1":"So yes, it's for that that, even if they are noxious substances, I don't think that the État should forbid them.","fr":"Donc oui, c'est pour ça que, même si ce sont des substances nocives, je ne pense pas que l'État doive les interdire."},"EO3-1.23":{"en":"They can continue to put like warning stickers and stuff on cigarette packs like they're doing right now, I think that helps...you know, those stickers that show striking images of how lung cancer looks like and stuff... yea, that's good, we should continue with that.","l1":"They can continue to put warning stickers and all that on the packets of cigarettes, like they do it at the moment, I think that it helps… you know, these stickers that show striking images of what a cancer of the lung looks like and all… yes, that, it's good, we should continue like that.","fr":"Ils peuvent continuer à mettre des autocollants d'avertissement et tout ça sur les paquets de cigarettes, comme ils le font en ce moment, je pense que ça aide… vous savez, ces autocollants qui montrent des images frappantes de ce à quoi ressemble un cancer du poumon et tout… oui, ça, c'est bien, on devrait continuer comme ça."},"EO3-1.24":{"en":"But banning, no, it would lead to more harm that good for sure.","l1":"But forbidding, no, that would do more harm than good, that's sure.","fr":"Mais interdire, non, ça ferait plus de mal que de bien, c'est sûr."},"EO3-2.01":{"en":"It goes without saying that it’s really important to be cautious with children.","l1":"It goes without saying that it's really important to pay attention with the children.","fr":"Il va sans dire que c'est vraiment important de faire attention avec les enfants."},"EO3-2.02":{"en":"I have a friend who studied Behavioral Science at the University of Cambridge, and she told me that most of our behaviors as adults are actually derived from two main sources: one is our genes, which we can’t really control, and the other is our experiences as a child.","l1":"I have a friend who studied the sciences of behavior at the University of Cambridge, and she told me that most of our adult behaviors come in fact from two main sources: on one side our genes, which one can't really control, and on the other our childhood experiences.","fr":"J'ai une amie qui a étudié les sciences du comportement à l'université de Cambridge, et elle m'a dit que la plupart de nos comportements d'adultes viennent en fait de deux sources principales : d'un côté nos gènes, qu'on ne peut pas vraiment contrôler, et de l'autre nos expériences d'enfance."},"EO3-2.03":{"en":"So... this goes to show how important that period of your life is - from the age of five to the age of nine.","l1":"So… that shows well to what point this period of life is important, from five to nine years old.","fr":"Donc… ça montre bien à quel point cette période de la vie est importante, de cinq à neuf ans."},"EO3-2.04":{"en":"It's really the experiences from this period of life, which forms the foundation of a person's worldview and mental frameworks that they would subconsciously continue to use for the rest of their life, even if they're not aware of it... even if they're not aware that these behaviors stem from their childhood experiences.","l1":"It's really the experiences of this period of life that lay the bases of the vision of the world of a person and of the mental schemas that she is going to continue to use unconsciously all the rest of her life, even if she is not conscious of it… even if she is not conscious that these behaviours come from her experiences of childhood.","fr":"Ce sont vraiment les expériences de cette période de la vie qui posent les bases de la vision du monde d'une personne et des schémas mentaux qu'elle va continuer à utiliser inconsciemment tout le reste de sa vie, même si elle n'en a pas conscience… même si elle n'a pas conscience que ces comportements viennent de ses expériences d'enfance."},"EO3-2.05":{"en":"So...this is why it's quite important to be really careful with how we interact with children.","l1":"So… it's for that that it's quite important to really pay attention to the way in which one interacts with children.","fr":"Donc… c'est pour ça que c'est assez important de faire vraiment attention à la façon dont on interagit avec les enfants."},"EO3-2.06":{"en":"That being said, “always” is a strong word.","l1":"That said, “always”, it's a big word.","fr":"Cela dit, « toujours », c'est un grand mot."},"EO3-2.07":{"en":"I don’t really want to say you should \"always\" do something, because there are always exceptional cases.","l1":"I don't really feel like saying that we should \"always\" do something, because there are always exceptions.","fr":"Je n'ai pas vraiment envie de dire qu'on devrait « toujours » faire quelque chose, parce qu'il y a toujours des exceptions."},"EO3-2.08":{"en":"This is going to go in a bit of a dark direction, I guess, but if someone got murdered in the family, or if something really dark happened, I don't really think we should be directly telling a child what truly happened.","l1":"This is going to take a bit of a dark turn, I imagine, but if someone got themselves murdered in the family, or if something really dark happened, I don't really think that one should directly tell a child what really happened.","fr":"Ça va prendre une tournure un peu sombre, j'imagine, mais si quelqu'un s'est fait assassiner dans la famille, ou si quelque chose de vraiment sombre est arrivé, je ne pense pas vraiment qu'on doive dire directement à un enfant ce qui s'est réellement passé."},"EO3-2.09":{"en":"I don't think that would be a good idea.","l1":"I don't think that it's a good idea.","fr":"Je ne pense pas que ce soit une bonne idée."},"EO3-2.10":{"en":"It would make it quite traumatic for them.","l1":"It would be quite traumatizing for them.","fr":"Ce serait assez traumatisant pour eux."},"EO3-2.11":{"en":"They wouldn't be able to handle the emotional weight and burden of the event.","l1":"They would not manage to bear the weight and the emotional charge of this event.","fr":"Ils n'arriveraient pas à supporter le poids et la charge émotionnelle de cet événement."},"EO3-2.12":{"en":"I think, whenever we deal with these decisions involving children, the key factor in our decisions should be what prepares them better for their future, really taking into consideration their long-term future and their long-term trajectory, rather than what’s comfortable in the present.","l1":"I think that, each time one takes this kind of decisions that concern children, the key factor in our decisions should be what prepares them better for their future, really taking into account their long-term future and their long-term trajectory, rather than what is comfortable in the present.","fr":"Je pense que, chaque fois qu'on prend ce genre de décisions qui concernent les enfants, le facteur clé dans nos décisions devrait être ce qui les prépare mieux à leur avenir, en prenant vraiment en compte leur avenir à long terme et leur trajectoire à long terme, plutôt que ce qui est confortable dans le présent."},"EO3-2.13":{"en":"In some cases, yes, we should tell children the truth.","l1":"In certain cases, yes, one should tell the truth to children.","fr":"Dans certains cas, oui, on devrait dire la vérité aux enfants."},"EO3-2.14":{"en":"We should probably tell them the truth that fast food is not healthy for them, even if they absolutely love fast food.","l1":"We should without doubt tell them the truth, tell them that the fast food, it's not healthy for them, even if they really adore the fast food.","fr":"On devrait sans doute leur dire la vérité, leur dire que le fast-food, ce n'est pas sain pour eux, même s'ils adorent vraiment le fast-food."},"EO3-2.15":{"en":"We may have to tell them the truth that certain things are not safe, like walking around at night, because they could face danger.","l1":"We will maybe have to tell them the truth, tell them that certain things are dangerous, like walking around at night, because they could find themselves in danger.","fr":"On devra peut-être leur dire la vérité, leur dire que certaines choses sont dangereuses, comme se promener la nuit, parce qu'ils pourraient se retrouver en danger."},"EO3-2.16":{"en":"These sorts of things are important to tell children truthfully, but darker stuff that has more emotional burden, and more potential for causing trauma...","l1":"This kind of things, it's important to say them honestly to children, but for the darker things, which have a heavier emotional charge and more risks of provoking a trauma…","fr":"Ce genre de choses, c'est important de les dire honnêtement aux enfants, mais pour les choses plus sombres, qui ont une charge émotionnelle plus lourde et plus de risques de provoquer un traumatisme…"},"EO3-2.17":{"en":"I don't see a problem at all with not telling the full truth.","l1":"I see no problem at all in not saying all the truth.","fr":"Je ne vois aucun problème à ne pas dire toute la vérité."},"EO3-2.18":{"en":"What do we lose by not telling the truth to them about these traumatic events?","l1":"What do we lose by not telling them the truth about these traumatizing events?","fr":"Qu'est-ce qu'on perd à ne pas leur dire la vérité sur ces événements traumatisants ?"},"EO3-2.19":{"en":"We don't really lose much, I don't think.","l1":"I don't believe that we really lose much there.","fr":"Je ne crois pas qu'on y perde vraiment grand-chose."},"EO3-2.20":{"en":"That’s my opinion on this topic.","l1":"That's my opinion on this subject.","fr":"C'est mon avis sur ce sujet."},"EO3-3.01":{"en":"Okay, are degrees more important than experience?","l1":"So, diplomas, are they more important than experience?","fr":"Alors, les diplômes sont-ils plus importants que l'expérience ?"},"EO3-3.02":{"en":"I would say this topic is a bit personal to me because I only studied until I completed my associate degree, which is a two-year degree.","l1":"I would say that this subject touches me a bit personally, because I stopped my studies after my associate degree, which is a diploma in two years.","fr":"Je dirais que ce sujet me touche un peu personnellement, parce que j'ai arrêté mes études après mon associate degree, qui est un diplôme en deux ans."},"EO3-3.03":{"en":"I didn’t continue until I finished my bachelor’s degree.","l1":"I did not continue until the end of my bachelor.","fr":"Je n'ai pas continué jusqu'à la fin de mon bachelor."},"EO3-3.04":{"en":"The reason I decided on that was because I was doing an 8-month internship during my second semester of college.","l1":"If I decided that, it's because I was doing an internship of 8 months during my second semester at university.","fr":"Si j'ai décidé ça, c'est parce que je faisais un stage de 8 mois pendant mon deuxième semestre à l'université."},"EO3-3.05":{"en":"And at the end of the intership, I was offered a full-time role by my manager, under the condition that I graduate at the end of the year... which meant that I wouldn't be able to continue my third and fourth years to finish my bachelor's.","l1":"And at the end of the internship, my manager proposed to me a full-time post, on condition that I be graduated at the end of the year… which wanted to say that I could not continue in third and in fourth year to finish my bachelor.","fr":"Et à la fin du stage, mon responsable m'a proposé un poste à temps plein, à condition que je sois diplômé à la fin de l'année… ce qui voulait dire que je ne pourrais pas continuer en troisième et en quatrième année pour finir mon bachelor."},"EO3-3.06":{"en":"So...","l1":"So…","fr":"Donc…"},"EO3-3.07":{"en":"I had to make a decision, and I decided to stop my studies, go full-time, and finish with an associate's degree.","l1":"I had to take a decision, and I decided to stop my studies, to pass to full time and to finish with an associate degree.","fr":"J'ai dû prendre une décision, et j'ai décidé d'arrêter mes études, de passer à temps plein et de terminer avec un associate degree."},"EO3-3.08":{"en":"And I chose to do that because I loved the company, I loved the manager, I loved the career trajectory of the job the pay... all that.","l1":"And I chose to do that because I adored the company, I adored my manager, I adored the career perspectives of the post, the salary… all that.","fr":"Et j'ai choisi de faire ça parce que j'adorais l'entreprise, j'adorais mon responsable, j'adorais les perspectives de carrière du poste, le salaire… tout ça."},"EO3-3.09":{"en":"And to this day, I think it was the right decision.","l1":"And still today, I think that it was the right decision.","fr":"Et encore aujourd'hui, je pense que c'était la bonne décision."},"EO3-3.10":{"en":"But what that experience showed me was that it is indeed possible to compensate for the lack of degrees with good experience.","l1":"But what this experience showed me, it's that it is effectively possible to compensate the lack of diplomas with a good experience.","fr":"Mais ce que cette expérience m'a montré, c'est qu'il est effectivement possible de compenser le manque de diplômes par une bonne expérience."},"EO3-3.11":{"en":"To answer the question of whether degrees are more important than experience...","l1":"To answer the question of knowing if diplomas are more important than experience…","fr":"Pour répondre à la question de savoir si les diplômes sont plus importants que l'expérience…"},"EO3-3.12":{"en":"I think it’s more often possible to compensate for a lack of degrees with experience, like I did, rather than to compensate for a lack of experience with degrees.","l1":"I think that it is more often possible to compensate a lack of diplomas by experience, like I did it, than to compensate a lack of experience by diplomas.","fr":"Je pense qu'il est plus souvent possible de compenser un manque de diplômes par de l'expérience, comme je l'ai fait, que de compenser un manque d'expérience par des diplômes."},"EO3-3.13":{"en":"I think, especially in the current job market where there have been a lot of layoffs, and everyone that was laid off and is now looking for a job, have degrees of some sort, especially from top colleges... employers don’t really put that much weight on degrees anymore.","l1":"I think that, above all on the current market of work, where there have been many layoffs and where all those who got themselves laid off and who look now for a job have a diploma of one sort or of another, in particular from the best universities… employers no longer really accord as much importance to diplomas.","fr":"Je pense que, surtout sur le marché du travail actuel, où il y a eu beaucoup de licenciements et où tous ceux qui se sont fait licencier et qui cherchent maintenant un emploi ont un diplôme d'une sorte ou d'une autre, en particulier des meilleures universités… les employeurs n'accordent plus vraiment autant d'importance aux diplômes."},"EO3-3.14":{"en":"In the past, sure, degrees can give you an upper hand, because there are more postings than applicants, they're more willing and likely to give the role to someone with just a degree and no experience.","l1":"Before, it's sure, diplomas could give an advantage, because there were more offers of employment than candidates, and employers were more disposed, and more inclined, to give the post to someone who had just a diploma and no experience.","fr":"Avant, c'est sûr, les diplômes pouvaient donner un avantage, parce qu'il y avait plus d'offres d'emploi que de candidats, et les employeurs étaient plus disposés, et plus enclins, à donner le poste à quelqu'un qui avait juste un diplôme et pas d'expérience."},"EO3-3.15":{"en":"But these days...because you're competing against thousands of other applicants, it's much more unlikely that you would get a shot just due to your degree, even if you're from the most prestigious universities, because there is probably someone who just got laid off, with a degree from that university, but with actual work experience.","l1":"But in our days… as one is in competition with thousands of other candidates, it's much less probable that one has one's chance just thanks to one's diploma, even if one comes from the most prestigious universities, because there is probably someone who just got laid off, with a diploma from this university, but with a real professional experience.","fr":"Mais de nos jours… comme on est en concurrence avec des milliers d'autres candidats, c'est beaucoup moins probable qu'on ait sa chance juste grâce à son diplôme, même si on vient des universités les plus prestigieuses, parce qu'il y a probablement quelqu'un qui vient de se faire licencier, avec un diplôme de cette université, mais avec une vraie expérience professionnelle."},"EO3-3.16":{"en":"Matter of fact, employers don't even hire the same way as they used to do anymore.","l1":"Besides, employers don't even recruit the same way as before anymore.","fr":"D'ailleurs, les employeurs ne recrutent même plus de la même façon qu'avant."},"EO3-3.17":{"en":"No one wants to sift through a thousand resumes.","l1":"Nobody has the urge to peel through a thousand CVs.","fr":"Personne n'a envie d'éplucher mille CV."},"EO3-3.18":{"en":"And so employers are leaning way more towards hiring internally these days, because they would have to sift through less applications, but also it's more likely that the applicants have relevant work experience, because they work at the same company.","l1":"And so the employers are turning much more towards internal recruitment these last times, because that makes them fewer applications to peel through, but also because there are more chances that the candidates have a pertinent professional experience, seeing that they work in the same company.","fr":"Et donc les employeurs se tournent beaucoup plus vers le recrutement interne ces derniers temps, parce que ça leur fait moins de candidatures à éplucher, mais aussi parce qu'il y a plus de chances que les candidats aient une expérience professionnelle pertinente, vu qu'ils travaillent dans la même entreprise."},"EO3-3.19":{"en":"And they're also relying more heavily on referrals.","l1":"And they also lean a lot more on recommendations.","fr":"Et ils s'appuient aussi beaucoup plus sur les recommandations."},"EO3-3.20":{"en":"Because again, this is evidence of relevant work experience from some you already trust.","l1":"Because there again, it's a proof of pertinent professional experience that comes from someone in whom one already has confidence.","fr":"Parce que là encore, c'est une preuve d'expérience professionnelle pertinente qui vient de quelqu'un en qui on a déjà confiance."},"EO3-3.21":{"en":"And another common pathway that people are using nowadays to get jobs is posting on social media - talking about the projects that you're doing, sharing value to show your expertise on a domain, showing your work through an online portfolio - that sort of thing, it makes it much more likely for you to get a job today.","l1":"And another common means that people use these days to find a job, it's to publish on the social networks, talk about the projects one does, bring value to show one's expertise in a domain, show one's work with an online portfolio, this kind of things, that increases a lot the chances of finding a job today.","fr":"Et un autre moyen courant que les gens utilisent de nos jours pour trouver un emploi, c'est de publier sur les réseaux sociaux, parler des projets qu'on fait, apporter de la valeur pour montrer son expertise dans un domaine, montrer son travail avec un portfolio en ligne, ce genre de choses, ça augmente beaucoup les chances de trouver un emploi aujourd'hui."},"EO3-3.22":{"en":"So yea, having relevant work experience and being able to separate from the pile of a thousand resumes and stand out in some way to the employer, are the two most important factors in getting a job in 2026.","l1":"So yes, having a pertinent professional experience and managing to get out of the pile of the thousand CVs, to stand out in one way or another in the eyes of the employer, those are the two most important factors for finding a job in 2026.","fr":"Donc oui, avoir une expérience professionnelle pertinente et arriver à sortir de la pile des mille CV, à se démarquer d'une façon ou d'une autre aux yeux de l'employeur, ce sont les deux facteurs les plus importants pour trouver un emploi en 2026."},"EO3-3.23":{"en":"Degrees are far less important now, and by that I mean, just having a degree won't cut it.","l1":"Diplomas are a lot less important today, and by that I want to say that simply having a diploma, that is not enough.","fr":"Les diplômes sont beaucoup moins importants aujourd'hui, et par là je veux dire qu'avoir simplement un diplôme, ça ne suffit pas."},"EO3-4.01":{"en":"This is definitely a touchy subject - I'll try to do justice on it.","l1":"It's clearly a sensitive subject, I'm going to try to treat it as it should be.","fr":"C'est clairement un sujet sensible, je vais essayer de le traiter comme il faut."},"EO3-4.02":{"en":"I'm a strong believer that women should have the same rights as men.","l1":"I am firmly convinced that women must have the same rights as men.","fr":"Je suis fermement convaincu que les femmes doivent avoir les mêmes droits que les hommes."},"EO3-4.03":{"en":"Period.","l1":"Final point.","fr":"Point final."},"EO3-4.04":{"en":"I want to make sure to build on that foundation.","l1":"I hold to building on this base.","fr":"Je tiens à construire sur cette base."},"EO3-4.05":{"en":"But I'm not necessarily sure if mandatory quotas ensuring that all governments are exactly 50% men and 50% women is a good solution.","l1":"But I'm not necessarily sure that mandatory quotas that guarantee that all governments are composed of exactly 50% men and 50% women, that it's a good solution.","fr":"Mais je ne suis pas forcément sûr que des quotas obligatoires qui garantissent que tous les gouvernements sont composés exactement de 50 % d'hommes et de 50 % de femmes, ce soit une bonne solution."},"EO3-4.06":{"en":"To argue for this solution, one would say that it's important to show representation and ensure that key positions, like the government, where we make decisions that influence every single citizen in the entire country, have necessary and sufficient representation from different groups, demographics, and communities.","l1":"To defend this solution, one could say that it's important to render the representation visible and to make it so that the key posts, like the government, where one takes decisions that touch absolutely all the citizens of the entire country, have a necessary and sufficient representation of the different groups, demographic categories and communities.","fr":"Pour défendre cette solution, on pourrait dire que c'est important de rendre la représentation visible et de faire en sorte que les postes clés, comme le gouvernement, où on prend des décisions qui touchent absolument tous les citoyens du pays tout entier, aient une représentation nécessaire et suffisante des différents groupes, catégories démographiques et communautés."},"EO3-4.07":{"en":"I fully agree on that.","l1":"On that, I am entirely in agreement.","fr":"Là-dessus, je suis tout à fait d'accord."},"EO3-4.08":{"en":"What remains a debate for me, is where that minimum threshold of representation should be on that spectrum - should it be 20%?","l1":"What remains to debate, for me, it's where to place this minimum threshold of representation on this scale, that should be 20%?","fr":"Ce qui reste à débattre, pour moi, c'est où placer ce seuil minimum de représentation sur cette échelle, ça devrait être 20 % ?"},"EO3-4.09":{"en":"30%?","l1":"30%?","fr":"30 % ?"},"EO3-4.10":{"en":"40?","l1":"40?","fr":"40 ?"},"EO3-4.11":{"en":"50?","l1":"50?","fr":"50 ?"},"EO3-4.12":{"en":"I think a minimum 20% quota is fair - in either direction, whether it's 80% women and 20% men, or 80% women and 20% men.","l1":"I think that a minimum quota of 20% is fair, in both directions, whether it's 80% women and 20% men, or 80% men and 20% women.","fr":"Je pense qu'un quota minimum de 20 % est juste, dans les deux sens, que ce soit 80 % de femmes et 20 % d'hommes, ou 80 % d'hommes et 20 % de femmes."},"EO3-4.13":{"en":"I think 30% is understandable too.","l1":"I think that 30%, that is understandable too.","fr":"Je pense que 30 %, ça se comprend aussi."},"EO3-4.14":{"en":"But 40% and above...I don't know, it might be too rigid for me, I'm not gonna lie.","l1":"But from 40% and up… I don't know, that could be too rigid for my taste, I admit it.","fr":"Mais à partir de 40 %… je ne sais pas, ça pourrait être trop rigide à mon goût, je l'avoue."},"EO3-4.15":{"en":"Whatever the quota is, a mandatory quota fundamentally means that, you would choose someone less competent to fill a role just because that person meets your quota.","l1":"Whatever the quota is, a mandatory quota, that means at bottom that one would choose someone less competent to occupy a position just because this person fits into the quota.","fr":"Quel que soit le quota, un quota obligatoire, ça veut dire au fond qu'on choisirait quelqu'un de moins compétent pour occuper un poste juste parce que cette personne rentre dans le quota."},"EO3-4.16":{"en":"Let's say the cabinet currently has 95 men and 95 women, and it needs 10 more people.","l1":"Let's say that the cabinet currently counts 95 men and 95 women, and that it needs 10 more people.","fr":"Disons que le cabinet compte actuellement 95 hommes et 95 femmes, et qu'il a besoin de 10 personnes de plus."},"EO3-4.17":{"en":"A mandatory 50/50 rule would mean that you would have to hire exactly 5 more men and 5 more women.","l1":"A mandatory rule of 50/50 would mean that one would have to hire exactly 5 more men and 5 more women.","fr":"Une règle obligatoire de 50/50 voudrait dire qu'il faudrait embaucher exactement 5 hommes de plus et 5 femmes de plus."},"EO3-4.18":{"en":"But what if the 10 most competent people to fill the role are all women?","l1":"But what if the 10 most competent people for this position were all women?","fr":"Mais et si les 10 personnes les plus compétentes pour ce poste étaient toutes des femmes ?"},"EO3-4.19":{"en":"And one could argue that the cabinet already has 95 men, and that's enough male representation, so we should hire 10 women.","l1":"And one could say that the cabinet counts already 95 men, that that suffices as masculine representation, and that one should therefore hire 10 women.","fr":"Et on pourrait dire que le cabinet compte déjà 95 hommes, que ça suffit comme représentation masculine, et qu'on devrait donc embaucher 10 femmes."},"EO3-4.20":{"en":"BUt the mandatory quota would mean that we would have to hire 5 less competent men over their more competent woman counterparts.","l1":"But the mandatory quota would mean that one would have to hire 5 less competent men in the place of their more competent female counterparts.","fr":"Mais le quota obligatoire voudrait dire qu'on devrait embaucher 5 hommes moins compétents à la place de leurs homologues féminines plus compétentes."},"EO3-4.21":{"en":"I don't know.","l1":"I don't know.","fr":"Je ne sais pas."},"EO3-4.22":{"en":"I think there's fundamentally a minimum threshold after which representation is sufficient.","l1":"I think that at bottom there is a minimum threshold from which representation is sufficient.","fr":"Je pense qu'au fond il y a un seuil minimum à partir duquel la représentation est suffisante."},"EO3-4.23":{"en":"What that minimum threshold is, depends on the country, and it depends on its goals, and how much it's willing to trade off the value of competency and expertise, over the value that additional representation would bring.","l1":"What this minimum threshold is, that depends on the country, and that depends on its objectives, and on up to where it is ready to sacrifice the value of competence and expertise to the profit of the value that an additional representation would bring.","fr":"Quel est ce seuil minimum, ça dépend du pays, et ça dépend de ses objectifs, et de jusqu'où il est prêt à sacrifier la valeur de la compétence et de l'expertise au profit de la valeur qu'apporterait une représentation supplémentaire."},"EO3-4.24":{"en":"And I think past a certain threshold, that trade off is diminishing or even counterproductive to a government's fundamental goal which is to provide better lives for their citizens.","l1":"And I think that beyond a certain threshold, this compromise brings back less and less, or even becomes counterproductive in relation to the fundamental objective of a government, which is to offer a better life to its citizens.","fr":"Et je pense qu'au-delà d'un certain seuil, ce compromis rapporte de moins en moins, ou devient même contre-productif par rapport à l'objectif fondamental d'un gouvernement, qui est d'offrir une meilleure vie à ses citoyens."},"EO3-5.01":{"en":"Listen, I would love nothing more than having a world without borders, without passports, and without visas.","l1":"Listen, nothing would make me more pleasure than to have a world without borders, without passports and without visas.","fr":"Écoutez, rien ne me ferait plus plaisir que d'avoir un monde sans frontières, sans passeports et sans visas."},"EO3-5.02":{"en":"I seriously would not love anything more than that.","l1":"Seriously, nothing would make me more pleasure than that.","fr":"Sérieusement, rien ne me ferait plus plaisir que ça."},"EO3-5.03":{"en":"But I do not think it's possible.","l1":"But I don't think that it's possible.","fr":"Mais je ne pense pas que ce soit possible."},"EO3-5.04":{"en":"So let's talk about the consequences of making this happen.","l1":"So, let's talk of the consequences if one put that in place.","fr":"Alors, parlons des conséquences si on mettait ça en place."},"EO3-5.05":{"en":"This would mean that everyone could travel to another country without any restrictions, and everyone could stay in another country without any restrictions.","l1":"That would want to say that everybody could travel into another country without any restriction, and that everybody could stay in another country without any restriction.","fr":"Ça voudrait dire que tout le monde pourrait voyager dans un autre pays sans aucune restriction, et que tout le monde pourrait rester dans un autre pays sans aucune restriction."},"EO3-5.06":{"en":"And because there are a lot of countries today that unfortunately have really tough circumstances, whether it's due to harsh economic conditions or an evil dictator - waves of people would immediately migrate to more developed countries.","l1":"And as there are many countries today that, unfortunately, know a situation really difficult, be it because of hard economic conditions or of a cruel dictator, waves of people would migrate immediately towards more developed countries.","fr":"Et comme il y a beaucoup de pays aujourd'hui qui, malheureusement, connaissent une situation vraiment difficile, que ce soit à cause de conditions économiques dures ou d'un dictateur cruel, des vagues de gens migreraient immédiatement vers des pays plus développés."},"EO3-5.07":{"en":"Because they can.","l1":"Because they can do it.","fr":"Parce qu'ils peuvent le faire."},"EO3-5.08":{"en":"And can we really blame them for that?","l1":"And can one really hold it against them for that?","fr":"Et peut-on vraiment leur en vouloir pour ça ?"},"EO3-5.09":{"en":"We cannot.","l1":"One cannot.","fr":"On ne peut pas."},"EO3-5.10":{"en":"And in this scenario, developed countries like Canada and the US would see a huge influx of new migrants.","l1":"And in this scenario, developed countries like Canada and the États-Unis would know an enormous influx of new migrants.","fr":"Et dans ce scénario, des pays développés comme le Canada et les États-Unis connaîtraient un afflux énorme de nouveaux migrants."},"EO3-5.11":{"en":"It would be at a level, where the infrastructure of the country, even if the country is developed like Canada or the US, cannot sustain it.","l1":"That would reach a level where the infrastructures of the country, even if it's a developed country like Canada or the États-Unis, could not support it.","fr":"Ça atteindrait un niveau où les infrastructures du pays, même si c'est un pays développé comme le Canada ou les États-Unis, ne pourraient pas le supporter."},"EO3-5.12":{"en":"Housing prices would go through the roof.","l1":"The price of housing would explode.","fr":"Le prix des logements exploserait."},"EO3-5.13":{"en":"The roads would be packed.","l1":"The roads would be saturated.","fr":"Les routes seraient saturées."},"EO3-5.14":{"en":"There would be many people on the roads who are probably homeless.","l1":"There would be many people in the streets who would probably be without shelter.","fr":"Il y aurait beaucoup de gens dans les rues qui seraient probablement sans-abri."},"EO3-5.15":{"en":"There would not be enough food to go around.","l1":"There would not be enough food for everybody.","fr":"Il n'y aurait pas assez de nourriture pour tout le monde."},"EO3-5.16":{"en":"Eventually, these developed regions would also become less developed over time because they would no longer have the infrastructure to sustain their population, and they would also starting having serious economic and political issues.","l1":"At term, these developed regions would become, they too, less developed with time, because they would no longer have the infrastructures to provide for the needs of their population, and they would start also to have serious economic and political problems.","fr":"À terme, ces régions développées deviendraient elles aussi moins développées avec le temps, parce qu'elles n'auraient plus les infrastructures pour subvenir aux besoins de leur population, et elles commenceraient aussi à avoir de sérieux problèmes économiques et politiques."},"EO3-5.17":{"en":"But if we look at the regions which were once the less-developed countries that people migrated away from, most of them would not have enough population and they would probably collapse.","l1":"But if one looks at the regions that were formerly the less developed countries that people would have left, most of them would not have enough inhabitants and would collapse probably.","fr":"Mais si on regarde les régions qui étaient autrefois les pays moins développés que les gens auraient quittés, la plupart d'entre elles n'auraient pas assez d'habitants et s'effondreraient probablement."},"EO3-5.18":{"en":"So basically you just have chaos and harsh living conditions everywhere, all around the world.","l1":"So, roughly, one finds oneself just with the chaos and hard conditions of life everywhere, in the entire world.","fr":"Donc, en gros, on se retrouve juste avec le chaos et des conditions de vie dures partout, dans le monde entier."},"EO3-5.19":{"en":"I'm trying to think of a scenario where this would be possible, but I'm struggling.","l1":"I try to imagine a scenario where it would be possible, but I have trouble.","fr":"J'essaie d'imaginer un scénario où ce serait possible, mais j'ai du mal."},"EO3-5.20":{"en":"I want to believe it's possible, but believing that it's possible would mean having to believe that humans care more about the collective good than their own needs, or that we care more about our long-term good than our short-term desires.","l1":"I have the desire to believe that it's possible, but to believe that it's possible, that would want to say to have to believe that human beings care more about the collective good than about their own needs, or that one cares more about our good in the long term than about our desires in the short term.","fr":"J'ai envie de croire que c'est possible, mais croire que c'est possible, ça voudrait dire devoir croire que les êtres humains se soucient plus du bien collectif que de leurs propres besoins, ou qu'on se soucie plus de notre bien à long terme que de nos envies à court terme."},"EO3-5.21":{"en":"And I really want to believe that all of this, but if the Martians have a laser beam pointed at Earth and the fate of the world depended on my answer to this question, I would not answer \"yes\".","l1":"And I really have the desire to believe all that, but if the Martiens had a laser ray pointed at the Terre and the fate of the world depended on my answer to this question, I would not answer “yes”.","fr":"Et j'ai vraiment envie de croire tout ça, mais si les Martiens avaient un rayon laser pointé sur la Terre et que le sort du monde dépendait de ma réponse à cette question, je ne répondrais pas « oui »."},"EO3-6.01":{"en":"Do I think space travel is too expensive and useless?","l1":"If I think that space voyages cost too dear and are useless?","fr":"Si je pense que les voyages spatiaux coûtent trop cher et sont inutiles ?"},"EO3-6.02":{"en":"There are different aspects of space travel, and there are different purposes that we’re currently traveling to space for.","l1":"There are different aspects in space travel, and there are different reasons for which we go into space currently.","fr":"Il y a différents aspects dans les voyages spatiaux, et il y a différentes raisons pour lesquelles on va dans l'espace actuellement."},"EO3-6.03":{"en":"I would say some are useless and some are not.","l1":"I would say that certain ones are useless and others not.","fr":"Je dirais que certains sont inutiles et d'autres non."},"EO3-6.04":{"en":"Whether or not it’s worth it...","l1":"As for knowing if it's worth the blow or not…","fr":"Quant à savoir si ça vaut le coup ou pas…"},"EO3-6.05":{"en":"I think we need to look at a lot of data to come to a viable conclusion.","l1":"I think that one must study a lot of data to arrive at a valid conclusion.","fr":"Je pense qu'il faut étudier beaucoup de données pour arriver à une conclusion valable."},"EO3-6.06":{"en":"But anyway.","l1":"But in brief.","fr":"Mais bref."},"EO3-6.07":{"en":"Let’s start with the case where, in my opinion, it is indeed useless.","l1":"Let's start with the case where, in my opinion, it is effectively useless.","fr":"Commençons par le cas où, à mon avis, c'est effectivement inutile."},"EO3-6.08":{"en":"And that would be space tourism.","l1":"And that, it's space tourism.","fr":"Et ça, c'est le tourisme spatial."},"EO3-6.09":{"en":"I think, just recently, Blue Origin took some people up to space, and I think they spent literally billions of dollars to make that happen.","l1":"I think that very recently, Blue Origin took people into space, and I think that they spent literally billions of dollars to get there.","fr":"Je pense que tout récemment, Blue Origin a emmené des gens dans l'espace, et je pense qu'ils ont dépensé littéralement des milliards de dollars pour y arriver."},"EO3-6.10":{"en":"And it was just a few minutes in space I think... and then they came down.","l1":"And it was just a few minutes in space I believe… and then they came back down.","fr":"Et c'était juste quelques minutes dans l'espace je crois… et ensuite ils sont redescendus."},"EO3-6.11":{"en":"So it was billions of dollars for literally not even an hour of fun.","l1":"So it was billions of dollars for not even an hour of having fun, literally.","fr":"Donc c'était des milliards de dollars pour même pas une heure à s'amuser, littéralement."},"EO3-6.12":{"en":"That, I think, is a huge waste of money because it didn’t help the world in any sort of way.","l1"
