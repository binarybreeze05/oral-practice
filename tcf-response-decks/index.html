g-left: 22px; }\n.face li { margin: 1px 0; }\n.face p { margin: 5px 0; }\n.face strong { font-weight: 600; color: #eeeeee; }\n.face em { font-style: italic; color: #d0d0d0; }\n.face hr { border: 0; border-top: 1px solid #2e2e2e; margin: 7px 0; }\n.face .masked-response, .face .response-text, .face .fr { font-family: Georgia, \"Times New Roman\", serif; }\n.face .masked-response { letter-spacing: 0.05em; color: #d6d6d6; }\n.face .english { color: #888; font-style: italic; font-size: 12.5px; }\n.face audio { width: 100%; max-width: 480px; display: block; margin: 6px 0; }\n.face .prompt-audio, .face .response-audio, .face .audio-block { margin: 4px 0; }\n.btnrow { display: flex; gap: 6px; margin-top: 10px; }\n.btn { font: inherit; padding: 3px 9px; background: #292929; color: #d6d6d6; border: 1px solid #3a3a3a; border-radius: 3px; cursor: pointer; font-size: 12px; }\n.btn:hover { background: #333; }\n.btn:active { background: #3a3a3a; }\n.btn:focus { outline: 1px solid #555; outline-offset: 1px; }\n.btn.flip { background: #232323; }\n.empty { text-align: center; color: #888; padding: 36px 0; font-size: 12.5px; }\n.delnote { text-align: center; color: #666; font-size: 10.5px; margin-top: 18px; }\n.delnote a { color: #777; text-decoration: none; border-bottom: 1px dotted #555; cursor: pointer; }\n.delnote a:hover { color: #aaa; }\n\n/* --- study_or sentence cards --- */\n.thead{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:baseline;font-size:11px;margin:1px 0 10px;padding-bottom:6px;border-bottom:1px solid #2e2e2e}\n.thead .clab{font-weight:650;color:#cdd6e0}\n.thead .cfreq{color:#7a8896}\n.thead .cloc{margin-left:auto;color:#777;font-variant-numeric:tabular-nums}\n.thead .side{color:#5b6772;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;font-weight:600}\n.sline .en{font-size:14.5px;line-height:1.6;color:#e4e4e4}\n.sline .frx{font-family:Georgia,\"Times New Roman\",serif;font-size:15px;line-height:1.62;color:#ececec}\n.sline .m{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px 9px;font-size:11px;font-variant-numeric:tabular-nums;align-items:center}\n\n/* Colours mirror the editor page exactly: wrong = red (FIXED),\n   idiomatic = amber (PARISIAN). */\n.k{font-weight:700;border-radius:4px;padding:1px 6px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}\n.k.wrong{background:#3a1416;color:#f87171}\n.k.idiomatic{background:#33240a;color:#fbbf24}\n/* Scope filter.  \"fix\" = cards whose sentence carried a red span (wrong\n   French); \"polish\" = the idiomatic-only cards (Parisian rewrites).  Progress\n   is keyed on the card id and shared across scopes AND across every study\n   deck, so a card drilled anywhere stays drilled everywhere; only the\n   rotation order and the round counter are per-deck-per-scope. */\n.scope{font-size:11px;color:#6b7683;letter-spacing:.02em}\n.scope a{color:#6b7683;text-decoration:none;padding:1px 5px;border-radius:3px;border:1px solid transparent}\n.scope a:hover{color:#c9d1d9;border-color:#3a3a3a}\n.scope a.on{color:#e6e6e6;background:#2c2c2c;border-color:#454545;font-weight:600}\n.scope .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:3px}\n/* \"You said\" — the raw sentence on the back.  Deliberately quieter than the\n   answer above it: smaller, dimmer, italic, and behind a red rule, so a\n   glance can never mistake it for the thing to produce. */\n.saidblock{margin-top:11px;padding:6px 0 0 9px;border-left:2px solid rgba(248,113,113,.35);font-size:12px;line-height:1.55}\n.saidblock .wl{color:#6b7683;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px;display:block;margin-bottom:2px}\n.saidblock .said{margin:0;color:#8b8b8b;font-style:italic}\n\n/* --- ns decks: grouped cards, dynamic timer --- */\n.hdr .home{color:#666;text-decoration:none;margin-right:10px;font-size:11px;border:1px solid #333;border-radius:3px;padding:1px 6px}\n.hdr .home:hover{color:#bbb;border-color:#555}\n.face .grp{list-style:none;margin:6px 0 0;padding:0;counter-reset:it}\n.face .grp li{position:relative;padding:7px 0 7px 26px;border-top:1px solid #262626;counter-increment:it}\n.face .grp li:first-child{border-top:none}\n.face .grp li::before{content:counter(it);position:absolute;left:0;top:8px;width:18px;height:18px;border-radius:9px;background:#2a2a2a;color:#8a8a8a;font-size:10px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}\n.face .grp.fr li::before{background:#2b2620;color:#b9a77e}\n.face .grp .en{font-size:14.5px;line-height:1.6;color:#e4e4e4}\n.face .grp .frx{font-family:Georgia,\"Times New Roman\",serif;font-size:15px;line-height:1.62;color:#ececec}\n.face .grp .tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:10.5px;line-height:1.4}\n.face .grp .tags .st{color:#8fb3b6}.face .grp .tags .st b{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:#b9a77e;margin-right:3px}\n.face .grp .tags .gr{color:#6f7780;font-style:italic}\n.face .grp .rid{display:block;margin-top:2px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#666}\n.face .glabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#7fa6a9;margin:2px 0 2px}\n.face .big{font-size:22px;font-weight:700;color:#f0f0f0;letter-spacing:-.01em;margin-top:6px}\n.face .need{font-style:italic;color:#a9b1bb;font-size:14px;margin-top:4px}\n.face .ask{color:#7a8896;font-size:12.5px;margin-top:12px}\n.face .canon{font-size:17px;font-weight:600;line-height:1.45;color:#f2f2f2;margin-top:4px}\n.face .where{margin-top:12px;font-size:12.5px;color:#a9b1bb}.face .where b{color:#e0e0e0}\n.face .where .wl,.face .wl{display:block;color:#5b6772;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;font-weight:600;margin-bottom:2px}\n.face .grp.subs li{display:flex;justify-content:space-between;gap:12px}\n.face .grp.subs .sub{color:#e4e4e4;font-size:14px}.face .grp.subs .cnt{color:#7a8896;font-size:12px;white-space:nowrap}\n.face .also{color:#6f7780;font-size:11.5px;margin-top:10px;font-style:italic}\n.face .one{margin-top:8px}\n.face .one .en{font-size:17px;line-height:1.6;color:#e4e4e4}\n.face .one .frx{font-family:Georgia,\"Times New Roman\",serif;font-size:18px;line-height:1.6;color:#ececec}\n.face .one .rid{display:block;margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#666}\n.face .one .tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:10.5px;line-height:1.4}\n.face .one .tags .st{color:#8fb3b6}.face .one .tags .st b{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:#b9a77e;margin-right:3px}\n.face .one .tags .gr{color:#6f7780;font-style:italic}\n.face mark{background:#2c4f52;color:#fff;border-radius:3px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}\n.face .one.fr mark{background:#4a3f2a}\n.face .dim{color:#6c6c6c}\n/* --- ns decks: in-place card editing (e) --- */\n.hdr .edt{color:#555;cursor:pointer;user-select:none}.hdr .edt:hover{color:#aaa}\n.face [contenteditable=true]{outline:1px dashed #4a6b6e;outline-offset:4px;border-radius:2px;caret-color:#7fa6a9}\n.face [contenteditable=true]:focus{outline-color:#7fa6a9}\n\n/* ns decks: a card you've answered before tints the whole page, so new vs review is clear before you read anything */\nhtml, body { transition: background-color .25s ease; }\nhtml.seen, html.seen body { background: #14212b; }\nhtml.seen .hdr { border-bottom-color: #2b4352; }\n.seen-pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;\n  color: #9fd0f0; background: #1e3646; border: 1px solid #36607a; border-radius: 999px; padding: 1px 9px; margin-bottom: 7px; }\n\n/* --- TCF prompt decks: deck header, two-line front, element line --- */\n.dh{margin:0 0 12px;padding:7px 10px;border:1px solid #2e2e2e;border-radius:6px;background:#1e1e1e;font-size:12.5px}\n.dh>summary{cursor:pointer;color:#bcbcbc;font-weight:600;font-size:11.5px;line-height:1.7}\n.dh .lv,.face .lv{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:3px;border:1px solid;white-space:nowrap}\n.lv.full{color:#57B5B0}.lv.most{color:#8DBF6A}.lv.half{color:#E3B95E}.lv.below{color:#E07A6A}\n.dh .pr{margin:8px 0 6px}\n.dh .fr{font-family:Georgia,\"Times New Roman\",serif;color:#e4e4e4;font-size:13.5px;line-height:1.5}\n.dh .en{color:#8f8f8f;font-size:12px;line-height:1.5;margin-top:3px}\n.dh .pl,.dh .ol{color:#6b7683;font-size:11px;margin-top:2px}\n.dh .ol b{color:#9db4e3}\n.dh .cov{display:flex;align-items:center;gap:6px 10px;margin:8px 0 4px;flex-wrap:wrap}\n.dh .segs{display:inline-flex;gap:3px}\n.dh .segs i{display:inline-block;width:22px;height:8px;border-radius:2px;background:#57B5B0}\n.dh .segs i.g{background:transparent;border:1px solid #E07A6A;box-sizing:border-box}\n.dh .ct,.dh .wc{color:#a9b1bb;font-size:11.5px}\n.dh .wc{margin:2px 0 4px}\n.dh details.sub{margin-top:6px}\n.dh details.sub>summary{cursor:pointer;color:#a9b1bb;font-size:11.5px}\n.dh ul{margin:4px 0 0;padding-left:18px}\n.dh li{margin:5px 0}\n.dh .gaps li b{color:#e8cfc8;font-weight:600}\n.dh .gaps li span{color:#8f8f8f}\n.dh .lg,.dh .allin{color:#6b7683;font-size:11px;margin-top:5px}\n.dh .stubn{background:#E07A6A;color:#1a1a1a;font-weight:700;padding:3px 8px;border-radius:4px;margin-top:6px}\n.face .one .l2 u{text-decoration:underline;text-decoration-color:#E3955E;text-decoration-thickness:2px;text-underline-offset:3px}\n.face .elm{margin-top:12px;color:#7a8896;font-size:11.5px;line-height:1.5}\n.face .elm b{color:#a9b1bb;font-weight:600}\n\n/* --- TCF response decks: prompt keeps its line breaks, the whole answer under the header, frequency line --- */\n.dh .fr,.dh .en{white-space:pre-line}\n.dh .pl{margin-top:6px;font-size:11.5px}\n.dh .pl .fq{color:#57B5B0}\n.dh .pl a{color:#9db4e3}\n.dh .ans p{margin:6px 0;font-family:Georgia,\"Times New Roman\",serif;color:#d8d8d8;font-size:13.5px;line-height:1.55}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"hdr\">\n  \u003ca class=\"home\" id=\"cd-home\" href=\"#\" title=\"Back to all decks\">decks\u003c/a>\u003cspan class=\"t\">__TITLE__\u003c/span>\u003cspan class=\"rd\" id=\"round-label\">\u003c/span>\n  \u003cspan class=\"scope\" id=\"scope\">\n    \u003ca href=\"#\" data-scope=\"nw\" title=\"Only the sentences that are not already cards in your TCF prompt decks\">new\u003c/a>\n    \u003ca href=\"#\" data-scope=\"all\" title=\"Every sentence of the answer, in order\">all\u003c/a>\n  \u003c/span>\n  \u003cspan class=\"right\">\n    \u003cspan class=\"s\" id=\"status\">&mdash;\u003c/span>\n    \u003cspan class=\"tm\" id=\"timer\">\u003c/span>\n    \u003cspan class=\"udo off\" id=\"undo\" title=\"Undo last answer (u)\">undo\u003c/span>\n    \u003cspan class=\"edt\" id=\"edit\" title=\"Edit this card's front and back (e, Esc when done)\">edit\u003c/span>\n    \u003cspan class=\"del\" id=\"delcard\" title=\"Delete this card from this deck (d)\">delete\u003c/span>\n    \u003cspan class=\"rst\" id=\"reset\" title=\"Reset progress and reshuffle this deck\">reset\u003c/span>\n    \u003cspan class=\"rso\" id=\"reset-ordered\" title=\"Reset progress and restore the original card order\">reset in order\u003c/span>\n  \u003c/span>\n\u003c/div>\n__DECK_INFO__\n\u003cdiv id=\"app\">\u003c/div>\n\u003cdiv id=\"delnote\" class=\"delnote hidden\">\u003c/div>\n\u003cdiv id=\"blackout\" class=\"hidden\">\u003c/div>\n\u003cscript type=\"application/json\" id=\"deck-meta\">__DECK_META__\u003c/script>\n\u003cscript type=\"application/json\" id=\"deck-data\">__DECK_DATA__\u003c/script>\n\u003cscript>\n(function () {\n  \"use strict\";\n  // Progress is GLOBAL across every study deck: the same card appears in its\n  // prompt deck, its day deck, its section deck and the master deck, and\n  // answering it in any of them must count in all of them.  Card ids are\n  // unique across the whole corpus, so one shared { cardId: entry } map under\n  // STORAGE_KEY is the whole mechanism.  What is per-deck is the VIEW: which\n  // scope you're in, the shuffle, and the round counter, namespaced by\n  // VIEW_NS so decks don't stomp each other over the shared file:// origin.\n  var STORAGE_KEY = \"__STORAGE_KEY__\";\n  var VIEW_NS = \"__VIEW_NS__\";\n  var DELETED_KEY = \"study::tcf::promptdecks::deleted\";\n\n  // ---- Scope ---------------------------------------------------------------\n  // Cards come in two kinds and they are not equally urgent: `wrong` (red) are\n  // the actual errors that pull the language criteria down; `idiomatic`\n  // (amber) are the Parisian rewrites. Drilling both together buries the\n  // errors, so the deck opens on FIX -- every card carrying a red span -- and\n  // the amber-only cards are a separate rotation.\n  //\n  // A card's kind is the max of its spans (wrong > idiomatic), so \"carries\n  // any red span\" is exactly `k === \"wrong\"`. A mixed card therefore lands in\n  // FIX, which is right: you cannot drill its red span without saying the\n  // whole sentence.\n  //\n  // Progress lives under STORAGE_KEY and is keyed on the CARD ID, so it is\n  // deliberately SHARED across scopes -- a card you finish under \"fix\" is\n  // still finished when you switch to \"all\". Only the shuffle and the round\n  // counter are per-scope.\n  var SCOPE_KEY = VIEW_NS + \"::scope\";\n  var SCOPES = { nw: 1, all: 1 };\n\n  function loadScope() {\n    try {\n      var v = localStorage.getItem(SCOPE_KEY);\n      if (v && SCOPES[v]) return v;\n    } catch (e) {}\n    return \"all\";\n  }\n\n  var scope = loadScope();\n  var ROUND_KEY = VIEW_NS + \"::round::\" + scope;\n  var ORDER_KEY = VIEW_NS + \"::order::\" + scope;\n  var REPEAT_MS = 10 * 60 * 1000;\n  var SOON_MS = 3 * 60 * 1000;\n  var TIMER_MS = 60 * 1000;\n  // ns decks: a card carries `t` (seconds) = 30 s per item on it.\n  function cardMs(i) { var t = cards[i] && cards[i].t; return (typeof t === 'number' && t > 0) ? t * 1000 : TIMER_MS; }\n\n  // ---- Deleted cards -------------------------------------------------------\n  // The one addition over the drill_or engine: \"d\" (or Delete/Backspace, or\n  // the header control) permanently removes the current card from EVERY study\n  // deck.  The deleted set is a global list of card ids under DELETED_KEY --\n  // the card stays in every deck's authored data, so restoring is just\n  // removing the id from the set.  Deleted cards are invisible to the\n  // rotation: pickCard, the status counts, round revival and the scope\n  // counters all skip them.\n  function loadDeleted() {\n    try {\n      var v = JSON.parse(localStorage.getItem(DELETED_KEY));\n      if (Array.isArray(v)) return v.filter(function (x) { return typeof x === \"string\"; });\n    } catch (e) {}\n    return [];\n  }\n  function saveDeleted() {\n    try { localStorage.setItem(DELETED_KEY, JSON.stringify(deletedList())); } catch (e) {}\n  }\n  var deleted = {};\n  loadDeleted().forEach(function (id) { deleted[id] = 1; });\n  function deletedList() {\n    var out = [];\n    for (var id in deleted) {\n      if (Object.prototype.hasOwnProperty.call(deleted, id)) out.push(id);\n    }\n    return out;\n  }\n  function isDeleted(i) { return !!deleted[cards[i].id]; }\n\n  // ORIGINAL_CARDS holds the deck in its authored order and is never mutated.\n  // `cards` is a working copy whose order can be reshuffled on reset; `order`\n  // is the persisted permutation (indices into ORIGINAL_CARDS) mapping the\n  // authored order onto the current one.  The whole engine relies on the\n  // invariant that state[i] corresponds to cards[i] positionally, so a\n  // reshuffle just rebuilds `cards` from `order` and starts from fresh state.\n  // Deleted cards are kept IN the arrays (so the persisted permutation stays\n  // valid) and skipped everywhere by isDeleted().\n  var ALL_CARDS = JSON.parse(document.getElementById(\"deck-data\").textContent);\n\n  // ns decks: user edits override the built front/back, keyed on card id.\n  var EDITS_KEY = \"study::tcf::promptdecks::edits\";\n  fu  ---- Progress persistence -----------------------------------------------\n  // Progress is stored as a { cardId: entry } MAP, not as a positional array.\n  // The store is shared by every study deck (per-prompt, per-day, section,\n  // master), which is exactly why it is keyed on the content-derived card id:\n  // any deck can read and merge-write its own cards' entries without touching\n  // the rest.  Re-running Phase 4 on a response mints new cards under the\n  // same ids only when the French is unchanged; changed cards arrive \"new\".\n\n  function entryFor(saved) {\n    var p = { p: \"new\", d: 0, c: 0, la: null, forced: false };\n    if (!saved || typeof saved !== \"object\") return p;\n    if (saved.p === \"new\" || saved.p === \"review\" || saved.p === \"done\") p.p = saved.p;\n    if (typeof saved.d === \"number\" && isFinite(saved.d)) p.d = saved.d;\n    if (typeof saved.c === \"number\" && isFinite(saved.c) && saved.c >= 0) p.c = saved.c;\n    if (saved.la === \"soon\" || saved.la === \"again\") p.la = saved.la;\n    if (typeof saved.forced === \"boolean\") p.forced = saved.forced;\n    return p;\n  }\n\n  function loadState() {\n    var saved = null;\n    try {\n      var raw = localStorage.getItem(STORAGE_KEY);\n      if (raw) {\n        var parsed = JSON.parse(raw);\n        if (parsed && typeof parsed === \"object\" && !Array.isArray(parsed)) {\n          saved = parsed;\n        }\n      }\n    } catch (e) {}\n    return cards.map(function (c) {\n      return entryFor(saved ? saved[c.id] : null);\n    });\n  }\n\n  function freshState() {\n    // p      = \"new\" | \"review\" | \"done\"\n    // d      = epoch ms when due\n    // c      = times this card has been answered (drives the \"new\" indicator)\n    // la     = last action kind (\"soon\" or \"again\") -- drives the tier-aware\n    //          mapping for the \"No trouble\" button.  null = no prior action.\n    // forced = true only when retired via the \"4\" key.  Cards with\n    // .preventDefault();\n      btns[1].click();\n    }\n  });\n\n  setInterval(function () {\n    if (current \u003c 0) render();\n  }, 30000);\n\n  // Both resets clear progress and the round counter; they differ only in the\n  // order the deck comes back in.  \"reset\" reshuffles (the sc11 behaviour);\n  // \"reset in order\" restores the authored order -- which for a study_or deck\n  // is the order you actually spoke (per-prompt decks) or the\n  // similarity-clustered order (combined decks).\n  // Reset is a DECK-level control: it clears progress for THIS deck's cards\n  // only, inside the shared store -- other decks' cards keep their progress.\n  function resetDeck(newOrder) {\n    clearTimer();\n    order = newOrder;\n    cards = applyOrder(ORIGINAL_CARDS, order);\n    saveOrder();\n    state = freshState();\n    // Remove only this deck's entries from the shared store, then write the\n    // fresh ones back.  removeItem() would nuke every other deck too.\n    try {\n      var prev = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      if (prev && typeof prev === \"object\" && !Array.isArray(prev)) {\n        for (var i = 0; i \u003c ORIGINAL_CARDS.length; i++) delete prev[ORIGINAL_CARDS[i].id];\n        localStorage.setItem(STORAGE_KEY, JSON.stringify(prev));\n      }\n    } catch (e) {}\n    saveState();\n    round = 1;\n    saveRound();\n    lastSnapshot = null;\n    render();\n  }\n\n  document.getElementById(\"reset\").addEventListener(\"click\", function () {\n    if (window.confirm(\"Reset progress for the cards in this view (new, or the whole deck under all) and reshuffle them?\")) {\n      resetDeck(shuffledOrder(ORIGINAL_CARDS.length));\n    }\n  });\n\n  document.getElementById(\"reset-ordered\").addEventListener(\"click\", function () {\n    if (window.confirm(\"Reset progress for the cards in this view (new, or the whole deck under all) and put them back in the order you'd say or write them?\")) {\n      // null == authored order.  saveOrder() removes the persisted\n      // permutation, so a later reload comes back in order too.\n      resetDeck(null);\n    }\n  });\n\n\n  // ---- ns decks: in-place editing -------------------------------------------\n  function editables() { return document.querySelectorAll(\".face .fs, .face .bs\"); }\n  function isEditing() { return !!document.querySelector('.face [contenteditable=\"true\"]'); }\n  function saveEdit() {\n    if (current \u003c 0) return;\n    var c = cards[current], fs = document.querySelector(\".face .fs\"), bs = document.querySelector(\".face .bs\");\n    if (fs) c.f = fs.innerHTML;\n    if (bs) c.b = bs.innerHTML;\n    try {\n      var ed = loadEdits();\n      if (c.f === c.f0 && c.b === c.b0) delete ed[c.id]; else ed[c.id] = { f: c.f, b: c.b };\n      localStorage.setItem(EDITS_KEY, JSON.stringify(ed));\n    } catch (e) {}\n  }\n  function startEdit() {\n    if (current \u003c 0 || isEditing()) return;\n    var wasFlipped = flipped;\n    if (!flipped) { var f = document.querySelector(\".btn.flip\"); if (f) f.click(); }\n    clearTimer();\n    editables().forEach(function (el) {\n      el.contentEditable = \"true\";\n      el.addEventListener(\"input\", saveEdit);\n      el.addEventListener(\"paste\", function (e) {\n        e.preventDefault();\n        document.execCommand(\"insertText\", false, (e.clipboardData || window.clipboardData).getData(\"text/plain\"));\n      });\n    });\n    var tgt = document.querySelector(wasFlipped ? \".face .bs\" : \".face .fs\");\n    if (tgt) tgt.focus();\n  }\n  function stopEdit() {\n    if (!isEditing()) return;\n    saveEdit();\n    editables().forEach(function (el) { el.contentEditable = \"false\"; });\n    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();\n    var b = document.querySelector(\".btn\"); if (b) b.focus();\n    if (flipped) startTimer(cardMs(current), onBackExpire);\n  }\n  document.getElementById(\"edit\").addEventListener(\"click\", function () { if (isEditing()) stopEdit(); else startEdit(); });\n\n  document.getElementById(\"undo\").addEventListener(\"click\", undo);\n  document.getElementById(\"delcard\").addEventListener(\"click\", deleteCurrent);\n\n  // ---- Scope control -------------------------------------------------------\n  // Switching scope changes which cards are in rotation, which changes the\n  // length ORDER_KEY is validated against -- so each scope keeps its own\n  // shuffle and its own round counter, and the switch is a reload rather than\n  // an in-place rebuild.  Progress is untouched: it is keyed on the card id\n  // under STORAGE_KEY, which no scope suffix touches.\n  (function wireScope() {\n    var box = document.getElementById(\"scope\");\n    if (!box) return;\n    if (!HAS_KIND) { box.style.display = \"none\"; return; }\n\n    var counts = { nw: 0, all: 0 };\n    for (var i = 0; i \u003c ALL_CARDS.length; i++) {\n      if (deleted[ALL_CARDS[i].id]) continue;\n      counts.all++;\n      if (ALL_CARDS[i].nw) counts.nw++;\n    }\n\n    var links = box.querySelectorAll(\"a\");\n    for (var j = 0; j \u003c links.length; j++) {\n      (function (a) {\n        var s = a.getAttribute(\"data-scope\");\n        a.innerHTML = a.textContent + '\u003cspan class=\"n\">' + counts[s] + \"\u003c/span>\";\n        if (s === scope) a.className = \"on\";\n        a.addEventListener(\"click\", function (e) {\n          e.preventDefault();\n          if (s === scope) return;\n          if (!counts[s]) return;            // never strand the user on an empty rotation\n          try { localStorage.setItem(SCOPE_KEY, s); } catch (err) {}\n          location.reload();\n        });\n      })(links[j]);\n    }\n  })();\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
var NS = DATA.ns, PROGRESS_KEY = NS + "::progress", DONE_KEY = NS + "::done";
var BY = {}, LABEL = {};
DECKS.forEach(function (d) { BY[d.key] = d; });
TASKS.forEach(function (t) { LABEL[t.task] = t.label; });
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); };
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(NS + "::" + k); localStorage.setItem(NS + "::" + k, v); } catch (e) { return null; } }
function js(x) { return JSON.stringify(x).replace(/</g, "\\u003c"); }
function nNew(d) { return d.cards.filter(function (r) { return r.nw; }).length; }
function mins(d) { return Math.max(1, Math.round(d.cards.length * SECS / 60)); }
function words(d) { return d.range ? "French " + d.words + " words · TCF " + d.range[0] + "–" + d.range[1] : "French " + d.words + " words · exam " + d.timing; }
function stats(d) { return d.cards.length + " cards · " + nNew(d) + " new · ~" + mins(d) + " min"; }
// tcf-prompts, Sort › Frequency: rank in the task, the box (or single prompt) and its listings
function unit(f) { return f.box !== null ? "Box " + f.box + " (" + f.size + " prompts)" : "Prompt " + f.n; }
function freqLine(d, link) {
  var f = d.freq, u = esc(unit(f));
  if (link) u = '<a href="' + esc(f.url_en) + '" target="_blank" rel="noopener">' + u + "</a>";
  return '<b class="fq">#' + f.rank + " of " + f.of + "</b> by frequency · " + (f.close ? "≈ closest: " : "") + u + " · listed " + f.listed + "×" + (f.tied ? " (tied with " + f.tied + ")" : "");
}
function state() { try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch (e) { return {}; } }
function progress(d, st) {
  var done = 0, seen = 0;
  d.cards.forEach(function (r) { var e = st[r.id]; if (!e || (e.p === "new" && !e.c)) return; seen++; if (e.p === "done") done++; });
  return {done: done, seen: seen, text: seen ? done + " done · " + (seen - done) + " in play" : "not started"};
}
function first(t) { var q = t.split("\n").filter(function (l) { return /^Question\s?:/.test(l); })[0]; return (q || t.replace(/^Document A\s?:\s*/, "")).replace(/\s+/g, " "); }
function cardsOf(d) {
  var n = d.cards.length, head = esc(LABEL[d.task]) + " · " + esc(d.key);
  return d.cards.map(function (r, i) {
    var c = CARDS[r.sid];
    var f = '<div class="thead"><span class="clab">' + head + '</span><span class="cfreq">card ' + (i + 1) + " of " + n + '</span><span class="side">English</span><span class="cloc" title="Paragraph of your answer">¶' + (r.p + 1) + "</span></div>" +
      '<div class="one"><span class="en l1">' + esc(c.l1) + '</span><br><br><span class="en l2">' + esc(c.en) + "</span></div>";
    var b = '<div class="thead"><span class="clab">' + head + '</span><span class="side">Français</span></div>' +
      '<div class="one fr"><span class="frx">' + esc(c.fr) + "</span></div>" +
      '<div class="elm">paragraph ' + (r.p + 1) + " of " + d.paras + (r.nw ? "" : " · <b>also in your prompt decks</b>") + "</div>";
    return {id: r.id, f: f, b: b, t: SECS, nw: r.nw};
  });
}
function info(d) {
  var h = '<details class="dh" id="dh" open><summary>' + esc(LABEL[d.task]) + " · " + esc(d.key) + " · " + esc(d.who) + " · " + stats(d) + "</summary>";
  h += '<div class="pr"><div class="fr">' + esc(d.fr) + '</div><div class="en">' + esc(d.en) + '</div><div class="pl">' + freqLine(d, true) + "</div></div>";
  h += '<div class="wc">' + esc(words(d)) + "</div>";
  h += '<details class="sub ans"><summary>The whole answer in French · ' + d.paras + " paragraph" + (d.paras === 1 ? "" : "s") + "</summary>" +
    d.answer.map(function (p) { return "<p>" + p.map(function (l) { return l.map(function (s) { return esc(CARDS[s].fr); }).join(" "); }).join("<br>") + "</p>"; }).join("") + "</details>";
  return h + "</details>";
}
function open(d) {
  var cards = cardsOf(d), title = LABEL[d.task] + " · " + d.key;
  var meta = {deck_id: "tcfr-" + d.key, title: title, subtitle: first(d.en), counts: {total: cards.length}};
  var subs = {"__TITLE__": esc(title), "__STORAGE_KEY__": PROGRESS_KEY, "__VIEW_NS__": NS + "::view::" + d.key,
              "__DECK_META__": js(meta), "__DECK_DATA__": js(cards), "__DECK_INFO__": info(d)};
  var page = TPL.replace(/__TITLE__|__STORAGE_KEY__|__VIEW_NS__|__DECK_META__|__DECK_DATA__|__DECK_INFO__/g, function (k) { return subs[k]; });
  page = page.replace("</body>", '<script>(function(){function home(){history.replaceState(null,"",location.pathname+location.search);location.reload();}' +
    'var h=document.getElementById("cd-home");if(h)h.addEventListener("click",function(e){e.preventDefault();home();});' +
    "var K=" + js(NS + "::info-open") + ',dh=document.getElementById("dh");if(dh){try{if(localStorage.getItem(K)==="0")dh.open=false;}catch(e){}' +
    'dh.addEventListener("toggle",function(){try{localStorage.setItem(K,dh.open?"1":"0");}catch(e){}});}' +
    'addEventListener("hashchange",function(){location.reload();});})();<\/script></body>');
  document.open(); document.write(page); document.close();
}
function hash() { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; } }
var want = hash();
if (BY[want]) { document.querySelector("main").hidden = true; addEventListener("DOMContentLoaded", function () { setTimeout(function () { open(BY[want]); }, 0); }); return; }
// the index: one row per response deck, per task
function list() {
  var task = ls("task"); if (!LABEL[task]) task = TASKS[0].task;
  var done = {}; try { done = JSON.parse(localStorage.getItem(DONE_KEY)) || {}; } catch (e) {}
  var byFreq = ls("order") === "freq";
  var st = state(), ds = DECKS.filter(function (d) { return d.task === task; });
  if (byFreq) ds = ds.slice().sort(function (a, b) { return (a.freq.rank - b.freq.rank) || (a.pos - b.pos); });
  var tot = 0, dn = 0, ticked = 0;
  ds.forEach(function (d) { tot += d.cards.length; dn += progress(d, st).done; if (done[d.key]) ticked++; });
  var h = "<h1>TCF response decks</h1><p class=\"sub\">One deck per response: your own full answers, one card per sentence, in the order you said or wrote them.</p>" +
    '<p class="how">Front: the literal English of the French, then your English. Back: the French. <b>new</b> = sentences that are not already cards in your TCF prompt decks.</p>' +
    '<div class="bar">' + TASKS.map(function (t) { var n = DECKS.filter(function (d) { return d.task === t.task; }).length;
      return '<button type="button" data-t="' + t.task + '"' + (t.task === task ? ' class="on"' : "") + ">" + esc(t.label) + '<span class="n">' + n + "</span></button>"; }).join("") + "</div>" +
    '<div class="bar"><span class="lab">Order</span><button type="button" data-o="mine"' + (byFreq ? "" : ' class="on"') + ' title="The order of your files">Yours</button>' +
    '<button type="button" data-o="freq"' + (byFreq ? ' class="on"' : "") + ' title="Most listed first: tcf-prompts, Sort › Frequency">Frequency</button></div>' +
    '<div class="prog"><div class="t"><span><b>' + dn + "</b> of " + tot + " cards done</span><span>" + ticked + " of " + ds.length + " decks ticked</span></div>" +
    '<div class="track"><div class="fill" style="width:' + (tot ? Math.round(100 * dn / tot) : 0) + '%"></div></div><div class="s">' + esc(LABEL[task]) + " · " + ds.length + " decks</div></div>";
  h += ds.map(function (d) {
    var p = progress(d, st);
    return '<div class="row' + (done[d.key] ? " done" : "") + '"><label class="ck" title="Mark this deck done"><input type="checkbox" data-k="' + esc(d.key) + '"' + (done[d.key] ? " checked" : "") + "></label>" +
      '<a class="deck" href="#' + esc(d.key) + '"><span class="rk">' + esc(d.key) + '</span><span class="nm">' + esc(first(d.en)) + '</span><span class="pg">' + esc(p.text) + "</span>" +
      '<span class="meta">' + freqLine(d, false) + "</span>" +
      '<span class="meta">' + stats(d) + " · " + esc(words(d)) + ' · <span class="who">' + esc(d.who) + "</span></span></a></div>";
  }).join("");
  h += '<p class="side">Side-by-side view of every answer (English | French): <a href="../tcf-responses/">TCF responses</a></p>';
  document.getElementById("boot").innerHTML = h;
}
// one set of handlers on the list's container; list() only redraws it
function boot() {
  var m = document.getElementById("boot");
  m.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-t]"), o = e.target.closest("button[data-o]");
    if (b) { ls("task", b.getAttribute("data-t")); list(); }
    if (o) { ls("order", o.getAttribute("data-o")); list(); }
  });
  m.addEventListener("change", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-k"); if (!k) return;
    var done = {}; try { done = JSON.parse(localStorage.getItem(DONE_KEY)) || {}; } catch (x) {}
    if (e.target.checked) done[k] = 1; else delete done[k];
    try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (x) {}
    list();
  });
  list();
}
addEventListener("hashchange", function () { location.reload(); });
addEventListener("DOMContentLoaded", boot);
})();
</script>
