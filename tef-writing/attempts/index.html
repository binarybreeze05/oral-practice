<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src http://127.0.0.1:8783; base-uri 'none'; form-action 'none';">
<title>Tentatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: two full-height panels (English | Français) split at 50%; each paragraph is one grid row so the panels
   line up sentence block by sentence block. Below 760px the panels stack per paragraph. */
:root {
  --panel-en: #fbfbfc; --panel-fr: #eff3fb; --bar: #ffffff; --ink: #1b1f2a; --ink-soft: #5b6273; --rule: #d9dee8;
  --accent: #2b4aa0; --accent-soft: #e2e8f8; --mark: #ffe9a3; --hit: #ffd66b; --warn: #a3520c;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* text fills each panel; the body size grows with the window so wide screens do not get very long lines */
  --step--1: 0.8125rem; --step-0: clamp(1.0625rem, 0.55rem + 0.6vw, 1.3125rem); --step-1: 1.25rem;
  --pad: clamp(1rem, 2.4vw, 3rem);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --panel-en: #14161b; --panel-fr: #161c2a; --bar: #0f1115; --ink: #e6e8ee; --ink-soft: #9aa1b2; --rule: #2a3040;
  --accent: #93a9ff; --accent-soft: #24305a; --mark: rgba(255, 214, 90, .22); --hit: rgba(255, 196, 60, .45); --warn: #f0a458;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --panel-en: #14161b; --panel-fr: #161c2a; --bar: #0f1115; --ink: #e6e8ee; --ink-soft: #9aa1b2; --rule: #2a3040;
  --accent: #93a9ff; --accent-soft: #24305a; --mark: rgba(255, 214, 90, .22); --hit: rgba(255, 196, 60, .45); --warn: #f0a458;
  color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; color: var(--ink); font: 400 var(--step-0)/1.62 var(--f-text);
  background: linear-gradient(90deg, var(--panel-en) calc(50% - .5px), var(--rule) calc(50% - .5px), var(--rule) calc(50% + .5px), var(--panel-fr) calc(50% + .5px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); border-bottom: 1px solid var(--rule);
  font-family: var(--f-ui); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.25rem; padding-block: .7rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: .6rem; margin-right: auto }
.brand h1 { margin: 0; font: 650 1.0625rem/1.2 var(--f-ui); letter-spacing: -.01em }
.brand .count { font-size: var(--step--1); color: var(--ink-soft); font-variant-numeric: tabular-nums }
.chips, .seg { display: flex; flex-wrap: wrap; gap: .3rem }
.chip, .seg button { font: 500 var(--step--1)/1 var(--f-ui); color: var(--ink); background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: .45rem .7rem; cursor: pointer; font-variant-numeric: tabular-nums }
.chip .n { color: var(--ink-soft); margin-left: .3rem }
.chip[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bar) }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75 }
.seg { gap: 0 } .seg button { border-radius: 0; margin-left: -1px }
.seg button:first-child { border-radius: 999px 0 0 999px; margin-left: 0 } .seg button:last-child { border-radius: 0 999px 999px 0 }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; font-size: var(--step--1) }
.tools .lbl { color: var(--ink-soft) }
.opt { display: inline-flex; align-items: center; gap: .5rem }
input[type="search"], select { font: 400 var(--step--1)/1.2 var(--f-ui); color: var(--ink); background: var(--panel-en);
  border: 1px solid var(--rule); border-radius: 6px; padding: .45rem .6rem; min-width: 0 }
input[type="search"] { width: 13rem; max-width: 100% }
select { max-width: 15rem }
.check { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.cols { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule) }
.cols div { font: 600 .6875rem/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); padding-block: .5rem }
.cols div:first-child { background: var(--panel-en); padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); padding-right: var(--pad) }
.cols div:last-child { background: var(--panel-fr); padding-left: var(--pad); padding-right: max(var(--pad), env(safe-area-inset-right, 0px)) }
main { padding-bottom: 4rem }
.resp { padding-top: 2.25rem; border-bottom: 1px solid var(--rule); padding-bottom: 1.5rem; scroll-margin-top: 7.5rem }
.row { display: grid; grid-template-columns: 1fr 1fr }
.cell { min-width: 0; padding-left: var(--pad); padding-right: var(--pad) }
.cell.en { padding-left: max(var(--pad), env(safe-area-inset-left, 0px)) }
.cell.fr { padding-right: max(var(--pad), env(safe-area-inset-right, 0px)) }
h2 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; font: 600 var(--step-1)/1.25 var(--f-ui);
  letter-spacing: -.01em; text-wrap: balance }
.rid { font: 500 var(--step--1)/1 var(--f-mono); color: var(--accent); background: var(--accent-soft); padding: .3rem .45rem; border-radius: 4px; align-self: center }
.who { font: 500 var(--step--1)/1.2 var(--f-ui); color: var(--ink-soft) }
.meta { font: 400 var(--step--1)/1.4 var(--f-ui); color: var(--ink-soft); margin-top: .35rem; font-variant-numeric: tabular-nums }
.meta .off { color: var(--warn); font-weight: 600 }
.prow .cell { padding-top: .9rem; padding-bottom: .4rem }
.prompt { font: 400 .9375rem/1.5 var(--f-ui); color: var(--ink-soft); border-left: 2px solid var(--accent); padding: .1rem 0 .1rem .8rem }
.prompt p { margin: .2rem 0 .5rem } .prompt p:last-child { margin-bottom: 0 }
.prompt b { color: var(--ink); font-weight: 600 }
.phead { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .7rem; margin-bottom: .4rem }
.plabel { font: 600 .6875rem/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }
.freq { font: 400 var(--step--1)/1.4 var(--f-ui); color: var(--ink-soft); font-variant-numeric: tabular-nums }
.freq .rk { font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: .12rem .4rem; border-radius: 4px; margin-right: .15rem }
.freq a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px }
.freq a:hover { text-decoration-color: var(--accent) }
details.prompt summary { cursor: pointer; list-style: none } details.prompt summary::-webkit-details-marker { display: none }
details.prompt .more { display: inline-block; font-size: var(--step--1); color: var(--accent); text-decoration: underline; text-underline-offset: 3px }
details.prompt[open] .more { display: none }
.para .cell { padding-top: .55rem }
.para p { margin: 0 0 .15rem }
.s { border-radius: 3px; transition: background-color .12s }
.s.hl { background: var(--mark) }
.s.hit { background: var(--hit) }
.s.pending { color: var(--ink-soft) }
body.no-prompts .prow { display: none }
/* English panel: the literal English of the French, or the user's own words (body[data-en="mine"]) */
body:not([data-en="mine"]) .mine, body[data-en="mine"] .lit { display: none }
body[data-cover="en"] .cell.en .s:not(.shown), body[data-cover="fr"] .cell.fr .s:not(.shown) { filter: blur(5px); cursor: pointer }
.empty { font: 400 var(--step-0)/1.5 var(--f-ui); color: var(--ink-soft); padding: 3rem max(var(--pad), env(safe-area-inset-left, 0px)) }
.foot { font: 400 var(--step--1)/1.55 var(--f-ui); color: var(--ink-soft); padding: 1.5rem max(var(--pad), env(safe-area-inset-left, 0px)) 0; max-width: 90ch }
@media (max-width: 760px) {
  :root { --pad: 16px }
  body { background: var(--panel-en) }
  .cols { display: none }
  .row { grid-template-columns: 1fr }
  .cell.en { padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .cell.fr { background: var(--panel-fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-bottom: .55rem }
  .head .cell.fr { padding-top: .6rem; margin-top: .6rem }
  .bar { position: static }
  .resp { scroll-margin-top: 1rem }
  input[type="search"] { width: 100% }
  .tools { width: 100% }
}
@media (prefers-reduced-motion: reduce) { .s { transition: none } }

/* --- Cover (2026-11-14): the English, the French or both (data-cover "en", "fr", "en fr"); a covered sentence uncovers
   while you hover it (a click plays the audio from there) --- */
body[data-cover~="en"] main .cell.en .s, body[data-cover~="fr"] main .cell.fr .s { filter: blur(5px); transition: filter .12s ease-out; padding-block: .12em }   /* (no gap between its lines, so it stays uncovered across them) */
body[data-cover~="en"] main .cell.en .s:hover, body[data-cover~="fr"] main .cell.fr .s:hover { filter: none }
body:not([data-cover="none"]) main .resp:not(:has(.aud)) .cell .s { cursor: default }
/* --- TEF responses: three English versions, deck actions in each header, family line --- */
body:not([data-en="mine"]) .mine, body[data-en="mine"] .lit { display: none }
body .nat { display: none }
body[data-en="nat"] .nat { display: block } body[data-en="nat"] .lit { display: none }
.meta .nat { display: none } body[data-en="nat"] .meta .nat { display: inline } body[data-en="nat"] .meta .lit { display: none }
.meta .mine, .meta .lit { display: inline } body:not([data-en="mine"]) .meta .mine, body[data-en="mine"] .meta .lit { display: none }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; margin-top: .55rem; font: 400 var(--step--1)/1.3 var(--f-ui) }
.acts .open { font: 600 var(--step--1)/1 var(--f-ui); color: var(--bar); background: var(--accent); border-radius: 999px; padding: .5rem .85rem; text-decoration: none }
.acts .open:hover { filter: brightness(1.1) }
.acts .dstat { color: var(--ink-soft); font-variant-numeric: tabular-nums }
.acts .dp.go { color: var(--accent); font-weight: 600 }
.tick { display: inline-flex; align-items: center; gap: .3rem; color: var(--ink-soft); cursor: pointer }
.resp.ticked h2 { opacity: .55 }
.famline { font: 500 var(--step--1)/1.3 var(--f-ui); color: var(--ink-soft); margin: -.15rem 0 .45rem }
details.adx summary { cursor: pointer; list-style: none } details.adx summary::-webkit-details-marker { display: none }
details.adx .more { font-size: var(--step--1); color: var(--accent); text-decoration: underline; text-underline-offset: 3px }
details.adx[open] .more { display: none }
.brand .done { font-size: var(--step--1); color: var(--ink-soft); font-variant-numeric: tabular-nums }
/* --- Lean view (body.lean): one compact row per answer under its family heading; a click opens the full answer --- */
.lrow, .famh, .sech, .unans { display: none }
body:not(.lean) .lonly { display: none }
body.lean { background: var(--panel-en) }
body.lean .cols { display: none }
body.lean .unans { display: block }
body.lean :is(.resp, .unans) { padding: 0; border-bottom: 0; scroll-margin-top: var(--barh, 7.5rem) }
body.lean :is(.resp, .unans):not(.open) .rbody { display: none }
body.lean .rbody { padding: 0 0 1.4rem; border-bottom: 1px solid var(--rule);
  background: linear-gradient(90deg, var(--panel-en) calc(50% - .5px), var(--rule) calc(50% - .5px), var(--rule) calc(50% + .5px), var(--panel-fr) calc(50% + .5px)) }
body.lean .rbody .head h2, body.lean .rbody .head .acts { display: none }
body.lean .rbody .head .cell { padding-top: .5rem }
body.lean .famh, body.lean.flat .sech { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .7rem; margin: 0; border-bottom: 1px solid var(--rule);
  padding: 1.75rem max(var(--pad), env(safe-area-inset-right, 0px)) .55rem max(var(--pad), env(safe-area-inset-left, 0px)); font: 650 var(--step-1)/1.25 var(--f-ui) }
/* each Lean row names its original family under the ad name (not when the family is a group on its own); in Order =
   Frequency (body.flat: one ranked list per section, no group headings) it names the group first */
body.lean.flat .famh { display: none }
.sech .fcount { font: 500 var(--step--1)/1 var(--f-ui); color: var(--ink-soft); font-variant-numeric: tabular-nums }
.lx .lname { min-width: 0; display: flex; flex-direction: column }
.lx .lsub { font: 500 var(--step--1)/1.3 var(--f-ui); color: var(--ink-soft); margin-top: .1rem; overflow-wrap: anywhere }
.lx .lgrp, .lx .lfam.one { display: none }
body.lean.flat .lx .lgrp { display: inline }
body.lean.flat .lx .lfam:not(.one)::before { content: " · " }
.famh .fmem { flex-basis: 100%; font: 400 var(--step--1)/1.35 var(--f-ui); color: var(--ink-soft) }
.famh .fsec { flex-basis: 100%; font: 600 .6875rem/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft) }
.famh .fname { min-width: 0; overflow-wrap: anywhere }
.famh .fcount { font: 500 var(--step--1)/1 var(--f-ui); color: var(--ink-soft); font-variant-numeric: tabular-nums }
body.lean .lrow { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.1rem; background: var(--bar); border-bottom: 1px solid var(--rule); cursor: pointer;
  padding: .55rem max(var(--pad), env(safe-area-inset-right, 0px)) .55rem max(var(--pad), env(safe-area-inset-left, 0px)); font: 400 var(--step--1)/1.3 var(--f-ui) }
.open > .lrow { box-shadow: inset 3px 0 0 var(--accent) }
.lx { flex: 1 1 18rem; min-width: 0; display: flex; align-items: center; gap: .6rem; margin: 0; padding: .2rem 0; border: 0; background: none;
  color: var(--ink); text-align: left; cursor: pointer; font: 600 1rem/1.3 var(--f-ui) }
.lx .rid { flex: none; white-space: nowrap }
.lx .lad { min-width: 0; overflow-wrap: anywhere }
.lrow:hover .lad { color: var(--accent) }
.chev { flex: none; width: .45rem; height: .45rem; margin: 0 .15rem 0 .05rem; border-right: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft);
  transform: rotate(-45deg); transition: transform .15s }
.open > .lrow .chev { transform: rotate(45deg) }
.lmeta { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums }
.lmeta .rk { font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: .12rem .4rem; border-radius: 4px }
.lmeta .dp.go { color: var(--accent); font-weight: 600 }
.lacts { display: flex; align-items: center; gap: .9rem }
.lacts .open { font: 600 var(--step--1)/1 var(--f-ui); color: var(--bar); background: var(--accent); border-radius: 999px; padding: .45rem .8rem; text-decoration: none }
.lacts .open:hover { filter: brightness(1.1) }
.resp.ticked .lx { opacity: .55 }
/* a prompt with no answer yet: lighter row, dashed id; opened, the whole ad reads in a card */
.unans > .lrow { background: transparent }
.unans .lx .rid { color: var(--ink-soft); background: transparent; box-shadow: inset 0 0 0 1px var(--rule) }
.unans .lx .lad { font-weight: 500 }
.unans .dstat { font-style: italic }
.lacts .plink { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px }
.lacts .plink:hover { text-decoration-color: var(--accent) }
.arow .cell { padding-top: .9rem; padding-bottom: .4rem }
.adread .intro { color: var(--ink) }
.adbox { margin: .6rem 0 .2rem; padding: .8rem 1rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--bar);
  color: var(--ink); font: 400 var(--step-0)/1.55 var(--f-text) }
.adbox p { margin: 0 0 .3rem } .adbox p:last-child { margin-bottom: 0 }
.adbox .adname { font: 650 1.0625rem/1.3 var(--f-ui); letter-spacing: .01em; margin-bottom: .55rem }
/* Section B: the friend's objections, under the prompt */
.objs { margin-top: .75rem }
.olabel { font: 600 .6875rem/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: .35rem }
.objs ol { margin: 0; padding-left: 1.4rem; color: var(--ink) }
.objs li { margin: 0 0 .3rem; padding-left: .15rem }
.objs li::marker { color: var(--ink-soft); font-variant-numeric: tabular-nums }
.objs .osrc { display: inline-block; margin-left: .45rem; font: 500 .6875rem/1.4 var(--f-ui); color: var(--accent); background: var(--accent-soft);
  padding: 0 .35rem; border-radius: 4px; vertical-align: .08em; white-space: nowrap }
.objs .osrc.add { color: var(--ink-soft); background: transparent; box-shadow: inset 0 0 0 1px var(--rule) }
.objs li.hl .o { background: var(--mark); border-radius: 3px }
/* every prompt: write it in TEF Writer, the local app (icon and words in the Full view's header, icon only in the Lean row) */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden }
.tw { display: inline-flex; align-items: center; gap: .3rem; color: var(--ink-soft); text-decoration: none; font: 500 var(--step--1)/1.2 var(--f-ui); white-space: nowrap }
.tw .ico { flex: none; width: .95rem; height: .95rem }
.tw span { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px }
.tw:hover { color: var(--accent) } .tw:hover span { text-decoration-color: var(--accent) }
.acts .tw { margin-left: auto }
.lacts .tw { justify-content: center; width: 1.85rem; height: 1.85rem; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule) }
.lacts .tw:hover { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent) }
/* an answer written in TEF Writer and translated: no natural line (Natural shows the literal); a paragraph starts a block */
body[data-en="nat"] .tr .lit { display: block }
.para.tr.pstart .cell { padding-top: 1.15rem } .prow + .para.tr .cell { padding-top: .55rem }
/* under it, your earlier recorded answer of the same prompt: folded, its own deck and tick in reach */
.rechead .cell { margin-top: 1.4rem; padding-top: .9rem; border-top: 1px dashed var(--rule) }
.rx { display: inline-flex; align-items: center; gap: .45rem; margin: 0; padding: .1rem 0; border: 0; background: none; cursor: pointer;
  color: var(--ink-soft); font: 600 .6875rem/1.3 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; text-align: left }
.rx:hover { color: var(--accent) }
.rx .chev { width: .4rem; height: .4rem; border-color: currentColor }
.rec.open .rx .chev, .rec.found .rx .chev { transform: rotate(45deg) }
.rxfr { margin: .1rem 0 0; font: 600 .6875rem/1.3 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft) }
.rec:not(.open):not(.found) .recbody { display: none }
.rechead .acts { margin-top: .45rem }
.rec { scroll-margin-top: var(--barh, 7.5rem) }
@media (min-width: 761px) {
  body.lean .lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto }
  .lmeta { display: grid; grid-template-columns: 4.6rem 6.6rem 12.5rem; justify-items: start }
  .lacts { width: 13.75rem }   /* Open deck, Done and the TEF Writer pencil on one line */
}
@media (max-width: 760px) {
  body.lean .resp, .rec { scroll-margin-top: 1rem }
  .rechead .cell.fr { margin-top: 0; border-top: 0; padding-top: .35rem }
  body.lean .rbody { background: var(--panel-en) }
  .lmeta { gap: .3rem .6rem }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none } }

.s .dim { color: var(--ink-soft) }
.att { font: 600 var(--step--1)/1 var(--f-ui); color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
  border-radius: 999px; padding: .45rem .8rem; white-space: nowrap }
.att:hover { background: var(--accent-soft) }
.lacts { flex-wrap: wrap; row-gap: .45rem } .lacts .att { order: 1 }
.row.card[hidden], .mxn[hidden] { display: none }
.mxn { flex-basis: 100%; font: 600 var(--step--1)/1.35 var(--f-ui); color: var(--accent) }
.lmeta .mxn { display: block; margin-top: .2rem }

/* --- Attempts (2026-11-15): two French panels, what you said | the card; differences coloured by what they cost --- */
:root { --g4: #c5221f; --g4-bg: rgba(217, 48, 37, .16); --g3: #c25400; --g3-bg: rgba(240, 120, 20, .2);
  --g2: #8a6a00; --g2-bg: rgba(234, 190, 8, .3); --g1: #1a5fd1; --g1-bg: rgba(26, 115, 232, .13) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --g4: #ff7b70; --g4-bg: rgba(255, 107, 94, .24); --g3: #ffad5c; --g3-bg: rgba(255, 159, 67, .22);

<script type="application/json" id="off">{}</script>
<script>
(function () {
"use strict";
var KEY = "study::tef::writing::attempts" + "::view", OPEN_KEY = "study::tef::writing::attempts" + "::open";
var st = {show: "all", hes: true};
function getJ(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function setJ(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var saved = getJ(KEY, {}); for (var k in saved) if (k in st && typeof saved[k] === typeof st[k]) st[k] = saved[k];
function save() { setJ(KEY, st); }
var opened = getJ(OPEN_KEY, {});
var resps = [].slice.call(document.querySelectorAll(".resp"));
function barH() { document.body.style.setProperty("--barh", (document.querySelector("header.bar").offsetHeight + 8) + "px"); }
addEventListener("resize", barH);
// an attempt is an accordion: its one-line row opens and closes it; which ones are open is remembered
function setOpen(r, open, keep) {
  r.classList.toggle("open", open); r.querySelector(".lx").setAttribute("aria-expanded", String(open));
  if (!keep) { opened[r.id] = open ? 1 : 0; setJ(OPEN_KEY, opened); }
}
resps.forEach(function (r) { setOpen(r, !!opened[r.id], true); });
var MIN = {all: -9, diff: 1, serious: 3};
function apply() {
  var shown = 0;
  resps.forEach(function (r) {
    r.querySelectorAll(".row.card").forEach(function (x) { var ok = Number(x.dataset.w) >= MIN[st.show]; x.hidden = !ok; if (ok) shown++; });
  });
  document.body.classList.toggle("no-hes", !st.hes);
  document.getElementById("hes").checked = st.hes;
  document.querySelectorAll(".seg button[data-show]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.show === st.show)); });
  document.getElementById("count").textContent = resps.length + (resps.length === 1 ? " tentative" : " tentatives") + " · " + shown + " cartes";
  barH();
}
document.querySelectorAll(".seg button[data-show]").forEach(function (b) { b.addEventListener("click", function () { st.show = b.dataset.show; save(); apply(); }); });
document.querySelectorAll(".seg button[data-all]").forEach(function (b) { b.addEventListener("click", function () { resps.forEach(function (r) { setOpen(r, b.dataset.all === "open"); }); }); });
document.querySelectorAll(".seg button[data-go]").forEach(function (b) { b.addEventListener("click", function () { if (b.getAttribute("aria-pressed") !== "true") location.href = b.dataset.go; }); });
document.getElementById("hes").addEventListener("change", function (e) { st.hes = e.target.checked; save(); apply(); });
document.addEventListener("click", function (e) {
  var row = e.target.closest && e.target.closest(".lrow"); if (!row || e.target.closest("a, label, input")) return;
  setOpen(row.parentNode, !row.parentNode.classList.contains("open"));
});
// hovering a coloured difference lights up its pair on the other side
var lit = [];
document.addEventListener("mouseover", function (e) {
  var s = e.target.closest && e.target.closest("[data-d]");
  lit.forEach(function (x) { x.classList.remove("hl"); }); lit = [];
  if (s) lit = [].slice.call(document.querySelectorAll('[data-d="' + s.dataset.d + '"]'));
  lit.forEach(function (x) { x.classList.add("hl"); });
});
// a click on a coloured difference clears it on both sides (the speech-to-text's mistake, not yours); again puts it back.
// Kept here at once, on disk through marks_server.py when it runs (this laptop); the build bakes the disk copy in (BAKED).
var OFF_KEY = "study::tef::writing::off", URL_ = "http://127.0.0.1:8783/marks";
var BAKED = JSON.parse(document.getElementById("off").textContent);
var local = getJ(OFF_KEY, {}), disk = {}, off = {};
function merge() { off = Object.assign({}, BAKED, disk, local); }
function gOf(s) { var m = /\bg(\d)\b/.exec(s.className); return m ? Number(m[1]) : -1; }
function tally(r) {
  var n = {1: 0, 2: 0, 3: 0, 4: 0}, clean = 0, mx = 0, cleared = 0;
  r.querySelectorAll(".row.card").forEach(function (row) {
    var seen = {}, worst = -1;
    row.querySelectorAll(".dg[data-d]").forEach(function (s) {
      var id = s.dataset.d, g = gOf(s), o = off[id] === true && g > 0;
      s.classList.toggle("off", o);
      if (seen[id]) return; seen[id] = 1;
      if (o) { cleared++; return; }
      if (g > worst) worst = g;
      if (g > 0) n[g]++;
    });
    if (row.classList.contains("skip")) return;
    row.dataset.w = worst; if (worst > 0) { if (!row.classList.contains("gone")) mx++; } else clean++;
  });
  r.querySelectorAll(".cnt[data-g]").forEach(function (p) { var g = p.dataset.g; p.hidden = !n[g]; p.firstChild.nodeValue = n[g] + " " + p.firstChild.nodeValue.replace(/^\d+ /, ""); });
  r.querySelector(".dstat .cl").textContent = clean;
  var ox = r.querySelector(".dstat .ox"); ox.hidden = !cleared;
  ox.lastChild.nodeValue = cleared === 1 ? " retirée" : " retirées"; ox.querySelector(".on").textContent = cleared;
  r.querySelector(".fx .n").textContent = mx;
}
function repaint() { merge(); resps.forEach(tally); apply(); }
function sync(m) {
  try {
    fetch(URL_, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({marks: m})})
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (d) { if (d) { disk = d; repaint(); } })
      .catch(function () {});
  } catch (e) {}
}
document.addEventListener("click", function (e) {
  var s = e.target.closest && e.target.closest(".rbody .dg[data-d]"); if (!s || gOf(s) < 1) return;
  var id = s.dataset.d, v = off[id] !== true, m = {}; m[id] = v;
  local[id] = v; setJ(OFF_KEY, local); repaint(); sync(m);
});
function hash() { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; } }
function goTo() {
  var t = document.getElementById(hash()); if (!t) return;
  var r = t.closest(".resp"); if (t.hidden) { st.show = "all"; save(); apply(); }
  if (r) setOpen(r, true);
  t.scrollIntoView();
}
addEventListener("hashchange", goTo);
repaint(); sync(local);
if (hash()) { try { history.scrollRestoration = "manual"; } catch (e) {} goTo(); addEventListener("load", function () { barH(); goTo(); }); }
})();
</script>
