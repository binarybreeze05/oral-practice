<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'">
<title>Mood</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111827">
<style>
:root {
  --bg: #f6f7f9; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #e5e7eb;
  --m1: #15803d; --m2: #22c55e; --m3: #84cc16; --m4: #94a3b8; --m5: #f97316; --m6: #dc2626;
  --on-dark: #ffffff; --on-light: #111827;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f17; --fg: #f3f4f6; --muted: #9ca3af; --card: #151b26; --line: #263041;
    --m1: #16a34a; --m2: #22c55e; --m3: #a3e635; --m4: #64748b; --m5: #fb923c; --m6: #ef4444;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f17; --fg: #f3f4f6; --muted: #9ca3af; --card: #151b26; --line: #263041;
  --m1: #16a34a; --m2: #22c55e; --m3: #a3e635; --m4: #64748b; --m5: #fb923c; --m6: #ef4444;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
  padding: max(16px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; }
.sub { color: var(--muted); font-size: 14px; }
.view { display: none; flex: 1; flex-direction: column; }
.view.on { display: flex; }

/* picker */
.moods { flex: 1; display: grid; grid-template-rows: repeat(6, minmax(64px, 1fr)); gap: 10px; }
.mood {
  border: 0; border-radius: 16px; padding: 0 20px; display: flex; align-items: center; gap: 16px;
  font: inherit; font-size: 22px; font-weight: 600; cursor: pointer; text-align: left;
  background: var(--c); color: var(--t); transition: transform .08s, filter .15s;
}
.mood:active { transform: scale(.97); }
.mood:hover { filter: brightness(1.06); }
.mood .n { font-size: 15px; opacity: .75; width: 18px; font-variant-numeric: tabular-nums; }

/* confirmation */
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.done .dot { width: 96px; height: 96px; border-radius: 50%; background: var(--c); }
.done .big { font-size: 30px; font-weight: 650; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button.plain {
  font: inherit; font-size: 15px; padding: 10px 16px; border-radius: 10px; cursor: pointer;
  background: var(--card); color: var(--fg); border: 1px solid var(--line);
}
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* history */
.summary { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); margin: 4px 0 8px; }
.summary span { background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.days { flex: 1; overflow-y: auto; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.day h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; }
.day h3 span { color: var(--muted); font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 8px; border-radius: 999px; background: var(--c); color: var(--t); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; margin-top: 40px; }

/* settings */
label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
input[type=text], input[type=url] {
  width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
}
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
#qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin-top: 8px; }
#qr img, #qr canvas { display: block; width: 200px; height: 200px; }
.section { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }

nav { display: flex; justify-content: center; gap: 22px; margin-top: 14px; font-size: 14px; }
nav a { color: var(--muted); text-decoration: none; padding: 6px 2px; }
nav a.on { color: var(--fg); font-weight: 600; }
.status { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
.status.warn { color: var(--m5); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">How are you?</h1>
    <div class="sub" id="last"></div>
  </header>

  <section class="view on" id="v-pick">
    <div class="moods" id="moods"></div>
  </section>

  <section class="view" id="v-done">
    <div class="done">
      <div class="dot" id="done-dot"></div>
      <div class="big" id="done-label"></div>
      <div class="sub" id="done-time"></div>
      <div class="btnrow">
        <button class="plain" id="undo">Undo</button>
        <button class="plain primary" id="again">Log another</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-hist">
    <div class="sub" id="sum-title">Last 7 days</div>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <div class="days" id="days"></div>
  </section>

  <section class="view" id="v-set">
    <label for="url">Google Sheet web app URL</label>
    <input type="url" id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false">
    <p class="note">From Apps Script: Deploy &gt; Manage deployments &gt; Web app URL. Stored only on this device.</p>
    <label for="device">Device name</label>
    <input type="text" id="device" autocomplete="off">
    <div class="btnrow" style="justify-content:flex-start;margin-top:14px">
      <button class="plain primary" id="save">Save</button>
      <button class="plain" id="sync">Sync now</button>
      <button class="plain" id="csv">Export CSV</button>
    </div>
    <div class="section" id="qr-wrap" hidden>
      <div style="font-weight:600;font-size:14px">Set up your phone</div>
      <p class="note">Scan with the phone camera. It opens this page with the Sheet URL already filled in.</p>
      <div id="qr"></div>
    </div>
  </section>

  <nav>
    <a href="#" data-v="pick" class="on">Log</a>
    <a href="#" data-v="hist">History</a>
    <a href="#" data-v="set">Settings</a>
  </nav>
  <div class="status" id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const MOODS = [
  null,
  {n: 1, label: 'Unstoppable', c: '--m1', t: '--on-dark'},
  {n: 2, label: 'Thriving',    c: '--m2', t: '--on-light'},
  {n: 3, label: 'Good',        c: '--m3', t: '--on-light'},
  {n: 4, label: 'Flat',        c: '--m4', t: '--on-light'},
  {n: 5, label: 'Drained',     c: '--m5', t: '--on-light'},
  {n: 6, label: 'Miserable',   c: '--m6', t: '--on-dark'},
];
const $ = id => document.getElementById(id);
const cvar = m => `--c:var(${m.c});--t:var(${m.t})`;

// storage
const KEY = k => 'mood::' + k;
function load(k, d) { try { const v = localStorage.getItem(KEY(k)); return v == null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch {} }

let url = load('url', '');
let device = load('device', /Android/i.test(navigator.userAgent) ? 'Phone' : 'Mac');
let queue = load('queue', []);     // entries not yet confirmed by the Sheet
let dels = load('dels', []);       // ids to delete on the Sheet
let cache = load('cache', []);     // last known history (server + queued)
let lastEntry = null;

// one-time setup link: #setup=<web app url>
function applySetup() {
  const m = location.hash.match(/^#setup=(.+)$/);
  if (!m) return false;
  url = decodeURIComponent(m[1]);
  save('url', url);
  history.replaceState(null, '', location.pathname);
  return true;
}
applySetup();
window.addEventListener('hashchange', () => { if (applySetup()) sync({pull: true}); });

function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
}
function fmtTime(d) { return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}); }
function ago(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}

// views
let view = 'pick', hiddenAt = 0;
function show(v) {
  view = v;
  for (const s of document.querySelectorAll('.view')) s.classList.toggle('on', s.id === 'v-' + v);
  for (const a of document.querySelectorAll('nav a')) a.classList.toggle('on', a.dataset.v === (v === 'done' ? 'pick' : v));
  $('title').textContent = {pick: 'How are you?', done: 'Logged', hist: 'History', set: 'Settings'}[v];
  if (v === 'hist') renderHistory();
  if (v === 'set') renderSettings();
  renderLast();
}
for (const a of document.querySelectorAll('nav a')) {
  a.onclick = e => { e.preventDefault(); show(a.dataset.v); };
}

function renderLast() {
  const latest = [...cache].sort((a, b) => b.ts.localeCompare(a.ts))[0];
  $('last').textContent = latest && view === 'pick' ? `Last: ${MOODS[latest.mood].label}, ${ago(latest.ts)}` : '';
}

function setStatus(text, warn) {
  $('status').textContent = text;
  $('status').classList.toggle('warn', !!warn);
}
function pendingStatus() {
  if (!url) return setStatus('Not connected to a Sheet yet. Open Settings.', true);
  const n = queue.length + dels.length;
  setStatus(n ? `${n} change${n > 1 ? 's' : ''} waiting to sync` : 'Synced', n > 0);
}

// picker
$('moods').innerHTML = MOODS.slice(1).map(m =>
  `<button class="mood" data-n="${m.n}" style="${cvar(m)}"><span class="n">${m.n}</span>${m.label}</button>`).join('');
for (const b of document.querySelectorAll('.mood')) b.onclick = () => log(Number(b.dataset.n));
document.addEventListener('keydown', e => {
  if (view === 'pick' && e.key >= '1' && e.key <= '6' && !e.target.matches('input')) log(Number(e.key));
});

function log(n) {
  const entry = {id: uid(), ts: new Date().toISOString(), mood: n, device};
  lastEntry = entry;
  queue.push(entry); save('queue', queue);
  cache.push(entry); save('cache', cache);
  const md = MOODS[n];
  $('done-dot').style.cssText = cvar(md);
  $('done-label').textContent = md.label;
  $('done-time').textContent = fmtTime(new Date(entry.ts));
  show('done');
  sync();
}

$('undo').onclick = () => {
  if (!lastEntry) return show('pick');
  const id = lastEntry.id;
  const queued = queue.some(x => x.id === id);
  queue = queue.filter(x => x.id !== id); save('queue', queue);
  cache = cache.filter(x => x.id !== id); save('cache', cache);
  if (!queued) { dels.push(id); save('dels', dels); }
  lastEntry = null;
  show('pick');
  sync();
};
$('again').onclick = () => show('pick');

// sync with the Apps Script web app
let syncing = null;
async function sync({pull = false} = {}) {
  if (!url) return pendingStatus();
  if (syncing) return syncing;
  syncing = (async () => {
    try {
      if (queue.length || dels.length) {
        const sending = queue.slice(), sendingDels = dels.slice();
        const r = await fetch(url, {
          method: 'POST', keepalive: true,
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({entries: sending, deletes: sendingDels}),
        });
        const res = await r.json();
        if (!res.ok) throw new Error('Sheet rejected the request');
        const ok = new Set(res.saved);
        queue = queue.filter(x => !ok.has(x.id)); save('queue', queue);
        dels = dels.filter(id => !sendingDels.includes(id)); save('dels', dels);
      }
      if (pull) {
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'days=60');
        const res = await r.json();
        if (res.ok) {
          const qIds = new Set(queue.map(x => x.id));
          cache = res.entries.filter(x => !qIds.has(x.id) && !dels.includes(x.id)).concat(queue);
          save('cache', cache);
          if (view === 'hist') renderHistory();
          renderLast();
        }
      }
      pendingStatus();
    } catch (err) {
      const n = queue.length + dels.length;
      setStatus(n ? `Offline: ${n} change${n > 1 ? 's' : ''} saved here, will sync later` : 'Could not reach the Sheet', true);
    } finally {
      syncing = null;
    }
  })();
  return syncing;
}

// history
function renderHistory() {
  const now = Date.now();
  const week = cache.filter(x => now - new Date(x.ts) < 7 * 864e5);
  const counts = [0, 0, 0, 0, 0, 0, 0];
  for (const x of week) counts[x.mood]++;
  $('sum-title').textContent = `Last 7 days · ${week.length} check-in${week.length === 1 ? '' : 's'}`;
  $('summary').innerHTML = week.length ? MOODS.slice(1).map(m =>
    counts[m.n] ? `<span style="${cvar(m)};flex:${counts[m.n]}" title="${m.label}: ${counts[m.n]}"></span>` : '').join('') : '';
  $('legend').innerHTML = MOODS.slice(1).map(m =>
    `<span><i style="${cvar(m)}"></i>${m.label} ${counts[m.n]}</span>`).join('');

  const byDay = new Map();
  for (const x of [...cache].sort((a, b) => b.ts.localeCompare(a.ts))) {
    const d = new Date(x.ts);
    const key = d.toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'});
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(x);
  }
  if (!byDay.size) { $('days').innerHTML = '<p class="empty">No check-ins yet.</p>'; return; }
  $('days').innerHTML = [...byDay].map(([day, xs]) => {
    const avg = xs.reduce((s, x) => s + x.mood, 0) / xs.length;
    const chips = xs.slice().reverse().map(x => {
      const m = MOODS[x.mood];
      return `<span class="chip" style="${cvar(m)}" title="${m.label} · ${x.device || ''}">${fmtTime(new Date(x.ts))} ${m.label}</span>`;
    }).join('');
    return `<div class="day"><h3>${day}<span>${xs.length} · avg ${avg.toFixed(1)}</span></h3><div class="chips">${chips}</div></div>`;
  }).join('');
}

// settings
function renderSettings() {
  $('url').value = url;
  $('device').value = device;
  const wrap = $('qr-wrap');
  wrap.hidden = !url || !window.QRCode;
  if (!wrap.hidden) {
    $('qr').innerHTML = '';
    new QRCode($('qr'), {text: location.origin + location.pathname + '#setup=' + encodeURIComponent(url), width: 400, height: 400, correctLevel: QRCode.CorrectLevel.L});
  }
}
$('save').onclick = () => {
  const u = $('url').value.trim();
  if (u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) {
    return setStatus('That does not look like an Apps Script web app URL', true);
  }
  url = u; save('url', url);
  device = $('device').value.trim() || device; save('device', device);
  renderSettings();
  setStatus('Saved');
  sync({pull: true});
};
$('sync').onclick = () => { setStatus('Syncing…'); sync({pull: true}); };
$('csv').onclick = () => {
  const rows = [['time', 'mood', 'label', 'device']].concat(
    [...cache].sort((a, b) => a.ts.localeCompare(b.ts)).map(x => [x.ts, x.mood, MOODS[x.mood].label, x.device || '']));
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `moods-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

// every time the app comes back (phone unlock), return to the picker
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); sync(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 20000 && view !== 'set') show('pick');
  sync({pull: true});
});
window.addEventListener('online', () => sync());

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
show('pick');
pendingStatus();
sync({pull: true});
</script>
</body>
</html>
